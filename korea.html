<title>한눈에 보는 한국사 — 가로 연대기</title>
<style>
:root{
  --bg:#F5F7F8; --panel:#EDF0F2; --ink:#232A33; --ink2:#5A6675; --ink3:#8B96A3;
  --hair:#D9E0E5; --grid:rgba(35,42,51,.08); --gridMajor:rgba(35,42,51,.20);
  --accent:#3A5FBF;
  --c0:#3A5FBF; --c1:#C0392B; --c2:#1F8A70; --c3:#8455A8; --c4:#9C7100;
  --span1:rgba(58,95,191,.08); --span2:rgba(58,95,191,.15);
  --rail:rgba(243,246,247,.94); --tipbg:#FFFFFF; --shadow:0 8px 28px rgba(20,30,50,.16);
  --erashade:rgba(58,95,191,.035);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161A22; --panel:#1C212C; --ink:#E4E9F0; --ink2:#98A3B3; --ink3:#6B7686;
    --hair:#2A3140; --grid:rgba(228,233,240,.07); --gridMajor:rgba(228,233,240,.20);
    --accent:#6B8FE6;
    --c0:#6B8FE6; --c1:#D2604F; --c2:#279B8F; --c3:#A57FD0; --c4:#B08A2E;
    --span1:rgba(107,143,230,.10); --span2:rgba(107,143,230,.20);
    --rail:rgba(23,28,38,.94); --tipbg:#20262F; --shadow:0 10px 30px rgba(0,0,0,.5);
    --erashade:rgba(107,143,230,.05);
  }
}
:root[data-theme="dark"]{
  --bg:#161A22; --panel:#1C212C; --ink:#E4E9F0; --ink2:#98A3B3; --ink3:#6B7686;
  --hair:#2A3140; --grid:rgba(228,233,240,.07); --gridMajor:rgba(228,233,240,.20);
  --accent:#6B8FE6;
  --c0:#6B8FE6; --c1:#D2604F; --c2:#279B8F; --c3:#A57FD0; --c4:#B08A2E;
  --span1:rgba(107,143,230,.10); --span2:rgba(107,143,230,.20);
  --rail:rgba(23,28,38,.94); --tipbg:#20262F; --shadow:0 10px 30px rgba(0,0,0,.5);
  --erashade:rgba(107,143,230,.05);
}
:root[data-theme="light"]{
  --bg:#F5F7F8; --panel:#EDF0F2; --ink:#232A33; --ink2:#5A6675; --ink3:#8B96A3;
  --hair:#D9E0E5; --grid:rgba(35,42,51,.08); --gridMajor:rgba(35,42,51,.20);
  --accent:#3A5FBF;
  --c0:#3A5FBF; --c1:#C0392B; --c2:#1F8A70; --c3:#8455A8; --c4:#9C7100;
  --span1:rgba(58,95,191,.08); --span2:rgba(58,95,191,.15);
  --rail:rgba(243,246,247,.94); --tipbg:#FFFFFF; --shadow:0 8px 28px rgba(20,30,50,.16);
  --erashade:rgba(58,95,191,.035);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif;
  font-size:14px; line-height:1.5;
}
.serif{font-family:'Nanum Myeongjo','Noto Serif KR','AppleMyungjo','Songti SC',serif}

/* ── header ── */
header{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  padding:12px 20px 10px; border-bottom:1px solid var(--hair); background:var(--bg);
}
h1{font:700 21px/1.2 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif; margin:0; letter-spacing:.5px; text-wrap:balance}
.subtitle{font-size:11.5px; color:var(--ink2); margin-top:2px}
.headL{min-width:200px}
.legend{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  border:1px solid var(--hair); border-radius:999px; padding:3.5px 11px 3.5px 8px;
  font-size:12px; color:var(--ink2); background:transparent; user-select:none;
  transition:opacity .15s, border-color .15s;
}
.chip .dot{width:9px; height:9px; border-radius:50%}
.chip.on{color:var(--ink); border-color:var(--ink3)}
.chip.off{opacity:.38}
.eranav{display:flex; gap:4px; align-items:center; margin-left:auto}
.eranav button{
  font:inherit; font-size:12px; color:var(--ink2); background:var(--panel);
  border:1px solid var(--hair); border-radius:6px; padding:4px 10px; cursor:pointer;
}
.eranav button:hover{color:var(--ink); border-color:var(--ink3)}
.eranav button:focus-visible, .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.zoomctl{display:flex; align-items:center; gap:2px}
.zoomctl button{
  font:inherit; font-size:15px; line-height:1; width:26px; height:26px; border-radius:6px;
  color:var(--ink2); background:var(--panel); border:1px solid var(--hair); cursor:pointer;
}
.zoomctl button:hover:not(:disabled){color:var(--ink); border-color:var(--ink3)}
.zoomctl button:disabled{opacity:.35; cursor:default}
.zoomctl button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#zval{min-width:42px; text-align:center; font-size:11.5px; color:var(--ink2); font-variant-numeric:tabular-nums}
#readout{
  min-width:118px; text-align:right; font-variant-numeric:tabular-nums;
  font-size:12px; color:var(--ink2); line-height:1.3;
}
#readout b{display:block; font-size:15px; color:var(--accent); font-weight:700}

/* ── scroll stage ── */
#viewport{position:relative; overflow:auto; height:calc(100dvh - 67px); cursor:grab}
#viewport.dragging{cursor:grabbing; user-select:none}
#canvas{position:relative}

.gridline{position:absolute; top:0; bottom:0; width:1px; background:var(--grid); pointer-events:none}
.gridline.major{background:var(--gridMajor)}
.erashadeCol{position:absolute; top:0; bottom:0; background:var(--erashade); pointer-events:none}

/* axis */
#axis{
  position:sticky; top:0; z-index:40; height:58px;
  background:var(--bg); border-bottom:1px solid var(--hair);
}
.eraband{
  position:absolute; top:0; height:21px; border-left:1px solid var(--gridMajor);
  font:italic 600 11px/21px 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif;
  color:var(--accent); letter-spacing:2px; white-space:nowrap; overflow:clip;
}
/* 시대명은 JS(updateStickyLabels)가 화면 안쪽으로 밀어 넣는다.
   부모가 sticky/absolute라 CSS position:sticky는 이 문맥에서 동작하지 않는다. */
.eraband i{font-style:inherit; display:inline-block; padding-left:8px; will-change:transform}
.tick{position:absolute; top:21px; height:37px; border-left:1px solid var(--grid)}
.tick.major{border-left-color:var(--gridMajor)}
.tick span{
  position:absolute; top:8px; left:5px; font-size:10.5px; color:var(--ink3);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.tick.major span{color:var(--ink2); font-weight:600}

/* region header */
.regionhead{position:relative; height:30px; background:var(--panel); border-bottom:1px solid var(--hair)}
.regionhead .rl{
  position:sticky; left:0; display:inline-flex; align-items:center; height:100%;
  padding:0 16px; font-size:10.5px; font-weight:700; letter-spacing:3px; color:var(--ink3);
}

/* country rows */
.row{position:relative; height:134px; border-bottom:1px solid var(--hair)}
.rowlabel{
  position:sticky; left:0; z-index:30; float:left; width:152px; height:100%;
  display:flex; flex-direction:column; justify-content:center; padding:0 14px;
  background:var(--rail); backdrop-filter:blur(5px); border-right:1px solid var(--hair);
}
.rowlabel b{font:700 16px/1.25 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif; letter-spacing:1px}
.rowlabel small{font-size:10px; color:var(--ink3); letter-spacing:1.5px; margin-top:2px}
.baseline{position:absolute; left:0; right:0; top:75px; height:1px; background:var(--grid); pointer-events:none}

.span{
  position:absolute; top:6px; height:20px; border-radius:4px; background:var(--span1);
  font-size:10.5px; line-height:20px; color:var(--ink2); padding:0 7px;
  white-space:nowrap; pointer-events:none; overflow:clip;
}
.span.alt{background:var(--span2)}
/* 왕조명도 JS가 화면 안쪽으로 밀어 넣는다 (위 .eraband i와 같은 이유) */
.span i{font-style:normal; display:inline-block; will-change:transform}
.span.pre{background:transparent; border:1px dashed var(--hair); color:var(--ink3); line-height:18px}

.ev{position:absolute; z-index:5; transition:opacity .15s}
@media (prefers-reduced-motion: reduce){.ev{transition:none}}
.ev .dot{
  position:absolute; width:9px; height:9px; border-radius:50%;
  left:-4.5px; top:70.5px; box-shadow:0 0 0 2px var(--bg); transition:transform .12s;
}
.ev .lbl{
  position:absolute; left:-2px; font-size:11px; white-space:nowrap; color:var(--ink);
  padding:1px 4px 1px 3px; line-height:1.25; border-radius:3px; cursor:default;
  transition:opacity .12s linear;
}
.ev .conn{position:absolute; left:-.5px; width:1px; background:var(--grid); pointer-events:none}
.ev:hover, .ev.sel, .ev:focus-visible{z-index:20}
.ev:hover .dot, .ev.sel .dot, .ev:focus-visible .dot{transform:scale(1.7)}
.ev:hover .lbl, .ev.sel .lbl, .ev:focus-visible .lbl{
  background:var(--tipbg); box-shadow:var(--shadow); color:var(--ink); font-weight:700;
}
.ev:focus{outline:none}
.ev:focus-visible .lbl{outline:2px solid var(--accent); outline-offset:1px}
.ev.dim{opacity:.14; pointer-events:none}
.ev.dim .lbl{visibility:hidden}
/* 왼쪽 국가명 레일에 가려지는 라벨은 감춰 글자가 잘려 보이지 않게 함.
   hover/sel 규칙보다 뒤에 두어 그 위에서도 확실히 적용되도록 한다. */
.ev.behind .lbl, .ev.behind:hover .lbl, .ev.behind.sel .lbl{
  opacity:0; pointer-events:none; box-shadow:none; background:transparent;
}
.ev.behind .conn{opacity:0}
@media (prefers-reduced-motion: reduce){
  .ev .dot{transition:none}
  #viewport{scroll-behavior:auto !important}
}

/* ── 사건 간 관계 표시 ── */
#relsvg{position:absolute; left:0; top:0; width:100%; height:100%; z-index:12; pointer-events:none}
/* 관계가 있는 사건: 점 둘레에 옅은 링 */
.ev.hasrel .dot{box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px color-mix(in srgb, var(--accent) 38%, transparent)}
/* 관계 모드: 선택·연관 사건만 남기고 나머지는 가라앉힘 */
.relmode .ev:not(.rel):not(.sel){opacity:.15}
.relmode .span{opacity:.45}
.relmode .ev.rel, .relmode .ev.sel{z-index:19}
.ev.rel .dot{transform:scale(1.5)}
.ev.rel .lbl{background:var(--tipbg); box-shadow:var(--shadow); color:var(--ink); font-weight:700}

/* tooltip */
#tip{
  position:fixed; z-index:99; max-width:350px; pointer-events:none; display:none;
  background:var(--tipbg); border:1px solid var(--hair); border-radius:8px;
  padding:10px 13px; box-shadow:var(--shadow);
}
#tip .ty{font-size:11.5px; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.5px}
#tip .tt{
  font:700 14.5px/1.35 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif; margin:3px 0 5px;
  white-space:normal; overflow-wrap:break-word;
}
#tip .td{
  font-size:12px; color:var(--ink2); line-height:1.55;
  white-space:normal; overflow-wrap:break-word; word-break:keep-all;
}
#tip .tc{display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-size:10.5px; color:var(--ink3)}
#tip .tc i{width:8px; height:8px; border-radius:50%; display:inline-block}
#tip .rlhint{margin-top:7px; font-size:10.5px; color:var(--accent)}
/* ── 사건 이미지: 자리를 미리 잡아 툴팁이 튀지 않게 하고, 실패하면 통째로 접음 ── */
#tip .tim{
  margin:7px 0 0; height:140px; border-radius:6px; overflow:hidden;
  background:linear-gradient(100deg,var(--panel) 30%,var(--hair) 50%,var(--panel) 70%);
  background-size:220% 100%; animation:timshim 1.1s linear infinite;
}
#tip .tim img{width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .25s}
#tip .tim.fit img{object-fit:contain}   /* 저해상도 원본은 확대 대신 여백을 둠 */
#tip .tim.on{animation:none; background:var(--panel)}
#tip .tim.on img{opacity:1}
#tip .tim.off, #tip .tim.off + .tsrc{display:none}
#tip .tsrc{display:block; font-size:9.5px; color:var(--ink3); margin-top:3px; text-align:right; text-decoration:none}
/* 시트는 화면 폭을 다 쓰므로 이미지는 배너가 되지 않게 도판 크기로 묶어둠 */
#tip.sheet .tim{height:200px; max-width:440px}
#tip.sheet .tsrc{max-width:440px}
@keyframes timshim{to{background-position:-120% 0}}
@media (prefers-reduced-motion: reduce){#tip .tim{animation:none} #tip .tim img{transition:none}}
/* 연관 사건 목록 */
#tip .rl2{margin-top:10px; padding-top:8px; border-top:1px solid var(--hair)}
#tip .rl2>b{display:block; font-size:10.5px; color:var(--ink3); letter-spacing:1.5px; margin-bottom:4px}
.relchip{
  display:block; width:100%; text-align:left; font:inherit; background:transparent;
  border:0; border-radius:6px; padding:5px 6px; cursor:pointer;
}
.relchip:hover{background:var(--panel)}
.relchip:focus-visible{outline:2px solid var(--accent); outline-offset:-1px}
.relchip .rc1{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink2)}
.relchip .rc1 i{width:7px; height:7px; border-radius:50%; flex:none}
.relchip .rc1 b{color:var(--ink); font-weight:600}
.relchip .rc1 em{font-style:normal; margin-left:auto; font-size:10px; color:var(--accent); white-space:nowrap; flex:none}
.relchip .rc2{display:block; font-size:10.5px; color:var(--ink3); margin:1px 0 0 12px; line-height:1.4}
/* 터치 기기: 화면 하단에 고정된 시트로 표시해 항상 화면 안에 보이게 함 */
#tip.sheet{
  left:0; right:0; bottom:0; top:auto; max-width:none; width:auto;
  border-radius:14px 14px 0 0; border-width:1px 0 0; padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  animation:sheetin .18s ease-out;
  max-height:52dvh; overflow-y:auto; pointer-events:auto;
}
#tip.sheet .td{font-size:13px}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){#tip.sheet{animation:none}}

#hint{
  position:fixed; right:14px; bottom:12px; z-index:50; font-size:11px; color:var(--ink3);
  background:var(--rail); border:1px solid var(--hair); border-radius:999px;
  padding:5px 13px; backdrop-filter:blur(5px); pointer-events:none;
}
@media (max-width:720px){
  header{gap:10px; padding:10px 14px 8px}
  .eranav{margin-left:0}
  #readout{display:none}
  #viewport{height:calc(100dvh - 110px)}
  #hint{display:none}
}
</style>

<header>
  <div class="headL">
    <h1>한눈에 보는 한국사</h1>
    <div class="subtitle">고조선부터 현재까지 · 기원전 3000년 – 현재</div>
  </div>
  <div class="legend" id="legend" role="group" aria-label="사건 분류 필터"></div>
  <nav class="eranav" id="eranav" aria-label="시대 이동"></nav>
  <div class="zoomctl" role="group" aria-label="가로축 확대/축소">
    <button id="zout" type="button" aria-label="축소" disabled>−</button>
    <span id="zval">100%</span>
    <button id="zin" type="button" aria-label="확대">+</button>
  </div>
  <div id="readout"><b>기원전 3000</b><span>고대</span></div>
</header>

<div id="viewport" tabindex="0" aria-label="연대기 스크롤 영역">
  <div id="canvas"></div>
</div>
<div id="tip" role="tooltip"></div>
<div id="hint">드래그·Shift+휠 이동 · Ctrl+휠/± 확대 · 사건 오버/클릭: 상세·연관 관계 · 범례 필터</div>

<script>
/* ───────── time scale: piecewise linear (px per year) ───────── */
const SEGS=[[-3000,-1000,.10],[-1000,-100,.45],[-100,300,1.2],[300,700,4.0],[700,918,2.0],[918,1392,3.4],[1392,1700,6.5],[1700,1876,7.0],[1876,1945,26],[1945,2000,18],[2000,2030,34]];
const RAIL=152, PAD=36, BASE=75;   /* BASE: 행 안에서 사건 점이 놓이는 기준선 y좌표 */

/* 확대 배율: 사건이 촘촘한 구간을 넓혀 보기 위한 가로축 스케일 */
const ZOOMS=[1,1.6,2.5,4,8];
let zi=0, Z=ZOOMS[0];
/* 연도 → x좌표. 배율 Z가 곱해지며, 레일·여백은 배율과 무관하게 고정 */
function X(y){let x=0;for(const[a,b,k]of SEGS){if(y<=a)break;x+=(Math.min(y,b)-a)*k}return x*Z+RAIL+PAD}
function invX(px){let x=(px-RAIL-PAD)/Z;for(const[a,b,k]of SEGS){const w=(b-a)*k;if(x<=w)return a+x/k;x-=w}return 2030}
const totalW=()=>X(2030)+140;

const CATS=[
 {n:'건국·왕조', v:'--c0'},
 {n:'전쟁·항쟁', v:'--c1'},
 {n:'정치·제도', v:'--c2'},
 {n:'사상·문화', v:'--c3'},
 {n:'경제·과학', v:'--c4'},
];
const ERAS=[[-3000,'선사'],[-2333,'고대'],[918,'중세'],[1392,'근세'],[1876,'근대'],[1945,'현대']];
const ERAEND=2030;

/* ───────── data: spans = [시작, 끝, 이름], events = [연도, 분류, 제목, 설명] ───────── */
const REGIONS=[
{name:'고조선 과 삼국', rows:[
{name:'고조선·초기국가', sub:'GOJOSEON · EARLY STATES',
 spans:[[-3000,-1500,'신석기 (선사)',1],[-1500,-194,'고조선'],[-194,-108,'위만조선'],[-108,313,'낙랑군과 여러 나라']],
 events:[
 [-2333,0,'고조선 건국 (단군 전승)','『삼국유사』가 전하는 단군왕검의 건국 기년으로, 하늘(환웅)과 땅(웅녀)의 결합이라는 건국신화는 농경 사회의 제정일치 관념을 담고 있음. 학계는 비파형 동검과 미송리식 토기가 퍼진 요령~한반도 서북부에서 기원전 8~4세기에 국가로 성장했다고 봄.'],
 [-1500,4,'청동기와 농경 사회','벼농사가 본격화되고 반달돌칼·민무늬토기가 쓰이며 잉여 생산이 생김. 고인돌과 돌널무덤에 청동 거울·검을 함께 묻은 무덤이 나타나 계급 분화와 군장(君長)의 등장을 보여주며, 한반도의 고인돌은 4만 기 이상으로 세계 최대 밀집 지역임.'],
 [-400,2,'8조법과 사회 질서','한서 지리지에 전하는 고조선의 법 여덟 조항 가운데 세 개가 남아 있어, 살인은 사형, 상해는 곡물 배상, 도둑질은 노비로 삼는다고 규정. 생명·노동력·사유재산을 보호하는 계급 사회이자 노비가 존재했음을 알려주는 가장 오래된 성문 규범.'],
 [-300,1,'연(燕)과의 대결','고조선이 요서를 놓고 연과 겨루다 장수 진개의 공격으로 서방 2천여 리를 잃고 중심이 대동강 유역으로 옮겨진 것으로 추정됨. 이 무렵 부왕·준왕처럼 왕위가 부자 상속되고 상·대부·장군 등의 관직이 있어 상당한 국가 조직을 갖춤.'],
 [-194,0,'위만조선','진·한 교체기의 혼란을 피해 무리 1천여 명과 함께 망명한 위만이 준왕을 몰아내고 왕이 됨. 철기 문화를 본격 수용하고 한과 남방 진국 사이의 중계무역을 독점해 번영했으며, 준왕은 남쪽으로 내려가 한(韓)의 왕이 되었다고 전함.'],
 [-108,1,'고조선 멸망과 한군현','우거왕이 한 무제의 육·해군 5만여 명을 맞아 1년여를 항전했으나 지배층의 내분 끝에 왕검성이 함락됨. 한은 낙랑·진번·임둔·현도의 4군을 두었고, 낙랑군은 313년 고구려에 축출될 때까지 400년간 남아 중국 문물의 창구가 됨.'],
 [-100,0,'부여','쑹화강 유역 평야에서 일어나 5부족 연맹으로 왕과 마가·우가·저가·구가의 대가들이 통치. 12월의 영고(迎鼓) 제천행사와 순장·형사취수제 풍습이 있었고, 왕이 죽으면 옥갑에 넣어 장사했음. 고구려와 백제가 모두 부여에서 나왔다고 자처함.'],
 [-75,1,'현도군의 축출','고구려계 세력의 저항으로 현도군이 요동 방면으로 밀려남 — 한의 군현 지배가 압록강 중류에서 일찍 후퇴했음을 보여줌. 이 지역의 여러 나(那) 집단이 결집하며 고구려 건국의 토대가 마련됨.'],
 [-18,2,'삼한의 성립','한강 이남에 마한 54국, 진한 12국, 변한 12국의 소국 연맹이 형성되고 목지국의 진왕이 마한을 대표. 5월 수릿날과 10월 계절제로 하늘에 제사하고, 정치를 맡은 군장과 제사를 맡은 천군이 나뉘어 소도(蘇塗)라는 신성 구역을 둠.'],
 [24,3,'옥저와 동예','함경도·강원 해안의 소국들로 왕 없이 읍군·삼로가 다스림. 옥저는 민며느리제와 가족 공동 무덤(골장제), 동예는 무천(舞天) 제천행사와 책화(責禍)라는 경계 침범 배상 관습을 남겼으며, 단궁·과하마·반어피를 특산으로 삼음.'],
 [246,1,'기리영 전투','위가 낙랑·대방을 통해 진한 8국을 떼어가려 하자 신분고국 등 한(韓) 세력이 대방군의 기리영을 먼저 공격하고, 정벌에 나선 대방태수 궁준이 전사함. 삼한 소국들이 중국 군현과 직접 겨룰 만큼 성장했음을 보여주며, 이 격변 속에서 백제 고이왕이 마한의 주도권을 잡아감.'],
 [313,1,'낙랑군 축출','고구려 미천왕이 낙랑군을, 이어 대방군을 무너뜨려 400여 년간 이어진 중국 군현 지배가 한반도에서 완전히 사라짐. 한반도가 처음으로 고구려·백제·신라의 자체 질서로 재편되며 본격적인 삼국 시대가 열림.'],
]},
{name:'고구려', sub:'GOGURYEO',
 spans:[[-37,3,'졸본'],[3,427,'국내성'],[427,668,'평양']],
 events:[
 [-37,0,'고구려 건국','부여에서 남하한 주몽이 압록강 지류 졸본에 나라를 세웠다는 『삼국사기』 기년. 알에서 태어나 활을 잘 쏘았다는 건국신화가 광개토대왕릉비와 「모두루묘지」에도 새겨져, 천손(天孫) 의식이 왕권의 근거였음을 보여줌.'],
 [3,0,'국내성 천도','유리왕이 압록강 중류의 국내성(집안)으로 도읍을 옮겨 이후 424년간 중심지로 삼음. 산성(환도성)과 평지성을 짝지어 운영하는 고구려 특유의 도성 체제가 자리 잡고, 험한 산지 지형이 훗날 수·당의 대군을 막아내는 바탕이 됨.'],
 [56,1,'태조대왕의 정복','옥저를 정복하고 동예를 복속시켜 동해안으로 진출하며 5부 연맹을 왕 중심으로 재편. 척박한 산간 지대의 식량 부족을 정복과 공납으로 메우는 팽창 지향의 국가 성격이 이때 굳어짐.'],
 [194,4,'진대법 시행','고국천왕이 봄에 관곡을 빌려주고 가을에 갚게 하는 구휼 제도를 실시 — 기록으로 확인되는 한국 최초의 빈민 구제책. 몰락하는 농민이 귀족의 노비가 되는 것을 막아 국가의 조세·병역 기반을 지키려는 목적이었음.'],
 [313,1,'낙랑 축출과 서방 진출','미천왕이 낙랑·대방군을 무너뜨려 대동강 유역을 차지하고 요동으로 눈을 돌림. 그러나 342년 전연 모용황의 침입으로 국내성이 함락되고 미천왕의 시신과 왕모가 끌려가는 국가적 위기를 겪음.'],
 [371,1,'고국원왕의 전사','백제 근초고왕이 3만 군으로 평양성을 공격하자 고국원왕이 화살에 맞아 전사 — 고구려사 최악의 패전. 이 참패가 아들 소수림왕의 전면적 체제 개혁을 불러 도리어 도약의 계기가 됨.'],
 [372,3,'불교 공인과 태학','소수림왕이 전진의 승려 순도가 전한 불교를 받아들이고 같은 해 국립 교육기관 태학을 세워 유학을 가르침. 이듬해 율령을 반포해(373) 부족 연맹의 관습을 국가의 법으로 대체하며 중앙집권 체제를 완성함.'],
 [391,1,'광개토대왕의 정복','18세에 즉위한 담덕이 백제의 관미성 등 58성을 빼앗고 거란·후연을 치며 만주와 한강 이북을 장악. 400년에는 신라의 구원 요청에 5만 대군을 보내 왜와 가야 연합을 낙동강까지 밀어내 한반도 남부의 판도까지 바꿈.'],
 [414,3,'광개토대왕릉비','장수왕이 아버지의 업적을 6.4m 높이의 돌에 1,775자로 새겨 세움. 건국신화와 정복 연대기, 무덤 관리 규정을 담은 당대 1차 사료이며, 신묘년(391) 기사의 해석을 둘러싸고 한·일 사학계가 오래 논쟁해 온 비문임.'],
 [427,0,'평양 천도','장수왕이 국내성에서 대동강 유역 평양으로 도읍을 옮겨 농업 생산력과 서해 교통을 확보하고, 국내성의 오랜 귀족 세력을 견제함. 동시에 남진 정책을 분명히 해 백제와 신라를 압박하기 시작함.'],
 [433,2,'나제동맹의 성립','고구려의 남진에 맞서 백제 비유왕과 신라 눌지왕이 손을 잡음 — 120년 넘게 이어질 두 나라의 협력이 시작됨. 고구려가 한반도 남부까지 아우르는 것을 막았고, 553년 신라의 배신으로 깨짐.'],
 [475,1,'한성 함락','장수왕이 3만 군으로 백제 왕성을 함락하고 개로왕을 죽여 백제를 웅진으로 밀어냄. 고구려의 영토가 남한강 유역까지 이르러 중원고구려비를 세웠고, 이 시기 고구려는 동아시아의 한 축으로서 남북조 양쪽과 각각 통교하는 다변 외교를 폄.'],
 [498,3,'고분 벽화의 세계','안악 3호분·무용총·강서대묘 등 100기 넘는 굴식 돌방무덤에 생활 풍속과 사신도, 씨름·수박희, 별자리가 그려짐. 씩씩한 기상과 도교·불교가 섞인 세계관을 보여주는 동북아시아 최대의 고분 벽화군으로 세계유산에 등재됨.'],
 [551,1,'한강 유역의 상실','나제동맹군의 협공으로 한강 상·하류를 모두 잃음. 이어 신라 진흥왕이 백제 몫까지 독차지하자(553) 고구려는 오히려 신라와 밀약을 맺고 백제·왜와 대립하는 쪽으로 외교를 뒤집음.'],
 [598,1,'수와의 전쟁 개막','영양왕이 요서를 선제공격하자 수 문제가 30만 군으로 보복에 나섰으나 장마와 전염병으로 실패. 이후 양제의 세 차례 대규모 원정으로 이어지는 20년 전쟁의 시작으로, 동아시아 국제전의 서막이 됨.'],
 [612,1,'살수대첩','수 양제가 기록상 113만 대군으로 침공하자 을지문덕이 거짓 항복과 후퇴로 30만 별동대를 평양 부근까지 끌어들인 뒤 살수(청천강)에서 궤멸시킴. 생환자는 2,700명에 불과했다고 전하며, 무리한 원정은 수의 멸망(618)을 재촉함.'],
 [631,1,'천리장성 축조','당의 위협에 대비해 부여성에서 발해만 비사성까지 16년에 걸쳐 방어선을 쌓음. 축성을 감독하며 군권을 장악한 연개소문이 642년 정변으로 영류왕을 죽이고 대막리지가 되어 대당 강경 노선을 밀고 나감.'],
 [645,1,'안시성 싸움','당 태종이 친정해 요동성·백암성을 함락했으나 안시성에서 성주와 백성이 88일을 버텨내 첫 원정이 실패함. 태종은 뒤에 고구려 정벌을 후회했다고 전하며, 이후 당은 소규모 소모전으로 전략을 바꿈.'],
 [666,2,'연개소문 사후의 분열','대당 항전을 이끌던 연개소문이 죽자(665~666년설) 아들 남생·남건·남산이 권력을 다투고 남생이 당에 투항. 수십 년 전쟁으로 국력이 소진된 상태에서 지도층이 갈라져, 성을 지킬 사람이 없어 무너지는 형세가 됨.'],
 [668,1,'고구려 멸망','나당연합군에 평양성이 포위되어 1개월을 버틴 끝에 보장왕이 항복하고 705년의 고구려가 끝남. 20만 명이 당으로 끌려갔고 검모잠·안승의 부흥운동은 실패했으나, 유민은 신라와 발해로 흘러들어 고구려 계승 의식을 이어감.'],
]},
{name:'백제', sub:'BAEKJE',
 spans:[[-18,475,'한성'],[475,538,'웅진'],[538,660,'사비']],
 events:[
 [-18,0,'백제 건국','주몽의 아들 온조가 부여계 무리를 이끌고 남하해 한강 하류 위례성에 나라를 세웠다는 기년. 왕족의 성을 부여씨로 하고 뒤에 국호를 남부여로 바꿀 만큼 부여 계승 의식이 강했으며, 한강 유역의 넓은 평야와 해상 교통을 발판으로 삼음.'],
 [234,2,'고이왕의 체제 정비','6좌평과 16관등을 두고 관복 색으로 등급을 나누며 율령을 반포한 것으로 전해짐. 목지국을 눌러 마한의 주도권을 잡고 낙랑·대방과 겨루며 왕위의 부자 상속을 확립해, 실질적인 국가 체제를 갖춘 왕으로 평가됨.'],
 [371,1,'근초고왕의 전성기','평양성을 공격해 고구려 고국원왕을 전사시키고 마한 잔여 세력을 통합해 전라도 전역을 아우름. 요서 진출설이 논의될 만큼 해상으로도 뻗어 중국 동진과 왜를 잇는 교역망의 중심이 되었고, 왕위의 부자 상속을 확립함.'],
 [372,3,'칠지도와 왜 교류','근초고왕 무렵 백제가 왜왕에게 보낸 것으로 보이는 칠지도가 일본 이소노카미 신궁에 전함. 아직기와 왕인이 한자와 유학을 전하고 뒤에 오경박사·의박사·역박사를 파견해, 백제가 왜에 선진 문물을 공급하는 통로였음을 보여줌.'],
 [384,3,'불교 수용','침류왕이 동진에서 온 인도 승려 마라난타를 맞아 불교를 공인하고 이듬해 한산에 절을 세움. 왕실이 앞장서 받아들여 왕권을 신성화하는 이념으로 삼았고, 이후 백제 불교는 계율과 미륵 신앙이 발달해 일본 아스카 문화의 원천이 됨.'],
 [475,1,'한성 함락과 웅진 천도','고구려 장수왕의 기습으로 왕성이 함락되고 개로왕이 죽자 문주왕이 웅진(공주)으로 급히 천도. 한강 유역과 서해 교통로를 잃어 국력이 크게 꺾이고, 이후 60여 년간 왕이 잇달아 피살되는 귀족 우위의 혼란기가 이어짐.'],
 [501,2,'무령왕의 재건','귀족의 반란을 진압하고 22담로에 왕족을 파견해 지방 통제를 회복하며 고구려에 반격을 가함. 중국 남조 양과 긴밀히 통교해 "다시 강국이 되었다"고 국서에 밝혔고, 벽돌로 쌓은 그의 무덤은 도굴되지 않은 채 발견되어 백제사 연구의 기준이 됨.'],
 [538,0,'사비 천도와 남부여','성왕이 넓은 평야와 금강 수운을 갖춘 사비(부여)로 옮기고 국호를 남부여로 고쳐 부여 계승과 중흥의 뜻을 밝힘. 5부·5방의 지방 제도와 22부의 중앙 관제를 정비해 왕권을 다시 세움.'],
 [538,3,'일본에 불교 전파','성왕이 왜에 불상과 경전을 보내 불교를 전함(552년설도 있음). 숭불파 소가씨가 승리하며 아스카 문화가 꽃피고, 백제 장인들이 건너가 아스카데라와 호류지 건축을 이끌어 동아시아 불교 문화의 전파 경로를 완성함.'],
 [554,1,'관산성 패전','한강 유역을 신라에 빼앗긴 성왕이 대가야·왜와 함께 반격했으나 관산성에서 전사하고 3만 군을 잃음. 120년 나제동맹이 완전히 깨지고 백제는 고구려와 손잡아 신라를 고립시키려 하지만, 이 패전으로 국력의 균형이 신라로 기울어짐.'],
 [599,3,'미륵 신앙과 왕흥사','법왕·무왕 대에 왕실 발원 사찰이 잇달아 세워지고 미륵이 내려와 이상 세계를 이룬다는 신앙이 퍼짐. 살생을 금하는 법령을 내리고 사리 장엄구에 발원문을 새겨, 불교로 왕권과 백성을 하나로 묶으려는 국가 불교의 성격을 보여줌.'],
 [634,3,'궁남지와 백제 정원','무왕이 궁궐 남쪽에 못을 파고 20여 리 밖에서 물을 끌어들여 둑에 버들을 심고 못 가운데 섬을 만든, 기록상 한국에서 가장 오래된 인공 정원. 이 조경 기술이 일본에 전해져 정원 문화의 원형이 되었다고 하며, 부드럽고 세련된 백제 미의식을 대표함.'],
 [639,3,'미륵사 창건','무왕이 익산에 동·서 석탑과 목탑을 나란히 세운 삼원(三院) 가람을 조성 — 백제 최대 규모의 사찰. 2009년 서탑 해체 중 나온 사리봉영기가 발원자를 왕후 사택씨로 밝혀, 선화공주 설화와 다른 역사상을 드러내며 학계에 큰 논쟁을 일으킴.'],
 [567,3,'백제의 공예와 금동대향로','능산리 절터(567년 창건)에서 나온 6세기 후반의 금동대향로는 봉황과 용, 74개 산봉우리에 악사와 짐승을 배치해 신선 세계를 형상화한 도교·불교 융합의 걸작. 정림사지 석탑과 서산 마애삼존불의 "백제의 미소"와 함께 우아하고 세련된 백제 예술을 대표함.'],
 [660,1,'황산벌과 사비 함락','계백의 5천 결사대가 김유신의 5만 군과 황산벌에서 맞서 전멸하고, 당 소정방의 13만 수군까지 밀려들어 사비가 함락되며 678년의 백제가 끝남. 의자왕과 태자 등 1만 2천여 명이 당으로 끌려감.'],
 [663,1,'백강 전투와 부흥운동 좌절','복신과 도침이 주류성에서, 흑치상지가 임존성에서 부흥군을 일으키고 왜가 4만 원군과 배 400척을 보냈으나 백강 하구에서 나당 수군에 궤멸됨. 동아시아 4국이 맞붙은 최초의 국제 해전으로, 왜는 이후 본토 방어와 국가 체제 정비로 방향을 돌림.'],
 [664,2,'백제 유민의 흐름','지배층 상당수가 왜로 망명해 아스카·나라 문화의 기술과 학문을 떠받치고, 일부는 당으로 옮겨 관리가 됨. 남은 땅은 신라에 편입되어 9주 가운데 세 주가 되었고, 백제의 조세·공예 기술은 통일신라 문화에 흡수됨.'],
]},
{name:'신라·통일신라', sub:'SILLA',
 spans:[[-57,503,'사로국'],[503,676,'신라'],[676,935,'통일신라']],
 events:[
 [-57,0,'신라 건국','경주 분지의 6촌이 알에서 난 박혁거세를 거서간으로 추대했다는 기년. 박·석·김 세 성이 번갈아 왕위에 오르는 연맹 단계를 오래 유지해 삼국 가운데 국가 체제 정비가 가장 늦었으나, 그만큼 고유 문화가 오래 남음.'],
 [356,2,'내물왕과 김씨 세습','내물마립간 대에 김씨의 왕위 독점이 굳어지고 왕호가 마립간으로 바뀌며 왕권이 강화됨. 고구려의 도움으로 왜를 물리치는 대신 그 영향 아래 놓여, 호우명 그릇과 광개토대왕릉비에 그 종속 관계가 남음.'],
 [433,2,'나제동맹 참여','눌지마립간이 백제와 손잡아 고구려의 남진을 함께 막고 그 간섭에서 벗어나기 시작. 왕위의 부자 상속을 확립하고 소가 끄는 수레의 사용법을 백성에게 가르쳐(438) 내정을 다졌으며, 고구려와 왜에 볼모로 있던 왕제들을 박제상이 목숨 걸고 데려온 이야기가 전함.'],
 [502,4,'우경과 순장 금지','지증왕이 소를 이용한 밭갈이를 널리 권장하고 왕이 죽으면 남녀를 함께 묻던 순장을 금지함. 노동력을 지키고 생산을 늘리려는 조치로, 농업 생산력의 도약이 곧 국력 신장의 바탕이 됨.'],
 [503,0,'국호 신라와 왕호 왕','지증왕이 사로·계림 등으로 불리던 이름을 "덕업이 날로 새로워지고 사방을 망라한다"는 뜻의 신라로 정하고 왕호도 마립간에서 왕으로 고침. 주군제를 실시해 지방을 재편했으며, 512년에는 이사부를 보내 우산국(울릉도)을 복속시킴.'],
 [520,2,'율령 반포와 골품제','법흥왕이 율령을 반포하고 백관의 공복을 자·비 등의 색으로 정해 신분 질서를 법으로 못박음. 앞서 병부를 설치하고(517) 뒤에 상대등을 두어(531) 국가 조직을 갖췄으며, 혈통에 따라 관등과 집 크기·수레까지 제한하는 골품제가 이때 제도로 확립됨.'],
 [527,3,'이차돈 순교와 불교 공인','귀족의 반대에 막힌 불교 수용을 위해 이차돈이 목을 베면 기적이 일어난다며 순교를 자청, 흰 피가 솟았다는 이야기와 함께 법흥왕이 불교를 공인. 불교는 부족별 신앙을 하나로 묶고 왕을 부처에 견주는 왕즉불(王卽佛) 이념을 제공함.'],
 [532,1,'금관가야 병합','법흥왕이 낙동강 하구의 금관가야를 복속시켜 철 생산지와 해상 교역로를 얻음. 항복한 왕족 김구해의 후손이 진골로 편입되어 뒤에 김유신을 배출하며, 신라가 삼국 경쟁의 승자가 되는 인적·물적 기반이 마련됨.'],
 [536,2,'「건원」 연호','법흥왕이 중국 연호를 쓰지 않고 독자 연호 건원을 세워 대외적 자주 의식을 드러냄. 이후 진흥왕의 개국·대창·홍제로 이어지며 왕을 천하의 중심에 두는 관념이 자리 잡았으나, 당과 손잡은 뒤인 650년에 당 연호로 바꿈.'],
 [545,3,'『국사』 편찬','진흥왕이 이사부의 건의로 거칠부에게 나라의 역사를 편찬하게 함 — 전하지 않으나 왕실의 계보와 정통성을 정리해 지배 이념을 세우려는 사업이었음. 뒤에 『삼국사기』가 신라 기록에 크게 의존하는 배경이 됨.'],
 [576,3,'화랑도의 정비','진흥왕 말년에 원화(源花)를 두어 청소년 수련 조직을 국가가 관장하기 시작하고, 뒤에 원광이 사군이충·사친이효 등 세속오계를 지어(600년경) 지침으로 줌. 진골 화랑과 여러 신분의 낭도가 함께 산천을 돌며 심신을 닦아 계층 갈등을 누그러뜨리고 김유신·관창 같은 인재를 배출함.'],
 [553,1,'한강 유역 독점','나제동맹으로 되찾은 한강 하류를 백제에게서 빼앗아 신주를 설치하고 120년 동맹을 깸. 서해를 통해 중국과 직접 통하는 길을 얻어 삼국 경쟁의 주도권을 잡았고, 이듬해 관산성에서 백제 성왕을 전사시킴.'],
 [562,1,'대가야 정복','이사부와 사다함이 고령의 대가야를 무너뜨려 낙동강 서쪽까지 차지하며 가야 연맹이 완전히 소멸. 진흥왕은 넓힌 땅을 돌아보며 북한산·황초령·마운령 등에 순수비를 세워 영토와 왕의 위엄을 새김.'],
 [645,3,'황룡사 9층 목탑','자장의 건의로 높이 80m에 이르는 목탑을 세워 주변 아홉 나라를 아우른다는 뜻을 담음. 선덕여왕 대에 첨성대와 분황사도 세워졌으며, 불교의 힘으로 나라를 지킨다는 호국 불교의 상징이 되었다가 몽골 침입 때 불탐.'],
 [648,2,'나당동맹','비담의 난과 백제의 공세로 위기에 몰린 신라가 김춘추를 당에 보내 군사 동맹을 맺음. 대동강 이북을 당이 갖는 조건이었고, 당의 관복과 연호를 받아들이는 대가를 치렀으나 삼국 통일의 결정적 발판이 됨.'],
 [660,1,'백제 정복','김유신이 황산벌에서 계백을 꺾고 당군과 함께 사비를 함락. 무열왕 김춘추가 진골로서 처음 왕위에 올라 왕권을 강화한 뒤 이룬 성과로, 이후 김씨 직계가 왕위를 독점하는 중대(中代) 왕실이 열림.'],
 [668,1,'고구려 정복','문무왕과 김유신이 당의 이적과 함께 평양성을 함락시켜 고구려를 멸함. 그러나 당이 웅진도독부·안동도호부를 두고 한반도 전체를 지배하려 하자, 신라는 곧 고구려·백제 부흥 세력을 끌어안고 당과 맞서게 됨.'],
 [676,1,'나당전쟁 승리와 삼국 통일','매소성에서 당의 20만 대군을 꺾고(675) 기벌포에서 설인귀의 수군을 격파해 당을 대동강 이북으로 밀어냄. 외세를 끌어들였다는 한계와 고구려 땅 대부분을 잃은 아쉬움은 남았으나, 처음으로 한반도에 하나의 정치·문화 공동체가 성립함.'],
 [682,2,'신문왕의 왕권 강화','장인 김흠돌의 난(681)을 진압해 진골 귀족을 대거 숙청하고 국학을 세워 유학 관료를 길러냄. 9주 5소경으로 지방을, 9서당 10정으로 군사를 재편했으며 관료전을 주고 녹읍을 폐지해(689) 귀족의 경제 기반을 국가가 통제함.'],
 [682,3,'원효와 의상','원효는 일심(一心)과 화쟁으로 종파 갈등을 아우르고 "아미타불만 부르면 된다"며 불교를 대중에게 열었으며, 의상은 화엄종을 세우고 부석사를 창건해 하나가 전체를 품는다는 논리로 통합 이념을 제공함. 혜초는 인도까지 다녀와 『왕오천축국전』을 남김.'],
 [722,4,'정전 지급','성덕왕이 백성에게 정전(丁田)을 나눠 준다는 기록으로, 국가가 토지와 인구를 직접 장악하려 한 조치. 민정문서(촌락문서)에는 마을의 인구·소·말·뽕나무까지 3년마다 조사해 적은 내용이 남아 치밀한 수취 체계를 보여줌.'],
 [751,3,'불국사와 석굴암','경덕왕 대에 김대성이 발원해 조성 — 석굴암은 주실을 정확한 원과 구로 설계하고 본존불의 시선이 동해 일출과 맞도록 계산한 수리 건축의 정수. 불국사 석가탑에서 나온 무구정광대다라니경은 현존 최고(最古)의 목판 인쇄물로 평가됨.'],
 [771,4,'성덕대왕신종','높이 3.66m, 무게 18.9톤의 종으로 맥놀이 현상을 이용해 여운이 길게 이어지는 "에밀레종". 두께를 미세하게 조절해 소리를 다듬은 주조 기술과 비천상 문양이 통일신라 금속 공예의 절정을 보여줌.'],
 [788,2,'독서삼품과','원성왕이 국학 졸업생을 유교 경전 이해도에 따라 상·중·하 세 등급으로 나눠 관리로 뽑는 제도를 시행. 골품의 벽에 막혀 정착하지 못했으나 능력에 따라 관리를 뽑으려 한 최초의 시도이며, 뒤의 과거제로 이어지는 발상의 출발점이 됨.'],
 [822,2,'김헌창의 난','무열왕계인 웅천주 도독 김헌창이 아버지가 왕이 되지 못한 데 불만을 품고 장안국을 세워 반란을 일으켜 4주와 3소경이 호응. 진골 내부의 왕위 다툼이 지방을 끌어들이는 단계에 이르렀음을 보여주며, 이후 150년간 20명의 왕이 교체됨.'],
 [828,4,'장보고와 청해진','당에서 무령군 소장을 지낸 장보고가 완도에 진을 설치해 해적을 소탕하고 신라·당·일본을 잇는 해상 무역을 장악 — "해상왕"으로 불림. 산둥에 법화원을 세워 재당 신라인 사회를 후원했으나 왕위 다툼에 개입한 끝에 암살됨(846).'],
 [857,3,'6두품과 최치원','골품의 한계에 막힌 6두품 지식인들이 당에 유학해 활로를 찾음. 12세에 건너가 빈공과에 급제한 최치원은 「토황소격문」으로 이름을 떨치고 귀국해 시무 10여 조를 올렸으나 받아들여지지 않자 은거했으며, 이들은 뒤에 고려 건국의 이념을 제공함.'],
 [889,2,'원종·애노의 난','진성여왕 대에 국가 재정이 바닥나 조세를 독촉하자 사벌주에서 농민 봉기가 일어나 전국으로 번짐. 진골의 사치와 사원의 토지 집중으로 자영농이 무너진 결과이며, 이 혼란 속에서 호족이 성주·장군을 자칭하며 지방을 장악함.'],
 [935,1,'신라 멸망','경순왕이 더는 나라를 지킬 수 없다며 스스로 고려에 나라를 넘겨 992년의 신라가 문을 닫음. 마의태자 전설을 남긴 반대도 있었으나 유혈 없는 귀부였고, 신라 왕족과 6두품 지식인은 고려의 지배층으로 흡수되어 그 문화적 유산을 이어감.'],
]},
{name:'가야', sub:'GAYA',
 spans:[[42,400,'전기 가야 (금관가야)'],[400,562,'후기 가야 (대가야)']],
 events:[
 [42,0,'금관가야 건국','하늘에서 내려온 여섯 알에서 태어난 김수로가 김해에 나라를 세웠다는 『가락국기』의 기년. 인도 아유타국에서 왔다는 허황옥과 혼인했다는 설화가 전하며, 낙동강 하구의 소국들이 김해를 맹주로 연맹을 이룬 것으로 봄.'],
 [100,4,'철의 왕국','창원 성산·김해 대성동에서 대량의 철기와 덩이쇠(철정)가 나와, 가야가 우수한 제철 기술로 한반도와 왜에 철을 공급했음을 보여줌. 낙랑·대방과 왜를 잇는 중계무역으로 번영했고 덩이쇠는 화폐처럼 쓰임.'],
 [209,1,'포상팔국의 난','남해안의 여덟 소국이 연합해 금관가야를 공격하자 신라에 구원을 청해 물리침. 연맹의 결속이 약해 소국들이 각자 이익을 다투었음을 보여주며, 중앙집권 국가로 나아가지 못한 가야의 구조적 한계를 드러냄.'],
 [400,1,'고구려 남정과 중심 이동','신라를 도우러 온 광개토대왕의 5만 대군이 왜·가야 연합을 낙동강 하류까지 몰아내 금관가야가 큰 타격을 입음. 연맹의 중심이 내륙 고령의 대가야로 옮겨가며 전기 가야가 끝나고 후기 가야가 시작됨.'],
 [479,2,'대가야의 외교','대가야 하지왕이 중국 남제에 사신을 보내 "보국장군 본국왕" 작호를 받음 — 가야가 국제 무대에 독자적으로 등장한 유일한 기록. 소백산맥을 넘어 섬진강 유역까지 세력을 넓혀 전성기를 이룸.'],
 [522,2,'신라와의 결혼 동맹','대가야 이뇌왕이 신라 왕족 여자를 맞아 동맹을 맺어 백제의 압박에 대응하려 했으나 곧 깨짐. 백제와 신라 사이에서 어느 편에도 온전히 서지 못한 채 두 강국의 완충 지대로 소모되어 감.'],
 [532,1,'금관가야 멸망','구해왕이 신라 법흥왕에게 항복해 금관가야가 사라짐. 왕족은 진골로 대우받아 김유신 가문으로 이어졌으며, 낙동강 하구의 철과 항구를 잃은 후기 가야는 존립 기반이 크게 흔들림.'],
 [562,1,'대가야 멸망','관산성 패전으로 백제가 꺾인 뒤 신라 이사부와 사다함이 고령을 함락해 520년의 가야 연맹이 완전히 소멸. 우륵이 가야금과 12곡을 신라에 전하고 토기·마구 제작 기술도 흡수되었으며, 가야 토기는 일본 스에키의 원형이 됨.'],
]},
{name:'발해', sub:'BALHAE',
 spans:[[698,926,'발해']],
 events:[
 [698,0,'발해 건국','고구려 유장 대조영이 당의 추격군을 천문령에서 꺾고 동모산에 나라를 세움 — 처음 국호는 진(震)이었고 713년 당의 책봉으로 발해가 됨. 고구려 유민이 지배층, 말갈인이 다수 피지배층을 이룬 이원적 구성이었음.'],
 [727,2,'일본에 보낸 국서','무왕이 일본에 사신을 보내며 "고려(고구려)의 옛 땅을 되찾고 부여의 풍속을 잇는다"고 밝혀 고구려 계승 의식을 분명히 함. 문왕은 스스로를 "고려 국왕"이라 칭했고, 신라와는 신라도(道)로 교류하면서도 경쟁 관계를 유지함.'],
 [732,1,'산둥 등주 공격','무왕이 흑수말갈 문제로 당과 대립하자 장문휴의 수군을 보내 산둥반도 등주를 기습해 자사를 죽임. 당이 신라를 끌어들여 협공하려 했으나 실패했으며, 발해가 당에 정면으로 맞설 만한 군사력을 갖췄음을 보여줌.'],
 [756,0,'상경 용천부 천도','문왕이 중경에서 상경으로 도읍을 옮기고 당과 화친해 문물을 받아들임. 당의 장안을 본떠 주작대로를 낸 계획도시를 조성하고 3성 6부의 관제와 주자감을 두었으며, 신라도·일본도·영주도 등 다섯 교통로를 정비함.'],
 [793,3,'발해의 문화','정혜공주묘의 굴식 돌방과 모줄임천장은 고구려 양식을, 정효공주묘의 벽돌무덤과 벽화는 당 양식을 보여주어 두 흐름이 섞인 발해 문화의 성격을 드러냄. 이불병좌상과 온돌·연꽃무늬 기와에는 고구려의 전통이 뚜렷함.'],
 [818,0,'해동성국','선왕 대에 말갈 여러 부를 아우르고 요동까지 진출해 5경 15부 62주의 최대 판도를 이룸 — 당이 "바다 동쪽의 융성한 나라(海東盛國)"라 부름. 남쪽의 통일신라와 함께 남북국 시대를 이루며 유학생을 당에 보내 빈공과에 급제시킴.'],
 [906,2,'거란의 압박','내부의 귀족 분열과 함께 서쪽에서 야율아보기의 거란이 급속히 강성해지며 압박이 커짐. 한때 백두산 대분화를 원인으로 보는 설이 있었으나 분화 시점(946년경)이 멸망보다 뒤여서 받아들여지지 않으며, 지배층과 말갈 피지배층의 통합이 끝내 이뤄지지 않은 취약함이 주된 요인으로 지적됨.'],
 [926,1,'발해 멸망','거란 야율아보기가 홀한성을 포위해 15대 228년의 발해가 무너지고 그 땅에 동단국이 세워짐. 남은 유민이 정안국 등으로 저항했으나 실패했고, 만주에 있던 우리 역사의 마지막 국가가 사라짐.'],
 [934,2,'유민의 고려 귀부','세자 대광현이 수만 명을 이끌고 고려에 망명하자 왕건이 왕계라는 이름과 왕족 대우를 주고 받아들임. 고려는 이를 근거로 고구려·발해 계승을 자임해 거란과 끝내 화친하지 않았고, 만부교에서 거란의 낙타를 굶겨 죽인 사건이 그 상징이 됨.'],
]}]},
{name:'고 려', rows:[
{name:'고려 정치·대외', sub:'GORYEO · POLITICS',
 spans:[[918,1170,'문벌귀족 사회'],[1170,1270,'무신 집권'],[1270,1356,'원 간섭기'],[1356,1392,'개혁과 교체']],
 events:[
 [918,0,'고려 건국','궁예의 폭정에 등을 돌린 호족들이 송악의 왕건을 추대해 나라를 세우고 고구려 계승을 국호에 담음. 서방에 알려져 "코리아"의 어원이 되었으며, 개경으로 도읍을 옮기고 조세를 1/10로 낮춰 민심을 얻음.'],
 [936,1,'후삼국 통일','신라의 귀부(935)에 이어 일리천에서 후백제 신검의 군대를 꺾어 통일을 완성. 신라·백제·발해의 지배층을 모두 포용하고 지방 호족과 혼인 동맹을 맺어(부인 29명) 통합했으나, 이 혼인망은 뒤에 왕위 다툼의 씨앗이 됨.'],
 [942,2,'만부교 사건','발해를 멸망시킨 거란이 보낸 낙타 50필을 만부교 아래에 매어 굶겨 죽이고 사신을 유배함. 고구려·발해 계승을 내세운 강경한 북진 정책의 상징으로, 「훈요십조」에서 거란을 금수의 나라라 한 태조의 유훈과 함께 이후 100년 대립의 바탕이 됨.'],
 [956,2,'노비안검법','광종이 호족이 전란 중 불법으로 차지한 노비를 조사해 양인으로 되돌림 — 호족의 사병과 경제 기반을 깎고 국가의 조세·군역 대상을 늘리는 이중 효과를 노림. 이어 백관의 공복을 제정해(960) 위계를 왕 중심으로 재편함.'],
 [958,2,'과거제 도입','광종이 후주에서 귀화한 쌍기의 건의로 시험으로 관리를 뽑는 제도를 실시 — 한국 역사상 최초. 호족의 세습 기반을 흔들고 유교 소양을 갖춘 신진 관료층을 길러냈으며, 광종은 스스로 황제를 칭하고 광덕·준풍의 독자 연호를 씀.'],
 [982,2,'최승로의 시무 28조','성종이 최승로의 상소를 받아들여 유교 정치 이념을 국정의 기준으로 삼음 — 불교의 폐단과 지나친 사치를 비판하되 민생 안정과 지방관 파견을 촉구한 현실적 개혁안. 12목에 지방관을 보내고(983) 2성 6부와 국자감을 정비해 통치 체제를 확립함.'],
 [993,1,'거란의 1차 침입','소손녕이 대군을 이끌고 침입하자 서희가 담판에 나서 "고려는 고구려를 이었으니 그 땅이 우리 것"이라 논박하고 송과의 단교를 조건으로 압록강 동쪽 강동 6주를 얻어냄. 싸우지 않고 영토를 넓힌 외교의 전범으로 꼽힘.'],
 [1010,1,'거란의 2차 침입','강조의 정변을 구실로 성종이 40만 군을 이끌고 침입해 개경이 함락되고 현종이 나주까지 피난. 양규가 흥화진에서 분전해 퇴로를 끊고 포로 3만을 구했으며, 이 국난 중에 초조대장경 조성이 발원됨.'],
 [1019,1,'귀주대첩','소배압의 10만 3차 침입군을 강감찬이 귀주에서 섬멸해 살아 돌아간 자가 수천에 불과했다고 전함. 이후 고려-거란-송 사이에 세력 균형이 성립해 100여 년의 평화가 이어졌고, 개경에 나성을 쌓고 천리장성을 완성해(1044) 북방 방어선을 굳힘.'],
 [1076,2,'경정 전시과와 관제 완비','문종이 현직 관리에게만 토지를 주는 경정 전시과로 재정을 정비하고 남경(서울)을 설치. 문종~예종 대는 고려의 전성기로, 송의 문물을 활발히 받아들이고 대각국사 의천 같은 왕자가 출가해 불교를 이끎.'],
 [1107,1,'윤관의 여진 정벌','별무반 17만을 이끌고 동북 지역의 여진을 몰아내고 9성을 쌓았으나 방어 부담과 여진의 간청으로 1109년에 돌려줌. 이후 여진은 금을 세워 거란과 송을 무너뜨리고 고려에 사대를 요구하게 됨.'],
 [1126,2,'이자겸의 난','왕실과 겹겹이 혼인해 권력을 독점한 이자겸이 왕위를 노리다 척준경에게 제거됨. 몇몇 가문이 왕실과의 혼인으로 권력을 대물림하는 문벌귀족 사회의 모순이 폭발한 사건으로, 인종의 개혁 시도로 이어짐.'],
 [1135,2,'묘청의 서경 천도 운동','묘청 등 서경 세력이 풍수지리를 근거로 천도와 금국 정벌, 칭제건원을 주장하며 국호를 대위(大爲)로 내걸었으나 이듬해 김부식의 관군에 진압됨. 신채호가 "조선 역사 1천년래 제일 대사건"이라 평한, 자주와 사대 노선의 충돌.'],
 [1170,2,'무신정변','의종의 향락과 문신 위주의 차별 대우에 반발한 정중부·이의방 등이 정변을 일으켜 문신을 살해하고 왕을 폐위. 이후 100년간 중방과 교정도감을 통해 무신이 실권을 쥐고 왕은 허수아비가 되며, 김보당·조위총의 난이 잇따름.'],
 [1196,2,'최씨 무신 정권','최충헌이 이의민을 제거하고 교정도감을 최고 기구로, 사병 집단 도방을 무력 기반으로 삼아 4대 62년의 세습 정권을 세움. 아들 최우는 정방을 두어 인사권을 장악하고 삼별초를 조직했으며, 안정을 이루었으나 개혁 없는 권력 유지에 머무름.'],
 [1198,2,'만적의 난','최충헌의 사노비 만적이 "왕후장상의 씨가 따로 있느냐"며 개경의 노비들을 모아 봉기를 계획했다가 발각되어 처형됨. 신분 해방을 정면으로 내세운 최초의 시도로, 무신 집권기의 신분 질서 동요를 상징함.'],
 [1231,1,'몽골 침입 시작','사신 저고여의 피살을 구실로 살리타이가 침입해 이후 30년간 여섯 차례에 걸쳐 국토가 유린됨. 처인성에서 김윤후가 살리타이를 사살하고 충주성에서 노비군이 성을 지키는 등, 정규군보다 백성과 승려의 항전이 두드러짐.'],
 [1232,2,'강화도 천도','최우가 수전에 약한 몽골의 약점을 노려 왕과 조정을 강화로 옮겨 항전 태세를 취함. 그러나 본토의 백성은 방치된 채 수탈이 계속되었고, 39년의 섬 정부 기간에 팔만대장경 조성 등 문화 사업이 이루어짐.'],
 [1270,1,'개경 환도와 삼별초','무신 정권이 무너지고 원종이 개경으로 돌아가 강화를 맺자, 삼별초가 배중손을 중심으로 진도에 정부를 세우고 이어 제주로 옮겨 3년을 더 싸웠으나 여몽 연합군에 진압됨. 대몽 항쟁의 마지막 저항이자 자주 의식의 표출로 평가됨.'],
 [1274,2,'원 간섭기의 시작','충렬왕이 원 공주와 혼인해 부마국이 되고 정동행성이 내정에 간여하며, 왕의 시호에 충(忠)이 붙고 관제가 격하됨. 쌍성총관부·동녕부·탐라총관부에 영토를 빼앗기고 두 차례 일본 원정에 인력과 배를 대느라 국력이 소진됨.'],
 [1298,2,'권문세족의 대두','원과 결탁한 부원 세력과 무신 가문, 신진 관료가 섞여 권문세족을 이룸. 도평의사사를 장악하고 산천을 경계로 삼는 대농장을 늘려 국가 재정을 좀먹었으며, 이에 맞서 성리학을 익힌 신진사대부가 개혁 세력으로 성장함.'],
 [1351,2,'공민왕 즉위','원의 쇠퇴를 읽은 공민왕이 즉위해 반원 자주와 내정 개혁을 함께 추진. 원의 연호를 폐지하고 변발과 몽골 복식을 금하며, 정방을 없애 인사권을 왕에게 되돌림.'],
 [1356,1,'반원 개혁과 영토 회복','기철 등 친원 세력을 제거하고 정동행성 이문소를 폐지했으며, 쌍성총관부를 공격해 철령 이북 땅을 99년 만에 되찾음. 전민변정도감을 두어 권문세족의 토지와 노비를 정리하려 했으나 홍건적·왜구의 침입과 신돈의 실각으로 개혁이 좌절됨.'],
 [1376,1,'왜구 토벌','왜구의 약탈이 극심해지자 최영이 홍산에서, 이성계가 남원 황산에서 대승을 거두고 최무선의 화포를 실은 함대가 진포에서 왜선 500척을 불태움. 이 전공으로 신흥 무인 세력이 정치의 전면에 등장함.'],
 [1388,2,'위화도 회군','명이 철령위 설치를 통보하자 최영은 요동 정벌을, 이성계는 4불가론으로 반대함. 정벌군을 이끌고 압록강 위화도까지 간 이성계가 군을 돌려 최영을 제거하고 실권을 장악 — 왕조 교체의 결정적 분기점이 됨.'],
 [1392,1,'고려 멸망','정도전·조준 등 급진 신진사대부가 공양왕을 폐하고 이성계를 추대해 474년의 고려가 끝남. 정몽주 등 온건파는 제거되었고, 두문동에 은거한 선비들의 절의가 뒤에 조선 사림의 정신적 뿌리로 기억됨.'],
]},
{name:'고려 사회·문화', sub:'GORYEO · SOCIETY & CULTURE',
 spans:[[918,1392,'고려의 사회와 문화']],
 events:[
 [976,4,'전시과 시행','경종이 관직과 인품에 따라 전지(농경지)와 시지(임야)의 수조권을 나눠 주는 제도를 처음 실시. 소유권이 아닌 수조권을 주고 죽으면 반납하게 해 국가가 토지를 통제하려 한 체제로, 목종의 개정(998)·문종의 경정(1076) 전시과로 정비됨.'],
 [992,3,'국자감과 사학','성종이 국립대학 국자감을 세워 유학과 기술학을 가르치고, 지방에는 향교를 둠. 뒤에 최충의 문헌공도를 비롯한 사학 12도가 융성해 관학이 위축되자, 예종이 7재를, 숙종이 서적포를 두어 관학 진흥에 나섬.'],
 [1000,4,'벽란도와 국제 교역','예성강 하구의 벽란도가 개경의 문호로서 송·거란·여진·일본은 물론 아라비아 상인까지 드나드는 국제 항구로 번성. 인삼·나전칠기·종이·먹을 내보내고 비단·약재·서적을 들였으며, 이 교류를 통해 "코리아"라는 이름이 서방에 알려짐.'],
 [1000,2,'양천제와 향·소·부곡','법적으로 양인과 노비로 나뉘고 양인 안에서도 백정(일반 농민), 향리, 군인으로 역이 갈림. 향·소·부곡의 주민은 양인이면서 차별을 받아 이주와 과거 응시가 제한되었고, 여성은 재산 상속과 재혼, 호주가 가능해 조선보다 지위가 높았음.'],
 [1011,3,'초조대장경 조성','거란 침입을 물리치려는 발원으로 대장경 판각을 시작해 76년에 걸쳐 완성. 송본을 바탕으로 하되 교정을 더한 동아시아 최고 수준의 판본이었으나, 1232년 몽골 침입 때 대구 부인사에서 불타 없어짐.'],
 [1097,3,'의천과 천태종','문종의 아들로 출가한 대각국사 의천이 송에서 돌아와 교종을 중심으로 선종을 아우르는 천태종을 개창하고 국청사를 세움. 교장도감을 두어 4천여 권의 불교 주석서를 모아 간행해 동아시아 불교 문헌의 집대성을 이룸.'],
 [1123,3,'고려청자의 절정','송의 사신 서긍이 『선화봉사고려도경』에서 고려의 비색(翡色) 청자를 천하제일이라 기록. 강진·부안 가마에서 흙을 파내고 다른 색 흙을 채우는 상감 기법이 개발되어, 세계 도자사에 유례가 없는 독창적 양식을 이룸.'],
 [1145,3,'『삼국사기』 편찬','인종의 명으로 김부식 등이 편찬한 현존 최고(最古)의 역사서로, 중국식 기전체에 유교적 합리주의를 적용해 신라 중심으로 삼국사를 정리. 설화적 요소를 덜어낸 대신 고대의 전승을 많이 버렸다는 평가도 받음.'],
 [1170,3,'문학과 패관 문학','무신 집권으로 관직에서 밀려난 문인들이 시와 산문에 몰두해 이인로의 『파한집』, 이규보의 『동국이상국집』이 나옴. 이규보의 「동명왕편」은 고구려 건국을 서사시로 노래해 몽골 항쟁기의 자주 의식과 이어짐.'],
 [1190,3,'지눌과 조계종','보조국사 지눌이 수선사(송광사)를 중심으로 참선과 교학을 함께 닦는 정혜쌍수와, 깨달은 뒤에도 수행을 이어가는 돈오점수를 내세워 선종을 혁신. 무신 정권의 후원을 받으며 타락한 교단을 비판하는 결사 운동으로 퍼짐.'],
 [1234,4,'금속활자 『상정고금예문』','최우가 강화에서 금속활자로 이 책 28부를 찍었다는 이규보의 기록 — 현존하지 않으나 세계에서 가장 이른 금속활자 인쇄로 여겨짐 — 구텐베르크보다 200여 년 앞서며, 뒤에 『직지심체요절』(1377)로 실물이 남게 됨.'],
 [1236,3,'팔만대장경 조성','초조대장경이 불타자 국난 극복을 발원하며 16년에 걸쳐 8만 1천여 목판을 다시 새김(1251 완성). 5,200만 자에 오탈자가 거의 없는 정밀함과 700년 넘게 뒤틀리지 않은 보존 상태로 세계기록유산에 등재되었으며, 해인사 장경판전에 보관됨.'],
 [1281,3,'『삼국유사』','일연이 몽골 항쟁의 상처 속에서 단군을 민족의 시조로 처음 기록하고 향가 14수와 불교 설화를 모아 엮음. 『삼국사기』가 버린 신화와 민간 전승을 담아, 이승휴의 『제왕운기』(1287)와 함께 자주적 역사 의식의 원천이 됨.'],
 [1290,4,'농업 기술의 발전','고려 후기에 소를 이용한 심경법과 시비법이 퍼지며 2년 3작이 자리 잡고 남부 일부에 모내기가 보급되기 시작해 생산력이 오름. 뒤에 이암이 원의 농서 『농상집요』를 들여와(1349) 농학이 정리되었고, 이 흐름이 조선 초 『농사직설』로 이어짐.'],
 [1363,4,'문익점과 목화','원에 사신으로 갔던 문익점이 목화씨를 들여와 장인 정천익과 함께 재배와 씨앗 빼기, 실뽑기에 성공. 삼과 모시에 의존했던 의생활이 무명으로 바뀌어 겨울 추위를 크게 덜었고, 무명은 뒤에 화폐 구실까지 하는 주요 산물이 됨.'],
 [1377,4,'『직지심체요절』','청주 흥덕사에서 금속활자로 찍은 불교 선어록으로, 구텐베르크 성경보다 78년 앞선 현존 최고(最古)의 금속활자 인쇄본. 하권 1책이 프랑스 국립도서관에 소장되어 있으며, 유네스코가 이 이름을 딴 상을 두고 있음.'],
 [1377,4,'최무선과 화약 무기','최무선이 화통도감을 세워 화약과 화포를 제작 — 원에서 배운 기술을 자체 생산 단계로 끌어올림. 1380년 진포에서 왜선 500척을 불태우는 전과를 올려 화약 무기가 실전에서 결정적 역할을 한 첫 사례가 되었고, 조선의 화기 발달로 이어짐.'],
 [1380,3,'불화와 나전칠기','왕실과 권문세족의 후원으로 「수월관음도」 같은 섬세한 불화가 제작되어 오늘날 상당수가 일본에 전함. 나전칠기와 은입사 공예, 부석사 무량수전·수덕사 대웅전의 주심포 건축이 고려 미술의 높은 수준을 보여줌.'],
 [1391,4,'과전법 시행','신진사대부가 권문세족의 대농장을 혁파하고 경기 지역 토지의 수조권만 관리에게 지급하는 제도를 마련. 국가 재정과 신진 관료의 경제 기반을 동시에 확보해 조선 건국의 물질적 토대가 되었고, 뒤에 직전법(1466)·관수관급제(1470)로 축소됨.'],
]}]},
{name:'조 선', rows:[
{name:'조선 정치·대외', sub:'JOSEON · POLITICS & FOREIGN',
 spans:[[1392,1592,'조선 전기'],[1592,1800,'조선 후기'],[1800,1876,'세도정치']],
 events:[
 [1392,0,'조선 건국','위화도 회군으로 실권을 잡은 이성계가 정도전 등 신진사대부와 함께 나라를 세우고, 이듬해 국호를 조선으로 정함. 성리학을 통치 이념으로 삼고 사대교린을 외교 원칙으로 내세워 518년간 지속되는 왕조가 열림.'],
 [1394,0,'한양 천도','풍수와 교통, 한강 수운을 고려해 도읍을 한양으로 옮기고 경복궁과 종묘, 사직단을 세움. 좌묘우사와 4대문·4소문을 갖춘 유교적 도시 설계로, 정도전이 인의예지를 담아 궁궐과 문의 이름을 지음.'],
 [1400,2,'태종의 왕권 강화','두 차례 왕자의 난을 거쳐 즉위한 태종이 사병을 혁파하고 의정부를 거치지 않는 6조 직계제(1414)를 시행. 호패법(1413)으로 인구를 파악하고 사간원을 독립시켜 신하를 견제했으며, 신문고를 두어 왕과 백성을 직접 잇는 통로를 마련함.'],
 [1418,2,'세종의 의정부 서사제','태종이 다진 왕권 위에서 세종이 의정부에 정책 심의를 맡기는 서사제로 전환해 재상과 조화를 이룸. 집현전을 두어 학문 연구를 제도화하고 경연을 활성화해, 왕과 신하가 함께 공부하며 정책을 만드는 유교 정치의 모범을 보임.'],
 [1443,1,'4군 6진 개척','최윤덕이 압록강 방면에 4군을, 김종서가 두만강 방면에 6진을 설치해 오늘날 국경선의 틀을 확정. 남쪽 백성을 이주시키는 사민 정책과 토착민을 관리로 삼는 토관 제도로 영토를 실질적으로 다졌으며, 대마도 정벌(1419)로 왜구도 억제함.'],
 [1453,2,'계유정난','수양대군이 김종서·황보인 등을 제거해 실권을 잡고 2년 뒤 조카 단종을 몰아내 왕위에 오름(1455). 사육신의 저항과 금성대군의 반란이 이어졌으며, 세조는 6조 직계제를 되살리고 유향소를 폐지해 왕권을 다시 강화하는 한편 『경국대전』 편찬에 착수함.'],
 [1485,2,'『경국대전』 시행','세조 대에 착수해 성종 대에 완성한 조선의 기본 법전으로 이·호·예·병·형·공 6전 체제를 갖춤. 이후 400년간 통치와 행정, 신분 질서의 근간이 되었고, 홍문관·경연을 정비해 언론 3사가 왕권을 견제하는 구조가 자리 잡음.'],
 [1498,2,'무오사화','김종직의 「조의제문」이 세조를 비판했다는 빌미로 훈구파가 사림을 숙청. 갑자(1504)·기묘(1519)·을사사화(1545)로 이어지며 사림이 거듭 화를 입었으나, 서원과 향약을 기반으로 향촌에서 힘을 길러 결국 정권을 장악함.'],
 [1519,2,'조광조의 개혁과 기묘사화','중종의 신임을 받은 조광조가 현량과로 인재를 뽑고 향약을 보급하며 소격서를 폐지하는 급진 개혁을 폄. 위훈 삭제로 훈구 공신을 정면 공격하다 "주초위왕" 모략에 걸려 사사되었으나, 그의 도학 정치는 사림의 이념이 됨.'],
 [1555,1,'을묘왜변과 비변사','왜구 70여 척이 전라도를 대거 약탈하자 임시 기구였던 비변사가 상설화되어 국방을 총괄. 그러나 군역을 포로 대신하는 방군수포가 퍼져 실제 병력은 크게 줄어 있었고, 이 허약함이 37년 뒤 임진왜란의 초반 붕괴로 드러남.'],
 [1575,2,'동서 분당','이조전랑 자리를 둘러싼 대립으로 사림이 김효원 중심의 동인과 심의겸 중심의 서인으로 갈라짐. 이황·조식의 학통과 이이·성혼의 학통이라는 학문적 계보와 결합해, 이후 300년 조선 정치를 규정하는 붕당정치가 시작됨.'],
 [1592,1,'임진왜란','일본을 통일한 도요토미 히데요시가 명 정복을 명분으로 20만 대군을 보내 20일 만에 한양이 함락됨. 이순신의 한산도·명량 대첩과 곽재우·조헌 등의 의병, 김시민의 진주성 항전, 명군 참전으로 격퇴했으나 인구와 경작지가 격감함.'],
 [1593,1,'행주대첩과 전세 역전','권율이 행주산성에서 3만 일본군을 물리치고 조·명 연합군이 평양을 되찾아 전세가 뒤집힘. 조선은 이 전쟁에서 훈련도감을 설치하고 화포와 조총을 도입해 군제를 개편했으며, 일본은 조선의 도자 기술자와 활자를 대량으로 가져감.'],
 [1597,1,'정유재란과 명량대첩','강화 교섭이 깨져 일본이 다시 침입하자, 백의종군에서 복귀한 이순신이 13척으로 울돌목의 급조류를 이용해 133척을 상대로 대승. 이듬해 노량에서 전사하며 7년 전쟁이 끝났고, 동아시아 세 나라의 정권이 모두 흔들림.'],
 [1608,2,'광해군의 중립 외교','전후 복구에 힘쓰며 대동법을 시행하고 성곽과 무기를 수리했으며, 명과 후금 사이에서 어느 편에도 서지 않는 실리 외교를 폄. 강홍립에게 형세를 보아 행동하라 밀지를 내린 일이 뒤에 인조반정의 명분이 됨.'],
 [1623,2,'인조반정','서인이 광해군의 중립 외교와 폐모살제를 명분으로 정변을 일으켜 인조를 세움. 친명배금으로 외교를 급선회해 후금과의 충돌이 불가피해졌고, 이괄의 난(1624)으로 방어력이 더 약해진 상태에서 두 차례 호란을 맞음.'],
 [1627,1,'정묘호란','후금이 3만 군으로 침입해 황해도까지 내려오자 형제 관계를 맺는 조건으로 강화. 그러나 조선이 명과의 관계를 끊지 않아 갈등이 남았고, 9년 뒤 국호를 청으로 바꾼 홍타이지가 군신 관계를 요구하며 다시 쳐들어옴.'],
 [1636,1,'병자호란','청 태종 홍타이지가 12만 대군으로 친정하자 인조가 남한산성에서 47일을 버틴 끝에 삼전도에서 항복. 소현세자와 봉림대군 등 50만에 이르는 사람이 끌려갔다고 전하며, 조선은 명과 단절하고 청과 군신 관계를 맺음.'],
 [1649,2,'효종의 북벌론','청에 볼모로 있었던 효종이 즉위해 송시열과 함께 복수설치(復讐雪恥)를 내세우고 어영청을 강화하며 군비를 확충. 실제 원정에는 이르지 못했으나, 청을 오랑캐로 보고 조선이 중화를 잇는다는 소중화 의식이 굳어짐.'],
 [1659,2,'예송 논쟁','효종과 그 비의 상례에서 자의대비의 복상 기간을 두고 서인과 남인이 두 차례 격돌 — 왕을 사대부와 같은 예로 볼 것인지를 다툰 이념 논쟁. 붕당 대립이 학문과 예론으로 정교해지는 한편 상대를 인정하지 않는 배타성이 커짐.'],
 [1680,2,'환국 정치','경신환국으로 남인이, 기사환국(1689)으로 서인이, 갑술환국(1694)으로 다시 남인이 몰려나며 정권이 급격히 뒤바뀜. 상대 붕당을 죽음으로 몰아내는 일당 전제화가 진행되어 붕당정치의 견제 기능이 무너짐.'],
 [1712,2,'백두산정계비','청과 국경을 확정하며 백두산에 비를 세워 서쪽은 압록강, 동쪽은 토문강을 경계로 삼음. 토문강의 위치 해석을 둘러싸고 뒤에 간도 귀속 문제로 이어지며, 19세기 조선인의 만주 이주와 함께 오래 논쟁거리가 됨.'],
 [1725,2,'영조의 탕평책','붕당의 폐단을 억제하려 어느 쪽에도 치우치지 않는 탕평파를 등용하고 붕당의 근거지인 서원을 정리, 이조전랑의 후임 추천권을 없앰. 균역법(1750)으로 군포를 절반으로 줄이고 신문고를 되살렸으며, 『속대전』을 편찬해 법제를 정비함.'],
 [1762,2,'사도세자와 시파·벽파','영조가 아들 사도세자를 뒤주에 갇혀 죽게 한 사건을 두고 이를 동정하는 시파와 옳다고 본 벽파가 갈림. 탕평의 한계를 드러냈으며, 사도세자의 아들 정조가 즉위한 뒤 이 대립이 정국의 축이 됨.'],
 [1776,2,'정조의 개혁','규장각을 학문과 정책의 중심 기구로 키우고 초계문신제로 젊은 관료를 재교육하며, 친위 부대 장용영을 두어 군권을 장악. 서얼을 등용하고 신해통공으로 시전의 독점을 깨며 수원 화성을 축조해 개혁의 거점으로 삼음.'],
 [1800,2,'세도정치의 시작','정조가 급서하고 어린 순조가 즉위하자 안동 김씨와 풍양 조씨 등 몇몇 가문이 비변사를 장악해 60여 년간 권력을 독점. 매관매직과 삼정(전정·군정·환곡)의 문란이 극심해져 농민의 부담이 한계에 이름.'],
 [1811,1,'홍경래의 난','평안도 차별과 세도정치에 맞서 몰락 양반 홍경래가 상인·광산 노동자·농민을 모아 봉기해 청천강 이북을 장악, 정주성에서 4개월을 버팀. 지역 차별과 계층 불만이 결합한 대규모 항쟁으로 조선 후기 민중 운동의 분수령이 됨.'],
 [1862,1,'임술 농민봉기','진주에서 시작된 항쟁이 그 해 70여 곳으로 번짐 — 환곡의 폐단과 지방관의 수탈에 맞선 전국적 봉기. 정부가 삼정이정청을 두어 대책을 마련했으나 곧 유명무실해졌고, 이 불만이 30여 년 뒤 동학농민운동으로 폭발함.'],
 [1863,2,'흥선대원군의 개혁','고종의 즉위로 집권해 세도정치의 근거인 비변사를 혁파하고 의정부를 부활시켰으며, 서원을 47개만 남기고 철폐하고 『대전회통』을 편찬. 양반에게도 군포를 물리는 호포제와 사창제로 민생을 안정시켰으나 경복궁 중건과 당백전 발행으로 원성을 삼.'],
 [1866,1,'병인양요와 신미양요','병인박해를 구실로 프랑스 함대가 강화도를 침공해 외규장각 도서를 약탈하고, 제너럴셔먼호 사건을 빌미로 미국도 신미양요(1871)를 일으킴. 어재연 등의 항전으로 물러나게 했으나 척화비를 세운 통상 거부 정책이 정점에 이름.'],
]},
{name:'조선 사회·경제', sub:'JOSEON · SOCIETY & ECONOMY',
 spans:[[1392,1876,'조선의 사회와 경제']],
 events:[
 [1413,2,'8도와 호패법','전국을 8도로 나누고 부·목·군·현에 수령을 파견해 향리를 실무자로 격하시킴 — 고려와 달리 모든 군현에 중앙 관리가 미치는 체제. 호패법으로 16세 이상 남자에게 신분증을 채워 인구와 군역 대상을 파악함.'],
 [1429,4,'『농사직설』','세종의 명으로 정초 등이 각 도의 노련한 농부에게 직접 물어, 중국 농서가 아닌 우리 풍토에 맞는 농법을 정리 — 씨앗 준비부터 논벼·밭작물 재배까지 담음. 이후 『금양잡록』·『농가집성』으로 이어지는 조선 농서 전통의 출발점이 됨.'],
 [1444,4,'공법 시행','토지의 비옥도를 6등급(전분), 그 해 작황을 9등급(연분)으로 나눠 세액을 정하는 정교한 조세 제도. 1결당 최대 20두에서 최소 4두까지 차등을 두어 공평을 기했으나 등급 판정이 복잡해 뒤에 영정법으로 단순화됨.'],
 [1466,4,'직전법과 수조권의 소멸','현직 관리에게만 수조권을 주는 직전법으로 바꾸고, 관수관급제(1470)로 국가가 직접 세를 걷어 관리에게 나눠 줌. 뒤에 직전법마저 폐지되어(1556) 관리는 녹봉만 받게 되고, 양반은 대신 사적으로 토지를 사 모아 지주가 되어 감.'],
 [1500,2,'양반 사회와 신분 구조','법적으로는 양인과 천인으로 나뉘지만 실제로는 양반·중인·상민·천민의 네 층으로 굳어짐. 문과 급제와 족보, 서원과 향약을 통해 양반의 지위가 세습되고, 서얼과 중인은 관직에 한계를 두어 차별을 받음.'],
 [1550,2,'방군수포와 군역의 문란','현역 대신 포를 받는 관행이 퍼져 실제 병력은 장부에만 남고, 부담이 가난한 농민에게 몰림. 죽은 사람과 어린아이에게까지 군포를 물리는 백골징포·황구첨정이 성행해, 균역법(1750)의 배경이 됨.'],
 [1608,4,'대동법 실시','광해군이 방납의 폐단을 없애려 집집마다 걷던 현물 공납을 토지 결수에 따른 쌀·베로 바꿔 경기도에 처음 시행. 김육 등의 노력으로 100년에 걸쳐 전국으로 확대되며 1결당 쌀 12두로 정착했고, 관청 물품을 조달하는 공인이 등장해 상품화폐경제를 자극함.'],
 [1635,4,'영정법','풍흉에 관계없이 1결당 쌀 4두로 전세를 고정 — 지주에게는 유리했으나 수확량 대비 세율이 낮아져 국가 재정은 줄어듦. 부족분을 삼수미·대동미 등 부가세로 메우면서 실제 농민 부담은 오히려 늘어나는 구조가 됨.'],
 [1678,4,'상평통보의 유통','숙종 대에 상평통보를 법화로 발행해 전국에 유통시킴 — 조선에서 화폐가 실제로 널리 쓰인 첫 사례. 상업이 커지며 필요해진 결과였으나, 부유층이 동전을 쌓아 두어 시중에 돈이 마르는 전황(錢荒)이 생기기도 함.'],
 [1700,4,'모내기와 광작','이앙법이 전국에 보급되어 김매기 노동이 줄고 벼·보리 이모작이 가능해져 생산력이 크게 오름. 노동력이 남아 일부 농민이 넓은 땅을 경영하는 광작에 나섰고, 반대로 토지에서 밀려난 농민은 임노동자나 도시 빈민이 됨.'],
 [1720,4,'상품작물과 담배·고추','인삼·담배·목화·채소 같은 돈이 되는 작물 재배가 퍼지고, 임진왜란 무렵 들어온 고추와 18세기 이후 전해진 고구마·감자가 식생활을 바꿈. 오늘날의 김치는 이때 고춧가루를 쓰면서 완성되었고, 구황작물의 보급이 인구 증가를 뒷받침함.'],
 [1750,4,'균역법','영조가 군포를 1년 2필에서 1필로 줄이고, 부족분을 결작·선무군관포·어염세로 메움. 농민 부담을 절반으로 덜었으나 양반에게 군역을 물리는 근본 개혁에는 이르지 못해, 흥선대원군의 호포제까지 문제가 남음.'],
 [1750,4,'사상(私商)의 성장','시전의 독점을 벗어난 사상들이 지역 유통을 장악 — 개성의 송상은 인삼 무역과 송방 지점망을, 의주 만상은 대청 무역을, 한강의 경강상인은 세곡 운송과 선박업을 쥠. 객주·여각이 위탁 판매와 금융을 맡고 포구와 장시가 전국에 1천여 곳으로 늘어남.'],
 [1780,4,'광산 개발과 임노동','민간이 국가에 세를 내고 광산을 경영하는 설점수세제 아래, 자본을 댄 물주와 경영을 맡은 덕대가 임노동자를 고용해 은·구리를 캠. 수공업에서도 선대제와 독립 수공업이 나타나 자본과 노동이 분리되는 초기 형태가 보임.'],
 [1791,4,'신해통공','정조가 육의전을 뺀 시전 상인의 금난전권을 폐지해 자유로운 상업 활동을 허용. 사상의 성장을 제도로 인정한 조치로 물가 안정과 시장 확대에 기여했으며, 상업 자본이 축적되는 계기가 됨.'],
 [1801,2,'공노비 해방','순조 즉위 직후 중앙 관청의 공노비 6만 6천여 명을 양인으로 풀어 줌 — 재정 부담을 덜고 양인을 늘리려는 목적. 이어 노비의 세습이 금지되고(1886) 갑오개혁으로 신분제가 법적으로 철폐되며(1894) 오랜 노비제가 끝남.'],
 [1830,2,'신분제의 동요','부유해진 농민과 상인이 족보를 사거나 공명첩을 얻어 양반을 자칭하고, 몰락한 양반은 잔반이 되어 농사를 짓거나 봉기의 지도자가 됨. 서얼과 중인이 집단으로 신분 상승을 요구하는 통청 운동을 벌여 신분 질서가 안에서부터 흔들림.'],
 [1862,4,'삼정의 문란','전정(토지세)·군정(군포)·환곡이 모두 수탈 수단으로 변질 — 특히 봄에 곡식을 빌려주고 가을에 이자를 받는 환곡이 고리대로 바뀌어 가장 큰 원망을 삼. 이 구조적 착취가 전국적 농민봉기의 직접 원인이 됨.'],
]},
{name:'조선 사상·문화', sub:'JOSEON · THOUGHT & CULTURE',
 spans:[[1392,1876,'조선의 사상과 문화']],
 events:[
 [1403,4,'주자소와 계미자','태종이 주자소를 세워 금속활자 계미자를 만들고, 세종 대에 갑인자(1434)로 정교함을 크게 높임. 국가가 인쇄를 주도해 농서·의서·법전을 널리 펴냈으며, 조지서를 두어 종이를 대량 생산함.'],
 [1418,3,'집현전과 유교 국가의 설계','세종이 집현전에 젊은 학자를 모아 경전과 제도를 연구하게 함. 정도전의 『조선경국전』이 세운 재상 중심 유교 국가의 구상 위에서, 『삼강행실도』·『국조오례의』를 펴내 유교 윤리를 백성의 생활 규범으로 내려보냄.'],
 [1433,4,'『향약집성방』과 의학','우리 땅에서 나는 약재로 병을 다스리도록 향약을 정리하고, 이어 동아시아 의학을 집대성한 『의방유취』(1445)를 펴냄. 값비싼 중국 약재에 의존하지 않는 자립적 의료를 지향한 사업으로, 뒤에 『동의보감』으로 이어짐.'],
 [1434,4,'자격루와 천문 관측','장영실이 물의 힘으로 시각을 알리는 자동 물시계를 만들고, 혼천의·간의로 천체를 관측하며 앙부일구를 거리에 두어 백성이 시간을 알게 함. 세종 대 과학은 왕이 기획하고 장인이 구현하는 국가 프로젝트로 이루어짐.'],
 [1441,4,'측우기','세계 최초의 규격화된 우량계를 만들어 전국에 배포하고 강우량을 표준 단위로 기록·보고하게 함. 농업 국가의 행정에 정량 데이터를 도입한 사례로, 이때부터 축적된 강우 기록은 오늘날 기후 연구에도 쓰임.'],
 [1442,4,'『칠정산』','원의 수시력과 아랍 역법을 연구해 한양의 위도와 경도에 맞춘 자체 역법을 완성 — 일식과 월식을 스스로 계산할 수 있게 됨. 당시 자기 나라 기준의 역법을 가진 나라는 중국·아랍과 조선뿐이었음.'],
 [1443,3,'훈민정음 창제','세종이 백성이 쉽게 익혀 뜻을 펼 수 있도록 표음문자 28자를 만들고 1446년 해설서 『훈민정음 해례본』과 함께 반포. 발성 기관과 천지인을 본떠 글자를 만든 원리와 창제 목적이 기록으로 남은, 세계에서 유일한 문자로 평가됨.'],
 [1447,3,'한글 문헌의 간행','『용비어천가』로 왕조의 정당성을 노래하고 『석보상절』·『월인천강지곡』으로 불경을 우리말로 옮김. 사대부는 한글을 낮춰 보았으나 여성과 서민에게 퍼져 편지와 소설의 문자가 되었고, 조선 후기 서민 문화의 바탕이 됨.'],
 [1451,3,'『고려사』와 『조선왕조실록』','전 왕조의 역사를 기전체로 정리하고, 사관이 왕의 말과 행동을 낱낱이 적은 사초를 모아 실록을 편찬. 472년 1,893권에 이르는 실록은 왕도 살아서는 볼 수 없게 하여 객관성을 지켰고, 사고를 나눠 보관해 임진왜란에도 살아남아 세계기록유산이 됨.'],
 [1481,4,'『동국여지승람』과 지도','전국의 연혁·인물·풍속·산물을 담은 지리지를 편찬하고, 앞서 「혼일강리역대국도지도」(1402)로 아프리카까지 그린 세계지도를 만듦. 국가가 영토와 인구를 파악하려는 의지가 지리학의 발달로 이어짐.'],
 [1543,3,'서원과 향약','주세붕이 백운동서원(뒤의 소수서원)을 세워 선현을 제사하고 후학을 기르는 사림의 거점을 마련. 이황이 예안향약을, 이이가 해주향약을 만들어 향촌의 자치 규약으로 삼으며, 서원과 향약이 사림의 정치적 기반이 됨.'],
 [1568,3,'이황과 이이','이황이 『성학십도』로 이(理)의 절대성을 강조한 주리론을 세워 영남학파와 동인의 학맥이 되고, 이이가 『성학집요』(1575)로 기(氣)의 역할을 중시한 주기론을 펴 기호학파와 서인의 학맥이 됨. 이황과 기대승이 8년에 걸쳐 주고받은 사단칠정 논쟁은 조선 성리학의 이론 수준을 크게 끌어올림.'],
 [1613,4,'『동의보감』 간행','허준이 15년에 걸쳐 중국과 조선의 의서를 집대성하고 향약을 정리한 25권 25책을 1610년 완성해 1613년 간행. 병증에서 처방을 찾아가도록 편집해 실용성이 높았고, 중국·일본에서도 거듭 간행되어 세계기록유산에 등재됨.'],
 [1670,3,'실학의 등장','유형원이 『반계수록』에서 신분에 따라 토지를 나누는 균전론을 제시하며 토지 개혁을 실학의 첫 화두로 삼음. 이익은 최소한의 영업전을 보장하는 한전론을, 정약용은 마을 단위 공동 경작의 여전론을 내놓아 농민 문제의 해법을 다툼.'],
 [1708,3,'서학과 세계관의 확대','마테오 리치의 「곤여만국전도」와 『천주실의』가 전해지고 김육의 노력으로 서양 역법에 기초한 시헌력이 채택됨. 홍대용이 『의산문답』에서 지구가 돈다는 지전설과 무한 우주론을 펴, 중국이 세상의 중심이라는 관념이 흔들림.'],
 [1750,3,'진경산수와 풍속화','정선이 중국 화보를 베끼는 대신 금강산과 인왕산을 직접 보고 그린 진경산수를 개척하고, 김홍도가 서민의 일상을, 신윤복이 남녀의 애정을 풍속화로 그림. 조선 고유의 미의식이 확립되고 그림의 주인공이 사대부에서 백성으로 옮겨감.'],
 [1770,3,'서민 문화의 개화','한글 소설 『홍길동전』·『춘향전』이 널리 읽히고 전기수가 이야기를 팔며, 판소리 다섯 바탕과 산대놀이·탈춤이 성행. 사설시조가 형식을 깨고 솔직한 감정과 풍자를 담아, 문화의 향유층이 서민으로 넓어짐.'],
 [1778,3,'북학파','박제가가 『북학의』에서 청의 문물을 배우고 수레와 배를 늘리며 소비가 생산을 부른다고 주장하고, 박지원이 『열하일기』로 청의 실상을 전하며 「양반전」으로 위선을 풍자. 상공업 진흥과 기술 도입을 내세운 이들은 뒤에 개화 사상으로 이어짐.'],
 [1784,3,'천주교의 수용','이승훈이 베이징에서 세례를 받고 돌아와 신앙 공동체가 형성됨 — 선교사 없이 학문으로 들어와 스스로 믿기 시작한 드문 사례. 제사를 거부하고 평등을 말해 유교 질서와 충돌하며 신유박해(1801)·기해박해(1839)·병인박해(1866)로 큰 희생을 치름.'],
 [1796,4,'수원 화성','정조가 정약용의 설계와 거중기·녹로 같은 기계를 써서 2년 9개월에 완성 — 전통 성곽에 서양·중국 기술을 접목한 실학의 결실. 공사 과정을 『화성성역의궤』에 인건비까지 낱낱이 기록해 세계유산 등재의 근거가 됨.'],
 [1818,3,'정약용의 저술','18년 강진 유배 중에 『목민심서』로 지방관의 도리를, 『경세유표』로 국가 제도의 개혁을, 『흠흠신서』로 형법의 신중함을 논해 500여 권을 남김. 실학을 집대성했다고 평가되며, 「기예론」에서 기술이 인간의 삶을 바꾼다고 봄.'],
 [1834,4,'김정호와 『대동여지도』','김정호가 기존 지도와 지리지를 종합해 「청구도」(1834)에 이어 22첩의 「대동여지도」(1861)를 완성 — 축척과 기호를 통일하고 목판으로 새겨 널리 보급함. 이어 붙이면 높이 6.7m에 이르며, 산줄기와 물줄기, 도로에 10리마다 점을 찍어 거리를 표시함.'],
 [1860,3,'동학 창시','최제우가 사람이 곧 하늘이라는 인내천과 후천개벽을 내세워 동학을 창시하고 『동경대전』을 남김. 신분과 남녀를 넘어선 평등을 말해 삼남의 농민에게 급속히 퍼졌으며, 최시형이 교단을 조직해 뒤에 동학농민운동의 사상적·조직적 바탕이 됨.'],
 [1866,3,'위정척사 운동','서양의 통상 요구에 맞서 이항로·기정진 등 유생이 성리학 질서를 지키고 사악한 것을 물리치자는 운동을 폄. 개화파와 대립하며 개항 반대와 을미의병으로 이어져, 항일 의병운동의 사상적 뿌리가 됨.'],
]}]},

{name:'개항과 대한제국', sub:'OPENING · KOREAN EMPIRE',
 spans:[[1876,1897,'개항과 열강 각축'],[1897,1910,'대한제국']],
 events:[
 [1876,2,'강화도 조약','운요호 사건(1875)을 빌미로 체결된 최초의 근대적 조약(조일수호조규). 부산·원산·인천 3개 항 개항과 치외법권, 해안 측량권을 담은 불평등 조약으로, 이후 조미수호통상조약(1882) 등 열강과의 조약이 잇따르며 조선이 세계 체제로 끌려 들어감.'],
 [1880,2,'개화 정책의 시작','통리기무아문을 두고 12사를 설치해 개화 업무를 총괄하고, 신식 군대 별기군을 창설. 일본에 조사시찰단, 청에 영선사를 보내 근대 문물을 살폈으며, 김윤식·김홍집 등 온건 개화파가 청의 양무운동을 모델로 삼음.'],
 [1882,1,'임오군란','신식 별기군에 비해 차별받고 급료마저 밀린 구식 군인들이 봉기해 일본 공사관을 습격하고 흥선대원군이 재집권. 청군이 개입해 진압하고 대원군을 압송했으며, 제물포조약과 조청상민수륙무역장정으로 청의 내정 간섭이 크게 심해짐.'],
 [1883,4,'근대 시설의 도입','태극기가 국기로 제정되고 원산학사가 최초의 근대 학교로 문을 열며, 박문국이 최초의 신문 『한성순보』를, 전환국이 근대 화폐를 발행. 이어 우정총국(1884)·광혜원(1885)·전신(1885)이 들어서 생활의 기반이 바뀌기 시작함.'],
 [1884,2,'갑신정변','김옥균 등 급진 개화파가 우정총국 개국 축하연을 이용해 정변을 일으키고 인민 평등과 내각제, 지조법 개혁을 담은 14개조 정강을 발표. 청군 개입으로 3일 만에 실패했고, 톈진조약(1885)으로 청·일이 동시 철병하며 조선은 두 나라의 각축장이 됨.'],
 [1889,4,'방곡령 사건','흉년으로 곡물이 부족해진 함경도 관찰사가 일본으로의 곡물 유출을 막는 방곡령을 내림. 일본이 조약 위반을 주장해 거액의 배상금을 받아내며, 개항 이후 쌀 유출로 국내 물가가 오르고 농민이 곤궁해지는 구조가 드러남.'],
 [1894,1,'동학농민운동','고부 군수의 학정에 맞선 봉기가 전봉준의 지휘로 확산되어 황토현 승리 뒤 전주성을 점령하고, 폐정개혁 12개조를 조건으로 전주화약을 맺어 집강소에서 자치를 실시. 일본군 개입에 맞선 2차 봉기가 우금치에서 화력에 꺾여 좌절됨.'],
 [1894,2,'갑오개혁','군국기무처가 신분제와 과거제, 연좌제와 조혼을 폐지하고 재정을 탁지아문으로 일원화 — 동학농민군의 요구를 일부 반영한 근대적 개혁. 2차 개혁에서 홍범 14조와 8도를 23부로 개편하는 조치가 이어졌으나, 일본의 영향 아래 진행되어 군제 개혁은 빠짐.'],
 [1895,1,'을미사변과 을미의병','삼국간섭으로 러시아의 영향이 커지자 일본 공사 미우라가 궁궐에 난입해 명성황후를 살해. 이어 단발령과 태양력 시행을 담은 을미개혁이 강행되자 유생과 농민이 국모 복수와 단발령 반대를 내걸고 의병을 일으킴.'],
 [1896,2,'아관파천과 독립협회','신변을 위협받던 고종이 러시아 공사관으로 거처를 옮겨 열강의 이권 침탈이 가속됨. 같은 해 서재필 등이 독립협회를 세우고 한글 『독립신문』을 창간해, 독립문 건립과 만민공동회로 자주·민권·자강 운동을 펼침.'],
 [1897,0,'대한제국 선포','환궁한 고종이 환구단에서 황제로 즉위하고 국호를 대한, 연호를 광무로 정해 자주 독립국임을 선언. 원수부를 두어 군권을 장악하고 양전 사업과 지계 발급으로 근대적 토지 소유권을 확립하려 함.'],
 [1898,2,'만민공동회와 헌의 6조','독립협회가 종로에서 관민이 함께 모인 대회를 열어 재정 공개와 중추원 개편 등 헌의 6조를 채택하고 고종의 재가를 받음. 그러나 공화제를 세우려 한다는 모함으로 협회가 해산되고, 이듬해 황제권을 절대화한 대한국 국제가 반포됨.'],
 [1899,4,'경인선과 광무개혁','노량진-제물포 철도가 개통되고 전차가 서울을 달리며 근대 산업 시설이 들어섬. 상공학교와 기술 교육 기관을 세우고 화폐 제도를 정비했으나, 재정 부족과 러·일의 각축 속에 개혁의 성과는 제한됨.'],
 [1904,1,'러일전쟁과 한일의정서','일본이 대한제국의 중립 선언을 무시하고 개전하며 군사 시설 사용권을 담은 의정서를 강요. 제1차 한일협약으로 재정·외교 고문을 앉혀 고문정치를 시작하고, 황무지 개간권을 요구하다 보안회의 반대 운동에 막힘.'],
 [1905,1,'을사늑약','전쟁에 승리한 일본이 궁궐을 포위한 채 외교권 박탈을 강요하고 통감부를 설치 — 고종은 끝까지 서명하지 않음. 장지연이 「시일야방성대곡」으로 통탄하고 민영환이 자결했으며, 최익현·신돌석 등이 을사의병을 일으킴.'],
 [1905,4,'화폐정리사업과 경제 침탈','일본이 대한제국 화폐를 일본 제일은행권으로 바꾸며 백동화를 헐값에 회수해 국내 상인과 은행이 대거 파산. 철도·광산·삼림의 이권이 넘어가고 차관이 쌓여, 경제적 예속이 정치적 병합에 앞서 완성됨.'],
 [1907,2,'헤이그 특사와 고종 퇴위','고종이 이상설·이준·이위종을 만국평화회의에 보내 늑약의 무효를 호소했으나 참석조차 거부됨. 일본은 이를 구실로 고종을 강제 퇴위시키고 정미7조약으로 차관 정치를 실시하며 군대를 해산시킴.'],
 [1907,1,'정미의병과 서울진공작전','해산된 군인들이 합류해 의병이 전국적 전쟁으로 격화되고, 13도 창의군이 결성되어 이듬해 서울 진공을 시도. 일본군의 남한대토벌작전(1909)으로 국내 기반을 잃은 의병은 만주·연해주로 옮겨 독립군의 모체가 됨.'],
 [1907,2,'국채보상운동과 애국계몽운동','일본 차관을 갚아 경제적 자립을 이루자며 대구에서 시작된 모금이 전국으로 확산되고, 여성들은 비녀와 반지를 내놓음. 같은 해 안창호·양기탁이 신민회를 세워 대성학교·오산학교와 태극서관·자기회사로 실력 양성을 추진함.'],
 [1909,1,'안중근의 하얼빈 의거','안중근이 하얼빈역에서 초대 통감 이토 히로부미를 사살하고, 법정에서 자신은 대한의군 참모중장이며 이는 전쟁 행위라고 주장. 뤼순 감옥에서 동양의 평화를 논한 『동양평화론』을 쓰다 순국함.'],
 [1910,1,'국권 피탈','한일병합조약으로 대한제국이 소멸하고 조선총독부가 설치됨 — 순종의 서명도 국새도 없는 절차적 흠결이 뒤에 조약 무효론의 근거가 됨. 황현 등이 자결로 항거했고, 독립운동의 무대는 만주·연해주·미주로 옮겨감.'],
]},
{name:'일제강점기·독립운동', sub:'COLONIAL RULE · INDEPENDENCE',
 spans:[[1910,1919,'무단통치'],[1919,1931,'문화통치'],[1931,1945,'전시 동원과 민족말살']],
 events:[
 [1910,2,'무단통치와 토지조사사업','헌병경찰이 재판 없이 처벌하는 즉결권을 갖고 조선인의 언론·집회·결사가 금지되며 태형이 시행됨. 1918년까지의 토지조사사업은 신고주의를 이용해 미신고 토지를 총독부 소유로 삼아, 총독부가 최대 지주가 되고 농민은 소작인으로 전락함.'],
 [1910,4,'회사령과 산업 통제','회사 설립을 허가제로 묶어 조선인 자본의 성장을 억누르고, 어업령·광업령·삼림령으로 자원을 장악. 조선을 일본의 식량과 원료 공급지로 못박는 구조가 이 시기에 만들어짐.'],
 [1915,1,'국외 독립운동 기지','서간도에 신흥무관학교가 세워져 3,500여 명의 독립군 지휘관을 길러내고, 연해주 신한촌에 권업회와 대한광복군정부가, 국내에는 대한광복회가 조직됨. 미주에서는 대한인국민회가 외교와 자금을 맡아 국외 독립운동의 그물망이 형성됨.'],
 [1919,2,'3·1 운동','도쿄 유학생의 2·8 독립선언에 이어, 고종 인산일을 계기로 민족대표 33인의 독립선언과 함께 두 달간 전국 1,500여 곳에서 약 200만 명이 참여. 유관순의 아우내 만세와 제암리 학살을 남겼고, 일제는 무단통치를 이른바 문화통치로 바꿈.'],
 [1919,0,'대한민국 임시정부','3·1 운동의 열기 속에 여러 임시정부가 통합되어 상하이에 수립 — 국호를 대한민국, 정체를 민주공화제로 정한 한국 최초의 근대 공화 정부. 연통제와 교통국으로 국내와 연결하고 파리위원부·구미위원부로 외교를 펼침.'],
 [1919,1,'의열단','김원봉이 만주 지린에서 결성해 조선총독부·종로경찰서·동양척식주식회사에 폭탄을 던지고 요인을 처단. 신채호가 지은 「조선혁명선언」을 지침으로 삼아 강도 일본을 몰아내는 직접 행동을 내세웠으며, 뒤에 조선의용대로 발전함.'],
 [1920,1,'봉오동·청산리 대첩','홍범도의 대한독립군이 봉오동에서, 김좌진의 북로군정서가 청산리 일대에서 6일간의 전투로 일본군을 대파 — 독립군 무장투쟁 최대의 승전. 일제의 보복인 간도참변으로 수천 명이 학살되고, 이어 자유시참변(1921)으로 큰 시련을 겪음.'],
 [1920,4,'산미증식계획','일본의 쌀 부족을 조선에서 메우려 수리조합과 품종 개량으로 증산을 추진하고 증산량을 웃도는 양을 반출. 수리조합비가 농민에게 전가되어 조선인 1인당 쌀 소비는 오히려 줄고 만주 잡곡으로 대체되었으며, 소작 조건도 나빠짐.'],
 [1923,2,'물산장려운동과 소작쟁의','조만식 등이 "내 살림 내 것으로"를 내걸고 국산품 애용 운동을 펴고, 암태도 소작인들이 1년여 쟁의로 소작료를 낮추는 데 성공. 노동·농민 운동이 조직화되며 조선노농총동맹과 조선청년총동맹이 결성됨.'],
 [1923,1,'관동대지진 조선인 학살','도쿄 일대의 대지진 혼란 속에 조선인이 우물에 독을 넣었다는 유언비어가 퍼져 자경단과 군경에게 수천 명이 학살됨. 일본 정부의 방조와 이후의 은폐가 오래 문제로 남았으며, 재일 조선인 사회에 깊은 상처를 남김.'],
 [1926,2,'6·10 만세운동과 정우회','순종의 인산일을 기해 학생과 사회주의 계열이 만세 시위를 준비하다 사전에 발각되었으나 일부가 결행. 사회주의 진영이 정우회 선언으로 민족주의와의 협동을 제안해, 이듬해 신간회 결성으로 이어짐.'],
 [1927,2,'신간회와 근우회','비타협적 민족주의와 사회주의가 손잡은 일제강점기 최대의 합법 민족운동 단체로, 전국 140여 지회에 회원 4만 명에 이름. 여성 운동 단체 근우회도 함께 창립되었으며, 광주학생항일운동을 지원하다 내부 노선 갈등으로 1931년 해소됨.'],
 [1929,1,'광주학생항일운동','한일 학생 충돌과 여학생 희롱 사건을 계기로 광주에서 시작된 시위가 전국 320여 개 학교, 5만여 명으로 확산 — 3·1 운동 이후 최대 규모의 항일운동. 같은 해 원산 총파업이 4개월간 이어져 노동 운동도 절정에 이름.'],
 [1931,1,'한중 연합작전','만주사변으로 일본이 만주를 점령하자 한국독립군과 조선혁명군이 중국군과 손잡고 쌍성보·대전자령·영릉가에서 승리. 그러나 일본의 대토벌과 중국 관내로의 이동으로 만주 무장투쟁은 점차 어려워짐.'],
 [1932,1,'이봉창·윤봉길 의거','김구가 조직한 한인애국단 소속으로 이봉창이 도쿄에서 일왕 행렬에, 윤봉길이 상하이 훙커우 공원에서 일본군 수뇌에 폭탄을 던짐. 침체된 임시정부가 중국 국민당의 지원을 얻는 전기가 되었고, 중국 내 한국 독립운동의 위상이 크게 올라감.'],
 [1933,3,'한글 운동과 국학','조선어학회가 「한글 맞춤법 통일안」을 제정하고 『조선말 큰사전』 편찬에 착수 — 오늘날 한글 표기법의 뼈대. 신채호·박은식의 민족주의 사학, 백남운의 사회경제사학, 이병도 등의 진단학회가 각기 식민사관에 맞섬.'],
 [1937,2,'황국신민화 정책','중일전쟁과 함께 황국신민서사 암송과 신사참배, 궁성요배가 강요되고 조선어 교육이 사실상 폐지됨. 창씨개명(1940)과 조선어 신문 폐간이 이어져, 이름과 말과 역사를 지우는 민족말살 정책이 전면화됨.'],
 [1938,1,'국가총동원법과 인적 수탈','국가총동원법이 조선에 적용되어 지원병제(1938)·징용(1939)·징병제(1943)로 수백만 명이 전쟁에 동원됨. 여자정신근로령(1944)과 일본군 위안부 동원으로 여성까지 강제 동원되었으며, 공출로 놋그릇과 식량까지 거둬 감.'],
 [1937,1,'보천보 전투와 국내 진공','동북항일연군의 한인 부대가 함경남도 보천보의 경찰 주재소를 습격해 국내 신문에 크게 보도됨. 국외 무장 세력이 국내로 진입한 사례로 주목받았으며, 이후 만주의 항일 세력은 소련 영내로 이동함.'],
 [1940,1,'한국광복군 창설','충칭의 임시정부가 지청천을 총사령으로 정규 군대를 창설하고 이듬해 대일 선전포고를 함. 인도·미얀마 전선에 공작대를 보내고 미국 OSS와 국내 진공작전을 준비하던 중 일본이 항복해 실행되지 못함.'],
 [1941,2,'대한민국 건국강령','임시정부가 조소앙의 삼균주의(정치·경제·교육의 균등)를 담은 건국강령을 발표 — 광복 후 세울 나라의 청사진. 좌우 세력을 아우르는 통합의 논리였으며, 대한민국 헌법의 균등 이념에 흔적을 남김.'],
 [1942,2,'조선어학회 사건','일제가 학회를 독립운동 단체로 몰아 33명을 검거하고 고문해 이윤재·한징이 옥사 — 사전 원고도 압수됨. 광복 후 서울역 창고에서 원고가 되찾아져 『큰사전』이 완간(1957)되었고, 학술 활동이 곧 저항이었음을 보여줌.'],
 [1943,2,'카이로 선언','미·영·중 수뇌가 "적당한 시기에 한국을 독립시킨다"고 합의해 국제적으로 처음 한국 독립이 약속됨. 임시정부와 독립운동 세력의 외교 노력이 반영된 결과였으나, "적당한 시기"라는 표현이 뒤에 신탁통치 논의의 근거가 됨.'],
 [1945,2,'광복','일본의 항복으로 35년의 식민 지배가 끝남 — 연합국의 승리와 함께 수많은 이의 항쟁이 쌓인 결과였음. 그러나 미·소가 38선을 경계로 분할 진주하고 건국준비위원회와 각 정치 세력이 각축하며, 해방은 곧 분단의 시작이 됨.'],
]},
{name:'대한민국', sub:'REPUBLIC OF KOREA',
 spans:[[1945,1948,'미군정'],[1948,1960,'제1공화국'],[1960,1961,'제2공화국'],[1961,1979,'제3·4공화국'],[1979,1987,'제5공화국'],[1987,2030,'87년 체제']],
 events:[
 [1945,2,'해방 정국','건국준비위원회와 인민공화국, 한국민주당, 임시정부 세력이 각축하는 가운데 미군정이 이들을 모두 인정하지 않음. 모스크바 3상회의의 신탁통치 결정을 두고 좌우가 격렬히 대립하며 이념 대결이 정치의 중심이 됨.'],
 [1946,2,'좌우합작과 분단의 고착','우익의 김규식과 좌익의 여운형이 좌우합작위원회를 만들어 통일 정부를 모색했으나 미소공동위원회가 결렬되고 냉전이 굳어지며 실패. 문제가 유엔으로 넘어가 남한만의 총선거가 결정되자 김구는 「삼천만 동포에게 읍고함」으로 반대함.'],
 [1948,2,'제주 4·3 사건','단독 선거 반대와 경찰·서청의 탄압에 맞선 봉기가 무장 충돌로 번지고, 진압 과정에서 7년에 걸쳐 주민 2만 5천~3만 명이 희생된 것으로 추정됨. 여수·순천 사건이 잇따랐으며, 2000년 특별법 제정으로 진상 규명과 국가의 사과가 이루어짐.'],
 [1948,0,'대한민국 정부 수립','5·10 총선거로 제헌국회가 구성되고 삼권분립과 균등 이념을 담은 제헌헌법이 공포되어 8월 15일 정부가 수립됨. 반민족행위처벌법을 제정했으나 반민특위가 곧 해체되어 친일 청산이 좌절되었고, 북에도 9월 정권이 수립되며 분단이 제도로 굳어짐.'],
 [1949,4,'농지개혁','유상매수·유상분배 원칙으로 지주의 토지를 소작농에게 분배해 조선 이래의 지주제가 해체됨. 자작농 중심 사회가 형성되어 사회 이동성이 커지고 교육 열의가 높아져, 이후 산업화의 인적·사회적 기반이 됨.'],
 [1950,1,'6·25 전쟁','북한의 기습 남침으로 3일 만에 서울이 함락되고, 낙동강 방어선과 인천상륙작전, 중국군 개입을 거치며 3년간 공방. 1953년 정전협정으로 멈췄으나 남북 합쳐 수백만의 사상자와 1천만 이산가족, 분단의 고착을 남기고 한미상호방위조약 체제가 성립함.'],
 [1954,2,'사사오입 개헌','이승만의 3선을 위해 개헌 정족수에 1표가 모자라자 사사오입 논리로 통과를 선포. 진보당 조봉암 사법살인(1959)과 언론 탄압이 이어지며 독재가 심화되고, 이는 4·19의 배경이 됨.'],
 [1960,2,'4·19 혁명','3·15 부정선거에 항거한 시위가 김주열 열사의 시신 발견을 계기로 전국으로 번지고, 대학교수단 시위 끝에 이승만 대통령이 하야. 학생과 시민의 힘으로 독재를 무너뜨린 한국 최초의 민주혁명으로, 내각책임제의 제2공화국이 수립됨.'],
 [1961,2,'5·16 군사정변','박정희 등 군부가 정변으로 집권해 국가재건최고회의를 두고 군정을 실시. 반공과 경제 제일주의를 내세워 1963년 민정 이양 형식으로 제3공화국을 열었으며, 중앙정보부를 통해 정치를 통제함.'],
 [1962,4,'경제개발 5개년 계획','수출 주도와 정부 주도 자원 배분을 축으로 공업화를 추진 — 연평균 10% 안팎의 고도성장이 시작됨. 경공업에서 중화학공업으로 무게를 옮기며 1977년 수출 100억 달러를 달성하지만, 저임금과 재벌 집중, 지역 불균형의 문제를 남김.'],
 [1966,4,'KIST와 과학기술 체제','한국과학기술연구소가 세워지고 이듬해 과학기술처가 발족해, 해외에 있던 한인 과학자를 파격적 조건으로 불러들임. 대덕연구단지(1973)와 정부출연연구소 체계로 이어져, 원조받던 나라가 스스로 기술을 만드는 체제를 갖추기 시작함.'],
 [1964,2,'6·3 항쟁과 한일협정','굴욕적 회담에 반대하는 시위가 계엄으로 진압된 뒤 1965년 한일기본조약이 체결됨. 청구권 자금 5억 달러가 산업화에 쓰였으나 식민 지배의 불법성과 개인 청구권 문제가 정리되지 않아 오늘까지 갈등의 뿌리가 됨.'],
 [1964,1,'베트남 파병','1973년까지 32만여 명을 파병해 미국의 지원과 건설 특수를 얻어 경제 성장의 발판으로 삼음. 5천여 명이 전사하고 고엽제 피해와 민간인 희생 문제가 남았으며, 이 시기 파독 광부·간호사의 송금도 외화 확보에 기여함.'],
 [1970,4,'경부고속도로와 새마을운동','서울-부산 428km가 2년 5개월에 개통되어 전국이 일일 생활권이 되고, 농촌 근대화를 위한 새마을운동이 시작됨. 같은 해 노동자 전태일이 근로기준법 준수를 외치며 분신해, 성장의 그늘에 있던 노동 문제가 사회에 드러남.'],
 [1972,2,'7·4 남북공동성명과 유신','남북이 자주·평화·민족대단결의 통일 3원칙에 처음 합의했으나, 곧 남에서는 유신헌법이, 북에서는 사회주의 헌법이 제정되어 각자의 권력 강화에 쓰임. 유신체제는 대통령 간선제와 긴급조치로 종신 집권의 길을 엶.'],
 [1979,2,'부마항쟁과 10·26','YH무역 사건과 야당 탄압에 이어 부산·마산에서 대규모 항쟁이 일어나고, 10월 26일 박정희 대통령이 중앙정보부장에게 피살되어 유신체제가 붕괴. 그러나 12·12로 신군부가 군권을 장악해 서울의 봄은 짧게 끝남.'],
 [1980,2,'5·18 민주화운동','신군부의 계엄 확대와 공수부대 투입에 맞서 광주 시민이 열흘간 항쟁하고 시민군을 조직해 자치를 이룸. 무력 진압으로 다수가 희생되었으나 관련 기록이 세계기록유산에 등재되었고, 이후 한국 민주화 운동의 정신적 원천이 됨.'],
 [1983,4,'반도체 산업의 출발','삼성이 64K D램 개발에 성공해 미국·일본에 이어 세 번째로 대열에 오르고, 1992년 64M D램을 세계 최초로 내놓으며 메모리 1위에 올라섬. 조립 가공에 머물던 산업 구조가 기술 집약으로 바뀌는 분기점이자, 오늘날 수출의 기둥이면서 미중 기술 경쟁의 한복판에 놓인 자산이 됨.'],
 [1987,2,'6월 민주항쟁','박종철 고문치사와 4·13 호헌조치, 이한열 피격을 계기로 전국 수백만 명이 참여한 시위가 6·29 선언을 이끌어냄. 대통령 직선제 개헌으로 현행 "87년 체제"가 성립했고, 7~9월 노동자 대투쟁으로 노동조합이 폭발적으로 늘어남.'],
 [1988,3,'서울 올림픽','159개국이 참가한 제24회 하계 올림픽으로 세 대회 연속 보이콧으로 얼룩졌던 동서 진영이 12년 만에 한자리에 모임. 소련·중국 등 미수교 사회주의권과의 교류가 열려 북방외교의 발판이 되었고, 전쟁의 폐허에서 일어선 발전상을 세계에 각인시킴.'],
 [1991,2,'남북 유엔 동시 가입','남북이 함께 유엔에 가입하고 화해와 불가침, 교류·협력을 담은 남북기본합의서와 한반도 비핵화 공동선언에 합의. 냉전 해체의 흐름 속에 남북 관계의 기본 틀이 마련되었으나, 곧 북핵 문제로 실행이 가로막힘.'],
 [1993,2,'문민정부와 개혁','32년 만의 민간 정부가 들어서 금융실명제를 전격 실시하고 하나회를 해체하며, 지방자치를 전면 실시(1995). 「역사바로세우기」로 전직 대통령 두 명을 법정에 세웠고, 1996년 OECD에 가입해 선진국 진입을 선언함.'],
 [1996,4,'CDMA 상용화와 정보화','세계에서 처음으로 CDMA 방식 이동전화를 상용 서비스에 올려 통신 장비와 단말 산업이 함께 성장함. 이어 초고속 인터넷 보급률이 2000년대 초 세계 1위에 오르고 전자정부가 자리 잡아, 제조업 뒤에 정보 인프라라는 또 하나의 축이 생김.'],
 [1997,4,'IMF 외환위기','단기 외채와 재벌의 과잉 투자가 겹친 가운데 외환 보유고가 고갈되어 IMF에 구제금융을 신청. 대규모 정리해고와 기업 퇴출로 사회 안전망 없는 고통을 겪고 비정규직이 급증했으며, 금 모으기 운동 등을 거쳐 2001년 지원금을 조기 상환함.'],
 [2000,2,'첫 남북정상회담','김대중 대통령과 김정일 국방위원장이 평양에서 분단 후 첫 정상회담을 갖고 6·15 공동선언을 발표. 이산가족 상봉과 금강산 관광, 개성공단으로 교류가 확대되었고 김대중 대통령은 노벨평화상을 받음.'],
 [2002,3,'한일 월드컵','공동 개최 대회에서 4강에 오르고 수백만 명의 거리 응원이 펼쳐져 새로운 시민 문화가 나타남. 같은 시기 초고속 인터넷 보급률 세계 1위를 기록하며 정보화가 사회 전반을 바꿈.'],
 [2004,2,'탄핵과 정치의 사법화','국회가 노무현 대통령을 탄핵 소추했으나 헌법재판소가 기각하고, 총선에서 여당이 다수를 얻음. 헌법재판소가 주요 정치 갈등을 최종 판단하는 관행이 자리 잡았으며, 같은 해 KTX가 개통되어 전국이 반일 생활권이 됨.'],
 [2016,2,'촛불집회와 대통령 탄핵','국정 농단이 드러나며 수개월간 누적 1,700만 명이 참여한 평화 집회가 이어지고, 국회 탄핵 소추를 헌법재판소가 인용해(2017) 대통령이 파면됨. 헌정 사상 첫 대통령 파면으로, 제도 안에서 권력을 교체한 사례로 기록됨.'],
 [2018,2,'판문점 선언','문재인 대통령과 김정은 위원장이 판문점에서 만나 종전과 비핵화를 논의하고 세 차례 정상회담이 이어짐. 북미 싱가포르 회담(2018)까지 성사되었으나 하노이 회담 결렬(2019) 이후 대화가 다시 멈춤.'],
 [2020,2,'코로나19와 사회 변화','대규모 검사와 추적으로 초기 확산을 억제해 방역 모델로 주목받았으나, 이후 장기 유행 속에 자영업 타격과 돌봄 부담이 커짐. 원격 수업과 재택근무가 일상화되고 비대면 산업이 급성장함.'],

 [2022,4,'누리호 발사 성공','2조 원을 들여 설계부터 엔진까지 자체 기술로 만든 발사체가 6월 2차 발사에서 위성을 궤도에 올림 — 러시아와 함께 만든 나로호(2013)를 넘어선 자력 발사. 1톤급 위성을 스스로 쏠 수 있는 일곱 번째 나라가 되어 우주 산업의 문을 엶.'],
 [2024,2,'12·3 비상계엄','윤석열 대통령이 12월 3일 밤 비상계엄을 선포하고 계엄군이 국회와 중앙선거관리위원회 점거를 시도했으나, 시민이 길을 열고 국회가 4일 새벽 해제 요구 결의를 가결해 6시간 만에 무력화됨. 12월 14일 탄핵소추가 가결되어 직무가 정지되었고, 뒤에 법원이 이를 「내란」으로 규정함.'],
 [2024,2,'저출산과 인구 위기','합계출산율이 0.72로 세계 최저를 기록하고 2020년부터 인구가 자연 감소로 돌아섬. 고령화 속도도 가장 빨라 연금·의료·지방 소멸이 국가적 과제가 되었으며, 성장 모델의 전환이 요구됨.'],
 [2025,2,'대통령 파면과 조기 대선','1월 헌정사상 처음으로 현직 대통령이 체포·구속되고, 4월 4일 헌법재판소가 재판관 만장일치로 탄핵을 인용해 취임 1,061일 만에 파면됨. 6월 3일 보궐 성격의 제21대 대통령 선거에서 이재명 후보가 당선되어 이튿날 취임하며 3년 1개월 만에 정권이 교체됨.'],
 [2025,2,'검찰 개혁과 정부조직 개편','수사와 기소를 분리한다는 원칙 아래 검찰청을 폐지하고 중대범죄수사청과 공소청으로 나누는 정부조직법이 9월 국회를 통과해 10월 시행됨. 1948년 검찰청 설치 이후 형사사법 체계의 골격을 가장 크게 바꾼 개편으로, 실효성을 둘러싼 논쟁이 이어짐.'],

/* ───────── build ───────── */
let dragged=false;   /* 드래그 직후의 click 이벤트를 구분하기 위한 플래그 */
const canvas=document.getElementById('canvas');
const viewport=document.getElementById('viewport');
const tip=document.getElementById('tip');
const active=new Set([0,1,2,3,4]);   /* 범례 필터 상태 */
let evEls=[], bandEls=[];            /* 스크롤 처리용 캐시 — build()가 갱신 */
let keyIndex=new Map(), relSvg=null; /* 사건 키 → 좌표·데이터, 관계선 SVG 레이어 */
const SVGNS='http://www.w3.org/2000/svg';
const fmtY=y=> y<0 ? 'BC '+(-y) : String(y);
const labelW=t=>[...t].reduce((w,ch)=>w+(ch.charCodeAt(0)>0x2000?11.4:6.6),0)+14;

/* 눈금: 배율을 곱한 간격이 130px 이상이 되는 단위를 구간별로 고름 */
function makeTicks(){
  const NICE=[5,10,25,50,100,250,500,1000], t=[];
  for(const [a,b,k] of SEGS){
    const step=NICE.find(s=>s*k*Z>=130)||1000;
    for(let y=Math.ceil(a/step)*step; y<b; y+=step) t.push(y);
  }
  return t;
}

/* 배율이 바뀔 때마다 전체 캔버스를 다시 그린다 (549개 사건 기준 수십 ms) */
function build(){
canvas.innerHTML='';
keyIndex=new Map();
canvas.style.width=totalW()+'px';
const frag=document.createDocumentFragment();

/* axis */
const axis=document.createElement('div'); axis.id='axis';
for(let i=0;i<ERAS.length;i++){
  const [start,name]=ERAS[i], end=(i+1<ERAS.length)?ERAS[i+1][0]:ERAEND;
  const b=document.createElement('div'); b.className='eraband serif';
  b.style.left=X(start)+'px'; b.style.width=(X(end)-X(start))+'px';
  b.dataset.x=X(start); b.dataset.w=X(end)-X(start);
  const bi=document.createElement('i'); bi.textContent=name; b.appendChild(bi);
  axis.appendChild(b);
}
const ticks=makeTicks();
for(const y of ticks){
  const major = y%500===0 || (y>=1392&&y%100===0) || (y>=1876&&y%25===0);
  const t=document.createElement('div'); t.className='tick'+(major?' major':'');
  t.style.left=X(y)+'px';
  const s=document.createElement('span'); s.textContent=fmtY(y); t.appendChild(s);
  axis.appendChild(t);
}
frag.appendChild(axis);

/* vertical gridlines + era shading (behind rows) */
for(let i=0;i<ERAS.length;i++){
  if(i%2===1){
    const start=ERAS[i][0], end=(i+1<ERAS.length)?ERAS[i+1][0]:ERAEND;
    const sh=document.createElement('div'); sh.className='erashadeCol';
    sh.style.left=X(start)+'px'; sh.style.width=(X(end)-X(start))+'px';
    frag.appendChild(sh);
  }
}
for(const y of ticks){
  const g=document.createElement('div');
  g.className='gridline'+((y%500===0||y>=1876&&y%25===0||ERAS.some(e=>e[0]===y))?' major':'');
  g.style.left=X(y)+'px'; frag.appendChild(g);
}
for(const [start] of ERAS){
  const g=document.createElement('div'); g.className='gridline major';
  g.style.left=X(start)+'px'; frag.appendChild(g);
}

/* rows */
for(const region of REGIONS){
  const rh=document.createElement('div'); rh.className='regionhead';
  const rl=document.createElement('span'); rl.className='rl'; rl.textContent=region.name;
  rh.appendChild(rl); frag.appendChild(rh);

  for(const row of region.rows){
    const r=document.createElement('div'); r.className='row';
    const base=document.createElement('div'); base.className='baseline'; r.appendChild(base);

    row.spans.forEach(([a,b,name,pre],i)=>{
      const s=document.createElement('div'); s.className='span'+(i%2?' alt':'')+(pre?' pre':'');
      const x1=Math.max(X(a),RAIL), x2=X(Math.min(b,2026));
      if(x2-x1<6)return;
      s.style.left=x1+'px'; s.style.width=(x2-x1-2)+'px';
      s.dataset.x=x1; s.dataset.w=x2-x1-2;
      if(x2-x1>46){const i=document.createElement('i');i.textContent=name;s.appendChild(i);}
      s.title=name+' ('+fmtY(a)+' ~ '+(b>=2030?'현재':fmtY(b))+')';
      r.appendChild(s);
    });

    /* stagger labels onto 4 shelves */
    /* 라벨 선반: 기준선(BASE=75) 위·아래로 번갈아 배치 */
    const shelves=[{y:41,end:-1e9},{y:91,end:-1e9},{y:57,end:-1e9},{y:109,end:-1e9},{y:25,end:-1e9},{y:127,end:-1e9}];
    const evs=[...row.events].sort((a,b)=>a[0]-b[0]);
    /* 같은 해에 사건이 여럿이면 점이 정확히 겹쳐 위의 것만 잡히므로,
       두 번째부터 7px씩 오른쪽으로 비켜 놓는다 (밀집 구간에서 1~2년어치라 연도 왜곡은 없음) */
    const usedX={};
    for(const [year,cat,title,desc] of evs){
      const x0=X(year), w=labelW(title);
      const n=usedX[x0]|0; usedX[x0]=n+1;
      const x=x0+n*7;
      let shelf=shelves.find(s=>x>s.end+8);
      if(!shelf)shelf=shelves.reduce((m,s)=>s.end<m.end?s:m);
      shelf.end=x+w;
      const e=document.createElement('div'); e.className='ev'; e.dataset.cat=cat;
      e.style.left=x+'px';
      if(!active.has(cat))e.classList.add('dim');   /* 재빌드 시 필터 상태 유지 */
      const color='var(--c'+cat+')';
      const dot=document.createElement('div'); dot.className='dot'; dot.style.background=color;
      e.appendChild(dot);
      if(Math.abs(shelf.y-BASE)>20){
        const c=document.createElement('div'); c.className='conn';
        if(shelf.y<BASE){c.style.top=(shelf.y+15)+'px'; c.style.height=(BASE-5-shelf.y-15)+'px';}
        else{c.style.top=(BASE+5)+'px'; c.style.height=(shelf.y-BASE-5)+'px';}
        e.appendChild(c);
      }
      const l=document.createElement('div'); l.className='lbl';
      l.style.top=shelf.y+'px'; l.textContent=title;
      e.appendChild(l);
      e.dataset.x=x; e.dataset.w=w;
      const key=row.name+'|'+year+'|'+title;
      e.dataset.key=key;
      if(relAdj.has(key))e.classList.add('hasrel');
      keyIndex.set(key,{el:e,x,year,cat,title,desc,rowName:row.name,y:0,rowTop:0});
      e.tabIndex=0; e.setAttribute('role','button');
      e.setAttribute('aria-label',koreanYear(year)+' '+row.name+' — '+title);
      e.addEventListener('mouseenter',ev=>{
        showTip(ev,year,cat,title,desc,row.name,key);
        if(!pinned)showRel(key);   /* 마우스오버만으로 관계 표시 (핀 상태가 우선) */
      });
      e.addEventListener('mousemove',moveTip);
      e.addEventListener('mouseleave',()=>{
        if(!pinned){tip.style.display='none'; clearRel();}
      });
      e.addEventListener('click',ev=>{
        if(dragged)return;   /* 드래그로 스크롤한 직후의 클릭은 무시 */
        ev.stopPropagation();
        pinTip(e,year,cat,title,desc,row.name);
      });
      e.addEventListener('focus',()=>{
        /* 마우스 클릭도 포커스를 주므로, 그때는 click 쪽에만 맡긴다.
           둘 다 pinTip을 부르면 핀이 켜졌다 곧바로 꺼져 고정이 안 됨 */
        if(!e.matches(':focus-visible'))return;
        e.scrollIntoView({block:'nearest',inline:'center',behavior:'auto'});
        pinTip(e,year,cat,title,desc,row.name);
      });
      e.addEventListener('keydown',ev=>{
        if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pinTip(e,year,cat,title,desc,row.name);}
      });
      r.appendChild(e);
    }

    const lab=document.createElement('div'); lab.className='rowlabel';
    lab.innerHTML='<b>'+row.name+'</b><small>'+row.sub+'</small>';
    r.prepend(lab);
    frag.appendChild(r);
  }
}
canvas.appendChild(frag);

/* 스크롤 처리용 캐시 갱신 */
evEls=[...canvas.querySelectorAll('.ev')].map(el=>({el, x:+el.dataset.x, w:+el.dataset.w, behind:false}));
bandEls=[...canvas.querySelectorAll('.eraband, .span')].filter(el=>el.querySelector('i'))
  .map(el=>({i:el.querySelector('i'), x:+el.dataset.x, w:+el.dataset.w, tx:-1}));

/* 관계선 SVG 오버레이 + 사건별 세로 좌표 캐시 (레이아웃 확정 후 계산) */
relSvg=document.createElementNS(SVGNS,'svg');
relSvg.id='relsvg';
relSvg.innerHTML='<defs><marker id="arrowm" viewBox="0 0 10 10" refX="8.5" refY="5"'
 +' markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">'
 +'<path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs><g id="relg"></g>';
canvas.appendChild(relSvg);
for(const info of keyIndex.values()){
  info.rowTop=info.el.parentElement.offsetTop;
  info.y=info.rowTop+BASE;
}
}
build();

/* ───────── tooltip ───────── */
function eraOf(y){let n=ERAS[0][1];for(const[s,name]of ERAS){if(y>=s)n=name}return n}
function koreanYear(y){return y<0?'기원전 '+(-y)+'년':y+'년'}
const isTouch=matchMedia('(hover: none)').matches;
let pinned=null;
/* 사건 이미지 블록. 자리를 미리 차지하되 로드 실패 시 스스로 접혀,
   오프라인(file://)에서는 이미지가 없던 때와 똑같이 보임 */
function imgHTML(key){
  const m=key&&IMGS[key]; if(!m)return '';
  return '<div class="tim"><img alt="" decoding="async" referrerpolicy="no-referrer" src="'
    +IMGB+m[0]+'"></div>'
    +'<a class="tsrc" href="https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(m[1])
    +'" target="_blank" rel="noreferrer">이미지: 위키미디어 공용</a>';
}
function fillTip(year,cat,title,desc,country,key){
  tip.innerHTML='<div class="ty">'+koreanYear(year)+' · '+country+'</div>'
    +'<div class="tt">'+title+'</div>'+imgHTML(key)+'<div class="td">'+desc+'</div>'
    +'<div class="tc"><i style="background:var(--c'+cat+')"></i>'+CATS[cat].n+' · '+eraOf(year)+'</div>';
  const im=tip.querySelector('.tim img');
  if(im){
    const box=im.parentElement;
    /* 원본이 박스보다 작으면 cover로 늘리면 흐려지므로 원본 크기로 맞춰 보여준다 */
    const mark=()=>{
      if(im.naturalWidth<box.clientWidth||im.naturalHeight<box.clientHeight)box.classList.add('fit');
      box.classList.add('on');
    };
    if(im.complete&&im.naturalWidth)mark();   /* 캐시된 이미지 */
    else{
      im.addEventListener('load',mark,{once:true});
      im.addEventListener('error',()=>box.classList.add('off'),{once:true});
    }
  }
}
function showTip(ev,year,cat,title,desc,country,key){
  if(pinned)return;
  fillTip(year,cat,title,desc,country,key);
  /* 관계가 있으면 힌트 한 줄 — 클릭하면 연결이 그려진다는 안내 */
  const rels=key&&relAdj.get(key);
  if(rels&&rels.length)tip.insertAdjacentHTML('beforeend',
    '<div class="rlhint">연관 사건 '+rels.length+'건 — 클릭하면 목록과 함께 고정</div>');
  tip.classList.remove('sheet'); tip.style.display='block'; moveTip(ev);
}
function moveTip(ev){
  if(pinned)return;
  const w=tip.offsetWidth,h=tip.offsetHeight, M=10;
  let x=ev.clientX+16,y=ev.clientY+14;
  if(x+w>innerWidth-M)x=ev.clientX-w-14;
  if(y+h>innerHeight-M)y=ev.clientY-h-12;
  /* 화면 밖으로 밀리지 않도록 최종 클램프 */
  x=Math.min(Math.max(M,x),Math.max(M,innerWidth-w-M));
  y=Math.min(Math.max(M,y),Math.max(M,innerHeight-h-M));
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
/* 클릭/터치: 하단 시트로 고정 표시 + 연관 사건 연결 표시 */
function pinTip(el,year,cat,title,desc,country){
  if(pinned===el){hideTip();return;}
  if(pinned)pinned.classList.remove('sel');
  pinned=el; el.classList.add('sel');
  fillTip(year,cat,title,desc,country,el.dataset.key);
  tip.insertAdjacentHTML('beforeend',relChipsHTML(el.dataset.key));
  showRel(el.dataset.key);
  tip.classList.add('sheet');
  tip.style.left=''; tip.style.top='';
  tip.style.display='block';
}
function hideTip(){
  if(pinned)pinned.classList.remove('sel');
  pinned=null; tip.style.display='none'; tip.classList.remove('sheet');
  clearRel();
}

/* ───────── 사건 간 관계 표시 ───────── */
function clearRel(){
  canvas.classList.remove('relmode');
  const g=relSvg&&relSvg.querySelector('#relg');
  if(g)g.innerHTML='';
  for(const el of canvas.querySelectorAll('.ev.rel'))el.classList.remove('rel');
}
function showRel(key){
  clearRel();
  const rels=relAdj.get(key); if(!rels||!rels.length)return;
  const a=keyIndex.get(key); if(!a)return;
  canvas.classList.add('relmode');
  a.el.classList.add('rel');   /* 기준 사건도 강조 대상에 포함 */
  for(const r of rels){
    const b=keyIndex.get(r.key); if(!b)continue;
    b.el.classList.add('rel');
    /* 인과는 원인→결과 방향으로 화살표를 그린다 */
    if(r.type==='cause'&&r.dir==='in')drawLink(b,a,'cause');
    else drawLink(a,b,r.type);
  }
}
function drawLink(a,b,type){
  const g=relSvg.querySelector('#relg');
  const x1=a.x,y1=a.y,x2=b.x,y2=b.y;
  let d;
  if(y1===y2){          /* 같은 행: 기준선 위로 아치 */
    const cy=y1-58;
    d=`M ${x1} ${y1} C ${x1+(x2-x1)*.25} ${cy}, ${x1+(x2-x1)*.75} ${cy}, ${x2} ${y2}`;
  }else if(Math.abs(x2-x1)<24){   /* 같은 해 다른 행: 옆으로 불룩한 세로 곡선 */
    const bx=Math.max(x1,x2)+56;
    d=`M ${x1} ${y1} C ${bx} ${y1}, ${bx} ${y2}, ${x2} ${y2}`;
  }else{
    d=`M ${x1} ${y1} C ${x1+(x2-x1)*.4} ${y1}, ${x1+(x2-x1)*.6} ${y2}, ${x2} ${y2}`;
  }
  const p=document.createElementNS(SVGNS,'path');
  p.setAttribute('d',d);
  p.setAttribute('fill','none');
  p.setAttribute('stroke',type==='cause'?'var(--accent)':'var(--ink3)');
  p.setAttribute('stroke-width','1.6');
  p.setAttribute('opacity','.85');
  if(type==='link')p.setAttribute('stroke-dasharray','5 4');
  else p.setAttribute('marker-end','url(#arrowm)');
  g.appendChild(p);
}
/* 툴팁의 연관 사건 목록 (핀 상태에서만 표시) */
function relChipsHTML(key){
  const rels=relAdj.get(key); if(!rels||!rels.length)return '';
  const items=rels.map(r=>{
    const t=keyIndex.get(r.key); if(!t)return '';
    const glyph=r.type==='cause'?(r.dir==='out'?'결과 →':'← 원인'):'연관';
    return '<button type="button" class="relchip" data-key="'+r.key.replace(/"/g,'&quot;')+'">'
      +'<span class="rc1"><i style="background:var(--c'+t.cat+')"></i>'
      +t.rowName+' · '+koreanYear(t.year)+' · <b>'+t.title+'</b><em>'+glyph+'</em></span>'
      +'<span class="rc2">'+r.note+'</span></button>';
  }).join('');
  return '<div class="rl2"><b>연관 사건 '+rels.length+'건</b>'+items+'</div>';
}
/* 칩 클릭 → 해당 사건으로 이동하며 핀 전환 */
tip.addEventListener('click',ev=>{
  const c=ev.target.closest('.relchip'); if(!c)return;
  const t=keyIndex.get(c.dataset.key); if(!t)return;
  viewport.scrollTo({
    left:Math.max(0,t.x-(viewport.clientWidth+RAIL)/2),
    top:Math.max(0,t.rowTop-(viewport.clientHeight-134)/2),
    behavior:smooth
  });
  pinTip(t.el,t.year,t.cat,t.title,t.desc,t.rowName);
});
/* 빈 곳을 탭하면 닫기 */
viewport.addEventListener('click',e=>{if(pinned&&!e.target.closest('.ev'))hideTip();});
addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});

/* ───────── legend filter ───────── */
const legend=document.getElementById('legend');
CATS.forEach((c,i)=>{
  const b=document.createElement('button'); b.type='button'; b.className='chip on';
  b.innerHTML='<span class="dot" style="background:var('+c.v+')"></span>'+c.n;
  b.setAttribute('aria-pressed','true');
  b.addEventListener('click',()=>{
    if(active.has(i)&&active.size===1){for(let k=0;k<5;k++)active.add(k);}
    else if(active.size===5){active.clear();active.add(i);}
    else if(active.has(i)){active.delete(i);if(active.size===0)for(let k=0;k<5;k++)active.add(k);}
    else active.add(i);
    document.querySelectorAll('#legend .chip').forEach((el,k)=>{
      el.className='chip '+(active.has(k)?'on':'off');
      el.setAttribute('aria-pressed',active.has(k));
    });
    document.querySelectorAll('.ev').forEach(el=>{
      el.classList.toggle('dim',!active.has(+el.dataset.cat));
    });
  });
  legend.appendChild(b);
});

/* ───────── era navigation ───────── */
const smooth=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
const eranav=document.getElementById('eranav');
[['처음',-3000],...ERAS.slice(1).map(e=>[e[1],e[0]]),['오늘',2026]].forEach(([name,y])=>{
  const b=document.createElement('button'); b.type='button'; b.textContent=name;
  b.addEventListener('click',()=>{
    /* 한국사는 시기마다 활성 행이 달라(삼국은 위쪽, 근현대는 아래쪽) 가로만 옮기면
       빈 행만 보인다. 그 시기에 사건이 있는 첫 행으로 세로 위치까지 맞춰 준다 */
    let top=null;
    for(const info of keyIndex.values()){
      if(Math.abs(info.year-y)>60)continue;
      if(top===null||info.rowTop<top)top=info.rowTop;
    }
    viewport.scrollTo({
      left:Math.max(0,X(y)-RAIL-60),
      top:top===null?viewport.scrollTop:Math.max(0,top-70),
      behavior:smooth
    });
  });
  eranav.appendChild(b);
});

/* ───────── zoom ───────── */
const zin=document.getElementById('zin'), zout=document.getElementById('zout'), zval=document.getElementById('zval');
/* anchorYear가 focusPx(뷰포트 안 화면 x) 자리에 그대로 남도록 배율을 바꾼다 */
function setZoom(n, anchorYear, focusPx){
  n=Math.max(0,Math.min(ZOOMS.length-1,n));
  if(n===zi)return;
  if(focusPx==null)focusPx=(viewport.clientWidth+RAIL)/2;
  if(anchorYear==null)anchorYear=invX(viewport.scrollLeft+focusPx);
  const st=viewport.scrollTop;
  zi=n; Z=ZOOMS[zi];
  hideTip();
  build();
  viewport.scrollLeft=Math.max(0, X(anchorYear)-focusPx);
  viewport.scrollTop=st;
  zval.textContent=Math.round(Z*100)+'%';
  zout.disabled=zi===0; zin.disabled=zi===ZOOMS.length-1;
  updateReadout(); updateBehind(); updateStickyLabels();
}
zin.addEventListener('click',()=>setZoom(zi+1));
zout.addEventListener('click',()=>setZoom(zi-1));
/* Ctrl(⌘)+휠, 트랙패드 핀치: 커서가 가리키는 연도를 고정점으로 확대/축소 */
viewport.addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey)return;
  e.preventDefault();
  const fx=e.clientX-viewport.getBoundingClientRect().left;
  setZoom(zi+(e.deltaY<0?1:-1), invX(viewport.scrollLeft+fx), fx);
},{passive:false});

/* ───────── readout ───────── */
const readout=document.getElementById('readout');
function updateReadout(){
  const cx=viewport.scrollLeft+(viewport.clientWidth+RAIL)/2;
  const y=Math.round(invX(cx));
  readout.innerHTML='<b>'+(y<0?'BC '+(-y):y)+'</b><span>'+eraOf(y)+' · 화면 중앙 연도</span>';
}
/* ───────── 레일에 가려지는 라벨 숨김 ───────── */
function updateBehind(){
  const sl=viewport.scrollLeft, edge=sl+RAIL+6;
  for(const it of evEls){
    /* 레일과 겹치는 구간(라벨 시작점이 레일 뒤, 끝점은 아직 레일 오른쪽)만 숨김.
       완전히 왼쪽으로 지나간 것은 어차피 보이지 않으므로 건드리지 않는다. */
    const behind = it.x < edge && it.x + it.w > sl;
    if(behind!==it.behind){it.behind=behind; it.el.classList.toggle('behind',behind);}
  }
}
/* ───────── 시대·왕조 밴드 라벨을 화면 안쪽에 붙여 두기 ─────────
   부모가 sticky/absolute 문맥이라 CSS position:sticky가 듣지 않으므로
   스크롤에 맞춰 transform으로 직접 밀어 준다. */
function updateStickyLabels(){
  const edge=viewport.scrollLeft+RAIL+14;
  for(const b of bandEls){
    const lw=b.i.offsetWidth;
    /* 밴드 왼쪽이 레일에 가리면 그만큼 오른쪽으로 밀되, 밴드 끝을 넘지 않게 */
    let tx=Math.max(0,Math.min(edge-b.x, b.w-lw-4));
    tx=Math.max(0,tx);
    if(tx!==b.tx){b.tx=tx; b.i.style.transform=tx?'translateX('+tx+'px)':'';}
  }
}
let raf=0;
function onScroll(){
  updateReadout();
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;updateBehind();updateStickyLabels()});
}
viewport.addEventListener('scroll',onScroll,{passive:true});
updateReadout(); updateBehind(); updateStickyLabels();

/* ───────── drag to pan ───────── */
let drag=null;
viewport.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  drag={x:e.clientX,y:e.clientY,sl:viewport.scrollLeft,st:viewport.scrollTop,id:e.pointerId,moved:false};
});
viewport.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;viewport.classList.add('dragging');viewport.setPointerCapture(drag.id);}
  if(drag.moved){viewport.scrollLeft=drag.sl-dx;viewport.scrollTop=drag.st-dy;}
});
['pointerup','pointercancel'].forEach(t=>viewport.addEventListener(t,()=>{
  if(drag&&drag.moved){
    viewport.classList.remove('dragging');
    dragged=true; setTimeout(()=>dragged=false,0);   /* 뒤이어 오는 click 한 번만 무시 */
  }
  drag=null;
}));

/* keyboard */
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')viewport.scrollBy({left:320,behavior:smooth});
  else if(e.key==='ArrowLeft')viewport.scrollBy({left:-320,behavior:smooth});
  else if(e.key==='+'||e.key==='=')setZoom(zi+1);
  else if(e.key==='-')setZoom(zi-1);
});
</script>
