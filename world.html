 events:[
 [-209,0,'흉노 제국','묵돌 선우가 초원 부족을 통합해 최초의 유목 제국을 세우고 한 고조를 백등산에서 포위. 이후 한과 화친·전쟁을 반복하며 정주 문명과 유목 세력이 대립하는 구도를 만듦.'],
 [48,2,'흉노의 남북 분열','계승 다툼과 가뭄으로 흉노가 갈라져 남흉노는 한에 복속하고 북흉노는 한·남흉노 연합군에 밀려 서쪽으로 이동. 초원의 주인은 선비와 유연으로 바뀌었고, 서천한 세력이 훗날 유럽을 뒤흔든 훈족과 이어진다는 설이 제기됨.'],
 [552,0,'돌궐 제국','아사나씨가 유연을 무너뜨리고 몽골 초원에서 중앙아시아까지 아우르는 대제국을 세움. 오르콘 비문에 남긴 돌궐 문자는 튀르크계 최초의 문자 기록으로, 이후 튀르크 민족 확산의 출발점이 됨.'],
 [744,1,'돌궐 멸망','위구르가 바스밀·카를룩과 손잡고 마지막 카간을 죽여 200년 돌궐 제국이 끝남. 초원의 패권은 위구르로 넘어가 안사의 난 때 당을 도우며 교역으로 번영했으나, 840년 키르기스에 무너지자 그 일파가 서쪽으로 옮겨 오늘날 신장 지역 튀르크화의 뿌리가 됨.'],
 [751,1,'탈라스 전투','아바스 왕조군이 당군을 꺾으며 중앙아시아의 주도권이 이슬람권으로 넘어감. 이때 붙잡힌 당의 기술자를 통해 제지술이 서방으로 전해지는 계기가 되었다고 전해짐.'],
 [1206,0,'몽골 제국 건국','테무친이 초원 부족을 통일하고 쿠릴타이에서 칭기즈 칸으로 추대됨. 십진법 군제와 능력 위주의 발탁으로 인구 100만의 유목 사회가 세계 정복에 나섬.'],
 [1219,1,'호라즘 원정','사신 살해를 구실로 서방 원정에 나서 사마르칸트·부하라 등 중앙아시아 도시들을 초토화. 관개 시설이 파괴되며 이 지역은 이후 오랫동안 회복하지 못함.'],
 [1227,2,'칭기즈 칸 사망','서하 원정 중 사망하며 제국은 아들들에게 분봉되어 4대 칸국 체제로 이어짐. 사후에도 정복은 계속되어 오고타이 대에 유라시아 동서로 판도가 확장됨.'],
 [1241,1,'유럽 원정','바투의 군대가 러시아 공국들을 굴복시키고 폴란드·헝가리군을 레그니차와 모히에서 격파. 오고타이 칸의 사망 소식에 회군하면서 서유럽은 침공을 면했고, 러시아에는 240년의 킵차크 칸국 지배가 시작됨.'],
 [1260,2,'제국의 분열','쿠빌라이와 아리크부카의 계승 전쟁으로 제국의 통일성이 사실상 무너짐. 이후 원·킵차크·차가타이·일 칸국이 각자의 길을 걸으며 현지 문화에 동화됨.'],
 [1271,4,'팍스 몽골리카','역참(잠치)망이 유라시아를 연결하면서 상인과 사절이 안전하게 대륙을 왕래하게 됨. 마르코 폴로의 여행과 화약·나침반의 서전이 이 시기에 이루어졌으나, 흑사병의 확산 통로가 되기도 함.'],
 [1368,1,'원의 북귀','명에 밀려난 몽골 세력이 초원으로 물러나 북원을 이어감. 이후 오이라트와 타타르로 갈라져 1449년 토목보의 변에서 명 황제를 사로잡는 등 명과 200년간 대치함.'],
 [1370,0,'티무르 제국','사마르칸트에서 일어난 티무르가 중앙아시아와 페르시아, 인도 북부까지 정복. 정복 뒤에는 학자와 장인을 모아 사마르칸트를 꾸며 티무르 르네상스라 불리는 문화 융성을 이룸.'],
 [1420,4,'울루그베그 천문대','티무르의 손자 울루그베그가 사마르칸트에 대형 천문대를 세우고 1,018개 항성의 목록을 편찬. 그 정밀도는 이후 200년간 깨지지 않아 이슬람 천문학의 정점으로 평가됨.'],
 [1449,1,'토목보의 변','오이라트의 에센이 친정에 나선 명 영종을 토목보에서 사로잡으며 명에 충격을 안김. 이후 명은 공세를 포기하고 만리장성 증축과 방어 위주 전략으로 전환함.'],
 [1507,1,'티무르 제국 멸망','우즈베크 샤이바니 왕조가 헤라트를 함락해 137년의 티무르 제국이 소멸함. 사마르칸트를 잃고 떠돌던 티무르의 5대손 바부르가 남쪽으로 활로를 찾아 인도에서 무굴 제국을 세우며 제국의 계보와 페르시아풍 궁정 문화가 아대륙으로 옮겨감.'],
 [1578,3,'티베트 불교 수용','알탄 칸이 소남 갸초에게 "달라이 라마" 칭호를 내리며 몽골이 티베트 불교를 널리 받아들임. 이후 몽골 사회의 종교·문자 생활이 재편되고 티베트와의 유대가 굳어짐.'],
 [1691,2,'청의 지배','할하 몽골이 준가르의 압박 속에 청에 복속하며 외몽골이 청의 판도에 들어감. 청은 맹기제로 유목 사회를 재편했고 준가르는 18세기 중엽 건륭제에게 소멸됨.'],
 [1757,1,'준가르의 멸망','건륭제가 마지막 유목 제국 준가르를 정벌하고 그 땅을 "신장(新疆)"으로 편입. 수천 년 이어진 초원 유목 세력과 중원 왕조의 대결 구도가 최종적으로 막을 내림.'],
 [1921,0,'몽골 독립','신해혁명을 계기로 자치를 선언한 뒤 소련의 지원으로 독립을 굳히고 1924년 인민공화국을 수립. 소련에 이은 세계 두 번째 사회주의 국가가 되어 70년간 위성국으로 존속함.'],
 [1990,2,'민주화와 시장경제','소련 붕괴와 함께 무혈 민주혁명으로 복수정당제와 시장경제로 전환. 이후 풍부한 광물 자원 개발로 성장했으나 중국·러시아 사이의 지정학적 균형이 과제로 남음.'],
 [1991,0,'중앙아시아 5개국 독립','소련 해체로 카자흐스탄·우즈베키스탄 등 5개 공화국이 독립하며 오랜 러시아 지배가 끝남. 석유·가스·우라늄 자원과 지정학적 위치로 강대국 각축의 무대가 됨.'],
]}]},

{name:'남아시아 · 서아시아', rows:[
{name:'인도', sub:'INDIA',
 spans:[[-2600,-1900,'인더스 문명'],[-1500,-500,'베다 시대'],[-322,-185,'마우리아'],[320,550,'굽타'],[1206,1526,'델리 술탄국'],[1526,1857,'무굴 제국'],[1858,1947,'영국령 인도'],[1947,2030,'독립 인도']],
 events:[
 [-2600,0,'인더스 문명','모헨조다로·하라파 등 격자형 도로와 배수 시설, 공공 목욕장을 갖춘 계획도시 문명. 인장에 새겨진 문자는 아직 해독되지 않았으며, 기원전 1900년경 기후 변화 등으로 쇠퇴한 것으로 추정됨.'],
 [-1500,3,'베다 시대','중앙아시아에서 아리아인이 이주하며 최고(最古) 문헌 『리그베다』가 성립. 브라만교와 바르나(카스트) 신분 질서가 형성되어 인도 사회의 기층이 됨.'],
 [-1000,3,'우파니샤드와 서사시','제의 중심의 브라만교를 넘어 범아일여(梵我一如)를 탐구하는 우파니샤드 철학이 형성되고, 『마하바라타』·『라마야나』 두 서사시가 전승됨. 윤회와 업(카르마) 관념이 인도 사상의 공통 기반이 됨.'],
 [-563,3,'석가모니 탄생','샤카족의 왕자 고타마 싯다르타가 카필라바스투를 떠나 출가해 보드가야에서 깨달음을 얻고 불교를 창시. 제의와 카스트 대신 사성제·팔정도의 실천을 설한 가르침은 도시의 상인·수공업 계층에게 지지를 받으며 아시아 전역으로 퍼짐(생몰년은 기원전 6~5세기로 학설이 갈림).'],
 [-500,3,'자이나교 성립','마하비라가 철저한 불살생(아힘사)과 무소유를 설하며 자이나교를 확립. 불교와 함께 베다 제의와 카스트를 비판한 사문(沙門) 전통을 이뤘고, 아힘사 사상은 훗날 간디에게 이어짐.'],
 [-322,0,'마우리아 제국','찬드라굽타가 알렉산드로스 철수 후의 혼란을 틈타 북인도를 아우른 최초의 통일 제국을 건설. 재상 카우틸랴의 『아르타샤스트라』는 고대의 대표적 통치술 문헌으로 남음.'],
 [-261,3,'아소카왕의 개종','칼링가 정복 전쟁에서 10만이 희생된 참상을 보고 불교에 귀의, 무력 대신 다르마(법)에 의한 통치를 선언. 각지의 석주 칙령과 포교 사절단으로 불교가 세계 종교로 도약함.'],
 [-185,1,'마우리아 멸망','아소카 사후 지방 총독들이 자립하고 재정이 무너진 끝에 마지막 왕이 장군 푸샤미트라에게 살해되어 137년의 첫 통일 제국이 끝남. 슝가 왕조가 브라만교를 되살리며 불교 후원이 끊기고, 북인도는 다시 여러 나라로 갈라져 이민족의 진입로가 됨.'],
 [150,3,'간다라 미술과 대승불교','쿠샨 왕조 카니슈카 치세에 헬레니즘 조각술과 결합한 최초의 불상이 만들어지고, 나가르주나의 공(空) 사상으로 대승불교가 체계화됨. 이 양식과 교리가 실크로드를 따라 동아시아 전역에 전해짐.'],
 [320,0,'굽타 제국','찬드라굽타 1세가 개창한 힌두 고전 문화의 황금기. 십진법과 숫자 0의 정립, 아리아바타의 천문학, 칼리다사의 산스크리트 문학이 꽃피고 힌두교가 사회에 정착함.'],
 [499,4,'아리아바타와 숫자 0','아리아바타가 원주율을 3.1416으로 계산하고 지구 자전을 논했으며, 브라마굽타(628)가 0을 수로 다루는 연산 규칙을 정립. 이 십진 기수법은 아랍을 거쳐 유럽에 전해져 근대 수학의 토대가 됨.'],
 [550,1,'굽타 멸망','중앙아시아에서 내려온 에프탈(백훈)의 잇단 침입과 지방 세력의 자립으로 230년의 굽타가 해체됨. 하르샤의 짧은 통일(606~647)을 빼면 북인도는 이슬람 세력이 들어올 때까지 여러 왕국이 다투는 시대가 이어지나, 굽타가 세운 힌두 고전 문화는 오히려 각지로 퍼짐.'],
 [800,3,'샹카라와 힌두교 부흥','샹카라가 불이일원론(아드바이타 베단타)으로 힌두 철학을 체계화하고 각지에 수도원을 세움. 이후 박티(신애) 신앙이 대중에 퍼지며 인도에서 불교가 쇠퇴하고 힌두교가 주류로 복귀함.'],
 [1001,1,'가즈니 왕조의 침입','아프가니스탄의 마흐무드가 17차례 북인도를 침공해 사원들을 약탈. 이슬람 세력의 남하가 본격화되어 인도 아대륙의 종교 지형이 재편되기 시작함.'],
 [1206,0,'델리 술탄국','고르 왕조의 노예 출신 장군 아이바크가 델리에 이슬람 왕조를 개창하고 승전탑 쿠트브 미나르를 세움. 이후 320년간 다섯 왕조가 교체되며 북인도의 이슬람 지배가 이어졌고, 힌두교도에게 인두세(지즈야)를 물리는 한편 페르시아 문화와 인도 전통이 섞여 우르두어와 인도-이슬람 건축 양식이 태어남.'],
 [1469,3,'시크교 창시','구루 나낙이 힌두교와 이슬람을 넘어선 유일신 신앙과 카스트 부정을 설하며 시크교를 창시. 열 명의 구루를 거쳐 암리차르 황금사원을 중심으로 펀자브의 독자적 종교 공동체를 이룸.'],
 [1498,4,'바스쿠 다 가마 도착','희망봉을 돌아 캘리컷에 도착하며 유럽-인도 직항로를 개통. 향신료 무역의 주도권이 이슬람·베네치아 상인에게서 대서양 연안국으로 넘어가는 전환점이 됨.'],
 [1526,0,'무굴 제국','티무르와 칭기즈 칸의 후예를 자처한 바부르가 화포와 기병으로 파니파트에서 델리 술탄국의 대군을 꺾고 건국. 3대 아크바르의 관용 정책으로 아대륙 대부분을 아우르며 17세기에는 세계 GDP의 4분의 1가량을 차지하는 최대 경제권이 됨.'],
 [1556,2,'아크바르의 통치','13세에 즉위한 아크바르가 힌두교도에 대한 인두세(지즈야)를 폐지하고 라지푸트와 혼인 동맹을 맺어 종교 화합 정책을 폄. 만사브다르 관료제와 토지 조사로 무굴 통치 체제를 완성함.'],
 [1600,4,'영국 동인도회사 설립','엘리자베스 1세의 특허장으로 설립된 주식회사가 인도 무역을 독점. 자체 군대와 행정권을 가진 "국가 안의 국가"로 성장해 식민 지배의 발판이 됨.'],
 [1653,3,'타지마할 완공','샤자한이 출산 중 죽은 왕비 뭄타즈 마할을 기려 22년에 걸쳐 지은 백대리석 영묘. 페르시아·인도 양식이 융합된 무굴 건축의 정수로 세계유산에 등재됨.'],
 [1707,2,'무굴 제국의 쇠퇴','아우랑제브의 데칸 원정과 종교 관용 폐기로 제국이 피폐해진 채 그가 사망. 마라타·시크 등 지방 세력이 자립하고 유럽 열강이 각축하는 힘의 공백이 생김.'],
 [1757,1,'플라시 전투','클라이브의 동인도회사군이 벵골 태수와 프랑스 연합군을 매수와 기습으로 격파. 인도 최부유 지역 벵골의 징세권을 장악하며 회사에 의한 인도 지배가 시작됨.'],
 [1857,1,'세포이 항쟁','동인도회사의 인도인 용병들이 종교 모독 논란의 탄약 문제로 봉기해 무굴 황제를 옹립하며 북인도 전역으로 확산. 진압 후 무굴 폐지와 영국 왕실의 직할 통치로 전환됨.'],
 [1885,2,'인도 국민회의 창립','영국이 여론 수렴 기구로 승인한 조직이 곧 민족운동의 구심으로 성장함. 초기의 온건 청원 노선에서 틸라크 등 급진파의 등장으로 자치 요구가 강해짐.'],
 [1905,2,'벵골 분할령','커즌 총독이 종교별로 벵골을 나누어 힌두·무슬림을 분열시키려 하자 스와데시·스와라지 운동이 폭발. 1911년 철회되었으나 인도 민족운동이 대중 운동으로 전환하는 계기가 됨.'],
 [1913,3,'타고르 노벨문학상','타고르가 『기탄잘리』로 아시아 최초의 노벨문학상을 수상. 식민 지배 속에서도 인도 문화의 자긍심을 세계에 알렸고, 그의 시는 인도와 방글라데시의 국가가 됨.'],
 [1919,1,'암리차르 학살','독립운동 탄압법(롤럿법)에 항의하던 비무장 군중에게 영국군이 발포해 수백 명이 사망. 온건파까지 등을 돌리며 간디의 비협조 운동 등 독립운동이 대중화되는 전환점이 됨.'],
 [1930,2,'간디의 소금 행진','간디가 영국의 소금 전매에 항의해 동지 78명과 390km를 걸어 바닷가에서 직접 소금을 만듦. 비폭력 불복종(사티아그라하)의 상징으로 전 세계의 주목을 받음.'],
 [1947,2,'독립과 분단','2차대전으로 쇠약해진 영국이 철수하며 힌두 중심의 인도와 무슬림의 파키스탄으로 분리 독립. 대규모 인구 이동 과정에서 수십만 명 이상이 희생되고 카슈미르 분쟁이 시작됨.'],
 [1961,2,'비동맹운동','네루가 티토·나세르와 함께 미소 어느 진영에도 서지 않는 비동맹 노선을 공식화. 반둥 회의(1955)의 평화 10원칙을 이어받아 신생 독립국들의 제3세계 목소리를 대변함.'],
 [1971,1,'제3차 인도-파키스탄 전쟁','동파키스탄의 자치 요구를 서파키스탄이 유혈 진압하자 인도가 개입해 승리. 동파키스탄이 방글라데시로 독립하고 인도가 남아시아의 패권을 굳힘.'],
 [1991,4,'경제 자유화','외환 위기를 계기로 인허가 통제 체제(라이선스 라지)를 철폐하고 시장을 개방. 이후 IT 서비스 산업을 앞세워 고성장 궤도에 올라섬.'],
 [2023,4,'인구 세계 1위','중국을 추월해 인구 세계 1위가 되고, 찬드라얀 3호가 사상 최초로 달 남극에 착륙. 세계 5위의 경제 규모로 "글로벌 사우스"의 목소리를 대변함.'],
]},
{name:'중동·서아시아', sub:'MIDDLE EAST',
 spans:[[-3000,-550,'고대 오리엔트'],[-550,-330,'아케메네스 페르시아'],[-330,224,'헬레니즘·파르티아'],[224,651,'사산 제국'],[651,1258,'이슬람 제국'],[1299,1922,'오스만 제국'],[1922,2030,'현대 중동']],
 events:[
 [-3000,4,'수메르 문명','우루크·우르 등의 도시국가들이 지구라트를 세우고 기원전 3200년경 쐐기문자를 발명 — 기록된 역사의 시작. 60진법(시간·각도)과 바퀴, 『길가메시 서사시』를 남김.'],
 [-2560,3,'기자 대피라미드','쿠푸왕의 대피라미드는 높이 146m, 평균 2.5톤의 석재 230만 개로 이후 4천 년 가까이 세계에서 가장 높은 건축물이었음. 고대 7대 불가사의 중 유일하게 현존함.'],
 [-1750,2,'함무라비 법전','바빌로니아의 함무라비왕이 282개 조문을 석비에 새긴, 거의 온전하게 전해지는 가장 오래된 법전. "눈에는 눈"의 동해보복 원칙과 신분별 차등 처벌이 특징.'],
 [-1274,1,'카데시 전투','이집트 람세스 2세와 히타이트가 시리아에서 충돌한, 기록이 상세히 남은 최초의 대회전. 15년 뒤 맺은 조약은 현존하는 가장 오래된 성문 평화조약으로 UN 본부에 사본이 걸려 있음.'],
 [-1200,3,'조로아스터교','자라투스트라가 선신 아후라 마즈다와 악의 대립, 최후 심판과 부활을 설함(연대는 기원전 1500~600년으로 학설이 갈림). 유대교·기독교·이슬람의 종말론과 천사·악마 관념에 깊은 영향을 남김.'],
 [-1050,4,'페니키아 알파벳','티레·시돈의 해상 무역민이 22개 자음의 표음문자를 지중해 전역에 퍼뜨림. 그리스인이 모음을 더해 알파벳이 완성되었고 라틴·키릴 문자의 공통 조상이 됨.'],
 [-1000,3,'유일신 신앙의 형성','이스라엘 왕국의 다윗·솔로몬 시대를 거치며 예루살렘 성전을 중심으로 야훼 신앙이 확립됨. 세계 최초의 본격적 유일신교로서 기독교와 이슬람이 모두 여기서 갈라져 나옴.'],
 [-671,1,'아시리아의 오리엔트 통일','철제 무기와 기병·공성 기술로 메소포타미아부터 이집트까지 처음으로 오리엔트를 통일. 가혹한 강제 이주 통치에 반발이 잇따라 100년도 못 가 붕괴하고 4국 분립 시대가 열림.'],
 [-586,1,'바빌론 유수','신바빌로니아의 네부카드네자르 2세가 예루살렘과 솔로몬 성전을 파괴하고 유대 지배층을 바빌론으로 끌고 감. 포로기를 거치며 유대교의 경전과 정체성이 오히려 단단해짐.'],
 [-550,0,'아케메네스 페르시아','키루스 대왕이 메디아·리디아·바빌론을 차례로 정복해 인더스에서 에게해에 이르는 최초의 세계 제국을 건설. 피정복민의 종교를 존중하는 관용 통치와 "왕의 길" 도로망으로 제국 운영의 모델을 제시함.'],
 [-330,1,'알렉산드로스의 정복','가우가멜라 전투에서 다리우스 3세가 패주하고 수도 페르세폴리스가 불탐. 그리스와 오리엔트 문화가 융합된 헬레니즘 세계가 이후 300년간 서아시아를 지배함.'],
 [30,3,'예수 그리스도','로마령 유대에서 예수가 하느님 나라를 선포하다 십자가형에 처해짐(30년경, 출생은 기원전 4년경 추정). 부활 신앙에서 출발한 기독교는 바울의 전도로 제국 전역에 퍼져 세계 최대 종교가 됨.'],
 [224,3,'사산 제국과 국교화','아르다시르 1세가 파르티아를 무너뜨리고 조로아스터교를 국교로 삼은 중앙집권 제국을 건설. 로마·비잔티움과 400년을 겨루며 페르시아 문화의 마지막 전성기를 이룸.'],
 [610,3,'이슬람의 창시','메카의 상인 무함마드가 히라 동굴에서 첫 계시를 받고 유일신 신앙을 선포. 박해를 피한 메디나 이주(622, 헤지라)가 이슬람력의 원년이 되었고, 632년까지 아라비아 반도가 통일됨.'],
 [632,0,'정통 칼리파 시대','무함마드 사후 아부 바크르부터 알리까지 네 칼리파가 선출되어 시리아·이집트·페르시아를 정복. 알리의 피살로 수니파와 시아파가 갈라지는 분열의 기원이 됨.'],
 [651,1,'사산 제국 멸망','니하완드 전투(642)에서 주력을 잃은 뒤 마지막 황제 야즈데게르드 3세가 메르브에서 살해되어 427년의 사산과 천 년 페르시아 제국의 계보가 끊김. 조로아스터교도 일부는 인도로 옮겨 파르시가 되었고, 페르시아의 관료제와 문화는 이슬람 속으로 흘러들어 아바스 왕조에서 되살아남.'],
 [661,0,'우마이야 왕조','다마스쿠스를 수도로 한 최초의 세습 칼리파 왕조. 서고트 스페인에서 중앙아시아까지 정복해 사상 최대급 제국을 이뤘고, 이 시기에 수니-시아 분열이 고착됨.'],
 [750,0,'아바스 혁명','비아랍 무슬림(마왈리)의 불만을 업고 아바스 가문이 우마이야를 무너뜨림. 아랍인 특권이 사라지고 민족을 넘어선 이슬람 제국으로 전환되어 페르시아 문화가 융성함.'],
 [762,4,'바그다드 건설','아바스 왕조의 만수르가 티그리스 강변에 원형 계획도시를 건설. "지혜의 집"에서 그리스 고전이 아랍어로 번역되고 대수학(알콰리즈미)과 의학(이븐 시나)이 꽃핀 이슬람 황금기의 중심이 됨.'],
 [1010,3,'『샤나메』와 페르시아 부흥','피르다우시가 30년에 걸쳐 6만 대구의 민족 서사시 『샤나메(왕서)』를 완성. 아랍어에 밀렸던 페르시아어가 문학어로 되살아나 이후 오마르 하이얌·루미로 이어지는 페르시아 문학의 황금기를 엶.'],
 [1071,0,'셀주크 튀르크','알프 아르슬란이 만지케르트에서 비잔티움 황제를 사로잡고 아나톨리아를 장악. 예루살렘 순례를 막으며 십자군 전쟁의 직접적 원인이 되었고 술탄제를 확립함.'],
 [1096,1,'십자군 전쟁','교황 우르바누스 2세의 호소로 시작된 성지 탈환 전쟁이 약 200년간 8차례 이어짐. 예루살렘 왕국의 흥망 속에 지중해 교역과 동방 문물의 유럽 유입이 확대되는 역설적 결과를 낳음.'],
 [1187,1,'살라딘의 예루살렘 탈환','아이유브 왕조의 살라딘이 하틴 전투에서 십자군을 궤멸시키고 88년 만에 예루살렘을 회복. 보복 학살 없는 관용적 입성으로 유럽에서도 기사도의 모범으로 회자됨.'],
 [1258,1,'바그다드 함락','훌라구의 몽골군이 바그다드를 함락하고 마지막 칼리파를 처형, 도서관의 책이 티그리스강을 검게 물들였다고 전해짐. 500년 아바스 왕조와 이슬람 황금기의 종언.'],
 [1299,0,'오스만 제국 건국','아나톨리아 변경의 오스만 베이가 소국을 세운 뒤 발칸으로 진출해 세계 제국으로 성장. 예니체리와 데브시르메 제도를 기반으로 623년간 3대륙을 지배함.'],
 [1501,0,'사파비 왕조','이스마일 1세가 타브리즈에서 즉위하며 12이맘 시아파를 국교로 선포. 수니파 오스만과의 대립 속에 오늘날 이란의 시아파 정체성이 형성됨.'],
 [1520,0,'술레이만 대제','"입법자"로 불린 술레이만 대제 치세에 오스만은 헝가리 정복과 빈 포위, 지중해 제해권까지 3대륙을 아우름. 법전 정비와 건축가 시난의 걸작들로 이슬람 문명의 마지막 전성기를 구가함.'],
 [1554,4,'커피하우스의 등장','예멘에서 수피 수도자들이 마시던 커피가 오스만으로 퍼져 이스탄불에 최초의 커피하우스가 문을 엶. 이후 유럽에 전해져 토론과 신문이 오가는 근대 시민 공론장 문화를 낳음.'],
 [1736,1,'사파비 왕조 멸망','아프간 세력의 침입으로 이스파한이 함락된 뒤(1722) 혼란을 수습한 군벌 나디르 샤가 즉위하며 235년의 사파비가 끝남. 왕조는 사라졌으나 이스마일 1세가 심은 12이맘 시아파 신앙은 이란의 정체성으로 남아 오늘의 이슬람 공화국까지 이어짐.'],
 [1839,2,'탄지마트 개혁','오스만이 법 앞의 평등과 세제·군제의 서구식 개혁을 선포하며 근대화를 시도. 성과가 제한된 채 미드하트 헌법(1876)도 정지되면서 청년튀르크당 혁명(1908)으로 이어짐.'],
 [1869,4,'수에즈 운하 개통','10년 공사 끝에 지중해와 홍해가 연결되어 유럽-아시아 항로가 7,000km 단축됨. 이집트는 공사 부채로 영국의 지배 아래 놓였고, 운하는 제국주의 각축의 초점이 됨.'],
 [1918,2,'오스만 제국 해체','1차대전 패전으로 623년의 제국이 해체되고 영국·프랑스가 사이크스-피코 협정선을 따라 중동을 분할. 무스타파 케말이 1923년 세속주의 터키 공화국을 세우고 칼리파제를 폐지함(1924).'],
 [1928,2,'세속화와 이슬람주의','터키가 문자를 라틴 알파벳으로 바꾸는 등 세속화 개혁을 단행한 해에, 이집트에서는 하산 알반나가 무슬림형제단을 창설. 세속 민족주의와 이슬람 부흥이라는 현대 중동의 두 흐름이 함께 출발함.'],
 [1938,4,'중동 석유 시대','사우디아라비아 담맘 유정과 쿠웨이트에서 대유전이 잇달아 발견됨. 중동이 세계 에너지의 심장이 되었고, 석유는 이후 중동 지정학의 상수가 됨.'],
 [1948,1,'이스라엘 건국','유엔 분할안에 따라 벤구리온이 건국을 선포하자 아랍 5개국이 즉각 개전(1차 중동전쟁). 이스라엘의 승리로 팔레스타인인 70만이 난민이 되었고("나크바"), 분쟁은 현재까지 이어짐.'],
 [1960,4,'OPEC과 석유 무기화','사우디·이란·이라크 등 5개국이 석유수출국기구를 세워 가격 결정권을 되찾음. 1973년 4차 중동전쟁 때의 감산·금수로 세계가 오일쇼크를 겪으며 자원 민족주의가 위력을 발휘함.'],
 [1967,1,'6일 전쟁','이스라엘이 선제공습으로 이집트·시리아·요르단 공군을 궤멸시키고 시나이·골란고원·서안·가자를 점령. 점령지 문제가 이후 모든 중동 평화 협상의 핵심 쟁점이 됨.'],
 [1979,2,'이란 혁명','팔레비 왕정의 급속한 서구화와 독재에 반발한 대중 봉기로 호메이니가 귀국해 신정 공화국을 수립. 미 대사관 인질 사건과 이란-이라크 전쟁(1980~88)으로 이어지며 중동 질서를 재편함.'],
 [1990,1,'걸프 전쟁','사담 후세인의 쿠웨이트 병합에 맞서 34개국 다국적군이 "사막의 폭풍" 작전으로 격퇴. CNN 생중계로 "안방에서 보는 전쟁"의 시대를 열었음.'],
 [1993,2,'오슬로 협정','라빈과 아라파트가 백악관에서 상호 승인과 팔레스타인 자치에 합의해 노벨평화상을 받음. 그러나 라빈 암살(1995)과 정착촌 확대로 2국가 해법은 교착에 빠짐.'],
 [2011,2,'아랍의 봄','튀니지 노점상 청년의 분신을 계기로 이집트·리비아·시리아 등지로 민주화 시위가 확산되어 장기 독재정권들이 연쇄 붕괴. 그러나 시리아 내전과 IS의 대두 등 혼돈도 뒤따름.'],
 [2025,1,'가자 전쟁과 이란 공습','2023년 하마스의 기습으로 시작된 가자 전쟁이 2025년 1월 단계적 휴전에 들어갔으나 교전이 되풀이됨. 6월에는 이스라엘이 이란의 핵시설과 수뇌부를 공습하고 미국이 포르도 등 3곳을 직접 타격해, 대리 세력을 통한 대결이 국가 간 전면 충돌로 바뀜.'],
 [2026,1,'이란 전쟁','2월 미국과 이스라엘이 이란을 다시 타격하고 3월에는 석유 수출의 핵심인 하르그섬까지 공습해 국제 유가가 급등하고 세계 증시가 요동침. 유럽 주요국의 참전 검토가 거론되는 등 확전 우려가 이어지며, 1979년 이란 혁명 이후 이어진 대립이 정점에 이름.'],
]}]},

{name:'유 럽', rows:[
{name:'그리스', sub:'GREECE·BYZANTIUM',
 spans:[[-2000,-1100,'미노아·미케네'],[-800,-323,'고전 그리스'],[-323,-146,'헬레니즘'],[-146,330,'로마 지배'],[330,1453,'비잔티움 제국'],[1453,1830,'오스만 지배'],[1830,2030,'근대 그리스']],
 events:[
 [-1600,0,'미케네 문명','선문자 B로 그리스어를 기록한 청동기 문명으로 크레타의 미노아 문명을 흡수. 트로이 전쟁 전설과 호메로스 서사시의 배경이며, 기원전 1200년경 동지중해 문명 붕괴기에 몰락함.'],
 [-1200,1,'청동기 문명의 붕괴','미케네의 궁전들이 잇달아 불타고 히타이트 제국이 소멸하는 등 동지중해의 왕국들이 반세기 안에 함께 무너짐 — "바다 민족"의 이동과 지진, 교역망 단절이 겹친 결과로 추정됨. 선문자 B가 잊히고 300여 년의 암흑기가 이어진 뒤 폴리스와 알파벳의 그리스가 새로 출발함.'],
 [-776,3,'올림피아 제전','제우스 성역 올림피아에서 열린 기록상 최초의 제전으로, 이후 4년마다 1,100여 년간 지속됨. 개최 기간에는 도시국가 간 전쟁을 멈추는 "성스러운 휴전"이 선포되었음.'],
 [-750,3,'호메로스와 알파벳','『일리아스』·『오디세이아』가 문자로 정착되며 그리스인의 공통 정체성과 신화 체계가 형성됨. 페니키아 문자에 모음을 더한 그리스 알파벳이 이 무렵 성립해 서양 문자의 조상이 됨.'],
 [-594,2,'솔론의 개혁','빚으로 노예가 된 시민을 해방하고 부채를 무효화했으며, 혈통 대신 재산 등급에 따라 참정권과 병역 의무를 배분. 어느 쪽도 만족시키지 못해 참주정이 뒤따랐으나, 신분이 아닌 시민 자격으로 정치에 참여하는 원리를 처음 세워 아테네 민주주의로 가는 길을 엶.'],
 [-585,4,'자연철학의 탄생','밀레토스의 탈레스가 일식을 예측하고 만물의 근원을 물이라 설명하며 신화 대신 자연 원리로 세계를 설명하기 시작. 피타고라스·데모크리토스의 원자론으로 이어져 과학적 사고의 출발점이 됨.'],
 [-508,2,'아테네 민주정','클레이스테네스가 혈연 부족을 지역 단위로 재편하고 도편추방제를 도입. 성인 남성 시민이 민회에서 직접 국사를 결정하는 세계 최초의 민주정이 성립함.'],
 [-490,1,'페르시아 전쟁 개막','다리우스 1세의 침공을 아테네 중장보병이 마라톤에서 격퇴. 이후 크세르크세스의 2차 침공에서 테르모필라이의 항전(-480)이 이어지며 동서 세계의 첫 대충돌로 기록됨.'],
 [-480,1,'살라미스 해전','테미스토클레스가 좁은 해협으로 페르시아 대함대를 유인해 격파. 마라톤(-490)·플라타이아(-479)의 승리와 함께 그리스 세계를 지켜내 고전기 문명 개화의 토대가 됨.'],
 [-478,2,'델로스 동맹','페르시아 재침에 대비해 아테네를 맹주로 200여 폴리스가 동맹을 맺고 공동 기금을 조성. 아테네가 기금을 사유화하며 제국으로 변질되어 스파르타와의 펠로폰네소스 전쟁을 불렀음.'],
 [-447,3,'파르테논 착공','페리클레스가 델로스 동맹의 기금으로 아크로폴리스에 아테나 신전을 세움(-432 완공). 페이디아스의 조각과 정교한 비례의 건축은 서양 고전미의 규범이 됨.'],
 [-440,3,'헤로도토스와 히포크라테스','헤로도토스가 페르시아 전쟁을 다룬 『역사』로 "역사의 아버지"가 되고, 히포크라테스가 질병을 신의 벌이 아닌 자연 현상으로 보는 의학을 세움. 인문과 의학이 신화에서 독립한 시기.'],
 [-431,1,'펠로폰네소스 전쟁','아테네의 해상 동맹과 스파르타의 육상 동맹이 27년간 그리스 세계를 양분해 싸움. 아테네의 패배로 폴리스 체제 전체가 쇠퇴했으며, 투키디데스가 『역사』로 기록함.'],
 [-387,3,'플라톤의 아카데메이아','소크라테스의 처형(-399) 후 제자 플라톤이 아테네 교외에 학원을 세워 아리스토텔레스를 길러냄. 이데아론과 논리학 등 서양 철학의 근간이 이 사제 3대에서 나옴.'],
 [-336,3,'아리스토텔레스','플라톤의 제자이자 알렉산드로스의 스승인 그가 논리학·자연학·정치학 등 학문을 분류하고 체계화. 그의 저작은 이슬람과 중세 스콜라 철학을 거쳐 서양 학문의 뼈대가 됨.'],
 [-334,1,'알렉산드로스 동방원정','마케도니아의 알렉산드로스가 그리스 연합군을 이끌고 페르시아 원정에 출발, 이집트에서 인더스까지 10년 만에 정복. 각지에 알렉산드리아를 세워 그리스 문화가 오리엔트와 융합된 헬레니즘 시대를 엶.'],
 [-300,4,'유클리드와 알렉산드리아','유클리드가 『기하학 원론』으로 공리에서 정리를 이끄는 연역 체계를 완성하고, 알렉산드리아에 최대 도서관이 세워짐. 아르키메데스·에라토스테네스의 지구 둘레 측정 등 헬레니즘 과학이 절정에 달함.'],
 [-146,1,'로마에 병합','아카이아 동맹이 패하고 코린토스가 파괴되며 그리스가 로마의 속주가 됨. 그러나 "정복된 그리스가 정복자를 정복했다"는 말대로 그리스 문화는 로마를 통해 서양 전체로 확산됨.'],
 [330,0,'콘스탄티노폴리스 천도','콘스탄티누스 대제가 비잔티온 자리에 "새 로마"를 건설해 천도. 서로마 멸망 후에도 그리스어 기독교 제국(비잔티움)으로 1,100여 년을 더 존속하며 고전 문헌을 보존함.'],
 [537,3,'하기아 소피아 완공','유스티니아누스 대제가 5년여 만에 직경 31m 대돔의 성당을 완공하고 "솔로몬이여, 내가 그대를 이겼노라"라 외쳤다고 전해짐. 이후 모스크를 거쳐 지금도 이스탄불의 상징으로 남음.'],
 [726,3,'성상 파괴 논쟁','레온 3세가 성상 숭배를 우상숭배로 금지하며 100여 년간 제국이 격렬히 분열됨. 843년 성상 공경이 복원되었으나 로마 교회와의 갈등이 깊어져 동서 분열의 원인이 됨.'],
 [863,3,'키릴 문자와 슬라브 선교','비잔티움의 키릴로스·메토디오스 형제가 슬라브어를 적는 글라골 문자를 만들고 전례서를 번역해 모라비아에 선교. 제자들이 이를 다듬어 스승의 이름을 붙인 키릴 문자가 불가리아를 거쳐 러시아까지 퍼지며 정교회 문화권이 동유럽 전역으로 확대됨.'],
 [1054,3,'동서 교회 분열','콘스탄티노폴리스 총대주교와 로마 교황의 특사가 서로를 파문. 성령 교리(필리오케) 논쟁과 수위권 다툼이 누적된 결과로, 정교회와 가톨릭의 분리가 오늘까지 이어짐.'],
 [1204,1,'4차 십자군의 약탈','베네치아에 진 빚에 몰린 십자군이 성지 대신 같은 기독교 도시 콘스탄티노폴리스를 함락하고 약탈. 비잔티움은 회복 불능의 타격을 입고 동서 교회의 골이 결정적으로 깊어짐.'],
 [1453,1,'콘스탄티노폴리스 함락','메흐메트 2세가 거포로 테오도시우스 성벽을 무너뜨리고 함선을 육로로 금각만에 넘겨 함락. 천 년 제국의 종언이자, 망명 학자들이 가져간 고전 문헌이 이탈리아 르네상스를 자극함.'],
 [1830,0,'그리스 독립','1821년 봉기 후 나바리노 해전에서 영·프·러 함대가 오스만 함대를 격파하며 독립이 확정됨. 바이런 등 유럽 지식인들이 열렬히 지원한 낭만주의 시대의 상징적 사건.'],
 [1922,1,'소아시아 파국','그리스-터키 전쟁의 패배와 스미르나(이즈미르) 대화재로 3천 년 아나톨리아 그리스인 공동체가 종말을 맞음. 로잔 조약으로 양국 간 150만 명의 강제 인구 교환이 단행됨.'],
 [1981,2,'유럽공동체 가입','군사정권(1967~74) 붕괴 후 민주주의를 회복하고 유럽공동체의 10번째 회원국이 됨. 2001년 유로존에도 참여하며 유럽 통합의 남단 축이 됨.'],
 [2009,4,'유로존 재정위기','재정 통계 분식이 드러나며 국가 부도 위기에 몰려 세 차례 구제금융을 받음. 가혹한 긴축으로 GDP의 4분의 1이 줄었으나 2018년 구제금융을 졸업함.'],
]},
{name:'이탈리아', sub:'ROME·ITALY',
 spans:[[-753,-27,'로마 왕정·공화정'],[-27,476,'로마 제국'],[476,1300,'중세 분열'],[1300,1559,'르네상스 도시국가'],[1559,1861,'분열과 외세'],[1861,2030,'통일 이탈리아']],
 events:[
 [-753,0,'로마 건국 (전승)','늑대의 젖을 먹고 자란 로물루스가 팔라티노 언덕에 도시를 세웠다는 전승 기년. 고고학적으로는 기원전 8~7세기에 라틴 부족 취락들이 도시로 통합된 것으로 봄.'],
 [-509,2,'공화정 수립','오만왕 타르퀴니우스를 추방하고 1년 임기의 집정관 2인과 원로원이 이끄는 공화정을 수립. 평민의 신분 투쟁으로 호민관 제도와 12표법을 얻어내며 견제와 균형의 원형을 만듦.'],
 [-264,1,'포에니 전쟁','지중해 패권을 두고 카르타고와 120년간 세 차례 격돌. 한니발의 알프스 원정(칸나이 대승)에도 로마는 버텨냈고, 자마의 승리와 카르타고 파괴(-146)로 지중해가 로마의 "우리 바다"가 됨.'],
 [-44,2,'카이사르 암살','갈리아 정복과 루비콘 도하로 권력을 장악한 카이사르가 종신 독재관이 되자 브루투스 등이 원로원 회의장에서 척살. 그러나 공화정 회복 대신 13년의 내전과 제정으로 귀결됨.'],
 [-27,0,'아우구스투스 제정','악티움 해전에서 안토니우스·클레오파트라를 꺾은 옥타비아누스가 "존엄자(아우구스투스)" 칭호를 받으며 사실상의 제정을 개시. 이후 200년의 "팍스 로마나"에 지중해 세계가 하나의 경제권으로 번영함.'],
 [79,4,'베수비오 화산 폭발','화산재가 폼페이와 헤르쿨라네움을 하루 만에 덮어 로마인의 일상이 그대로 봉인됨. 18세기 발굴로 고대 도시의 생활상이 드러나 고고학의 출발점이자 신고전주의의 자극이 됨.'],
 [80,3,'콜로세움 완공','베스파시아누스가 착공하고 아들 티투스가 완공한 5만 석의 원형 경기장. 콘크리트와 아치 공법의 정수로, 100일간의 개장 축제에서 검투 경기와 모의 해전이 열림.'],
 [117,1,'제국 최대 판도','트라야누스 치세에 다키아와 메소포타미아까지 정복하며 지중해를 내해로 삼는 최대 판도를 달성. 이어지는 "오현제" 시대는 기번이 인류가 가장 번영했던 시기로 꼽은 전성기.'],
 [313,3,'밀라노 칙령','콘스탄티누스가 기독교를 공인하고 몰수 재산을 반환하며 250년의 박해가 끝남. 테오도시우스 대에 국교화(380)되었고, 로마의 행정망을 따라 퍼진 교회 조직은 중세 유럽의 기반이 됨.'],
 [395,2,'제국의 동서 분열','테오도시우스가 죽으며 두 아들에게 제국을 분할 상속. 부유한 동방과 달리 서방은 게르만 대이동의 압박 속에 세수와 군대가 무너져 감.'],
 [476,1,'서로마 제국 멸망','게르만 용병대장 오도아케르가 소년 황제 로물루스 아우구스툴루스를 폐위하고 제관을 동로마로 보냄. 서유럽은 게르만 왕국들의 시대로 — 전통적으로 고대와 중세의 분기점으로 삼는 사건.'],
 [529,3,'베네딕도 수도원','누르시아의 베네딕도가 몬테카시노에 수도원을 세우고 "기도하고 일하라"의 규칙서를 저술. 수도원이 고전 필사와 농업 기술의 거점이 되어 중세 유럽 문명을 지탱함.'],
 [756,3,'교황령 성립','프랑크 왕 피핀이 랑고바르드에게서 빼앗은 라벤나 일대를 교황에게 기증. 교황이 세속 군주를 겸하는 교황령은 1870년까지 1,100년간 이탈리아 중부를 지배하며 반도 통일을 막는 요인이 됨.'],
 [1088,3,'볼로냐 대학','로마법 연구자들이 모인 학생 조합(우니베르시타스)에서 출발한 유럽 최초의 대학. 파리·옥스퍼드가 뒤따르며 대학은 중세 유럽의 지식 엔진이 됨.'],
 [1298,4,'『동방견문록』','베네치아 상인 마르코 폴로가 감옥에서 구술한 아시아 여행기가 유럽의 세계관을 넓힘. 같은 시기 이탈리아 도시들은 복식부기와 환어음, 은행업을 발전시켜 근대 자본주의의 기법을 마련함.'],
 [1321,3,'단테 『신곡』','피렌체에서 추방당한 단테가 라틴어가 아닌 토스카나 속어로 지옥·연옥·천국 편의 대서사시를 완성. "이탈리아어의 아버지"로 불리며 르네상스 인문주의의 문을 엶.'],
 [1347,2,'흑사병 창궐','제노바 상선이 크림반도에서 들여온 페스트가 시칠리아를 거쳐 3년 만에 유럽 전역을 휩쓸어 인구의 3분의 1에서 절반이 사망. 노동력 급감으로 농노제가 흔들리고 중세 질서가 무너지는 계기가 됨.'],
 [1504,3,'르네상스 전성기','다빈치의 「모나리자」, 미켈란젤로의 「다비드」와 시스티나 천장화, 라파엘로의 「아테네 학당」이 같은 시대에 쏟아짐. 피렌체 메디치가의 후원에서 시작된 고전 부흥이 절정에 달함.'],
 [1513,2,'마키아벨리 『군주론』','피렌체 외교관 마키아벨리가 정치를 도덕이 아닌 힘과 현실의 논리로 분석. 근대 정치학의 출발점으로 꼽히며 국가 이성(레종 데타) 개념의 원류가 됨.'],
 [1545,3,'트리엔트 공의회','가톨릭이 18년에 걸친 공의회로 교리를 재확인하고 성직자 기강을 바로잡는 반종교개혁을 추진. 금서목록과 종교재판을 강화하는 한편 예수회의 해외 선교로 세력을 만회함.'],
 [1600,3,'바로크 예술의 개막','반종교개혁의 흐름 속에 카라바조의 극적인 명암법과 베르니니의 조각·건축이 로마를 무대로 등장. 정서에 호소하는 바로크 양식이 이후 유럽 전역의 예술을 지배함.'],
 [1633,4,'갈릴레이 재판','지동설을 옹호한 『두 우주 체계에 관한 대화』로 갈릴레이가 종교재판에서 유죄 판결을 받고 여생을 가택 연금으로 보냄. 교황청은 1992년에야 공식적으로 오류를 인정함.'],
 [1797,1,'베네치아 공화국 멸망','나폴레옹의 진군에 마지막 도제가 물러나고 대의회가 스스로 해산을 결의해, 1,100년을 이어온 유럽 최장수 공화국이 소멸함. 대항해시대에 지중해 교역의 이점을 잃고 이미 쇠퇴하던 도시는 이후 오스트리아 지배를 거쳐 1866년 이탈리아 왕국에 편입됨.'],
 [1815,2,'빈 체제','나폴레옹 전쟁 후 메테르니히가 주도한 빈 회의가 정통주의와 세력 균형으로 유럽 질서를 재편. 자유주의와 민족주의를 억눌렀으나 그리스 독립과 1848년 혁명으로 무너짐.'],
 [1861,0,'이탈리아 통일','카보우르의 외교와 가리발디 "천인대"의 남부 원정이 합쳐져 통일 왕국이 선포됨. 서로마 멸망 이후 1,400년의 분열을 끝낸 리소르지멘토(부흥 운동)의 결실.'],
 [1870,2,'로마 병합','보불전쟁으로 프랑스 수비대가 철수하자 이탈리아군이 로마에 입성해 교황령이 소멸하고 통일이 완성됨. 교황과의 갈등은 1929년 라테라노 조약으로 해소됨.'],
 [1901,4,'마르코니의 무선통신','마르코니가 대서양을 건너는 무선 전신 수신에 성공해 통신을 전선에서 풀어냄(1909년 노벨물리학상). 앞서 볼타가 전지(1800)를, 페르미가 훗날 최초의 원자로(1942)를 만드는 등 이탈리아는 전기·핵물리학에 큰 족적을 남김.'],
 [1922,2,'무솔리니 집권','검은셔츠단의 "로마 진군" 시위에 국왕이 굴복해 무솔리니를 총리로 임명. 세계 최초의 파시즘 정권이 수립되어 유럽 전체주의의 모델이 됨.'],
 [1943,2,'파시즘 붕괴','연합군의 시칠리아 상륙 직후 파시즘 대평의회가 무솔리니를 실각시킴. 독일의 북부 점령과 내전을 거쳐 1945년 무솔리니는 파르티잔에게 처형됨.'],
 [1957,2,'로마 조약','이탈리아·프랑스·서독 등 6개국이 로마에서 유럽경제공동체(EEC) 창설에 서명. 관세동맹에서 출발한 통합은 1993년 유럽연합으로 발전했고, 로마는 그 출생지로 남음.'],
]},
{name:'스페인', sub:'SPAIN',
 spans:[[-218,711,'로마·서고트'],[711,1492,'알안달루스·레콩키스타'],[1492,1808,'스페인 제국'],[1808,1939,'격동의 근대'],[1939,1975,'프랑코 독재'],[1975,2030,'민주화 이후']],
 events:[
 [-218,1,'로마의 히스파니아','한니발의 사군툼 공격으로 2차 포에니 전쟁이 터지자 로마가 이베리아에 진출. 이후 600년의 로마화로 라틴어(스페인어의 모태)가 뿌리내리고 세네카, 트라야누스 같은 인물을 배출함.'],
 [589,3,'서고트의 가톨릭 개종','레카레도 왕이 아리우스파를 버리고 가톨릭으로 개종해 게르만 지배층과 히스파노-로마인이 통합됨. 톨레도 공의회 체제가 성립하며 이후 스페인의 강한 가톨릭 정체성이 형성됨.'],
 [711,1,'이슬람의 이베리아 정복','타리크가 이끄는 우마이야군이 지브롤터를 건너 서고트 왕국을 단숨에 무너뜨림. 이베리아 대부분이 알안달루스가 되고, 북부 산악의 기독교 소왕국들이 재정복(레콩키스타)을 시작함.'],
 [929,3,'코르도바 칼리파국','아브드 알라흐만 3세가 칼리파를 칭하며 알안달루스의 전성기가 개막. 코르도바는 대도서관과 대모스크를 갖춘 당대 유럽 최대의 도시로, 이슬람·기독교·유대 문화가 공존함.'],
 [1031,1,'코르도바 칼리파국 붕괴','베르베르 용병과 궁정 세력의 내전 끝에 마지막 칼리파가 폐위되고 알안달루스가 20여 개 타이파 소국으로 갈라짐. 통일된 이슬람 세력이 사라지자 북부 기독교 왕국들이 조공을 받아내며 주도권을 잡고, 톨레도 함락(1085)을 시작으로 레콩키스타의 남하가 본격화됨.'],
 [1085,3,'톨레도 번역 학교','카스티야가 톨레도를 탈환한 뒤 아랍어로 보존된 아리스토텔레스와 그리스·인도 과학이 라틴어로 번역됨. 이 번역 운동이 12세기 르네상스와 유럽 대학의 스콜라 철학을 촉발함.'],
 [1100,3,'산티아고 순례길','성 야고보의 무덤이 있다는 산티아고 데 콤포스텔라로 유럽 각지의 순례자가 몰리며 로마네스크 성당과 도로망이 발달. 순례길은 중세 유럽을 잇는 문화 회랑이 되었고 오늘날에도 이어짐.'],
 [1248,3,'알람브라와 공존의 문화','그라나다 나스르 왕조가 알람브라 궁전을 짓기 시작하고, 카스티야에서는 알폰소 10세가 아랍·유대 학자와 함께 법전과 천문표를 편찬. 세 종교가 공존한 콘비벤시아 문화의 절정기.'],
 [1469,0,'가톨릭 부부왕','카스티야의 이사벨과 아라곤의 페르난도가 혼인해 두 왕국을 통합. 종교재판소 설치와 유대인 추방령(1492) 등 가톨릭 단일 국가의 길을 걸음.'],
 [1492,1,'레콩키스타 완료·콜럼버스','1월 그라나다 함락으로 781년의 레콩키스타가 완료되고, 10월에는 이사벨의 후원을 받은 콜럼버스가 카리브에 도달. 한 해에 일어난 두 사건이 스페인 제국과 대항해시대를 엶.'],
 [1519,4,'마젤란 원정','카를로스 1세의 후원으로 마젤란의 함대 5척이 출항, 마젤란이 필리핀에서 전사한 뒤 엘카노가 1522년 생존자 18명과 귀환하며 사상 최초의 세계 일주를 완성. 지구가 둥글다는 것이 실증됨.'],
 [1521,1,'아메리카 식민제국','코르테스가 아스테카를, 피사로가 잉카(1533)를 소수 병력과 천연두, 원주민 동맹을 이용해 정복. 포토시 은광의 은이 쏟아져 들어와 "해가 지지 않는 제국"과 최초의 세계 무역망이 성립함.'],
 [1540,3,'예수회와 반종교개혁','로욜라가 창설한 예수회가 교육과 해외 선교를 이끌고 카를 5세·펠리페 2세가 가톨릭 수호를 국가 사명으로 삼음. 사비에르의 아시아 선교로 일본·중국에까지 가톨릭이 전해짐.'],
 [1556,0,'펠리페 2세의 절대왕정','아메리카 은과 상비군을 바탕으로 유럽 최강의 왕권을 구축하고 레판토 해전(1571)에서 오스만을 격파. 그러나 네덜란드 독립전쟁과 잦은 파산으로 제국이 서서히 기울기 시작함.'],
 [1581,1,'네덜란드 독립','신교 탄압과 중과세에 맞선 북부 7주가 독립을 선언하고 80년 전쟁을 벌임. 1648년 베스트팔렌 조약으로 승인받아 중계무역과 동인도회사로 17세기 최강의 상업 국가가 됨.'],
 [1588,1,'무적함대의 패배','펠리페 2세가 영국 정벌을 위해 보낸 130척의 함대가 칼레 해전과 폭풍으로 궤멸. 해상 패권이 영국과 네덜란드로 기우는 상징적 전환점이 됨.'],
 [1605,3,'『돈키호테』 출간','세르반테스가 기사도 문학을 패러디한 소설을 출간, 근대 소설의 효시로 꼽힘. 쇠락해 가는 제국의 그림자 속에서 스페인 문학의 황금세기가 만개함.'],
 [1656,3,'벨라스케스와 황금세기','궁정화가 벨라스케스가 「시녀들」로 회화의 시선과 공간을 재정의하고 엘 그레코·무리요가 뒤를 이음. 이후 고야에서 피카소·달리·미로로 이어지는 스페인 미술의 계보가 시작됨.'],
 [1701,1,'에스파냐 왕위 계승 전쟁','합스부르크 왕가의 단절로 부르봉가의 즉위를 둘러싸고 유럽이 13년간 격돌. 위트레흐트 조약으로 영국이 지브롤터와 노예무역 독점권을 얻으며 해상 패권의 주역이 교체됨.'],
 [1808,1,'나폴레옹의 침공','나폴레옹이 형 조제프를 스페인 왕으로 앉히자 마드리드 시민이 봉기(고야의 「1808년 5월 3일」). 게릴라전으로 프랑스군을 소모시켰고, 본국의 혼란을 틈타 중남미 식민지들이 연쇄 독립함.'],
 [1898,1,'미서전쟁','메인함 폭발 사건을 구실로 개전한 미국에 완패해 쿠바·푸에르토리코·필리핀·괌을 상실. 마지막 식민지를 잃은 "98년의 재앙"은 스페인 지성계에 깊은 성찰을 남김.'],
 [1900,3,'98세대와 문화 자성','식민지 상실의 충격 속에 우나무노·오르테가 이 가세트 등 지식인들이 스페인의 정체성과 유럽화를 성찰. 가우디의 건축과 함께 근대 스페인 문화가 새롭게 개화하는 계기가 됨.'],
 [1936,1,'스페인 내전','인민전선 정부에 맞선 프랑코의 군사 반란으로 3년 내전이 발발, 독일·이탈리아가 프랑코를, 소련과 국제여단이 공화파를 지원한 "2차대전의 전초전". 게르니카 폭격 등으로 약 50만 명이 희생됨.'],
 [1975,2,'민주화','프랑코 사후 후안 카를로스 1세와 수아레스 총리가 무혈의 민주화 이행을 이끌어 1978년 민주 헌법을 제정. 모범적 체제 전환 사례로 꼽히며 1986년 EC에 가입함.'],
 [1986,4,'유럽 통합과 경제 도약','EC 가입으로 구조기금과 외국인 투자가 유입되며 한 세대 만에 서유럽 수준의 경제로 성장. 관광과 인프라 확충으로 고속철도망은 유럽 최장 규모에 이름.'],
 [1992,3,'바르셀로나 올림픽','올림픽과 세비야 엑스포를 동시에 개최하며 민주화 이후의 재도약을 세계에 과시. 바르셀로나는 이를 계기로 세계적 관광 도시로 변모함.'],
]},
{name:'프랑스', sub:'FRANCE',
 spans:[[-58,486,'갈리아·로마'],[486,987,'프랑크 왕국'],[987,1589,'카페~발루아'],[1589,1789,'부르봉 절대왕정'],[1789,1870,'혁명과 제국'],[1870,2030,'공화국']],
 events:[
 [-52,1,'카이사르의 갈리아 정복','카이사르가 알레시아 공방전에서 베르킨게토릭스의 갈리아 연합군을 격파하고 8년의 전쟁을 『갈리아 전기』로 남김. 갈리아의 로마화로 프랑스의 원형인 갈로-로만 문화가 형성됨.'],
 [486,0,'프랑크 왕국','클로비스가 수아송에서 로마 잔존 세력을 꺾고 갈리아를 통일, 496년경 가톨릭으로 개종. 로마 교회와 손잡은 최초의 게르만 왕으로서 프랑스 왕가 1,300년의 시조가 됨.'],
 [732,1,'투르-푸아티에 전투','카롤루스 마르텔이 피레네를 넘어온 우마이야 원정군을 격퇴. 서유럽 기독교 세계 방어의 상징적 사건이자 카롤링거 가문의 위신을 세운 전투.'],
 [800,0,'카롤루스 대제 대관','교황 레오 3세가 성탄절 미사에서 카롤루스에게 서로마 황제의 관을 씌움. 게르만 왕권과 로마 전통, 기독교가 결합한 "유럽"의 탄생으로, 궁정 학교를 중심으로 카롤링거 르네상스가 뒤따름.'],
 [843,2,'베르됭 조약','카롤루스 대제의 세 손자가 제국을 서·중·동 프랑크로 삼분. 서프랑크는 프랑스로, 동프랑크는 독일로 발전해 유럽 국가 지도의 원형이 됨.'],
 [987,0,'카페 왕조 성립','카롤링거 직계가 끊기자 제후들이 파리 백작 위그 카페를 왕으로 뽑음 — 처음에는 파리 근교만 실제로 다스리는 약한 왕권이었음. 그러나 부자 상속을 거듭하며 카페·발루아·부르봉으로 800여 년간 왕위를 지켜, 왕령을 넓혀가는 과정이 곧 프랑스라는 나라의 뼈대가 됨.'],
 [1000,2,'봉건제와 장원','국왕이 힘을 잃은 자리에서 주군과 봉신이 토지를 매개로 쌍무적 계약을 맺는 봉건제가 자리 잡음. 농노가 영주의 장원에서 부역과 공납을 부담하는 자급적 경제가 중세 유럽의 기본 구조가 됨.'],
 [1150,3,'파리 대학과 스콜라 철학','노트르담 부속 학교에서 출발한 교수·학생 조합이 대학으로 발전해 유럽 신학의 중심이 됨. 아벨라르의 논리학과 토마스 아퀴나스의 강의로 이성과 신앙을 조화시키려는 스콜라 철학이 절정에 이름.'],
 [1163,3,'노트르담 대성당 착공','파리 시테섬에서 착공해 180여 년에 걸쳐 완성된 대성당. 첨두아치와 플라잉 버트레스로 벽을 스테인드글라스에 내준 고딕 양식이 전 유럽으로 확산됨.'],
 [1309,3,'아비뇽 유수','필리프 4세와 교황의 충돌 끝에 교황청이 아비뇽으로 옮겨져 70년간 프랑스 왕의 영향권에 놓임. 이후 로마와 아비뇽에 교황이 병립하는 대분열(1378~1417)로 교황권이 결정적으로 실추됨.'],
 [1337,1,'백년전쟁','카페 왕조의 직계가 끊기자 잉글랜드 왕이 프랑스 왕위를 요구하며 개전. 크레시·아쟁쿠르에서 장궁에 연패하며 한때 왕국의 절반을 잃었으나, 116년의 전쟁은 양국의 국민 의식을 벼려냄.'],
 [1429,1,'잔 다르크','"신의 음성"을 들었다는 17세 농민 소녀가 오를레앙 포위를 풀고 샤를 7세를 랭스에서 대관시킴. 이듬해 포로가 되어 화형당했으나(1431) 전세는 역전되어 1453년 프랑스의 승리로 끝남.'],
 [1572,1,'성 바르톨로메오 학살','왕실 혼인 축하연에 모인 위그노(신교도) 지도부가 파리에서 학살되고 폭력이 전국으로 번져 수천 명 이상이 희생됨. 30여 년 위그노 전쟁의 정점이자 유럽 종교 폭력의 상징.'],
 [1589,0,'부르봉 왕조 성립','앙리 3세가 암살되어 발루아 직계가 끊기고 위그노 지도자였던 나바르의 앙리가 왕위를 이음. "파리는 미사를 드릴 값어치가 있다"는 말이 전할 만큼 실리를 택해 가톨릭으로 개종하고 파리에 입성(1594), 루이 14세의 절대왕정으로 이어지는 왕조를 엶.'],
 [1598,3,'낭트 칙령','위그노 출신으로 가톨릭으로 개종한 앙리 4세가 신교도에게 신앙의 자유와 안전 도시를 보장하며 36년의 종교 내전을 종식. 루이 14세의 칙령 폐지(1685)로 신교도 기술자 수십만이 국외로 떠남.'],
 [1637,4,'데카르트 『방법서설』','"나는 생각한다, 고로 존재한다"로 의심할 수 없는 출발점을 세우고 해석기하학을 창시. 근대 철학과 합리론의 문을 열었으며, 이후 파스칼·라부아지에로 이어지는 프랑스 과학 전통의 기초가 됨.'],
 [1661,0,'루이 14세의 친정','재상 마자랭이 죽자 23세의 루이 14세가 재상 없는 친정을 선언하며 절대왕정을 완성. 베르사유 궁전에 귀족을 묶어두고 콜베르의 중상주의로 유럽 최강국이 됨.'],
 [1751,3,'『백과전서』','디드로와 달랑베르가 볼테르·루소·몽테스키외의 기고를 받아 지식 전반을 집대성(전 28권). 이성과 비판 정신을 퍼뜨려 프랑스 혁명의 사상적 토양이 됨.'],
 [1756,1,'7년 전쟁','오스트리아 왕위계승전쟁에 이어 영국·프로이센과 프랑스·오스트리아·러시아가 유럽과 식민지에서 격돌. 프랑스가 인도와 북아메리카의 식민지를 잃고 영국이 패권을 잡았으며, 전비 부담이 프랑스 혁명의 원인이 됨.'],
 [1789,2,'프랑스 대혁명','재정 파탄으로 소집된 삼부회가 국민의회로 발전하고 7월 14일 바스티유 습격으로 혁명이 발발. 인간과 시민의 권리선언으로 자유·평등을 선포하고 1793년 루이 16세를 처형 — 근대 정치의 문법을 새로 씀.'],
 [1793,4,'미터법과 근대 화학','혁명 정부가 지구 자오선을 기준으로 한 미터법을 제정하고, 라부아지에가 질량 보존 법칙으로 근대 화학을 확립. 보편적 도량형은 오늘날 국제단위계로 전 세계에 쓰임.'],
 [1793,2,'공포정치와 총재정부','국왕 처형 뒤 로베스피에르의 자코뱅이 공안위원회를 통해 반대파를 처형하다 테르미도르 반동(1794)으로 몰락. 이어진 총재정부의 무능이 나폴레옹의 쿠데타(1799)를 부름.'],
 [1804,0,'나폴레옹 황제 즉위','혁명의 혼란을 수습한 나폴레옹이 노트르담에서 스스로 제관을 씀. 아우스터리츠 등 연전연승으로 유럽을 재편했고, 『나폴레옹 법전』은 근대 민법의 모델로 세계에 퍼짐.'],
 [1806,2,'대륙봉쇄령','나폴레옹이 영국을 고립시키려 유럽 대륙과 영국의 통상을 금지했으나 밀무역과 각국의 반발로 실패. 이를 어긴 러시아 원정(1812)의 참패가 제국 몰락과 유럽 민족주의 각성의 계기가 됨.'],
 [1830,2,'7월 혁명','샤를 10세의 반동 정치에 파리 시민이 봉기해 부르봉 왕정을 무너뜨리고 루이 필리프의 입헌 왕정을 세움. 벨기에 독립과 유럽 각지의 자유주의 운동을 자극해 빈 체제를 흔듦.'],
 [1848,2,'2월 혁명','선거권 확대 요구 시위가 루이 필리프의 왕정을 무너뜨리고 제2공화국을 수립, 남성 보통선거를 도입. 빈·베를린·밀라노로 번진 "민중의 봄"의 도화선이 됨.'],
 [1863,3,'인상주의의 탄생','살롱에서 낙선한 마네의 「풀밭 위의 점심」이 낙선전에서 파문을 일으키고, 모네·르누아르가 빛과 순간을 좇는 인상주의를 엶. 파리가 세계 미술의 수도가 되어 세잔·고흐를 거쳐 현대미술로 이어짐.'],
 [1870,2,'제3공화국','스당 전투에서 나폴레옹 3세가 프로이센군의 포로가 되자 파리에서 공화국이 선포됨. 정교분리법(1905) 등 공화주의 체제가 뿌리내려 2차대전까지 지속됨.'],
 [1871,2,'파리 코뮌','보불전쟁의 굴욕적 강화에 반발한 파리 민중이 72일간 자치 정부를 수립 — 세계 최초의 노동자 정권으로 불림. "피의 일주일"에 2만여 명이 처형되며 진압되었으나 사회주의 운동의 성지가 됨.'],
 [1885,4,'파스퇴르의 백신','파스퇴르가 광견병 백신을 소년에게 접종해 성공시키고 저온살균법과 세균설을 확립. 코흐와 함께 미생물학을 세워 감염병에 대한 인류의 대응을 근본적으로 바꿈.'],
 [1889,4,'에펠탑과 만국박람회','프랑스 혁명 100주년 박람회를 위해 높이 300m의 철탑이 세워져 당시 세계 최고 높이를 기록. 철과 기계의 시대를 상징했고, 뤼미에르 형제의 영화 상영(1895)도 파리에서 시작됨.'],
 [1894,2,'드레퓌스 사건','유대인 장교 드레퓌스가 간첩 누명으로 종신형을 받자 에밀 졸라가 「나는 고발한다」로 재심을 촉구. 12년 만의 무죄 확정까지 프랑스가 두 쪽으로 갈렸고, "지식인"이라는 말이 이 사건에서 나옴.'],
 [1895,4,'뤼미에르의 영화','뤼미에르 형제가 파리에서 시네마토그라프로 최초의 유료 상영회를 열어 영화라는 매체가 탄생. 같은 시기 파스퇴르의 백신과 퀴리 부부의 방사능 연구(1898)로 프랑스 과학이 정점에 오름.'],
 [1903,4,'퀴리 부부의 방사능','마리 퀴리가 폴로늄과 라듐을 발견해 여성 최초로 노벨상을 받고, 1911년 화학상까지 두 분야를 석권. 방사능 연구는 원자 물리학과 현대 의학 영상·치료의 문을 엶.'],
 [1940,1,'나치의 점령','전격전 6주 만에 파리가 함락되고 남부에 비시 협력 정부가 수립됨. 드골이 런던에서 자유 프랑스를 조직하고 레지스탕스가 저항해 1944년 파리 해방으로 명예를 회복함.'],
 [1958,2,'제5공화국','알제리 위기로 제4공화국이 붕괴하자 드골이 복귀해 대통령 중심제의 새 헌법을 제정. 독자 핵 개발과 미·소 사이의 독립 외교로 강대국 지위를 복원한 현행 체제.'],
 [1968,2,'68운동','낭테르 대학의 시위가 1,000만 명의 총파업으로 번지며 드골 체제를 뒤흔듦. 권위주의 문화 전반에 대한 반란으로, 여성·환경·인권 등 신사회운동의 출발점이 됨.'],
 [1992,2,'마스트리흐트 조약','미테랑이 콜 총리와 함께 유럽연합 조약을 주도해 단일 통화(유로)와 EU 시민권이 합의됨. 독일-프랑스 화해를 축으로 한 유럽 통합의 결정적 도약.'],
]},
{name:'영국', sub:'UNITED KINGDOM',
 spans:[[43,410,'로마 브리타니아'],[410,1066,'앵글로색슨'],[1066,1485,'노르만~플랜태저넷'],[1485,1714,'튜더·스튜어트'],[1714,1945,'대영제국'],[1945,2030,'현대 영국']],
 events:[
 [43,1,'로마의 브리타니아 정복','클라우디우스 황제가 4개 군단으로 브리튼섬을 정복해 이후 400년 로마의 지배가 이어짐. 런던(론디니움)이 세워지고 하드리아누스 방벽이 북방의 경계가 됨.'],
 [410,1,'로마군 철수와 앵글로색슨','고트족의 로마 약탈로 다급해진 호노리우스 황제가 브리타니아에 스스로를 지키라 통보하며 367년의 로마 지배가 끝남. 방비가 사라진 섬에 앵글·색슨·주트족이 들어와 일곱 왕국을 세우고, 로마의 도시와 라틴어는 거의 잊혀 오늘날 영어의 뿌리가 게르만어로 놓임.'],
 [597,3,'기독교 전래','교황 그레고리우스 1세가 보낸 아우구스티누스가 켄트에서 왕을 개종시키고 캔터베리 대주교좌를 세움. 아일랜드 수도원 전통과 만나며 앵글로색슨 잉글랜드가 라틴 기독교 문명권에 편입됨.'],
 [871,0,'앨프레드 대왕','웨식스의 앨프레드가 바이킹 대군세를 에딩턴에서 꺾고 공존 체제를 확립. 법전 편찬과 『앵글로색슨 연대기』 등 학문 부흥으로 잉글랜드 통일의 기틀을 놓음.'],
 [1066,1,'노르만 정복','노르망디 공 윌리엄이 헤이스팅스에서 해럴드 2세를 전사시키고 잉글랜드를 정복. 노르만 귀족이 지배층이 되며 프랑스어 어휘가 영어에 유입되고, 토지대장 『둠즈데이 북』으로 강력한 봉건 왕권이 성립함.'],
 [1215,2,'마그나 카르타','실지왕 존의 실정에 봉기한 귀족들이 러니미드에서 왕에게 서명을 강제. "왕도 법 아래에 있다"는 원칙과 적법 절차 조항은 입헌주의와 인권 사상의 초석이 됨.'],
 [1348,2,'흑사병과 농민 반란','2년 만에 인구의 3분의 1 이상이 사망해 노동력이 급감하자 임금이 오르고 농노제가 해체되기 시작. 인두세에 반발한 와트 타일러의 난(1381)으로 하층민의 정치적 목소리가 처음 터져 나옴.'],
 [1485,0,'튜더 왕조 성립','헨리 튜더가 보즈워스에서 리처드 3세를 전사시키고 30년 장미전쟁을 끝내며 즉위, 요크가의 딸과 혼인해 두 가문을 합침. 대귀족들이 서로 죽여 소진된 자리에 강한 왕권이 서고 헨리 8세와 엘리자베스 1세의 시대로 이어지며, 중세 잉글랜드가 근세 국가로 넘어가는 분기점이 됨.'],
 [1534,3,'수장령','헨리 8세가 혼인 무효를 거부한 로마 교황청과 결별하고 국왕을 교회의 수장으로 선언. 수도원 해산으로 왕실 재정을 채우며 잉글랜드 종교개혁이 시작됨.'],
 [1588,1,'무적함대 격파','드레이크 등이 화공선과 기동전으로 스페인 함대를 무찌르고 폭풍이 잔여 함대를 삼킴. 엘리자베스 1세 치세의 절정기로, 같은 시대 런던 무대에는 셰익스피어의 연극이 오름.'],
 [1600,3,'셰익스피어의 시대','『햄릿』 등 4대 비극이 이 무렵 글로브 극장에서 상연되며 영어 문학의 정전이 확립됨. 흠정역 성서(1611)와 함께 근대 영어의 틀을 만듦.'],
 [1642,2,'청교도 혁명','찰스 1세의 전제와 과세에 맞서 의회파가 내전에서 승리하고 1649년 국왕을 공개 처형, 공화정을 선포. 크롬웰의 통치와 왕정복고(1660)를 거치며 의회 우위의 전통이 자리 잡음.'],
 [1660,4,'왕립학회와 과학의 제도화','"누구의 말도 그대로 믿지 말라"를 표어로 삼은 왕립학회가 창립되어 실험으로 검증하고 결과를 공개해 서로 따져 보는 방식을 규범으로 세움. 1665년 세계 최초의 학술지가 창간되어 과학이 개인의 사색에서 공동체가 축적하는 사업으로 바뀜.'],
 [1687,4,'뉴턴 『프린키피아』','뉴턴이 만유인력과 운동 3법칙으로 천상과 지상의 운동을 하나의 수학으로 통일. 과학혁명의 정점이자 계몽주의 "이성의 시대"를 연 저작으로 꼽힘.'],
 [1688,2,'명예혁명','의회가 제임스 2세를 축출하고 윌리엄과 메리 부처를 옹립하며 유혈 없이 정권을 교체. 권리장전(1689)으로 의회주권과 입헌군주제가 확립되어 근대 정치의 모델이 됨.'],
 [1707,2,'연합왕국 성립','잉글랜드와 스코틀랜드 의회가 합병해 그레이트브리튼 왕국이 성립. 스코틀랜드는 잉글랜드 시장과 식민지 무역에 접근하게 되었고, 이후 흄과 애덤 스미스 등 스코틀랜드 계몽주의가 만개함.'],
 [1756,1,'7년 전쟁','영국·프로이센과 프랑스·오스트리아·러시아가 유럽과 식민지에서 격돌한 사실상 최초의 세계 전쟁. 파리 조약으로 영국이 캐나다와 인도의 주도권을 얻어 대영제국의 기틀을 놓았으나, 전비 과세가 미국 독립의 불씨가 됨.'],
 [1760,4,'인클로저와 농업혁명','2차 인클로저로 공유지가 사유 농장으로 바뀌고 윤작법이 보급되어 식량 생산이 급증. 토지를 잃은 농민이 도시 노동력이 되어 산업혁명의 인적 기반을 이룸.'],
 [1769,4,'산업혁명','와트가 분리 응축기로 증기기관의 효율을 획기적으로 개선, 방적기 혁신과 맞물려 공장제 생산이 시작됨. 인류가 1만 년의 농업 사회에서 벗어나는 대전환의 출발점.'],
 [1776,4,'애덤 스미스 『국부론』','스코틀랜드의 애덤 스미스가 분업과 "보이지 않는 손"으로 시장의 작동을 설명하며 경제학을 독립 학문으로 세움. 자유무역 사상이 19세기 곡물법 폐지와 영국 번영의 이론적 기반이 됨.'],
 [1807,2,'노예무역 폐지','윌버포스 등 폐지론자들의 20년 운동 끝에 의회가 노예무역을 불법화하고 해군이 대서양에서 노예선을 단속. 1833년에는 제국 전역의 노예제 자체를 폐지함.'],
 [1815,1,'워털루 전투','엘바섬을 탈출해 재기한 나폴레옹을 웰링턴과 블뤼허의 연합군이 최종 격파. 이후 한 세기 동안 영국이 해군력과 파운드화로 세계 질서를 주도하는 "팍스 브리타니카"가 이어짐.'],
 [1825,4,'최초의 철도','스티븐슨의 증기기관차가 스톡턴-달링턴 구간을 달린 세계 최초의 공공 철도. 리버풀-맨체스터선(1830)으로 여객 시대가 열리며 시간과 공간의 감각을 바꿈.'],
 [1832,2,'선거법 개정과 차티스트','부패선거구를 없애고 신흥 산업 도시와 중산층에 의석·선거권을 재배분. 노동자가 배제되자 인민헌장을 내건 차티스트 운동(1838)이 일어나 이후 참정권 확대의 원동력이 됨.'],
 [1837,0,'빅토리아 시대','18세에 즉위한 빅토리아 여왕의 64년 치세에 제국은 지구 육지의 4분의 1을 지배. 수정궁에서 열린 만국박람회(1851)가 "세계의 공장" 영국의 자신감을 상징함.'],
 [1846,4,'곡물법 폐지','아일랜드 대기근을 계기로 지주를 보호하던 관세를 철폐하고 자유무역 체제로 전환. 값싼 곡물 수입으로 도시 노동자의 생활이 개선되고 "세계의 공장" 영국의 번영이 뒷받침됨.'],
 [1859,4,'다윈 『종의 기원』','다윈이 비글호 항해 이후 20여 년을 다듬은 자연선택 이론을 발표, 초판이 당일 매진됨. 생물학을 넘어 인간의 자기 이해를 바꾼 과학사의 분수령. 다만 형질이 어떻게 전해지는지는 설명하지 못했고, 그 답을 담은 멘델의 완두콩 실험(1866)은 35년간 묻혔다 1900년에야 재발견되어 유전학을 열었음.'],
 [1865,4,'맥스웰의 전자기 이론','패러데이가 실험으로 보인 전기와 자기의 얽힘을 맥스웰이 네 개의 방정식으로 통합하고, 그 해를 계산해 빛이 전자기파임을 밝힘. 헤르츠가 전파를 실증하며(1888) 무선통신과 전기 문명의 토대가 되었고, 뉴턴 이후 물리학의 두 번째 대통합으로 꼽힘.'],
 [1863,4,'세계 최초의 지하철','런던에 증기 기관차가 다니는 메트로폴리탄 지하철이 개통되어 대도시 대중교통의 시대를 엶. 1851년 만국박람회로 과시된 도시 인프라 기술이 세계 각국의 모델이 됨.'],
 [1907,2,'삼국협상 성립','영국이 프랑스·러시아와 협상을 맺어 독일·오스트리아·이탈리아의 삼국동맹에 맞섬. 두 진영의 대립과 군비 경쟁이 1차 세계대전의 구조적 배경이 됨.'],
 [1918,2,'스페인 독감','1차대전 막바지에 번진 인플루엔자로 세계에서 5천만 명 이상이 사망 — 전쟁 사망자를 웃도는 인류사 최악의 팬데믹. 각국의 보도 통제 속에 중립국 스페인의 보도만 알려져 이런 이름이 붙음.'],
 [1928,4,'페니실린 발견','플레밍이 곰팡이가 포도상구균을 죽이는 현상을 우연히 발견하고, 플로리와 체인이 2차대전기에 대량 생산에 성공. 항생제의 시대가 열려 수많은 생명을 구함.'],
 [1936,4,'튜링의 계산 이론','튜링이 「계산 가능한 수에 관하여」에서 종이테이프와 규칙만으로 어떤 계산이든 흉내 내는 만능 기계를 정의해, 계산이란 무엇이며 무엇이 계산 불가능한지를 처음으로 엄밀히 답함. 오늘날 모든 컴퓨터의 개념적 설계도이며, 그가 이끈 에니그마 해독은 2차대전을 앞당겨 끝냄.'],
 [1928,2,'보통선거의 완성','참정권 운동(서프러제트)과 1918년의 부분 확대를 거쳐 21세 이상 모든 남녀에게 평등한 투표권이 부여됨. 점진적 개혁으로 혁명 없이 민주주의를 완성한 사례로 꼽힘.'],
 [1940,1,'영국 본토 항공전','프랑스 함락 후 홀로 남은 영국이 공군의 분전과 레이더망으로 독일 공군을 저지. "이토록 많은 사람이 이토록 적은 사람에게 빚진 적은 없었다"는 처칠의 연설이 항전을 상징함.'],
 [1947,2,'제국의 해체','인도·파키스탄 독립을 시작으로 20여 년간 아시아·아프리카 식민지가 연쇄 독립. 제국은 영연방으로 재편되고 영국은 유럽 국가로 회귀함.'],
 [1948,2,'국민보건서비스 출범','전후 노동당 정부가 베버리지 보고서에 따라 세금으로 운영되는 무상 의료 제도를 창설. "요람에서 무덤까지"의 복지국가 모델이 서유럽 각국으로 확산됨.'],
 [1953,4,'DNA 이중나선 규명','왓슨과 크릭이 프랭클린의 X선 사진에 기초해 DNA의 이중나선 구조를 밝힘. 분자생물학이 탄생해 유전공학으로 이어졌고, 앞서 튜링은 계산 이론과 암호 해독으로 컴퓨터 시대를 예비함.'],
 [1973,2,'유럽공동체 가입','제국 해체와 상대적 경제 침체 속에 유럽 시장을 택했으나, 드골의 두 차례 거부권에 막혀 세 번째 시도로 가입. 2년 뒤 잔류를 묻는 국민투표에서 67%가 찬성했지만 통화와 주권을 둘러싼 양가감정이 남아 유로존과 솅겐에는 끝까지 참여하지 않음.'],
 [2020,2,'브렉시트','2016년 국민투표(52 대 48)의 결정에 따라 47년 만에 EU를 탈퇴. 주권 회복이라는 기대와 경제적 비용을 둘러싼 논쟁이 진행 중.'],
]},
{name:'독일', sub:'GERMANY',
 spans:[[-100,962,'게르만 부족~프랑크'],[962,1806,'신성로마제국'],[1806,1871,'프로이센과 통일운동'],[1871,1918,'독일제국'],[1919,1945,'바이마르·나치'],[1945,2030,'분단과 통일']],
 events:[
 [9,1,'토이토부르크 전투','케루스키족의 아르미니우스가 바루스의 로마 3개 군단(약 2만)을 숲속 기습으로 전멸시킴. 로마는 이후 라인강을 사실상의 국경으로 삼았고, 이 전투는 훗날 독일 민족주의의 신화가 됨.'],
 [375,1,'게르만족 대이동','훈족의 압박으로 서고트족이 로마 영내로 이동하며 200여 년의 대이동이 시작됨. 서로마 제국이 무너지고 그 위에 프랑크·서고트 등 게르만 왕국들이 세워져 중세 유럽이 형성됨.'],
 [800,3,'수도원과 문자 문화','카롤링거 궁정과 풀다·장크트갈렌 수도원에서 고전 필사와 카롤링거 소문자체가 정착됨. 오늘날 로마자 소문자의 원형이 여기서 나왔고, 수도원이 중세 독일 지역의 지식과 개간의 거점이 됨.'],
 [962,0,'신성로마제국','동프랑크의 오토 1세가 마자르족을 격퇴한 위세로 로마에서 황제관을 받음. "독일 민족의 신성로마제국"은 844년간 존속했으나, 볼테르의 말대로 느슨한 제후 연합체에 가까웠음.'],
 [1077,3,'카노사의 굴욕','성직자 임명권을 둘러싼 다툼에서 파문당한 하인리히 4세가 교황 그레고리우스 7세에게 사흘간 눈 속에서 용서를 빎. 교황권이 황제권을 앞선 상징적 사건으로, 보름스 협약(1122)으로 타협됨.'],
 [1241,4,'한자동맹','뤼베크와 함부르크의 조약을 시초로 북독일 도시들이 상업 동맹을 결성, 전성기에는 200여 도시가 참여. 발트해에서 런던까지 교역망을 지배한 중세 유럽 최대의 경제 블록.'],
 [1356,2,'금인칙서','카를 4세가 7명의 선제후에게 황제 선출권을 성문화해 부여. 제후들의 주권이 강화되어 독일의 분권 체제가 근대까지 고착됨.'],
 [1455,4,'구텐베르크 인쇄술','마인츠의 구텐베르크가 활판 인쇄기로 42행 성경 약 180부를 인쇄. 책의 대량 생산으로 지식 독점이 무너졌고, 루터의 팸플릿이 순식간에 퍼지는 기반이 됨.'],
 [1517,3,'루터의 종교개혁','비텐베르크의 수도사 루터가 면벌부 판매를 비판하는 95개조 반박문을 발표. 파문에도 굴하지 않고 성서를 독일어로 번역했으며, 프로테스탄트의 탄생으로 유럽의 종교·정치 지형이 재편됨.'],
 [1543,4,'코페르니쿠스의 지동설','폴란드 프롬보르크의 성직자 코페르니쿠스가 죽음을 앞두고 『천구의 회전에 관하여』를 뉘른베르크에서 간행해, 지구를 우주의 중심에서 끌어내리고 태양 둘레를 도는 하나의 행성으로 되돌림. 같은 해 베살리우스가 직접 해부한 관찰로 『인체의 구조』를 펴내 갈레노스의 권위를 무너뜨려, 1543년은 흔히 근대 과학의 원년으로 불림.'],
 [1541,3,'칼뱅의 개혁교회','칼뱅이 제네바로 돌아와 예정설을 내세운 신정 정치를 펴고, 근면과 절약을 신앙으로 긍정한 교리가 상공업 계층에 퍼짐. 프랑스 위그노·잉글랜드 청교도·스코틀랜드 장로교로 확산되어 루터파와 함께 프로테스탄트의 두 축을 이룸.'],
 [1609,4,'케플러의 행성 운동 법칙','티코 브라헤가 남긴 정밀한 화성 관측 자료를 8년간 붙들고 계산한 끝에 케플러가 행성이 타원 궤도를 돈다는 것을 밝힘. 천체는 완전한 원을 그린다는 2천 년의 전제를 깨뜨렸고, 관측 자료에서 수학 법칙을 끌어내는 방식 자체가 이후 물리학의 표준이 됨.'],
 [1618,1,'30년 전쟁','프라하 창문 투척 사건으로 시작된 종교 전쟁이 전 유럽의 패권 전쟁으로 확대. 용병의 약탈과 기근·역병으로 독일 지역 인구의 3분의 1가량이 감소한 것으로 추정되는 참화를 남김.'],
 [1648,2,'베스트팔렌 조약','30년 전쟁을 끝내며 각국의 영토 주권과 내정 불간섭 원칙을 확립. 교황과 황제의 보편 권위가 무너지고 주권국가 간 세력 균형이라는 근대 국제 질서가 탄생함.'],
 [1685,3,'바흐와 독일 음악','같은 해 태어난 바흐와 헨델을 거쳐 하이든·모차르트·베토벤으로 이어지는 독일·오스트리아 음악이 서양 고전음악의 주류를 형성. 베토벤의 「합창」 교향곡 선율은 오늘날 유럽연합의 상징곡이 됨.'],
 [1701,0,'프로이센 왕국','브란덴부르크 선제후 프리드리히 3세가 에스파냐 왕위 계승 전쟁 참전을 대가로 황제의 승인을 얻어 쾨니히스베르크에서 "프로이센 왕"을 칭함. 흩어진 척박한 영토를 상비군과 관료제로 벼려 유럽의 강국으로 올라서고, 훗날 독일 통일의 주역이 됨.'],
 [1740,2,'프리드리히 대왕','프리드리히 2세가 슐레지엔을 점령하며 프로이센을 유럽 강국으로 끌어올림. 볼테르와 교유하며 고문 폐지와 종교 관용을 실시한 "계몽 전제군주"의 대표 격.'],
 [1781,3,'칸트 『순수이성비판』','칸트가 인식의 조건을 묻는 비판철학으로 합리론과 경험론을 종합. 헤겔·마르크스·니체로 이어지는 독일 관념론과 근대 철학 전체의 전환점이 됨.'],
 [1806,2,'신성로마제국 해체','아우스터리츠에서 승리한 나폴레옹이 라인동맹을 결성하자 프란츠 2세가 제위에서 물러나 844년의 제국이 소멸. 나폴레옹의 지배는 역설적으로 독일 민족주의를 일깨움.'],
 [1808,3,'괴테 『파우스트』','괴테가 60년에 걸쳐 완성하게 될 필생의 대작 1부를 출간. 실러와 함께한 바이마르 고전주의는 정치적으로 분열된 독일에 "문화 민족"의 정체성을 부여함.'],
 [1810,4,'베를린 대학 설립','훔볼트가 연구와 교육의 일치를 내세운 근대적 대학을 창설. 세미나와 실험실 중심의 이 모델이 미국과 일본 등으로 퍼져 오늘날 연구중심대학의 원형이 됨.'],
 [1834,4,'관세동맹','프로이센 주도로 대부분의 독일 국가가 관세 장벽을 없애 단일 경제권을 형성. 공업화가 진전되며 정치 통일에 앞선 경제 통일이 이뤄져 프로이센 중심 통일의 토대가 됨.'],
 [1848,2,'프랑크푸르트 의회','3월 혁명으로 소집된 최초의 전독일 의회가 성 바울 교회에서 통일 헌법을 기초. 프로이센 왕의 제관 거부로 좌절되었으나 그 기본권 목록은 현행 독일 기본법의 원형이 됨.'],
 [1848,2,'마르크스 『공산당 선언』','마르크스와 엥겔스가 계급투쟁으로 역사를 설명한 선언을 발표하고 훗날 『자본론』(1867)을 저술. 20세기 세계 인구의 3분의 1이 그의 이름을 내건 체제 아래 놓이는 사상적 원천이 됨.'],
 [1871,0,'독일 통일','비스마르크가 덴마크·오스트리아·프랑스와의 세 차례 전쟁을 통해 프로이센 중심의 통일을 완성, 베르사유 거울의 방에서 독일제국을 선포. 이후 급속한 공업화로 영국을 추격함.'],
 [1882,2,'삼국동맹','비스마르크가 프랑스를 고립시키기 위해 오스트리아·이탈리아와 동맹을 맺어 세력 균형을 관리. 그의 퇴진(1890) 후 빌헬름 2세의 함대 증강이 영국을 자극해 동맹 대 협상의 대립 구도가 굳어짐.'],
 [1886,4,'벤츠의 자동차','카를 벤츠가 3륜 가솔린 자동차의 특허를 취득하고, 아내 베르타가 최초의 장거리 시험 주행을 감행. 다임러와 함께 자동차 산업의 문을 엶.'],
 [1895,4,'뢴트겐의 X선','뢴트겐이 물체를 투과하는 미지의 광선을 발견해 제1회 노벨물리학상을 수상. 의학 진단을 혁신했고, 독일은 화학·물리학에서 20세기 전반 노벨상의 최다 배출국이 됨.'],
 [1900,4,'플랑크의 양자 가설','플랑크가 흑체 복사를 설명하며 에너지가 불연속적인 양자 단위로 방출된다는 가설을 제시. 아인슈타인·보어·하이젠베르크로 이어지는 양자역학 혁명의 출발점.'],
 [1905,4,'아인슈타인의 기적의 해','26세의 특허국 심사관 아인슈타인이 특수상대성이론과 광양자 가설 등 논문 5편을 한 해에 발표하고, 1915년 일반상대성이론을 완성. 시간과 공간의 개념을 근본적으로 바꿈.'],
 [1927,4,'양자역학의 완성','하이젠베르크의 불확정성 원리와 슈뢰딩거의 파동방정식이 잇달아 나오고 코펜하겐 해석이 정리되며, 원자 세계를 확률로 기술하는 새 역학이 완성됨. "신은 주사위를 던지지 않는다"며 아인슈타인이 끝까지 반대했으나, 반도체·레이저·핵에너지가 모두 이 이론 위에 세워짐.'],
 [1914,1,'제1차 세계대전','사라예보의 총성 이후 동맹 체계가 연쇄 작동해 세계대전으로 비화, 독일은 두 전선에서 4년을 싸움. 패전으로 제정이 무너지고 베르사유 조약의 배상과 굴욕이 다음 파국의 씨앗이 됨.'],
 [1919,2,'바이마르 공화국','1918년 11월 혁명으로 빌헬름 2세가 망명해 47년의 제국이 끝난 뒤, 바이마르에서 여성 참정권과 사회권까지 담아 당대 가장 민주적이라 평가된 헌법이 제정됨. 그러나 배상 부담과 초인플레이션, 대통령 비상권한과 군소정당 난립으로 흔들리다 14년 만에 나치에게 길을 내줌.'],
 [1933,2,'히틀러 집권','대공황의 혼란 속에 나치당이 제1당이 되고 히틀러가 총리로 임명됨, 수권법으로 바이마르 민주주의를 합법의 외피 속에 해체. 유대인 600만이 희생된 홀로코스트와 2차대전으로 치달음.'],
 [1938,2,'뮌헨 협정','영국·프랑스가 전쟁을 피하려 히틀러의 주데텐란트 병합 요구를 승인하는 유화 정책을 폄. 이듬해 체코슬로바키아 해체와 독소불가침조약에 이은 폴란드 침공으로 2차대전이 발발함.'],
 [1945,1,'패전과 분단','베를린 함락과 무조건 항복으로 "제3제국"이 붕괴하고 미·영·프·소 4개국이 분할 점령. 뉘른베르크 전범 재판이 열리고 1949년 서독과 동독이 각각 수립됨.'],
 [1948,2,'베를린 봉쇄','소련이 서베를린으로 통하는 육로를 차단하자 미·영이 11개월간 공수로 물자를 보급. 냉전의 첫 정면 충돌로 이듬해 서독·동독 분단과 나토 창설이 뒤따름.'],
 [1955,1,'바르샤바 조약기구','서독의 NATO 가입에 맞서 소련과 동유럽 7개국이 군사 동맹을 결성해 진영 대립이 블록으로 완성됨. 이후 브란트의 동방정책(1969)이 데탕트의 문을 엶.'],
 [1961,2,'베를린 장벽','동독 주민 250만의 서방 탈출을 막기 위해 하룻밤 새 장벽이 세워짐. 냉전 분단의 상징으로 28년간 유지되며 장벽을 넘다 숨진 이가 130명을 넘음.'],
 [1990,2,'독일 재통일','1989년 11월 9일 장벽 붕괴 후 1년도 안 되어 동독이 연방에 가입하며 통일이 완성됨. 콜 총리가 주도한 통일 독일은 이후 유럽 통합의 견인차가 됨.'],
]},
{name:'러시아', sub:'RUSSIA',
 spans:[[882,1240,'키예프 루스'],[1240,1480,'몽골 지배'],[1480,1721,'모스크바 차르국'],[1721,1917,'러시아 제국'],[1917,1991,'소련'],[1991,2030,'러시아 연방']],
 events:[
 [882,0,'키예프 루스','노브고로드(862, 류리크)에 이어 올레그가 키예프를 장악하며 "루스"가 통합됨. 바이킹(바랑기아)과 동슬라브의 융합 국가로, 러시아·우크라이나·벨라루스가 모두 시조로 삼음.'],
 [988,3,'정교회 수용','블라디미르 대공이 비잔티움 황녀와 혼인하며 드니프르강에서 집단 세례를 거행. 키릴 문자와 비잔티움 예술이 유입되어 러시아 문명의 정신적 좌표가 됨.'],
 [1147,0,'모스크바의 첫 기록','유리 돌고루키 공이 연회를 열었다는 연대기 기록에 처음 등장하는 변방의 목책 요새. 몽골 지배기에 세금 징수를 대행하며 부를 쌓아 러시아의 새 중심으로 부상함.'],
 [1240,1,'몽골의 지배','바투의 서정군이 키예프를 초토화하고 킵차크 칸국을 세움. 240년의 "타타르의 멍에" 동안 루스는 공납과 인구 조사를 겪으며 서유럽의 변화와 단절됨.'],
 [1480,2,'몽골 지배 종식','이반 3세가 우그라강에서 칸의 군대와 대치 끝에 공납을 최종 거부하며 몽골 지배가 끝남. 비잔티움 멸망 후 "제3의 로마"를 자처하며 차르 이념이 싹틈.'],
 [1547,0,'이반 뇌제 차르 즉위','이반 4세가 러시아 최초로 차르(카이사르)로 대관. 카잔·아스트라한 정복과 시베리아 진출로 영토를 크게 넓혔으나, 공포정치(오프리치니나)와 장남 살해의 광기도 남김.'],
 [1564,4,'인쇄술과 시베리아 진출','이반 페도로프가 모스크바에서 최초의 인쇄본 『사도행전』을 간행하고, 예르마크의 카자크가 우랄을 넘음(1581). 이후 60여 년 만에 태평양에 도달하며 세계 최대의 영토 국가가 형성됨.'],
 [1613,0,'로마노프 왕조','"동란 시대"의 혼란과 폴란드군의 모스크바 점령을 극복하고 전국회의가 16세의 미하일 로마노프를 차르로 선출. 1917년까지 304년간 러시아를 통치한 왕조의 시작.'],
 [1703,2,'표트르 대제의 개혁','표트르 대제가 스웨덴과의 북방전쟁 중 발트해 어귀의 늪지에 새 수도 상트페테르부르크를 건설, "유럽으로 난 창"으로 삼음. 급진적 서구화 개혁으로 러시아를 열강의 반열에 올림.'],
 [1721,0,'러시아 제국 선포','21년에 걸친 북방전쟁에서 스웨덴을 꺾고 발트해 출구를 얻은 표트르가 원로원의 추대로 "임페라토르(황제)"를 칭하며 차르국이 제국으로 바뀜. 스웨덴을 대신해 북유럽의 패권을 쥐고 유럽 열강의 하나로 인정받은 출발점이자, 1917년까지 이어질 제국의 시작.'],
 [1755,3,'모스크바 대학과 로모노소프','과학자이자 시인인 로모노소프의 주도로 모스크바 대학이 설립되고 러시아어 문법이 정비됨. 표트르가 세운 과학아카데미와 함께 러시아 학문의 자립적 토대가 마련됨.'],
 [1762,0,'예카테리나 2세','독일 출신 황후가 쿠데타로 즉위해 34년을 통치. 볼테르·디드로와 서신을 나눈 계몽 군주로 크림 병합과 폴란드 분할로 영토를 크게 넓혔으나 농노제는 오히려 강화됨.'],
 [1812,1,'나폴레옹 격퇴','나폴레옹의 60만 대군이 모스크바에 입성했으나 초토화 전술과 혹한, 쿠투조프의 추격으로 궤멸에 가깝게 패퇴. 러시아가 유럽의 해방자로 부상했으며, 톨스토이 『전쟁과 평화』의 무대가 됨.'],
 [1825,2,'데카브리스트 봉기','나폴레옹 전쟁에서 서유럽을 목격한 청년 귀족 장교들이 입헌제를 요구하며 원로원 광장에서 봉기. 니콜라이 1세가 진압해 5명을 처형했으나 러시아 혁명 운동의 기원으로 남음.'],
 [1837,3,'푸시킨과 러시아 문학','근대 러시아 문학어를 확립한 푸시킨이 결투로 요절하고, 그 유산 위에서 고골·투르게네프가 등장. 이후 도스토옙스키와 톨스토이로 이어지는 러시아 소설의 계보가 시작됨.'],
 [1853,1,'크림 전쟁','성지 관할권을 구실로 남하하려던 러시아가 오스만·영국·프랑스 연합군에 패배. 후진성이 드러나 농노 해방 등 대개혁을 촉발했고, 나이팅게일의 간호 활동으로 근대 간호학이 시작됨.'],
 [1861,2,'농노 해방','크림전쟁 패배로 후진성을 절감한 알렉산드르 2세가 2,300만 농노를 해방하고 사법·지방자치 개혁을 단행. 그러나 토지 상환금 부담으로 농민 불만은 지속되었고 차르는 1881년 암살됨.'],
 [1869,3,'러시아 문학의 황금기','톨스토이 『전쟁과 평화』와 도스토옙스키 『죄와 벌』(1866)이 잇달아 나오며 러시아 소설이 세계 문학의 정점에 오름. 차이콥스키의 음악과 함께 유럽 변방에서 문화 강국으로 인식이 바뀜.'],
 [1869,4,'멘델레예프의 주기율표','멘델레예프가 원소를 원자량 순으로 배열해 주기성을 밝히고 미발견 원소의 성질까지 예측. 화학의 체계를 세운 업적으로 이후 파블로프의 조건반사 연구 등 러시아 과학의 전통이 이어짐.'],
 [1891,4,'시베리아 횡단철도','모스크바에서 블라디보스토크까지 9,289km를 잇는 철도가 착공되어 1916년 완공. 시베리아 개발과 극동 진출의 동맥이 되었으나 만주 부설을 둘러싼 대립이 러일전쟁의 배경이 됨.'],
 [1905,2,'피의 일요일','청원 행진에 근위대가 발포하면서 전국적 파업과 소비에트 결성으로 번짐. 니콜라이 2세가 국회(두마) 개설을 약속했으나 개혁이 후퇴하며 1917년 혁명의 예행연습이 됨.'],
 [1909,3,'러시아 발레와 예술','디아길레프의 발레 뤼스가 파리에서 스트라빈스키의 「봄의 제전」 등을 선보이며 유럽을 충격에 빠뜨림. 앞서 차이콥스키의 발레 음악과 함께 러시아 무대예술이 세계 표준이 됨.'],
 [1917,2,'러시아 혁명','2월 혁명으로 니콜라이 2세가 퇴위하고, 10월에는 레닌의 볼셰비키가 무장봉기로 임시정부를 전복. 내전(1918~22)을 거쳐 세계 최초의 사회주의 국가 소련이 수립되어 20세기 세계를 양분함.'],
 [1921,4,'신경제정책(NEP)','전시공산주의의 실패로 경제가 붕괴하자 레닌이 곡물 징발을 폐지하고 소규모 사영과 시장을 부분 허용. 생산이 빠르게 회복되었으나 스탈린 집권 후 폐지되고 계획경제로 전환됨.'],
 [1929,2,'스탈린 체제','권력투쟁에서 승리한 스탈린이 농업 집단화와 5개년 계획을 강행 — 우크라이나 대기근(홀로도모르) 등으로 수백만이 희생됨. 대숙청(1937~38)으로 공포 체제를 완성하며 급속한 공업화를 이룸.'],
 [1941,1,'독소전쟁','히틀러의 바르바로사 작전으로 시작된 사상 최대의 지상전에서 소련 군민 2,700만 명이 사망. 스탈린그라드(1943)와 쿠르스크의 승리로 전세를 뒤집고 1945년 베를린을 함락함.'],
 [1956,2,'스탈린 비판과 동유럽','흐루쇼프가 20차 당대회에서 스탈린 개인숭배를 비판하고 평화공존을 내세움. 헝가리 봉기가 무력 진압되고 중·소 분쟁이 시작되며 사회주의권이 분열됨.'],
 [1957,4,'스푸트니크','세계 최초의 인공위성 발사로 미국에 "스푸트니크 쇼크"를 안기며 우주 경쟁이 개막. 1961년에는 가가린이 인류 최초로 지구 궤도를 돎 — "지구는 푸르다".'],
 [1962,1,'쿠바 미사일 위기','소련의 쿠바 핵미사일 배치를 둘러싸고 미소가 13일간 대치하며 핵전쟁 직전까지 감. 케네디와 흐루쇼프의 막후 타협으로 해소되었고, 핫라인 설치와 데탕트의 계기가 됨.'],
 [1986,2,'체르노빌 사고','원자로 폭발로 유럽 전역에 방사능이 퍼지고 은폐 시도가 드러나며 소련 체제의 신뢰가 무너짐. 글라스노스트(개방)가 가속되어 체제 해체의 한 원인이 되었다고 평가됨.'],
 [1991,2,'소련 해체','고르바초프의 개혁(페레스트로이카)에도 체제 모순이 폭발, 8월 쿠데타 실패 후 12월 소련이 15개 공화국으로 해체됨. 냉전이 종식되고 옐친의 러시아는 급진 시장화의 혼란을 겪음.'],
 [2022,1,'우크라이나 침공','푸틴이 "특별군사작전"을 선언하며 전면 침공했으나 우크라이나의 항전으로 장기전이 됨. 냉전 이후 유럽 최대의 전쟁으로 국제 질서에 신냉전 구도를 초래함.'],
]}]},

{name:'아 프 리 카', rows:[
{name:'아프리카', sub:'AFRICA',
 spans:[[-3100,-30,'고대 이집트'],[-814,700,'쿠시·카르타고·악숨'],[700,1600,'서아프리카 제국'],[1450,1870,'노예무역 시대'],[1884,1960,'식민 분할'],[1960,2030,'독립 아프리카']],
 events:[
 [-3100,0,'이집트 통일 왕국','상·하 이집트가 나르메르에 의해 통일되며 파라오 국가가 성립. 나일강의 규칙적 범람을 다스리는 관개와 태양력, 상형문자가 3천 년 지속될 문명의 틀을 만듦.'],
 [-1479,2,'하트셉수트의 치세','여성 파라오 하트셉수트가 20여 년간 통치하며 푼트 원정 등 교역을 확대. 전쟁보다 건축과 무역에 힘써 데이르엘바흐리 장제전 등의 걸작을 남김.'],
 [-1279,1,'람세스 2세','66년에 이르는 이례적으로 긴 치세 동안 카데시 전투와 아부심벨 신전 조영으로 신왕국의 절정을 이룸. 이후 "바다 민족"의 침입과 왕권 약화로 이집트는 서서히 쇠퇴기에 접어듦.'],
 [-814,0,'카르타고 건설 (전승)','페니키아인이 오늘날 튀니지에 식민시를 세웠다는 전승 기년. 서지중해 교역을 장악하는 해양 강국으로 성장했으나 포에니 전쟁 끝에 기원전 146년 로마에 완전히 파괴됨.'],
 [-747,0,'쿠시 왕국의 이집트 지배','수단 나파타의 쿠시 왕들이 북상해 이집트를 정복하고 제25왕조를 세움. 이른바 "검은 파라오" 시대로, 이후 메로에로 물러나 독자적 문자와 제철 문화를 발전시킴.'],
 [-30,1,'프톨레마이오스 이집트 멸망','악티움에서 패한 클레오파트라 7세가 스스로 목숨을 끊어 알렉산드로스의 후계 왕조가 끝나고, 3천 년을 이어온 파라오의 나라가 로마의 속주로 편입됨. 이집트의 곡물이 로마 시민을 먹이는 제국의 곡창이 되었고 헬레니즘 시대도 이로써 막을 내림.'],
 [330,3,'악숨의 기독교 수용','에티오피아 고원의 악숨 왕국이 에자나왕 때 기독교를 국교로 받아들임. 로마에 이어 세계에서 손꼽히게 이른 개종으로, 에티오피아 정교회는 오늘날까지 1,700년간 이어짐.'],
 [830,0,'가나 왕국','사하라를 건너오는 소금과 남쪽 삼림지대의 금을 맞바꾸는 종단 교역을 장악한 서아프리카 최초의 대왕국. 아랍 지리학자들이 "황금의 나라"로 기록했고 무슬림 상인에게 관세를 걷어 번영했으나, 알모라비드의 압박과 교역로 이동으로 쇠퇴해 13세기에 말리로 흡수됨.'],
 [1235,0,'말리 제국','순디아타 케이타가 키리나 전투에서 소소 왕국을 꺾고 니제르강 상류를 통일해 사하라 종단 금·소금 무역을 장악. 당대 세계 금 생산의 큰 몫을 쥐고 팀북투·젠네를 교역·학문 도시로 키웠으며, 구전 서사시 「순디아타」로 전승되며 서아프리카 국가 형성의 원형으로 남음.'],
 [1324,3,'만사 무사의 순례','말리의 만사 무사가 대규모 수행단과 함께 메카로 순례하며 카이로에 막대한 금을 뿌림. 그의 이름이 유럽 지도에까지 실리면서 서아프리카의 부가 지중해 세계에 알려짐.'],
 [1450,4,'팀북투의 학문','팀북투와 젠네가 상코레 등 마드라사를 중심으로 이슬람 학문의 중심지로 번영. 수십만 권의 필사본이 축적되어 사하라 이남에도 오랜 문자 전통이 있었음을 보여줌.'],
 [1464,0,'송가이 제국','순니 알리가 가오를 근거로 팀북투와 젠네를 차지하고, 쇠락한 말리를 대신해 서아프리카 최대의 제국을 세움. 아스키아 무함마드 대에 지방 총독제와 이슬람 학문을 정비해 니제르강 중류의 금·소금·노예 교역을 독점하며 전성기를 누림.'],
 [1498,4,'스와힐리 해안 교역','킬와·몸바사 등 동아프리카 항구 도시들이 인도양 계절풍 무역으로 번성하던 중 바스쿠 다 가마가 도착. 반투어와 아랍어가 섞인 스와힐리어 문화권이 형성되었고 이후 포르투갈이 항구들을 장악함.'],
 [1502,1,'대서양 노예무역','아메리카 플랜테이션의 노동력 수요로 대서양을 건너는 노예 수송이 본격화됨. 이후 약 360년간 1,200만 명 이상이 강제 이송되어 아프리카의 인구와 사회 구조가 깊이 훼손됨.'],
 [1591,1,'송가이 멸망','모로코 사드 왕조가 사하라를 건너 보낸 화승총 부대가 톤디비에서 송가이의 대군을 격파해 서아프리카 제국의 시대가 끝남. 팀북투의 학자들이 끌려가고 사하라 종단 교역의 축은 대서양 연안으로 옮겨가, 유럽의 노예무역이 내륙까지 파고드는 길이 열림.'],
 [1652,2,'케이프 식민지','네덜란드 동인도회사가 희망봉에 보급 기지를 세우며 유럽인의 정착이 시작됨. 이후 영국이 차지하고 보어인이 내륙으로 이동하면서 남아프리카의 인종 갈등 구조가 배태됨.'],
 [1805,2,'무함마드 알리의 개혁','오스만의 이집트 총독이 맘루크를 제거하고 서구식 군대와 공장, 근대 교육을 도입해 사실상 독립 국가를 세움. 비서구권 최초의 근대화 시도로 꼽히나 열강의 개입으로 좌절됨.'],
 [1884,2,'베를린 회담','비스마르크가 주재한 회담에서 유럽 열강이 아프리카 분할의 원칙에 합의. 현지 사정과 무관하게 그어진 직선 국경이 독립 후 종족 분쟁의 씨앗이 됨.'],
 [1896,1,'아드와 전투','에티오피아의 메넬리크 2세가 침공한 이탈리아군을 격파해 독립을 지켜냄. 아프리카가 유럽 열강을 정규전에서 꺾은 대표적 사례로 범아프리카주의의 상징이 됨.'],
 [1898,1,'파쇼다 사건','종단 정책의 영국과 횡단 정책의 프랑스가 수단 파쇼다에서 충돌 직전까지 감. 프랑스의 양보로 전쟁을 피했고 이를 계기로 양국이 접근해 영불협상(1904)이 성립됨.'],
 [1948,2,'아파르트헤이트','남아프리카의 국민당 정권이 인종별 거주·통혼·교육을 법으로 분리하는 극단적 인종차별 체제를 제도화. 국제사회의 제재와 만델라 등의 저항 끝에 1990년대에 해체됨.'],
 [1957,0,'가나 독립','은크루마의 지도로 사하라 이남에서 처음 독립을 이루고 범아프리카주의를 주창. 이후 독립의 물결이 대륙 전체로 번지며 "아프리카의 해"(1960)로 이어짐.'],
 [1960,2,'아프리카의 해','한 해에만 17개국이 독립하며 식민 지배가 급속히 해체됨. 그러나 자원 편중 경제와 인위적 국경, 냉전 개입이 겹치며 독립 후의 정치적 불안정이 이어짐.'],
 [1963,2,'아프리카 통일기구','에티오피아 아디스아바바에서 32개국이 모여 대륙 차원의 협력 기구를 창설. 2002년 아프리카연합(AU)으로 개편되어 분쟁 조정과 경제 통합을 추진함.'],
 [1994,2,'남아공 민주 선거','만델라가 27년의 수감 끝에 석방되고 전 인종이 참여한 선거로 대통령에 당선. 46년의 아파르트헤이트가 종식되고 진실화해위원회를 통한 과거 청산이 시도됨.'],
 [2010,4,'인구·경제의 부상','유선 인프라를 건너뛴 휴대전화 보급과 케냐 엠페사 같은 모바일 금융으로 성장세를 보이며 중위연령 19세의 가장 젊은 대륙이 됨. 2021년 아프리카대륙자유무역지대가 출범했고 2050년경 세계 인구 4명 중 1명이 아프리카인이 될 것으로 전망되나, 자원 의존과 일자리 부족이 과제로 남음.'],
]}]},

{name:'아 메 리 카', rows:[
{name:'라틴아메리카', sub:'LATIN AMERICA',
 spans:[[-3000,-1200,'수렵·초기 농경 (선사)',1],[-1200,-400,'올메카'],[-100,900,'테오티우아칸·마야 고전기'],[900,1533,'톨텍·아스텍·잉카'],[1521,1810,'식민지 시대'],[1810,1898,'독립과 내전'],[1898,2030,'현대 라틴아메리카']],
 events:[
 [-1200,3,'올메카 문명','멕시코만 연안에서 거대 두상 석조와 의례 중심지를 남긴 메소아메리카 최초의 복합 사회가 형성됨. 역법·구기 경기 등 이후 마야와 아스텍이 공유하는 문화 요소의 원형을 만듦.'],
 [-900,0,'차빈 문화','안데스 고지의 차빈데우안타르를 중심으로 페루 일대가 처음 하나의 종교·양식권으로 묶임. 관개 농업과 금속 세공이 발달해 이후 모체·와리·잉카로 이어지는 안데스 문명의 출발점이 됨.'],
 [-100,0,'테오티우아칸','멕시코 분지에 인구 10만이 넘는 계획 도시가 세워져 태양·달의 피라미드와 격자형 가로가 조성됨. 당대 세계 최대급 도시로 중앙아메리카 전역에 영향을 미쳤으나 7세기경 원인 불명으로 쇠퇴함.'],
 [250,4,'마야 고전기','티칼·팔렝케 등 도시국가들이 경쟁하며 표의문자와 정교한 역법, 숫자 0의 개념을 독자적으로 발전시킴. 9세기 남부 저지대 도시들이 가뭄과 전쟁 속에 연쇄적으로 버려지는 "마야 붕괴"를 겪음.'],
 [1325,0,'아스텍 테노치티틀란','멕시카인이 텍스코코 호수의 섬에 도읍을 세움(전승 기년). 인공 경작지 치남파와 삼국 동맹으로 15세기에는 인구 20만의 제국 수도로 성장함.'],
 [1438,0,'잉카 제국','파차쿠텍의 즉위와 함께 쿠스코를 중심으로 급팽창해 에콰도르에서 칠레까지 4천 km를 아우름. 문자 없이 결승 기록 키푸와 4만 km의 도로망, 미타 부역제로 제국을 운영함.'],
 [1492,1,'콜럼버스의 도착','콜럼버스가 카리브해에 상륙하며 두 대륙이 처음 접촉함. 이후 작물·가축·질병이 오간 "콜럼버스의 교환"으로 세계 인구와 식생활이 재편됨.'],
 [1494,2,'토르데시야스 조약','교황의 중재로 에스파냐와 포르투갈이 대서양에 경계선을 긋고 신대륙을 양분. 브라질만 포르투갈령이 되어 오늘날 라틴아메리카의 언어 지도가 결정됨.'],
 [1521,1,'아스텍 멸망','코르테스가 수백의 병력과 원주민 동맹군을 이끌고 테노치티틀란을 함락함. 천연두 등 유럽에서 온 전염병이 결정적으로 작용해 원주민 인구가 한 세기 만에 급감함.'],
 [1533,1,'잉카 멸망','피사로가 카하마르카에서 아타왈파를 사로잡아 몸값을 받고 처형한 뒤 쿠스코를 점령함. 1572년 빌카밤바의 저항이 진압되며 안데스 전역이 에스파냐 부왕령으로 편입됨.'],
 [1545,4,'포토시 은광','볼리비아 고지에서 사상 최대급 은광이 발견되어 원주민 미타 노역으로 채굴이 시작됨. 여기서 나온 은이 세비야를 거쳐 명·청 중국까지 흘러들며 최초의 세계적 통화 순환을 만듦.'],
 [1550,2,'엔코미엔다와 원주민 논쟁','정복자에게 원주민 노동을 맡긴 엔코미엔다의 가혹함을 라스카사스가 고발해 원주민의 인간성 논쟁이 벌어짐. 원주민 급감으로 아프리카 노예 수입이 늘고 혼혈 신분 사회가 형성됨.'],
 [1791,2,'아이티 혁명','생도맹그의 흑인 노예들이 투생 루베르튀르의 지도로 봉기해 프랑스군을 물리침. 1804년 세계 최초의 흑인 공화국이 수립되며 노예제의 정당성이 흔들림.'],
 [1810,2,'독립 전쟁의 개막','이달고 신부의 봉기와 남미 각지의 자치 정부 수립으로 에스파냐령 전역에서 독립 전쟁이 시작됨. 볼리바르와 산마르틴의 원정으로 1820년대에 대부분의 공화국이 독립을 이룸.'],
 [1822,0,'브라질 독립','포르투갈 왕실의 피난처였던 브라질에서 왕자 페드루가 독립을 선언하고 황제로 즉위함. 유혈 사태가 거의 없는 이례적 독립이었으나 노예제는 1888년까지 존속함.'],
 [1879,1,'태평양 전쟁 (남미)','초석 자원을 둘러싸고 칠레가 페루·볼리비아 연합과 4년간 싸워 승리함. 볼리비아가 해안선을 잃고 내륙국이 되면서 오늘까지 이어지는 영토 분쟁의 뿌리가 됨.'],
 [1910,2,'멕시코 혁명','디아스의 34년 독재에 맞선 봉기가 사파타·비야의 농민군으로 확산되어 10년간 내전이 이어짐. 토지 개혁과 정교 분리를 담은 1917년 헌법은 20세기 사회 개혁 헌법의 선구가 됨.'],
 [1914,4,'파나마 운하 개통','미국이 콜롬비아에서 파나마를 독립시킨 뒤 10년 공사로 대서양과 태평양을 연결. 카리브해가 미국의 "뒷마당"이 되어 곤봉 외교로 불리는 개입주의가 본격화됨.'],
 [1934,2,'포퓰리즘의 대두','대공황으로 1차산품 수출이 무너지자 멕시코 카르데나스의 석유 국유화와 브라질 바르가스, 아르헨티나 페론(1946)의 대중 동원 정치가 잇달아 등장. 수입대체 공업화가 추진되었으나 정치 불안정도 남김.'],
 [1959,2,'쿠바 혁명','카스트로와 게바라의 게릴라가 바티스타 정권을 무너뜨리고 사회주의 노선을 선택함. 미국과 단교하고 소련에 접근하면서 1962년 쿠바 미사일 위기로 냉전이 정점에 이름.'],
 [1973,2,'칠레 쿠데타','피노체트가 아옌데의 선출된 사회주의 정부를 무력으로 전복하고 17년 군사독재를 시작함. 이후 20세기 후반 라틴아메리카 전역이 군부 통치와 민주화의 순환을 겪음.'],
 [1985,2,'민주화의 물결','브라질·아르헨티나 등에서 군정이 잇달아 물러나며 대륙 대부분이 선거 민주주의로 복귀함. 그러나 외채 위기로 "잃어버린 10년"의 침체와 극심한 불평등이 과제로 남음.'],
 [2026,1,'미국의 베네수엘라 개입','마약 밀매와 부정 선거를 명분으로 미국이 1월 베네수엘라를 공습하고 니콜라스 마두로 대통령을 체포함. 1823년 먼로 독트린 이래 이어진 서반구 개입의 최근 사례로, 중남미 각국과 국제법상 정당성을 둘러싼 논란이 커짐.'],
]},
{name:'미국', sub:'UNITED STATES',
 spans:[[1607,1776,'식민지 시대'],[1776,1865,'건국~남북전쟁'],[1865,1917,'산업화와 팽창'],[1917,1991,'세계대전과 냉전'],[1991,2030,'초강대국']],
 events:[
 [1607,0,'제임스타운','버지니아 회사가 세운 최초의 영국 영구 식민지 — 정착민 태반이 죽어나간 "굶주림의 시기"를 딛고 담배 재배로 자리 잡음. 1620년에는 메이플라워호의 청교도들이 플리머스에 도착함.'],
 [1636,3,'하버드 설립과 대각성','청교도들이 목사 양성을 위해 하버드 칼리지를 세우고, 18세기 대각성 운동으로 종교적 열정이 식민지 전체를 휩쓺. 교파 경쟁 속에 종교의 자유와 자발적 결사의 전통이 미국 문화에 뿌리내림.'],
 [1776,2,'독립선언','"대표 없는 과세 없다"를 외친 13개 식민지가 7월 4일 제퍼슨이 기초한 독립선언을 채택. 워싱턴의 대륙군이 프랑스의 지원 속에 요크타운에서 승리해 1783년 독립을 승인받음.'],
 [1787,2,'연방 헌법 제정','필라델피아 제헌회의가 연방제와 삼권분립, 견제와 균형의 성문 헌법을 기초. 권리장전(수정 1~10조, 1791)과 함께 지금까지 유지되는 세계에서 가장 오래된 성문 헌법.'],
 [1803,2,'루이지애나 매입','나폴레옹이 아이티 혁명과 전쟁 자금난으로 미시시피강 서쪽의 광대한 땅을 1,500만 달러에 매각. 하루아침에 국토가 2배가 되었고 루이스-클라크 탐험대가 서부의 문을 엶.'],
 [1823,2,'먼로 독트린','먼로 대통령이 유럽의 아메리카 간섭을 거부하고 미국도 유럽 문제에 개입하지 않겠다고 선언. 라틴아메리카 독립을 지지하는 명분이자 훗날 미국의 서반구 패권을 정당화하는 논리가 됨.'],
 [1848,4,'캘리포니아 골드러시','1월 새크라멘토 인근 서터스밀에서 금이 발견되고 열흘 뒤 강화조약으로 캘리포니아가 미국 영토가 됨. 이듬해부터 전 세계에서 30만 명이 몰려들어 샌프란시스코가 도시로 커졌고, 서부 개척이 가속되며 "명백한 운명"론이 힘을 얻음.'],
 [1861,1,'남북전쟁','노예제 확대를 둘러싼 갈등 끝에 남부 11개 주가 연방을 탈퇴해 개전, 62만 명이 전사한 미국사 최대의 유혈. 링컨의 노예해방 선언(1863)과 연방의 승리로 노예제가 폐지됨(수정 13조).'],
 [1863,2,'게티즈버그 연설','링컨이 격전지 봉헌식에서 272단어로 "국민의, 국민에 의한, 국민을 위한 정부"를 선언. 건국 이념을 자유와 평등의 재확인으로 재정의한 미국 정치 수사의 원형이 됨.'],
 [1869,4,'대륙횡단철도 완공','유타 프로몬토리에서 동서 철도가 만나 6개월 걸리던 대륙 횡단이 1주일로 단축됨. 중국인 노동자의 희생 위에 전국 단일 시장이 형성되고 표준시가 도입됨.'],
 [1879,4,'에디슨의 전구','에디슨이 오래 견디는 탄소 필라멘트 전구를 완성하고 발전소와 배전망까지 시스템으로 구축. 테슬라·웨스팅하우스의 교류 방식과 경쟁하며 전기 문명이 개화함.'],
 [1892,2,'엘리스섬과 대이민','뉴욕항의 엘리스섬 이민국이 문을 열어 1954년 폐쇄까지 1,200만 명을 심사함. 1880~1920년대에 2천만 명이 넘게 들어왔고 이탈리아·동유럽·유대계가 다수를 이룸. 값싼 노동력이 산업화를 떠받쳤고 다인종 사회라는 미국의 성격이 형성되었으나, 1924년 이민법으로 출신국별 할당이 도입됨.'],
 [1899,2,'문호개방 선언','국무장관 헤이가 열강의 중국 분할에 맞서 문호개방·기회균등·영토 보전을 제창. 뒤늦게 뛰어든 미국이 중국 시장에 진입하는 통로가 되었고 일본과의 대립의 씨앗이 됨.'],
 [1903,4,'라이트 형제의 비행','자전거 기술자 라이트 형제가 키티호크 해변에서 12초, 36m의 동력 비행에 성공. 66년 뒤 인류가 달에 서기까지 이어진 20세기 기술 가속의 상징.'],
 [1908,4,'포드 모델 T','포드가 컨베이어벨트 조립라인(1913)으로 자동차 가격을 3분의 1로 낮춰 1,500만 대를 판매. 노동자가 자신이 만든 차를 살 수 있는 대량생산-대량소비 사회가 시작됨.'],
 [1917,1,'제1차 세계대전 참전','독일의 무제한 잠수함전과 치머만 전보를 계기로 참전해 연합국의 승리를 결정지음. 윌슨의 14개조와 민족자결주의가 전후 질서의 언어가 됨(3·1운동에도 영향).'],
 [1919,2,'베르사유 체제와 국제연맹','윌슨의 제안으로 국제연맹이 창설되었으나 정작 미국 상원이 비준을 거부해 불참. 집단안보의 첫 시도였지만 강제력이 없어 2차대전을 막지 못하고 UN으로 대체됨.'],
 [1920,2,'여성 참정권','세니커폴스 대회(1848)부터 72년의 운동 끝에 여성 투표권을 보장한 수정헌법 19조가 비준됨. 각국 여성 참정권 확산의 촉매가 됨.'],
 [1927,3,'재즈와 대중문화','뉴올리언스에서 태어난 재즈가 라디오와 유성영화를 타고 세계로 퍼지며 미국이 대중문화의 중심이 됨. 할리우드와 함께 20세기 문화적 영향력의 토대가 됨.'],
 [1929,4,'대공황','10월 24일 "검은 목요일"의 주가 폭락이 은행 연쇄 도산과 실업률 25%로 이어짐. 루스벨트의 뉴딜이 정부 개입의 새 패러다임을 제시했으나, 세계적 공황은 보호무역과 전체주의 대두의 배경이 됨.'],
 [1929,4,'우주 팽창의 발견','허블이 윌슨산 천문대에서 은하가 멀수록 빠르게 멀어진다는 관계를 밝혀, 우주가 팽창하고 있음을 보임. 정적이고 영원한 우주라는 오랜 관념이 무너지고 우주에 시작이 있다는 대폭발 이론으로 이어졌으며, 1965년 우주배경복사의 발견으로 확증됨.'],
 [1941,1,'진주만과 제2차 세계대전','일본의 기습으로 태평양함대가 타격을 입자 "치욕의 날" 연설과 함께 참전. 미드웨이 해전(1942)으로 전세를 뒤집고 "민주주의의 병기창"으로 연합국 승리를 견인, 1945년 원폭 투하로 종전.'],
 [1942,4,'맨해튼 계획','오펜하이머의 지휘 아래 13만 명과 20억 달러가 투입된 사상 최대의 과학 프로젝트로 원자폭탄이 개발됨. 국가가 과학을 조직하는 "거대과학"의 모델이 되었고 핵의 시대를 엶.'],
 [1945,2,'전후 질서 주도','UN 창설과 브레턴우즈 체제(IMF·세계은행·달러 기축통화)를 설계하며 초강대국으로 부상. 마셜 플랜으로 유럽을 재건하며 자유주의 국제 질서를 구축함.'],
 [1947,2,'트루먼 독트린','그리스·터키 지원을 선언하며 공산주의 봉쇄를 국가 전략으로 채택 — 냉전의 공식 개막. NATO 창설(1949)과 한국전쟁 참전으로 이어지는 40년 대립 구도의 출발점.'],
 [1947,4,'트랜지스터 발명','벨 연구소의 쇼클리 팀이 진공관을 대체하는 반도체 소자를 발명하고, 이어 집적회로(1958)가 등장. 실리콘밸리와 컴퓨터 산업의 물질적 토대가 마련되어 정보혁명의 문이 열림.'],
 [1949,2,'나토 창설','베를린 봉쇄를 계기로 미국·캐나다와 서유럽 10개국, 모두 12개국이 집단방위 기구를 결성. 소련은 바르샤바조약기구(1955)로 맞서며 냉전의 군사 블록 대립이 굳어짐.'],
 [1964,2,'민권법','몽고메리 버스 보이콧(1955)과 워싱턴 대행진("나에게는 꿈이 있습니다", 1963)의 결실로 인종 차별을 불법화. 이듬해 투표권법으로 남부의 흑인 차별 체제가 해체됨.'],
 [1965,1,'베트남 전쟁 개입','통킹만 사건을 구실로 지상군을 파병해 최대 54만 명을 투입했으나 1973년 철수하고 1975년 남베트남이 패망. 반전 운동과 함께 봉쇄 정책의 한계가 드러남.'],
 [1969,4,'아폴로 11호 달 착륙','암스트롱과 올드린이 인류 최초로 달에 착륙, 6억 명이 생중계로 지켜봄. 스푸트니크 쇼크로 시작된 우주 경쟁의 승리이자 "인류의 위대한 도약".'],
 [1969,4,'인터넷의 탄생','국방부 연구망 아르파넷이 4개 대학을 연결하고, 1989년 팀 버너스리의 월드와이드웹과 결합해 대중화됨. 정보 유통 비용을 사실상 0으로 만들며 인류의 소통 방식을 바꿈.'],
 [1972,2,'닉슨의 중국 방문','닉슨이 베이징을 방문해 미중 화해를 이루고 소련과 전략무기제한협정(SALT)을 체결. 냉전의 양극 대결이 다극적 긴장 완화(데탕트)로 바뀜.'],
 [1991,2,'냉전 승리','소련 해체로 45년의 냉전이 끝나고 유일 초강대국이 됨. "역사의 종언"이 선언된 단극 체제 아래 세계화와 정보화가 가속됨.'],
 [2001,1,'9·11 테러','알카에다가 납치 여객기로 세계무역센터와 펜타곤을 공격해 2,977명이 사망. 아프가니스탄·이라크 전쟁 등 20년의 "테러와의 전쟁"이 시작되며 세계 안보 패러다임이 일변함.'],

 '미국|2020|코로나19 팬데믹':['thumb/2/26/COVID-19_Outbreak_World_Map.svg/960px-COVID-19_Outbreak_World_Map.svg.png','COVID-19_Outbreak_World_Map.svg'],
 '미국|2022|생성형 AI 시대':['thumb/e/ef/ChatGPT-Logo.svg/960px-ChatGPT-Logo.svg.png','ChatGPT-Logo.svg']
};

/* ───────── build ───────── */
let dragged=false;   /* 드래그 직후의 click 이벤트를 구분하기 위한 플래그 */
const canvas=document.getElementById('canvas');
const viewport=document.getElementById('viewport');
const tip=document.getElementById('tip');
const active=new Set([0,1,2,3,4]);   /* 범례 필터 상태 */
let evEls=[], bandEls=[];            /* 스크롤 처리용 캐시 — build()가 갱신 */
let keyIndex=new Map(), relSvg=null; /* 사건 키 → 좌표·데이터, 관계선 SVG 레이어 */
const SVGNS='http://www.w3.org/2000/svg';
const fmtY=y=> y<0 ? 'BC '+(-y) : String(y);
const labelW=t=>[...t].reduce((w,ch)=>w+(ch.charCodeAt(0)>0x2000?11.4:6.6),0)+14;

/* 눈금: 배율을 곱한 간격이 130px 이상이 되는 단위를 구간별로 고름 */
function makeTicks(){
  const NICE=[5,10,25,50,100,250,500,1000], t=[];
  for(const [a,b,k] of SEGS){
    const step=NICE.find(s=>s*k*Z>=130)||1000;
    for(let y=Math.ceil(a/step)*step; y<b; y+=step) t.push(y);
  }
  return t;
}

/* 배율이 바뀔 때마다 전체 캔버스를 다시 그린다 (549개 사건 기준 수십 ms) */
function build(){
canvas.innerHTML='';
keyIndex=new Map();
canvas.style.width=totalW()+'px';
const frag=document.createDocumentFragment();

/* axis */
const axis=document.createElement('div'); axis.id='axis';
for(let i=0;i<ERAS.length;i++){
  const [start,name]=ERAS[i], end=(i+1<ERAS.length)?ERAS[i+1][0]:ERAEND;
  const b=document.createElement('div'); b.className='eraband serif';
  b.style.left=X(start)+'px'; b.style.width=(X(end)-X(start))+'px';
  b.dataset.x=X(start); b.dataset.w=X(end)-X(start);
  const bi=document.createElement('i'); bi.textContent=name; b.appendChild(bi);
  axis.appendChild(b);
}
const ticks=makeTicks();
for(const y of ticks){
  const major = y%500===0 || (y>=1500&&y%100===0);
  const t=document.createElement('div'); t.className='tick'+(major?' major':'');
  t.style.left=X(y)+'px';
  const s=document.createElement('span'); s.textContent=fmtY(y); t.appendChild(s);
  axis.appendChild(t);
}
frag.appendChild(axis);

/* vertical gridlines + era shading (behind rows) */
for(let i=0;i<ERAS.length;i++){
  if(i%2===1){
    const start=ERAS[i][0], end=(i+1<ERAS.length)?ERAS[i+1][0]:ERAEND;
    const sh=document.createElement('div'); sh.className='erashadeCol';
    sh.style.left=X(start)+'px'; sh.style.width=(X(end)-X(start))+'px';
    frag.appendChild(sh);
  }
}
for(const y of ticks){
  const g=document.createElement('div');
  g.className='gridline'+((y%500===0||ERAS.some(e=>e[0]===y))?' major':'');
  g.style.left=X(y)+'px'; frag.appendChild(g);
}
for(const [start] of ERAS){
  const g=document.createElement('div'); g.className='gridline major';
  g.style.left=X(start)+'px'; frag.appendChild(g);
}

/* rows */
for(const region of REGIONS){
  const rh=document.createElement('div'); rh.className='regionhead';
  const rl=document.createElement('span'); rl.className='rl'; rl.textContent=region.name;
  rh.appendChild(rl); frag.appendChild(rh);

  for(const row of region.rows){
    const r=document.createElement('div'); r.className='row';
    const base=document.createElement('div'); base.className='baseline'; r.appendChild(base);

    row.spans.forEach(([a,b,name,pre],i)=>{
      const s=document.createElement('div'); s.className='span'+(i%2?' alt':'')+(pre?' pre':'');
      const x1=Math.max(X(a),RAIL), x2=X(Math.min(b,2026));
      if(x2-x1<6)return;
      s.style.left=x1+'px'; s.style.width=(x2-x1-2)+'px';
      s.dataset.x=x1; s.dataset.w=x2-x1-2;
      if(x2-x1>46){const i=document.createElement('i');i.textContent=name;s.appendChild(i);}
      s.title=name+' ('+fmtY(a)+' ~ '+(b>=2030?'현재':fmtY(b))+')';
      r.appendChild(s);
    });

    /* stagger labels onto 4 shelves */
    /* 라벨 선반: 기준선(BASE=75) 위·아래로 번갈아 배치 */
    const shelves=[{y:41,end:-1e9},{y:91,end:-1e9},{y:57,end:-1e9},{y:109,end:-1e9},{y:25,end:-1e9},{y:127,end:-1e9}];
    const evs=[...row.events].sort((a,b)=>a[0]-b[0]);
    for(const [year,cat,title,desc] of evs){
      const x=X(year), w=labelW(title);
      let shelf=shelves.find(s=>x>s.end+8);
      if(!shelf)shelf=shelves.reduce((m,s)=>s.end<m.end?s:m);
      shelf.end=x+w;
      const e=document.createElement('div'); e.className='ev'; e.dataset.cat=cat;
      e.style.left=x+'px';
      if(!active.has(cat))e.classList.add('dim');   /* 재빌드 시 필터 상태 유지 */
      const color='var(--c'+cat+')';
      const dot=document.createElement('div'); dot.className='dot'; dot.style.background=color;
      e.appendChild(dot);
      if(Math.abs(shelf.y-BASE)>20){
        const c=document.createElement('div'); c.className='conn';
        if(shelf.y<BASE){c.style.top=(shelf.y+15)+'px'; c.style.height=(BASE-5-shelf.y-15)+'px';}
        else{c.style.top=(BASE+5)+'px'; c.style.height=(shelf.y-BASE-5)+'px';}
        e.appendChild(c);
      }
      const l=document.createElement('div'); l.className='lbl';
      l.style.top=shelf.y+'px'; l.textContent=title;
      e.appendChild(l);
      e.dataset.x=x; e.dataset.w=w;
      const key=row.name+'|'+year+'|'+title;
      e.dataset.key=key;
      if(relAdj.has(key))e.classList.add('hasrel');
      keyIndex.set(key,{el:e,x,year,cat,title,desc,rowName:row.name,y:0,rowTop:0});
      e.tabIndex=0; e.setAttribute('role','button');
      e.setAttribute('aria-label',koreanYear(year)+' '+row.name+' — '+title);
      e.addEventListener('mouseenter',ev=>{
        showTip(ev,year,cat,title,desc,row.name,key);
        if(!pinned)showRel(key);   /* 마우스오버만으로 관계 표시 (핀 상태가 우선) */
      });
      e.addEventListener('mousemove',moveTip);
      e.addEventListener('mouseleave',()=>{
        if(!pinned){tip.style.display='none'; clearRel();}
      });
      e.addEventListener('click',ev=>{
        if(dragged)return;   /* 드래그로 스크롤한 직후의 클릭은 무시 */
        ev.stopPropagation();
        pinTip(e,year,cat,title,desc,row.name);
      });
      e.addEventListener('focus',()=>{
        /* 마우스 클릭도 포커스를 주므로, 그때는 click 쪽에만 맡긴다.
           둘 다 pinTip을 부르면 핀이 켜졌다 곧바로 꺼져 고정이 안 됨 */
        if(!e.matches(':focus-visible'))return;
        e.scrollIntoView({block:'nearest',inline:'center',behavior:'auto'});
        pinTip(e,year,cat,title,desc,row.name);
      });
      e.addEventListener('keydown',ev=>{
        if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pinTip(e,year,cat,title,desc,row.name);}
      });
      r.appendChild(e);
    }

    const lab=document.createElement('div'); lab.className='rowlabel';
    lab.innerHTML='<b>'+row.name+'</b><small>'+row.sub+'</small>';
    r.prepend(lab);
    frag.appendChild(r);
  }
}
canvas.appendChild(frag);

/* 스크롤 처리용 캐시 갱신 */
evEls=[...canvas.querySelectorAll('.ev')].map(el=>({el, x:+el.dataset.x, w:+el.dataset.w, behind:false}));
bandEls=[...canvas.querySelectorAll('.eraband, .span')].filter(el=>el.querySelector('i'))
  .map(el=>({i:el.querySelector('i'), x:+el.dataset.x, w:+el.dataset.w, tx:-1}));

/* 관계선 SVG 오버레이 + 사건별 세로 좌표 캐시 (레이아웃 확정 후 계산) */
relSvg=document.createElementNS(SVGNS,'svg');
relSvg.id='relsvg';
relSvg.innerHTML='<defs><marker id="arrowm" viewBox="0 0 10 10" refX="8.5" refY="5"'
 +' markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">'
 +'<path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs><g id="relg"></g>';
canvas.appendChild(relSvg);
for(const info of keyIndex.values()){
  info.rowTop=info.el.parentElement.offsetTop;
  info.y=info.rowTop+BASE;
}
}
build();

/* ───────── tooltip ───────── */
function eraOf(y){let n=ERAS[0][1];for(const[s,name]of ERAS){if(y>=s)n=name}return n}
function koreanYear(y){return y<0?'기원전 '+(-y)+'년':y+'년'}
const isTouch=matchMedia('(hover: none)').matches;
let pinned=null;
/* 사건 이미지 블록. 자리를 미리 차지하되 로드 실패 시 스스로 접혀,
   오프라인(file://)에서는 이미지가 없던 때와 똑같이 보임 */
function imgHTML(key){
  const m=key&&IMGS[key]; if(!m)return '';
  return '<div class="tim"><img alt="" decoding="async" referrerpolicy="no-referrer" src="'
    +IMGB+m[0]+'"></div>'
    +'<a class="tsrc" href="https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(m[1])
    +'" target="_blank" rel="noreferrer">이미지: 위키미디어 공용</a>';
}
function fillTip(year,cat,title,desc,country,key){
  tip.innerHTML='<div class="ty">'+koreanYear(year)+' · '+country+'</div>'
    +'<div class="tt">'+title+'</div>'+imgHTML(key)+'<div class="td">'+desc+'</div>'
    +'<div class="tc"><i style="background:var(--c'+cat+')"></i>'+CATS[cat].n+' · '+eraOf(year)+'</div>';
  const im=tip.querySelector('.tim img');
  if(im){
    const box=im.parentElement;
    /* 원본이 박스보다 작으면 cover로 늘리면 흐려지므로 원본 크기로 맞춰 보여준다 */
    const mark=()=>{
      if(im.naturalWidth<box.clientWidth||im.naturalHeight<box.clientHeight)box.classList.add('fit');
      box.classList.add('on');
    };
    if(im.complete&&im.naturalWidth)mark();   /* 캐시된 이미지 */
    else{
      im.addEventListener('load',mark,{once:true});
      im.addEventListener('error',()=>box.classList.add('off'),{once:true});
    }
  }
}
function showTip(ev,year,cat,title,desc,country,key){
  if(pinned)return;
  fillTip(year,cat,title,desc,country,key);
  /* 관계가 있으면 힌트 한 줄 — 클릭하면 연결이 그려진다는 안내 */
  const rels=key&&relAdj.get(key);
  if(rels&&rels.length)tip.insertAdjacentHTML('beforeend',
    '<div class="rlhint">연관 사건 '+rels.length+'건 — 클릭하면 목록과 함께 고정</div>');
  tip.classList.remove('sheet'); tip.style.display='block'; moveTip(ev);
}
function moveTip(ev){
  if(pinned)return;
  const w=tip.offsetWidth,h=tip.offsetHeight, M=10;
  let x=ev.clientX+16,y=ev.clientY+14;
  if(x+w>innerWidth-M)x=ev.clientX-w-14;
  if(y+h>innerHeight-M)y=ev.clientY-h-12;
  /* 화면 밖으로 밀리지 않도록 최종 클램프 */
  x=Math.min(Math.max(M,x),Math.max(M,innerWidth-w-M));
  y=Math.min(Math.max(M,y),Math.max(M,innerHeight-h-M));
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
/* 클릭/터치: 하단 시트로 고정 표시 + 연관 사건 연결 표시 */
function pinTip(el,year,cat,title,desc,country){
  if(pinned===el){hideTip();return;}
  if(pinned)pinned.classList.remove('sel');
  pinned=el; el.classList.add('sel');
  fillTip(year,cat,title,desc,country,el.dataset.key);
  tip.insertAdjacentHTML('beforeend',relChipsHTML(el.dataset.key));
  showRel(el.dataset.key);
  tip.classList.add('sheet');
  tip.style.left=''; tip.style.top='';
  tip.style.display='block';
}
function hideTip(){
  if(pinned)pinned.classList.remove('sel');
  pinned=null; tip.style.display='none'; tip.classList.remove('sheet');
  clearRel();
}

/* ───────── 사건 간 관계 표시 ───────── */
function clearRel(){
  canvas.classList.remove('relmode');
  const g=relSvg&&relSvg.querySelector('#relg');
  if(g)g.innerHTML='';
  for(const el of canvas.querySelectorAll('.ev.rel'))el.classList.remove('rel');
}
function showRel(key){
  clearRel();
  const rels=relAdj.get(key); if(!rels||!rels.length)return;
  const a=keyIndex.get(key); if(!a)return;
  canvas.classList.add('relmode');
  a.el.classList.add('rel');   /* 기준 사건도 강조 대상에 포함 */
  for(const r of rels){
    const b=keyIndex.get(r.key); if(!b)continue;
    b.el.classList.add('rel');
    /* 인과는 원인→결과 방향으로 화살표를 그린다 */
    if(r.type==='cause'&&r.dir==='in')drawLink(b,a,'cause');
    else drawLink(a,b,r.type);
  }
}
function drawLink(a,b,type){
  const g=relSvg.querySelector('#relg');
  const x1=a.x,y1=a.y,x2=b.x,y2=b.y;
  let d;
  if(y1===y2){          /* 같은 행: 기준선 위로 아치 */
    const cy=y1-58;
    d=`M ${x1} ${y1} C ${x1+(x2-x1)*.25} ${cy}, ${x1+(x2-x1)*.75} ${cy}, ${x2} ${y2}`;
  }else if(Math.abs(x2-x1)<24){   /* 같은 해 다른 행: 옆으로 불룩한 세로 곡선 */
    const bx=Math.max(x1,x2)+56;
    d=`M ${x1} ${y1} C ${bx} ${y1}, ${bx} ${y2}, ${x2} ${y2}`;
  }else{
    d=`M ${x1} ${y1} C ${x1+(x2-x1)*.4} ${y1}, ${x1+(x2-x1)*.6} ${y2}, ${x2} ${y2}`;
  }
  const p=document.createElementNS(SVGNS,'path');
  p.setAttribute('d',d);
  p.setAttribute('fill','none');
  p.setAttribute('stroke',type==='cause'?'var(--accent)':'var(--ink3)');
  p.setAttribute('stroke-width','1.6');
  p.setAttribute('opacity','.85');
  if(type==='link')p.setAttribute('stroke-dasharray','5 4');
  else p.setAttribute('marker-end','url(#arrowm)');
  g.appendChild(p);
}
/* 툴팁의 연관 사건 목록 (핀 상태에서만 표시) */
function relChipsHTML(key){
  const rels=relAdj.get(key); if(!rels||!rels.length)return '';
  const items=rels.map(r=>{
    const t=keyIndex.get(r.key); if(!t)return '';
    const glyph=r.type==='cause'?(r.dir==='out'?'결과 →':'← 원인'):'연관';
    return '<button type="button" class="relchip" data-key="'+r.key.replace(/"/g,'&quot;')+'">'
      +'<span class="rc1"><i style="background:var(--c'+t.cat+')"></i>'
      +t.rowName+' · '+koreanYear(t.year)+' · <b>'+t.title+'</b><em>'+glyph+'</em></span>'
      +'<span class="rc2">'+r.note+'</span></button>';
  }).join('');
  return '<div class="rl2"><b>연관 사건 '+rels.length+'건</b>'+items+'</div>';
}
/* 칩 클릭 → 해당 사건으로 이동하며 핀 전환 */
tip.addEventListener('click',ev=>{
  const c=ev.target.closest('.relchip'); if(!c)return;
  const t=keyIndex.get(c.dataset.key); if(!t)return;
  viewport.scrollTo({
    left:Math.max(0,t.x-(viewport.clientWidth+RAIL)/2),
    top:Math.max(0,t.rowTop-(viewport.clientHeight-134)/2),
    behavior:smooth
  });
  pinTip(t.el,t.year,t.cat,t.title,t.desc,t.rowName);
});
/* 빈 곳을 탭하면 닫기 */
viewport.addEventListener('click',e=>{if(pinned&&!e.target.closest('.ev'))hideTip();});
addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});

/* ───────── legend filter ───────── */
const legend=document.getElementById('legend');
CATS.forEach((c,i)=>{
  const b=document.createElement('button'); b.type='button'; b.className='chip on';
  b.innerHTML='<span class="dot" style="background:var('+c.v+')"></span>'+c.n;
  b.setAttribute('aria-pressed','true');
  b.addEventListener('click',()=>{
    if(active.has(i)&&active.size===1){for(let k=0;k<5;k++)active.add(k);}
    else if(active.size===5){active.clear();active.add(i);}
    else if(active.has(i)){active.delete(i);if(active.size===0)for(let k=0;k<5;k++)active.add(k);}
    else active.add(i);
    document.querySelectorAll('#legend .chip').forEach((el,k)=>{
      el.className='chip '+(active.has(k)?'on':'off');
      el.setAttribute('aria-pressed',active.has(k));
    });
    document.querySelectorAll('.ev').forEach(el=>{
      el.classList.toggle('dim',!active.has(+el.dataset.cat));
    });
  });
  legend.appendChild(b);
});

/* ───────── era navigation ───────── */
const smooth=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
const eranav=document.getElementById('eranav');
[['처음',-3000],...ERAS.slice(1).map(e=>[e[1],e[0]]),['오늘',2026]].forEach(([name,y])=>{
  const b=document.createElement('button'); b.type='button'; b.textContent=name;
  b.addEventListener('click',()=>{
    viewport.scrollTo({left:Math.max(0,X(y)-RAIL-60),behavior:smooth});
  });
  eranav.appendChild(b);
});

/* ───────── zoom ───────── */
const zin=document.getElementById('zin'), zout=document.getElementById('zout'), zval=document.getElementById('zval');
/* anchorYear가 focusPx(뷰포트 안 화면 x) 자리에 그대로 남도록 배율을 바꾼다 */
function setZoom(n, anchorYear, focusPx){
  n=Math.max(0,Math.min(ZOOMS.length-1,n));
  if(n===zi)return;
  if(focusPx==null)focusPx=(viewport.clientWidth+RAIL)/2;
  if(anchorYear==null)anchorYear=invX(viewport.scrollLeft+focusPx);
  const st=viewport.scrollTop;
  zi=n; Z=ZOOMS[zi];
  hideTip();
  build();
  viewport.scrollLeft=Math.max(0, X(anchorYear)-focusPx);
  viewport.scrollTop=st;
  zval.textContent=Math.round(Z*100)+'%';
  zout.disabled=zi===0; zin.disabled=zi===ZOOMS.length-1;
  updateReadout(); updateBehind(); updateStickyLabels();
}
zin.addEventListener('click',()=>setZoom(zi+1));
zout.addEventListener('click',()=>setZoom(zi-1));
/* Ctrl(⌘)+휠, 트랙패드 핀치: 커서가 가리키는 연도를 고정점으로 확대/축소 */
viewport.addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey)return;
  e.preventDefault();
  const fx=e.clientX-viewport.getBoundingClientRect().left;
  setZoom(zi+(e.deltaY<0?1:-1), invX(viewport.scrollLeft+fx), fx);
},{passive:false});

/* ───────── readout ───────── */
const readout=document.getElementById('readout');
function updateReadout(){
  const cx=viewport.scrollLeft+(viewport.clientWidth+RAIL)/2;
  const y=Math.round(invX(cx));
  readout.innerHTML='<b>'+(y<0?'BC '+(-y):y)+'</b><span>'+eraOf(y)+' · 화면 중앙 연도</span>';
}
/* ───────── 레일에 가려지는 라벨 숨김 ───────── */
function updateBehind(){
  const sl=viewport.scrollLeft, edge=sl+RAIL+6;
  for(const it of evEls){
    /* 레일과 겹치는 구간(라벨 시작점이 레일 뒤, 끝점은 아직 레일 오른쪽)만 숨김.
       완전히 왼쪽으로 지나간 것은 어차피 보이지 않으므로 건드리지 않는다. */
    const behind = it.x < edge && it.x + it.w > sl;
    if(behind!==it.behind){it.behind=behind; it.el.classList.toggle('behind',behind);}
  }
}
/* ───────── 시대·왕조 밴드 라벨을 화면 안쪽에 붙여 두기 ─────────
   부모가 sticky/absolute 문맥이라 CSS position:sticky가 듣지 않으므로
   스크롤에 맞춰 transform으로 직접 밀어 준다. */
function updateStickyLabels(){
  const edge=viewport.scrollLeft+RAIL+14;
  for(const b of bandEls){
    const lw=b.i.offsetWidth;
    /* 밴드 왼쪽이 레일에 가리면 그만큼 오른쪽으로 밀되, 밴드 끝을 넘지 않게 */
    let tx=Math.max(0,Math.min(edge-b.x, b.w-lw-4));
    tx=Math.max(0,tx);
    if(tx!==b.tx){b.tx=tx; b.i.style.transform=tx?'translateX('+tx+'px)':'';}
  }
}
let raf=0;
function onScroll(){
  updateReadout();
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;updateBehind();updateStickyLabels()});
}
viewport.addEventListener('scroll',onScroll,{passive:true});
updateReadout(); updateBehind(); updateStickyLabels();

/* ───────── drag to pan ───────── */
let drag=null;
viewport.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  drag={x:e.clientX,y:e.clientY,sl:viewport.scrollLeft,st:viewport.scrollTop,id:e.pointerId,moved:false};
});
viewport.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;viewport.classList.add('dragging');viewport.setPointerCapture(drag.id);}
  if(drag.moved){viewport.scrollLeft=drag.sl-dx;viewport.scrollTop=drag.st-dy;}
});
['pointerup','pointercancel'].forEach(t=>viewport.addEventListener(t,()=>{
  if(drag&&drag.moved){
    viewport.classList.remove('dragging');
    dragged=true; setTimeout(()=>dragged=false,0);   /* 뒤이어 오는 click 한 번만 무시 */
  }
  drag=null;
}));

/* keyboard */
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')viewport.scrollBy({left:320,behavior:smooth});
  else if(e.key==='ArrowLeft')viewport.scrollBy({left:-320,behavior:smooth});
  else if(e.key==='+'||e.key==='=')setZoom(zi+1);
  else if(e.key==='-')setZoom(zi-1);
});
</script>
