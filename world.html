<title>한눈에 보는 인류사 — 가로 연대기</title>
<style>
:root{
  --bg:#F5F7F8; --panel:#EDF0F2; --ink:#232A33; --ink2:#5A6675; --ink3:#8B96A3;
  --hair:#D9E0E5; --grid:rgba(35,42,51,.08); --gridMajor:rgba(35,42,51,.20);
  --accent:#3A5FBF;
  --c0:#3A5FBF; --c1:#C0392B; --c2:#1F8A70; --c3:#8455A8; --c4:#9C7100;
  --span1:rgba(58,95,191,.08); --span2:rgba(58,95,191,.15);
  --rail:rgba(243,246,247,.94); --tipbg:#FFFFFF; --shadow:0 8px 28px rgba(20,30,50,.16);
  --erashade:rgba(58,95,191,.035);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161A22; --panel:#1C212C; --ink:#E4E9F0; --ink2:#98A3B3; --ink3:#6B7686;
    --hair:#2A3140; --grid:rgba(228,233,240,.07); --gridMajor:rgba(228,233,240,.20);
    --accent:#6B8FE6;
    --c0:#6B8FE6; --c1:#D2604F; --c2:#279B8F; --c3:#A57FD0; --c4:#B08A2E;
    --span1:rgba(107,143,230,.10); --span2:rgba(107,143,230,.20);
    --rail:rgba(23,28,38,.94); --tipbg:#20262F; --shadow:0 10px 30px rgba(0,0,0,.5);
    --erashade:rgba(107,143,230,.05);
  }
}
:root[data-theme="dark"]{
  --bg:#161A22; --panel:#1C212C; --ink:#E4E9F0; --ink2:#98A3B3; --ink3:#6B7686;
  --hair:#2A3140; --grid:rgba(228,233,240,.07); --gridMajor:rgba(228,233,240,.20);
  --accent:#6B8FE6;
  --c0:#6B8FE6; --c1:#D2604F; --c2:#279B8F; --c3:#A57FD0; --c4:#B08A2E;
  --span1:rgba(107,143,230,.10); --span2:rgba(107,143,230,.20);
  --rail:rgba(23,28,38,.94); --tipbg:#20262F; --shadow:0 10px 30px rgba(0,0,0,.5);
  --erashade:rgba(107,143,230,.05);
}
:root[data-theme="light"]{
  --bg:#F5F7F8; --panel:#EDF0F2; --ink:#232A33; --ink2:#5A6675; --ink3:#8B96A3;
  --hair:#D9E0E5; --grid:rgba(35,42,51,.08); --gridMajor:rgba(35,42,51,.20);
  --accent:#3A5FBF;
  --c0:#3A5FBF; --c1:#C0392B; --c2:#1F8A70; --c3:#8455A8; --c4:#9C7100;
  --span1:rgba(58,95,191,.08); --span2:rgba(58,95,191,.15);
  --rail:rgba(243,246,247,.94); --tipbg:#FFFFFF; --shadow:0 8px 28px rgba(20,30,50,.16);
  --erashade:rgba(58,95,191,.035);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif;
  font-size:14px; line-height:1.5;
}
.serif{font-family:'Nanum Myeongjo','Noto Serif KR','AppleMyungjo','Songti SC',serif}

/* ── header ── */
header{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  padding:12px 20px 10px; border-bottom:1px solid var(--hair); background:var(--bg);
}
h1{font:700 21px/1.2 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif; margin:0; letter-spacing:.5px; text-wrap:balance}
.subtitle{font-size:11.5px; color:var(--ink2); margin-top:2px}
.headL{min-width:200px}
.legend{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  border:1px solid var(--hair); border-radius:999px; padding:3.5px 11px 3.5px 8px;
  font-size:12px; color:var(--ink2); background:transparent; user-select:none;
  transition:opacity .15s, border-color .15s;
}
.chip .dot{width:9px; height:9px; border-radius:50%}
.chip.on{color:var(--ink); border-color:var(--ink3)}
.chip.off{opacity:.38}
.eranav{display:flex; gap:4px; align-items:center; margin-left:auto}
.eranav button{
  font:inherit; font-size:12px; color:var(--ink2); background:var(--panel);
  border:1px solid var(--hair); border-radius:6px; padding:4px 10px; cursor:pointer;
}
.eranav button:hover{color:var(--ink); border-color:var(--ink3)}
.eranav button:focus-visible, .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.zoomctl{display:flex; align-items:center; gap:2px}
.zoomctl button{
  font:inherit; font-size:15px; line-height:1; width:26px; height:26px; border-radius:6px;
  color:var(--ink2); background:var(--panel); border:1px solid var(--hair); cursor:pointer;
}
.zoomctl button:hover:not(:disabled){color:var(--ink); border-color:var(--ink3)}
.zoomctl button:disabled{opacity:.35; cursor:default}
.zoomctl button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#zval{min-width:42px; text-align:center; font-size:11.5px; color:var(--ink2); font-variant-numeric:tabular-nums}
#readout{
  min-width:118px; text-align:right; font-variant-numeric:tabular-nums;
  font-size:12px; color:var(--ink2); line-height:1.3;
}
#readout b{display:block; font-size:15px; color:var(--accent); font-weight:700}

/* ── scroll stage ── */
#viewport{position:relative; overflow:auto; height:calc(100dvh - 67px); cursor:grab}
#viewport.dragging{cursor:grabbing; user-select:none}
#canvas{position:relative}

.gridline{position:absolute; top:0; bottom:0; width:1px; background:var(--grid); pointer-events:none}
.gridline.major{background:var(--gridMajor)}
.erashadeCol{position:absolute; top:0; bottom:0; background:var(--erashade); pointer-events:none}

/* axis */
#axis{
  position:sticky; top:0; z-index:40; height:58px;
  background:var(--bg); border-bottom:1px solid var(--hair);
}
.eraband{
  position:absolute; top:0; height:21px; border-left:1px solid var(--gridMajor);
  font:italic 600 11px/21px 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif;
  color:var(--accent); letter-spacing:2px; white-space:nowrap; overflow:clip;
}
/* 시대명은 JS(updateStickyLabels)가 화면 안쪽으로 밀어 넣는다.
   부모가 sticky/absolute라 CSS position:sticky는 이 문맥에서 동작하지 않는다. */
.eraband i{font-style:inherit; display:inline-block; padding-left:8px; will-change:transform}
.tick{position:absolute; top:21px; height:37px; border-left:1px solid var(--grid)}
.tick.major{border-left-color:var(--gridMajor)}
.tick span{
  position:absolute; top:8px; left:5px; font-size:10.5px; color:var(--ink3);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.tick.major span{color:var(--ink2); font-weight:600}

/* region header */
.regionhead{position:relative; height:30px; background:var(--panel); border-bottom:1px solid var(--hair)}
.regionhead .rl{
  position:sticky; left:0; display:inline-flex; align-items:center; height:100%;
  padding:0 16px; font-size:10.5px; font-weight:700; letter-spacing:3px; color:var(--ink3);
}

/* country rows */
.row{position:relative; height:134px; border-bottom:1px solid var(--hair)}
.rowlabel{
  position:sticky; left:0; z-index:30; float:left; width:152px; height:100%;
  display:flex; flex-direction:column; justify-content:center; padding:0 14px;
  background:var(--rail); backdrop-filter:blur(5px); border-right:1px solid var(--hair);
}
.rowlabel b{font:700 16px/1.25 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif; letter-spacing:1px}
.rowlabel small{font-size:10px; color:var(--ink3); letter-spacing:1.5px; margin-top:2px}
.baseline{position:absolute; left:0; right:0; top:75px; height:1px; background:var(--grid); pointer-events:none}

.span{
  position:absolute; top:6px; height:20px; border-radius:4px; background:var(--span1);
  font-size:10.5px; line-height:20px; color:var(--ink2); padding:0 7px;
  white-space:nowrap; pointer-events:none; overflow:clip;
}
.span.alt{background:var(--span2)}
/* 왕조명도 JS가 화면 안쪽으로 밀어 넣는다 (위 .eraband i와 같은 이유) */
.span i{font-style:normal; display:inline-block; will-change:transform}
.span.pre{background:transparent; border:1px dashed var(--hair); color:var(--ink3); line-height:18px}

.ev{position:absolute; z-index:5; transition:opacity .15s}
@media (prefers-reduced-motion: reduce){.ev{transition:none}}
.ev .dot{
  position:absolute; width:9px; height:9px; border-radius:50%;
  left:-4.5px; top:70.5px; box-shadow:0 0 0 2px var(--bg); transition:transform .12s;
}
.ev .lbl{
  position:absolute; left:-2px; font-size:11px; white-space:nowrap; color:var(--ink);
  padding:1px 4px 1px 3px; line-height:1.25; border-radius:3px; cursor:default;
  transition:opacity .12s linear;
}
.ev .conn{position:absolute; left:-.5px; width:1px; background:var(--grid); pointer-events:none}
.ev:hover, .ev.sel, .ev:focus-visible{z-index:20}
.ev:hover .dot, .ev.sel .dot, .ev:focus-visible .dot{transform:scale(1.7)}
.ev:hover .lbl, .ev.sel .lbl, .ev:focus-visible .lbl{
  background:var(--tipbg); box-shadow:var(--shadow); color:var(--ink); font-weight:700;
}
.ev:focus{outline:none}
.ev:focus-visible .lbl{outline:2px solid var(--accent); outline-offset:1px}
.ev.dim{opacity:.14; pointer-events:none}
.ev.dim .lbl{visibility:hidden}
/* 왼쪽 국가명 레일에 가려지는 라벨은 감춰 글자가 잘려 보이지 않게 함.
   hover/sel 규칙보다 뒤에 두어 그 위에서도 확실히 적용되도록 한다. */
.ev.behind .lbl, .ev.behind:hover .lbl, .ev.behind.sel .lbl{
  opacity:0; pointer-events:none; box-shadow:none; background:transparent;
}
.ev.behind .conn{opacity:0}
@media (prefers-reduced-motion: reduce){
  .ev .dot{transition:none}
  #viewport{scroll-behavior:auto !important}
}

/* ── 사건 간 관계 표시 ── */
#relsvg{position:absolute; left:0; top:0; width:100%; height:100%; z-index:12; pointer-events:none}
/* 관계가 있는 사건: 점 둘레에 옅은 링 */
.ev.hasrel .dot{box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px color-mix(in srgb, var(--accent) 38%, transparent)}
/* 관계 모드: 선택·연관 사건만 남기고 나머지는 가라앉힘 */
.relmode .ev:not(.rel):not(.sel){opacity:.15}
.relmode .span{opacity:.45}
.relmode .ev.rel, .relmode .ev.sel{z-index:19}
.ev.rel .dot{transform:scale(1.5)}
.ev.rel .lbl{background:var(--tipbg); box-shadow:var(--shadow); color:var(--ink); font-weight:700}

/* tooltip */
#tip{
  position:fixed; z-index:99; max-width:350px; pointer-events:none; display:none;
  background:var(--tipbg); border:1px solid var(--hair); border-radius:8px;
  padding:10px 13px; box-shadow:var(--shadow);
}
#tip .ty{font-size:11.5px; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.5px}
#tip .tt{
  font:700 14.5px/1.35 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif; margin:3px 0 5px;
  white-space:normal; overflow-wrap:break-word;
}
#tip .td{
  font-size:12px; color:var(--ink2); line-height:1.55;
  white-space:normal; overflow-wrap:break-word; word-break:keep-all;
}
#tip .tc{display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-size:10.5px; color:var(--ink3)}
#tip .tc i{width:8px; height:8px; border-radius:50%; display:inline-block}
#tip .rlhint{margin-top:7px; font-size:10.5px; color:var(--accent)}
/* ── 사건 이미지: 자리를 미리 잡아 툴팁이 튀지 않게 하고, 실패하면 통째로 접음 ── */
#tip .tim{
  margin:7px 0 0; height:140px; border-radius:6px; overflow:hidden;
  background:linear-gradient(100deg,var(--panel) 30%,var(--hair) 50%,var(--panel) 70%);
  background-size:220% 100%; animation:timshim 1.1s linear infinite;
}
#tip .tim img{width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .25s}
#tip .tim.fit img{object-fit:contain}   /* 저해상도 원본은 확대 대신 여백을 둠 */
#tip .tim.on{animation:none; background:var(--panel)}
#tip .tim.on img{opacity:1}
#tip .tim.off, #tip .tim.off + .tsrc{display:none}
#tip .tsrc{display:block; font-size:9.5px; color:var(--ink3); margin-top:3px; text-align:right; text-decoration:none}
/* 시트는 화면 폭을 다 쓰므로 이미지는 배너가 되지 않게 도판 크기로 묶어둠 */
#tip.sheet .tim{height:200px; max-width:440px}
#tip.sheet .tsrc{max-width:440px}
@keyframes timshim{to{background-position:-120% 0}}
@media (prefers-reduced-motion: reduce){#tip .tim{animation:none} #tip .tim img{transition:none}}
/* 연관 사건 목록 */
#tip .rl2{margin-top:10px; padding-top:8px; border-top:1px solid var(--hair)}
#tip .rl2>b{display:block; font-size:10.5px; color:var(--ink3); letter-spacing:1.5px; margin-bottom:4px}
.relchip{
  display:block; width:100%; text-align:left; font:inherit; background:transparent;
  border:0; border-radius:6px; padding:5px 6px; cursor:pointer;
}
.relchip:hover{background:var(--panel)}
.relchip:focus-visible{outline:2px solid var(--accent); outline-offset:-1px}
.relchip .rc1{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink2)}
.relchip .rc1 i{width:7px; height:7px; border-radius:50%; flex:none}
.relchip .rc1 b{color:var(--ink); font-weight:600}
.relchip .rc1 em{font-style:normal; margin-left:auto; font-size:10px; color:var(--accent); white-space:nowrap; flex:none}
.relchip .rc2{display:block; font-size:10.5px; color:var(--ink3); margin:1px 0 0 12px; line-height:1.4}
/* 터치 기기: 화면 하단에 고정된 시트로 표시해 항상 화면 안에 보이게 함 */
#tip.sheet{
  left:0; right:0; bottom:0; top:auto; max-width:none; width:auto;
  border-radius:14px 14px 0 0; border-width:1px 0 0; padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  animation:sheetin .18s ease-out;
  max-height:52dvh; overflow-y:auto; pointer-events:auto;
}
#tip.sheet .td{font-size:13px}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){#tip.sheet{animation:none}}

#hint{
  position:fixed; right:14px; bottom:12px; z-index:50; font-size:11px; color:var(--ink3);
  background:var(--rail); border:1px solid var(--hair); border-radius:999px;
  padding:5px 13px; backdrop-filter:blur(5px); pointer-events:none;
}
@media (max-width:720px){
  header{gap:10px; padding:10px 14px 8px}
  .eranav{margin-left:0}
  #readout{display:none}
  #viewport{height:calc(100dvh - 110px)}
  #hint{display:none}
}
</style>

<header>
  <div class="headL">
    <h1>한눈에 보는 인류사</h1>
    <div class="subtitle">주요국 가로 연대기 · 기원전 3000년 – 현재</div>
  </div>
  <div class="legend" id="legend" role="group" aria-label="사건 분류 필터"></div>
  <nav class="eranav" id="eranav" aria-label="시대 이동"></nav>
  <div class="zoomctl" role="group" aria-label="가로축 확대/축소">
    <button id="zout" type="button" aria-label="축소" disabled>−</button>
    <span id="zval">100%</span>
    <button id="zin" type="button" aria-label="확대">+</button>
  </div>
  <div id="readout"><b>기원전 3000</b><span>고대</span></div>
</header>

<div id="viewport" tabindex="0" aria-label="연대기 스크롤 영역">
  <div id="canvas"></div>
</div>
<div id="tip" role="tooltip"></div>
<div id="hint">드래그·Shift+휠 이동 · Ctrl+휠/± 확대 · 사건 오버/클릭: 상세·연관 관계 · 범례 필터</div>

<script>
/* ───────── time scale: piecewise linear (px per year) ───────── */
const SEGS=[[-3000,-1000,.26],[-1000,0,1.3],[0,1000,1.8],[1000,1500,3.2],[1500,1800,6],[1800,1900,12],[1900,2030,17]];
const RAIL=152, PAD=36, BASE=75;   /* BASE: 행 안에서 사건 점이 놓이는 기준선 y좌표 */

/* 확대 배율: 사건이 촘촘한 구간을 넓혀 보기 위한 가로축 스케일 */
const ZOOMS=[1,1.6,2.5,4,8];
let zi=0, Z=ZOOMS[0];
/* 연도 → x좌표. 배율 Z가 곱해지며, 레일·여백은 배율과 무관하게 고정 */
function X(y){let x=0;for(const[a,b,k]of SEGS){if(y<=a)break;x+=(Math.min(y,b)-a)*k}return x*Z+RAIL+PAD}
function invX(px){let x=(px-RAIL-PAD)/Z;for(const[a,b,k]of SEGS){const w=(b-a)*k;if(x<=w)return a+x/k;x-=w}return 2030}
const totalW=()=>X(2030)+140;

const CATS=[
 {n:'건국·왕조', v:'--c0'},
 {n:'전쟁·정복', v:'--c1'},
 {n:'정치·사회', v:'--c2'},
 {n:'문화·종교', v:'--c3'},
 {n:'과학·경제', v:'--c4'},
];
const ERAS=[[-3000,'고대'],[476,'중세'],[1453,'근세'],[1789,'근대'],[1914,'현대']];
const ERAEND=2030;

/* ───────── data: spans = [시작, 끝, 이름], events = [연도, 분류, 제목, 설명] ───────── */
const REGIONS=[
{name:'동 아 시 아', rows:[
{name:'한국', sub:'KOREA',
 spans:[[-3000,-800,'신석기·청동기 (선사)',1],[-800,-108,'고조선'],[-57,668,'삼국 시대'],[668,918,'통일신라·발해'],[918,1392,'고려'],[1392,1897,'조선'],[1897,1910,'대한제국'],[1910,1945,'일제강점기'],[1945,2030,'광복·대한민국']],
 events:[
 [-2333,0,'고조선 건국 (단군 전승)','『삼국유사』가 전하는 단군왕검의 건국 기년. 학계는 비파형 동검 등 청동기 문화를 바탕으로 기원전 8~4세기경 요령~한반도 서북부에서 국가로 성장해, 기원전 4세기에는 연(燕)과 겨루는 세력이 되었다고 봄.'],
 [-108,1,'고조선 멸망','위만조선의 우거왕이 한 무제의 육·해군 침공에 1년여를 항전했으나 지배층의 내분 끝에 왕검성이 함락됨. 한은 옛 땅에 낙랑 등 한사군을 설치했고, 훗날 고구려가 이를 축출하며 성장함.'],
 [-57,0,'삼국 시대 개막','『삼국사기』 기년으로 신라 박혁거세(-57), 고구려 주몽(-37), 백제 온조(-18)가 차례로 건국. 실제 중앙집권 체제의 완성은 율령 반포와 불교 공인이 이뤄지는 4세기 전후로 봄.'],
 [372,3,'불교 전래','전진의 승려 순도가 소수림왕에게 불상과 경전을 전하며 고구려가 불교를 공인. 같은 해 태학을 세워 유학 교육을 제도화하는 등 율령 국가의 기틀을 다짐(백제 384, 신라 527 공인).'],
 [391,1,'광개토대왕의 정복','18세에 즉위한 담덕이 백제·거란·후연·왜를 연파하며 만주와 한강 이북을 장악. 아들 장수왕이 세운 광개토대왕릉비(414)에 정복 활동이 1,775자로 새겨져 전해짐.'],
 [520,2,'율령 반포와 골품제','신라 법흥왕이 율령을 반포하고 백관의 공복을 제정, 앞서 설치한 병부(517)와 뒤이은 상대등(531)으로 국가 조직을 정비함. 혈통에 따라 관등과 일상생활까지 제한하는 골품제가 법제화되고 귀족 대표가 만장일치로 국사를 정하는 화백회의가 운영되었는데, 6두품은 능력이 있어도 승진에 한계가 있어 후대에 개혁 세력이 됨.'],
 [527,2,'불교 공인','이차돈이 순교로써 왕실과 귀족의 대립을 풀어 법흥왕이 불교를 공인. 불교는 왕권을 신성화하고 부족 단위 신앙을 하나로 묶는 이념이 되어 진흥왕 대 황룡사 창건으로 이어졌고, 법흥왕은 「건원」 연호(536)를 세워 중국과 대등한 자주 의식을 드러냄.'],
 [612,1,'살수대첩','수 양제가 기록상 113만 대군으로 침공하자 을지문덕이 거짓 후퇴로 30만 별동대를 평양 부근까지 유인한 뒤 살수(청천강)에서 궤멸시킴. 생환자는 2,700명에 불과했다고 전하며, 무리한 원정은 수 멸망(618)의 한 원인이 됨.'],
 [668,1,'삼국 통일','나당연합군이 백제(660)에 이어 고구려를 무너뜨림. 당이 한반도 전체를 지배하려 하자 신라는 매소성·기벌포 전투에서 당군을 격파하고 676년 대동강 이남의 통일을 완성함.'],
 [682,2,'신문왕의 왕권 강화','김흠돌의 난을 진압해 진골 귀족을 숙청하고 국학을 세웠으며 9주 5소경과 9서당 10정을 정비. 관료전을 지급하고 녹읍을 폐지(689)해 귀족의 경제 기반을 억제함.'],
 [682,3,'원효와 의상','원효가 일심(一心)과 화쟁 사상으로 종파 갈등을 아우르고 아미타 신앙으로 불교를 대중화했으며, 의상은 화엄종을 세우고 부석사를 창건. 이후 최치원 등 6두품 지식인이 유학을 이끔.'],
 [698,0,'발해 건국','고구려 유장 대조영이 당의 추격군을 천문령에서 꺾고 동모산에서 건국. 전성기에는 "해동성국"이라 불리며 만주와 연해주를 아울렀고, 남쪽의 통일신라와 남북국을 이룸.'],
 [788,2,'독서삼품과','원성왕이 국학 졸업생을 유교 경전 이해도에 따라 3등급으로 나눠 관리로 뽑는 제도를 시행. 골품제의 벽에 막혀 정착하지 못했으나 능력에 따른 관리 선발을 시도한 최초의 사례로 평가됨.'],
 [900,0,'후삼국 성립','견훤이 완산주에서 후백제를, 궁예가 송악에서 후고구려(901)를 세워 신라와 함께 후삼국이 정립됨. 진골 귀족의 왕위 다툼과 호족·6두품의 성장으로 신라의 지방 통제가 무너진 결과임.'],
 [918,0,'고려 건국','궁예를 몰아낸 왕건이 고려를 세우고 신라의 귀부와 후백제 정벌로 936년 후삼국을 통일. 고구려 계승을 표방했으며, 서방에 알려져 "코리아"라는 이름의 어원이 됨.'],
 [926,1,'발해 멸망','거란의 야율아보기가 홀한성을 포위해 15대 228년의 발해가 무너짐. 세자 대광현을 비롯한 유민 수만 명이 잇따라 고려로 망명해 우대받았고, 고려는 이를 근거로 고구려·발해 계승 의식을 이어받아 거란과 맞섬.'],
 [935,1,'신라 멸망과 후삼국 통일','경순왕이 더는 나라를 지킬 수 없다며 스스로 고려에 나라를 넘겨 992년의 신라가 문을 닫음. 이듬해 왕건이 일리천에서 후백제를 평정해 후삼국을 통일했고, 신라 왕족과 6두품 지식인이 고려의 지배층으로 흡수되며 세 나라의 유산이 한 왕조로 합쳐짐.'],
 [956,2,'노비안검법','고려 광종이 호족이 불법으로 차지한 노비를 조사해 양인으로 되돌리고 이어 백관의 공복을 제정(960). 호족의 사병·경제 기반을 약화시키고 국가의 조세 수취 대상을 늘림.'],
 [958,2,'과거제 도입','고려 광종이 후주 출신 쌍기의 건의를 받아 시험으로 관리를 선발하는 과거제를 실시. 호족의 세습 기반을 약화시키고 유교 소양을 갖춘 관료층이 형성되는 계기가 됨.'],
 [976,4,'전시과 시행','경종이 관직과 인품에 따라 전지와 시지의 수조권을 나눠 주는 전시과를 처음 실시. 목종의 개정 전시과, 문종의 경정 전시과로 정비되며 고려 토지제도의 근간이 됨.'],
 [982,2,'최승로의 시무 28조','고려 성종이 최승로의 건의를 받아들여 유교 정치 이념을 채택하고 12목에 지방관을 파견. 2성 6부의 중앙 관제와 국자감을 정비해 고려의 통치 체제가 확립됨.'],
 [1019,1,'귀주대첩','거란(요) 성종이 보낸 10만의 3차 침입군을 강감찬이 귀주에서 섬멸함. 이후 고려-거란-송 사이에 세력 균형이 성립해 약 100년의 평화가 이어짐.'],
 [1123,3,'고려청자의 절정','송의 사신 서긍이 『고려도경』에서 비색(翡色) 청자를 천하제일이라 기록. 강진·부안 가마에서 상감 기법이 개발되어 세계 도자사에 유례없는 독창적 양식을 이룸.'],
 [1135,2,'묘청의 서경 천도 운동','묘청 등 서경 세력이 서경 천도와 금국 정벌, 칭제건원을 주장하며 국호를 대위(大爲)로 내걸었으나 이듬해 김부식의 관군에 진압됨. 개경 문벌귀족 사회의 모순을 드러낸 사건으로, 진압을 지휘한 김부식은 뒤에 『삼국사기』(1145)를 편찬해 신라 계승 의식을 정리함.'],
 [1170,2,'무신정변','정중부 등 무신들이 문신 위주의 차별 대우에 반발해 정변을 일으키고 의종을 폐위. 이후 최씨 정권으로 이어지는 100년의 무신 집권기 동안 왕권은 유명무실해짐.'],
 [1231,1,'몽골 침입','이후 30년간 여섯 차례의 침입으로 국토가 유린되자 최씨 정권은 강화도로 천도해 항전. 1270년 개경 환도 뒤에도 삼별초가 진도·제주에서 3년을 더 싸움.'],
 [1251,3,'팔만대장경 완성','몽골 침입으로 초조대장경이 불타자 국난 극복을 발원하며 16년에 걸쳐 8만여 목판을 다시 새김. 5,200만 자에 오탈자가 거의 없는 정밀함으로 유네스코 세계기록유산에 등재됨.'],
 [1356,2,'공민왕의 반원 개혁','기철 등 친원 세력을 제거하고 정동행성 이문소를 폐지했으며 쌍성총관부를 공격해 철령 이북을 되찾음. 전민변정도감을 두어 권문세족의 토지와 노비를 정리했으나 개혁은 좌절됨.'],
 [1377,4,'직지심체요절','청주 흥덕사에서 금속활자로 찍은 불교 선어록으로, 구텐베르크 성경보다 78년 앞선 현존 최고(最古)의 금속활자 인쇄본. 하권 1책이 프랑스 국립도서관에 소장되어 있음.'],
 [1391,4,'과전법 시행','신진사대부가 권문세족의 대농장을 혁파하고 경기 지역 토지의 수조권을 관리에게 지급. 조선 건국의 경제적 기반이 되었고 이후 직전법(1466)·관수관급제(1470)로 축소됨.'],
 [1392,0,'조선 건국','위화도 회군(1388)으로 실권을 잡은 이성계가 정도전 등 신진사대부와 함께 건국. 성리학을 통치 이념으로 삼고 한양으로 천도해 이후 518년간 지속됨.'],
 [1400,2,'태종의 6조 직계제','두 차례 왕자의 난을 거쳐 즉위한 태종이 사병을 혁파하고 의정부를 거치지 않는 6조 직계제(1414)를 시행. 호패법(1413)으로 인구를 파악하는 등 중앙집권과 국가 재정의 토대를 마련함.'],
 [1441,4,'측우기와 농서','세종 대에 세계 최초의 규격화된 우량계인 측우기를 만들어 전국에 배포하고, 앞서 우리 풍토에 맞는 『농사직설』(1429)을 펴냄. 자격루·혼천의와 함께 조선 과학기술의 절정을 이룸.'],
 [1443,3,'훈민정음 창제','세종대왕이 백성이 쉽게 익힐 수 있는 표음문자 28자를 만들고 1446년 해설서 『훈민정음 해례본』과 함께 반포. 창제 목적과 원리가 기록으로 남은 유일한 문자로 평가받음.'],
 [1485,2,'경국대전 반포','세조 때 편찬에 착수해 성종 때 완성한 조선의 기본 법전. 이·호·예·병·형·공 6전 체제로 이후 400년간 통치와 행정, 신분 질서의 근간이 됨.'],
 [1498,2,'무오사화','김종직의 「조의제문」을 빌미로 훈구파가 사림을 숙청. 갑자(1504)·기묘(1519)·을사사화(1545)로 이어졌으나 사림은 서원과 향약을 기반으로 결국 정권을 장악함.'],
 [1575,2,'붕당의 형성','이조전랑 자리를 둘러싼 대립으로 사림이 동인과 서인으로 갈라짐. 이황의 주리론과 이이의 주기론 등 학문적 계보와 결합해 이후 300년 조선 정치를 규정하는 붕당정치가 시작됨.'],
 [1592,1,'임진왜란','일본을 통일한 도요토미 히데요시가 명 정복을 명분으로 침공해 7년 전쟁이 시작됨. 이순신의 한산도(1592)·명량(1597) 대첩과 의병, 명군 참전으로 격퇴했으나 국토가 크게 황폐해짐.'],
 [1608,4,'대동법 실시','광해군이 방납의 폐단을 없애기 위해 집집마다 걷던 현물 공납을 토지 결수에 따른 쌀·베로 바꿔 경기도에 처음 시행. 김육 등의 노력으로 100년에 걸쳐 전국으로 확대되며 1결당 쌀 12두로 정착했고, 대동미로 물품을 조달하는 공인의 활동으로 상품화폐경제가 발달함.'],
 [1613,4,'『동의보감』 간행','허준이 15년에 걸쳐 중국과 조선의 의서를 집대성하고 우리 땅에서 나는 향약을 정리한 25권 25책을 1610년 완성해 1613년 내의원에서 간행. 병증에서 처방을 찾아가도록 편집해 실용성이 높았고, 중국·일본에서도 거듭 간행되어 유네스코 세계기록유산에 등재됨.'],
 [1636,1,'병자호란','국호를 청으로 바꾼 태종 홍타이지가 친정하자 인조가 남한산성에서 47일 항전 끝에 삼전도에서 항복. 조선은 명과 단절하고 청과 군신 관계를 맺었으며, 이후 북벌론과 실학이 싹틈.'],
 [1725,2,'영조의 탕평책','붕당의 폐단을 억제하기 위해 탕평파를 등용하고 서원을 정리했으며 균역법(1750)으로 군포를 절반으로 줄임. 정조가 규장각과 장용영으로 이를 계승해 왕권 중심의 개혁을 이어감.'],
 [1750,3,'실학과 진경문화','유형원·이익에서 정약용·박지원으로 이어진 실학이 토지 개혁과 상공업 진흥을 주창하고, 정선의 진경산수와 김홍도의 풍속화가 조선 고유의 미의식을 확립. 대동법과 화폐 유통으로 상품경제도 성장함.'],
 [1863,2,'흥선대원군의 개혁','고종의 즉위로 집권해 비변사를 혁파하고 의정부를 부활시켰으며 서원을 47개만 남기고 철폐. 호포제와 사창제로 민생을 안정시켰으나 경복궁 중건과 당백전 발행으로 원성을 삼.'],
 [1866,3,'병인박해와 양요','흥선대원군이 프랑스 신부와 천주교도를 대거 처형하자 프랑스 함대가 강화도를 침공하고, 이어 미국도 신미양요(1871)를 일으킴. 척화비를 세운 쇄국 정책이 정점에 이름.'],
 [1866,3,'위정척사와 개화','서양 세력의 통상 요구에 맞서 이항로 등 유생이 성리학 질서를 지키자는 위정척사 운동을 폄. 이후 개화파와 대립하며 을미의병 등 항일 의병운동의 사상적 뿌리가 됨.'],
 [1876,2,'강화도 조약','운요호 사건을 빌미로 체결된 최초의 근대적 조약(조일수호조규). 부산 등 3개 항 개항과 치외법권을 담은 불평등 조약으로, 이후 미국 등 열강과의 조약 체결이 뒤따름.'],
 [1884,2,'임오군란과 갑신정변','구식 군인의 차별에 항의한 임오군란(1882) 이후 청의 간섭이 심해지자 김옥균 등 급진 개화파가 우정총국 축하연에서 정변을 일으킴. 청군 개입으로 3일 만에 실패하고 조선은 청·일의 각축장이 됨.'],
 [1894,2,'동학농민운동·갑오개혁','전봉준이 이끈 반봉건·반외세 농민군이 전주성을 점령하자 청·일 군대가 개입해 청일전쟁으로 비화. 같은 해 신분제·과거제 폐지 등 갑오개혁이 단행됨.'],
 [1896,2,'아관파천과 독립협회','을미사변(1895) 뒤 신변을 위협받던 고종이 러시아 공사관으로 거처를 옮겨 열강의 이권 침탈이 가속됨. 같은 해 서재필 등이 독립협회를 세워 독립문 건립과 만민공동회로 자주·민권 운동을 펼침.'],
 [1897,0,'대한제국 선포','아관파천에서 환궁한 고종이 환구단에서 황제로 즉위하고 국호를 대한으로 선포. 광무개혁으로 근대화를 시도했으나 러·일 각축 속에 한계에 부딪힘.'],
 [1905,1,'을사늑약','러일전쟁에서 승리한 일본이 강압으로 외교권을 박탈하고 통감부를 설치. 고종의 헤이그 특사 파견(1907)과 강제 퇴위, 안중근의 이토 히로부미 저격(1909)이 뒤따름.'],
 [1907,2,'국채보상운동','일본의 차관을 갚아 경제적 자립을 이루자며 대구에서 시작되어 전국으로 확산된 모금 운동. 신민회와 대한매일신보가 주도했으나 통감부의 탄압으로 중단되었고 정미의병으로 저항이 이어짐.'],
 [1910,1,'국권 피탈','한일병합조약으로 대한제국이 소멸하고 조선총독부의 무단통치가 시작됨. 토지조사사업 등으로 수탈이 제도화되고 독립운동은 만주·연해주 등 국외로 확산됨.'],
 [1919,2,'3·1 운동','고종 인산일을 계기로 민족대표의 독립선언과 함께 두 달간 전국에서 약 200만 명이 만세 시위에 참여. 이를 계기로 상하이에 대한민국 임시정부가 수립되고 일제는 문화통치로 전환.'],
 [1919,1,'의열단 창설','김원봉이 만주에서 결성해 조선총독부·종로경찰서 등에 폭탄 투척과 요인 처단으로 맞섬. 신채호가 지은 「조선혁명선언」을 활동 지침으로 삼아 무장 직접 행동을 폈음.'],
 [1920,1,'봉오동·청산리 대첩','홍범도의 대한독립군이 봉오동에서, 김좌진의 북로군정서가 청산리에서 일본군을 대파. 독립군 무장투쟁 최대의 승전이었으나 이후 간도참변과 자유시참변으로 시련을 겪음.'],
 [1920,4,'산미증식계획','일본의 쌀 부족(1918년 쌀 소동)을 조선에서 메우려 수리조합과 품종 개량으로 증산을 추진하고 증산량을 웃도는 양을 반출. 수리조합비가 농민에게 전가되어 조선인 1인당 쌀 소비는 오히려 줄고 만주 잡곡으로 대체되었으며, 이에 맞서 물산장려운동(1923)이 일어남.'],
 [1926,2,'6·10 만세운동','순종의 인산일을 기해 학생과 사회주의 계열이 만세 시위를 벌임. 민족주의·사회주의 세력이 함께한 경험이 이듬해 신간회 결성으로 이어짐.'],
 [1927,2,'신간회 창립','비타협적 민족주의와 사회주의가 손잡은 일제강점기 최대의 합법 민족운동 단체로, 전국 140여 지회에 회원 4만 명에 이름. 광주학생항일운동을 지원했으나 내부 노선 갈등으로 1931년 해소됨.'],
 [1929,2,'광주학생항일운동','한일 학생 충돌을 계기로 광주에서 시작된 시위가 전국 320여 개 학교로 확산됨. 3·1 운동 이후 최대 규모의 항일 학생운동으로 기록됨.'],
 [1932,1,'이봉창·윤봉길 의거','김구의 한인애국단 소속으로 이봉창이 도쿄에서 일왕을, 윤봉길이 상하이 훙커우 공원에서 일본군 수뇌를 겨냥. 침체된 임시정부가 중국 국민당의 지원을 얻는 전기가 됨.'],
 [1938,2,'민족말살통치','중일전쟁 이후 일제가 국가총동원법을 적용하고 황국신민서사 암송·신사참배·창씨개명(1940)을 강요. 조선어 교육을 폐지하고 징용·징병과 일본군 위안부 동원 등 인적 수탈을 자행함.'],
 [1940,1,'한국광복군 창설','충칭의 대한민국 임시정부가 정규 군대를 창설하고 대일 선전포고(1941)를 함. 미국 OSS와 국내 진공작전을 준비하던 중 일본이 항복해 실행되지 못함.'],
 [1945,2,'광복과 분단','일본의 항복으로 35년의 식민 지배에서 해방되었으나 미·소 군정이 38선을 경계로 분할 진주. 신탁통치 논쟁과 냉전 격화 속에 1948년 남북에 각각 정부가 수립됨.'],
 [1948,2,'대한민국 정부 수립','5·10 총선거로 제헌국회가 구성되고 제헌헌법 공포를 거쳐 8월 15일 정부가 수립됨. 북에서도 9월 정권이 수립되며 분단이 제도적으로 굳어짐.'],
 [1949,4,'농지개혁','유상매수·유상분배 원칙으로 지주의 토지를 소작농에게 분배해 조선 이래의 지주제가 해체됨. 자작농 중심 사회가 형성되어 이후 산업화의 사회적 기반이 됨.'],
 [1950,1,'6·25 전쟁','북한의 기습 남침으로 개전해 낙동강 방어선, 인천상륙작전, 중국군 개입을 거치며 3년간 공방. 1953년 정전협정으로 멈췄으나 수백만의 사상자와 분단의 고착을 남김.'],
 [1960,2,'4·19 혁명','3·15 부정선거에 항거한 시위가 김주열 열사의 죽음을 계기로 전국으로 번져 이승만 대통령이 하야. 학생과 시민의 힘으로 독재를 무너뜨린 한국 최초의 민주혁명으로 평가됨.'],
 [1962,4,'한강의 기적','제1차 경제개발 5개년 계획과 수출 주도 전략으로 연평균 10% 안팎의 고도성장이 시작됨. 경부고속도로(1970)와 포항제철(1973)을 축으로 경공업에서 중화학공업으로 무게를 옮겨 1977년 수출 100억 달러를 넘겼고, 1996년 OECD 가입으로 최빈국에서 한 세대 만에 선진국에 진입한 드문 사례가 됨.'],
 [1972,2,'유신체제','박정희가 비상계엄 아래 유신헌법을 공포해 대통령 간선제와 종신 집권의 길을 엶. 긴급조치로 반대를 억눌렀으나 부마항쟁과 10·26 사건(1979)으로 붕괴함.'],
 [1980,2,'5·18 민주화운동','12·12 쿠데타로 집권한 신군부의 계엄 확대에 맞서 광주 시민이 열흘간 항쟁했고 군의 유혈 진압으로 다수가 희생됨. 이후 한국 민주화 운동의 정신적 기반이 됨.'],
 [1987,2,'6월 민주항쟁','박종철 고문치사와 이한열 피격을 계기로 전국적 시위가 확산되어 6·29 선언을 이끌어냄. 대통령 직선제 개헌으로 현행 "87년 체제"가 성립함.'],
 [1988,3,'서울 올림픽','159개국이 참가한 제24회 하계 올림픽으로, 세 대회 연속 보이콧으로 얼룩졌던 동서 진영이 12년 만에 한자리에 모임. 소련·중국 등 미수교 사회주의권과의 교류가 열려 북방외교의 발판이 되었고, 전쟁의 폐허에서 일어선 한국의 발전상을 세계에 각인시킴.'],
 [1997,4,'IMF 외환위기','외환 보유고 고갈로 IMF에 구제금융을 신청하고 대규모 구조조정과 실업의 고통을 겪음. 금 모으기 운동 등 전 국민적 노력으로 2001년 지원금을 조기 상환함.'],
 [2000,2,'첫 남북정상회담','김대중 대통령과 김정일 국방위원장이 평양에서 분단 후 첫 정상회담을 갖고 6·15 공동선언을 발표. 이산가족 상봉과 개성공단 등 남북 교류가 뒤따름.'],
 [2019,3,'한류의 세계화','BTS의 빌보드 1위와 「기생충」의 칸 황금종려상·아카데미 작품상(2020), 「오징어 게임」(2021)으로 이어지며 K-컬처가 세계 대중문화의 주류로 올라섬.'],
 [2025,2,'비상계엄과 대통령 파면','2024년 12월 3일 윤석열 대통령이 비상계엄을 선포하고 계엄군이 국회 점거를 시도했으나 6시간 만에 국회 결의로 무력화됨. 2025년 4월 헌법재판소가 만장일치로 파면하고 6월 조기 대선으로 정권이 교체되었으며, 법원은 이를 「내란」으로 규정함 — 제도 안에서 헌정 위기를 수습한 사례로 주목받음.'],
]},

 events:[
 [-1600,0,'상(商) 왕조','1928년부터 발굴된 은허(殷墟)에서 갑골문과 대형 왕릉이 나와 문헌상의 왕계가 실증된 최초의 왕조. 왕이 점복으로 국사를 정하는 신정 정치를 펴고 대규모 순장을 남겼으며, 점복 기록에 쓰인 갑골문은 한자의 원형이 되고 정교한 청동 제기는 동아시아 금속 공예의 출발점이 됨.'],
 [-1046,0,'주(周) 건국','무왕이 목야 전투에서 상의 주왕을 꺾고 건국. 일족을 각지에 봉하는 봉건제와 "하늘이 덕 있는 자에게 통치를 맡긴다"는 천명사상은 동아시아 정치사상의 원형이 됨.'],
 [-551,3,'공자와 제자백가','춘추전국 550년의 혼란기에 유가·도가·법가·묵가 등 제자백가가 다투어 일어남. 공자의 유학은 한대에 국교화되어 2천 년 동아시아 질서의 근간이 됨.'],
 [-221,0,'진시황의 통일','전국 7웅을 차례로 멸하고 사상 최초로 중국을 통일, "황제" 칭호를 창시. 군현제와 문자·도량형·화폐 통일로 이후 왕조의 틀을 만들었으나 가혹한 통치로 15년 만에 무너짐.'],
 [-202,0,'한(漢) 건국','농민 출신 유방이 항우와의 초한전쟁에서 승리해 건국. 400년간 이어지며 유교 국교화와 실크로드 개척 등 중국 문명의 원형을 완성해 "한족(漢族)"의 이름이 됨.'],
 [-138,4,'장건의 서역 개척','한 무제가 흉노 협공을 위해 장건을 대월지에 파견, 10여 년의 억류를 포함해 13년 만에 서역의 정보를 가지고 귀환. 이를 계기로 비단길이 열려 동서 문명 교류가 본격화됨.'],
 [-91,3,'사마천 『사기』','궁형의 치욕을 견디며 사마천이 황제부터 무제까지 3천 년을 130권에 담은 최초의 기전체 통사를 완성. 이후 중국 정사 24사의 서술 모범이 되어 동아시아 역사 서술의 틀을 만듦.'],
 [67,3,'불교의 중국 전래','후한 명제 때 서역 승려가 낙양 백마사에 이르렀다는 전승으로 불교가 전해짐. 이후 구마라습의 역경과 둔황·윈강 석굴 조성을 거쳐 중국화된 선종이 성립하며 유·불·도 삼교 체제가 자리 잡음.'],
 [105,4,'채륜의 종이','환관 채륜이 나무껍질과 마 등으로 값싸고 질 좋은 제지법을 완성해 바침. 제지술은 탈라스 전투(751)의 포로를 통해 이슬람권으로, 다시 유럽으로 전해져 지식 혁명을 일으킴.'],
 [220,2,'삼국 시대','후한이 무너지고 위·촉·오가 정립하며 『삼국지』의 무대가 열림. 서진의 짧은 통일을 거쳐 5호16국·남북조로 이어지는 360여 년 분열기에 불교가 중국 사회에 뿌리내림.'],
 [485,4,'균전제 시행','북위 효문제가 국가가 농민에게 토지를 나눠 주고 조·용·조를 걷는 균전제를 실시하고 한화 정책을 폄. 수·당이 계승해 율령 체제의 경제적 기반이 되었고 신라·일본에도 영향을 미침.'],
 [589,0,'수(隋)의 재통일','문제 양견이 남조 진을 멸하고 370년 분열을 끝냄. 남북을 잇는 대운하를 건설하고 시험으로 관리를 뽑는 과거제를 창시해 당의 번영을 예비했으나, 대운하 노역과 세 차례 고구려 원정의 실패로 반란이 잇따라 건국 37년 만인 618년에 멸망함.'],
 [618,0,'당(唐) 건국','이연·이세민 부자가 세운 세계 제국. 수도 장안은 인구 100만의 국제도시로 번영했고, 율령·불교·시문화가 신라와 일본 등 동아시아 전역의 모델이 됨.'],
 [624,2,'당의 율령 체제','고조·태종 대에 균전제와 조용조, 부병제를 갖춘 율령격식이 정비되고 3성 6부의 중앙 관제가 완성됨. 이 제도가 신라·발해·일본에 그대로 수용되어 동아시아 공통의 통치 모델이 됨.'],
 [629,3,'현장의 인도 구법','현장이 국법을 어기고 17년간 인도를 순례하며 657부의 경전을 가져와 번역하고 『대당서역기』를 남김. 그의 여정은 훗날 『서유기』의 원형이 되었고 중국 불교 교학이 크게 성숙함.'],
 [751,3,'이백과 두보의 시대','성당(盛唐)의 이백·두보·왕유가 한시의 절정을 이루고, 장안에는 서역 상인과 유학생이 모여 국제 문화가 꽃핌. 이 시기 당의 문물은 신라와 일본의 국가 체제에 그대로 모범이 됨.'],
 [755,1,'안사의 난','절도사 안녹산과 사사명이 일으킨 8년의 대반란으로 현종이 촉으로 피난하고 양귀비가 죽음. 이후 당은 절도사들이 할거하는 시대로 접어들며 쇠락함.'],
 [907,1,'당 멸망과 오대십국','절도사 주전충이 애제를 폐하고 후량을 세워 289년의 당이 끝나고, 53년간 중원에 다섯 왕조가 이어지고 주변에 열 나라가 갈리는 분열기가 열림. 무인이 황제를 세우고 갈아치우는 폐해가 뒤이은 송의 문치주의를 낳음.'],
 [960,0,'송(宋) 건국','조광윤이 세운 문치주의 왕조. 화약 무기·나침반 항해·활판인쇄의 3대 발명과 세계 최초의 지폐(교자) 등 당대 세계에서 가장 앞선 경제·기술 사회를 이룸.'],
 [1041,4,'필승의 활자 인쇄','북송의 장인 필승이 찰흙에 글자를 새겨 구운 교니 활자를 고안, 심괄의 『몽계필담』에 그 원리가 기록됨. 나침반·화약과 함께 송대 3대 발명으로 꼽히며 유럽보다 400년 앞섬.'],
 [1069,2,'왕안석의 신법','재정난과 국방 위기에 맞서 왕안석이 청묘법·모역법·시역법 등 개혁을 단행. 사마광 등 구법당의 반발로 좌절되었고 신법·구법당의 당쟁이 북송 쇠퇴의 한 원인이 됨.'],
 [1088,4,'나침반과 원양 항해','심괄이 자침이 정북에서 어긋나는 편각 현상을 세계 최초로 기록하고, 송의 상선이 나침반으로 남중국해와 인도양을 항해. 화약 무기와 함께 유럽에 전해져 대항해시대의 기술적 전제가 됨.'],
 [1127,1,'정강의 변','여진족의 금이 수도 카이펑을 함락하고 휘종·흠종 두 황제를 포로로 끌고 감. 고종이 임안(항저우)으로 피해 남송을 이었고, 경제 중심이 강남으로 이동함.'],
 [1130,3,'주자학의 성립','이 해에 태어난 주희가 이(理)와 기(氣)로 우주와 인간을 설명하고 『사서집주』(1190)로 사서(四書)를 경전의 중심에 놓으며 유학을 재구축. 원대에 과거의 표준 교재가 되어 조선의 성리학과 일본 주자학까지 동아시아 사상의 골격이 됨.'],
 [1271,0,'원(元) 제국','칭기즈 칸의 손자 쿠빌라이가 국호를 대원으로 정하고 1279년 남송까지 정복. 역참망으로 유라시아가 하나로 연결되어 마르코 폴로 등 동서 교류가 절정에 달함.'],
 [1279,1,'남송 멸망','애산(崖山) 해전에서 마지막 함대가 궤멸하고 재상 육수부가 여덟 살 황제를 안고 바다에 뛰어들며 319년의 송이 끝남. 중국 전역이 처음으로 이민족 왕조의 지배 아래 들어가, 후대 문인들은 "애산 이후 중화는 없다"고 탄식함.'],
 [1368,0,'명(明) 건국','홍건적 출신의 빈농 주원장이 몽골 세력을 초원으로 몰아내고 한족 왕조를 재건. 재상제를 없애 황제 독재를 강화하고 이갑제와 어린도책으로 농촌을 직접 장악했으며, 후기에는 해금 정책과 만리장성 증축 등 내향화로 돌아섬.'],
 [1405,4,'정화의 대원정','영락제의 명으로 정화가 대형 보선과 2만 7천 승무원의 대함대를 이끌고 7차례 인도양을 원정, 아프리카 동해안까지 도달. 콜럼버스보다 87년 앞섰으나 명은 이후 원양 항해를 스스로 중단함.'],
 [1421,2,'베이징 천도','영락제가 난징에서 베이징으로 천도하고 자금성을 완공. 이후 명·청 500년과 현대 중국까지 이어지는 수도 베이징 시대가 열림.'],
 [1581,4,'일조편법과 은 경제','명이 각종 세와 요역을 토지세로 일원화해 은으로 납부하게 하는 일조편법을 전국에 확대. 아메리카와 일본의 은이 대량 유입되어 중국이 세계 은 유통의 종착지가 됨.'],
 [1601,3,'마테오 리치와 서학','예수회 선교사 마테오 리치가 베이징에서 「곤여만국전도」와 『천주실의』를 펴냄. 서양 역법과 천문학이 전래되고 조선의 실학과 천주교 수용에도 자극을 줌.'],
 [1644,0,'청(淸) 입관','이자성의 난으로 명이 무너지자 만주족이 산해관을 넘어 입관. 강희·옹정·건륭 3대 130여 년의 전성기에 현대 중국 영토의 원형이 되는 최대 판도를 이룸.'],
 [1750,4,'청 성세의 경제','건륭제 치세에 신대륙 작물의 보급과 장거리 상업으로 인구가 3억을 넘고 세계 GDP의 약 3분의 1을 차지. 그러나 자급적 농업 구조에 머물러 산업혁명으로 나아가지 못한 "고도 균형의 함정"에 빠짐.'],
 [1840,1,'아편전쟁','아편 단속을 빌미로 영국이 개전하자 청은 증기 군함 앞에 연패. 홍콩 할양과 5개 항 개항의 난징조약(1842)을 시작으로 불평등 조약 체제, 이른바 "백년국치"가 시작됨.'],
 [1851,2,'태평천국 운동','홍수전이 기독교적 교리를 내걸고 건국을 선포하고 난징을 점령하며 14년간 청과 내전. 사망자 2천만 명 이상으로 추정되는 19세기 세계 최대의 유혈 분쟁.'],
 [1861,2,'양무운동','태평천국과 아편전쟁의 충격 속에 증국번·이홍장 등이 "중체서용"을 내걸고 서양 무기와 기술을 도입. 그러나 제도 개혁 없는 기술 도입에 그쳐 청일전쟁 패배로 한계가 드러남.'],
 [1894,1,'청일전쟁 패배','조선의 지배권을 둘러싸고 일본과 개전했으나 북양함대가 궤멸하며 패배. 시모노세키 조약으로 대만을 할양하고 거액을 배상했으며, 열강의 이권 침탈이 가속됨.'],
 [1898,2,'변법자강운동','캉유웨이·량치차오가 일본 메이지 유신을 본떠 입헌군주제와 제도 개혁을 추진. 서태후 중심 보수파의 정변으로 103일 만에 좌절되었고, 이어 의화단 운동(1900)이 일어남.'],
 [1900,1,'의화단 운동','"부청멸양"을 내건 의화단이 베이징의 외국 공사관을 포위하자 8개국 연합군이 진압. 신축조약으로 막대한 배상금과 외국군 주둔을 허용하며 청은 사실상 반식민지로 전락함.'],
 [1911,2,'신해혁명','우창의 신군 봉기가 전국으로 번져 각 성이 독립을 선언, 이듬해 선통제 푸이가 퇴위하며 2천여 년의 황제 체제가 종식됨. 쑨원이 임시대총통에 취임해 아시아 최초의 공화국이 수립됨.'],
 [1919,2,'5·4 운동','파리강화회의가 산둥의 이권을 일본에 넘기자 베이징 학생들이 시위를 벌여 전국의 노동자·상인으로 확산. 신문화운동과 결합해 반제·반봉건 대중운동의 출발점이자 공산당 창당(1921)의 배경이 됨.'],
 [1924,2,'제1차 국공합작','쑨원이 "연소용공"을 내걸고 국민당을 개조해 공산당원의 입당을 허용하고 황푸군관학교를 세움. 북벌로 군벌을 제압했으나 장제스의 상하이 쿠데타(1927)로 합작이 깨짐.'],
 [1934,1,'대장정','국민당군의 포위를 뚫고 공산당 홍군이 370일간 9,600km를 걸어 옌안에 도달. 8만 병력이 8천으로 줄었으나 마오쩌둥이 지도권을 확립하는 계기가 됨.'],
 [1937,2,'제2차 국공합작','시안 사건(1936)을 계기로 국민당과 공산당이 항일을 위해 다시 손을 잡음. 8년의 항일전쟁을 함께 치렀으나 종전 후 내전이 재개되어 1949년 공산당의 승리로 끝남.'],
 [1949,0,'중화인민공화국','국공내전에서 승리한 마오쩌둥이 톈안먼에서 건국을 선포하고 장제스의 국민당은 대만으로 이전. 이후 대약진운동(1958)의 실패로 수천만 명이 아사하는 비극을 겪음.'],
 [1966,2,'문화대혁명','대약진 실패로 밀려났던 마오쩌둥이 "네 가지 낡은 것"을 부수라며 홍위병을 동원해 정적과 전통문화를 공격한 10년의 대동란. 학교가 문을 닫고 지식인·간부가 농촌으로 하방되었으며 수많은 문물이 파괴되고 수백만 명이 희생된 것으로 추정됨. 1976년 마오의 사망과 사인방 체포로 끝났고 중국공산당은 1981년 이를 공식 오류로 규정함.'],
 [1978,4,'개혁개방','11기 3중전회에서 실권을 잡은 덩샤오핑이 농가생산책임제와 경제특구 등 시장경제를 도입. "흑묘백묘론"의 실용주의로 30년 연 10% 성장의 문을 엶.'],
 [1989,2,'톈안먼 사건','후야오방 추모를 계기로 학생과 시민 수십만이 톈안먼 광장에서 민주화를 요구. 6월 4일 계엄군이 무력 진압했으며 정확한 사망자 수는 지금도 논쟁 중.'],
 [1997,2,'홍콩 반환','아편전쟁으로 할양된 지 155년 만에 영국이 홍콩을 반환. "50년 불변"의 일국양제가 약속되었으나 2020년 국가보안법 이후 자치 축소 논란이 이어짐.'],
 [2010,4,'G2로 부상','개혁개방 30여 년 만에 일본을 제치고 세계 2위 경제대국이 되며 "세계의 공장"에서 최대 무역국으로 올라섬. 일대일로(2013)와 제조업 고도화로 미국과 전략 경쟁 구도를 형성했으나, 급속한 고령화와 부동산 부채가 새로운 과제로 남음.'],
]},

 events:[
 [-300,4,'야요이 문화','한반도로부터 논벼농사와 청동기·철기가 전해지며 1만 년 이어진 조몬 수렵채집 사회가 농경 사회로 바뀜. 잉여 생산과 관개를 둘러싼 다툼에서 환호 취락과 소국들이 생겨나 중국 사서에 왜의 100여 국과 야마타이국이 기록됨(시작 연대는 기원전 10~4세기로 학설이 갈림).'],
 [538,3,'불교 전래','백제 성왕이 불상과 경전을 보내 불교를 전함(552년설도 있음). 숭불 논쟁에서 소가씨가 승리하며 아스카 문화가 꽃피고, 쇼토쿠 태자가 17조 헌법을 제정.'],
 [630,3,'견당사 파견','당의 선진 문물을 배우기 위해 사절과 유학생·학문승을 파견해 894년까지 이어짐. 율령·불교·건축 등 당 문화를 폭넓게 수용해 고대 일본 국가 체제의 모범으로 삼음.'],
 [645,2,'다이카 개신','나카노오에 황자가 권신 소가씨를 제거하고 당의 율령제를 본뜬 개혁에 착수. 토지 국유와 중앙집권 관료제를 도입해 고대 천황제 국가의 기틀을 놓음.'],
 [710,3,'나라 천도와 기기 편찬','당의 장안을 본뜬 헤이조쿄로 천도하고 『고지키』(712)·『니혼쇼키』(720)를 편찬해 국가의 기원을 정리. 도다이지 대불 조성 등 국가 불교로 나라 문화가 꽃핌.'],
 [794,0,'헤이안 천도','간무 천황이 헤이안쿄(교토)로 천도, 이후 1,000년간 천황의 거처가 됨. 견당사 폐지(894) 후 가나 문자 등 일본 고유의 국풍(國風) 문화가 발달.'],
 [1008,3,'『겐지 이야기』','궁녀 무라사키 시키부가 귀공자 겐지의 사랑과 영락을 그린 54첩의 대작을 완성. 세계 최초의 장편소설로 꼽히며 일본적 미의식 "모노노아와레"의 원천이 됨.'],
 [1185,0,'가마쿠라 막부','미나모토노 요리토모가 단노우라 해전에서 다이라씨를 멸하고 최초의 무사 정권을 수립(1192년 정이대장군 임명). 이후 1868년까지 700년 무가 지배가 이어짐.'],
 [1274,1,'여몽연합군 침공','쿠빌라이의 명으로 여몽연합군이 1274년과 1281년 두 차례 규슈에 상륙했으나 하카타만 방루와 무사단의 저항, 그리고 폭풍에 좌절. 일본은 이 태풍을 "가미카제(神風)"라 부르며 신국 관념을 굳혔으나, 막대한 방어 비용에 은상을 주지 못해 가마쿠라 막부의 무사 지지 기반이 흔들림.'],
 [1333,1,'가마쿠라 막부 멸망','고다이고 천황의 도막 호소에 아시카가 다카우지와 닛타 요시사다가 호응해 가마쿠라를 함락하고 호조씨가 자결, 148년의 최초 무사 정권이 무너짐. 천황 친정을 되살린 겐무 신정은 무사의 불만을 사 3년 만에 좌절되고 남북조 분열로 이어짐.'],
 [1336,0,'무로마치 막부','아시카가 다카우지가 교토에 막부를 열고 남북조 분열이 60년간 이어짐. 금각사·은각사와 노(能), 다도, 수묵화 등 오늘날 일본 전통문화의 원형이 이 시기에 형성됨.'],
 [1404,4,'감합무역','아시카가 요시미쓰가 명에 조공하고 "일본 국왕"에 책봉되어 감합(무역 허가증) 무역을 시작. 왜구와 구별되는 공식 무역으로 막부의 재정을 채웠고 동아시아 조공 질서에 편입됨.'],
 [1467,1,'오닌의 난','쇼군 후계 다툼이 11년의 교토 시가전으로 번지며 무로마치 막부의 권위가 붕괴. 실력만이 지배하는 하극상의 전국시대 100년이 시작됨.'],
 [1543,4,'조총 전래','다네가시마에 표착한 포르투갈인이 화승총을 전함. 오다 노부나가는 나가시노 전투(1575)에서 조총 부대로 다케다 기마 군단을 격파하며 전국시대의 전술을 바꿈.'],
 [1573,1,'무로마치 막부 멸망','오다 노부나가가 자신이 앉힌 쇼군 아시카가 요시아키를 교토에서 추방해 237년의 막부가 끝남. 이후 노부나가와 히데요시가 실력으로 천하를 재편하는 아즈치모모야마 시대가 열려 막부 없는 통일 정권의 길이 닦임.'],
 [1590,1,'히데요시의 천하통일','농민 출신 도요토미 히데요시가 오다 노부나가의 사업을 이어받아 전국을 통일. 토지조사(검지)와 무기 몰수(도수령)로 병농분리를 확립했으나, 무리한 조선 침략으로 정권의 몰락을 자초함.'],
 [1603,0,'에도 막부','세키가하라 전투(1600)에서 승리한 도쿠가와 이에야스가 에도(도쿄)에 막부를 개설. 참근교대제로 다이묘를 통제하며 260년의 평화를 이룸.'],
 [1635,2,'참근교대제','3대 쇼군 이에미쓰가 다이묘에게 격년으로 에도에 머물고 처자를 인질로 두게 하는 참근교대를 제도화. 막대한 비용으로 다이묘를 통제하는 한편 전국 도로망과 조카마치 상업이 발달함.'],
 [1637,2,'쇄국 체제 완성','기독교도가 주축이 된 시마바라의 난을 진압한 뒤 포르투갈선의 내항을 금지. 나가사키의 네덜란드·중국 상관과 조선 통신사 등으로 창구를 제한한 쇄국이 200여 년 지속됨.'],
 [1688,3,'겐로쿠 문화','평화와 도시 상공업의 번영 속에 조닌(町人) 계층이 문화의 주역으로 등장해 이하라 사이카쿠의 소설과 마쓰오 바쇼의 하이쿠가 나옴. 이후 우키요에가 유럽 인상파에 영향을 미침.'],
 [1774,4,'『해체신서』와 난학','스기타 겐파쿠 등이 네덜란드어 해부학서를 3년에 걸쳐 번역 출간. 쇄국 속에서도 나가사키를 창구로 서양 학문을 흡수한 난학이 메이지 근대화의 지적 토대가 됨.'],
 [1853,2,'페리 내항','미국 페리 제독의 증기 군함 4척이 에도만에 나타나 개국을 요구, 이듬해 미일화친조약이 체결됨. 막부의 권위가 흔들리며 존왕양이 운동이 격화됨.'],
 [1858,2,'미일수호통상조약','초대 총영사 해리스의 압박으로 천황의 칙허 없이 조인되어 5개 항 개항과 치외법권, 관세자주권 상실을 규정. 조인을 강행한 이이 나오스케가 반대파를 탄압한 끝에 암살되며(1860) 존왕양이가 격화되었고, 이 불평등 조약의 개정이 이후 메이지 정부 대외 정책의 최대 과제가 됨.'],
 [1868,2,'메이지 유신','사쓰마·조슈 세력이 막부를 무너뜨리고 천황 친정을 선포. 폐번치현·징병제·식산흥업 등 위로부터의 근대화로 비서구권 최초의 산업국가로 변모함.'],
 [1871,2,'폐번치현과 이와쿠라 사절단','전국 260여 번을 없애고 부·현을 설치해 중앙집권을 완성한 뒤 이와쿠라 도모미가 이끄는 사절단이 구미를 시찰. 조약 개정에는 실패했으나 내치 우선의 근대화 노선이 확립됨.'],
 [1872,4,'학제와 철도 개통','전국에 소학교를 세우는 학제를 반포하고 신바시-요코하마 철도를 개통. 문명개화 정책으로 취학률이 급상승해 아시아 최고 수준의 인적 자본을 갖춤.'],
 [1889,2,'대일본제국 헌법','이토 히로부미가 프로이센 헌법을 본떠 기초한 아시아 최초의 근대 헌법이 흠정 형식으로 반포됨. 이듬해 제국의회가 개설되었으나 천황 대권과 통수권 독립이 훗날 군부 폭주의 통로가 됨.'],
 [1904,1,'러일전쟁 승리','만주와 한반도의 패권을 두고 러시아와 개전, 쓰시마 해전에서 발트함대를 궤멸시키며 승리. 비서구 국가가 유럽 열강을 꺾은 최초의 사례였으나, 일본의 한국 지배가 열강에 승인되는 결과를 낳음.'],
 [1915,2,'21개조 요구','1차대전을 틈타 중국에 산둥의 독일 이권 계승과 만몽 권익 확대를 요구해 강압적으로 관철. 중국의 반일 감정이 폭발해 5·4 운동의 직접적 도화선이 됨.'],
 [1923,2,'관동대지진','규모 7.9의 지진과 대화재로 도쿄·요코하마에서 10만여 명이 사망. 혼란 속 유언비어로 수천 명의 조선인이 학살되는 비극이 발생함.'],
 [1925,2,'다이쇼 데모크라시','정당 내각과 함께 25세 이상 남성 보통선거법이 제정되었으나 같은 해 치안유지법도 공포됨. 민주적 성장과 사상 통제가 병존하다 만주사변 이후 군부에 밀려 좌절됨.'],
 [1931,1,'만주사변','관동군이 류탸오후에서 철도를 폭파하고 이를 구실로 만주 전역을 점령해 만주국을 세움. 국제연맹 탈퇴(1933)로 국제적 고립과 15년 전쟁의 길로 들어섬.'],
 [1937,1,'중일전쟁·태평양전쟁','루거우차오 사건을 계기로 중국 전면 침공을 개시하고 난징에서 대규모 학살을 자행. 1941년 진주만 기습으로 미국과 개전하며 아시아·태평양 전역으로 전선을 확대함.'],
 [1945,1,'패전','히로시마(8/6)·나가사키(8/9) 원폭 투하와 소련 참전으로 무조건 항복. GHQ 점령하에서 상징천황제와 전쟁 포기를 담은 평화헌법 체제로 전환됨.'],
 [1952,2,'주권 회복','샌프란시스코 강화조약 발효로 6년 8개월의 연합국 점령이 종료됨. 동시에 미일안보조약 체제가 성립해 냉전의 서방 진영에 편입됨.'],
 [1964,4,'도쿄 올림픽','아시아 최초의 올림픽 개최와 세계 최초의 고속철도 신칸센 개통. 연 10% 성장의 고도성장기를 상징하며 패전국에서 경제대국으로의 복귀를 알림.'],
 [1968,4,'세계 2위 경제대국','고도성장으로 서독을 제치고 자유 진영 2위의 경제 규모에 오름. 트랜지스터·자동차·조선의 수출 경쟁력과 도요타 생산방식이 세계 제조업의 표준으로 확산됨.'],
 [1991,4,'버블 붕괴','주가와 지가가 정점 대비 절반 이하로 떨어지며 자산 거품이 붕괴. 부실채권과 디플레이션 속에 "잃어버린 30년"으로 불리는 장기 침체가 시작됨.'],
 [2011,2,'동일본 대지진','규모 9.0의 초대형 지진과 쓰나미로 약 2만 명이 사망·실종되고 후쿠시마 제1원전에서 노심용융 사고가 발생. 세계 각국의 원전 정책에 큰 영향을 미침.'],
]}]},
