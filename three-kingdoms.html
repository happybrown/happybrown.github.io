<title>삼국지 — 정사와 연의 가로 연대기</title>
<style>
:root{
  --bg:#F5F7F8; --panel:#EDF0F2; --ink:#232A33; --ink2:#5A6675; --ink3:#8B96A3;
  --hair:#D9E0E5; --grid:rgba(35,42,51,.08); --gridMajor:rgba(35,42,51,.20);
  --accent:#3A5FBF;
  /* 사실성 그라데이션: 사료에 가까울수록 파랑, 연의 쪽으로 갈수록 붉다 */
  --c0:#2C5AA8; --c1:#2A7F93; --c2:#A8781C; --c3:#C2622A; --c4:#B23A3F;
  --span1:rgba(58,95,191,.08); --span2:rgba(58,95,191,.15);
  --rail:rgba(243,246,247,.94); --tipbg:#FFFFFF; --shadow:0 8px 28px rgba(20,30,50,.16);
  --erashade:rgba(58,95,191,.035);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161A22; --panel:#1C212C; --ink:#E4E9F0; --ink2:#98A3B3; --ink3:#6B7686;
    --hair:#2A3140; --grid:rgba(228,233,240,.07); --gridMajor:rgba(228,233,240,.20);
    --accent:#6B8FE6;
    --c0:#7BA0E8; --c1:#4FB3C6; --c2:#D2A63E; --c3:#E08551; --c4:#E06B70;
    --span1:rgba(107,143,230,.10); --span2:rgba(107,143,230,.20);
    --rail:rgba(23,28,38,.94); --tipbg:#20262F; --shadow:0 10px 30px rgba(0,0,0,.5);
    --erashade:rgba(107,143,230,.05);
  }
}
:root[data-theme="dark"]{
  --bg:#161A22; --panel:#1C212C; --ink:#E4E9F0; --ink2:#98A3B3; --ink3:#6B7686;
  --hair:#2A3140; --grid:rgba(228,233,240,.07); --gridMajor:rgba(228,233,240,.20);
  --accent:#6B8FE6;
  --c0:#7BA0E8; --c1:#4FB3C6; --c2:#D2A63E; --c3:#E08551; --c4:#E06B70;
  --span1:rgba(107,143,230,.10); --span2:rgba(107,143,230,.20);
  --rail:rgba(23,28,38,.94); --tipbg:#20262F; --shadow:0 10px 30px rgba(0,0,0,.5);
  --erashade:rgba(107,143,230,.05);
}
:root[data-theme="light"]{
  --bg:#F5F7F8; --panel:#EDF0F2; --ink:#232A33; --ink2:#5A6675; --ink3:#8B96A3;
  --hair:#D9E0E5; --grid:rgba(35,42,51,.08); --gridMajor:rgba(35,42,51,.20);
  --accent:#3A5FBF;
  /* 사실성 그라데이션: 사료에 가까울수록 파랑, 연의 쪽으로 갈수록 붉다 */
  --c0:#2C5AA8; --c1:#2A7F93; --c2:#A8781C; --c3:#C2622A; --c4:#B23A3F;
  --span1:rgba(58,95,191,.08); --span2:rgba(58,95,191,.15);
  --rail:rgba(243,246,247,.94); --tipbg:#FFFFFF; --shadow:0 8px 28px rgba(20,30,50,.16);
  --erashade:rgba(58,95,191,.035);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif;
  font-size:14px; line-height:1.5;
}
.serif{font-family:'Nanum Myeongjo','Noto Serif KR','AppleMyungjo','Songti SC',serif}

/* ── header ── */
header{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  padding:12px 20px 10px; border-bottom:1px solid var(--hair); background:var(--bg);
}
h1{font:700 21px/1.2 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif; margin:0; letter-spacing:.5px; text-wrap:balance}
.subtitle{font-size:11.5px; color:var(--ink2); margin-top:2px}
.headL{min-width:200px}
.legend{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  border:1px solid var(--hair); border-radius:999px; padding:3.5px 11px 3.5px 8px;
  font-size:12px; color:var(--ink2); background:transparent; user-select:none;
  transition:opacity .15s, border-color .15s;
}
.chip .dot{width:9px; height:9px; border-radius:50%}
.chip.on{color:var(--ink); border-color:var(--ink3)}
.chip.off{opacity:.38}
.eranav{display:flex; gap:4px; align-items:center; margin-left:auto}
.eranav button{
  font:inherit; font-size:12px; color:var(--ink2); background:var(--panel);
  border:1px solid var(--hair); border-radius:6px; padding:4px 10px; cursor:pointer;
}
.eranav button:hover{color:var(--ink); border-color:var(--ink3)}
.eranav button:focus-visible, .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.zoomctl{display:flex; align-items:center; gap:2px}
.zoomctl button{
  font:inherit; font-size:15px; line-height:1; width:26px; height:26px; border-radius:6px;
  color:var(--ink2); background:var(--panel); border:1px solid var(--hair); cursor:pointer;
}
.zoomctl button:hover:not(:disabled){color:var(--ink); border-color:var(--ink3)}
.zoomctl button:disabled{opacity:.35; cursor:default}
.zoomctl button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#zval{min-width:42px; text-align:center; font-size:11.5px; color:var(--ink2); font-variant-numeric:tabular-nums}
#readout{
  min-width:118px; text-align:right; font-variant-numeric:tabular-nums;
  font-size:12px; color:var(--ink2); line-height:1.3;
}
#readout b{display:block; font-size:15px; color:var(--accent); font-weight:700}

/* ── scroll stage ── */
#viewport{position:relative; overflow:auto; height:calc(100dvh - 67px); cursor:grab}
#viewport.dragging{cursor:grabbing; user-select:none}
#canvas{position:relative}

.gridline{position:absolute; top:0; bottom:0; width:1px; background:var(--grid); pointer-events:none}
.gridline.major{background:var(--gridMajor)}
.erashadeCol{position:absolute; top:0; bottom:0; background:var(--erashade); pointer-events:none}

/* axis */
#axis{
  position:sticky; top:0; z-index:40; height:58px;
  background:var(--bg); border-bottom:1px solid var(--hair);
}
.eraband{
  position:absolute; top:0; height:21px; border-left:1px solid var(--gridMajor);
  font:italic 600 11px/21px 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif;
  color:var(--accent); letter-spacing:2px; white-space:nowrap; overflow:clip;
}
/* 시대명은 JS(updateStickyLabels)가 화면 안쪽으로 밀어 넣는다.
   부모가 sticky/absolute라 CSS position:sticky는 이 문맥에서 동작하지 않는다. */
.eraband i{font-style:inherit; display:inline-block; padding-left:8px; will-change:transform}
.tick{position:absolute; top:21px; height:37px; border-left:1px solid var(--grid)}
.tick.major{border-left-color:var(--gridMajor)}
.tick span{
  position:absolute; top:8px; left:5px; font-size:10.5px; color:var(--ink3);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.tick.major span{color:var(--ink2); font-weight:600}

/* region header */
.regionhead{position:relative; height:30px; background:var(--panel); border-bottom:1px solid var(--hair)}
.regionhead .rl{
  position:sticky; left:0; display:inline-flex; align-items:center; height:100%;
  padding:0 16px; font-size:10.5px; font-weight:700; letter-spacing:3px; color:var(--ink3);
}

/* country rows */
.row{position:relative; height:134px; border-bottom:1px solid var(--hair)}
.rowlabel{
  position:sticky; left:0; z-index:30; float:left; width:152px; height:100%;
  display:flex; flex-direction:column; justify-content:center; padding:0 14px;
  background:var(--rail); backdrop-filter:blur(5px); border-right:1px solid var(--hair);
}
.rowlabel b{font:700 16px/1.25 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif; letter-spacing:1px}
.rowlabel small{font-size:10px; color:var(--ink3); letter-spacing:1.5px; margin-top:2px}
.baseline{position:absolute; left:0; right:0; top:75px; height:1px; background:var(--grid); pointer-events:none}

.span{
  position:absolute; top:6px; height:20px; border-radius:4px; background:var(--span1);
  font-size:10.5px; line-height:20px; color:var(--ink2); padding:0 7px;
  white-space:nowrap; pointer-events:none; overflow:clip;
}
.span.alt{background:var(--span2)}
/* 왕조명도 JS가 화면 안쪽으로 밀어 넣는다 (위 .eraband i와 같은 이유) */
.span i{font-style:normal; display:inline-block; will-change:transform}
.span.pre{background:transparent; border:1px dashed var(--hair); color:var(--ink3); line-height:18px}

.ev{position:absolute; z-index:5; transition:opacity .15s}
@media (prefers-reduced-motion: reduce){.ev{transition:none}}
.ev .dot{
  position:absolute; width:9px; height:9px; border-radius:50%;
  left:-4.5px; top:70.5px; box-shadow:0 0 0 2px var(--bg); transition:transform .12s;
}
.ev .lbl{
  position:absolute; left:-2px; font-size:11px; white-space:nowrap; color:var(--ink);
  padding:1px 4px 1px 3px; line-height:1.25; border-radius:3px; cursor:default;
  transition:opacity .12s linear;
}
.ev .conn{position:absolute; left:-.5px; width:1px; background:var(--grid); pointer-events:none}
.ev:hover, .ev.sel, .ev:focus-visible{z-index:20}
.ev:hover .dot, .ev.sel .dot, .ev:focus-visible .dot{transform:scale(1.7)}
.ev:hover .lbl, .ev.sel .lbl, .ev:focus-visible .lbl{
  background:var(--tipbg); box-shadow:var(--shadow); color:var(--ink); font-weight:700;
}
.ev:focus{outline:none}
.ev:focus-visible .lbl{outline:2px solid var(--accent); outline-offset:1px}
.ev.dim{opacity:.14; pointer-events:none}
.ev.dim .lbl{visibility:hidden}
/* 왼쪽 국가명 레일에 가려지는 라벨은 감춰 글자가 잘려 보이지 않게 함.
   hover/sel 규칙보다 뒤에 두어 그 위에서도 확실히 적용되도록 한다. */
.ev.behind .lbl, .ev.behind:hover .lbl, .ev.behind.sel .lbl{
  opacity:0; pointer-events:none; box-shadow:none; background:transparent;
}
.ev.behind .conn{opacity:0}
@media (prefers-reduced-motion: reduce){
  .ev .dot{transition:none}
  #viewport{scroll-behavior:auto !important}
}

/* ── 사건 간 관계 표시 ── */
#relsvg{position:absolute; left:0; top:0; width:100%; height:100%; z-index:12; pointer-events:none}
/* 관계가 있는 사건: 점 둘레에 옅은 링 */
.ev.hasrel .dot{box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px color-mix(in srgb, var(--accent) 38%, transparent)}
/* 관계 모드: 선택·연관 사건만 남기고 나머지는 가라앉힘 */
.relmode .ev:not(.rel):not(.sel){opacity:.15}
.relmode .span{opacity:.45}
.relmode .ev.rel, .relmode .ev.sel{z-index:19}
.ev.rel .dot{transform:scale(1.5)}
.ev.rel .lbl{background:var(--tipbg); box-shadow:var(--shadow); color:var(--ink); font-weight:700}

/* tooltip */
#tip{
  position:fixed; z-index:99; max-width:350px; pointer-events:none; display:none;
  background:var(--tipbg); border:1px solid var(--hair); border-radius:8px;
  padding:10px 13px; box-shadow:var(--shadow);
}
#tip .ty{font-size:11.5px; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.5px}
#tip .tt{
  font:700 14.5px/1.35 'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif; margin:3px 0 5px;
  white-space:normal; overflow-wrap:break-word;
}
#tip .td{
  font-size:12px; color:var(--ink2); line-height:1.55;
  white-space:normal; overflow-wrap:break-word; word-break:keep-all;
}
/* 상세 블록: 출전·연의 회차·덧붙임 — 본문과 구분되는 자료 층 */
#tip .tx{
  margin-top:9px; padding-top:8px; border-top:1px solid var(--hair);
  font-size:11.5px; color:var(--ink2); line-height:1.7; word-break:keep-all;
}
#tip .tx b{color:var(--ink); font-weight:600; margin-right:2px}
#tip.sheet .tx{font-size:12.5px}
#tip .tc{display:inline-flex; align-items:center; gap:5px; margin-top:8px; font-size:10.5px; color:var(--ink3)}
#tip .tc i{width:8px; height:8px; border-radius:50%; display:inline-block}
#tip .rlhint{margin-top:7px; font-size:10.5px; color:var(--accent)}
/* ── 사건 이미지: 자리를 미리 잡아 툴팁이 튀지 않게 하고, 실패하면 통째로 접음 ── */
#tip .tim{
  margin:7px 0 0; height:140px; border-radius:6px; overflow:hidden;
  background:linear-gradient(100deg,var(--panel) 30%,var(--hair) 50%,var(--panel) 70%);
  background-size:220% 100%; animation:timshim 1.1s linear infinite;
}
#tip .tim img{width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .25s}
#tip .tim.fit img{object-fit:contain}   /* 저해상도 원본은 확대 대신 여백을 둠 */
#tip .tim.on{animation:none; background:var(--panel)}
#tip .tim.on img{opacity:1}
#tip .tim.off, #tip .tim.off + .tsrc{display:none}
#tip .tsrc{display:block; font-size:9.5px; color:var(--ink3); margin-top:3px; text-align:right; text-decoration:none}
/* 시트는 화면 폭을 다 쓰므로 이미지는 배너가 되지 않게 도판 크기로 묶어둠 */
#tip.sheet .tim{height:200px; max-width:440px}
#tip.sheet .tsrc{max-width:440px}
@keyframes timshim{to{background-position:-120% 0}}
@media (prefers-reduced-motion: reduce){#tip .tim{animation:none} #tip .tim img{transition:none}}
/* 연관 사건 목록 */
#tip .rl2{margin-top:10px; padding-top:8px; border-top:1px solid var(--hair)}
#tip .rl2>b{display:block; font-size:10.5px; color:var(--ink3); letter-spacing:1.5px; margin-bottom:4px}
.relchip{
  display:block; width:100%; text-align:left; font:inherit; background:transparent;
  border:0; border-radius:6px; padding:5px 6px; cursor:pointer;
}
.relchip:hover{background:var(--panel)}
.relchip:focus-visible{outline:2px solid var(--accent); outline-offset:-1px}
.relchip .rc1{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink2)}
.relchip .rc1 i{width:7px; height:7px; border-radius:50%; flex:none}
.relchip .rc1 b{color:var(--ink); font-weight:600}
.relchip .rc1 em{font-style:normal; margin-left:auto; font-size:10px; color:var(--accent); white-space:nowrap; flex:none}
.relchip .rc2{display:block; font-size:10.5px; color:var(--ink3); margin:1px 0 0 12px; line-height:1.4}
/* 터치 기기: 화면 하단에 고정된 시트로 표시해 항상 화면 안에 보이게 함 */
#tip.sheet{
  left:0; right:0; bottom:0; top:auto; max-width:none; width:auto;
  border-radius:14px 14px 0 0; border-width:1px 0 0; padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  animation:sheetin .18s ease-out;
  max-height:52dvh; overflow-y:auto; pointer-events:auto;
}
#tip.sheet .td{font-size:13px}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){#tip.sheet{animation:none}}

#hint{
  position:fixed; right:14px; bottom:12px; z-index:50; font-size:11px; color:var(--ink3);
  background:var(--rail); border:1px solid var(--hair); border-radius:999px;
  padding:5px 13px; backdrop-filter:blur(5px); pointer-events:none;
}
@media (max-width:720px){
  header{gap:10px; padding:10px 14px 8px}
  .eranav{margin-left:0}
  #readout{display:none}
  #viewport{height:calc(100dvh - 110px)}
  #hint{display:none}
}
</style>

<header>
  <div class="headL">
    <h1>삼국지 — 정사와 연의</h1>
    <div class="subtitle">황건의 난에서 진의 통일까지 · 184–280 · 색은 「어느 사료에 있는가」</div>
  </div>
  <div class="legend" id="legend" role="group" aria-label="사실성 등급 필터"></div>
  <nav class="eranav" id="eranav" aria-label="시대 이동"></nav>
  <div class="zoomctl" role="group" aria-label="가로축 확대/축소">
    <button id="zout" type="button" aria-label="축소" disabled>−</button>
    <span id="zval">100%</span>
    <button id="zin" type="button" aria-label="확대">+</button>
  </div>
  <div id="readout"><b>172</b><span>후한의 붕괴</span></div>
</header>

<div id="viewport" tabindex="0" aria-label="연대기 스크롤 영역">
  <div id="canvas"></div>
</div>
<div id="tip" role="tooltip"></div>
<div id="hint">드래그·Shift+휠 이동 · Ctrl+휠/± 확대 · 사건 오버/클릭: 상세·연관 관계 · 범례 칩을 누르면 그 등급만 남고(다시 누르면 해제), 다른 칩을 더 누르면 함께 본다 — 「정사 본문」만 켜면 진수의 삼국지, 뒤 세 칩만 켜면 연의가 손댄 자리</div>

<script>
/* ───────── time scale: piecewise linear (px per year) ─────────
   연의가 쓴 지면과 사건 밀도를 그대로 축척에 반영했다.
   208년 한 해(적벽)에 연의는 여덟 회를 쓰고 후반 46년은 열다섯 회로 압축하므로,
   208·219·220년은 월 단위로 벌리고 후반부는 촘촘히 접는다. */
const SEGS=[[172,184,11],[184,190,26],[190,196,34],[196,200,44],[200,208,40],[208,209,700],[209,215,64],[215,219,78],[219,221,150],[221,223,90],[223,228,60],[228,235,86],[235,249,26],[249,264,30],[264,281,20]];
const RAIL=152, PAD=36, BASE=75;   /* BASE: 행 안에서 사건 점이 놓이는 기준선 y좌표 */

/* 확대 배율: 사건이 촘촘한 구간을 넓혀 보기 위한 가로축 스케일 */
const ZOOMS=[1,1.6,2.5,4,8];
let zi=0, Z=ZOOMS[0];
/* 연도 → x좌표. 배율 Z가 곱해지며, 레일·여백은 배율과 무관하게 고정.
   연도는 실수를 받는다 — 소수부는 한 해 안에서의 배치 순서일 뿐 달이 아니다.
   달은 사료로 확인된 것만 events의 5번째 원소에 숫자로 적고, 그때만 툴팁에 나온다 */
function X(y){let x=0;for(const[a,b,k]of SEGS){if(y<=a)break;x+=(Math.min(y,b)-a)*k}return x*Z+RAIL+PAD}
function invX(px){let x=(px-RAIL-PAD)/Z;for(const[a,b,k]of SEGS){const w=(b-a)*k;if(x<=w)return a+x/k;x-=w}return 281}
const totalW=()=>X(281)+140;

/* ───────── 분류 = 사실성 5단계 ─────────
   주제가 아니라 「어느 사료에 무엇이 있는가」로 나눈다.
   범례에서 2~4를 끄면 정사만, 0~1을 끄면 연의가 지어낸 것만 남는다. */
const CATS=[
 {n:'정사 본문', v:'--c0', d:'진수 『삼국지』 본문에 있는 일'},
 {n:'배송지 주·이설', v:'--c1', d:'『위략』『강표전』『한진춘추』 등 주석이 전하는 일 — 사료이되 진수가 본문에 넣지 않은 것'},
 {n:'연의 각색', v:'--c2', d:'사실의 뼈대 위에 과장과 윤색을 얹은 자리'},
 {n:'연의 이전(移轉)', v:'--c3', d:'실재한 일이지만 주체나 시점이 바뀐 자리'},
 {n:'연의 창작', v:'--c4', d:'사료에 근거가 없는 자리'},
];

const REGIONS=[
{name:'후한의 붕괴', rows:[
{name:'한 조정과 황건', sub:'HAN COURT · YELLOW TURBANS',
 spans:[[172,189,'영제와 십상시'],[189,190,'소제·헌제'],[190,196,'장안의 헌제'],[196,220,'허도의 헌제'],[220,281,'한실이 사라진 뒤',1]],
 events:[
 [198.3,0,'이각과 곽사의 최후','장안을 주무르던 두 사람의 끝은 한 해 차이로 왔다. 곽사는 197년 제 부하 오습의 칼에 죽었고, 이각은 198년 4월 조조가 보낸 알자복야 배무와 단외의 토벌군에 잡혀 삼족이 멸했다. 잘린 이각의 목이 허도에 걸렸을 때 헌제의 심정이 어땠을까. 동탁의 잔당은 이렇게 지워졌고, 관중은 조조의 손에 들어갔다. 난세의 첫 악역들은 대개 무대에서 이렇게 조용히 치워진다.',4,'<b>출전</b> 『후한서』 동탁전<br><b>연의</b> 제13회 전후로 퇴장이 처리된다<br><b>덧붙임</b> 이각의 삼족을 멸한 배무는 그 공으로 열후가 되었다. 흥미로운 생존자는 두 사람의 옛 참모 가후 — 주인들이 차례로 도륙당하는 동안 단외와 장수를 거쳐 조조의 책사로 안착해 있었다.'],
 [178,0,'서원 매관','저잣거리에서 쌀을 팔듯 황제가 벼슬을 팔았다. 영제는 서원(西園)에 값을 써 붙였다 — 삼공 자리는 1천만 전, 구경 자리는 5백만 전. 조서는 십상시의 손끝에서 나오고, 돈을 치르고 부임한 수령들은 임지에 닿기가 무섭게 본전 생각부터 했다. 그 본전은 어디서 나오는가. 백성의 뼈에서 나온다. 연의 제1회가 "천하대세는 나뉜 지 오래면 반드시 합한다"로 문을 열기 전에, 실제 역사는 이렇게 문을 열고 있었다.',0,'<b>출전</b> 『후한서』 영제기·환자열전<br><b>연의</b> 제1회의 배경 — 소설은 십상시의 발호로 요약한다<br><b>덧붙임</b> 관직의 정가는 연봉의 약 1만 배였고, 외상 구매 뒤 부임해서 갚는 할부제까지 있었다. 사도 최열이 5백만 전에 삼공이 되자 영제가 "천만은 받을 수 있었는데" 아까워했다는 일화가 남아 있다.'],
 [182,0,'당고의 금과 청류의 몰락','나라가 기울 때는 먼저 입이 막힌다. 환관을 비판하던 사대부 수백이 두 차례 당고(166·169)로 벼슬길이 끊긴 채 갇히고 태학생 1천여 명이 끌려갔다. 바른말의 값이 종신 금고였으니 조정에는 아첨만 남았다. 그리고 15년 뒤 황건이 일어나자 조정은 그제야 화들짝 당인들을 사면한다 — 이 인재들이 반군과 손잡을까 두려웠던 것이다. 외척과 환관과 사대부가 서로 물어뜯던 후한 100년의 삼각 구도는 이미 스스로 무너져 있었다.',0,'<b>출전</b> 『후한서』 당고열전<br><b>연의</b> 다루지 않음 — 소설은 황건 직전에서 시작한다<br><b>덧붙임</b> 금고(禁錮)는 본인만이 아니라 문생·고리(門生故吏)와 부자·형제까지 벼슬길을 막는 연좌형이었다. 1차(166)에서는 이응 등 2백여 명이 하옥되었다 금고형으로 풀려났고, 2차(169)에서는 이응·두밀 등 백여 명이 옥사하고 6~7백 명이 금고에 걸렸다.'],
 [184.08,0,'황건의 난','거록 땅의 장각은 부적 태운 물로 병을 고쳐 주던 사람이다. 십수 년 사이 신도가 수십만으로 붇더니 어느새 여덟 주에 36방(方)의 조직이 깔렸다. 구호부터 섬뜩했다. "푸른 하늘은 이미 죽었다, 누런 하늘이 서리라(蒼天已死 黃天當立)." 밀고로 거사가 앞당겨졌는데도 봉기 한 달 만에 조정이 휘청였다. 정작 장각 본인은 그해 병으로 죽지만, 이 난이 열어젖힌 문으로 조조도 유비도 손견도 걸어 들어온다. 삼국지의 진짜 제1회는 여기다.',2,'<b>출전</b> 『후한서』 황보숭전·영제기<br><b>연의</b> 제1회 — 유관장 삼형제가 이 난으로 등장한다<br><b>덧붙임</b> 갑자년(184)을 거사일로 고른 것은 참위설의 역법 — 새 갑자가 새 하늘을 연다는 계산이었다. 마원의(馬元義)가 낙양 내응을 조직하다 제자 당주의 밀고로 거열형을 당하며 거사가 한 달 앞당겨졌다.'],
 [184.83,0,'장각의 죽음과 황건 진압','장각이 병사하자 황보숭이 광종에서 장량을, 하곡양에서 장보를 차례로 꺾었다. 벤 목이 십수만 — 시체를 쌓아 경관(京觀)이라는 탑을 만들었다고 사서는 담담하게 적는다. 그러나 이긴 쪽은 조정이 아니었다. 흑산으로, 백파로, 청주로 흩어진 잔당 수십만이 이후 20년간 군웅들의 병력 시장이 되었으니, 조조를 일으켜 세운 청주병 30만도 바로 이 시장에서 나온다.',11,'<b>출전</b> 『후한서』 황보숭전<br><b>연의</b> 제2회 — 진압의 공은 주로 유관장에게 재배분된다<br><b>덧붙임</b> 이미 죽어 묻힌 장각은 관을 열어 부관참시되고 목이 낙양으로 보내졌다. 황보숭은 이 공으로 식읍 8천 호의 괴리후가 되었으나, 뒷날 동탁에게 밉보여 목숨을 구걸하는 처지로 몰린다.'],
 [185,0,'양주(涼州)의 반란','황건의 불길이 채 꺼지기도 전에 서북에서 또 불이 붙었다. 북궁백옥과 변장·한수가 강족과 손잡고 일어나 장안 코앞의 삼보까지 밀고 들어온 것이다. 조정은 급한 대로 장수들을 서쪽으로 보냈는데, 이것이 패착이었다. 동탁은 이 전란에서 서량의 정예 기병을 제 사병처럼 길들였고, 황보숭과 손견 같은 이름들도 여기서 칼을 갈았다. 나라의 군대가 변경 장수의 사병으로 바뀌어 가는 소리를 낙양의 조정만 듣지 못했다.',0,'<b>출전</b> 『후한서』 동탁전·개훈전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 진압에 나선 여섯 장수 중 다섯이 패하고 동탁만 온전히 돌아왔다 — 이 전공이 그의 발판이 되었다. 반란군에 추대된 한수는 이후 30여 년을 관서에서 버텨, 삼국지에서 가장 오래 살아남은 반란자가 된다.'],
 [188,0,'주목(州牧)의 부활','유언이 조정에 꾀를 하나 올렸다. 감찰이나 하던 자사를 주목(州牧)으로 높여 군사·행정·재정을 한 손에 쥐여 주자 — 그래야 반란을 빨리 끈다는 논리였다. 조정은 받아들였고, 정작 건의한 유언부터 익주로 내려가 제 나라처럼 눌러앉았다. 반란을 끄자고 만든 자리가 군벌 할거의 면허장이 된 셈이다. 삼국 분열에 제도의 도장이 찍힌 날을 하나만 꼽으라면 바로 이날이다.',0,'<b>출전</b> 『삼국지』 촉서 유이목전(유언전)<br><b>연의</b> 다루지 않음 — 소설이 생략한 제도사의 분기점<br><b>덧붙임</b> 유언이 처음 노린 자리는 교지목(交趾牧), 즉 최남단이었다 — "익주에 천자의 기운이 있다"는 관상가 동부의 말에 행선지를 바꿨다. 그 익주가 훗날 유비의 나라가 되었으니, 예언은 주인을 바꿔 적중한 셈이다.'],
 [188.58,0,'서원팔교위','영제가 금군을 새로 짜며 여덟 교위를 두었는데, 그 명부가 두고 보면 걸작이다. 우두머리 상군교위는 환관 건석, 중군교위는 원소, 전군교위는 조조, 우교위는 순우경. 십여 년 뒤 관도에서 서로 목을 노릴 이름들이 같은 부대 명부에 나란히 적혀 있다. 황제는 대장군 하진을 견제하려 이 부대를 만들었다지만, 결과적으로 난세의 주역들에게 군사 경력 한 줄씩을 보태 준 꼴이 되었다.',8,'<b>출전</b> 『후한서』 하진전·영제기<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 총지휘관 건석은 환관으로서 금군 원수가 된 초유의 사례로, 대장군 하진조차 명목상 그 지휘를 받았다. 이듬해 영제가 죽자 건석은 하진 암살을 꾀하다 도리어 죽고, 팔교위 체제는 1년 만에 공중분해된다.'],
 [189.25,0,'영제의 죽음과 하진·환관의 공멸','영제가 죽자 판이 한꺼번에 뒤집혔다. 대장군 하진은 어린 소제를 세우고 십상시를 쓸어버리려다 도리어 궁궐 안으로 불려 들어가 목이 떨어졌다. 그러자 원소와 원술이 궁에 불을 지르고 환관 2천여 명을 몰살했다 — 수염 없는 남자는 보이는 대로 죽였다고 한다. 소제와 아홉 살 진류왕은 한밤중에 북망산으로 달아났다. 100년을 이어 온 외척과 환관의 정치가 하룻밤 사이에 함께 재가 되었고, 그 잿더미를 향해 서쪽에서 군대가 다가오고 있었다.',0,'<b>출전</b> 『후한서』 하진전<br><b>연의</b> 제2~3회<br><b>덧붙임</b> 하진은 백정 집안 출신으로 누이가 황후가 되며 대장군까지 오른 인물 — 원소가 그 문객이 되어 환관 몰살을 부추겼다. 궁중 대학살 당일 낙양의 불길을 보고 가장 먼저 달려온 군대가 하필 동탁의 서량군이었다.'],
 [189.58,2,'외병 소환이라는 계책','환관을 없애야겠는데 태후가 허락하지 않는다. 그때 원소가 낸 꾀가 이것이다 — 사방의 장수들을 서울로 불러 무력시위를 벌이자(정사 하진전·원소전). 진림이 말렸고 조조는 코웃음을 쳤다. "환관 목 치는 데야 옥리 하나면 족한데 어찌 밖의 군대를 부르는가." 그 말대로 되었다. 불려 온 동탁은 환관이 아니라 조정을 통째로 삼켰다. 연의 제2회도 이 구도를 살리되, 조조의 선견지명이 한층 빛나도록 다듬었다.',8,'<b>출전</b> 『후한서』 하진전, 『삼국지』 무제기 배송지 주<br><b>연의</b> 제2회 — 조조의 반대 발언이 거의 그대로 실려 있다<br><b>덧붙임</b> 정태(鄭泰)도 "동탁은 승냥이니 서울에 들이면 사람을 먹을 것"이라 경고하고 벼슬을 버렸다. 소환장을 받은 동탁은 다른 장수들과 달리 명령 취소 조서도 무시한 채 진군을 멈추지 않았다.'],
 [189.67,0,'동탁의 폐립','낙양에 들어온 동탁이 맨 먼저 한 일은 황제를 갈아 치우는 것이었다. 소제를 끌어내리고 아홉 살 진류왕 협을 앉히니 이가 곧 마지막 황제 헌제다. 말리던 정원은 부하 여포의 손에 죽고 그 병력은 고스란히 동탁의 몫이 되었다. 스스로 상국이 된 동탁은 검을 찬 채 어전에 올랐다. 아홉 살에 옥좌에 앉은 헌제는 이날부터 31년을 이름뿐인 천자로 산다 — 이후 삼국지의 모든 명분 싸움이 이 어린 황제 한 사람을 둘러싸고 벌어진다.',9,'<b>출전</b> 『후한서』 동탁전, 『삼국지』 위서 동탁전<br><b>연의</b> 제3~4회 — 정원 살해와 폐립 논쟁이 이 대목이다<br><b>덧붙임</b> 폐립 회의에서 노식이 홀로 정면 반박하다 목숨을 잃을 뻔했다. 폐위된 소제는 이듬해 이유(李儒)가 올린 독주를 마시고 열여덟에 죽는다 — 아내 당희(唐姬) 앞에서 이별가를 부르고 마셨다고 『후한서』가 적는다.'],
 [190.17,0,'낙양 방화와 장안 천도','관동 제후들이 들고일어나자 동탁은 싸우는 대신 도시를 지웠다. 헌제를 끼고 장안으로 옮기면서 궁궐과 종묘를 불태우고 2백 리 안의 민가까지 죄다 태웠으며, 백성 수백만을 몰아 서쪽으로 끌고 갔다. 역대 황릉을 파서 보물을 거두는 일도 잊지 않았다. 4백 년 도읍 낙양이 연기가 되어 사라진 이날, 후한이라는 나라도 사실상 함께 타 버렸다.',2,'<b>출전</b> 『후한서』 동탁전, 『삼국지』 위서 동탁전<br><b>연의</b> 제6회<br><b>덧붙임</b> 황릉과 공경 무덤의 발굴은 여포에게 맡겨 부장품을 조직적으로 거뒀다. 동탁 본인은 장안에 가지 않고 낙양 필규원에 남아 관동군과 대치했다 — 불탄 서울을 등 뒤의 초토(焦土) 방벽으로 쓴 것이다.'],
 [192.25,0,'동탁의 죽음','사도 왕윤이 여포를 조용히 끌어들였다. 같은 병주 사람이라는 연줄, 동탁이 홧김에 여포에게 수극을 던졌던 일, 동탁의 시비와 남몰래 정을 통하며 졸이던 가슴 — 정사가 적어 둔 재료는 미인계가 아니라 이런 것들이다. 궁문 앞에서 습격당한 동탁이 "내 아들 봉선은 어디 있느냐" 외치자 여포가 답했다. "조서를 받들어 역적을 벤다." 시체는 저자에 버려졌는데 살이 어찌나 기름졌던지, 배꼽에 심지를 꽂아 불을 붙이니 며칠을 탔다고 『후한서』가 적는다.',4,'<b>출전</b> 『후한서』 동탁전·왕윤전, 『삼국지』 위서 여포전<br><b>연의</b> 제9회 — 미인계의 완성편<br><b>덧붙임</b> 거사 당일 동탁은 헌제의 쾌유 축하연에 입궐하던 길이었고, 칼을 든 것은 여포의 동향 기도위 이숙이었다. 장안 백성들은 노래하고 패물을 팔아 술을 샀으며, 동탁의 배꼽 등불은 며칠 밤을 탔다 — 축제가 된 장례였다.'],
 [192.25,4,'초선과 연환계','그런데 초선은 어디 있는가. 없다. 정사 어디에도 그 이름은 없다. 여포전이 적는 것은 "여포가 동탁의 시비와 사통하여 들킬까 늘 두려워했다"는 한 줄 — 이름 없는 이 시비에게 원나라 잡극이 살을 붙이고 이름을 지어 주었다. 초선(貂蟬)이란 본디 한나라 관모에 다는 담비 꼬리와 매미 날개 장식, 그러니까 여관(女官)의 직함이다. 왕윤이 수양딸을 두 호걸 사이에 심었다는 연의 제8~9회의 연환계는, 한 줄짜리 추문이 800년에 걸쳐 자라난 나무인 셈이다.',0,'<b>출전</b> 창작 — 씨앗은 『삼국지』 위서 여포전의 시비 기사 한 줄<br><b>연의</b> 제8~9회<br><b>덧붙임</b> 원 잡극 「연환계」에서는 초선이 임조 출신 임홍창(任紅昌)이라는 본명까지 갖고 등장한다. 후대 경극에서 서시·왕소군·양귀비와 나란히 4대 미인이 되었으니 — 실존하지 않은 유일한 4대 미인이다.'],
 [192.5,0,'이각·곽사의 장안 함락','동탁이 죽고 서량 군벌들이 뿔뿔이 흩어지려 할 때 가후가 나직이 말했다. "지금 흩어지면 정장(亭長) 하나에게도 묶인다. 차라리 되돌아가 장안을 치자." 이 한마디가 역사를 틀었다. 이각과 곽사는 가는 길에 병사를 긁어모아 10만으로 분 채 열흘 만에 장안을 깨뜨렸다. 왕윤은 죽고 여포는 달아나고 헌제는 다시 서량 군벌의 손아귀에 들어갔다. 배송지가 인용한 『헌제기』는 이때 죽은 사람이 만여 명이라 적는다. 난세를 한 번 더 꼬아 놓은 것은 책사의 보신책 한 줄이었다.',6,'<b>출전</b> 『후한서』 동탁전, 『삼국지』 위서 동탁전 배송지 주 『헌제기』<br><b>연의</b> 제9회 말~제10회<br><b>덧붙임</b> 가후는 이 공으로 후(侯) 책봉을 제안받자 "목숨을 구하려던 계책일 뿐, 무슨 공이겠소"라며 사양했다 — 제 꾀가 부른 참극을 아는 사람의 사양법이었다. 왕윤은 달아나라는 권유를 물리치며 "관동의 제공들에게 나라를 잊지 말라 전해 주오"라는 말을 남기고 죽음을 받았다.'],
 [194.25,0,'삼보의 대기근','장안을 차지한 군벌들이 서로 싸우는 사이 하늘도 등을 돌렸다. 관중에 가뭄이 들어 곡식 한 섬이 50만 전 — 사람이 사람을 잡아먹었다고 사서는 적는다. 열네 살 헌제가 창고를 열어 죽을 쑤게 했는데도 굶어 죽는 자가 줄지 않자, 어린 황제는 몸소 쌀과 콩을 되어 보게 했다. 아니나 다를까 관리들이 빼돌리고 있었다. 천자가 할 수 있는 일이 됫박을 검사하는 것뿐이던 시절이다.',0,'<b>출전</b> 『후한서』 헌제기·동탁전<br><b>연의</b> 제13회에 스치듯 지나간다<br><b>덧붙임</b> 곡가 50만 전은 평시의 백 배가 넘는 값 — 시체가 길에 쌓이자 조정은 마구간의 말 백여 필과 어부(御府)의 비단 2만 필을 내다 팔아 구휼에 보탰다. 인구 수십만의 장안 일대가 2년 만에 "사람의 자취가 끊겼다"고 기록될 만큼 비워졌다.'],
 [195.58,0,'헌제의 동귀(東歸)','이각과 곽사가 서로 치고받는 틈에 헌제가 장안을 빠져나왔다. 천자의 행차라기엔 처참한 피난길 — 1년 넘게 유랑하며 상서랑 같은 고관들이 스스로 들에서 나무 열매를 캐 먹고, 성벽 아래서 굶어 죽는 자가 나왔다. 양봉과 동승의 호위로 간신히 낙양에 닿았지만 그곳엔 궁도 곡식도 없었다. 백관이 무너진 담장 사이에서 자는 이 폐허의 조정 — 누군가 먼저 거두는 사람이 임자였다.',7,'<b>출전</b> 『후한서』 헌제기, 『삼국지』 위서 동탁전<br><b>연의</b> 제13~14회<br><b>덧붙임</b> 조양 나루에서 이각군의 추격을 받아 배에 오르는데, 매달리는 자들의 손가락이 뱃전에서 잘려 "손가락을 움켜쥘 수 있을 만큼 쌓였다"고 『후한서』가 적는다. 황후의 비단 몇 필마저 호위 장수들이 다투어 빼앗았다.'],
 [196.67,0,'허도 천도와 봉천자','그 임자가 조조였다. 굶주리는 헌제를 허(許)로 모셔 오고 스스로 대장군을 거쳐 사공에 올랐다. 순욱이 권한 말은 정확히는 이것이다 — "천자를 받들어 신하 되지 않는 자를 친다(奉天子以令不臣)." 흔히 쓰는 "협천자이령제후(挾天子以令諸侯)", 곧 천자를 끼고 제후를 부린다는 말은 정작 제갈량과 원소 쪽 사람들이 조조를 비난하며 쓴 표현이다. 같은 일을 두고 받든다 하고 낀다 하니, 명분 싸움이란 이런 것이다. 이날부터 조조의 모든 전쟁은 천자의 이름으로 치러진다.',9,'<b>출전</b> 『삼국지』 위서 무제기, 촉서 제갈량전(협천자 표현)<br><b>연의</b> 제14회<br><b>덧붙임</b> 이때 헌제의 조정은 상서랑 이하가 들나물을 캐 먹다 담장 밑에서 굶어 죽던 처지였다 — 허도가 준 첫 선물은 명분이 아니라 끼니였다. 원소 진영의 저수가 같은 계책을 먼저 냈다가 묵살된 것과 정확히 대비되는, 삼국지 최대의 선점(先占)이다.'],
 [200,0,'의대조 사건','거기장군 동승이 옷띠 속에 감춰진 황제의 밀조를 받았다 — 조조를 없애라. 그러나 모의는 새어 나갔고 동승의 삼족이 죽었다. 임신 중이던 동귀인마저 헌제가 눈물로 애원했지만 목이 매였다. 이 명단에 이름을 올렸던 유비는 마침 서주로 나가 있어 목숨을 건졌으니, 관도 결전 직전의 일이다. 황제의 밀조가 진짜였는지 동승의 연출이었는지는 지금도 학자들이 다투지만, 헌제가 조조의 궁궐에서 어떤 처지였는지는 이 사건 하나로 충분히 보인다.',1,'<b>출전</b> 『삼국지』 촉서 선주전, 『후한서』 헌제기<br><b>연의</b> 제20~21회(밀조), 제24회(발각과 처형)<br><b>덧붙임</b> 밀조가 실재했는지는 논쟁거리다 — 『후한서』는 "조서를 받았다 칭하고(稱受)"라고 적어 동승의 자작 가능성을 열어 둔다. 연의는 이 연판장에 마등까지 올려 훗날 마초 거병의 복선으로 삼았다 — 정사의 마등은 이 모의와 무관하다.'],
 [200,3,'길평의 독약','연의 제23회에서 태의 길평은 조조의 약사발에 독을 타다 들켜 손가락이 잘리며 죽는다. 통쾌한 장면이지만 실제와는 어긋난다. 원형은 18년 뒤인 218년 정월, 태의령 길본이 경기·위황과 함께 허도에서 일으킨 무장 반란이다. 독살 미수가 아니라 시가전이었다. 연의는 이 사건을 18년 앞당겨 의대조 사건에 이어 붙이고, 아버지 길본을 아들 길평으로 바꾸었다 — 이야기의 아귀를 맞추기 위해 시간을 접은 솜씨다.',0,'<b>출전</b> 창작 — 원형은 218년 길본의 난(『삼국지』 위서 무제기)<br><b>연의</b> 제23회<br><b>덧붙임</b> 연의는 이 대목에 명의(名醫)의 절개라는 주제를 심었다 — 손가락 아홉을 잃고도 조조를 꾸짖는 길평은, 소설 속에서 화타의 순직과 짝을 이루는 의인(醫人) 열전이다. 정사의 길본에게는 그런 서사가 없다.'],
 [208.42,0,'삼공 폐지와 승상 조조','형주 원정을 앞둔 조조가 조용히 제도 하나를 손봤다. 4백 년간 권력을 셋으로 나누던 태위·사도·사공의 삼공제를 폐지하고, 전한 초기의 승상 1인 체제로 되돌린 것 — 그리고 그 승상 자리에 자신이 앉았다. 칼 한 번 뽑지 않은 이 서류 작업으로 헌제의 조정은 형식만 남았다. 정복은 요란하지만 찬탈은 이렇게 조용히 진행된다.',6,'<b>출전</b> 『삼국지』 위서 무제기<br><b>연의</b> 다루지 않음 — 소설은 관직 개편에 무심하다<br><b>덧붙임</b> 같은 해 조조는 어사대부에 심복 극려를 앉혀 감찰권까지 정리했다. 승상 취임 넉 달 뒤 형주 남정이 시작되니, 이 개편은 남정의 행정적 선전포고였던 셈이다.'],
 [213.33,0,'위공(魏公)과 구석','조조가 기주 열 개 군을 봉토로 받아 위공(魏公)이 되고 구석(九錫)을 받았다. 구석이란 수레·옷·활 같은 아홉 가지 특전인데, 문제는 전례다 — 이걸 받고 황제가 되지 않은 사람이 왕망뿐이라는 농담이 있을 정도로, 구석은 찬탈의 예고장이었다. 과연 이후 조비·사마소·유유가 모두 같은 계단을 밟는다. 구석 받고, 왕 되고, 선양받고. 중국사 왕조 교체의 표준 절차가 이때 완성되었다.',5,'<b>출전</b> 『삼국지』 위서 무제기<br><b>연의</b> 제61회 — 순욱의 반대와 묶여 그려진다<br><b>덧붙임</b> 책봉 조서의 문안은 반고의 「전인」체를 본뜬 대문장으로, 훗날 선양 조서들의 모범 답안이 되었다. 위공국은 상서·시중 등 제 관청을 갖췄다 — 한 왕조 안에 완제품 정부가 하나 더 들어선 것이다.'],
 [214.83,0,'복황후 시해','헌제의 복황후가 아버지에게 보낸 편지가 발각되었다 — 조조를 도모해 달라는 내용이었다. 화흠이 병사를 이끌고 들이닥치자 황후는 벽 사이에 숨었고, 머리채를 잡혀 맨발로 끌려 나오며 헌제에게 울부짖었다. "살려 주실 수 없습니까." 황제의 대답이 처연하다. "나도 내 목숨이 언제까지일지 모르오." 황후는 유폐되어 죽고 두 황자는 짐독을 마셨으며, 이듬해 조조의 딸이 황후가 되었다. 후한의 마지막 자존심이 꺾인 날이다.',11,'<b>출전</b> 『후한서』 황후기, 『삼국지』 위서 무제기<br><b>연의</b> 제66회 후반<br><b>덧붙임</b> 문제의 편지는 14년 전 의대조 사건 직후에 쓰인 것 — 조조는 이를 알고도 묵혀 두었다가 위공 즉위 이듬해에 터뜨렸다. 처형 집행자 화흠은 뒷날 위나라의 삼공이 된다. 겨눈 시점이 곧 메시지였다.'],
 [216.33,0,'위왕(魏王) 즉위','조조가 마침내 위왕(魏王)에 올랐다. 천자의 깃발을 세우고 열두 줄 면류관을 쓰고 금근거를 탔으니 옥좌만 빼고 전부 황제다. 한 고조 유방이 백마를 잡아 맹세한 "유씨가 아니면 왕이 될 수 없다"는 4백 년 서약이 이날 깨졌다. 그런데 정작 조조는 끝까지 마지막 한 계단을 밟지 않았다. "천명이 내게 있다면, 나는 주 문왕이 되겠다" — 아들더러 하라는 말이다. 명분은 지키고 실리는 다 챙긴, 조조다운 마무리다.',5,'<b>출전</b> 『삼국지』 위서 무제기<br><b>연의</b> 제68회<br><b>덧붙임</b> 왕이 된 뒤에도 조조의 공식 직함은 한나라 승상 겸 위왕 — 두 나라의 정부 수반을 겸직한 형태였다. 이듬해 천자만 쓰는 열두 술 면류관과 금근거가 더해지며, 남은 것은 호칭 하나뿐이라는 것을 천하가 알았다.'],
 [218,0,'경기·길본의 허도 반란','관우가 북쪽에서 위세를 떨치기 시작하던 해 정월, 허도 한복판에서 불길이 치솟았다. 태의령 길본, 소부 경기, 사직 위황이 병사를 모아 승상장사 왕필의 진영을 급습한 것이다. 왕필은 어깨에 화살을 맞고 달아났다. 헌제를 빼내 관우와 호응하려던 계획으로 보이는데, 하루를 못 버티고 진압되어 관련자가 몰살당했다. 연의가 「길평의 독약」으로 바꿔 그린 사건의 실체가 바로 이 새벽의 시가전이다.',1,'<b>출전</b> 『삼국지』 위서 무제기 배송지 주 『삼보결록주』<br><b>연의</b> 제69회 — "다섯 신하의 절개(五臣死節)"로 각색<br><b>덧붙임</b> 반란군이 왕필의 진영을 태우며 외친 구호가 "조씨를 죽이고 유씨를 받들자"였다. 진압 후 조조는 허도의 백관을 업으로 불러 "불을 끄러 나온 자는 왼쪽, 나오지 않은 자는 오른쪽"에 세웠다 — 그리고 불을 끄러 나왔다는 왼쪽을 모두 죽였다. 구원을 나온 것이 아니라 반란에 가담하려 나왔으리라는 논리였다.'],
 [219.67,0,'위풍의 모반','조조가 한중에서 물러나고 관우가 번성을 두드리던 어수선한 가을, 이번엔 근거지 업에서 모반이 터졌다. 상국연 위풍 — 언변이 좋아 업의 명사들이 다투어 사귀던 인물이다. 거사 전에 발각되어 태자 조비의 손에 죽었는데, 연루되어 죽은 집안이 수십에 이르렀다. 김의도 위풍도 길본도 모두 조조 말년 3년 사이의 일이니, 한실의 마지막 불씨들이 꺼지기 직전에 가장 요란하게 튀었던 셈이다.',9,'<b>출전</b> 『삼국지』 위서 무제기·진사왕전 배송지 주 『세어』<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 위풍은 종요가 천거한 인물이라, 사건 후 종요가 상국에서 물러났다 — 재상이 연좌로 낙마한 것이다. 연루자 중에는 왕찬의 두 아들도 있어 처형되었으니, 건안칠자의 후사 하나가 이 사건으로 끊겼다.'],
 [220.75,0,'헌제 선양과 후한의 멸망','조비가 세 번 사양하는 각본을 다 치른 뒤 헌제의 선양을 받았다. 아홉 살에 동탁의 손에 옹립되어 31년 — 이각의 장안에서 굶고, 조조의 허도에서 갇혀 살던 황제는 마지막까지 의식의 절차를 지켜 주었다. 수선대에 오른 조비가 신하들에게 흘린 한마디를 배송지 주 『위씨춘추』가 놓치지 않았다. "순임금과 우임금의 선양이 어떤 것이었는지, 내 이제야 알겠다." 4백 년 한나라가 끝나는 순간의 실토였다.',10,'<b>출전</b> 『삼국지』 위서 문제기, 배송지 주 『위씨춘추』·『헌제전』<br><b>연의</b> 제80회<br><b>덧붙임</b> 『헌제전』에는 선양 반대 상소와 세 차례 사양의 왕복 문서가 통째로 실려 있다 — 각본임을 알면서도 전원이 배역을 완수한, 중국사 최초의 완전한 선양 의전이다. 산양공은 봉지에서 천자의 예악을 계속 쓸 수 있었다.'],
 [234,0,'산양공 헌제의 죽음','제위를 내준 헌제는 산양공에 봉해져 14년을 더 살았다. 산양 땅에서 의술을 익혀 백성을 돌보았다는 전승이 남아 있으니, 황제 노릇보다 의원 노릇이 나았는지도 모른다. 그가 죽은 234년은 공교롭게도 제갈량이 오장원에서 죽은 해다. 한나라를 되살리겠다던 승상과, 그 한나라의 마지막 황제가 같은 해에 눈을 감았다. 위 명제는 옛 황제를 한나라의 예로 장사 지내고 효헌황제라 시호했다.',0,'<b>출전</b> 『후한서』 헌제기<br><b>연의</b> 다루지 않음 — 소설의 헌제는 퇴위와 함께 퇴장한다<br><b>덧붙임</b> 산양 백성이 그를 기려 세운 사당이 훗날까지 남았고, 하내 지방에는 헌제 부부가 침과 뜸을 놓았다는 전승이 이어졌다. 시호 효헌(孝獻)의 헌은 "총명예지"의 뜻 — 위나라가 폐제에게 바친 마지막 예우였다.'],
]},
{name:'원소·원술과 하북', sub:'YUAN SHAO · YUAN SHU',
 spans:[[172,189,'여남 원씨 사세삼공'],[189,191,'발해태수'],[191,199,'기주 장악'],[199,202,'하북 4주'],[202,207,'원씨의 분열',1]],
 events:[
 [200.85,0,'저수와 순우경의 최후','패주하는 원소를 따라가지 못한 저수는 사로잡혀 조조 앞에 끌려왔다. "항복한 것이 아니라 잡힌 것이다. 어서 죽여라." 옛 친분이 있던 조조는 그를 죽이지 못하고 곁에 두었지만, 저수는 말을 훔쳐 원소에게 돌아가려다 발각되어 그제야 죽임을 당했다. 조조가 탄식했다. "내가 저수를 일찍 얻었다면 천하에 근심이 없었을 것이다." 한편 오소를 지키다 취해 잠들었던 순우경은 코를 베인 채 끌려와 죽었다고 배송지 주 『조만전』이 전한다 — 서원팔교위 시절 조조의 옛 동료였던 사내의 끝이다.',10,'<b>출전</b> 『삼국지』 위서 원소전(저수), 배송지 주 『조만전』(순우경)<br><b>연의</b> 제30회<br><b>덧붙임</b> 저수의 아들 저곡은 아버지가 죽은 뒤에도 원씨 진영에 남아 조조에 맞섰다 — 부자가 대를 이어 진 쪽에 섰다. 순우경은 한때 조조·원소와 나란히 서원팔교위였으니, 십이 년 전 동료 셋의 운명이 오소의 밤에 갈린 셈이다.'],
 [190,0,'관동 연합과 맹주 원소','동군태수 교모가 삼공의 이름을 빌린 가짜 격문을 사방에 돌리자, 관동의 태수와 자사들이 일제히 일어났다. 맹주는 4대에 걸쳐 삼공을 배출한 명문가의 귀공자, 발해태수 원소. 스스로 거기장군을 칭하며 기세는 하늘을 찔렀다. 그런데 막상 진군하는 사람이 없었다. 서쪽으로 칼을 뽑은 것은 조조 하나 — 나머지는 산조에 모여 날마다 잔치를 벌였다고 정사가 비웃듯 적는다. 반년도 못 가 연합은 흩어지고, 제후들은 서로의 땅을 노리기 시작했다.',0,'<b>출전</b> 『삼국지』 위서 무제기·원소전<br><b>연의</b> 제5회<br><b>덧붙임</b> 원소의 맹주 자격은 가문이었다 — 여남 원씨 4대에 삼공 다섯, 문생고리가 천하에 깔려 있었다. 낙양의 동탁은 보복으로 원소의 숙부 태부 원외 등 경성의 원씨 일족을 몰살했다 — 명문의 이름값에는 이자가 붙었다.'],
 [190,2,'십팔로 제후','연의 제5회는 열여덟 갈래 제후가 구름처럼 모였다고 노래한다. 숫자부터 부풀었다. 정사 무제기가 세는 실제 참가자는 원소·원술·한복·공주·유대·왕광·장막·교모·원유·포신에 조조까지 열한 갈래. 공손찬도 마등도 도겸도 공융도 오지 않았다. 유비 삼형제가 공손찬을 따라 참전했다는 대목도 물론 창작이다 — 그 없는 자리에 세 사람을 세워야 사수관과 호뢰관의 무대가 만들어지기 때문이다.',0,'<b>출전</b> 『삼국지』 위서 무제기(실제 명단)<br><b>연의</b> 제5회<br><b>덧붙임</b> 연의의 18로에는 공융·도겸·마등처럼 오지 않은 이들이 일곱이나 추가되어 있다 — 후반부 주역들을 미리 무대에 올리려는 배치다. 실제 연합군의 총병력은 10여만으로 추산되며, 동탁의 서량·병주군과 정면 대결을 끝내 피했다.'],
 [191,3,'사수관과 호뢰관','연의는 관문 두 개를 세운다. 사수관에서는 관우가 화웅을 베고, 호뢰관에서는 삼형제가 여포와 어우러진다. 그런데 지도를 펴 보면 낭패다 — 사수관과 호뢰관은 사실상 같은 관문의 다른 이름이다. 하나의 문을 둘로 쪼개 무대를 두 배로 늘린 셈이다. 정사에서 관문의 싸움은 단 한 갈래, 손견이 양인에서 화웅을 베고 밀어붙인 것뿐이다. 유비·관우·장비는 그 근처에 있지도 않았다.',0,'<b>출전</b> 창작 — 지리 원형은 낙양 동쪽의 관문 하나<br><b>연의</b> 제5회<br><b>덧붙임</b> 호뢰는 사수관의 다른 이름으로 당대 문헌에 함께 쓰였다. 삼영전여포(三英戰呂布) — 세 형제가 여포 하나와 싸우는 명장면은 원 잡극에서 먼저 만들어졌고, 연의가 무대만 호뢰관으로 옮겨 완성했다.'],
 [191.58,0,'한복에게서 기주를 빼앗다','하북 제일의 기주를 원소는 칼 한 번 뽑지 않고 얻었다. 먼저 공손찬을 슬쩍 부추겨 기주를 위협하게 하고, 겁에 질린 기주목 한복에게 사람을 보내 속삭인다 — 원소에게 맡기시면 안전하실 텐데요. 한복은 스스로 인수를 내주었다. 부하들이 통곡하며 말렸지만 소용없었다. 뒤에 한복은 원소의 그늘에서 벌벌 떨다 뒷간에서 목숨을 끊었으니, 난세에 겁이 많다는 것은 그 자체로 죄였다.',7,'<b>출전</b> 『삼국지』 위서 원소전<br><b>연의</b> 제7회<br><b>덧붙임</b> 한복은 본래 원씨 집안의 고리(故吏) — 은문의 자제에게 자리를 내준 셈이었다. 그의 부하 저수·전풍·심배·국의가 고스란히 원소에게 넘어갔으니, 기주 접수는 영토보다 인재 인수합병에 가까웠다.'],
 [191.83,0,'저수의 하북 통일 계책','기주를 얻은 원소에게 저수가 청사진을 펼쳤다. "하북 4주를 아우르고 영웅들을 거두신 뒤, 천자를 맞아들여 종묘를 다시 세우십시오. 그리 되면 천하에 맞설 자가 없습니다." 원소는 크게 기뻐했다 — 조조의 봉천자보다 5년 빠른 구상이었다. 그런데 정작 실행할 때가 되자 곽도와 순우경이 초를 쳤다. "천자를 곁에 두면 일마다 아뢰어야 하니 권위만 가벼워집니다." 원소는 이번엔 이 말을 들었다. 참모는 좋았으나 고르는 귀가 나빴다.',0,'<b>출전</b> 『삼국지』 위서 원소전 배송지 주 『헌제전』<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 저수는 이 공으로 감군(監軍)이 되어 원소군 전체를 총괄했다 — 관도 직전 곽도의 참소로 병권이 셋으로 쪼개지기 전까지. 원소 진영의 몰락은 저수의 직함이 깎여 가는 궤적과 정확히 겹친다.'],
 [191,0,'유우와 유주의 다른 길','같은 난세에 전혀 다른 길을 간 사람도 있다. 유주목 유우는 오환과 선비를 다독이고 창고를 열어 유민 100만을 거두었다. 원소가 그를 황제로 세우려 하자 정색하고 거절했다 — 천자가 서쪽에 계신데 무슨 소리냐는 것이다. 무력이 아니라 통치로 난세를 견디려 한 마지막 시도였다. 그러나 193년 공손찬이 그를 잡아 죽이면서 이 길은 닫혔다. 이후 하북에 남은 선택지는 칼뿐이었다.',0,'<b>출전</b> 『후한서』 유우전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 유우는 검소해 기운 옷을 입는 삼공급 종실이었다. 그가 죽자 유주의 민심이 들끓었고, 옛 부하 선우보가 오환·선비를 모아 복수전을 일으켰다 — 공손찬 몰락의 시작이 유우의 피였다.'],
 [192,0,'계교 전투','백마의종 — 흰 말만 골라 탄 공손찬의 정예 기병은 북방의 공포였다. 그 돌격을 국의가 강노 천 장으로 받았다. 방패 뒤에 엎드려 기다리다 수십 보 거리에서 일제 사격, 기병대가 무너졌다. 이날 원소 본인도 수십 기만 남긴 채 포위당했는데, 투구를 땅에 내던지며 외쳤다고 배송지 주 『영웅기』가 전한다. "대장부는 나아가 싸우다 죽는 것이다. 담장 뒤에 숨어 살아나겠는가." 하북의 패권이 이 한 판으로 기울었다.',0,'<b>출전</b> 『삼국지』 위서 원소전 배송지 주 『영웅기』<br><b>연의</b> 제7회<br><b>덧붙임</b> 국의는 양주(涼州)에서 강족과 싸우며 잔뼈가 굵은 대(對)기병전 전문가였다 — 백마의종의 천적이 하필 원소 진영에 있었던 것이다. 그러나 공을 믿고 교만해져 뒷날 원소에게 숙청된다. 원소는 칼도 재능도 오래 두고 쓰지 못했다.'],
 [193,0,'원소와 원술의 갈라섬','형제가 갈라서자 천하가 두 쪽 났다. 원소는 조조·유표와, 원술은 공손찬·도겸과 손잡으니 지도 위에 두 개의 동맹 벨트가 그어졌다. 원술은 서출인 형을 두고 "우리 집 종년의 자식"이라 떠들었고, 원소도 아우를 사람으로 치지 않았다. 4대에 걸쳐 삼공 다섯을 낸 여남 원씨 — 명문의 이름값과 인맥과 병력이 서로를 겨누는 데 몽땅 소모되었다. 조조에게 이보다 고마운 일은 없었다.',0,'<b>출전</b> 『삼국지』 위서 원술전·원소전<br><b>연의</b> 곳곳에 흩어져 있다<br><b>덧붙임</b> 원소는 서출이나 큰집에 양자로 들어가 적통 명분을 얻었다 — 원술의 "종놈" 욕설은 그 콤플렉스의 표출이다. 형제의 대리전으로 손견(원술 측)과 주앙(원소 측)이 싸웠으니, 강동의 손씨가 처음 중원 정치에 말려든 것도 이 형제 싸움에서였다.'],
 [196,0,'헌제 영접을 놓치다','헌제가 낙양 폐허에서 굶고 있을 때 저수가 다시 간청했다. "지금 천자를 업으로 모시면 대의가 우리 것입니다." 곽도와 순우경이 또 반대했고, 원소는 또 그쪽을 들었다. 몇 달 뒤 조조가 천자를 허도로 모셔 가자 그제야 배가 아팠다 — "허도는 낮고 습하니 견성으로 옮기시지요"라고 뒤늦게 청했다가 거절당하는 장면은 딱할 지경이다. 이후 원소는 조조가 천자의 이름으로 내리는 관직을 받는 처지가 된다. 명분의 값은 잃고 나서야 보인다.',0,'<b>출전</b> 『삼국지』 위서 원소전 배송지 주 『헌제전』<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 반대 논리는 "한실은 이미 글렀는데 왜 시체를 업느냐"였다 — 곽도 등은 원소가 스스로 새 왕조를 열기를 바란 것이다. 그러나 명분 없는 실력은 관도에서 명분 있는 실력에게 졌다. 저수의 예언대로 "먼저 잡는 자가 임자"였다.'],
 [197,0,'원술의 칭제','손견이 우물에서 건진 전국옥새가 원술의 손에 들어왔다. 옥새를 품자 마음이 부풀었다. 197년 수춘에서 황제를 칭하고 국호를 중씨(仲氏)라 하니 — 천하가 아직 한나라인데 혼자 다음 왕조를 개업한 것이다. 여포가 등을 돌리고 손책이 절연하고 조조가 쳐들어왔다. 후궁 수백은 비단을 끌고 창고의 곡식은 썩어 가는데 백성은 서로를 잡아먹었다고 정사가 적는다. 명분 없는 옥새는 돌덩이만도 못했다.',0,'<b>출전</b> 『삼국지』 위서 원술전<br><b>연의</b> 제17회<br><b>덧붙임</b> 칭제의 이론 근거는 참문 "한을 대신할 자는 도고(代漢者當塗高)" — 원술은 제 자(字) 공로(公路)의 로(路)를 도(塗)에 억지로 꿰맞췄다. 국호 중씨(仲氏)의 중은 둘째라는 뜻 — 한나라 다음 차례라는 자기 선언이었다는 해석이 있다.'],
 [199,0,'역경 함락과 공손찬의 자멸','백마를 몰아 북방을 호령하던 공손찬의 말년은 이상했다. 역경에 열 겹 참호를 두르고 높은 누각을 쌓더니 그 안에 들어앉았다 — 곁에 남자는 못 오게 하고 문서는 밧줄로 끌어올렸다. 스스로 만든 감옥이었다. 원소가 땅굴을 파 누각을 하나씩 무너뜨리자 공손찬은 처자를 죽이고 스스로 불을 놓았다. 이로써 원소는 청·유·병·기 4주의 주인 — 종이 위 국력으로는 당대 최강이 되었다. 관도까지 남은 시간은 1년이다.',3,'<b>출전</b> 『삼국지』 위서 공손찬전, 『후한서』 공손찬전<br><b>연의</b> 제21회에 전언으로 처리<br><b>덧붙임</b> 공손찬은 "천하의 일은 내가 정할 수 있는 게 아니다 — 곡식 3백만 곡을 쌓고 때를 기다리겠다"며 농성 철학까지 밝혔다. 유비의 첫 후원자이자 조운의 첫 주군이었던 사내는, 그렇게 제 창고 안에서 끝났다.'],
 [199.42,0,'원술의 죽음','회남 땅을 거덜 낸 황제 참칭자의 마지막은 초라했다. 텅 빈 수춘을 버리고 형 원소에게 옥새라도 바치며 얹혀살려고 북상하다, 유비의 군사에게 길이 막혀 되돌아섰다. 유월 더위 속 강정이라는 곳에서 꿀물 한 잔을 찾았지만 부엌에는 보리 찌꺼기뿐. "원술이, 이 지경에 이르렀단 말이냐." 침상에 엎드려 피를 한 말 넘게 토하고 죽었다. 연의도 이 장면만은 손대지 않고 정사를 그대로 옮겼다 — 더 보탤 것이 없었기 때문이다.',6,'<b>출전</b> 『삼국지』 위서 원술전 배송지 주 『오서』(꿀물 일화)<br><b>연의</b> 제21회<br><b>덧붙임</b> 남은 일족은 여강으로 피했다가 손책에게 거두어졌다 — 딸은 손권의 후궁이 되고, 옥새는 서구(徐璆)의 손을 거쳐 허도의 헌제에게 돌아갔다. 황제를 꿈꾼 자의 유산이 세 나라로 나뉘어 흡수된 셈이다.'],
 [200,0,'전풍·저수의 지구전 계책','결전을 앞두고 전풍이 마지막으로 매달렸다. "험지를 지키고 농사로 힘을 기르며, 기병(奇兵)으로 번갈아 변경을 찔러 조조를 쉬지 못하게 하십시오. 3년이면 앉아서 이깁니다." 저수도 거들었다. 실제로 조조의 군량은 관도에서 한 달을 버티기 어려운 지경이었으니, 시간은 완벽하게 원소 편이었다. 원소의 대답은 전풍을 옥에 가두는 것이었다 — 군심을 어지럽힌다는 죄목으로. 이길 방법을 말한 죄로 갇힌 셈이다.',0,'<b>출전</b> 『삼국지』 위서 원소전<br><b>연의</b> 제30회 언저리에 압축<br><b>덧붙임</b> 조조 진영의 순욱도 같은 계산을 했다 — "원소가 지구전으로 나오면 위태롭다"고. 적의 참모가 두려워한 전략을 정작 주군이 버린 것이다. 원소가 택한 속전 논리는 "10배의 병력으로 못 이길 리 없다"는 곽도·심배의 산수였다.'],
 [200.17,1,'진림의 격문','출정에 앞서 원소는 문장가 진림에게 격문을 짓게 했다. 붓을 든 진림은 인정사정없었다 — 조조의 할아버지는 환관, 아버지는 그 환관의 양자, 조조 자신은 "환관이 남긴 추물(贅閹遺醜)". 3대를 싸잡아 욕보인 것이다. 마침 두풍을 앓아 누워 있던 조조가 이 글을 읽고 모골이 송연해져 벌떡 일어났는데 두통이 나았더라고 배송지 주 『전략』이 전한다. 훗날 진림을 사로잡은 조조의 첫마디 — "격문이면 죄상만 적으면 될 것을, 어찌 아비와 할아비까지 올렸는가." 그러고는 살려서 곁에 두고 글을 쓰게 했다.',0,'<b>출전</b> 『삼국지』 위서 원소전·왕찬전(진림 부전), 배송지 주 『전략』<br><b>연의</b> 제22회<br><b>덧붙임</b> 격문의 전문이 『문선(文選)』에 실려 지금도 읽을 수 있다 — 격문 문학의 최고봉으로 꼽힌다. 조조의 사면 논리는 실용적이었다. "죄는 그 몸에 그칠 뿐(罪止其身)" — 붓을 벌하면 붓을 잃는다는 계산이다.'],
 [200.83,0,'오소와 관도의 붕괴','대치 백 일, 승패를 가른 것은 창칼이 아니라 곡식이었다. 참모 허유가 조조 진영으로 투항해 군량 기지 오소의 위치를 일러바쳤고, 조조는 그날 밤 원소군 깃발로 위장한 5천을 몸소 이끌고 어둠을 갔다. 오소가 불타자 원소는 갈림길에서 또 오판했다 — 구원 대신 조조의 본진을 치게 한 것이다. 본진은 뚫리지 않았고 곡식은 재가 되었다. 장합과 고람이 항복하며 10만 대군이 하루아침에 녹아내렸고, 원소는 맏아들과 8백 기만 데리고 황하를 건넜다. 정사는 항복병 7만여를 조조가 산 채로 묻었다고 적는다.',10,'<b>출전</b> 『삼국지』 위서 무제기·원소전<br><b>연의</b> 제30회<br><b>덧붙임</b> 허유의 투항 사유는 업에 남은 가족이 심배에게 체포된 데 대한 원한이었다 — 후방의 옥사 하나가 전선의 승패를 갈랐다. 항복병 갱살 기사는 무제기 배송지 주에 "속임수 항복 우려" 때문이었다는 설명이 붙어 있으나, 7만이라는 숫자는 조조 최대의 오점으로 남았다.'],
 [200.95,0,'전풍의 죽음','관도의 패보가 전해지자 옥중의 전풍에게 사람들이 축하했다. "그대 말이 옳았으니 이제 중용되실 것이오." 전풍은 고개를 저었다. "주공은 겉은 너그러우나 속은 시기가 많은 분이다. 이겼다면 기분 좋게 나를 풀어 주었겠지만, 졌으니 부끄러워서라도 나를 살려 두지 않을 것이다." 과연 원소는 돌아오며 말했다. "전풍의 말을 듣지 않아 끝내 웃음거리가 되었구나." 그러고는 그를 죽였다. 자기 예언의 적중을 목숨으로 확인한 참모 — 원소라는 인물평은 이 일화 하나로 끝난다.',0,'<b>출전</b> 『삼국지』 위서 원소전 배송지 주 『선현행장』<br><b>연의</b> 제31회<br><b>덧붙임</b> 조조가 유비를 치러 허도를 비우자 "지금이 기회"라며 지팡이로 땅을 치던 사람이(원소는 아들의 병을 핑계로 거절했다), 정작 관도 출정은 죽기로 말리다 족쇄를 찼다. 조조는 전풍이 종군하지 않은 것을 알고 "원소는 졌다"고 단언했다는 기록도 있다.'],
 [202.33,0,'원소의 죽음과 후계 분쟁','관도에서 돌아온 원소는 화병으로 피를 토하다 2년 만에 죽었다. 통치는 관대했던지 하북 백성이 저자에서 통곡했다고 『후한서』가 적는다. 문제는 그가 남긴 침묵이었다 — 후계자를 정하지 않고 눈을 감은 것이다. 심배와 봉기는 막내 원상을, 신평과 곽도는 맏이 원담을 밀며 하북이 두 쪽 났다. 아버지의 유산을 두고 형제가 칼을 뽑았을 때, 남쪽에서 조조가 이 광경을 흐뭇하게 지켜보고 있었다.',5,'<b>출전</b> 『삼국지』 위서 원소전, 『후한서』 원소전(민심 기사)<br><b>연의</b> 제31~32회<br><b>덧붙임</b> 막내 상속은 후처 유씨의 입김이었다 — 유씨는 원소가 죽자 총애받던 첩 다섯의 얼굴을 훼손해 죽였고, 원상이 그 가족까지 몰살했다고 『전론』이 전한다. 안방의 잔혹극이 왕국의 유언장을 대신 쓴 것이다.'],
 [204.58,0,'업성 함락과 심배','조조가 장하의 물길을 돌려 업성을 물에 담갔다. 반년의 수공 끝에 성이 열렸을 때, 끝까지 남은 것은 심배였다. 조카가 성문을 열어 준 것을 안 심배는 이를 갈았고, 사로잡혀서도 꺾이지 않았다. 처형장에서 그가 남긴 마지막 청은 하나 — "우리 주군의 무덤이 북쪽에 있다. 북쪽을 향해 죽게 해 달라." 그리고 북면하고 앉아 목을 받았다. 조조는 업을 제 근거지로 삼았고, 이 도시는 그대로 위나라의 실질적 수도가 된다.',8,'<b>출전</b> 『삼국지』 위서 원소전 배송지 주 『선현행장』<br><b>연의</b> 제32회<br><b>덧붙임</b> 심배는 원담 편에 선 신평·신비 형제의 가족 80여 명을 가두었다 성이 무너지자 몰살했고, 성문은 조카 심영의 손으로 열렸다 — 사로잡힌 심배의 머리를 신비가 말채찍으로 내리치며 통곡했다. 옥사와 원한이 성벽보다 먼저 무너져 있었다.'],
 [205,0,'원담의 최후','아우와 싸우다 급해지자 조조에게 붙고, 조조가 아우를 치는 사이 다시 등을 돌리고 — 원담의 처세는 곡예에 가까웠다. 곡예는 남피에서 끝났다. 205년 정월 성이 깨지고 원담은 달아나다 베였다. 원상과 원희는 북쪽 오환의 천막으로 달아났다. 관도에서 5년, 4개 주를 호령하며 천하에 가장 가까웠던 원씨 집안이 하북 지도에서 지워지는 데 걸린 시간이다.',1,'<b>출전</b> 『삼국지』 위서 원소전<br><b>연의</b> 제33회<br><b>덧붙임</b> 조조는 한때 원담과 사돈까지 맺으며 달랬다 — 아들 조정과 원담의 딸을 약혼시켰다가 개전 직전 파혼했다. 원담의 목은 저자에 걸렸고 "곡하는 자는 처자까지 벤다"는 방이 붙었는데, 옛 부하 왕수가 곡을 청하자 조조가 의(義)를 사서 허락했다.'],
 [207.67,0,'백랑산과 원씨의 종말','조조는 도망친 원씨 형제를 끝까지 쫓았다. 폭우로 해안길이 끊기자 노룡새의 옛길을 뚫고 5백 리 — 백랑산에서 오환의 왕 답돈을 베고 호(胡)와 한(漢) 20여만의 항복을 받았다. 형제는 다시 요동의 공손강에게 달아났다. 부하들이 추격을 청하자 조조가 웃었다. "기다려라. 공손강이 알아서 목을 보내올 것이다." 과연 상자 두 개가 도착했다. 핍박하면 뭉치고 늦추면 서로 다투는 법 — 곽가가 남기고 간 계산 그대로였다.',8,'<b>출전</b> 『삼국지』 위서 무제기·원소전, 곽가전<br><b>연의</b> 제33회<br><b>덧붙임</b> 향도는 이 지역 출신 전주(田疇) — 2백 년 전 폐도의 지도를 그가 폈다. 회군 후 조조는 출정을 말렸던 신하들에게 상을 주며 말했다. "이번 승리는 요행이었다. 그대들의 간언이 만전지책이었으니 앞으로도 말하기를 꺼리지 말라." 이긴 도박 뒤에 한 말이라 더 유명해졌다.'],
]},
{name:'여포·유표와 군웅', sub:'LÜ BU · LIU BIAO · WARLORDS',
 spans:[[172,190,'주와 군의 시대'],[190,200,'군웅의 각축'],[200,208,'조조에게 흡수'],[208,281,'남은 변수',1]],
 events:[
 [193.5,0,'유민이 그린 문화 지도','전쟁은 사람을 옮기고, 사람은 문화를 지고 간다. 관중의 난을 피해 형주와 익주로, 청주·서주의 난을 피해 강동과 요동으로 — 수십만의 발걸음이 후한의 문화 지도를 다시 그렸다. 유표의 형주에 학자들이, 공손도의 요동에 관녕 같은 명사들이, 손씨의 강동에 북방의 인재들이 모여든 것은 우연이 아니다. 제갈량도 방통도 서서도 따지고 보면 형주로 흘러든 피난민이었다. 삼국의 두뇌들은 전란이 배달해 준 셈이다.',0,'<b>출전</b> 『삼국지』 위서 왕찬전 등 각 전 종합<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 형주로 간 왕찬은 유표에게 외모 때문에 홀대받았다 — 뒷날 조조에게 귀부해 건안칠자의 으뜸이 된다. 요동의 관녕은 37년을 살다 위나라의 삼공 제안을 평생 사양했다 — 피난지에서 그대로 은자가 된 것이다. 난세의 이주는 인생의 항로 자체를 바꿨다.'],
 [189.67,0,'여포, 정원을 죽이다','동탁이 낙양에 들어와 보니 걸리는 자가 하나 있었다 — 집금오 정원, 그리고 그 곁의 맹장 여포. 동탁은 칼 대신 재물을 보냈다. 여포는 주인 정원의 목을 베어 들고 건너왔고, 병주의 병력이 통째로 딸려 왔다. 정사 여포전은 동탁이 그를 아껴 "부자의 의를 맺었다"고만 적는다. 양아버지를 두 번 죽인 패륜아라는 상, 장비가 내뱉는 "세 성을 가진 종놈(三姓家奴)"이라는 욕은 모두 연의가 나중에 벼린 칼이다.',9,'<b>출전</b> 『삼국지』 위서 여포전<br><b>연의</b> 제3회 — 적토마와 금은보화가 매수 도구로 등장<br><b>덧붙임</b> 여포는 활쏘기와 말타기가 남달라 비장(飛將)이라 불렸다 — 흉노를 떨게 한 한나라 이광의 별명을 물려받은 것이다. 병주군의 지휘권이 통째로 넘어간 이 배신은, 동탁이 낙양에서 최강의 무력을 굳히는 결정타였다.'],
 [190,4,'적토마의 계보','정사 여포전에 적토마는 딱 한 줄 나온다. "여포에게 적토라는 좋은 말이 있어 성을 뛰어넘고 해자를 건넜다." 그게 전부다. 동탁이 여포를 꾀며 선물했다는 이야기도, 여포가 죽은 뒤 조조가 관우에게 주었다는 이야기도, 관우가 죽자 말이 굶어 죽었다는 이야기도 없다. 연의는 이 한 줄의 명마에게 주인 셋을 잇는 일대기를 지어 주었다 — 배신의 상징(여포)에서 의리의 상징(관우)으로, 말 한 마리가 소설의 주제를 실어 나른다.',0,'<b>출전</b> 『삼국지』 위서 여포전 한 줄<br><b>연의</b> 제3회(동탁의 선물), 제25~26회(관우에게)<br><b>덧붙임</b> "사람 중에 여포, 말 중에 적토(人中有呂布 馬中有赤兔)"라는 당대의 속언이 배송지 주 『조만전』에 실려 있다 — 명마의 명성 자체는 진짜였던 셈이다. 하루 천 리를 달린다는 스펙과 30년 넘는 활동 기간은 소설이 붙인 옵션이다.'],
 [192.5,0,'장안 탈출과 유랑','이각의 군대가 장안을 덮치자 여포는 수백 기로 무관을 빠져나왔다. 그때부터 떠돌이 생활이다. 원술을 찾아가니 거만하다고 내치고, 원소 밑에서 흑산적을 깨뜨렸더니 병력을 더 달라는 그를 원소가 부담스러워했다. 밤길에 자객이 들이닥칠 낌새를 채고 미리 달아난 것이 원소 진영에서의 마지막이다. 천하제일의 무용을 지니고도 몸 붙일 곳 하나 없는 사내 — 여포의 비극은 힘이 아니라 신용의 문제였다.',0,'<b>출전</b> 『삼국지』 위서 여포전<br><b>연의</b> 제10~11회<br><b>덧붙임</b> 원소 밑에서 여포의 병사들이 약탈을 일삼자 원소가 암살대를 붙였다 — 여포는 장막 안에 거문고 타는 사람을 남겨 두고 미리 빠져나가 목숨을 건졌다. 소리로 알리바이를 만든 이 탈출극은 정사에 실린 그대로다.'],
 [194.33,0,'연주 탈취','조조가 아버지의 원수를 갚겠다며 서주를 도륙하는 사이, 등 뒤에서 문이 잠겼다. 죽마고우 장막과 모사 진궁이 여포를 끌어들여 연주를 통째로 들어 바친 것이다. 하룻밤 새 근거지를 잃은 조조에게 남은 것은 순욱과 정욱이 죽기로 지킨 견성·범·동아 세 성뿐. 이 최악의 해에 기근까지 겹쳐 양쪽 군대가 다 사람을 잡아먹었다고 정사는 적는다. 조조 일생에서 가장 밑바닥 — 원소에게 의탁할까 진지하게 고민한 것도 이때다.',0,'<b>출전</b> 『삼국지』 위서 무제기·여포전<br><b>연의</b> 제11회<br><b>덧붙임</b> 주모자 진궁은 본래 조조를 연주에 앉힌 일등공신이었다 — 서주 도륙과 명사 변양 처형에 등을 돌렸다는 해석이 유력하다. 복양 전투에서 조조는 화염 속을 뚫다 왼손바닥에 화상을 입고 낙마할 뻔했다 — 일생 몇 안 되는 육탄 위기였다.'],
 [195.83,0,'연주 상실과 서주 입성','1년 넘게 밀고 밀리다 거야와 정도에서 조조에게 연거푸 깨진 여포는 연주를 포기하고 동쪽으로 달아났다. 받아 준 사람은 서주의 새 주인 유비. 그런데 이듬해 유비가 원술과 싸우러 나간 사이, 여포는 빈집이 된 하비를 습격해 유비의 처자까지 사로잡았다. 얹혀살던 손님이 안방을 차지한 것이다. 돌아온 유비는 오히려 여포에게 고개를 숙이고 소패에 머물렀다 — 난세의 은혜와 배신은 이렇게 자리를 바꿔 가며 돌았다.',0,'<b>출전</b> 『삼국지』 위서 여포전, 촉서 선주전<br><b>연의</b> 제12~14회<br><b>덧붙임</b> 하비 탈취의 내응자는 유비 휘하의 하비상 조표 — 장비와 다툰 끝에 여포를 불러들였다. 연의는 이를 장비의 술주정 탓으로 각색했다(제14회). 유비가 여포를 "받아 준" 것이 1년 만에 정확히 뒤집힌 것이다.'],
 [196.42,0,'원문사극','원술의 대장 기령이 3만으로 유비를 치러 오자, 여포가 양쪽을 술자리에 불렀다. 그러고는 진문 밖 150보에 극(戟)을 세우게 했다. "내가 저 극의 곁가지를 쏘아 맞히면 하늘이 싸움을 말리는 것이니 돌아들 가시오." 화살은 정확히 곁가지를 맞혔고, 기령은 3만 군사를 돌렸다. 지어낸 이야기 같지만 정사 여포전 본문에 대사까지 그대로 실린 실화다 — 여포라는 사내가 어떤 존재였는지, 활 한 발이 3만 군사와 맞먹던 순간이다.',0,'<b>출전</b> 『삼국지』 위서 여포전 본문<br><b>연의</b> 제16회<br><b>덧붙임</b> 여포가 밝힌 중재의 속내가 정사에 함께 실려 있다 — "유비가 무너지면 원술이 북으로 태산의 제장들과 이어진다. 그러면 내가 포위된다." 의협이 아니라 지정학이었다. 극의 곁가지는 소지(小支) — 초승달 모양의 보조 날이니, 과녁의 폭이 손가락 몇 개 너비였던 셈이다.'],
 [198.92,0,'하비 함락과 여포의 죽음','조조와 유비의 연합군이 하비를 에워싸고 사수와 기수의 물을 성으로 돌렸다. 석 달을 버티던 부하들이 진궁을 묶어 성문을 열었다. 백문루에 끌려온 여포가 조조에게 흥정을 걸었다. "공이 보병을 맡고 내가 기병을 맡으면 천하는 금방 평정되오." 조조가 솔깃해 머뭇거리는 찰나, 곁의 유비가 조용히 한마디를 놓았다. "정원과 동탁의 일을 잊으셨습니까." 여포가 유비를 노려보며 외쳤다. "저 귀 큰 놈이 가장 믿을 수 없는 놈이다!" 목이 매인 뒤 효수 — 대사 하나까지 정사 그대로다.',12,'<b>출전</b> 『삼국지』 위서 여포전<br><b>연의</b> 제19회<br><b>덧붙임</b> 농성 말기 여포는 부하들을 의심해 술을 금했는데, 정작 자신이 그 금주령의 첫 희생자가 되었다 — 후성이 빚은 술을 벌하려다 후성·송헌·위속의 결박 쿠데타를 부른 것이다. 진등 부자가 안에서 조조와 내통한 것까지, 마지막까지 사람에게 발목 잡힌 일생이었다.'],
 [198.92,1,'진궁의 최후','함께 끌려온 진궁에게 조조가 물었다. 한때 나를 버리고 여포를 택한 그대가 이제 어찌 되었는가. 진궁은 담담했다. "여포가 내 말을 다 듣지 않아 이리 되었을 뿐이오." 그럼 그대의 노모와 처자는 어찌하겠는가. "효로 천하를 다스리려는 이는 남의 어버이를 해치지 않는다 들었소. 죽고 사는 것은 공의 손에 있소." 그러고는 형장으로 먼저 걸어 나갔다. 조조는 눈물을 흘리며 배웅했고, 그 노모를 봉양하고 딸을 시집보냈다. 배송지 주 『전략』이 전하는, 삼국지에서 가장 품위 있는 결별이다.',12,'<b>출전</b> 『삼국지』 위서 여포전 배송지 주 『전략』<br><b>연의</b> 제19회 — 거의 그대로 옮겼다<br><b>덧붙임</b> 연의는 여기에 제4회의 창작 하나를 얹어 인연을 완성했다 — 중모현에서 진궁이 현령으로서 조조를 살려 주고 함께 도망쳤다는 설정이다. 그 은인을 처형하는 구도를 만들기 위한 복선이었지만, 정사의 진궁은 중모현령이었던 적이 없다.'],
 [190.4,0,'유표의 형주 단기 부임','형주자사 왕예가 손견에게 죽자 조정이 유표를 후임으로 보냈다. 그런데 길이 막혀 부임 행렬은커녕 혼자 말 한 필로 몰래 의성에 들어갔다 — 단기 부임이라는 말이 그래서 나왔다. 유표는 현지 호족 괴량·괴월·채모와 손잡고 종적(宗賊) 우두머리 55명을 잔치에 불러 한자리에서 목을 베었다. 초대장으로 평정한 형주 — 이후 20년, 사방 수천 리에 갑병 10여만을 거느리고 중원의 난을 피한 학자들을 거두니 형주는 난세의 도서관이 된다.',0,'<b>출전</b> 『삼국지』 위서 유표전, 『후한서』 유표전<br><b>연의</b> 제6회 전후에 간략히<br><b>덧붙임</b> 유표는 젊어서 당고의 금에 걸렸던 청류 명사 팔준(八俊)의 한 사람 — 도망자 명단에 오르던 인물이 쉰을 앞두고 지방 대군벌이 된 것이다. 형주의 학교와 학자 지원은 그 청류 시절의 연장이었다.'],
 [200,0,'유표의 관망','관도 결전의 해, 형주의 유표는 천하에서 가장 부러운 패를 쥐고 있었다. 갑병 10여만에 온전한 곡창 — 어느 쪽에 가담하든 저울이 기울 판이었다. 원소가 손을 내밀자 응하는 척, 조조 쪽에도 등지지 않는 척. 부하 한숭과 유선이 답답해 간했다. "천하가 둘로 갈렸는데 공은 10만을 끼고 구경만 하십니까." 유표는 끝내 움직이지 않았다. 제 땅을 지키는 데는 성공한 선택, 천하를 다투는 자격은 반납한 선택 — 역사는 이런 인물에게 좌석을 오래 내주지 않는다.',0,'<b>출전</b> 『삼국지』 위서 유표전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 유표가 아주 안 움직인 것은 아니다 — 장수를 앞세워 조조의 남쪽을 갉았고, 교주까지 손을 뻗었으며, 천자의 교사(郊祀) 의례를 몰래 행했다. 야심이 없던 것이 아니라 사정거리 밖의 야심이었다는 것이 정사의 냉정한 평가다.'],
 [208.5,0,'유표의 죽음과 유종의 항복','조조의 남정군이 내려온다는 소식 속에 유표가 등창으로 죽었다. 후계는 채모와 괴월이 민 어린 유종 — 그리고 이 소년은 항복 문서부터 썼다. 신야의 유비에게는 알리지도 않아서, 유비는 조조가 완성에 이르렀을 때에야 알고 기겁해 달아났다. 조조가 싸움 없이 얻은 것은 형주 땅만이 아니었다. 훈련된 수군 수만과 몽충·투함 전선들 — 넉 달 뒤 적벽에서 불탈 바로 그 배들이다. 유종은 청주자사로 옮겨졌고, 연의가 그린 모자 살해는 사료에 없다.',8,'<b>출전</b> 『삼국지』 위서 유표전·무제기<br><b>연의</b> 제40~41회<br><b>덧붙임</b> 항복을 설계한 괴월에게 조조가 보낸 편지가 남아 있다 — "형주를 얻어 기쁜 것이 아니라 이도(異度, 괴월)를 얻어 기쁘다." 채모는 조조의 젊은 시절 친구였다 — 형주의 문은 칼이 아니라 인맥으로 열렸다.'],
 [193,0,'도겸과 서주','연의의 도겸은 서주를 세 번 사양하는 어질고 순한 노인이다. 정사의 평은 딴판이다 — "곧고 어진 이를 멀리하고 아첨하는 자를 가까이해 형정이 어지러웠다." 하필 그 관할에서 조조의 아버지 조숭이 재물을 노린 자들에게 살해되면서 서주는 두 차례 도륙의 참화를 뒤집어썼다. 도겸은 병들어 죽으며 별가 미축에게 말했다. "유비가 아니면 이 고을을 안정시킬 수 없다." 이 유언 한 줄이 평생 떠돌던 유비에게 첫 근거지를 쥐여 준다.',0,'<b>출전</b> 『삼국지』 위서 도겸전, 『후한서』 도겸전<br><b>연의</b> 제10~12회 — 삼양서주(三讓徐州)의 어진 노인으로<br><b>덧붙임</b> 조숭 살해의 범인도 사료가 갈린다 — 무제기는 도겸의 소행으로 서술하고, 『세어』는 도겸이 몰래 보낸 기병으로, 『오서』는 호송 도위 장개의 재물 강도로 적는다. 연의는 도겸을 살리기 위해 장개 단독 범행설을 골랐다 — 소설의 사료 선택은 언제나 인물 설계를 따른다.'],
 [196,0,'장수와 가후','완성의 장수는 작은 군벌이었지만 곁에 가후가 있어 이야기가 커졌다. 가후의 지휘로 조조를 두 번이나 크게 꺾은 것이다. 관도 직전, 원소의 사자가 동맹을 청하러 오자 가후가 그 자리에서 퇴짜를 놓고 주군을 설득했다. "조조는 약하니 우리를 반기고, 천자를 끼고 있으니 명분이 있으며, 패왕의 뜻이 있으니 사사로운 원한을 접을 것입니다." 아들을 죽인 원수에게 항복하라는 말인데, 조조는 과연 장수의 손을 잡고 사돈까지 맺었다. 사람 보는 눈이 이 정도면 요술이다.',0,'<b>출전</b> 『삼국지』 위서 장수전·가후전<br><b>연의</b> 제16~18회<br><b>덧붙임</b> 항복한 장수는 관도에서 힘껏 싸워 파강장군이 되었고 조조와 사돈까지 맺었다 — 아들 조균이 장수의 딸을 아내로 맞았다. 다만 『위략』은 뒷맛을 전한다. 조앙의 형제 조비가 뒷날 "내 형을 죽인 자가 무슨 낯으로"라고 쏘아붙이자 장수가 불안 끝에 자살했다는 것이다.'],
 [194,0,'마등·한수와 관서','서량의 마등과 한수는 의형제를 맺었다 원수가 되기를 되풀이하는 사이였다. 이 관서의 화약고를 조조는 힘이 아니라 사람으로 눌렀다 — 종요를 사례교위로 보내 달랜 것이다. 종요의 편지에 마등과 한수는 아들을 인질로 보냈고, 관도 결전 때는 말 2천 필까지 바쳤다. 조조의 기병이 원소와 싸울 수 있었던 뒤에는 이 서쪽의 침묵이 있었다. 물론 침묵은 영원하지 않아서, 211년 마초가 동관에서 일어난다.',0,'<b>출전</b> 『삼국지』 위서 무제기, 촉서 마초전<br><b>연의</b> 제10회(근왕), 제57회(마등 상경)<br><b>덧붙임</b> 마등은 강족 어머니를 둔 혼혈 무장으로 젊어서는 나무를 해다 팔던 빈농이었다 — 서량군벌의 태생은 중원 사족과 전혀 다른 세계였다. 연의는 그를 의대조 충신으로 그렸지만, 정사의 상경(上京)은 한수와의 불화를 피한 반(半)은퇴였다.'],
 [199,0,'장연과 흑산적','태행산맥의 골짜기마다 흑산적이 있었다. 우두머리 장연은 몸이 날래 비연(飛燕)이라 불렸고, 세력이 좋을 때는 백만을 칭했다 — 황건이 남긴 유민의 바다다. 원소와 오래 싸우며 하북의 뒤통수를 노리다가, 조조가 하북을 평정하자 무리 10만을 이끌고 항복해 평북장군 인수를 받았다. 도적 두목에서 열후까지 — 유민 집단이 군벌 질서에 흡수되는 가장 매끄러운 경로를 장연이 보여 준다.',0,'<b>출전</b> 『삼국지』 위서 장연전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 장연의 본성은 저(褚) — 죽은 두목 장우각의 성을 이어받아 장씨가 되었다. 조정은 전성기의 그를 토벌하지 못해 평난중랑장 벼슬을 주고 하북의 인사 추천권까지 인정했다 — 도적이 관직 임명권을 가진, 후한 말기다운 타협이었다.'],
 [190,0,'공융과 청류 명사','공자의 20세손 공융은 당대 최고의 명망가였다. 네 살에 배를 양보한 그 아이가 자라 북해상이 되었는데, 정사의 평이 짓궂다 — "고담준론에는 능했으나 실무는 서툴러" 황건에게 쫓겨 다녔다는 것이다. 결국 제 힘으로는 설 수 없어 허도 조정의 손님이 되었고, 그 자리에서마저 붓끝으로 조조를 찔러 대다 목숨을 잃는다. 명망이 밥을 먹여 주지 않는 시대 — 청류 명사들의 곤경을 공융 한 사람이 다 보여 준다.',0,'<b>출전</b> 『후한서』 공융전<br><b>연의</b> 제11회(북해 구원 요청), 제40회(처형)<br><b>덧붙임</b> "자리에 손님이 늘 가득하고 잔에 술이 마르지 않으면 나는 걱정이 없다(座上客常滿 樽中酒不空)" — 공융의 생활 신조다. 조조의 금주령에 "술이 나라를 망친다면 여자도 금하시지"라고 빈정댄 편지가 화근의 하나였다.'],
 [200,0,'손책·유장·장로 — 남은 지도','관도의 연기가 걷힌 뒤 천하의 지도를 펴 보자. 강동엔 스물다섯 살 손책이 여섯 군을 깔고 앉았고, 익주엔 유언의 아들 유장이 물려받은 천혜의 분지가, 한중엔 오두미도 교주 장로의 종교 왕국이, 형주엔 유표의 도서관이, 요동엔 공손씨의 반독립국이 있다. 조조가 하북을 삼키는 데 7년 — 그다음 20년의 삼국지는 이 남은 다섯 조각을 누가 줍느냐의 이야기다. 그리고 이 지도 어디에도 아직 유비의 땅은 없다.',0,'<b>출전</b> 『삼국지』 각 전 종합<br><b>연의</b> 소설도 이 무렵부터 남방으로 시선을 돌린다<br><b>덧붙임</b> 다섯 조각의 운명 — 형주는 조조가 접수했다 적벽에서 삼분되고(208), 익주는 유비가(214), 한중은 조조가(215), 요동은 사마의가(238) 거둔다. 관도 이후 천하 통일까지 80년 — 지도를 접는 데 걸린 시간이다.'],
]}]},
{name:'위 (魏)', rows:[
{name:'조조', sub:'CAO CAO',
 spans:[[172,189,'낙양의 관리'],[189,196,'진류 기병과 연주'],[196,204,'허도와 관도'],[204,216,'업의 위공'],[216,220,'위왕']],
 events:[
 [202,0,'조충의 코끼리','손권이 조조에게 코끼리를 선물했다. 저 짐승의 무게를 어찌 달까 — 조정의 어른들이 다 궁리해도 답이 없는데, 예닐곱 살 조충이 나섰다. "배에 태우고 물이 차오른 자리에 금을 그은 다음, 그만큼 돌을 실어 달면 됩니다." 정사 조충전 본문에 실린, 부력을 꿰뚫은 신동의 일화다. 조충은 열세 살에 병으로 죽었고, 통곡하는 조조를 조비가 위로하자 아버지가 쏘아붙였다. "이 아이의 죽음은 나에게는 불행이지만, 너희에게는 다행이지." 틀린 말이 아니어서 더 서늘하다.',0,'<b>출전</b> 『삼국지』 위서 무문세왕공전(조충전)<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 조충은 사형수를 구명하는 꾀도 냈다 — 쥐가 안장을 갉아 죽을 처지가 된 창고지기를 위해, 제 옷을 먼저 찢어 "쥐가 갉으면 불길하다는데 제 옷이 갉혔습니다" 하고 걱정하는 연기를 해 두었다. 조조가 "옷이 갉혀도 아무 일 없다" 웃은 뒤라, 안장 사건은 저절로 무죄가 되었다.'],
 [207.75,0,'곽가의 죽음','곽가는 조조의 참모진에서 가장 젊고 가장 대담한 두뇌였다. 유비를 죽이지도 놓아주지도 말라 했고, 손책이 자객에게 죽을 것을 맞혔고, 원씨 형제는 내버려 두면 저희끼리 싸운다 했으며, 오환 원정의 강행을 홀로 밀었다 — 다 들어맞았다. 그 원정길에서 풍토병을 얻어 서른여덟에 죽었다. 조조는 "봉효만이 가장 젊어 뒷일을 맡기려 했다"며 통곡했고, 이듬해 적벽에서 대패한 뒤 다시 한 번 그 이름을 불렀다. "곽봉효가 살아 있었다면, 나를 이 지경에 이르게 하지는 않았을 것이다." 죽은 참모가 산 참모들 전부를 부끄럽게 만든 순간이다.',0,'<b>출전</b> 『삼국지』 위서 곽가전<br><b>연의</b> 제33회 — 유계(遺計)로 요동을 평정하는 각색<br><b>덧붙임</b> 곽가는 몸가짐이 방탕해 기강 담당 진군에게 여러 번 탄핵당했다 — 조조는 탄핵한 진군도 칭찬하고 곽가는 그대로 썼다. "봉효만이 내 뜻을 안다(唯奉孝爲能知孤意)"는 말대로, 원칙과 예외를 함께 굴리는 것이 조조의 인사였다.'],
 [214.75,0,'순유의 죽음','순욱의 조카 순유는 군중의 꾀주머니 — 백마의 우회 기동도, 오소행 결단의 지지도 그의 몫이었다. 밖으로는 어수룩해 보이고 안으로는 빈틈이 없어, 조조가 "지혜로운 척하는 자는 많아도 어리석은 척할 수 있는 자는 드물다"고 평했다. 손권 정벌길에 따라나섰다가 도중에 58세로 병사하니, 조조는 그 이름을 입에 올릴 때마다 눈물을 흘렸다. 정사는 아까운 후일담을 남긴다 — 순유가 평생 낸 기책 열두 가지를 친구 종요만 알았는데, 종요가 미처 정리하지 못하고 죽어 영영 전하지 않는다고. 삼국지에서 가장 아까운 분실물이다.',0,'<b>출전</b> 『삼국지』 위서 순유전<br><b>연의</b> 제66회 — 위왕 반대 발언으로 각색<br><b>덧붙임</b> 순유는 젊어서 동탁 암살을 실제로 모의하다 투옥된 전력이 있다 — 연의가 조조에게 지어 준 그 암살 미수를, 정사에서는 순유가 했던 것이다. 옥중에서도 태연히 먹고 자다 동탁이 죽자 풀려났다 — 담력의 표본 같은 일화다.'],
 [220.25,0,'하후돈의 죽음','하후돈은 조조군의 2인자였으나 정작 야전 전적은 화려하지 않다 — 여포에게 인질로 잡히고, 유비의 화공에 걸리고, 눈에 화살을 맞았다. 그런데도 조조는 수레에 함께 타는 특권을 그에게만 주었고, 벼슬도 위나라 신하가 아닌 한나라 관직을 고집하는 그를 존중했다. 군중에서도 스승을 모셔 글을 배우고, 상으로 받은 재물은 모두 나눠 남긴 재산이 없었다. 조조가 죽고 넉 달 뒤 뒤따르듯 세상을 떴다. 뽑힌 눈알을 삼켰다는 연의 제18회의 맹장 이미지 뒤에, 정사는 검소한 살림꾼 한 사람을 적어 두었다. 같은 해 정욱도 80세로 죽어, 창업 세대가 한꺼번에 무대를 내려간다.',4,'<b>출전</b> 『삼국지』 위서 하후돈전<br><b>연의</b> 제25회(발살위기), 죽음은 제78회 뒤<br><b>덧붙임</b> 눈을 잃은 뒤 군중에서 맹하후(盲夏侯)라 불리는 것을 몹시 싫어해 거울을 던졌다고 배송지 주가 전한다 — 연의의 "부정모혈(父精母血)" 안구 삼키기 호걸담과 달리, 정사의 그는 제 장애를 아파한 사람이었다. 위나라 건국 후 신하 서열 1위의 대장군이 그의 마지막 직함이다.'],
 [223.5,0,'가후의 죽음','가후의 이력서는 삼국지에서 가장 어지럽다 — 동탁의 잔당을 부추겨 장안을 뒤집었고, 장수 밑에서 조조를 두 번 꺾었고, 그 조조에게 항복을 권했고, 동관에서 이간계를 냈고, 조비의 태자 책봉을 한마디로 결정지었다. 이 아슬아슬한 이력으로 그는 위나라 태위까지 올라 일흔일곱 천수를 다 누렸다. 비결은 처신이었다. 위나라에 온 뒤로 문을 닫아걸고 사사로운 교제를 끊었으며 자식들 혼사도 권세가와 맺지 않았다. 난세의 처세라는 종목이 있다면 가후가 우승이다 — 그 많은 판을 갈아엎고도 침대에서 죽은 사람은 그뿐이니까.',6,'<b>출전</b> 『삼국지』 위서 가후전<br><b>연의</b> 후반부에서 조용히 사라진다<br><b>덧붙임</b> 조비가 오·촉 어느 쪽을 먼저 칠지 묻자 가후는 "문(文)을 먼저 하시라"고 답했다 — 두 나라 다 지금은 못 이긴다는 뜻이었다. 조비는 듣지 않고 남정했다가 빈손으로 돌아왔다. 마지막 조언까지 적중시키고 이듬해 죽었으니, 타율 10할의 참모 경력이었다.'],
 [200.17,2,'관도의 병력','연의는 관도에 조조 7만 대 원소 70만을 세운다. 열 배의 기적 — 이야기꾼에게는 달콤한 숫자다. 정사 무제기는 반대쪽 극단이어서 "병사가 1만이 못 되고 그나마 열에 두셋은 부상병"이라 적는데, 이번엔 배송지가 본문에 시비를 건다. 연주와 서주를 아우르고 원술·여포를 깨뜨린 사람의 병력이 1만일 리 없다, 승리를 돋보이게 하려는 축소라는 것이다. 오늘날의 계산은 조조 3~4만 대 원소 10만 안팎. 소설은 부풀리고 사서는 깎고 — 주석가는 그 사이에서 저울을 든다.',0,'<b>출전</b> 『삼국지』 위서 무제기와 배송지의 반박 주석<br><b>연의</b> 제30회<br><b>덧붙임</b> 배송지의 논박은 사료 비판의 고전으로 꼽힌다 — 포로 7만 기사와 병력 1만 기사를 나란히 놓고 "1만으로 어찌 7만을 묶어 묻겠는가"라고 산수로 찌른다. 본문을 실은 채 본문을 의심하는 것 — 이 주석 방법론 덕에 후대는 숫자의 정치학을 읽을 수 있게 되었다.'],
 [208.83,4,'횡삭부시와 「단가행」','"술을 마주해 노래하노니, 인생이 얼마나 되는가(對酒當歌 人生幾何)." 「단가행」은 틀림없는 조조의 시다. 그러나 적벽 전야에 창을 비껴 들고 뱃전에서 이 노래를 읊었다는 것, 노래가 불길하다 말한 유복을 그 자리에서 찔러 죽였다는 것은 연의 제48회의 연출이다. 소동파의 「적벽부」가 그린 "술을 걸러 강에 임해 창을 비껴 들고 시를 읊는(釃酒臨江 橫槊賦詩)" 조조상을 소설이 받아 장면으로 만들었다 — 시는 진짜, 무대는 가짜. 그런데 그 가짜 무대가 이 시를 천년의 명장면으로 만들었으니, 문학의 셈법은 사서와 다르다.',0,'<b>출전</b> 시는 『문선』 수록 조조 작 — 무대는 소식 「적벽부」와 연의의 합작<br><b>연의</b> 제48회<br><b>덧붙임</b> 「단가행」의 후렴 "산은 높기를 마다 않고 바다는 깊기를 마다 않는다(山不厭高 海不厭深) — 주공이 먹던 것을 뱉으며 손님을 맞으니 천하의 마음이 돌아왔다"는 구인 광고이기도 했다 — 구현령의 시적 판본인 셈이다. 적벽 전야가 아니라도, 이 시가 조조의 자기소개서라는 것은 변하지 않는다.'],
 [208.83,4,'「동작대부」의 이교(二喬)','제갈량이 주유를 격동시키는 연의 제44회의 명장면 — 조식의 「동작대부」를 읊으며 "조조는 강동의 이교(二喬)를 데려다 동작대에 두고 즐기려 한다"고 속삭인다. 주유의 아내 소교를 걸고넘어진 것이다. 이 장면은 이중으로 성립하지 않는다. 동작대는 적벽 2년 뒤에야 세워졌으니 그때는 부(賦)도 누대도 없었고, 원문의 이교(二橋)는 미녀 자매가 아니라 누각을 잇는 두 다리다. 글자 하나 바꿔치기로 전쟁의 명분을 만든 셈 — 연의에서 가장 유명한 오독이자, 가장 성공한 오독이다.',0,'<b>출전</b> 창작 — 「동작대부」 원문은 『삼국지』 진사왕전 배송지 주<br><b>연의</b> 제44회<br><b>덧붙임</b> 이 오독의 씨앗은 당나라 시인 두목의 「적벽」이다 — "동풍이 주랑 편을 들지 않았다면, 동작대 봄 깊은 곳에 이교가 갇혔으리(銅雀春深鎖二喬)." 시인의 상상 한 구절을 연의가 제갈량의 입에 넣어 실전 화술로 바꾼 것 — 문학이 문학을 낳아 역사 행세를 한 계보다.'],
 [216,1,'꿈속에서 사람을 죽이다','"나는 꿈속에서 사람을 잘 죽인다. 내가 잠들거든 가까이 오지 말라." 그렇게 일러 놓고 어느 낮잠, 이불이 흘러내리자 시종이 다가가 덮어 주었다 — 조조는 벌떡 일어나 그를 베고 다시 누웠다. 깨어나서는 짐짓 놀라며 누가 죽였느냐 물었다고, 조조에게 적대적인 『조만전』이 전한다. 곧이곧대로 믿을 기록은 아니지만, 연의 제72회는 이를 받아 조조의 의심병을 그리는 결정적 장면으로 썼다. 침소 경호를 이야기 한 편으로 해결한 공포 정치 — 사실이라면 그것대로, 지어냈다면 그 소문이 돌았다는 것대로 조조답다.',0,'<b>출전</b> 배송지 주 『조만전』<br><b>연의</b> 제72회<br><b>덧붙임</b> 연의는 이 대목에 양수의 촌철을 붙였다 — 시종의 장례에서 양수가 관을 보며 한마디 한다. "승상이 꿈속에 있었던 게 아니라, 그대가 꿈속에 있었던 것일세." 진상을 폭로하는 이 대사 역시 양수 처형의 복선으로 배치되었다 — 소설의 인과는 이렇게 촘촘하다.'],
 [174,0,'낙양 북부위와 오색봉','스무 살 조조의 첫 부임지는 낙양 북부위 — 수도의 야간 치안 담당이다. 부임하자마자 사대문에 오색 몽둥이를 걸어 두고 선언했다. 금령을 어기는 자는 신분을 묻지 않는다. 몇 달 뒤 황제가 총애하는 환관 건석의 숙부가 야간 통행금지를 어기다 걸렸고, 조조는 그 자리에서 때려죽였다. 이후 감히 밤길을 나서는 권세가가 없었다. 정사가 전하는 젊은 조조는 협객이 아니라 법 앞에 예외를 두지 않는 혹리 — 난세의 간웅은 치세의 능신으로 출발했다.',0,'<b>출전</b> 『삼국지』 위서 무제기 배송지 주 『조만전』<br><b>연의</b> 제1회에 한 줄로 압축<br><b>덧붙임</b> 처형된 건석의 숙부 사건 뒤 권세가들은 조조를 건드리는 대신 승진시켜 치웠다 — 돈구현령으로 영전이라는 이름의 축출이었다. 스무 살 신참의 몽둥이가 수도의 밤을 바꾼 몇 달은 그렇게 끝났지만, 이력서의 첫 줄로는 충분했다.'],
 [175,1,'허소의 인물평','여남의 허소는 매달 초하루 인물평을 내는 것으로 유명했다 — 월단평(月旦評)이다. 젊은 조조가 찾아가 졸랐다. 나는 어떤 사람이오? 허소는 입을 다물었다. 재촉 끝에 나온 답이 두 판본으로 전한다. 손성 『이동잡어』는 "치세의 능신이요 난세의 간웅(治世之能臣 亂世之姦雄)", 『후한서』는 "청평의 간적이요 난세의 영웅(淸平之姦賊 亂世之英雄)". 능신-간웅이냐 간적-영웅이냐 — 연의는 앞엣것을 골랐고 조조는 그 말을 듣고 크게 웃었다고 한다. 그 선택이 800년의 조조상을 결정했다.',0,'<b>출전</b> 배송지 주 『이동잡어』, 『후한서』 허소전<br><b>연의</b> 제1회<br><b>덧붙임</b> 허소는 처음에 조조를 깔보고 평을 거절했다 — 조조가 협박에 가깝게 조른 끝에 나온 말이라고 『후한서』는 적는다. 조조의 관상을 두고는 교현이 먼저 알아봤다. "천하가 어지러워질 텐데, 이를 안정시킬 자는 그대일 것이오." 젊은 조조는 이 어른의 지우(知遇)를 평생 잊지 않고 제문까지 지었다.'],
 [184.17,0,'기도위에서 제남상으로','황건 토벌의 공으로 제남상이 된 조조는 부임하자마자 관할 현령 여덟을 부정 혐의로 파면하고, 지역 토호들이 재물을 긁던 음사(淫祀) 6백여 곳을 헐어 버렸다. 통쾌하지만 대가가 있었다 — 중앙 권세가들의 미움을 산 것이다. 조조는 병을 핑계로 벼슬을 던지고 고향에 내려가 봄가을엔 사냥하고 겨울엔 글을 읽었다. 훗날 스스로 밝히기를, 이때 바란 것은 "고향의 이름난 선비" 소리뿐이었다고 한다(「양현자명본지령」). 천하는 아직 그를 부르지 않았다.',0,'<b>출전</b> 『삼국지』 위서 무제기<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 사직 후 조정이 동군태수로 다시 불렀으나 병을 칭하고 거절했다 — 이 무렵의 소망이 "여름엔 사냥, 겨울엔 독서로 20년을 기다렸다가 천하가 맑아지면 나가는 것"이었다고 「양현자명본지령」에 스스로 적었다. 황건의 난이 그 20년 계획을 4년으로 줄였다.'],
 [189.83,4,'칠성보도와 조서 위조','연의 제4회의 조조는 왕윤에게 칠성보도를 빌려 동탁의 침소에 들어가고, 낌새를 챈 동탁 앞에서 천연덕스럽게 칼을 바치는 척 위기를 넘긴다. 손에 땀을 쥐게 하는 이 암살 미수는 통째로 창작이다. 각지에 가짜 조서를 돌려 의병을 일으킨 사람도 조조가 아니라 동군태수 교모다. 연의는 암살 시도와 조서 위조를 모두 조조 앞으로 계산서를 옮겨, 이야기의 첫 장부터 그를 천하의 중심에 세웠다. 악역에게도 주인공 대접은 해 준 셈이다.',0,'<b>출전</b> 창작 — 탈주 기사만 『삼국지』 위서 무제기<br><b>연의</b> 제4~5회<br><b>덧붙임</b> 실제 탈주극에도 위기는 있었다 — 중모현에서 정체가 발각돼 체포되었는데, 공조(功曹) 하나가 "난세에 영웅을 묶어 둘 일이 아니다"라며 현령을 설득해 풀어 주었다. 연의는 이 이름 없는 공조를 진궁으로 바꿔, 훗날 백문루의 비극을 예약해 두었다.'],
 [189.92,0,'진류 기병(起兵)','동탁이 효기교위 벼슬로 회유하자 조조는 이름을 바꾸고 샛길로 낙양을 빠져나왔다. 고향 근처 진류에 이르러 가산을 털고, 효렴 위자의 재산 후원을 받아 병사 5천을 모았다 — 정사 무제기가 적는 조조의 창업 자본이다. 가짜 조서도 보검도 없이, 지방 부호의 투자와 집안 재산으로 시작한 스타트업이었던 셈이다. 이해 12월, 서른다섯 살이었다.',12,'<b>출전</b> 『삼국지』 위서 무제기<br><b>연의</b> 제5회<br><b>덧붙임</b> 투자자 위자는 "평천하할 사람은 반드시 이 사람"이라며 가재를 털었다 — 삼국지 최초의 벤처 투자였던 셈이다. 조조는 위나라를 세운 뒤에도 그 은혜를 기려 위자의 아들들을 후하게 썼다. 기병 당시 모인 5천은 이듬해 형양 참패로 절반 이하가 된다.'],
 [190,1,'여백사 일가 살해','도망길의 조조가 아버지의 친구 여백사의 집에 들렀다 그 일가를 죽였다. 여기까지는 세 사료가 같다. 이유가 갈린다. 『위서』는 아들들이 재물을 노려 덤볐다는 정당방위, 『세어』는 그릇 소리를 칼 가는 소리로 오해한 참극. 그리고 『잡기』만이 그 유명한 대사를 전한다 — 뒤늦게 깨달은 조조가 처연히 말하기를, "내가 남을 저버릴지언정 남이 나를 저버리게 하지는 않겠다(寧我負人 毋人負我)". 연의는 셋 중 가장 어두운 판본을 골라 "천하 사람(天下人)"으로 키웠다. 한 사건, 세 개의 진실 — 배송지 주가 아니었다면 우리는 고를 수도 없었다.',0,'<b>출전</b> 배송지 주 『위서』·『세어』·『손성잡기』 세 판본 병렬<br><b>연의</b> 제4회<br><b>덧붙임</b> 세 판본 모두에서 여백사 본인은 집에 없었다 — 연의만이 그를 술 사러 갔다 돌아오는 길에 죽게 해 비극을 완성했다. "차라리 내가 남을 저버리겠다"는 대사도 원문은 처연한 독백(悽愴曰)인데, 소설은 당당한 선언으로 바꿨다 — 같은 문장의 온도를 바꿔 악인을 만든 것이다.'],
 [190.17,0,'형양의 대패','관동 연합군이 술잔만 돌리고 있을 때 조조 홀로 서진했다. 결과는 형양 변수에서의 참패 — 서영의 복병에 걸려 화살을 맞고 말까지 잃었다. 사촌동생 조홍이 제 말을 내밀자 조조가 사양했다. 조홍의 대답이 정사에 남아 있다. "천하에 이 조홍은 없어도 되지만, 공은 없어서는 안 됩니다." 조홍은 걸어서 주군을 따라 강을 건넜다. 첫 출전의 성적표는 낙제였으나, 유일하게 싸운 자라는 이름은 남았다 — 난세의 신용은 이렇게 쌓인다.',0,'<b>출전</b> 『삼국지』 위서 무제기·조홍전<br><b>연의</b> 제6회<br><b>덧붙임</b> 조조를 패배시킨 서영은 동탁군의 중랑장으로, 이후 손견도 한 차례 꺾은 명장이었다 — 그러나 동탁 사후 왕윤 편에 섰다가 이각·곽사에게 전사해, 두 영웅을 이긴 장수치고는 무명으로 남았다. 조홍은 이 공으로 평생 조조의 특별 대우를 받았다 — 훗날 조비가 그를 죽이려 하자 변태후가 "조홍이 없었으면 오늘이 없다"며 막았다.'],
 [192,0,'연주와 청주병','연주자사가 황건 잔당과 싸우다 전사하자, 포신 등이 조조를 새 자사로 맞아들였다. 조조는 추격전 끝에 황건 100만 무리의 항복을 받아냈다 — 그리고 여기서 승부수를 던진다. 항복한 무리에서 정예 30만을 골라 제 군단으로 편성한 것이다. 이름하여 청주병. 어제의 반란군이 오늘의 주력군이 되었다. 유민을 학살하지 않고 자산으로 바꾼 이 결정이, 5천으로 시작한 군벌 조조를 단숨에 체급 위로 올려놓았다.',0,'<b>출전</b> 『삼국지』 위서 무제기<br><b>연의</b> 제5회 전후에 간략히<br><b>덧붙임</b> 청주병은 조조 직속의 별도 군단으로 유지되어 관도에서도 싸웠으나, 규율은 끝내 골칫거리였다 — 완성 패주 때는 혼란을 틈타 아군을 약탈하다 우금에게 진압당했다. 조조가 죽자 청주병들이 멋대로 북을 치며 고향으로 흩어졌다는 기사가 그 군단의 성격을 요약한다 — 그들은 위나라가 아니라 조조 개인의 군대였다.'],
 [193.75,0,'서주 도륙','아버지 조숭이 서주 경내에서 살해되자 조조는 복수의 칼을 뽑았다 — 그런데 그 칼이 향한 곳은 백성이었다. 취려·수릉·하구가 도륙당했다. 『삼국지』 도겸전은 "죽은 자가 만을 헤아려 사수가 흐르지 못했다"고 적고, 『후한서』는 "남녀 수십만을 죽여 닭과 개도 남지 않았다"고 적으며, 무제기 스스로도 "지나는 곳마다 대부분 도륙했다"고 인정한다. 조조 일생의 가장 어두운 페이지다. 연의는 흥미롭게도 이 대목을 크게 줄이고 효심 이야기로 바꿔 놓았다 — 간웅으로 그리던 소설이 정작 실제 악행은 덮어 준 셈이다.',0,'<b>출전</b> 『삼국지』 위서 도겸전, 『후한서』 도겸전<br><b>연의</b> 제10회 — 규모를 크게 줄여 각색<br><b>덧붙임</b> 학살을 피해 남쪽으로 흘러간 서주 난민 중에 제갈량 일가가 있었다 — 숙부 제갈현을 따라 형주로 간 소년이 훗날 조조의 최대 숙적이 된다. 광릉의 명사 장굉도 이때 강동으로 피해 손책의 참모가 되었으니, 도륙 한 번이 적진에 인재를 두 세대나 공급한 셈이다.'],
 [196.75,0,'둔전제 시행','조지와 한호가 올린 건의는 소박했다. 유민에게 관가의 소와 버려진 땅을 주고 농사를 짓게 하자, 수확은 절반씩 나누자. 첫해 허도 일대에서 거둔 곡식이 100만 곡 — 조조는 무릎을 쳤다. "나라를 안정시키는 방책은 강한 군사와 넉넉한 곡식이다(定國之術 在於彊兵足食)." 남들이 백성을 약탈하며 싸울 때 조조는 세수를 조직했다. 연의가 한 줄도 쓰지 않은 이 농정 개혁이야말로, 관도에서 원소를 버텨 낸 진짜 밑천이었다.',0,'<b>출전</b> 『삼국지』 위서 무제기·임준전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 실무 총괄 임준이 둔전중랑장, 조지가 둔전도위 — 삼국지 최초의 농정 전담 관직이다. 민둔(民屯)은 5~60인 단위로 조직되어 군현과 별도 행정을 이뤘고, 뒤에 군둔(軍屯)으로 확장된다. 원소군이 뽕나무 열매로, 원술군이 조개로 연명하던 해에 조조 창고에는 곡식 백만 곡이 쌓였다.'],
 [197.08,0,'완성의 참패','항복한 장수를 받아들인 조조가 그의 숙모뻘 되는 추씨를 곁에 두었다. 모욕을 삼키던 장수는 가후와 짜고 한밤에 진영을 뒤엎었다. 이 야습으로 조조는 세 사람을 잃는다. 맏아들 조앙 — 제 말을 아버지에게 내주고 죽었다. 조카 조안민. 그리고 문짝만 한 쌍철극을 휘두르며 문을 막던 호위대장 전위. 값은 거기서 끝나지 않았다. 조앙을 기른 정실 정부인이 "내 아들을 죽여 놓고"라며 친정으로 떠나 끝내 돌아오지 않았고, 후계 구도는 변씨 소생 조비 쪽으로 기울었다. 하룻밤의 방심이 위나라의 미래까지 바꾼 셈이다.',1,'<b>출전</b> 『삼국지』 위서 무제기·전위전<br><b>연의</b> 제16~17회<br><b>덧붙임</b> 전위는 문을 막고 긴 창 두 자루를 휘둘러 접근을 불허했다 — 병기를 잃자 사람 둘을 양손에 들고 휘둘렀다고 전위전이 적는다. 조조는 이후 완성을 지날 때마다 전위의 제사를 지냈다. "맏아들과 조카를 잃었는데, 눈물은 전위 때문에 흐른다"는 말과 함께였다.'],
 [198,1,'할발대수(割髮代首)','행군 중 보리밭을 밟는 자는 목을 벤다 — 조조 자신이 내린 군령이었다. 그런데 하필 조조의 말이 놀라 보리밭으로 뛰어들었다 — 말을 놀라게 한 비둘기는 연의가 날려 보낸 소품이다. 조조가 주부를 불러 제 죄를 논하라 하니 주부가 진땀을 흘리며 "법은 지존에게 미치지 않습니다"라 답했다. 조조는 칼을 뽑아 제 머리카락을 잘라 땅에 놓았다. "그럼 머리카락으로 머리를 대신한다." 조조에게 적대적인 『조만전』조차 실어 놓은 일화다 — 신체발부가 무겁던 시대, 이것은 쇼였을까 법이었을까. 연의 제17회는 판단을 독자에게 넘긴 채 그대로 옮겼다.',0,'<b>출전</b> 배송지 주 『조만전』<br><b>연의</b> 제17회<br><b>덧붙임</b> 『조만전』은 조조에게 적대적인 오나라 쪽 저작으로 추정되는 책 — 그런 책조차 이 일화를 웃음거리 아닌 통치술로 기록했다. 머리카락은 부모에게 받은 몸의 일부라 자르는 것 자체가 형벌(髡刑)이던 시대다. 보리밭 군령의 원문은 "士卒無敗麥 犯者死" — 죽음의 군령이었다.'],
 [200.17,0,'백마와 연진','원소의 선봉 안량이 백마를 에워싸자 순유가 계책을 냈다 — 연진에서 강을 건너는 시늉을 해 원소의 주력을 서쪽으로 끌어낸 뒤, 경기병으로 백마를 급습한다. 허를 찔린 안량은 관우의 창에 목이 떨어졌다. 물러나는 길, 조조는 치중 수레를 일부러 길에 흘렸다. 원소군 기병이 노획물에 달려들어 대오가 흐트러진 순간 6백 기가 들이쳤고, 명장 문추가 어지러운 싸움 속에 죽었다. 열흘 사이에 원소의 좌우 팔이 다 떨어진 것이다 — 병력의 열세를 정보와 기동으로 뒤집는 조조 용병의 교과서다.',4,'<b>출전</b> 『삼국지』 위서 무제기·순유전<br><b>연의</b> 제25~26회<br><b>덧붙임</b> 연진의 미끼 작전 때 장수들이 "적 기병이 너무 많으니 치중을 거두자" 청했으나 순유가 "이게 미끼인데 거두면 어쩌자는 것이오" 웃으며 막았다 — 조조와 순유는 서로 마주 보고 웃었다고 무제기가 적는다. 참모와 주군이 눈빛으로 통하던, 조조군 전성기의 공기다.'],
 [200.83,0,'오소 기습','허유가 밤에 투항해 왔을 때, 조조는 맨발로 뛰어나가 맞았다고 『조만전』은 전한다. 그가 가져온 정보는 단 하나 — 원소의 군량이 오소에 쌓여 있고 경비가 허술하다. 조조는 5천을 추려 원소군 깃발을 들리고 병사들 입에 재갈을 물린 채 밤길 40리를 갔다. 새벽에 불길이 오르자 구원군이 닥쳤고, 좌우가 다급히 알리자 조조가 소리쳤다. "적이 등 뒤에 오거든 그때 다시 고하라!" 병사들은 죽기로 싸웠다. 곡식이 재가 되며 하북 10만 대군도 함께 무너졌다 — 창고 하나가 천하의 향방을 정했다.',10,'<b>출전</b> 『삼국지』 위서 무제기, 배송지 주 『조만전』<br><b>연의</b> 제30회<br><b>덧붙임</b> 원소 진영에서는 장합이 "오소를 전력으로 구원해야 한다"고 주장했으나 곽도가 본진 공격론을 밀었다 — 실패하자 곽도는 제 책임을 장합에게 씌웠고, 장합은 그 길로 투항했다. 참패의 원인 제공자가 참소로 명장까지 적에게 헌납한 것이다.'],
 [200.92,0,'내통 편지를 태우다','관도의 원소 진영을 접수하자 편지 뭉치가 나왔다. 허도의 관원들과 조조 군중의 인사들이 원소와 몰래 주고받은 것들 — 발신인 명단만 추리면 숙청 목록이 완성될 판이었다. 조조는 읽지 않고 통째로 태우게 했다. 무제기 본문의 기록이고, 『위씨춘추』가 그때의 말을 보탠다. "원소가 강성할 때는 나조차 나를 지킬 수 없었다. 하물며 다른 사람들이야." 떨고 있던 사람들은 그날로 조조의 사람이 되었다. 승리를 완성한 것은 칼이 아니라 불쏘시개였다.',0,'<b>출전</b> 『삼국지』 위서 무제기, 배송지 주 『위씨춘추』<br><b>연의</b> 제30회<br><b>덧붙임</b> 같은 수법의 원조는 후한 광무제다 — 왕랑을 깨뜨린 뒤 부하들의 내통 문서를 모아 놓고 태웠다. 조조는 고사를 알고 재연했을 것이다 — 창업 군주의 관용 퍼포먼스라는 정치 장르를 계승한 셈인데, 효과는 원조 못지않았다.'],
 [204.58,0,'업 점령과 호조식','업을 얻은 조조는 스스로 기주목이 되더니 곧장 세제를 뜯어고쳤다. 밭 1묘에 곡식 4되, 호(戶)마다 비단 2필과 솜 2근 — 끝. 그 외에 함부로 걷는 자는 처벌한다는 영을 함께 내렸다. 사람 머릿수마다 걷던 한나라의 인두세를 토지와 가호 단위로 바꾼 것인데, 이 단순한 표 한 줄이 위진남북조 세제의 원형이 된다. 호강들의 토지 겸병 단속도 붙였다. 정복지에서 약탈 대신 세율표를 반포하는 정복자 — 조조가 무서운 것은 이런 대목이다.',8,'<b>출전</b> 『삼국지』 위서 무제기<br><b>연의</b> 제32회(함락만)<br><b>덧붙임</b> 입성 직후 조조는 원소의 무덤에 직접 제사 지내고 눈물을 흘렸다 — 젊은 날의 맹우이자 평생의 적수에 대한 예우였다. 원소의 아내에게는 보물을 돌려주고 비단과 곡식을 내렸다. 관도의 생매장과 이 눈물 사이 어디쯤에 조조라는 사람이 있다.'],
 [207.67,0,'백랑산 원정과 「보출하문행」','오환 원정길은 도박이었다. 폭우로 해안길이 잠기자 조조는 곽가의 말대로 치중을 버리고 노룡새의 폐도를 뚫었다 — 500리 무인지경을 지나 백랑산에서 적과 마주쳤을 때, 아군은 갑옷도 채 갖추지 못한 상태였다. 장료를 선봉으로 그대로 들이쳐 답돈의 목을 벴다. 돌아오는 길에 갈석산에 올라 바다를 보며 「관창해」를 읊었고, "늙은 준마는 마구간에 엎드려도 뜻이 천 리에 있다(老驥伏櫪 志在千里)"는 「구수수」도 이 무렵의 시다. 쉰셋의 정복자가 시인이기도 했다는 것 — 건안 문학은 안장 위에서 쓰였다.',8,'<b>출전</b> 『삼국지』 위서 무제기·전주전<br><b>연의</b> 제33회<br><b>덧붙임</b> 「관창해」는 중국 시가사에서 바다를 정면으로 노래한 첫 작품으로 꼽힌다 — "해와 달의 운행이 그 속에서 나오는 듯하다(日月之行 若出其中)." 향도 전주는 논공행상에서 후(侯) 책봉을 죽기로 사양했다 — 옛 주군 유우의 원수인 공손찬을 못 갚은 몸이 상을 받을 수 없다는 이유였다.'],
 [208.58,0,'공융의 죽음','남정을 앞둔 조조가 뒤를 정리했다. 첫 번째가 공융 — 공자의 20세손이자 조정 비판의 상징이었다. 죄목이 고약하다. "아버지와 자식 사이에 무슨 은혜가 있는가, 본디 정욕의 결과일 뿐"이라 말했다는 불효죄. 평생 예교를 짊어진 명문가 후손을 예교의 이름으로 죽인 것이다. 처형 소식에 아홉 살 아들이 태연히 바둑을 두며 말했다는 것이 『후한서』와 『세설신어』가 나란히 전하는 "엎어진 둥지 아래 성한 알이 있으랴(覆巢之下 復有完卵乎)"다. 천하를 향한 경고문으로 이만한 것이 없었다.',8,'<b>출전</b> 『후한서』 공융전<br><b>연의</b> 제40회<br><b>덧붙임</b> 처형 죄목을 정리한 사람은 치려(郗慮)와 노수(路粹) — 조조는 손에 피를 묻히지 않고 탄핵 절차로 처리했다. 함께 죽은 아내와 자녀들, 그리고 "엎어진 둥지" 발언의 두 아이까지 — 일가가 지워졌다. 조비는 뒷날 천금을 걸고 공융의 문장을 수집했다 — 아버지가 죽인 사람의 글을 아들이 사 모은 것이다.'],
 [208.75,0,'형주 접수와 남하','유표가 죽자 형주는 싸워 보지도 않고 항복했다. 조조는 강릉의 군수 물자와 수군 함대를 통째로 접수하고, 당양에서 유비를 짓밟은 기세로 손권에게 편지를 띄웠다. "이제 수군 80만을 이끌고 장군과 함께 오 땅에서 사냥이나 할까 하오." 강동이 발칵 뒤집혔다. 냉정한 주유가 셈을 다시 했다 — 중원병 15~16만은 지쳤고, 형주병 7~8만은 어제까지 적이었다. 80만이라는 숫자는 붓으로 부풀린 공갈이었지만, 공갈만으로 강동 조정의 절반이 항복론으로 기울었다.',9,'<b>출전</b> 『삼국지』 위서 무제기, 오서 주유전(병력 계산)<br><b>연의</b> 제40~42회<br><b>덧붙임</b> "80만"은 당대 최대의 허풍 편지로 유명하지만, 실제 남하 속도가 만든 공포는 진짜였다 — 양양에서 강릉까지 경기병 5천으로 하루 3백 리를 달린 것은 군수 물자 창고를 유비에게 뺏기지 않으려는 경주였다. 조조는 형주 접수 직후 한숨 돌리는 대신 곧장 동진했다 — 그 조급함이 적벽을 불렀다는 평이 뒤따른다.'],
 [208.83,0,'적벽의 패배','화공 한 번에 천하 통일의 꿈이 강물에 잠겼다. 불붙은 함대를 버리고 화용도의 진창길로 물러나는데, 굶주린 병사들이 풀단을 져다 길을 메우면 기병이 그 위를 밟고 지났다 — 밟혀 죽은 자가 수를 셀 수 없었다. 훗날 조조는 손권에게 편지를 보내 정색하고 변명했다. "적벽의 싸움은 마침 역병이 돌아 내가 배를 태우고 스스로 물러난 것이다. 주유가 공연히 이름을 얻었을 뿐." 사실 여부를 떠나, 천하의 조조가 굳이 해명 편지를 썼다는 것 자체가 그날의 상처를 말해 준다.',12,'<b>출전</b> 『삼국지』 위서 무제기, 오서 주유전<br><b>연의</b> 제49~50회<br><b>덧붙임</b> 무제기는 이 패배를 단 한 문장으로 처리한다 — "적벽에 이르러 유비와 싸웠으나 불리했다(至赤壁 與備戰 不利)." 승자 쪽 주유전이 화공의 전말을 자세히 적어, 같은 사건이 두 전기에서 전혀 다른 분량을 갖는다. 역병 기사는 양쪽 모두에 있으니 — 불과 병, 두 개의 적이 있었던 것은 분명하다.'],
 [208.83,1,'화용도의 웃음','『산양공재기』가 전하는 화용도는 연의와 전혀 다른 무대다. 진창길을 겨우 빠져나온 조조가 갑자기 크게 웃었다. 장수들이 어리둥절해 묻자 — "유비는 나와 같은 부류지만 꾀가 반 박자 늦다. 진작 이 길목에 불을 놓았으면 우리는 한 줌 재였다." 말이 끝나기도 전에 유비 쪽에서 정말 불을 놓았지만 이미 늦은 뒤였다. 연의 제50회는 이 자리에 관우를 세워 옛 은혜로 조조를 놓아주게 했다 — 사료의 웃음 한 번을, 소설은 의리의 관문으로 바꿔 놓은 것이다.',12,'<b>출전</b> 배송지 주 『산양공재기』<br><b>연의</b> 제50회 — 관우의 의리 장면으로 재구성<br><b>덧붙임</b> 모종강본은 이 대목에 "조조가 세 번 웃는다(三笑)"는 구조를 얹었다 — 웃을 때마다 조운·장비·관우가 차례로 나타나는 리듬이다. 사료의 웃음 한 번이 소설에서 세 번으로 늘며, 마지막 웃음의 값으로 목숨을 관우에게 저당 잡히는 구성 — 개작 기술의 정점으로 꼽히는 대목이다.'],
 [210,0,'구현령(求賢令)','적벽에서 돌아온 조조가 천하에 포고문을 냈다. "오직 재주만 있으면 천거하라(唯才是擧)." 청렴하지 않아도 좋다, 형수와 사통하고 뇌물을 받았다는 자라도 좋다, 불인불효해도 나라 다스릴 재주만 있으면 내게 보내라 — 214년과 217년에 거듭 내린 영은 갈수록 노골적이었다. 도덕으로 인재를 골라 온 한나라 4백 년의 향거리선을 정면으로 뒤집은 선언이자, 도덕의 독점자인 명문 사족을 향한 도전장이었다. 순욱의 죽음도, 사마의의 등용도, 따지고 보면 이 문장의 그늘 안에 있다.',0,'<b>출전</b> 『삼국지』 위서 무제기<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 217년의 마지막 영은 수위가 가장 높다 — 오기(吳起)처럼 아내를 죽이고 어머니 장례에도 가지 않은 자라도 나라 다스릴 재주면 천거하라 했다. 형수와 사통하고 뇌물을 받았다는 진평의 고사(盜嫂受金)는 첫 영(210)부터 올라 있었다. 순욱 사후의 인사 독트린이었다. 구현령 3부작은 과거제가 없던 시대에 재능주의를 선언한 문서로, 위진 인사제도사의 분수령으로 다뤄진다.'],
 [211.58,0,'동관과 이간계','마초와 한수의 관서 연합군은 정예였다. 동관에서 황하를 건너던 조조는 마초의 기습에 화살 비를 뒤집어썼고, 허저가 안장으로 화살을 막으며 배를 저어 간신히 벗어났다. 힘으로 안 되자 조조는 붓을 들었다. 한수와 진중에서 만나 옛날이야기로 웃음꽃을 피우고 — 마초의 의심 한 겹. 한수에게 보낸 편지에 일부러 지우고 고친 자국을 남기고 — 의심 두 겹. 연합군은 안에서 무너졌다. 싸움이 끝난 뒤 조조가 실토했다. "관서 병사는 강했다. 굳게 지키기만 했다면 1년은 걸렸을 것이다."',9,'<b>출전</b> 『삼국지』 위서 무제기·가후전<br><b>연의</b> 제58~59회<br><b>덧붙임</b> 연의는 이 전역에 명장면을 하나 보탰다 — 마초에게 쫓긴 조조가 수염을 자르고 전포를 벗어 던지며 달아나는 할수기포(割鬚棄袍)다. 정사에 없는 이 수모 장면은 마초의 무용을 키우는 지렛대다. 회전 후 조조는 마초의 정예를 두고 "관서병은 창칼에 능하니 정면으로 받지 말라"는 전술 메모까지 남겼다.'],
 [212,0,'순욱의 죽음','순욱은 20년간 조조의 장자방이자 인사부장이었다 — 봉천자를 설계하고, 관도에서 물러서려는 조조를 편지 한 장으로 붙잡아 세웠으며, 곽가·순유·종요를 모두 그가 천거했다. 그런 순욱이 위공 승진과 구석에 반대했다. 한나라를 지키자고 시작한 일이 한나라를 삼키는 일로 변해 가는 것을 견딜 수 없었던 것이다. 정사는 "근심하다 죽었다(以憂薨)"고 조심스레 적고, 『위씨춘추』는 조조가 보낸 찬합을 열어 보니 비어 있었고 순욱이 약을 마셨다고 전한다 — 빈 그릇의 뜻을 두고 천년째 해석이 갈린다. 이듬해 조조는 위공에 올랐다.',0,'<b>출전</b> 『삼국지』 위서 순욱전, 배송지 주 『위씨춘추』<br><b>연의</b> 제61회<br><b>덧붙임</b> 순욱은 인사 추천의 달인이기도 했다 — 순유·종요·진군·사마의가 모두 그의 천거다. 조조가 일찍이 그를 "나의 자방(吾之子房)"이라 불렀으니, 장량에 비긴 것이다. 그 자방의 죽음 이듬해 위공 즉위가 단행되었다 — 순욱의 생애가 곧 한나라의 마지막 방파제였던 셈이다.'],
 [215.58,0,'한중 평정과 득롱망촉','장로의 항복으로 한중을 얻자 사마의와 유엽이 입을 모았다. 유비가 익주를 삼킨 지 얼마 안 되어 인심이 붙지 않았으니, 지금 밀고 내려가면 촉은 저절로 무너집니다. 조조가 고개를 저으며 옛말을 끌어왔다. "사람은 만족을 모른다더니, 이미 농(隴)을 얻고 또 촉(蜀)을 바라는가." 그러고는 회군했다. 2년 뒤 유비가 거꾸로 한중을 빼앗으러 올라왔을 때, 이 결정은 두고두고 씹히는 후회거리가 된다. 천하의 조조도 예순의 나이 앞에서는 정복보다 소화를 골랐던 것일까.',11,'<b>출전</b> 『삼국지』 위서 무제기, 배송지 주 『위서』<br><b>연의</b> 제67회<br><b>덧붙임</b> 득롱망촉의 원전은 후한 광무제의 편지 — "농을 평정하고 나니 다시 촉을 바라게 되는구나(既平隴 復望蜀)." 광무제는 욕심내서 이겼고, 조조는 같은 문장을 거꾸로 읽어 물러났다. 항복한 장로에게는 진남장군 벼슬과 열후 다섯 — 창고를 봉인하고 기다린 항복자에 대한 시가였다.'],
 [217,0,'조비를 태자로 세우다','맏아들 조비냐, 붓을 들면 신들리는 조식이냐 — 후계를 저울질하던 조조가 가후에게 물었다. 가후는 입을 다물었다. 재촉하자 딴청처럼 답했다. "원소와 유표 부자를 생각하고 있었습니다." 장자를 제쳤다가 집안이 통째로 무너진 두 사례를 한 문장에 담은 것이다. 조조는 크게 웃고 조비를 태자로 세웠다. 물음 하나에 왕조의 상속법을 정리해 준 이 한마디 — 가후가 왜 천수를 누렸는지 보여 주는 답안지이기도 하다.',0,'<b>출전</b> 『삼국지』 위서 가후전·진사왕전<br><b>연의</b> 제68회 전후<br><b>덧붙임</b> 경쟁의 결정타는 사고였다 — 조식이 취해서 천자의 전용도로 사마문을 수레로 질주한 것이다. 조조는 "이 일로 내 아들을 보는 눈이 달라졌다"고 공언했다. 조비 쪽 참모 오질은 상자에 숨어 드나들며 코치했다 — 후계 다툼의 승부는 재능이 아니라 관리(管理)에서 갈렸다.'],
 [219.42,1,'한중 포기와 계륵','한중을 두고 유비와 1년을 대치하던 조조가 어느 저녁 군령을 내렸는데, 전달된 암호가 "계륵(鷄肋)" 한 마디였다. 장수들이 어리둥절한 가운데 주부 양수만이 짐을 쌌다. "닭갈비란 버리자니 아깝고 먹자니 먹을 게 없는 것 — 왕께서 한중을 버리기로 하신 것이다." 배송지 주 『구주춘추』의 기록이다. 연의는 이 총명함이 양수를 죽였다고 그리지만, 정사가 적는 처형 사유는 따로 있다 — 조식의 편에서 후계 다툼에 깊이 개입한 데다, 하필 원술의 조카였다는 것. 재주가 아니라 줄을 잘못 선 것이 죄였다.',5,'<b>출전</b> 배송지 주 『구주춘추』, 처형 사유는 『삼국지』 위서 진사왕전<br><b>연의</b> 제72회<br><b>덧붙임</b> 양수는 조조가 문제를 낼 때마다 답을 먼저 맞히는 사람이었다 — 문에 활(活)자를 쓰자 "넓다(闊)는 뜻"이라 헐게 하고, 낙(酪) 한 합(盒)에 "한 사람이 한 입(一人一口)"이라 나눠 먹였다. 연의는 이 일화들을 처형의 복선으로 배열했지만, 정사의 죽음은 정치였다 — 조식의 참모이자 원술의 조카는 새 시대에 너무 위험한 조합이었다.'],
 [219.83,0,'번성 구원과 천도 논의','관우가 우금의 칠군을 물에 잠그고 번성을 조이자 그 위세가 화하를 뒤흔들었다(威震華夏) — 정사가 이 네 글자를 쓴 사람은 관우뿐이다. 조조가 천도까지 입에 올렸을 때 사마의와 장제가 붙잡았다. "손권과 유비는 겉으로만 가깝습니다. 관우가 커지는 것을 손권은 바라지 않으니, 강동을 찌르게 하십시오." 조조는 편지 한 통으로 오군을 움직였고, 두 달 뒤 관우의 목이 낙양에 도착한다. 삼국지 전체를 통틀어 가장 값싸게 이긴 대전략 — 칼 대신 남의 질투를 쓴 것이다.',10,'<b>출전</b> 『삼국지』 위서 무제기·장제전, 오서 여몽전<br><b>연의</b> 제73~75회<br><b>덧붙임</b> 손권의 밀서가 오자 조조는 동맹의 예의보다 실리를 골랐다 — 밀서 내용을 화살에 매어 번성 안팎에 쏘아 알린 것이다. 포위된 아군의 사기는 오르고, 관우는 진퇴가 꼬였다 — 비밀 유지를 조건으로 온 밀서를 공개해 두 적을 이간한, 편지 한 통의 삼중 활용이다.'],
 [220,0,'조조의 죽음','낙양에서 66세로 눈을 감으며 남긴 「유령(遺令)」은 천하 경영의 유언이 아니었다. 남은 향은 부인들에게 나눠 주어라, 시녀들은 동작대에 살게 하고 틈틈이 육포를 올려라, 할 일 없거든 신발 끈이라도 삼아 팔아 살아라 — 소소한 살림 걱정뿐이다. 육기와 소동파가 영웅답지 못하다 논평했을 만큼 이상한 유언이지만, 바로 그래서 인간 조조의 마지막 표정이 남았다. 금은보화를 묻지 말라는 박장 유언도 지켜져, 2009년 안양에서 발굴된 고릉은 과연 검소했다. 도굴꾼도 그의 유언은 못 이긴 셈이다.',1,'<b>출전</b> 『삼국지』 위서 무제기, 「유령」은 배송지 주 『위서』 등<br><b>연의</b> 제78회 — 관우의 혼령과 신의 화타가 동원된다<br><b>덧붙임</b> 연의의 조조는 죽기 전 꿈에서 세 마리 말이 한 구유(槽)에서 먹는 것을 본다 — 사마의 삼부자가 조(曹)씨를 먹어 치운다는 예언 장치로, 정사에서는 다른 맥락의 일화다. 고릉 발굴에서는 "위무왕(魏武王)"이라 새긴 석패가 나와 무덤 주인을 증언했다 — 박장 유언대로 금은 대신 돌 명패였다.'],
 [220,0,'진수와 후대의 평','진수의 채점표는 명확하다 — "비상한 사람이요, 세상을 뛰어넘은 걸물(非常之人 超世之傑)". 신불해·상앙의 법과 한신·백기의 용병을 한 몸에 갖췄다는 극찬이다. 이 평가가 뒤집힌 것은 천년 뒤 — 남송이 북방에 쫓겨 내려가자 사대부들은 정통성을 잃은 처지를 촉한에 포개기 시작했고, 주자학이 이를 굳혔다. 무대 위의 조조 분장이 하얗게 굳어 간 것도 이 무렵부터다. 연의의 간웅 조조는 그러니까 3세기의 기록이 아니라 12세기의 정치가 만든 얼굴이다 — 역사 인물의 평판에도 연대기가 있다.',0,'<b>출전</b> 『삼국지』 위서 무제기 평(評)<br><b>연의</b> 소설 전체가 이 평의 반대 진술이다<br><b>덧붙임</b> 조조상의 변천사 — 당 태종은 그의 묘에 제문을 바쳤고, 북송 진종 대까지도 관우보다 조조의 사당이 성했다. 남송에서 뒤집힌 평가는 경극의 흰 얼굴로 굳었고, 20세기에 곽말약 등이 명예 회복 운동을 벌였다 — 한 인물의 평판이 천오백 년째 정치 지형을 따라 출렁이는 중이다.'],
]},
{name:'위 — 조비·조예', sub:'WEI · CAO PI · CAO RUI',
 spans:[[220,226,'문제 조비'],[226,239,'명제 조예'],[239,249,'조방과 조상'],[249,266,'사마씨의 위',1]],
