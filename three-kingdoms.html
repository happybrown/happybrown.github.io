 [264.25,1,'낙불사촉','낙양의 연회에서 사마소가 촉의 음악을 연주시켰다 — 촉의 옛 신하들이 고개를 떨구고 우는데 유선 혼자 웃으며 구경했다. 촉이 그립지 않으시오? "이곳이 즐거워 촉 생각이 나지 않습니다(此間樂 不思蜀)." 옛 신하 극정이 민망해 코치했다 — 다음엔 눈물을 머금고 선친의 묘가 서쪽에 있어 슬프다 하십시오. 사마소가 다시 묻자 유선이 시킨 대로 읊었고, 사마소가 웃었다. "어째 극정의 말투 같소이다?" 유선이 눈을 동그랗게 떴다. "맞습니다, 그가 시켰습니다." 좌중이 폭소했다 — 『한진춘추』의 기록이다. 천치의 대답인가, 목숨을 산 연기인가. 확실한 것은 하나 — 망국의 군주 중 그만큼 편안히 죽은 사람이 드물다는 것이다.',0,'<b>출전</b> 배송지 주 『한진춘추』<br><b>연의</b> 제119회<br><b>덧붙임</b> 이 일화의 다른 독법 — 같은 자리에서 촉의 옛 신하들이 모두 눈물을 흘렸는데 유선만 웃었다는 것은, 뒤집으면 사마소가 촉 유신들의 충성심을 시험하는 자리였다는 뜻이다. 어리석음의 연기든 진짜 어리석음이든, 그 자리의 정답이 "생각나지 않는다"였던 것만은 분명하다 — 고국을 그리워한 폐군의 말로가 어떤 것인지, 유선은 알고 있었을 것이다.'],
 [271,0,'유선의 죽음','안락공(安樂公) — 사마소가 유선에게 준 작위의 이름부터가 뼈 있는 농담이었다. 유선은 그 이름값대로 낙양에서 8년을 평안히 살다 예순다섯에 죽었다. 재위 41년, 삼국의 모든 황제 중 가장 길다. 촉의 옛 신하들은 대부분 진나라에서 벼슬을 얻었고 진수도 그중 하나였다 — 망한 나라의 사관 출신이 승전국에서 그 역사를 쓰게 된 것이다. 촉한은 삼국 중 유일하게 사관(史官)을 두지 않아 제 기록이 가장 얇았다 — 그 빈 공간을 훗날 전설과 소설이 채운다. 기록이 가장 적은 나라가 이야기는 가장 많은 나라가 된 역설의 출발점이다.',0,'<b>출전</b> 『삼국지』 촉서 후주전<br><b>연의</b> 제119회 이후 언급 없음<br><b>덧붙임</b> 유선의 자손은 서진의 팔왕의 난과 영가의 난 와중에 대부분 절멸했다 — 촉한 황통은 그렇게 끊겼다. 훗날 흉노 유연(劉淵)이 한(漢)을 칭하며 유선을 효회황제(孝懷皇帝)로 추존했다 — 망한 촉한의 정통성을 흉노가 상속을 주장한, 오호십육국식 역사 재활용이다.'],
]}]},
{name:'오 (吳)', rows:[
{name:'손견·손책', sub:'SUN JIAN · SUN CE',
 spans:[[172,192,'손견 — 한의 장수'],[192,200,'손책 — 강동 평정'],[200,281,'손씨의 강동',1]],
 events:[
 [206,1,'태사자의 죽음','신정에서 손책과 맞붙어 투구를 빼앗던 그 태사자다 — 훗날 손책에게 사로잡히자 손책이 손수 결박을 풀며 물었다. "신정에서 그대가 나를 잡았다면 어찌했겠소?" "알 수 없지요." 손책이 크게 웃고 그를 중용했다. 유요의 패잔병 만여 명을 수습해 오겠다고 하자 다들 안 돌아온다 했지만 손책은 보냈고 — 태사자는 기한에 맞춰 돌아왔다. 마흔하나에 병으로 죽으며 남긴 탄식을 『오서』가 전한다. "대장부로 세상에 났으면 일곱 자 검을 차고 천자의 계단에 올라야 하거늘, 뜻을 펴지 못하고 어찌 죽는단 말인가!" 연의는 이 사내를 9년 뒤 합비 전장에서 다시 죽였다 — 병사(病死)가 아까웠던 것이다.',0,'<b>출전</b> 『삼국지』 오서 태사자전, 배송지 주 『오서』(유언)<br><b>연의</b> 제53회 — 합비 전사로 개작<br><b>덧붙임</b> 태사자의 첫 명성은 북해 포위전 — 공융을 구하러 필마로 포위망을 뚫고 유비에게 원군을 청했다. 유비가 "공북해가 세상에 나 유비를 알아준단 말인가" 감격해 3천을 내준 그 일화의 배달부다. 조조가 그를 탐내 당귀(當歸) — 마땅히 돌아오라는 뜻의 약재 — 를 상자에 담아 보냈다는 기록도 있다 — 헤드헌팅의 품격이 남다른 시대였다.'],
 [210.2,0,'손견의 옛 부곡 — 정보·황개·한당','손견이 남긴 진짜 유산은 사람이었다 — 정보·황개·한당, 아버지를 따라 일어나 아들 둘을 차례로 섬긴 3대 근속의 장수들이다. 정보는 적벽에서 주유와 좌우 도독을 나눠 맡은 원로였고 — 젊은 주유에게 여러 번 텃세를 부리다 끝내 감복해 "주공근과 사귀는 것은 좋은 술을 마시는 것 같다"는 명언을 남긴 그 사람이다. 황개는 화공의 발안자이자 사항선의 선장이었고, 한당은 이릉까지 싸웠다. 이들의 부곡이 아들에게 세습되는 관행이 그대로 오나라의 병제가 되었으니 — 손오라는 나라는 창업 공신단의 지분 회사에 가까웠다.',0,'<b>출전</b> 『삼국지』 오서 정보전·황개전·한당전<br><b>연의</b> 전편에 걸쳐 등장<br><b>덧붙임</b> 황개는 지방관으로도 전설이었다 — 산월 반란 지역 아홉 현을 돌며 부임 즉시 평정해 "황개가 온다"는 말만으로 소요가 가라앉았다 한다. 정보는 정공(程公)이라 불린 유일한 오나라 장수 — 나이와 서열의 상징이었다. 손견의 유산 목록에서 가장 값진 항목은 역시 사람이었다.'],
 [200.17,1,'우길을 죽이다','강동에 우길이라는 도사가 있어 부적과 물로 병을 고치니, 손책의 부하와 빈객까지 절반이 그를 신처럼 모셨다 — 손책이 누각에서 잔치를 여는데 손님들이 아래로 지나가는 우길에게 우르르 절을 하러 내려간 것이다. 격노한 손책은 요망하다며 그를 처형했다. 『강표전』은 그 뒤를 으스스하게 잇는다 — 거울을 볼 때마다 우길이 비치고, 성난 손책이 거울을 내리치다 상처가 터져 죽었다는 것이다. 배송지는 연대가 안 맞는다며 의심을 달았지만, 연의 제29회는 이 유령담을 그대로 살렸다 — 소설조차 손책의 요절에는 초자연의 설명이 필요했던 모양이다.',0,'<b>출전</b> 배송지 주 『강표전』·『수신기』 — 배송지가 연대 의문 제기<br><b>연의</b> 제29회<br><b>덧붙임</b> 『수신기』는 동진 간보(干寶)의 지괴(志怪) 소설집 — 역사서가 아니라 괴담집이 출전인 셈이다. 우길은 『태평경』 계통의 도사로 전해져, 이 처형담은 강남 민간 도교와 신흥 군벌의 충돌 기록으로도 읽힌다 — 손책이 죽인 것은 도사 하나가 아니라 제 지역의 민심 네트워크였는지 모른다.'],
 [184.42,0,'손견의 등장','오군 부춘의 열일곱 살 소년이 아버지와 배를 타고 가다 해적 떼를 만났다. 소년은 칼을 들고 뭍에 올라 손짓으로 군사를 지휘하는 시늉을 했다 — 관병이 온 줄 안 해적들이 재물을 버리고 흩어졌고, 소년은 쫓아가 하나의 목을 베어 왔다. 손견의 데뷔전이다. 이후 황건을 치고 양주의 반란을 진압하며 "용맹하고 굳세며 기이한 절개가 있다"는 정사의 평을 얻었다. 손씨 왕조의 시조 자본은 땅도 가문도 아닌, 이 사람이 몸으로 모은 부곡(部曲) — 사병 집단이었다.',0,'<b>출전</b> 『삼국지』 오서 손파로토역전<br><b>연의</b> 제2회<br><b>덧붙임</b> 오서는 손씨를 손무(孫武)의 후예라 적었다 — 『손자병법』의 그 손자다. 사실 여부보다 이 계보 주장 자체가 신흥 무가(武家)의 자기 브랜딩이었다. 손견의 아내 오부인은 그의 청혼을 "경박하고 교활하다"며 친정이 반대했으나 "화를 부를까 두렵다"며 스스로 승낙했다 — 강동의 국모가 된 결혼의 시작은 반협박이었다.'],
 [190.08,0,'왕예와 장자를 죽이다','반동탁 깃발을 들고 북상하는 길에 손견의 칼은 동탁군보다 먼저 아군 쪽 인사를 벴다. 평소 저를 무장이라 깔보던 형주자사 왕예를 핍박해 금가루를 삼키고 죽게 했고, 군량 조달을 거부한 남양태수 장자는 군문에 끌어내 목을 베었다 — 조정이 임명한 고관 둘이 행군 경로에서 지워진 것이다. 정사에 그대로 실린 이 살벌한 행보는 연의가 그린 충직한 의군(義軍)의 그림과 사뭇 다르다. 다만 효과는 확실해서 "이후 가는 곳마다 군량이 늦는 법이 없었다." 난세의 보급이란 이런 식으로 돌아갔다.',0,'<b>출전</b> 『삼국지』 오서 손파로토역전 배송지 주 『오록』<br><b>연의</b> 다루지 않음 — 소설의 손견은 흠 없는 의군<br><b>덧붙임</b> 왕예 처형의 명분은 "죄를 모른다(坐無所知)"는 황당한 문답으로 남아 있다 — 죽어야 할 이유를 묻는 왕예에게 손견이 한 대답이 그것이었다. 형주자사와 남양태수의 연쇄 공석 — 이 행정 공백에 유표가 들어서니, 손견은 제 손으로 평생의 적수를 임명한 셈이 되었다.'],
 [191.17,0,'양인 전투와 화웅 참살','반동탁 연합군 가운데 실제로 동탁군을 꺾은 부대는 손견의 것이 유일하다. 한 번 패해 부하 조무에게 제 붉은 두건을 씌워 추격을 따돌리는 위기까지 겪은 뒤, 양인에서 전열을 다시 짜 동탁군을 대파하고 도독 화웅의 목을 베었다 — 연의가 관우에게 옮겨 준 바로 그 전공의 원 주인이다. 다급해진 동탁이 혼인 동맹을 제안하자 손견이 일갈했다. "동탁은 하늘을 거스른 무도한 자다. 그 삼족을 멸해 천하에 보이지 못하면 나는 죽어도 눈을 감지 못한다!" 동탁이 두려워한 것은 원소의 격문이 아니라 이 사내의 칼이었다.',0,'<b>출전</b> 『삼국지』 오서 손파로토역전<br><b>연의</b> 제5회 — 전공은 관우에게<br><b>덧붙임</b> 양인 대승 직전 손견은 참소를 당했다 — 원술이 "손견이 낙양을 얻으면 제어 불능"이라는 말에 군량을 끊은 것이다. 손견이 밤새 백 리를 달려와 땅에 금을 그으며 따지자 원술이 부끄러워 군량을 다시 보냈다 — 아군의 참소와 싸운 뒤에야 적군과 싸울 수 있었던, 연합군의 실상이다.'],
 [191.25,1,'낙양 입성과 전국옥새','손견이 밀고 들어간 낙양은 잿더미였다 — 그는 불탄 종묘를 쓸고 태뢰의 예로 제사부터 지냈다. 그런데 성 남쪽 우물에서 아침마다 오색 기운이 서린다는 보고가 왔다. 물속에서 건져 올린 것은 옥새 — "하늘의 명을 받았으니 수명이 길이 창성하리라(受命于天 旣壽永昌)" 여덟 자가 새겨진 전국옥새였다고 『오서』와 『산양공재기』가 전한다. 배송지는 실어 두었고, 후대 사가들은 진위를 의심했다. 진짜였든 아니든 이 돌덩이의 저주는 확실했다 — 옥새를 물려받은 원술은 황제를 참칭하다 피를 토하고 죽는다.',0,'<b>출전</b> 배송지 주 『오서』·『산양공재기』<br><b>연의</b> 제6회<br><b>덧붙임</b> 옥새의 스펙 — 진시황이 화씨벽으로 만들었다는 사방 네 치의 인장으로, 이사(李斯)의 전서 여덟 자가 새겨졌고 왕망 찬탈 때 태후가 던져 모서리가 깨져 금으로 때웠다는 이력까지 전한다. 손견 사후 원술이 그 아내를 겁박해 빼앗았다 — 옥새의 이동 경로가 곧 야심의 이동 경로였다.'],
 [191.92,0,'손견의 전사','원술의 명으로 유표를 치던 손견은 연전연승 끝에 양양을 에워쌌다 — 그리고 달아나는 황조를 혼자 앞질러 쫓다 현산 대숲의 복병에게 죽었다. 서른일곱. 몰년마저 사서가 다툰다 — 본전은 초평 3년(192), 『자치통감』은 초평 2년(191). 연의는 그를 강동의 호랑이로 완성해 두었지만, 정사의 손견은 끝내 제 땅 한 뼘 없이 원술의 장수로 죽었다. 다만 유산이 남달랐다 — 백전의 부곡과 정보·황개·한당이라는 사람들. 이 유산으로 아들 하나는 강동을 열고, 다른 하나는 황제가 된다.',0,'<b>출전</b> 『삼국지』 오서 손파로토역전 — 기년 이설 병존<br><b>연의</b> 제7회<br><b>덧붙임</b> 시신은 환계라는 부하가 유표 진영에 들어가 되찾아 왔다 — 곡아에 묻혔고, 훗날 손권이 무열황제로 추존한다. 『영웅기』는 여공(呂公)의 매복병이 굴린 돌에 맞아 죽었다는 판본을 전한다 — 화살이든 돌이든, 서른일곱 맹장의 죽음치고는 허망하게 조용한 산길이었다.'],
 [194,0,'손책과 원술','아버지를 잃은 열여덟 손책이 원술을 찾아가 아버지의 옛 부곡을 돌려받았다 — 수천도 아닌 천여 명이었다. 원술은 이 청년을 볼 때마다 감탄했다. "내게 손랑 같은 아들이 있다면 죽어도 여한이 없겠다." 감탄만 했다 — 약속한 구강태수 자리도, 여강태수 자리도 두 번 다 딴 사람에게 주었다. 손책은 내색하지 않고 때를 쟀다. 훗날 강동 평정의 종잣돈이 된 것은 원술이 준 벼슬이 아니라, 원술이 두 번 어긴 약속이었다 — 배신은 때로 가장 확실한 독립 자금이다.',0,'<b>출전</b> 『삼국지』 오서 손토역전<br><b>연의</b> 제15회<br><b>덧붙임</b> 이 시기 손책은 원술의 사고뭉치 해결사였다 — 여강 공략 2년의 공을 세우고도 태수 자리는 또 딴 사람에게 갔다. 주치·여범 같은 아버지의 옛 사람들이 이 무명 시절부터 곁을 지켰다 — 원술의 약속 위반이 쌓일수록 손책 사단의 결속은 단단해졌으니, 배신의 역설적 공로다.'],
 [195,0,'강동 평정','손책은 옥새를 원술에게 맡기고(담보였다) 병사 천여 명을 얻어 강을 건넜다 — 스무 살의 창업이다. 가는 길에 무리가 5~6천으로 불었다. 유요를 쫓고 엄백호를 깨고 왕랑을 사로잡으며 5년 만에 강동 여섯 군을 평정했는데, 비결이 칼만은 아니었다 — "군령이 엄해 병사가 백성의 것을 감히 빼앗지 못하니, 백성들이 다투어 소와 술을 들고 군문을 찾아왔다"고 정사가 적는다. 웃기를 좋아하고 농담을 잘해 사람들이 목숨을 아끼지 않고 따랐다는 이 청년을, 사람들은 손랑(孫郎) — 손씨네 도련님이라 불렀다.',0,'<b>출전</b> 『삼국지』 오서 손토역전<br><b>연의</b> 제15회<br><b>덧붙임</b> 손책의 미모는 정사가 공인한다 — "얼굴이 아름답고 웃으며 말하기를 좋아해(美姿顔 好笑語)" 사졸과 백성이 목숨을 아끼지 않았다. 항복한 태사자에게 병력을 주어 보내고, 잡은 왕랑을 예우해 놓아준 것도 이 시기 — 정복 속도의 비결은 칼만큼이나 이 개방성이었다. 다만 오군의 명사 고대(高岱)를 참소에 넘어가 죽인 그늘도 있다.'],
 [195.5,0,'주유의 합류','손책이 강을 건넌다는 소식에, 같은 나이의 죽마고우 주유가 병사와 군량과 배를 이끌고 마중을 나왔다 — 열아홉 살 둘이 합작해 강동 정벌이 시작된 것이다. 손책이 기뻐 외쳤다. "그대를 얻었으니 일은 다 된 것이다(吾得卿 諧也)." 뒷날 두 사람은 교공의 두 딸을 나란히 아내로 맞았다 — 손책이 대교, 주유가 소교. 정사는 미모 서사 없이 이 혼인과 손책의 농담 한 줄만 남겼다. "교공의 두 딸이 난리에 유랑했어도 우리 둘을 사위로 얻었으니, 그만하면 기뻐할 만하지 않은가." 소설과 시가 천년을 우려먹은 커플의 원본 기록은 이 한 줄이다.',0,'<b>출전</b> 『삼국지』 오서 주유전<br><b>연의</b> 제15회<br><b>덧붙임</b> 두 사람의 인연은 소년기로 거슬러 간다 — 손견이 동탁 토벌에 나설 때 가족이 서(舒)로 이사했고, 주유가 큰 길가 저택을 통째로 내주며 "당(堂)에 올라 어머니께 절하는(升堂拜母)" 사이가 되었다. 동갑내기 명문가 자제가 몰락 무가의 아들에게 집을 내준 것 — 강동 정권의 주춧돌은 이 우정이었다.'],
 [197,0,'원술과 절연','원술이 황제를 칭하자 손책이 편지를 보내 절연을 선언했다 — 은인이자 상관이던 사람을 명분 하나로 잘라 낸 것이다. 손익계산은 완벽했다. 조조의 조정이 반색하며 그를 토역장군·오후에 봉하니, 참칭자의 부하가 하루아침에 한나라 공인 제후가 되었다. 조조는 이 청년이 내심 무서웠다 — "사자 새끼 같은 자와는 다투기 어렵다(猘兒難與爭鋒也)" 하고는 사돈을 맺어 달랬다. 스물둘에 명분과 실리와 공포를 한꺼번에 챙긴 절교 — 정치 감각도 유전이었던 모양이다.',0,'<b>출전</b> 『삼국지』 오서 손토역전<br><b>연의</b> 제17회<br><b>덧붙임</b> 절연장을 쓴 것은 장굉으로 전한다 — 서주 난민 출신의 문장가가 강동 정권의 외교 문서를 도맡았다. 조조가 보낸 회유책에는 벼슬과 혼사에 더해 "손책의 아우 손권·손익을 무재(茂才)로 천거"하는 항목까지 있었다 — 훗날의 오대제(吳大帝)가 처음 중앙 문서에 등장하는 것이 이 인질성 천거 명단이다.'],
 [199.92,0,'환성과 황조','여강의 환성을 꾀로 얻고 — 원술이 죽은 뒤 그 유산 다툼의 승자가 손책이었다 — 이어 서쪽 사선에서 아버지의 원수 황조의 수군을 박살 냈다. 배 6천 척과 시체가 강을 덮은 대승이었다. 예장까지 항복받으니 강동 6군이 완성되었다. 스물네 살, 회계태수 겸 토역장군, 병력 수만 — 그리고 이 청년의 다음 계획서에는 놀라운 항목이 적혀 있었다. 조조와 원소가 관도에서 맞붙은 틈에 허도를 급습해 천자를 모셔 온다는 것. 실행되었다면 삼국지 전체가 다시 쓰였을 문장이다.',0,'<b>출전</b> 『삼국지』 오서 손토역전<br><b>연의</b> 제38회 전후(황조전은 손권 대로 이동)<br><b>덧붙임</b> 환성 접수의 전리품에 교공의 두 딸이 있었다 — 대교·소교의 혼인이 바로 이 원정의 결과다. 사선 전투에서는 유표의 조카 유호의 수군을 궤멸시키고 배 6천 척을 노획했다 — 강하의 황조는 목숨만 건져 달아났고, 원수 갚기는 아우의 몫으로 넘어갔다.'],
 [200.25,0,'손책의 죽음','허도 급습 준비가 진행되던 그봄, 손책은 단도의 산에서 사냥 중이었다 — 준마를 탄 그가 호위를 멀찍이 따돌린 순간, 숲에서 세 사람이 나타났다. 손책에게 처형당한 오군태수 허공의 문객들 — 주인의 원수를 갚으러 몇 달을 숨어 기다린 자들이었다. 화살이 뺨에 박혔다. 상처가 깊어 자리에 누운 손책은 거울을 보고 통탄했다 — "얼굴이 이 지경이 되어 어찌 다시 공업을 세우랴." 그날 밤 죽었다. 스물여섯. 진수의 평이 매정하도록 정확하다. "경솔하고 조심성이 없어(輕佻果躁) 몸을 잃었다." 강동을 5년에 평정한 속도가, 그를 죽인 속도이기도 했다.',4,'<b>출전</b> 『삼국지』 오서 손토역전, 배송지 주 『구주춘추』<br><b>연의</b> 제29회<br><b>덧붙임</b> 곽가의 원격 예언이 유명하다 — "손책은 필부의 손에 죽을 것"이라며 조조 진영의 강동 공포론을 잠재웠던 것이다(곽가전). 허공의 문객들은 이름도 안 남은 자들이었다 — 강동의 사자를 죽인 것이 천하 제후가 아니라 무명 자객 셋이었다는 사실이, 곽가의 인물평을 영원히 증명했다.'],
 [200.25,0,'"밖의 일은 주유에게, 안의 일은 장소에게"','죽어 가는 손책이 열아홉 아우에게 인수를 채워 주며 남긴 말은 냉정한 적성 평가였다. "강동의 무리를 이끌고 두 진영 사이에서 승부를 겨루는 일은 네가 나만 못하다. 그러나 어진 이를 세우고 능한 이에게 맡겨 각자 힘을 다하게 해 강동을 지키는 일은 — 내가 너만 못하다." 정복자의 나라를 경영자에게 물려준 것이다. 그리고 그 판단은 소름 돋게 맞았다 — 손권은 평생 전장에서 이긴 적이 거의 없지만, 사람을 쓰는 것으로 두 형제 중 유일하게 황제가 되었다. 유언이 곧 국가 전략이 된 드문 사례다.',4,'<b>출전</b> 『삼국지』 오서 장소전(내사 위임) — 손책전의 유언과 종합<br><b>연의</b> 제29회<br><b>덧붙임</b> 장소에게는 더 무거운 말도 남겼다 — "중모(仲謀, 손권)가 감당하지 못하거든 그대가 스스로 취하라(君便自取之)." 유비가 백제성에서 제갈량에게 한 그 말의 원조가 23년 앞서 여기 있다 — 강동과 촉한, 두 정권 모두 창업자의 "자취(自取)" 유언 위에 섰다는 것은 묘한 대칭이다.'],
]},
{name:'손권', sub:'SUN QUAN',
 spans:[[200,222,'강동의 주인'],[222,229,'오왕'],[229,252,'오 대제'],[252,281,'손씨의 마지막',1]],
 events:[
 [220.3,0,'감녕의 죽음','비단 돛에 방울을 달고 다니던 장강의 해적 두목 — 금범적(錦帆賊) 감녕은 황조를 거쳐 손권에게 왔고, 온 날부터 형주 공략의 전략 보고서를 올린 특이한 사내였다. 유수에서는 결사대 백 명과 소를 잡아 먹인 뒤 밤중에 조조 진영을 휘젓고 한 명도 잃지 않고 돌아왔다 — 손권이 기뻐 외쳤다. "맹덕에게 장료가 있다면 내게는 흥패가 있다(孟德有張遼 孤有興霸)." 성정이 거칠어 요리사를 죽이고 능통과 원수지간이 되는 사고뭉치였으나, 손권은 "그 거친 것까지가 감녕"이라며 품었다. 몰년은 220년 전후로 추정될 뿐이다 — 연의는 그를 이릉에서 화살로 죽였지만, 정사의 해적왕은 조용히 병으로 갔다.',0,'<b>출전</b> 『삼국지』 오서 감녕전<br><b>연의</b> 제83회 — 이릉 전사로 개작<br><b>덧붙임</b> 감녕의 잔혹 일화도 정사에 있다 — 주방 심부름꾼 소년이 잘못을 저지르고 여몽에게 피신하자, 돌려받은 뒤 약속을 깨고 나무에 묶어 쏘아 죽였다. 격노한 여몽과 칼부림 직전까지 간 것을 여몽의 어머니가 말렸다 — 오나라 무장들의 관계는 이렇게 날것이었고, 손권은 그 야성까지 전력으로 관리했다.'],
 [236,0,'장소의 죽음','장소는 평생 손권의 목에 걸린 가시이자 기둥이었다 — 적벽 때 항복을 주장한 원죄 탓에 두 번이나 승상 후보에서 밀렸다. 손권의 변명이 걸작이다. "승상은 일이 많은 자리인데 이 어른은 성정이 강해, 내 말을 안 들으면 서로 원망만 쌓일 것이오." 그러면서도 매번 절하고 조언을 구했고, "장공이 자리에 계시면 나는 감히 함부로 말하지 못했다"고 실토했다. 여든하나로 죽을 때까지 군주에게 직언을 멈추지 않은 노인 — 시호는 문후(文侯)였다. 창업 군주에게 가장 필요한 신하는 예스맨이 아니라 무서운 어른이라는 것을, 손권은 알았고 그래서 참았다.',0,'<b>출전</b> 『삼국지』 오서 장소전<br><b>연의</b> 후반부에서 조용히 퇴장<br><b>덧붙임</b> 손권의 짓궂은 농담 한 토막 — 술자리가 과해지자 장소가 정색하고 "주지육림은 망국의 일"이라 하니, 손권이 머쓱해 잔치를 접었다. "내가 장공과 말할 때는 감히 함부로 하지 못한다"는 실토가 이런 자리들의 총결산이다. 위왕 책봉 사신 앞에서 통곡한 것도 장소였다 — 강동의 자존심이 늙은 문신 한 사람에게 얹혀 있었다.'],
 [241.5,0,'제갈근의 죽음','제갈근은 아우 제갈량과 정반대의 재능으로 대장군까지 올랐다 — 언변이 아니라 침묵의 사람이었던 것이다. 손권이 노할 일이 있으면 정면으로 간하는 대신 화제를 슬쩍 돌려 비슷한 사례로 에둘러 짚었고, 손권의 노기는 저절로 풀렸다. 촉과의 외교를 도맡으면서도 아우와는 공석에서만 만나고 사석을 두지 않았다 — 두 나라 모두 형제를 의심하지 않은 비결이다. 한 집안이 삼국에 갈라져 벼슬했다 — 형은 오의 대장군, 아우는 촉의 승상, 사촌 제갈탄은 위의 정동대장군. 『세설신어』가 남긴 세평이 재미있다. "촉은 용을 얻었고, 오는 범을 얻었고, 위는 개를 얻었다."',0,'<b>출전</b> 『삼국지』 오서 제갈근전<br><b>연의</b> 조연으로 산재<br><b>덧붙임</b> "촉은 용, 오는 범, 위는 개" — 『세설신어』의 이 삼형제 품평에서 개(狗)를 얻은 사촌 제갈탄조차 위나라의 정동대장군이었다. 손권의 신뢰 선언이 남아 있다 — "자유(子瑜, 제갈근)와 나는 생사를 바꾸지 않을 맹세가 있다. 그가 나를 저버리지 않음은 내가 그를 저버리지 않음과 같다." 아우가 적국의 승상인 사람에게 준 신원 보증서였다.'],
 [253.7,0,'제갈각의 죽음','제갈근의 맏아들 제갈각은 오나라 최고의 신동이었다 — 손권이 그 아버지를 놀리려 당나귀 얼굴에 "제갈자유"라 써 붙이자, 어린 제갈각이 붓을 청해 두 글자를 보탰다. "제갈자유의 당나귀(之驢)." 좌중이 폭소했고 당나귀는 상으로 받았다. 손권 사후 대장군으로 정권을 잡고 동흥에서 위군을 대파하며 명성이 절정에 올랐는데 — 여기서 취했다. 이듬해 20만 총동원령으로 신성을 쳤다가 역병으로 태반을 잃고도, 돌아와 제 위신을 지키려 숙청부터 벌인 것이다. 결국 손준이 연회에 초대해 목을 벴다 — 시체는 갈대 자리에 말려 버려졌다. 아버지 제갈근이 생전에 남긴 예언이 있었다. "이 아이는 집안을 키우지 못하고 망칠 아이다."',0,'<b>출전</b> 『삼국지』 오서 제갈각전<br><b>연의</b> 제108회<br><b>덧붙임</b> 파국 전날 밤의 불길한 기록들 — 세수하는 물에서 피비린내가 나고, 개가 옷을 물어 당겼다고 제갈각전이 적는다. 정사가 이런 괴이(怪異)를 실은 것 자체가 당대의 민심 — 모두가 그 연회의 결말을 알고 있었다는 뜻이다. 삼족이 멸한 뒤, 아버지 제갈근의 무덤만은 온전했다 — "그 아버지의 어짊" 덕이라고 사람들이 말했다.'],
 [271.5,0,'정봉의 죽음','정봉은 손권 초년의 졸병에서 시작해 오나라 최후의 대장군까지 올라간, 왕조의 처음과 끝을 다 본 사내다. 대표작은 동흥 전투 — 한겨울 눈보라 속에서 "적이 우리를 얕보는 지금이 기회다"라며 병사들에게 갑옷을 벗기고 짧은 칼만 들려 제방 위의 위군을 급습, 대승을 거뒀다. 설중분단병(雪中奮短兵) — 눈 속에 웃통 벗은 결사대라는 그림 같은 전공이다. 손휴를 도와 권신 손침을 제거한 정치 감각까지 갖췄던 노장은 271년에 죽었다 — 그리고 3년 뒤 육항마저 죽자, 오나라에는 전선을 맡길 이름이 더 남지 않았다. 나라보다 사람이 먼저 소진된 것이다.',0,'<b>출전</b> 『삼국지』 오서 정봉전<br><b>연의</b> 제108회(설중분단병)<br><b>덧붙임</b> 정봉의 커리어는 오나라 무장사의 축도다 — 감녕·육손·반장의 휘하를 차례로 거치며 "싸울 때마다 으뜸(戰鬥常冠軍)"이라는 평을 얻었고, 소교위에서 대장군까지 올라갔다. 죽은 이듬해 손호가 옛 원한을 물어 그 가족을 유배 보냈다 — 나라를 지킨 노장의 사후 대우가, 그 나라의 남은 수명을 말해 주고 있었다.'],
 [209,4,'감로사와 손부인','감로사의 상견례 — 오국태가 사윗감 유비를 살펴보고 한눈에 반하고, 유비가 바위를 칼로 가르며 천하를 점치는 연의 제54회의 명장면들은 모두 창작이다. 손권의 어머니 오태부인은 그 혼인 7년 전에 이미 세상을 떠났으니 상견례 자체가 성립하지 않는다. 정사의 기록은 건조하다 — 손권이 누이를 유비에게 시집보내 동맹을 굳혔다. 끝. 그 누이의 이름조차 사서에 없다 — 손상향은 후대 희곡이 지어 준 이름이고, 유비를 그리다 강에 몸을 던졌다는 결말도 물론 소설이다. 사서의 여백이 클수록 이야기는 화려해진다 — 손부인은 그 공식의 대표 사례다.',0,'<b>출전</b> 창작 — 혼인 기사는 『삼국지』 촉서 선주전<br><b>연의</b> 제54~55회<br><b>덧붙임</b> "주랑묘계안천하(周郎妙計安天下), 부인도 잃고 군사도 꺾였네" — 이 조롱가는 연의가 만든 후렴이지만, 미인계 실패담 자체는 진강 감로사의 현지 전설과 결합해 관광 자원이 되었다. 유비가 칼로 갈랐다는 시검석(試劍石)이 지금도 감로사에 있다 — 소설이 바위에 남긴 칼자국이다.'],
 [220.5,0,'세습영병제','오나라 군대의 이상한 규칙 하나 — 장수가 죽으면 그 부대를 아들이나 아우가 상속받는다. 세습영병제다. 병사들은 장수 집안의 소작농을 겸했고, 국가는 그 지휘권을 함부로 회수하지 못했다 — 군대라기보다 무장한 가업(家業)에 가까웠다. 창업 공신들의 부곡에서 출발한 나라, 강동 호족의 연합체라는 오나라의 태생이 제도에 그대로 굳은 것이다. 덕분에 결속은 단단했으나 대가도 분명했다 — 국가가 총력을 모아 북진하는 일이 구조적으로 어려웠다. 오가 수비에 강하고 원정에 약했던 비밀이 이 상속 제도 안에 있다.',0,'<b>출전</b> 『삼국지』 오서 여러 전의 부곡 상속 기사 종합<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 사례가 제도를 증언한다 — 능통이 죽자 그 병력은 낙통이 이어받았고, 진표는 아버지 진무의 부곡을 물려받았으며, 어린 능통의 두 아들은 손권이 궁에서 거두어 길렀다. 장수의 사병에는 둔전·면세 특권이 붙어 세병제(世兵制)와 복객제(復客制)가 한 묶음이었다 — 오나라는 국가라기보다 군사 지주 연합에 가까웠다.'],
 [236,0,'대전(大錢)과 물가','전쟁 비용이 바닥나자 손권이 화폐 마술을 부렸다 — 500전짜리 대전을 찍더니, 내친김에 당천대전(當千大錢), 즉 1,000전짜리 동전까지 발행한 것이다. 구리 함량은 몇 배인데 액면가는 천 배 — 노골적인 재정 착취였다. 물가가 치솟고 백성이 동전을 기피하자 시장이 마비되었다. 결국 손권은 8년 만에 백기를 들었다 — 대전을 회수해 녹여 그릇을 만들라는 조서를 내린 것이다. 실패를 공식 인정한 드문 사례다. 촉의 직백전은 관영 시장을 안전판 삼아 굴러갔지만 오의 대전은 시장의 신뢰를 잃었다 — 같은 처방, 다른 운명이었다.',0,'<b>출전</b> 『삼국지』 오서 오주전 — 주조·회수 조서<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 회수 조서의 문면이 이례적으로 솔직하다 — "백성이 불편하다 하니(百姓不以爲便) 그만둔다"며, 이미 낸 대전은 관에서 실가로 바꿔 주고 손해를 끼치지 말라는 환불 규정까지 달았다. 실패한 정책의 리콜 공고 — 삼국의 경제 문서 중 가장 현대적인 한 장이다.'],
 [200.25,0,'열아홉의 승계','형이 죽자 열아홉 손권은 통곡만 하고 있었다 — 그러자 장소가 호통을 쳤다. "지금이 울고 있을 때입니까!" 상복을 벗기고 갑옷을 입혀 말에 태워 군영을 돌게 했다 — 새 주인이 건재하다는 것을 눈으로 보여 준 것이다. 파구에 나가 있던 주유는 병력을 이끌고 돌아와 신하의 예를 갖췄다 — 무력의 추인이었다. 강동은 아직 설익은 정복지였다. 험한 산엔 복속 안 한 산월이, 저잣거리엔 떠날까 눈치 보는 북방 출신 사인들이 — 그 위태로운 상속을 문(장소)과 무(주유)의 두 기둥이 받쳐 낸 것이다.',4,'<b>출전</b> 『삼국지』 오서 오주전·장소전<br><b>연의</b> 제29회<br><b>덧붙임</b> 손권의 자줏빛 수염(紫髯)은 사료가 보증한다 — 합비에서 장료가 "자줏빛 수염의 장군이 누구냐" 물었다는 『헌제춘추』 기사가 그것이다. 푸른 눈(碧眼)과 벽안아라는 별명은 평화·연의가 보탠 이국적 연출이다. 형 손책의 생전 평가 — "연회 자리를 보라, 다 네 장수가 될 사람들이다" — 는 아우의 사교성이 곧 정치력임을 꿰뚫은 말이었다.'],
 [203,0,'산월 토벌과 병력 확보','오나라의 진짜 국경은 장강이 아니라 안쪽의 산이었다 — 험지마다 산월(山越)이 버티고 서서 세금도 병역도 거부했던 것이다. 손권은 재위 내내 이 안쪽의 전쟁을 벌였다. 규칙은 간명했다 — "강한 자는 병사로 삼고, 약한 자는 호적에 올린다(彊者爲兵 羸者補戶)." 제갈각이 단양 한 곳에서 4만을 뽑아냈을 정도니, 오군의 상당수는 정복당한 산사람들이었던 셈이다. 밖으로는 위와 대치하고 안으로는 산과 싸우는 이중 전선 — 오나라가 북벌에 소극적이었던 이유의 절반은 이 안쪽 사정이었다.',0,'<b>출전</b> 『삼국지』 오서 오주전·제갈각전 등<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 제갈각의 단양 평정법이 교과서적이다 — 산에 들어가 싸우는 대신 평지의 곡식을 다 거두고 목책으로 봉쇄해, 굶주린 산민들이 스스로 내려오게 했다. 항복자를 학대하지 못하게 하는 영까지 세트였다 — 오나라의 내부 식민 정책은 칼보다 봉쇄와 호적이 주무기였다.'],
 [208.17,0,'황조를 베다','아버지 손견을 죽게 한 황조 — 손권은 강하를 세 번 쳤다. 세 번째에 마침내 성이 깨지고, 달아나던 황조는 기병의 손에 목이 잘려 왔다. 손권은 그 머리를 아버지 사당에 바쳤다 — 17년 만의 복수 완성이다. 이 원정의 부수입이 쏠쏠했다 — 항복해 온 감녕이 형주의 허실을 꿰고 있었고, "황조는 늙어 곳간도 군기도 다 헐었습니다. 지금이 형주를 도모할 때입니다"라는 전략 보고서까지 올렸다. 그런데 그 형주를 향해, 넉 달 뒤 북쪽에서 조조가 먼저 내려온다 — 적벽의 시계가 돌기 시작한 것이다.',0,'<b>출전</b> 『삼국지』 오서 오주전·능통전·동습전<br><b>연의</b> 제38~39회<br><b>덧붙임</b> 최후 결전의 승부처는 강을 가로막은 황조의 몽충 두 척이었다 — 동습과 능통의 결사대 백 명이 두 겹 갑옷을 입고 큰 밧줄을 끊어 물길을 열었다. 도주한 황조의 목을 벤 것은 기병 풍칙 — 손권은 그 목을 상자에 담아 아버지 제단에 올렸다. 17년짜리 복수의 마감 서류였다.'],
 [208.83,0,'항전 결정','조조의 편지 한 장에 강동 조정이 두 쪽 났다 — 원로 장소부터 "맞아들이자"는 쪽이었다. 회의가 끝나고 자리를 뜨는 손권을 노숙이 처마 밑까지 쫓아와 속삭였다. "저희 신하들은 항복해도 고향에서 벼슬하며 삽니다. 그러나 장군께서 항복하시면 — 돌아가실 곳이 어디입니까." 시상에서 불려 온 주유가 조조군의 허수를 조목조목 벗겨 내자, 손권이 칼을 뽑아 상주문 놓는 책상 모서리를 내리쳤다. "다시 조조를 맞아들이자 말하는 자는 이 책상과 같으리라!" 스물일곱 살 군주의 이 칼자국에서 적벽이, 그리고 삼국 시대가 시작되었다.',0,'<b>출전</b> 『삼국지』 오서 주유전·노숙전<br><b>연의</b> 제43~44회<br><b>덧붙임</b> 이 회의의 온도를 전하는 디테일 — 조조의 격문이 도착하자 "장소 이하 모두 낯빛을 잃었다(莫不響震失色)." 손권이 자리를 뜰 때 노숙만 따라 나온 것, 시상의 주유를 급히 부른 것 — 주전파는 처음에 단 둘이었다. 다수결이었다면 오나라는 208년에 끝났다.'],
 [211,0,'말릉 천도와 석두성','적벽 이후 손권은 근거지를 오(吳)에서 장강 가의 말릉으로 옮기고 이름을 고쳤다 — 건업(建業), 업(業)을 세운다는 뜻이니 도시 이름부터가 출사표다. 강안 절벽 위에는 석두성을 쌓아 수군 기지를 삼았다. 제갈량이 이 땅을 보고 "종산은 용이 서리고 석두는 호랑이가 웅크렸으니 제왕의 자리(鍾山龍盤 石頭虎踞 帝王之宅)"라 감탄했다는 말이 전해 온다. 과연 — 이 선택 이후 동진과 남조 네 왕조가 줄줄이 같은 자리에 도읍하니, 오늘의 난징이다. 손권의 부동산 감식안은 3백 년짜리였다.',0,'<b>출전</b> 『삼국지』 오서 오주전, 『건강실록』<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> "종산용반 석두호거"의 감탄은 제갈량의 것으로 『태평어람』 등에 전하는 후대 전승이다 — 출처는 흐리지만 입지 평가 자체는 역사가 검증했다. 말릉이라는 이름은 진시황이 이 땅의 왕기(王氣)를 누르려 붙인 격하형 지명이라는 전설도 있다 — 눌렀다는 왕기가 결국 여섯 왕조를 낳았다.'],
 [213,1,'유수구와 "아들을 낳으려면"','조조가 40만을 일컬으며 유수구로 내려왔다 — 그러나 한 달을 두드려도 손권의 방어선은 금 하나 가지 않았다. 손권이 몸소 배를 타고 조조의 진영 앞을 유유히 시찰하고 돌아가자, 멀리서 그 군용의 정연함을 지켜보던 조조가 탄식했다. "아들을 낳으려면 마땅히 손중모 같아야지 — 유경승의 아들들은 개돼지일 뿐이다(生子當如孫仲謀)." 손권이 편지를 보냈다. "봄물이 불어나니 공은 속히 돌아가시지요. 그대가 죽지 않는 한 나는 편할 날이 없겠소." 조조가 웃으며 회군했다 — 두 마디 모두 배송지 주 『오력』이 전하는, 적수끼리의 예의였다.',0,'<b>출전</b> 배송지 주 『오력』<br><b>연의</b> 제61회<br><b>덧붙임</b> 『오력』의 편지에는 추신이 있었다 — 별지에 "足下不死 孤不得安(그대가 죽지 않으면 내가 편안하지 못하다)" 여덟 자만 적혀 있었고, 조조가 "손권은 나를 속이지 않는다"며 웃고 회군했다는 것이다. 협박과 존중이 한 문장에 든 국서 — 두 효웅의 교신은 이 정도 수위에서 놀았다.'],
 [213,1,'화살 맞은 배','『위략』이 전하는 유수구의 다른 장면 — 손권이 큰 배를 타고 조조 진영을 정찰하러 오자, 조조가 활을 퍼부었다. 화살이 배 한쪽에만 잔뜩 박혀 무게로 기울기 시작하자, 손권은 태연히 뱃머리를 돌려 반대쪽으로 마저 맞았다 — 배가 수평을 되찾자 유유히 돌아갔다. 화살로 균형을 잡는 이 배짱과 기지의 주인공은 손권이다. 연의 제46회는 이 일화를 5년 앞 적벽으로 옮기고 주인을 제갈량으로 바꿔, 안개 속에서 화살 십만 대를 꾸어 오는 초선차전으로 재조립했다 — 남의 일화가 남의 신화가 된 대표 사례다.',0,'<b>출전</b> 배송지 주 『위략』<br><b>연의</b> 제46회 — 초선차전의 원형<br><b>덧붙임</b> 같은 정찰전을 『오력』은 다르게 전한다 — 손권이 큰 배로 북 치며 유람하듯 지나가자 조조가 "쏘지 말라" 명하고 "군용이 정제되었다" 감탄만 했다는 판본이다. 화살 세례(위략)와 사격 금지(오력) — 배송지는 두 판본을 나란히 실었고, 연의는 화살 쪽을 가져다 제갈량에게 주었다.'],
 [215.58,0,'합비와 장료의 800기','조조가 한중에 가 있는 틈 — 손권이 10만을 몰아 합비를 쳤다. 수비병은 7천. 그런데 장료가 조조가 남긴 밀함을 열어 보고는 결사대 8백을 뽑아 새벽에 성문을 열고 나왔다. 스스로 이름을 외치며 진을 꿰뚫어 손권의 깃발 아래까지 이르니, 손권은 얼떨결에 높은 무덤 위로 피해 긴 창을 쥐고 버텼다 — 10만이 8백에게 기선을 빼앗긴 것이다. 열흘 만에 포위를 풀고 물러나는 길, 소요진 나루에서 후위의 손권이 다시 기습당해 끊긴 다리를 말째 뛰어넘어 겨우 살았다. 이후 강동에서는 우는 아이에게 "장료 온다" 하면 그쳤다 — 트라우마가 된 승부였다.',8,'<b>출전</b> 『삼국지』 위서 장료전, 오서 오주전<br><b>연의</b> 제67~68회<br><b>덧붙임</b> 조조가 남긴 밀함의 지시 — "적이 오면 장료·이전은 나가 싸우고 악진은 지켜라." 평소 사이가 나쁜 세 장수의 역할을 원격으로 조합한 인사였다. 소요진에서 손권을 놓친 뒤 위군 항졸이 "자줏빛 수염에 상체가 긴 활 잘 쏘는 자"의 정체를 알려 주자 장료가 통탄했다 — 몰라봐서 놓친 대어였다.'],
 [219.83,0,'형주 습격과 칭신','관우가 번성에서 기세를 올리는 동안, 손권은 계산서를 다시 썼다 — 관우가 이기면 형주의 오군 몫은 영영 없다. 조조에게 밀서를 보내 협공을 약조하고 여몽을 풀었다. 그리고 한술 더 떠 조조에게 신하를 칭하며 "천명이 공께 있으니 제위에 오르소서"라는 권진 상소까지 올렸다 — 유비 진영과의 전면전을 앞두고 북쪽을 확실히 잠가 둔 것이다. 조조가 그 상소를 신하들에게 돌려 보이며 껄껄 웃었다. "이 아이가 나를 화롯불 위에 앉히려 하는구나(是兒欲踞吾著爐火上邪)." 서로의 속셈을 훤히 알면서 주고받는 외교 — 어른들의 삼국지다.',0,'<b>출전</b> 『삼국지』 오서 오주전, 위서 무제기<br><b>연의</b> 제75~76회<br><b>덧붙임</b> 개전 명분용 청혼 사건이 앞서 있었다 — 손권이 아들과 관우의 딸을 혼인시키자 청하자 관우가 사자를 꾸짖어 쫓았다. "범의 딸을 개의 아들에게 주랴(虎女焉嫁犬子)"는 명대사는 연의의 윤색 — 정사는 "관우가 그 사자를 욕하고 혼인을 불허했다(罵辱其使)"까지만 적는다. 어느 쪽이든 국혼 거절이 국전(國戰)의 서류가 되었다.'],
 [221,0,'오왕 책봉과 저자세 외교','유비의 복수전이 다가오자 손권은 자존심을 접어 서랍에 넣었다 — 위에 칭신하고 오왕 책봉을 받은 것이다. 조비가 작정하고 무리한 조공을 요구했다. 진주, 비취, 상아, 대모, 공작 — 신하들이 예법에 없는 요구라며 분개하자 손권이 웃으며 말했다. "저들이 보배라 여기는 것이 내게는 기와 조각일 뿐이오(彼所求者 於我瓦石耳). 지금 서쪽에서 백성의 목숨이 걸렸는데 아까울 게 무엇이오." 그러고는 다 보냈다. 굴욕을 물건 값으로 치환하는 이 계산법 — 훗날 구천에 비견된 손권 외교의 진면목이다.',0,'<b>출전</b> 『삼국지』 오서 오주전<br><b>연의</b> 제82회<br><b>덧붙임</b> 위나라 사신 형정이 오만하게 굴자 오의 신하 서성 등이 울분을 터뜨렸다 — "우리가 목숨 걸고 위와 촉을 삼키지 못해 주상께서 이런 굴욕을 당하시는구나." 그 눈물을 본 형정이 "오는 오래 남의 아래 있을 나라가 아니다"라고 본국에 보고했다 — 굴욕 외교의 관객석에서 나온, 가장 정확한 국력 평가였다.'],
 [222.5,0,'이릉의 승리와 육손 기용','유비의 대군 앞에서 손권이 꺼낸 카드는 서른아홉 살 서생 육손이었다 — 휘하의 노장들이 대놓고 불복했다. 손책 때부터의 숙장들과 종실 귀족들이 "글쟁이가 뭘 아느냐"며 명을 흘려듣자, 육손이 칼자루에 손을 얹고 말했다. "내가 서생이긴 하나 주상께서 나를 보내신 것은 참을 줄 아는 것이 내게 있기 때문이오. 국법에는 사사로움이 없소." 손권은 끝까지 육손의 전권을 흔들지 않았고 — 반년 뒤 화공 한 번으로 촉군이 증발했다. 승전 후 육손이 노장들을 탓하지 않자 손권이 물었고, 육손은 "국가의 은혜를 입은 이들이니 함께 이루어야지요"라 답했다. 사람 쓰는 나라의 승리였다.',0,'<b>출전</b> 『삼국지』 오서 육손전<br><b>연의</b> 제83~84회<br><b>덧붙임</b> 전후 논공 자리에서 손권이 물었다 — "그대는 어찌 장수들의 항명을 다 참았는가." 육손의 답 — "그들은 나라의 간성이라, 제가 인상여와 구순(寇恂)이 나라를 위해 몸을 낮춘 고사를 본받고자 했습니다." 손권은 크게 웃고 보국장군을 더했다 — 지휘권 분쟁의 사후 처리까지 고전 인용으로 마감한, 오나라식 win-win 보고서였다.'],
 [222.75,0,'위와 결렬하고 황무 연호를 세우다','이릉에서 이기자마자 손권의 태도가 표변했다 — 조비가 "아들 손등을 인질로 보내라" 하자 갖은 핑계로 미룬 것이다. 격노한 조비가 세 갈래로 남정했으나 장강의 물이 위군을 막았다. 손권은 이참에 연호를 세웠다 — 황무(黃武). 위의 황초(黃初)와 촉의 장무(章武)에서 한 자씩 딴 듯한 이 절묘한 이름과 함께, 오는 어느 쪽의 신하도 아닌 제3의 세력으로 공식 독립했다. 붙었다 떨어지기를 반복한 10년 줄타기의 결산 — 칭신도 결렬도 모두 시간을 사는 수단이었을 뿐, 손권은 처음부터 제 나라를 만들고 있었다.',10,'<b>출전</b> 『삼국지』 오서 오주전<br><b>연의</b> 제85~86회<br><b>덧붙임</b> 인질 요구를 피한 수사가 걸작이다 — 손권은 조비의 사신에게 눈물까지 보이며 "아들이 어려 차마 보내지 못한다"고 했고, 뒤로는 장강 방어선을 완성했다. 유엽이 "손권의 칭신은 위기 모면용"이라 처음부터 경고한 그대로였다 — 위나라는 알면서도 속는 쪽을 택했고, 그 대가로 통일의 적기를 영영 놓쳤다.'],
 [229.25,0,'황제 즉위와 이제(二帝) 병존','무창에서 손권이 마침내 황제를 칭했다 — 조비와 유비가 제위에 오른 지 8년이나 지난 뒤였으니, 삼국에서 가장 늦고 가장 신중한 즉위다. 흥미로운 것은 촉의 반응이었다 — 한나라의 계승자를 자처하는 촉으로서는 위도 오도 참칭인데, 제갈량은 실리를 골랐다. 사신을 보내 축하하고, 나아가 천하를 미리 나누는 맹약까지 맺은 것이다 — 예주·청주는 오가, 연주·기주는 촉이 갖는다는 위나라 영토 분할 각서였다. 하늘에 해가 둘일 수 없다는 원칙을 두 해가 서로 눈감아 준 것 — 이념보다 생존이 앞선, 삼국 외교의 정점이다.',4,'<b>출전</b> 『삼국지』 오서 오주전 — 분할 맹약문 수록<br><b>연의</b> 제98회에 간략히<br><b>덧붙임</b> 촉 조정에서는 "참칭자와의 동맹 단절" 강경론이 일었으나 제갈량이 눌렀다 — "지금 오를 끊으면 위만 좋은 일"이라는 실리론의 승리였고, 진진이 축하 사절로 갔다. 맹약문에는 "한 마음으로 위를 토벌하며, 맹세를 어기면 신명이 벌하리라"는 종교적 문구까지 — 두 황제 체제는 이렇게 공증되었다.'],
 [230,0,'이주(夷洲) 원정','황제가 된 손권이 바다 너머로 눈을 돌렸다 — 위온과 제갈직에게 무장병 1만을 주어 이주(夷洲)와 단주(亶洲)를 찾게 한 것이다. 육손이 "얻어야 쓸모없고 잃는 것만 크다"며 말렸지만 강행했다. 결과는 참담했다 — 단주는 찾지도 못하고, 이주에서 수천 명을 잡아 왔으나 풍토병으로 병사 열에 여덟아홉을 잃었다. 손권은 책임을 물어 두 장수를 처형했다 — 제 결정이었는데도. 이 실패한 원정이 남긴 것은 기록이다 — 이주는 대만으로 비정되는 일이 많아, 이 기사는 대만이 중국 문헌에 등장하는 가장 이른 장면으로 다뤄진다.',0,'<b>출전</b> 『삼국지』 오서 오주전, 『임해수토지』(심영)<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 『임해수토지』가 남긴 이주의 민족지 — 돌도끼를 쓰고, 딸이 시집갈 때 앞니 하나를 뽑는 결치(缺齒) 풍습이 있다는 기록이 대만 선주민 문화와 겹쳐 읽힌다. 원정 실패의 처형 사유는 "조서를 어기고 공이 없다(違詔無功)" — 명령한 군주가 실패의 책임을 집행자에게 물은, 권력의 오래된 회계 처리다.'],
 [233,0,'공손연에게 속다','요동의 공손연이 바다 건너 칭신해 오자 손권이 덜컥 물었다 — 그를 연왕에 봉하고, 금은보화와 구석을 실은 사절단 1만 명을 배에 태워 보낸 것이다. 장소가 결사반대했다. "공손연은 위가 두려워 온 것이지 진심이 아닙니다. 사신이 돌아오지 못하면 천하의 웃음거리가 됩니다." 손권과 언쟁 끝에 장소는 칩거했고, 손권이 그 집 문을 흙으로 봉하자 장소는 안쪽에서 마주 흙벽을 쌓았다 — 군신의 자존심 대결이다. 결과는 장소의 완승 — 공손연은 사신들의 목을 베어 위에 바쳤다. 손권이 사과하러 문 앞에 서고, 불을 질러 겁주고, 끝내 장소의 아들들이 노인을 부축해 나왔다 — 이 소동 전체가 오나라 군신 관계의 초상화다.',0,'<b>출전</b> 『삼국지』 오서 오주전·장소전, 위서 공손도전<br><b>연의</b> 제106회 전후<br><b>덧붙임</b> 참사의 뒷이야기 — 사절단 중 진주 등 일행 60명이 학살을 피해 고구려로 탈출했고, 동천왕이 이들을 오나라로 송환해 주었다. 손권과 고구려 사이에 사신과 말(馬) 교역이 오간 기록이 이렇게 남았다 — 요동 사기극의 부산물이 한반도-강남 외교의 첫 페이지가 된 것이다.'],
 [241,0,'이궁의 변','태자 손등이 죽자(241) 셋째 손화가 태자가 되었는데 — 손권이 넷째 노왕 손패를 태자와 똑같이 대우하면서 비극이 시작됐다. 조정 전체가 태자당과 노왕당으로 갈라져 승상 육손까지 태자 옹호 상소를 올렸다 — 손권은 옹호자들을 처형·유배하고 육손에게는 질책 사자를 거듭 보냈다. 결말은 모두의 패배였다 — 태자 폐위, 노왕 사사(賜死), 일곱 살 손량 책봉. 늙은 군주는 저울질한다는 것이 나라의 기둥들을 다 뽑아 버린 것이다. 사람 쓰기로 일어선 손권이 사람 버리기로 기울다 — 오나라 쇠망사의 첫 장이다.',0,'<b>출전</b> 『삼국지』 오서 오주오자전·육손전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 화근의 씨앗은 후계 1순위 손등의 죽음만이 아니었다 — 손권이 총애한 반부인과 공주 손노반(전공주)의 궁중 공작이 겹겹이 얽혔다. 전공주는 손화 모자를 참소해 폐출시킨 장본인 — 오나라 후기의 정변마다 이 공주의 이름이 나온다. 소설이 통째로 건너뛴, 삼국지에서 가장 궁중극다운 chapter다.'],
 [252.25,0,'손권의 죽음','일흔하나, 재위 52년 — 삼국의 모든 군주 중 가장 오래 살고 가장 오래 다스렸다. 진수의 평가는 정확히 반으로 갈린다. 앞면 — "몸을 굽히고 치욕을 참으며, 재능을 헤아려 사람에게 맡겼으니(屈身忍辱 任才尙計) 구천의 기이함이 있는 영걸이었다." 뒷면 — "성품이 의심이 많아 사람 죽이기를 주저하지 않았고, 만년에는 더욱 심해졌다." 젊은 손권은 주유·노숙·여몽·육손을 차례로 발탁한 인사의 천재였고, 늙은 손권은 그 육손을 몰아 죽인 의심의 화신이었다 — 한 사람의 일대기가 나라의 흥망 곡선과 정확히 겹치는, 오나라는 그런 나라였다.',4,'<b>출전</b> 『삼국지』 오서 오주전 평(評)<br><b>연의</b> 제108회<br><b>덧붙임</b> 만년의 오점 목록 — 여일(呂壹)이라는 특무를 두어 신하들을 사찰하다 조정이 마비될 뻔했고(뒤에 처형하고 사과 조서까지 냈다), 두 아들을 죽이고 폐했다. 그럼에도 시호는 대황제(大皇帝) — 중국사에서 대(大) 한 글자 시호는 그가 거의 유일하다. 공과가 뒤섞인 52년에 대한, 후손들의 통 큰 정산이었다.'],
 [258,0,'손침과 오의 내분','손권이 남긴 어린 황제 곁에서 권신들의 회전문이 돌기 시작했다 — 제갈각이 죽고, 그를 죽인 손준이 병사하고, 사촌 손침이 이었다. 손침은 열여섯 황제 손량이 친정을 꾀하자 폐위해 버리고 손휴를 앉혔다 — 신하가 황제를 갈아치우는 것이 위나라만의 일이 아니게 된 것이다. 손휴는 노장 정봉과 짜고 납일 잔치에서 손침을 포박해 그날로 목을 벴다 — 스물여덟 권신의 최후였다. 그러나 손휴도 6년 뒤 죽고, 그다음 선 것이 폭군 손호다. 사람의 낯가죽을 벗기고 눈알을 도려냈다고 정사에 적힌 황제 — 오의 마지막 20년은 이렇게 안에서부터 무너졌다.',0,'<b>출전</b> 『삼국지』 오서 삼사주전·제갈각전·손침전<br><b>연의</b> 제113회<br><b>덧붙임</b> 폐위된 손량은 회계왕으로 강등된 뒤 다시 후(侯)로 깎여 이송 중 죽었다 — 자살설과 독살설이 병존한다. 손휴는 손침 형제의 족보를 손씨 종적에서 파 버렸다 — 죽인 뒤에 혈통까지 삭제한 것이다. 강동의 명문 정권이 20년 만에 골육상잔의 표본실이 되었다.'],
 [280.25,0,'손호의 항복','왕준의 수군이 석두성에 이르자 손호는 웃통을 벗고 스스로 결박한 채 관을 지고 나왔다 — 망국 군주의 정식 예법이었다. 낙양으로 압송된 그에게 사마염이 자리를 가리키며 여유를 부렸다. "짐이 이 자리를 마련해 놓고 경을 기다린 지 오래요." 손호가 즉답했다. "신도 남쪽에서 이런 자리를 마련해 두고 폐하를 기다렸습니다." 정복자를 웃겨 버린 망국 군주 — 잔학한 폭군이었으나 입담만은 천하제일이었다. 손견이 열일곱에 해적을 벤 지 96년, 강동 손씨의 이야기는 이 뻔뻔한 농담 한 줄로 막을 내린다.',3,'<b>출전</b> 『삼국지』 오서 삼사주전, 『진서』 무제기<br><b>연의</b> 제120회<br><b>덧붙임</b> 낙양에서의 재치 문답이 하나 더 전한다 — 가충이 "남방에서 사람 눈알을 뽑고 낯가죽을 벗겼다는데 무슨 형벌이오" 비꼬자, 손호가 "신하로서 임금을 시해한 자에게 내리는 형벌이오"라 받아쳤다 — 고귀향공(조모)을 죽인 가충의 급소를 정통으로 찌른 것이다. 가충이 입을 닫았다 — 망국 군주의 마지막 승리였다.'],
]},
{name:'주유·노숙·여몽·육손', sub:'ZHOU YU · LU SU · LÜ MENG · LU XUN',

 events:[
 [195.75,0,'태사자와 손책의 맞대결','신정 산자락 — 정찰 나온 손책의 열세 기(騎)와, 기병 하나만 달랑 데린 태사자가 정통으로 마주쳤다. 태사자는 물러서기는커녕 혼자 말을 박차고 덤볐다. 두 사람이 어우러져 뒹굴며 손책은 태사자의 등에 꽂힌 단극을 뽑아 들고, 태사자는 손책의 투구를 벗겨 쥐었다 — 양군이 달려와서야 떨어졌다. 정사 태사자전 본문의 기록이다. 연의의 일기토 대부분이 창작인 삼국지에서, 이 진흙탕 맨손 격투만은 진짜다 — 그리고 이 격투의 두 사람이 훗날 주군과 심복이 되니, 실화가 소설보다 낫다.',0,'<b>출전</b> 『삼국지』 오서 태사자전 본문<br><b>연의</b> 제15회<br><b>덧붙임</b> 단극(短戟)은 등에 메는 투척 겸용 단창 — 손책이 그것을 뽑아 든 것은 사실상 무장 해제 성공이었다. 연의는 이 격투를 "해 질 녘까지 백 합"의 정식 일기토로 확장했다 — 진흙탕 몸싸움을 검술 시합으로 승격시킨 것인데, 원본의 야성이 아깝다는 평이 많다.'],
 [213.5,0,'감녕의 백기 야습','유수 대치가 길어지자 손권이 감녕에게 조조군의 기선을 꺾어 보라 주문했다 — 감녕은 결사대 백여 명을 뽑아 술과 고기를 배불리 먹인 뒤, 이경(二更) 어둠 속에 재갈을 물리고 조조 진영으로 스몄다. 녹각을 뽑고 담을 넘어 수십 급을 베니 놀란 위군 진영 전체가 횃불을 밝히고 북새통 — 감녕의 부대는 유유히 돌아왔는데 한 사람도 잃지 않았다. 손권이 무릎을 쳤다. "맹덕에게 장료가 있다면, 내게는 흥패가 있다." 정사 감녕전 본문의 기록이다 — 합비의 장료 800에 대한 오나라식 답가인 셈이다.',0,'<b>출전</b> 『삼국지』 오서 감녕전<br><b>연의</b> 제68회<br><b>덧붙임</b> 출발 전 의식이 남아 있다 — 손권이 내린 쌀술과 안주를 감녕이 은사발에 따라 먼저 두 사발 마시고 도독 이하 결사대원 전원에게 한 사발씩 돌렸다. 돌아온 뒤 손권은 "늙은 도적(조조)을 놀라게 한 것으로 족하다 — 경의 담력을 본 것"이라며 비단 천 필과 칼 백 자루를 내렸다. 100명 전원 무사 귀환의 보너스였다.'],
 [200,0,'노숙의 탑상대책','주유가 데려온 노숙을 손권이 밤늦게 붙들었다 — 침상을 나란히 붙이고 술을 마시며 물었다. 이 난세에 나는 무엇을 해야 하오? 노숙의 답이 거침없었다. "한실은 다시 일으킬 수 없고, 조조는 당장 없앨 수 없습니다. 장군께서 하실 일은 강동에 정족(鼎足)하고 천하의 틈을 보는 것 — 끝내는 황제를 칭하고 천하를 도모하십시오." 갓 스물의 군주에게 대놓고 제업(帝業)을 권한 것이다. 제갈량의 융중대보다 7년 빠른 설계도 — 연의가 어수룩한 호인으로 그린 노숙은, 정사에서는 오나라에서 가장 먼저 가장 멀리 본 전략가였다.',0,'<b>출전</b> 『삼국지』 오서 노숙전 본문<br><b>연의</b> 제29회에 축약<br><b>덧붙임</b> 노숙은 임회의 부호로, 주유가 군량을 꾸러 오자 곳간 두 채 중 하나(쌀 3천 곡)를 통째로 내준 것이 인연의 시작이다 — 지수지혜(指囷之惠), 곳간을 가리킨 은혜라는 고사가 되었다. 원술이 그를 동성장으로 임명했으나 "그릇이 아니다"라며 버리고 주유를 따라 강을 건넜다 — 투자처를 고르는 눈이 밑천보다 정확했다.'],
 [208,1,'괄목상대','손권이 여몽에게 책을 권했다 — "군무가 바빠 글 읽을 틈이 없습니다"라는 대답에 손권이 웃었다. "내가 그대더러 박사가 되라는 것인가. 지난 일을 두루 알라는 것이지. 바쁘기로 나만 하겠는가 — 나도 늘 읽는데." 여몽이 분발해 책에 파묻혔다. 세월이 흘러 노숙이 여몽과 국사를 논하다 깜짝 놀라 등을 두드렸다. "이제 보니 그대는 오하의 아몽(吳下阿蒙)이 아니구려!" 여몽의 대답이 사자성어가 되었다. "선비란 사흘을 헤어졌다 만나면 눈을 비비고 다시 보아야 하는 법입니다(刮目相對)." 『강표전』의 기록 — 해적 잡던 무골이 형주를 통째로 삼키는 지장이 되는, 삼국지 최고의 성장담이다.',0,'<b>출전</b> 배송지 주 『강표전』<br><b>연의</b> 제일 유명한 대목만 골라 흡수<br><b>덧붙임</b> 손권의 독서 지도 목록까지 남아 있다 — 『손자』『육도』『좌전』『국어』와 삼사(三史)를 권하며 "나는 경전 주석이나 하라는 게 아니다, 옛일을 섭렵하라는 것"이라 했다. 경학이 아니라 실무 교양 독서 — 제왕의 평생 교육 커리큘럼으로, 이 대목은 지금도 리더십 강의에 인용된다.'],
 [208.83,0,'주유의 항전론','강동 조정이 80만이라는 숫자에 얼어붙었을 때, 주유가 그 숫자를 해부했다. "따져 봅시다. 중원에서 끌고 온 병력은 15~16만인데 이미 지쳤고, 형주에서 얻은 7~8만은 아직 마음으로 복종하지 않았습니다. 북방 병사는 물에서 싸울 줄 모르고, 말먹이 풀도 없는 한겨울이며, 물과 흙이 달라 반드시 병이 돕니다." 그러고는 결론 — "정예 5만이면 제가 막아 내겠습니다." 손권이 답했다. "5만은 당장 어렵고, 3만은 배와 군량과 함께 준비되어 있소. 그대가 먼저 가시오 — 여의치 않거든 내게로 물러나시오. 내가 맹덕과 결판을 내겠소." 적벽은 이 냉정한 산수에서 이미 이겨 있었다.',0,'<b>출전</b> 『삼국지』 오서 주유전 본문<br><b>연의</b> 제44회<br><b>덧붙임</b> 주유전 배송지 주 『강표전』에는 야간 2차 브리핑이 있다 — 밤에 다시 손권을 찾아가 "조조의 실병력은 중원병 15~16만에 항복병 7~8만"이라고 숫자를 깠다. 80만 공갈문서의 실사 감정 — 손권이 주유의 등을 어루만지며 "공근, 그대 말이 내 마음이오" 한 것이 이 밤이다.'],
 [208.83,0,'황개의 사항계와 화공','노장 황개가 주유의 장막에서 손을 들었다 — "적은 많고 우리는 적어 오래 끌면 불리합니다. 보아하니 조조의 배들이 머리와 꼬리를 서로 물고 있으니 — 태워 버릴 수 있습니다." 항복 편지가 먼저 강을 건넜고, 조조는 믿었다. 약속한 날, 마른 섶과 기름을 채운 몽충 열 척이 돛을 올렸다 — 강 한가운데서 일제히 불을 달고 바람에 실려 조조 함대에 꽂혔다. 불은 배를 태우고 강안의 진영까지 옮겨붙었다 — "연기와 불꽃이 하늘에 가득했다(煙炎張天)." 정사가 적는 적벽의 주역은 이 두 사람이다 — 제갈량의 동남풍도, 방통의 연환계도 필요 없었다. 늙은 장수의 눈썰미 하나로 충분했다.',12,'<b>출전</b> 『삼국지』 오서 주유전·황개전<br><b>연의</b> 제49~50회<br><b>덧붙임</b> 황개의 항복 편지 원문 취지가 『강표전』에 전한다 — "강동 육군으로 중원 백만을 당하는 것은 중과부적, 천하의 대세가 공에게 있다"는 논리로 조조의 자기 확신을 정확히 겨냥했다. 화공 당일 황개는 유시에 맞아 강에 떨어졌다가 한당에게 구조되었다 — 계책의 주인공이 하마터면 제 불길의 첫 전사자가 될 뻔했다.'],
 [208.83,4,'연환계와 고육계','방통이 조조를 찾아가 뱃멀미 처방을 내린다 — "배들을 쇠사슬로 엮고 그 위에 널판을 까십시오"(제47회). 황개는 항복의 진정성을 위해 곤장 백 대를 자청해 살이 터진다 — 고육계(제46회). 연의가 적벽에 깔아 둔 이 정교한 사전 공작들은 모두 창작이다. 정사는 조조의 배가 "머리와 꼬리를 서로 이었다(首尾相接)"고만 적을 뿐 누가 시켰다는 말이 없고 — 북방 병사의 멀미를 줄이려는 조조군 자체 조치였을 것이다 — 방통은 이 시기 적벽 근처에 있었다는 기록조차 없다. 황개의 편지는 곤장 없이도 먹혔다. 소설은 승리에 이유를 두 겹 세 겹 깔아 주고 싶어 한다 — 정사의 승리는 그보다 단순하고, 그래서 더 아슬아슬했다.',0,'<b>출전</b> 창작 — 선박 연결 기사만 『삼국지』 오서 주유전<br><b>연의</b> 제46~47회<br><b>덧붙임</b> 고육계와 세트인 감택의 밀서 전달, 방통을 조조에게 소개하는 장간의 2차 방문도 모두 창작 — 연의는 적벽 전야에만 첩보전 3부작을 배치했다. "고육계"와 "연환계"는 이 소설 덕에 삼십육계 병법 용어로 역수입되었다 — 가공의 작전이 실전 교범 어휘가 된 사례다.'],
 [209.92,0,'남군 공방과 부상','적벽의 불꽃은 화려했지만, 그 뒤에 이어진 것은 1년짜리 진흙탕이었다 — 강릉성의 조인을 상대로 한 남군 공방전이다. 주유는 이 소모전 중에 오른쪽 옆구리에 화살을 맞았다 — 상처가 깊어 자리에 누웠는데, 조인이 그 소식을 듣고 성 밖으로 나와 도발했다. 주유는 화살 박혔던 몸을 일으켜 갑옷을 입고 진영을 순시했다 — 멀쩡한 대도독을 확인한 조인은 도로 성에 들어갔고, 얼마 뒤 강릉을 버렸다. 적벽을 영토로 바꾼 것은 동남풍이 아니라 이 1년의 인내였다 — 그리고 이때의 화살이, 2년 뒤 그의 목숨을 재촉한다.',0,'<b>출전</b> 『삼국지』 오서 주유전<br><b>연의</b> 제51회<br><b>덧붙임</b> 이 1년 전역의 조연들이 화려하다 — 감녕이 이릉을 선점해 별동 거점을 만들었고, 여몽이 "감녕을 구원하자"는 소수 의견을 관철해 위기를 넘겼다. 연의는 남군 최종 접수를 제갈량의 가로채기로 각색했다(제51회) — 주유가 피 흘려 딴 성의 등기를 소설이 촉한 앞으로 이전한 것이다.'],
 [210,0,'천하이분지계와 주유의 죽음','남군을 얻은 주유가 손권에게 대전략을 올렸다 — "익주를 취하고 장로를 아우른 뒤 마초와 손잡고, 돌아와 양양에서 북방을 압박합니다. 그러면 천하를 도모할 수 있습니다." 천하를 조조와 둘로 나누는 이분지계(二分之計) — 유비의 자리가 없는 설계도다. 손권이 허락했고, 주유는 원정 준비차 강릉으로 돌아가는 길에 파구에서 쓰러졌다 — 서른여섯. 유언은 노숙을 후임으로 천거하는 것이었다. 손권이 소복을 입고 통곡했다 — 그리고 황제가 된 날 좌우를 돌아보며 말했다. "주공근이 없었다면 나는 이 자리에 오르지 못했다(孤非周公瑾 不帝矣)." 오나라의 설계자가 설계도만 남기고 떠난 것이다.',0,'<b>출전</b> 『삼국지』 오서 주유전 본문<br><b>연의</b> 제56~57회<br><b>덧붙임</b> 유언 상소의 원문이 주유전에 있다 — "지금 천하에 일이 많으니 이것이 제가 밤낮 근심하던 바입니다. 노숙은 충렬하고 일에 임해 구차하지 않으니 저를 대신할 만합니다." 사인(死因)에 대해 정사는 병(病卒)이라고만 적는다 — 남군에서 맞은 화살 상처의 악화로 보는 것이 통설이다.'],
 [210,4,'"하늘은 어찌 주유를 낳고 또 제갈량을 낳았는가"','연의는 주유를 세 번 약 올려 죽인다 — 삼기주유(三氣周瑜). 남군을 빼앗기고, 미인계가 역효과 나고("주랑의 묘계가 천하를 안정시킨다더니, 부인 잃고 군사마저 꺾였구나!"), 가도멸괵의 수가 읽히고 — 화살 상처가 도져 하늘에 외친다. "기생유 하생량(旣生瑜 何生亮)!" 전부 창작이다. 정사의 주유는 도량이 넓어 "너그럽고 커서 사람들의 마음을 얻었다"고 적혔고, 텃세 부리던 노장 정보를 겸손으로 감복시켜 "주공근과 사귀는 것은 좋은 술을 마시는 것 같아 취하는 줄 모른다"는 헌사를 받은 사람이다. 제갈량과 겨룬 기록 자체가 없다 — 소설은 한쪽을 높이려 다른 쪽 그릇을 깨는 법인데, 주유만큼 억울하게 깨진 그릇도 없다.',0,'<b>출전</b> 창작<br><b>연의</b> 제51~57회(삼기주유), 제57회(기생유하생량)<br><b>덧붙임</b> 소동파의 「염노교·적벽회고」가 실제 주유상의 증언이다 — "웃고 이야기하는 사이에 강한 적이 재가 되어 사라졌다(談笑間 檣櫓灰飛煙滅)." 송대까지 주유는 여유의 화신이었다 — 속 좁은 주유는 온전히 연의 이후의 발명품이니, 문학사에서 가장 성공한 캐릭터 훼손 사례로 꼽힌다.'],
 [210.5,0,'노숙, 형주 대여를 밀어붙이다','주유의 유언으로 병권을 이은 노숙이 처음 한 일은, 주유의 전략을 뒤집는 것이었다 — 유비에게 남군을 빌려주자고 손권을 설득한 것이다. 논리는 이랬다. "조조의 힘은 아직 너무 큽니다. 유비에게 형주를 세 주어 조조의 적을 하나 늘리는 것이 상책입니다." 오 혼자 조조를 감당하는 이분(二分) 대신, 셋이 정립하는 삼분(三分)을 고른 것 — 천하 삼분의 실질적 설계자는 이 사람이다. 조조가 이 소식을 들은 순간 쓰던 붓을 떨어뜨렸다는 정사의 기록이, 이 수가 얼마나 아팠는지를 증언한다. 다만 외상값 계산은 남았다 — 이 대여 장부가 10년 뒤 관우의 목숨으로 결제된다.',0,'<b>출전</b> 『삼국지』 오서 노숙전<br><b>연의</b> 제54회<br><b>덧붙임</b> 노숙의 논리는 "조조에게 적을 하나 더 만들어 주는 것(多操之敵)"이었다 — 오나라 단독으로 조조의 표적이 되는 것을 피하는 보험론이다. 조조의 붓이 떨어진 것(落筆於地)은 이 보험의 위력을 적장이 즉각 계산했다는 뜻 — 삼국지에서 가장 유명한 낙필(落筆)이다.'],
 [215.5,0,'단도부회','형주 반환 협상이 결렬 직전, 노숙이 관우에게 단독 회담을 청했다 — 양쪽 병마를 백 보 밖에 물리고 장수들은 칼 한 자루씩만 차고 만나자는 것. 이른바 단도부회(單刀赴會)다. 회담장에서 노숙이 정면으로 따졌다. "우리가 땅을 빌려준 것은 그대들이 싸움에 져 멀리서 와 발붙일 곳이 없었기 때문이오. 이제 익주를 얻고도 돌려주지 않으니, 이 무슨 도리요." 관우가 대답할 말을 찾지 못했다고 — 정사 노숙전이 적는다. 연의 제66회는 이 판을 통째로 뒤집었다. 관우가 홀로 칼 한 자루 짚고 호랑이 굴에 들어가 노숙을 쩔쩔매게 하는 무용담으로 — 협상의 승자가 소설에서는 패자가 되었다. 붓은 칼보다 강하고, 소설은 사서보다 사납다.',0,'<b>출전</b> 『삼국지』 오서 노숙전<br><b>연의</b> 제66회<br><b>덧붙임</b> 회담 중 관우 쪽 자리에서 누군가 "땅은 덕 있는 자의 것일 뿐(夫土地者 惟德所在耳)"이라 끼어들자 노숙이 낯빛을 바꿔 꾸짖었고, 관우도 칼을 짚고 일어나 "나랏일에 저 사람이 무엇을 아는가"라며 그를 물렸다. 연의의 관우 무용담 버전은 원 잡극 「단도회」가 먼저 만들었다 — 소설은 희곡의 인기 레퍼토리를 수입한 것이다.'],
 [217,0,'노숙의 죽음과 노선 전환','노숙이 마흔여섯으로 죽자 오나라의 형주 정책이 유턴했다 — 후임 여몽이 손권에게 올린 의견서는 노골적이었다. "관우는 곰과 범 같은 자입니다. 어찌 오래 이웃으로 두겠습니까. 지금 서주를 친다 해도 지키려면 7~8만이 필요하지만 — 형주를 차지하면 장강 전체가 우리 것이 됩니다." 유비를 키워 조조를 막는다는 노숙의 설계를, 유비부터 친다로 바꾼 것이다. 손권이 고개를 끄덕였다. 동맹이라는 것이 얼마나 사람 하나에 얹혀 있었는지 — 노숙의 무덤에 흙이 마르기도 전에, 형주의 시계는 파국을 향해 돌기 시작했다.',0,'<b>출전</b> 『삼국지』 오서 노숙전·여몽전<br><b>연의</b> 제68회 전후<br><b>덧붙임</b> 노숙의 부고에 제갈량도 발상(發喪)했다 — 적국의 재상이 상복을 입은 것이다. 손권의 사후 평가는 얄궂다 — 황제 즉위식 날 "노숙이 일찍이 이를 말했으니 명철하다" 기렸으나, 만년에는 "형주를 빌려준 것은 그의 단점"이라 깎았다. 동맹론자의 평판은 동맹의 시세를 따라 오르내렸다.'],
 [219.83,0,'백의도강','여몽이 병을 칭하고 건업으로 돌아갔다 — 후임은 이름 없는 서생 육손. 육손은 부임 인사로 관우에게 팬레터에 가까운 편지를 보냈다. 관우가 코웃음을 치고 형주의 수비 병력을 번성 전선으로 빼돌리자 — 덫이 닫혔다. 여몽의 정예가 상선에 숨고, 노 젓는 병사들은 흰 옷의 장사꾼 차림 — 백의도강(白衣渡江)이다. 강변 봉화대들은 봉화 한 번 못 올리고 접수되었고, 강릉성은 싸움 없이 열렸다. 입성한 여몽은 약탈을 금하고 관우 군 가족들을 극진히 보살폈다 — 이 소문이 전선에 닿자 관우의 군대가 소리 없이 녹았다. 화살 한 대 쓰지 않고 군대 하나를 증발시킨, 심리전의 교과서다.',0,'<b>출전</b> 『삼국지』 오서 여몽전<br><b>연의</b> 제75회<br><b>덧붙임</b> 점령 정책의 디테일 — 여몽은 같은 고향 병사가 민가의 삿갓 하나를 가져다 관물(官物) 덮개로 쓴 것마저 눈물을 흘리며 참수했다. 이후 "길에 떨어진 것을 줍지 않았다(道不拾遺)." 관우군 가족에게는 안부 편지 왕래까지 허용했다 — 칼 대신 우편과 군율로 이긴 전쟁이었다.'],
 [220,0,'여몽의 죽음','형주를 통째로 거둔 최대 수훈자 여몽은 논공행상의 잔치를 누리지 못했다 — 강릉 함락 직후 병으로 쓰러진 것이다. 손권이 그를 내전에 눕히고 천금으로 의원을 모았으며, 침 맞는 모습이 안쓰러워 벽에 구멍을 뚫고 몰래 들여다보았다 — 여몽이 음식을 넘기면 기뻐 웃고, 못 넘기면 밤잠을 설쳤다고 정사가 적는다. 형주를 얻은 지 몇 달 만에 마흔둘로 죽었다. 연의 제77회는 이 죽음에 공포 연출을 입혔다 — 축하연에서 관우의 혼령이 씌어 일곱 구멍으로 피를 쏟고 즉사하는 것으로. 정사의 병사(病死)로는 관우의 원한을 풀어 줄 수 없었던 소설의 복수 대행이다.',0,'<b>출전</b> 『삼국지』 오서 여몽전<br><b>연의</b> 제77회<br><b>덧붙임</b> 손권의 간병 기록은 정사에서 가장 애틋한 대목이다 — 상으로 내린 황금 1억 전과 봉작을 여몽이 사양하자 유언으로도 반납하게 했고, 장례는 "관곽만 쓰라"는 여몽 본인의 검약 유언대로였다. 공안(公安)의 내전에서 병상을 지킨 군주 — 관우의 원귀 서사와는 다른, 과로사한 명장의 조용한 마지막이다.'],
 [222.5,0,'이릉과 육손','촉의 대군이 밀려오자 육손은 후퇴만 거듭했다 — 험지를 다 내주고 이릉·효정까지 물러나 반년을 그냥 버텼다. 참다못한 장수들이 겁쟁이라 수군댔지만 육손의 계산은 끝나 있었다. "처음 왔을 때는 예기가 날카로워 못 쳤다. 이제 지치고 늘어졌으니 — 때가 됐다." 병사마다 띠풀 한 다발 — 40여 개 진영이 연쇄로 타올랐다. 강북의 황권은 퇴로가 끊기고, 촉군 수만이 재가 되었다. 조비가 앞서 촉군의 배치도를 보고받고 했던 말이 예언이 되었다 — "7백 리에 진을 늘어놓고 어찌 적을 막는단 말인가. 유비는 병법을 모른다." 서생이라 불리던 사내가, 그 서생의 인내로 촉한의 국운을 꺾은 것이다.',6,'<b>출전</b> 『삼국지』 오서 육손전<br><b>연의</b> 제84회<br><b>덧붙임</b> 육손은 반격 전에 시험 공격 한 번을 일부러 실패했다 — 장수들이 "병사만 죽였다" 비난하자 "적진을 깰 방법을 알아냈다"고 답했다. 화공은 그 실패의 데이터에서 나왔다. 승전 후 손권이 물었다. "왜 처음부터 안 쳤는가." "촉군의 예기가 그때는 살아 있었습니다" — 실패까지 설계에 넣은 지휘였다.'],
 [222.58,0,'추격을 멈추다','유비가 백제성으로 쫓겨 들어가자 서성과 반장이 목소리를 높였다 — 몰아붙이면 유비를 사로잡을 수 있습니다! 육손은 고개를 저었다. 조비가 대군을 모으는 중이다 — 명분은 오를 돕는다지만 속은 검다. 우리가 촉 깊숙이 들어간 순간 등 뒤를 물 것이다. 그러고는 군을 물렸다 — 과연 그해 가을 위군이 세 갈래로 남하했고, 오는 준비된 방어로 막아 냈다. 이 절제가 남긴 것이 더 크다 — 유비를 끝까지 몰지 않은 덕에 촉과 다시 손잡을 여지가 남았고, 반년 뒤 유비가 죽자 동맹은 실제로 복원되었다. 이기는 법을 아는 장수는 많아도, 이긴 뒤 멈추는 법을 아는 장수는 드물다.',0,'<b>출전</b> 『삼국지』 오서 육손전<br><b>연의</b> 제84회(팔진도 미궁으로 각색)<br><b>덧붙임</b> 연의는 이 회군의 이유를 어복포의 팔진도에 돌렸다 — 돌미궁에 갇힌 육손이 제갈량의 장인 황승언의 안내로 겨우 살아 나와 "공명은 와룡이라 내가 미칠 바 아니다" 탄식하는 것으로. 전략적 절제를 신비 체험으로 바꾼 것 — 육손의 냉정한 계산서가 소설에서는 도술 앞의 겸손이 되었다.'],
 [228.58,0,'석정 전투','오의 파양태수 주방이 위나라에 밀서를 보냈다 — 죄를 지어 처벌이 두려우니 군(郡)을 들어 항복하겠다는 것. 의심을 지우려 주방은 사자가 보는 앞에서 제 머리카락을 잘랐다 — 위의 대사마 조휴가 낚였다. 10만을 이끌고 마중 나온 환성 길목, 석정에서 육손의 세 갈래 복병이 닫혔다 — 1만여 급의 목과 수레·군마·병장기를 통째로 노획한 오나라 최대의 야전 승리다. 조휴는 수치와 울분에 등창이 터져 죽었다. 그리고 이 대승의 자신감 위에서 이듬해 손권이 황제를 칭한다 — 머리카락 한 줌이 제국 하나를 출산한 셈이다.',8,'<b>출전</b> 『삼국지』 오서 육손전·주방전<br><b>연의</b> 제96회<br><b>덧붙임</b> 주방의 단발(斷髮)은 일곱 통의 거짓 밀서와 세트였다 — 위나라 사찰관이 오자 머리를 잘라 결백을 연출한 것이다. 손권이 뒤에 "그대의 머리카락이 나라를 구했다"고 치하했다. 조휴는 속은 것을 알고도 병력을 믿고 진군했다가 당했다 — 자존심이 정보 판단을 이긴, 교과서적 참패였다.'],
 [245,0,'육손의 죽음','이릉의 영웅이자 승상까지 오른 육손의 최후는 전장이 아니라 정쟁이었다 — 이궁의 변에서 태자 손화를 지키는 상소를 거듭 올리고 도성에 올라가 직접 간하겠다 청하자, 손권의 대답은 문책 사자의 행렬이었다. 조카 고담 형제는 유배되고, 절친 오찬은 옥사하고 — 예순셋의 승상은 분함을 이기지 못하고 죽었다(憤恚致卒). 손권은 몇 년 뒤 육손의 아들 육항 앞에서 지난 문책 문서들을 불태우며 사과했다 — 죽은 뒤의 사면이었다. 진수는 오나라 신하 중 오직 육손에게만 단독 열전 한 권을 바쳤다 — 제갈량과 육손, 『삼국지』에서 신하로서 독립 열전을 받은 사람은 이 둘뿐이다.',0,'<b>출전</b> 『삼국지』 오서 육손전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 육손의 집안 내력이 비극의 복선이었다 — 그는 손책의 사위, 즉 손권의 조카사위이면서 강동 토착 호족 육씨의 종주였다. 태자 문제 개입은 종실 인척로서의 의무이자 호족 대표로서의 발언이었는데, 손권은 그것을 월권으로 읽었다 — 창업 연합의 두 축(손씨와 강동 호족)이 갈라지는 균열이 한 사람의 등에서 터진 것이다.'],
 [272,0,'육항과 양호','오의 마지막 명장 육항과 진의 양호는 형주 국경을 사이에 두고 기묘한 사이가 되었다 — 서로 신의를 지켜, 육항이 병들자 양호가 약을 보냈고 좌우가 독을 의심하며 말리자 육항이 그냥 마셨다. "양숙자가 사람을 독살할 자인가(羊祜豈鴆人者)." 경계 너머의 신뢰 — 그러나 각자의 조국에 대해서는 한 치도 물러서지 않아, 272년 서릉의 반란 때 육항은 진의 대군을 완벽한 수읽기로 물리쳤다. 그가 손호에게 올린 상소들은 나라의 시한부 선고서처럼 읽힌다 — "덕정을 펴지 않으면 험한 강산도 지킬 수 없습니다." 274년 육항이 죽고, 6년 뒤 그 예언대로 되었다.',0,'<b>출전</b> 『삼국지』 오서 육손전(육항 부전), 『진서』 양호전<br><b>연의</b> 제120회<br><b>덧붙임</b> 서릉 전투의 수읽기 — 육항은 반란한 서릉성을 치지 않고 포위벽부터 쌓았다. 장수들이 "즉시 공격"을 조르자 한 번 치게 해 실패를 확인시킨 뒤 공사를 재개했다 — 이릉의 아버지와 똑같은, 실패를 교보재로 쓰는 지휘법이었다. 손호가 육항의 국경 신사협정을 힐난하자 답했다 — "한 고을에도 신의가 없을 수 없는데, 하물며 큰 나라이겠습니까."'],
]}]},
{name:'변방과 문화', rows:[
{name:'변방 — 동이전의 세계', sub:'THE FRONTIER · DONGYI',
 spans:[[190,238,'공손씨의 요동'],[238,265,'위의 직할'],[265,281,'진의 변경']],
 events:[
 [190,0,'공손도의 요동 할거','동탁이 요동태수 자리 하나를 던져 준 공손도는, 부임하자마자 중원 쪽 사정을 훑어보고 결론을 내렸다 — "한나라의 명운은 끝났다. 나라를 도모할 때다." 요동후·평주목을 자칭하고 독자적으로 제사와 관제를 갖췄으니, 중원에서 가장 먼 곳에 가장 먼저 선 사실상의 독립국이다. 전란을 피한 관녕·병원 같은 대학자들이 바다를 건너 모여들어 요동은 뜻밖의 문화 피난처가 되었다. 이 나라 아닌 나라가 3대 50년을 가며 낙랑을 쥐고 한반도·왜와의 교역로를 관리했다 — 『삼국지』에 공손도전이 따로 선 이유이고, 이 연대기에 변방 행이 있는 이유다.',0,'<b>출전</b> 『삼국지』 위서 공손도전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 공손도의 취임 일성이 살벌하다 — 요동의 호족 백여 가를 법으로 얽어 멸족시켜 "군이 떨었다(郡中震慄)." 동쪽으로 고구려를 치고 서쪽으로 오환을 눌렀으며, 바다 건너 산둥 동래까지 영주(營州)를 설치했다 — 랴오둥에서 산둥까지 걸친 해상 세력권, 사실상의 발해만 왕국이었다.'],
 [204,0,'대방군 설치','공손도의 아들 공손강이 낙랑군 남쪽의 통제 밖 황무지를 잘라 새 군(郡)을 세웠다 — 대방군이다. 목적은 분명했다. 성장하는 한(韓)과 예(濊)의 세력을 관리하고 남방 교역로를 다잡는 것. 이후 한반도 중남부의 소국들과 바다 건너 왜의 사신들은 모두 이 대방을 창구로 중국과 통하게 된다 — 히미코의 사신단이 밟은 첫 중국 땅도 대방이었다. 요동의 지방 정권이 그은 행정선 하나가, 이후 백 년간 동아시아 외교의 관문이 된 것이다 — 낙랑·대방 4백 년사의 마지막 국면이 여기서 열린다.',0,'<b>출전</b> 『삼국지』 위서 동이전 한조<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 설치 배경을 동이전은 이렇게 적는다 — "환제·영제 말에 한(韓)과 예(濊)가 강성해 군현이 제어하지 못하니, 백성이 한국(韓國)으로 많이 흘러 들어갔다." 유민의 방향이 군현→삼한이었다는 것 — 한반도 남부가 이미 사람을 끌어당기는 쪽이었다는 증언이다.'],
 [209,0,'고구려의 환도성','압록강 중류의 고구려는 이 무렵 왕위 계승 내전을 막 치른 참이었다 — 형 발기가 공손씨의 군사를 빌려 아우 산상왕을 쳤다 실패한 것이다. 산상왕은 국내성 곁의 산성 환도성을 쌓아 방어의 축을 세웠다. 요동의 공손씨와 고구려는 그렇게 서로의 내정에 개입하고, 협력하고, 다시 부딪히는 이웃이었다 — 위가 공손연을 칠 때 고구려가 군사를 보태 도운 것도 그 연장선이다. 삼국지의 무대 동쪽 끝에서, 한국사의 고구려가 이미 국제 정치의 플레이어로 움직이고 있었다.',0,'<b>출전</b> 『삼국사기』 고구려본기, 『삼국지』 위서 동이전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 발기의 난 때 형을 지지한 소노부 세력 3만여 구(口)가 공손씨에게 투항해 요동으로 갔다 — 고구려 인구의 대규모 유출이었다. 동이전은 고구려 사람들을 "걷기를 달리듯 하고(行步皆走) 노래와 춤을 좋아한다"고 적었다 — 위나라 관찰자의 눈에 비친 첫 고구려인상이다.'],
 [238,0,'낙랑·대방의 접수','사마의가 공손연을 도륙하는 동안, 위는 조용히 별동대를 움직였다 — 유흔과 선우사가 바닷길로 낙랑·대방에 상륙해 두 군을 접수한 것이다. 요동 정권이라는 중개상이 사라지고, 한반도의 여러 나라와 왜가 처음으로 위나라 낙양과 직거래를 트게 되었다. 이 직거래의 부산물이 어마어마하다 — 사신과 관리들이 오가며 남긴 견문이 쌓여 『삼국지』 위서 동이전이 되었으니, 부여·고구려·옥저·동예·삼한·왜의 가장 오래된 민족지가 이 행정 인수인계에서 태어난 셈이다.',0,'<b>출전</b> 『삼국지』 위서 동이전·공손도전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 접수 부대가 바닷길로 온 것이 포인트다 — 요동반도가 아직 공손씨 수중일 때 산둥에서 직항한 것으로, 발해만 제해권이 위에 있었음을 보여 준다. 두 군의 호구는 전성기의 절반 이하로 줄어 있었다 — 군현 지배의 쇠퇴 곡선 위에서, 삼한과 왜의 성장 곡선이 교차하고 있었다.'],
 [239.58,0,'히미코와 친위왜왕','왜의 30여 나라를 아우른다는 야마타이국의 여왕 히미코 — "귀신의 도로 무리를 홀리고(事鬼道 能惑衆), 나이 들도록 남편이 없으며, 아우가 나라 다스리는 것을 돕는다"고 동이전은 적는다. 그 히미코의 사신 난승미가 대방을 거쳐 낙양에 닿자, 위 조정이 그를 친위왜왕(親魏倭王)에 봉하고 금인자수와 구리거울 100매를 내렸다. 일본 고대사가 문헌에 등장하는 첫 장면이 중국 사서의 이 몇 줄이다 — 야마타이가 규슈냐 기나이냐, 거울이 삼각연신수경이냐를 두고 일본 학계는 지금도 논쟁 중이다. 연의는 이 이야기를 한 줄도 모른다 — 정사에만 있는 세계다.',0,'<b>출전</b> 『삼국지』 위서 동이전 왜인조<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 하사품 목록이 통째로 남아 있다 — 금인자수 외에 강지교룡금 5필, 진홍 융단 50필, 동경 100매, 진주와 연단(鉛丹) 각 50근. 왜인조는 야마타이까지의 노정·호수·풍속을 2천 자 넘게 적었다 — 3세기 일본 열도에 대한 유일한 동시대 기록이라, 일본 고대사는 이 챕터의 해석사라 해도 지나치지 않다.'],
 [244,0,'관구검의 고구려 침입','유주자사 관구검이 1만을 이끌고 고구려로 들어왔다 — 요동 정벌에 협력했던 고구려 동천왕이 위의 서안평을 공격하며 관계가 깨진 뒤였다. 동천왕은 비류수에서 서전을 이겼으나 정면 대결에서 대패했고, 관구검은 환도성을 함락해 도성을 헐었다. 이듬해 재침에서는 현도태수 왕기가 동천왕을 옥저 방면으로 1천 리나 추격했다 — 고구려 건국 이래 최대의 국난이다. 그런데 이 사건의 물증이 근대에 나타났다 — 1906년 지안의 공사장에서 「관구검기공비」의 파편이 발굴된 것이다. 사서의 한 줄이 돌에 새겨져 1,700년 만에 돌아온, 정사(正史)라는 말의 무게를 보여 주는 유물이다.',0,'<b>출전</b> 『삼국지』 위서 관구검전, 『삼국사기』 고구려본기<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 기공비 파편의 실물은 랴오닝성 박물관에 있다 — "정시 3년 고구려가 반(反)하여…6년 5월 선우(旋于)…"라는 잔자(殘字)가 원정 연대를 못박아 주었다. 위군에 종군한 현도태수 왕기의 추격로가 곧 동이전의 답사로가 되었다 — 전쟁의 부산물이 민족지(民族誌)였던 셈이다.'],
 [245,0,'동천왕과 밀우·유유','같은 전쟁이 한국 사서에는 전혀 다른 온도로 적혀 있다 — 『삼국사기』 고구려본기의 기록이다. 옥저로 쫓기던 동천왕의 곁에 결사대를 자청한 밀우가 추격을 막아 냈고, 유유는 항복 사절을 가장해 음식을 바치다 숨긴 칼로 위군 장수를 찌르고 함께 죽었다 — 지휘부를 잃은 위군이 혼란에 빠지자 고구려군이 반격해 전세를 돌렸다는 것이다. 『삼국지』는 같은 전역을 위의 일방적 승리로만 적는다. 승자의 사서와 패자의 사서가 남긴 두 개의 진실 — 이 연대기가 정사와 연의를 나란히 놓는 것과 같은 이유로, 이 두 기록도 나란히 읽을 가치가 있다.',0,'<b>출전</b> 『삼국사기』 고구려본기 동천왕조<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 전후 처리가 두 사서에서 갈린다 — 『삼국사기』는 동천왕이 평양성을 쌓아 종묘사직을 옮겼다 하고, 위 측 기록은 환도가 폐허가 되어 재기 불능이라 적었다 — 고구려는 70년 뒤 서안평을 다시 치고 낙랑을 삼키는 것으로 답했다. 밀우·유유에게는 식읍과 추증이 내려졌다 — 한국사 최초의 서훈 기록급 장면이다.'],
 [246,0,'기리영 전투','위의 두 군(郡)이 진한 8국의 관할을 나눠 갖겠다고 통보하자 — 통역 과정의 오해였다는 설도 있다 — 한(韓)의 신지들이 격분했다. 신분고국을 중심으로 한 세력이 대방군의 기리영을 선제공격했고, 낙랑·대방 두 태수가 연합군으로 맞섰다 — 대방태수 궁준이 이 싸움에서 전사했다. 중국 군현의 태수가 삼한과의 전투에서 죽은 것이다. 『삼국지』 동이전 한조의 이 짧은 기사는 한반도 중남부의 힘이 어디까지 자랐는지 보여 주는 온도계다 — 그리고 이 격변의 소용돌이 속에서 백제의 고이왕이 마한의 주도권을 잡아 간다. 한국사와 삼국지가 같은 페이지에서 만나는 순간이다.',0,'<b>출전</b> 『삼국지』 위서 동이전 한조<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 원문의 판본 문제가 유명하다 — 공격 주체가 "신분고국(臣濆沽國)"인지 "신지(臣智)들의 격분"인지 글자 해석이 갈려, 백제 초기사와 마한 소국 체제 논쟁의 급소가 되었다. 확실한 결과는 두 가지 — 대방태수가 전사했고, 그럼에도 "이후 한(韓)은 쇠약해지지 않았다"는 것이다.'],
 [247,0,'동이전이라는 사료','관구검의 원정과 왕기의 천 리 추격은 뜻밖의 유산을 남겼다 — 위나라 관리들이 옥저와 읍루, 예의 땅까지 직접 밟고 돌아온 것이다. 그 보고서들이 『삼국지』 위서 동이전으로 정리되었다. 부여의 영고와 순장, 고구려의 동맹(東盟)과 데릴사위제, 옥저의 민며느리제, 동예의 무천과 책화, 삼한의 소도와 천군, 두레 — 한국 고대사 교과서의 그 목록들이 전부 이 책에서 나온다. 우리 고대사의 가장 오래된 1차 사료가 남의 나라 정사(正史)의 한 챕터라는 사정 — 『삼국지』를 소설의 원작으로만 읽을 수 없는 이유가 여기 있다.',0,'<b>출전</b> 『삼국지』 위서 오환선비동이전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 동이전의 분량 배분이 흥미롭다 — 부여 930자, 고구려 1,700자, 왜 2,000자 남짓. 『후한서』 동이전은 이를 골자로 재편집한 후발 사료다. 단군·주몽 같은 건국 신화는 없고 제도·풍속·물산 중심 — 정보 보고서의 문체라서 오히려 사료 가치가 높다는 평가를 받는다.'],
 [225,0,'남중과 서남이','제갈량이 평정한 남중은 지도 밖의 세계였다 — 『화양국지』가 그 통치의 실제를 전한다. 촉은 군대를 남기는 대신 현지의 대성(大姓)과 이수(夷帥)에게 통치를 맡기고, 금·은·단칠·소·말을 세로 받았으며, 강한 부락민을 옮겨 무당비군(無當飛軍)이라는 정예 산악병으로 편성했다. 연의 제87~91회의 남만 원정 — 축융부인의 비도, 목록대왕의 맹수 부대, 등갑군 — 은 이 지역에 대한 중원의 상상력이 부풀린 판타지다. 다만 그 판타지의 뿌리에는 실제 세계가 있었다 — 삼국지의 남쪽 변경은 소설보다 넓고, 기록보다 깊다.',0,'<b>출전</b> 『화양국지』 남중지<br><b>연의</b> 제87~91회<br><b>덧붙임</b> 『화양국지』는 동진의 상거(常璩)가 쓴 파촉 전문 지방지 — 촉 지역사에 관한 한 정사를 보완하는 제1급 사료다. 제갈량이 남중 유력자들에게 그려 주었다는 도보(圖譜) 기사가 있다 — 하늘·해·군주·성곽을 차례로 그려 통치의 질서를 시각 교육했다는 것 — 문자 밖의 통치술이었다.'],
 [226,0,'대진의 상인과 바닷길','오나라 황무 5년, 교지를 거쳐 건업에 도착한 이방인이 있었다 — 대진(大秦), 곧 로마 세계에서 온 상인 진론(秦論)이다. 손권이 그를 불러 먼 나라의 풍토를 물었다고 『양서』가 전한다. 오는 답방하듯 강태와 주응을 부남(캄보디아)까지 보내 남해 수십 나라의 견문록을 쓰게 했고, 위는 돈황에 서역장사를 두어 실크로드를 관리했다. 세 나라가 서로 죽고 죽이는 동안에도, 각자의 등 뒤로는 로마와 인도양과 중앙아시아로 통하는 문이 열려 있었던 것이다 — 삼국지는 닫힌 반도의 이야기가 아니라, 유라시아 교역망 동쪽 끝의 이야기였다.',0,'<b>출전</b> 『양서』 제이전, 『삼국지』 오서 사섭전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 교지의 사섭 형제가 이 바닷길의 관문지기였다 — 사섭의 행차에는 종과 경쇠가 울리고 향을 사르는 호인(胡人)들이 수십씩 따랐다고 사섭전이 적는다. 강태의 견문록 『부남이물지』는 일문(逸文)으로만 남았다 — 3세기 동남아를 기록한 최초의 중국 문헌이 삼국시대 오나라에서 나온 것이다.'],
 [263,0,'강족·저족과 서북의 그늘','촉의 북벌 지도에는 늘 제3의 세력이 겹쳐 있었다 — 농서의 강족과 저족이다. 천수 출신 강유는 이들을 끌어들이는 것을 북벌의 축으로 삼았고, 위는 반대로 이들을 관중 안쪽으로 강제 이주시켜 통제했다. 눈앞의 전쟁으로는 위의 관리책이 이겼다 — 그러나 이주가 쌓이고 쌓여 한 세대 뒤 관중 인구의 절반이 이민족이 되었고, 서진의 강통이 「사융론」으로 경고했으나 아무도 듣지 않았다. 그리고 304년, 흉노 유연의 거병과 함께 오호십육국의 막이 오른다 — 삼국의 소모전이 드리운 가장 길고 어두운 그림자가 이것이다.',0,'<b>출전</b> 『삼국지』 각 전, 『진서』 강통전(사융론)<br><b>연의</b> 강유 북벌 대목들에 배경으로<br><b>덧붙임</b> 강통의 「사융론」(299)은 통계로 경고했다 — "관중 인구 백여만 중 절반이 융적(戎狄)"이라며 이주민 송환을 주장했으나 묵살되었다. 5년 뒤 흉노 유연이 일어났다 — 삼국의 이민족 내지 이주 정책은 값싼 병력과 노동력이라는 단기 수익으로, 백 년 뒤의 파산을 앞당겨 쓴 신용 거래였다.'],
]},
{name:'사상·문물과 사서', sub:'THOUGHT · CULTURE · HISTORIOGRAPHY',
 spans:[[184,220,'건안'],[220,249,'위진의 학문'],[249,281,'현학과 사서']],
 events:[
 [217.5,0,'대역병과 건안칠자의 끝','건안 22년, 중원에 대역병이 돌았다 — "집집마다 시체의 아픔이 있고, 방마다 곡소리가 났다(家家有殭屍之痛 室室有號泣之哀)"고 조식이 적었다. 이 한 해에 건안칠자 중 살아 있던 다섯 — 왕찬·서간·진림·응창·유정이 모두 죽었다. 문단 하나가 통째로 지워진 것이다. 조비가 벗 오질에게 보낸 편지가 남아 있다 — "지난 역병에 친지들이 많이 화를 입었소. 서간·진림·응창·유정이 한꺼번에 떠나니, 그 문장들을 다시 펼칠 때마다 눈물이 앞을 가리는데 — 그들은 이미 흙이 되었구려." 전장의 시대에 문인들을 데려간 것은 칼이 아니라 병이었다 — 건안 문학은 이 역병과 함께 막을 내린다.',0,'<b>출전</b> 조비 「여오질서」, 『삼국지』 위서 왕찬전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 이 역병의 정체는 발진티푸스나 인플루엔자로 추정된다 — 조식의 「설역기」는 "역귀(疫鬼)가 아니라 음양의 실조"라며 부적 태우는 민간을 나무랐다. 왕찬의 장례에서 조비가 남긴 조사(弔辭)가 유명하다 — "중선(왕찬)이 당나귀 울음을 좋아했으니, 각자 한 번씩 울어 보내 주자." 문단 전체가 나귀 울음으로 곡한, 문학사에서 가장 기이한 장례다.'],
 [230.5,0,'종요와 해서(楷書)','위의 태부 종요는 두 개의 얼굴로 역사에 남았다 — 정치가로서는 관중을 안정시켜 관도의 등을 지키고 말 2천 필을 보낸 공신이고, 서예가로서는 해서(楷書)의 아버지다. 예서의 물결치는 파책을 가라앉혀 반듯한 정서체를 세웠으니 — 「선시표」·「하첩표」가 그 표본이다 — 오늘날 인쇄체의 먼 조상이 이 사람의 붓끝인 셈이다. 훗날 왕희지와 나란히 종왕(鍾王)이라 불렸다. 여든까지 살고 명제 태화 4년에 죽었다 — 글자의 모양을 바꾼 사람은 왕조가 바뀌는 것보다 오래 남는다.',4,'<b>출전</b> 『삼국지』 위서 종요전, 서예사는 『서단(書斷)』 등<br><b>연의</b> 조연으로 등장<br><b>덧붙임</b> 「선시표」·「천계직표」 등 종요의 소해(小楷)는 진적이 아닌 왕희지 임모본 계통으로 전한다 — 원본은 사라지고 베낀 손이 대가라 사본이 국보가 된 경우다. 아들 종회도 서예 명가였다 — 등애를 모함할 때 그 필적을 위조했다는 기사가 있으니, 가학(家學)이 흉기가 된 셈이다.'],
 [280.9,4,'연의가 다시 쓴 죽음들','연의의 무장은 침상에서 죽는 법이 없다 — 소설은 명장들의 병사(病死)를 부지런히 전사(戰死)로 고쳐 썼다. 병으로 죽은 장료는 정봉의 화살에(제86회), 서황은 맹달의 화살에(제94회), 감녕은 사마가의 화살에(제83회), 황충은 이릉의 전장에서(제83회) 다시 죽는다. 낙양에서 병사한 왕랑은 제갈량의 꾸짖음에 낙마사하고(제93회), 심지어 9년 전에 죽은 태사자는 합비 전투에 소환되어 전사한다(제53회). 무인의 삶은 전장에서 완성되어야 한다는 이야기의 법칙 — 소설은 그 법칙을 위해 죽음의 날짜와 장소와 사인을 통째로 다시 썼다. 이 항목에서 화살표를 따라가면, 각자의 진짜 마지막을 만날 수 있다.',0,'<b>출전</b> 각 인물의 본전과 연의 해당 회의 대조<br><b>연의</b> 제53·83·86·93·94회 등<br><b>덧붙임</b> 개작의 문법까지 일정하다 — 죽음의 자리는 주인공급 적수와의 접점으로 옮겨지고(태사자↔장료, 황충↔이릉), 사인은 화살로 통일된다. 화살은 무명의 병기 — 일기토 패배로 죽이면 명예가 깎이니, 명장들의 퇴장은 익명의 화살이 맡는 것이다. 소설의 인사(人事) 규정집이 있다면 제1조였을 조항이다.'],
 [184,0,'태평도와 오두미도','나라가 병을 못 고쳐 주자 종교가 병원을 열었다 — 장각의 태평도는 부적 태운 물과 참회로, 장릉·장로의 오두미도는 쌀 다섯 말의 회비로 병자와 유민을 거두었다. 조직은 정교했다 — 신도가 늘자 교구(方)를 짜고 교계(祭酒)를 두니, 국가가 버린 사람들의 대안 정부가 된 것이다. 황건의 구호 "누런 하늘이 서리라"의 황(黃)은 오행 사상의 토덕(土德) — 화덕(火德)의 한나라를 대신할 새 세상의 색이었다. 도교라는 종교의 출생신고서가 곧 반란의 격문이었다는 것 — 삼국지의 첫 페이지는 사상사이기도 하다.',0,'<b>출전</b> 『후한서』 황보숭전, 『삼국지』 위서 장로전<br><b>연의</b> 제1회(태평도)<br><b>덧붙임</b> 연의 제1회는 장각이 남화노선(南華老仙)에게 『태평요술』 세 권을 받는 신화로 문을 연다 — 실제 『태평경』은 우길(간길) 계통에서 전승된 방대한 도서(道書)로, 순제 대에 조정에 헌상된 기록이 있다. 오두미도의 다른 이름은 천사도(天師道) — 장릉의 후손 장천사 가문은 현대까지 이어져, 삼국시대에 창립되어 지금도 영업 중인 유일한 조직이다.'],
 [191,0,'장로의 한중 정교일치','장로는 한중 분지에서 30년간 세상에 없던 나라를 운영했다 — 스스로 사군(師君)이라 칭한 교주가 곧 통치자였고, 관리 대신 좨주(祭酒)가 다스렸다. 길목마다 의사(義舍)를 지어 쌀과 고기를 걸어 두고 지나는 이가 배만큼 먹게 했으며 — 과식하면 귀신이 벌한다고만 했다 — 죄를 지으면 세 번 용서한 뒤에야 벌했고, 가벼운 죄는 길 백 보 닦기로 갚게 했다. "백성과 오랑캐가 모두 편히 여겼다"고 정사가 적는다. 종교 코뮌이 실효 지배한 유일한 사례 — 조조도 이 나라를 접수하며 장로를 후하게 대접했다. 난세의 지도 한구석에 이런 실험이 있었다.',0,'<b>출전</b> 『삼국지』 위서 장로전<br><b>연의</b> 제59회 전후 — 종교성은 소거<br><b>덧붙임</b> 장로의 어머니는 귀도(鬼道)에 밝고 젊어 보여 유언(劉焉)의 집에 드나들었다 — 오두미도와 익주 권력의 유착이 모자(母子) 라인이었던 것이다. 조조는 항복한 장로 집단을 관중으로 집단 이주시켰다 — 이 이주로 천사도가 중원과 강남에 퍼졌으니, 정복이 포교가 된 역설이다.'],
 [196,0,'건안 문학','백골이 들에 뒹구는 시대가 역설적으로 시의 황금기를 열었다 — 건안 문학이다. 조조 부자의 막부에 공융·진림·왕찬·서간·완우·응창·유정, 이른바 건안칠자가 모였다. 이들의 붓은 난세를 직시했다 — 조조의 「호리행」은 "백골이 들판에 드러나고, 천 리에 닭 울음 하나 없다(白骨露於野 千里無雞鳴)"고 적었고, 왕찬의 「칠애시」는 굶주린 어미가 아이를 풀숲에 내려놓고 울며 떠나는 장면을 남겼다. 슬픔이 강개함과 섞인 이 기풍을 후대는 건안풍골(建安風骨)이라 불렀다 — 오언시가 문인의 정식 장르가 된 것이 바로 이 진중의 문단에서다. 칼 찬 사람들이 중국 시의 물길을 바꿨다.',0,'<b>출전</b> 조비 「전론·논문」, 『문선』<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 칠자(七子)라는 그룹명 자체가 조비의 평론 「논문」에서 나왔다 — 문학사 최초의 동인(同人) 명명이다. 조식의 「백마편」, 진림의 「음마장성굴행」 등 전쟁시의 계보가 여기서 시작해 두보의 시사(詩史)로 이어진다 — 난세가 시의 어휘를 갈아 끼운 것이다.'],
 [200,0,'정현과 경학의 종합','후한 최고의 석학 정현은 금문·고문으로 갈라져 백 년을 싸운 경학을 홀로 꿰어 집대성했다 — 이후 천 년의 유교 경전 해석이 그의 주석 위에 선다. 난세는 이 노학자마저 놓아주지 않았다 — 원소가 예를 다해 모셔 갔고, 관도 결전의 해에 원소군의 종군 요청을 받아 병든 몸으로 길을 나섰다가 일흔넷으로 객사했다. 황건군조차 그가 사는 고밀현은 침범하지 않기로 약조했다는 일화가 남아 있다 — 서로 죽이는 시대에도 학문의 이름 하나는 건드리지 않았던 것. 그 존경의 크기가 곧 무너져 가던 세계의 마지막 품위였다.',0,'<b>출전</b> 『후한서』 정현전<br><b>연의</b> 제11회에 이름만 등장<br><b>덧붙임</b> 정현의 집 여종들까지 『시경』으로 대화했다는 일화가 『세설신어』에 있다 — 진흙에 끌려가는 여종에게 다른 여종이 "어쩌다 진흙 속에(胡爲乎泥中)" 하고 시구로 놀렸다는 것. 학문이 생활어가 된 집 — 후한 경학의 절정이 어떤 풍경이었는지 보여 주는 스냅숏이다.'],
 [208,0,'화타의 죽음','화타의 진료 기록은 정사 방기전에 있는데도 믿기 어렵다 — 마비산(麻沸散)을 술에 타 마취시킨 뒤 배를 갈라 병소를 잘라 내고 꿰맸으며, 상처에 신비한 고약을 바르면 한 달에 아물었다는 것이다. 조조가 고질인 두풍(頭風) 주치의로 곁에 두려 하자, 화타는 아내의 병을 핑계로 귀향해 돌아오지 않았다 — 격노한 조조가 옥에 가두어 고문 끝에 죽였다. 순욱이 살려 두자 간했지만 "쥐새끼 같은 자" 한마디로 잘랐다. 뒤에 아들 조충이 병으로 죽자 조조가 실토했다 — "화타를 죽인 것을 후회한다." 연의 제78회의 화타는 조조의 머리를 도끼로 열자다 죽는다 — 관우를 치료한 것도(이미 죽은 뒤다), 두개골 수술 제안도 소설의 처방전이다.',0,'<b>출전</b> 『삼국지』 위서 방기전(화타전)<br><b>연의</b> 제75회(괄골요독), 제78회(처형)<br><b>덧붙임</b> 화타전의 임상 기록 16건은 중국 의학사의 보물이다 — 외과 마취 외에 기생충 토출, 심리 요법(일부러 격노시켜 어혈을 토하게 함), 오금희(五禽戲)라는 체조 처방까지 있다. 옥사 직전 옥리에게 의서 한 권을 맡기려 했으나 옥리가 법이 두려워 사양하자 태워 버렸다 — 소실된 그 한 권이 동아시아 외과학의 갈림길이었을지 모른다.'],
 [219,0,'장중경과 『상한잡병론』','남양의 장중경은 일족 2백여 명 중 3분의 2가 10년 사이에 죽는 것을 지켜보았다 — 태반이 상한(傷寒), 유행성 열병이었다. 통곡 대신 그는 책을 썼다 — 『상한잡병론』, 병의 진행 단계를 여섯으로 나누고 증상의 조합마다 처방을 짝지은 임상 의학의 원전이다. 관찰하고 분류하고 처방한다는 변증논치(辨證論治)의 방법론이 여기서 섰고, 동아시아 의학 2천 년이 이 틀 위에서 굴러갔다 — 조선의 『동의보감』도 그 후손이다. 정작 『삼국지』에는 그의 전기가 없다 — 화타는 실리고 장중경은 빠진 것이다. 사서가 적지 않았다고 없던 일이 되지는 않는다 — 이 연대기에 그를 세워 둔 이유다.',0,'<b>출전</b> 『상한론』 자서(自序)<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 원서는 전란에 흩어져 서진의 왕숙화가 『상한론』으로 재편집했고, 잡병 부분은 송대에 『금궤요략』으로 복원되었다 — 책 자체가 삼국시대를 난민처럼 통과한 것이다. 수록 처방 중 계지탕·소시호탕 등은 한·중·일 한의학에서 지금도 처방된다 — 1,800년째 유효한 의료 코드다.'],
 [230,0,'마균의 기계','위나라에 마균이라는 말더듬이 기술자가 있었다 — 말은 어눌했으나 손은 천하를 놀라게 했다. 전설로만 남았던 지남거(指南車)를 조정의 비웃음 속에 실물로 재현했고 — "빈말로 다툴 것 없이 만들어 시험하면 될 일" — 낡은 직조기의 발판을 확 줄여 생산성을 몇 배로 올렸으며, 발로 밟아 물을 끌어 올리는 번차(翻車)로 마른 땅에 물을 댔다. 제갈량의 연노를 보고는 "훌륭하나 아직 덜 됐다 — 다섯 배로 만들 수 있다"고 장담했다. 부현이 그를 "천하의 명교(名巧)"라 칭하며 지원 없는 현실을 통탄한 글이 남아 있다 — 영웅들의 시대가 기록하지 않은 또 한 명의 천재다.',0,'<b>출전</b> 배송지 주 부현 「마선생전」<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 마균의 미완성 목록이 더 아깝다 — 성을 공격하는 발석차 개량안과 수력 백희(水轉百戲) 자동인형은 실물 시연까지 했으나 국가 지원을 못 받았다. 부현의 탄식 — "그 재주는 공수반·묵자 급인데 세상에 쓰이지 못했다." 기술사가 정치사에 밀린 시대의 결산서다.'],
 [240,0,'현학의 시작 — 하안과 왕필','정시 연간의 낙양 사랑방에서 새로운 철학이 태어났다 — 주인공은 조상 정권의 이부상서 하안과, 스물넷에 요절한 천재 왕필이다. 하안의 『논어집해』와 왕필의 『노자주』·『주역주』는 훈고의 먼지를 털고 물었다 — 만물의 근본은 무엇인가. 답은 무(無). 이름 붙일 수 없는 근원에서 만물이 나온다는 이 존재론이 위진 현학(玄學)이다. 한나라를 지탱한 경학의 세계관이 왕조와 함께 무너진 자리 — 그 폐허에서 지식인들은 국가 대신 존재를 사유하기 시작했다. 하안은 고평릉 정변에 목이 잘렸지만, 그가 연 사유는 죽림칠현과 청담으로 3백 년을 흘러간다.',0,'<b>출전</b> 『삼국지』 위서 종회전 부기(왕필), 『세설신어』<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 하안이 젊은 왕필을 만나 제 득의의 논리를 격파당하자 "이런 사람과는 천인(天人)의 경계를 논할 만하다"고 감탄했다 — 스무 살 아래 신예에게 상석을 내준 것이다. 왕필의 『주역주』는 당대에 관학이 되어 한대의 상수역(象數易)을 밀어냈다 — 스물넷에 죽은 청년의 주석이 천 년 교과서가 되었다.'],
 [255,0,'죽림칠현','사마씨의 칼이 명사들을 베어 가던 시대 — 완적·혜강·산도·향수·유령·완함·왕융 일곱 사람은 대숲에 모여 술과 거문고와 청담으로 시대를 우회했다. 생존술은 저마다 달랐다 — 완적은 60일 연속 만취로 사마소의 혼담을 무산시켰고, 유령은 알몸으로 손님을 맞으며 "천지가 내 집이요 방이 내 옷인데 그대는 왜 남의 바지 속에 들어왔는가" 받아쳤다. 그러나 혜강은 우회하지 않았다 — 사마씨에 협조한 산도의 천거를 「절교서」로 내리치고, 끝내 형장에 섰다. 태학생 3천의 구명도 소용없자 그는 거문고를 청해 「광릉산」을 탔다 — "이 곡이 오늘로 끊어지는구나(廣陵散於今絕矣)." 지식인이 국가에 협조를 거부하는 법 — 그 원형이 이 대숲에 있다.',0,'<b>출전</b> 『진서』 혜강전·완적전, 『세설신어』<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 혜강 처형의 발단은 친구 여안의 가정사 송사였다 — 권력자 종회가 사적 원한을 얹어 "혜강은 와룡이니 살려 두면 안 된다"고 사마소를 부추겼다. 종회가 예전에 저서를 들고 찾아갔다가 혜강이 쇠를 두드리며 본 체도 안 하자 "들은 것을 듣고 본 것을 보고 간다"며 돌아선 원한이었다 — 대장간의 냉대 한 번이 문화사의 참수로 돌아온 것이다.'],
 [256,1,'관로와 좌자','진수는 『삼국지』의 마지막 권을 점쟁이와 의원들에게 내주었다 — 화타·두기·주건평·주선·관로의 방기전(方技傳)이다. 관로는 바람 소리로 길흉을 읽고 제 죽을 해까지 맞힌 점술가로 본문에 당당히 실렸다. 좌자는 한술 더 떠 조조 앞에서 빈 대야에 농어를 낚아 올리고, 잡으려 하자 벽 속으로 사라졌다고 『후한서』 방술전이 전한다. 연의 제68·69회의 요술 잔치가 여기서 나왔다. 정색한 역사서가 이런 이야기를 실었다는 것 — 그것이 그 시대의 마음이다.',0,'<b>출전</b> 『삼국지』 위서 방기전, 배송지 주 『신선전』 등<br><b>연의</b> 제68~69회<br><b>덧붙임</b> 관로의 자기 예언이 방기전에 있다 — "내 이마에 골(骨)이 없고 눈에 정기가 없으니 마흔일곱이나 여덟을 못 넘긴다" 했고, 마흔여덟에 죽었다. 좌자 설화는 『후한서』 방술전에도 실려 조조가 끝내 잡지 못한 것으로 끝난다 — 절대 권력이 유일하게 체포하지 못한 것이 이야기 속의 신선이었다는 점이, 이 장르의 존재 이유다.'],
 [263,0,'유휘의 『구장산술주』','위나라가 촉을 삼키던 바로 그해, 유휘라는 수학자는 전쟁과 무관한 정복을 완수했다 — 『구장산술』에 주석을 달며 원 안에 정다각형을 새겨 넣는 할원술(割圓術)로 원주율을 조였다. "잘게 자를수록 잃는 것이 적어지니, 자르고 또 잘라 자를 수 없음에 이르면 원과 하나가 된다(割之彌細 所失彌少)" — 극한 개념의 육성이다. 정192각형으로 3.14를, 정3072각형까지 밀어 3.1416을 얻었다. 부피 문제에는 무한 분할의 원리를 썼다 — 서양보다 천수백 년 이른 발상들이다. 삼국의 살육사 한 페이지 뒤에서, 한 사람이 조용히 무한을 셈하고 있었다.',0,'<b>출전</b> 『구장산술주』 서문과 본문<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 유휘의 또 다른 저작 『해도산경』은 측량학 전문서다 — 바다 위 섬의 높이를 두 개의 표척으로 재는 중차술(重差術)을 담았다. 그의 생애는 벼슬도 행적도 거의 미상 — 위나라 사람이라는 것 외에는 책만 남았다. 삼국지에 전기 한 줄 없는 사람이 삼국시대의 가장 오래갈 업적을 남겼다는 것 — 이 행의 존재 이유다.'],
 [280,0,'진수의 『삼국지』','촉의 관리였다가 진나라의 사관이 된 진수가 세 나라의 역사를 한 질로 엮었다 — 위서 30권, 촉서 15권, 오서 20권. 당대의 평이 "간결하고 바른 양사(良史)"였는데, 그 간결함이 양날이었다 — 뒷사람들이 아쉬워할 만큼 많은 것이 생략된 것이다. 구조에는 정치가 스몄다 — 선양받은 진의 정통성을 위해 위 황제만 본기(紀)에 올리고 유비·손권은 전(傳)으로 내렸으되, 촉 군주의 죽음에는 은근히 제왕의 용어를 썼다. 망국 촉의 유민이 승전국에서 옛 조국의 기록을 지켜 낸 방식이다 — 행간에 고향을 숨긴 역사서, 그것이 『삼국지』다.',0,'<b>출전</b> 『진서』 진수전<br><b>연의</b> — 소설의 원전이자 대립항<br><b>덧붙임</b> 『진서』가 전하는 필화(筆禍) 시비 — 정의(丁儀) 집안에 "쌀 천 곡을 주면 좋은 전기를 써 주겠다" 했다는 뇌물설, 아버지의 원한으로 제갈량을 깎았다는 사감설이 실렸으나, 당대부터 "무고"라는 반론이 강했다. 진수가 죽자 조정은 관리를 보내 그 집의 원고를 통째로 베끼게 했다 — 사찬(私撰)으로 시작한 책이 그렇게 국가 표준이 되었다.'],
 [280.92,1,'배송지의 주(注)','진수가 죽고 150년 — 송 문제가 배송지에게 명했다. 『삼국지』가 너무 간략하니 채워 넣으라. 배송지는 210여 종의 문헌을 긁어모아 본문의 배 가까운 주석을 달고 원칙 넷을 밝혔다 — 빠진 것은 보태고(補闕), 엇갈리는 기록은 나란히 싣고(備異), 명백한 잘못은 바로잡고(懲違), 시비는 논한다(辨理). 혁명적인 것은 두 번째다 — 판별이 어려우면 모순된 기록을 다 실어 독자에게 넘긴 것이다. 여백사 살해의 세 판본이 살아남은 것도, 칠종칠금과 공성계 반박이 전해진 것도 이 원칙 덕분이다 — 우리가 아는 삼국지 이야기의 절반은 본문이 아니라 이 주석에서 왔다. 이 연대기의 두 번째 색이 곧 배송지의 층이다.',0,'<b>출전</b> 「상삼국지주표(上三國志注表)」<br><b>연의</b> — 소설 재료의 절반이 이 주석에서 나왔다<br><b>덧붙임</b> 송 문제가 완성본을 보고 한 말이 전한다 — "이것은 불후(不朽)의 작업이다." 배송지가 인용한 문헌 210여 종 가운데 온전히 전하는 것은 손에 꼽는다 — 『위략』도 『강표전』도 『한진춘추』도 원본은 사라졌다. 주석이 곧 방주(方舟)였던 셈 — 삼국의 기억 절반은 이 배에 실려 살아남았다.'],
 [280.92,2,'평화(平話)에서 나관중까지','정사가 덮인 뒤에도 이야기는 저잣거리에서 계속 자랐다 — 소동파가 목격담을 남겼다. "골목의 아이들이 삼국 이야기를 듣다가, 유현덕이 지면 눈물을 흘리고 조조가 지면 좋아라 소리친다." 송나라 골목에서 이미 승패가 정해져 있었던 것이다. 원나라 때 그림책 『전상삼국지평화』와 수십 편의 잡극이 나왔고 — 여기서는 유비가 태수가 되고 장비가 독우를 때린다 — 원말명초의 나관중이 이 바다를 정사의 뼈대에 얹어 『삼국지통속연의』로 빚었다. 오늘 우리가 읽는 판본은 청 강희 연간 모종강 부자의 개정본이다 — 그러니 삼국지 이야기는 한 작가의 창작이 아니라, 천 년 관객의 합작품이다.',0,'<b>출전</b> 『동파지림』, 『전상삼국지평화』(1321~23 간행)<br><b>연의</b> — 그 완성형<br><b>덧붙임</b> 『평화』의 개막은 사마중상(司馬仲相)의 저승 재판이다 — 한 고조에게 억울하게 죽은 한신·팽월·영포가 조조·유비·손권으로 환생해 한나라를 셋으로 찢는다는 인과응보 설계다. 나관중은 이 저승 프레임을 걷어내고 정사의 연대기를 깔았다 — 민담의 상상력에 사관(史官)의 뼈대를 이식한 것, 그것이 연의의 발명이다.'],
 [280.92,2,'칠실삼허 — 이 연대기가 나눈 것','청나라의 사학자 장학성이 연의에 유명한 판정을 내렸다 — "일곱은 사실이고 셋은 허구라, 도리어 보는 이를 홀린다(七實三虛 惑亂觀者)." 전부 지어낸 이야기라면 아무도 속지 않는다 — 문제는 사실의 뼈대 위에 허구가 이음새 없이 얹혀, 어디까지가 역사인지 보이지 않는다는 것이다. 도원결의는 없었지만 세 사람의 결속은 있었고, 초선은 없었지만 이름 없는 시비는 있었으며, 공성계는 없었지만 빈 진영을 연 조운은 있었다 — 이 연대기가 다섯 가지 색으로 하려는 일이 바로 그 이음새를 드러내는 것이다. 허구를 걷어 내면 이야기가 초라해질까 — 오히려 반대다. 어디까지가 진짜인지 아는 순간, 진짜가 얼마나 대단했는지 보이기 시작한다.',0,'<b>출전</b> 장학성 『병진차기』<br><b>연의</b> — 그 자체에 대한 평<br><b>덧붙임</b> 장학성의 원문은 비교론이다 — "『서유기』나 『금병매』 같은 순전한 허구는 사람을 홀리지 않는데, 삼국연의만은 칠실삼허라 보는 이를 어지럽힌다." 허구율 30%가 100%보다 위험하다는 역설 — 정보의 시대에도 유효한 미디어론이라, 이 18세기 독후감은 지금도 인용이 끊이지 않는다.'],
]}]},

/* ───────── build ───────── */
let dragged=false;   /* 드래그 직후의 click 이벤트를 구분하기 위한 플래그 */
const canvas=document.getElementById('canvas');
const viewport=document.getElementById('viewport');
const tip=document.getElementById('tip');
const active=new Set([0,1,2,3,4]);   /* 범례 필터 상태 */
let evEls=[], bandEls=[];            /* 스크롤 처리용 캐시 — build()가 갱신 */
let keyIndex=new Map(), relSvg=null; /* 사건 키 → 좌표·데이터, 관계선 SVG 레이어 */
const MONTH=new Map();               /* 사건 키 → 사료로 확인된 달 (없으면 연도만 표시) */
const EXTRA=new Map();               /* 사건 키 → 상세 블록(출전·연의 회차·덧붙임 HTML) */
const SVGNS='http://www.w3.org/2000/svg';
const fmtY=y=>String(y);
const labelW=t=>[...t].reduce((w,ch)=>w+(ch.charCodeAt(0)>0x2000?11.4:6.6),0)+14;

/* 눈금: 배율을 곱한 간격이 130px 이상이 되는 단위를 구간별로 고름 */
function makeTicks(){
  const NICE=[1,2,5,10,25,50,100], t=[];
  for(const [a,b,k] of SEGS){
    const step=NICE.find(s=>s*k*Z>=100)||100;
    for(let y=Math.ceil(a/step)*step; y<b; y+=step) t.push(y);
  }
  return t;
}

/* 배율이 바뀔 때마다 전체 캔버스를 다시 그린다 (310개 사건 기준 수십 ms) */
function build(){
canvas.innerHTML='';
keyIndex=new Map();
canvas.style.width=totalW()+'px';
const frag=document.createDocumentFragment();

/* axis */
const axis=document.createElement('div'); axis.id='axis';
for(let i=0;i<ERAS.length;i++){
  const [start,name]=ERAS[i], end=(i+1<ERAS.length)?ERAS[i+1][0]:ERAEND;
  const b=document.createElement('div'); b.className='eraband serif';
  b.style.left=X(start)+'px'; b.style.width=(X(end)-X(start))+'px';
  b.dataset.x=X(start); b.dataset.w=X(end)-X(start);
  const bi=document.createElement('i'); bi.textContent=name; b.appendChild(bi);
  axis.appendChild(b);
}
const ticks=makeTicks();
for(const y of ticks){
  const major = y%10===0 || ERAS.some(e=>e[0]===y);
  const t=document.createElement('div'); t.className='tick'+(major?' major':'');
  t.style.left=X(y)+'px';
  const s=document.createElement('span'); s.textContent=fmtY(y); t.appendChild(s);
  axis.appendChild(t);
}
frag.appendChild(axis);

/* vertical gridlines + era shading (behind rows) */
for(let i=0;i<ERAS.length;i++){
  if(i%2===1){
    const start=ERAS[i][0], end=(i+1<ERAS.length)?ERAS[i+1][0]:ERAEND;
    const sh=document.createElement('div'); sh.className='erashadeCol';
    sh.style.left=X(start)+'px'; sh.style.width=(X(end)-X(start))+'px';
    frag.appendChild(sh);
  }
}
for(const y of ticks){
  const g=document.createElement('div');
  g.className='gridline'+((y%10===0||ERAS.some(e=>e[0]===y))?' major':'');
  g.style.left=X(y)+'px'; frag.appendChild(g);
}
for(const [start] of ERAS){
  const g=document.createElement('div'); g.className='gridline major';
  g.style.left=X(start)+'px'; frag.appendChild(g);
}

/* rows */
for(const region of REGIONS){
  const rh=document.createElement('div'); rh.className='regionhead';
  const rl=document.createElement('span'); rl.className='rl'; rl.textContent=region.name;
  rh.appendChild(rl); frag.appendChild(rh);

  for(const row of region.rows){
    const r=document.createElement('div'); r.className='row';
    const base=document.createElement('div'); base.className='baseline'; r.appendChild(base);

    row.spans.forEach(([a,b,name,pre],i)=>{
      const s=document.createElement('div'); s.className='span'+(i%2?' alt':'')+(pre?' pre':'');
      const x1=Math.max(X(a),RAIL), x2=X(Math.min(b,2026));
      if(x2-x1<6)return;
      s.style.left=x1+'px'; s.style.width=(x2-x1-2)+'px';
      s.dataset.x=x1; s.dataset.w=x2-x1-2;
      if(x2-x1>46){const i=document.createElement('i');i.textContent=name;s.appendChild(i);}
      s.title=name+' ('+fmtY(a)+' ~ '+(b>=2030?'현재':fmtY(b))+')';
      r.appendChild(s);
    });

    /* stagger labels onto 4 shelves */
    /* 라벨 선반: 기준선(BASE=75) 위·아래로 번갈아 배치 */
    const shelves=[{y:41,end:-1e9},{y:91,end:-1e9},{y:57,end:-1e9},{y:109,end:-1e9},{y:25,end:-1e9},{y:127,end:-1e9}];
    const evs=[...row.events].sort((a,b)=>a[0]-b[0]);
    /* 같은 해에 사건이 여럿이면 점이 정확히 겹쳐 위의 것만 잡히므로,
       두 번째부터 7px씩 오른쪽으로 비켜 놓는다 (밀집 구간에서 1~2년어치라 연도 왜곡은 없음) */
    const usedX={};
    for(const [year,cat,title,desc,month,extra] of evs){
      const x0=X(year), w=labelW(title);
      const n=usedX[x0]|0; usedX[x0]=n+1;
      const x=x0+n*7;
      let shelf=shelves.find(s=>x>s.end+8);
      if(!shelf)shelf=shelves.reduce((m,s)=>s.end<m.end?s:m);
      shelf.end=x+w;
      const e=document.createElement('div'); e.className='ev'; e.dataset.cat=cat;
      e.style.left=x+'px';
      if(!active.has(cat))e.classList.add('dim');   /* 재빌드 시 필터 상태 유지 */
      const color='var(--c'+cat+')';
      const dot=document.createElement('div'); dot.className='dot'; dot.style.background=color;
      e.appendChild(dot);
      if(Math.abs(shelf.y-BASE)>20){
        const c=document.createElement('div'); c.className='conn';
        if(shelf.y<BASE){c.style.top=(shelf.y+15)+'px'; c.style.height=(BASE-5-shelf.y-15)+'px';}
        else{c.style.top=(BASE+5)+'px'; c.style.height=(shelf.y-BASE-5)+'px';}
        e.appendChild(c);
      }
      const l=document.createElement('div'); l.className='lbl';
      l.style.top=shelf.y+'px'; l.textContent=title;
      e.appendChild(l);
      e.dataset.x=x; e.dataset.w=w;
      const key=row.name+'|'+year+'|'+title;
      e.dataset.key=key;
      if(relAdj.has(key))e.classList.add('hasrel');
      keyIndex.set(key,{el:e,x,year,cat,title,desc,rowName:row.name,y:0,rowTop:0});
      if(month)MONTH.set(key,month);
      if(extra)EXTRA.set(key,extra);
      e.tabIndex=0; e.setAttribute('role','button');
      e.setAttribute('aria-label',ym(year,key)+' '+row.name+' — '+title);
      e.addEventListener('mouseenter',ev=>{
        showTip(ev,year,cat,title,desc,row.name,key);
        if(!pinned)showRel(key);   /* 마우스오버만으로 관계 표시 (핀 상태가 우선) */
      });
      e.addEventListener('mousemove',moveTip);
      e.addEventListener('mouseleave',()=>{
        if(!pinned){tip.style.display='none'; clearRel();}
      });
      e.addEventListener('click',ev=>{
        if(dragged)return;   /* 드래그로 스크롤한 직후의 클릭은 무시 */
        ev.stopPropagation();
        pinTip(e,year,cat,title,desc,row.name);
      });
      e.addEventListener('focus',()=>{
        /* 마우스 클릭도 포커스를 주므로, 그때는 click 쪽에만 맡긴다.
           둘 다 pinTip을 부르면 핀이 켜졌다 곧바로 꺼져 고정이 안 됨 */
        if(!e.matches(':focus-visible'))return;
        e.scrollIntoView({block:'nearest',inline:'center',behavior:'auto'});
        pinTip(e,year,cat,title,desc,row.name);
      });
      e.addEventListener('keydown',ev=>{
        if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pinTip(e,year,cat,title,desc,row.name);}
      });
      r.appendChild(e);
    }

    const lab=document.createElement('div'); lab.className='rowlabel';
    lab.innerHTML='<b>'+row.name+'</b><small>'+row.sub+'</small>';
    r.prepend(lab);
    frag.appendChild(r);
  }
}
canvas.appendChild(frag);

/* 스크롤 처리용 캐시 갱신 */
evEls=[...canvas.querySelectorAll('.ev')].map(el=>({el, x:+el.dataset.x, w:+el.dataset.w, behind:false}));
bandEls=[...canvas.querySelectorAll('.eraband, .span')].filter(el=>el.querySelector('i'))
  .map(el=>({i:el.querySelector('i'), x:+el.dataset.x, w:+el.dataset.w, tx:-1}));

/* 관계선 SVG 오버레이 + 사건별 세로 좌표 캐시 (레이아웃 확정 후 계산) */
relSvg=document.createElementNS(SVGNS,'svg');
relSvg.id='relsvg';
relSvg.innerHTML='<defs><marker id="arrowm" viewBox="0 0 10 10" refX="8.5" refY="5"'
 +' markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">'
 +'<path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>'
 /* 'shift'(연의가 옮긴 자리)는 이전 분류와 같은 색의 화살표로 구분한다 */
 +'<marker id="arrows" viewBox="0 0 10 10" refX="8.5" refY="5"'
 +' markerWidth="7" markerHeight="7" orient="auto-start-reverse">'
 +'<path d="M0,0 L10,5 L0,10 z" fill="var(--c3)"/></marker></defs><g id="relg"></g>';
canvas.appendChild(relSvg);
for(const info of keyIndex.values()){
  info.rowTop=info.el.parentElement.offsetTop;
  info.y=info.rowTop+BASE;
}
}
build();

/* ───────── tooltip ───────── */
function eraOf(y){let n=ERAS[0][1];for(const[s,name]of ERAS){if(y>=s)n=name}return n}
/* 연도의 소수부는 연(年) 안에서의 배치용일 뿐 달이 아니다.
   달은 사료로 확인된 것만 events의 5번째 원소로 적고, 그때만 표시한다 */
function koreanYear(y){return Math.floor(y)+'년'}
function ym(y,key){const m=key&&MONTH.get(key);return Math.floor(y)+'년'+(m?' '+m+'월':'')}
const isTouch=matchMedia('(hover: none)').matches;
let pinned=null;
/* 사건 이미지 블록. 자리를 미리 차지하되 로드 실패 시 스스로 접혀,
   오프라인(file://)에서는 이미지가 없던 때와 똑같이 보임 */
function imgHTML(key){
  const m=key&&IMGS[key]; if(!m)return '';
  return '<div class="tim"><img alt="" decoding="async" referrerpolicy="no-referrer" src="'
    +IMGB+m[0]+'"></div>'
    +'<a class="tsrc" href="https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(m[1])
    +'" target="_blank" rel="noreferrer">이미지: 위키미디어 공용</a>';
}
function fillTip(year,cat,title,desc,country,key){
  tip.innerHTML='<div class="ty">'+ym(year,key)+' · '+country+'</div>'
    +'<div class="tt">'+title+'</div>'+imgHTML(key)+'<div class="td">'+desc+'</div>'
    +(EXTRA.has(key)?'<div class="tx">'+EXTRA.get(key)+'</div>':'')
    +'<div class="tc"><i style="background:var(--c'+cat+')"></i>'+CATS[cat].n+' · '+eraOf(year)+'</div>';
  const im=tip.querySelector('.tim img');
  if(im){
    const box=im.parentElement;
    /* 원본이 박스보다 작으면 cover로 늘리면 흐려지므로 원본 크기로 맞춰 보여준다 */
    const mark=()=>{
      if(im.naturalWidth<box.clientWidth||im.naturalHeight<box.clientHeight)box.classList.add('fit');
      box.classList.add('on');
    };
    if(im.complete&&im.naturalWidth)mark();   /* 캐시된 이미지 */
    else{
      im.addEventListener('load',mark,{once:true});
      im.addEventListener('error',()=>box.classList.add('off'),{once:true});
    }
  }
}
function showTip(ev,year,cat,title,desc,country,key){
  if(pinned)return;
  fillTip(year,cat,title,desc,country,key);
  /* 관계가 있으면 힌트 한 줄 — 클릭하면 연결이 그려진다는 안내 */
  const rels=key&&relAdj.get(key);
  if(rels&&rels.length)tip.insertAdjacentHTML('beforeend',
    '<div class="rlhint">연관 사건 '+rels.length+'건 — 클릭하면 목록과 함께 고정</div>');
  tip.classList.remove('sheet'); tip.style.display='block'; moveTip(ev);
}
function moveTip(ev){
  if(pinned)return;
  const w=tip.offsetWidth,h=tip.offsetHeight, M=10;
  let x=ev.clientX+16,y=ev.clientY+14;
  if(x+w>innerWidth-M)x=ev.clientX-w-14;
  if(y+h>innerHeight-M)y=ev.clientY-h-12;
  /* 화면 밖으로 밀리지 않도록 최종 클램프 */
  x=Math.min(Math.max(M,x),Math.max(M,innerWidth-w-M));
  y=Math.min(Math.max(M,y),Math.max(M,innerHeight-h-M));
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
/* 클릭/터치: 하단 시트로 고정 표시 + 연관 사건 연결 표시 */
function pinTip(el,year,cat,title,desc,country){
  if(pinned===el){hideTip();return;}
  if(pinned)pinned.classList.remove('sel');
  pinned=el; el.classList.add('sel');
  fillTip(year,cat,title,desc,country,el.dataset.key);
  tip.insertAdjacentHTML('beforeend',relChipsHTML(el.dataset.key));
  showRel(el.dataset.key);
  tip.classList.add('sheet');
  tip.style.left=''; tip.style.top='';
  tip.style.display='block';
}
function hideTip(){
  if(pinned)pinned.classList.remove('sel');
  pinned=null; tip.style.display='none'; tip.classList.remove('sheet');
  clearRel();
}

/* ───────── 사건 간 관계 표시 ───────── */
function clearRel(){
  canvas.classList.remove('relmode');
  const g=relSvg&&relSvg.querySelector('#relg');
  if(g)g.innerHTML='';
  for(const el of canvas.querySelectorAll('.ev.rel'))el.classList.remove('rel');
}
function showRel(key){
  clearRel();
  const rels=relAdj.get(key); if(!rels||!rels.length)return;
  const a=keyIndex.get(key); if(!a)return;
  canvas.classList.add('relmode');
  a.el.classList.add('rel');   /* 기준 사건도 강조 대상에 포함 */
  for(const r of rels){
    const b=keyIndex.get(r.key); if(!b)continue;
    b.el.classList.add('rel');
    /* 인과는 원인→결과, 이전(shift)은 연의→정사 방향으로 화살표를 그린다 */
    if((r.type==='cause'||r.type==='shift')&&r.dir==='in')drawLink(b,a,r.type);
    else drawLink(a,b,r.type);
  }
}
function drawLink(a,b,type){
  const g=relSvg.querySelector('#relg');
  const x1=a.x,y1=a.y,x2=b.x,y2=b.y;
  let d;
  if(y1===y2){          /* 같은 행: 기준선 위로 아치 */
    const cy=y1-58;
    d=`M ${x1} ${y1} C ${x1+(x2-x1)*.25} ${cy}, ${x1+(x2-x1)*.75} ${cy}, ${x2} ${y2}`;
  }else if(Math.abs(x2-x1)<24){   /* 같은 해 다른 행: 옆으로 불룩한 세로 곡선 */
    const bx=Math.max(x1,x2)+56;
    d=`M ${x1} ${y1} C ${bx} ${y1}, ${bx} ${y2}, ${x2} ${y2}`;
  }else{
    d=`M ${x1} ${y1} C ${x1+(x2-x1)*.4} ${y1}, ${x1+(x2-x1)*.6} ${y2}, ${x2} ${y2}`;
  }
  const p=document.createElementNS(SVGNS,'path');
  p.setAttribute('d',d);
  p.setAttribute('fill','none');
  p.setAttribute('stroke',type==='cause'?'var(--accent)':type==='shift'?'var(--c3)':'var(--ink3)');
  p.setAttribute('stroke-width',type==='shift'?'2.2':'1.6');
  p.setAttribute('opacity','.85');
  if(type==='link')p.setAttribute('stroke-dasharray','5 4');
  else if(type==='shift'){p.setAttribute('stroke-dasharray','8 4');p.setAttribute('marker-end','url(#arrows)');}
  else p.setAttribute('marker-end','url(#arrowm)');
  g.appendChild(p);
}
/* 툴팁의 연관 사건 목록 (핀 상태에서만 표시) */
function relChipsHTML(key){
  const rels=relAdj.get(key); if(!rels||!rels.length)return '';
  const items=rels.map(r=>{
    const t=keyIndex.get(r.key); if(!t)return '';
    const glyph=r.type==='cause'?(r.dir==='out'?'결과 →':'← 원인')
      :r.type==='shift'?(r.dir==='out'?'실제 사건 →':'← 연의가 옮겨 온 자리'):'연관';
    return '<button type="button" class="relchip" data-key="'+r.key.replace(/"/g,'&quot;')+'">'
      +'<span class="rc1"><i style="background:var(--c'+t.cat+')"></i>'
      +t.rowName+' · '+ym(t.year,r.key)+' · <b>'+t.title+'</b><em>'+glyph+'</em></span>'
      +'<span class="rc2">'+r.note+'</span></button>';
  }).join('');
  return '<div class="rl2"><b>연관 사건 '+rels.length+'건</b>'+items+'</div>';
}
/* 칩 클릭 → 해당 사건으로 이동하며 핀 전환 */
tip.addEventListener('click',ev=>{
  const c=ev.target.closest('.relchip'); if(!c)return;
  const t=keyIndex.get(c.dataset.key); if(!t)return;
  viewport.scrollTo({
    left:Math.max(0,t.x-(viewport.clientWidth+RAIL)/2),
    top:Math.max(0,t.rowTop-(viewport.clientHeight-134)/2),
    behavior:smooth
  });
  pinTip(t.el,t.year,t.cat,t.title,t.desc,t.rowName);
});
/* 빈 곳을 탭하면 닫기 */
viewport.addEventListener('click',e=>{if(pinned&&!e.target.closest('.ev'))hideTip();});
addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});

/* ───────── legend filter ───────── */
const legend=document.getElementById('legend');
CATS.forEach((c,i)=>{
  const b=document.createElement('button'); b.type='button'; b.className='chip on';
  b.innerHTML='<span class="dot" style="background:var('+c.v+')"></span>'+c.n;
  b.title=c.n+' — '+c.d;
  b.setAttribute('aria-pressed','true');
  b.addEventListener('click',()=>{
    if(active.has(i)&&active.size===1){for(let k=0;k<5;k++)active.add(k);}
    else if(active.size===5){active.clear();active.add(i);}
    else if(active.has(i)){active.delete(i);if(active.size===0)for(let k=0;k<5;k++)active.add(k);}
    else active.add(i);
    document.querySelectorAll('#legend .chip').forEach((el,k)=>{
      el.className='chip '+(active.has(k)?'on':'off');
      el.setAttribute('aria-pressed',active.has(k));
    });
    document.querySelectorAll('.ev').forEach(el=>{
      el.classList.toggle('dim',!active.has(+el.dataset.cat));
    });
  });
  legend.appendChild(b);
});

/* ───────── era navigation ───────── */
const smooth=matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
const eranav=document.getElementById('eranav');
[['처음',176],...ERAS.slice(1).map(e=>[e[1],e[0]]),['적벽',208.83],['끝',280.5]].forEach(([name,y])=>{
  const b=document.createElement('button'); b.type='button'; b.textContent=name;
  b.addEventListener('click',()=>{
    /* 시기마다 활성 행이 달라(후한 말은 위쪽, 진의 통일은 아래쪽) 가로만 옮기면
       빈 행만 보인다. 그 시기에 사건이 있는 첫 행으로 세로 위치까지 맞춰 준다 */
    let top=null;
    for(const info of keyIndex.values()){
      if(Math.abs(info.year-y)>8)continue;
      if(top===null||info.rowTop<top)top=info.rowTop;
    }
    viewport.scrollTo({
      left:Math.max(0,X(y)-RAIL-60),
      top:top===null?viewport.scrollTop:Math.max(0,top-70),
      behavior:smooth
    });
  });
  eranav.appendChild(b);
});

/* ───────── zoom ───────── */
const zin=document.getElementById('zin'), zout=document.getElementById('zout'), zval=document.getElementById('zval');
/* anchorYear가 focusPx(뷰포트 안 화면 x) 자리에 그대로 남도록 배율을 바꾼다 */
function setZoom(n, anchorYear, focusPx){
  n=Math.max(0,Math.min(ZOOMS.length-1,n));
  if(n===zi)return;
  if(focusPx==null)focusPx=(viewport.clientWidth+RAIL)/2;
  if(anchorYear==null)anchorYear=invX(viewport.scrollLeft+focusPx);
  const st=viewport.scrollTop;
  zi=n; Z=ZOOMS[zi];
  hideTip();
  build();
  viewport.scrollLeft=Math.max(0, X(anchorYear)-focusPx);
  viewport.scrollTop=st;
  zval.textContent=Math.round(Z*100)+'%';
  zout.disabled=zi===0; zin.disabled=zi===ZOOMS.length-1;
  updateReadout(); updateBehind(); updateStickyLabels();
}
zin.addEventListener('click',()=>setZoom(zi+1));
zout.addEventListener('click',()=>setZoom(zi-1));
/* Ctrl(⌘)+휠, 트랙패드 핀치: 커서가 가리키는 연도를 고정점으로 확대/축소 */
viewport.addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey)return;
  e.preventDefault();
  const fx=e.clientX-viewport.getBoundingClientRect().left;
  setZoom(zi+(e.deltaY<0?1:-1), invX(viewport.scrollLeft+fx), fx);
},{passive:false});

/* ───────── readout ───────── */
const readout=document.getElementById('readout');
function updateReadout(){
  const cx=viewport.scrollLeft+(viewport.clientWidth+RAIL)/2;
  /* 208년 구간은 한 해가 화면 몇 개 너비라 반올림하면 눈금이 멈춘 것처럼 보인다 — 달까지 보여준다 */
  const raw=invX(cx);
  readout.innerHTML='<b>'+Math.floor(raw)+'</b><span>'+eraOf(raw)+' · 화면 중앙 연도</span>';
}
/* ───────── 레일에 가려지는 라벨 숨김 ───────── */
function updateBehind(){
  const sl=viewport.scrollLeft, edge=sl+RAIL+6;
  for(const it of evEls){
    /* 레일과 겹치는 구간(라벨 시작점이 레일 뒤, 끝점은 아직 레일 오른쪽)만 숨김.
       완전히 왼쪽으로 지나간 것은 어차피 보이지 않으므로 건드리지 않는다. */
    const behind = it.x < edge && it.x + it.w > sl;
    if(behind!==it.behind){it.behind=behind; it.el.classList.toggle('behind',behind);}
  }
}
/* ───────── 시대·왕조 밴드 라벨을 화면 안쪽에 붙여 두기 ─────────
   부모가 sticky/absolute 문맥이라 CSS position:sticky가 듣지 않으므로
   스크롤에 맞춰 transform으로 직접 밀어 준다. */
function updateStickyLabels(){
  const edge=viewport.scrollLeft+RAIL+14;
  for(const b of bandEls){
    const lw=b.i.offsetWidth;
    /* 밴드 왼쪽이 레일에 가리면 그만큼 오른쪽으로 밀되, 밴드 끝을 넘지 않게 */
    let tx=Math.max(0,Math.min(edge-b.x, b.w-lw-4));
    tx=Math.max(0,tx);
    if(tx!==b.tx){b.tx=tx; b.i.style.transform=tx?'translateX('+tx+'px)':'';}
  }
}
let raf=0;
function onScroll(){
  updateReadout();
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;updateBehind();updateStickyLabels()});
}
viewport.addEventListener('scroll',onScroll,{passive:true});
updateReadout(); updateBehind(); updateStickyLabels();

/* ───────── drag to pan ───────── */
let drag=null;
viewport.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  drag={x:e.clientX,y:e.clientY,sl:viewport.scrollLeft,st:viewport.scrollTop,id:e.pointerId,moved:false};
});
viewport.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;viewport.classList.add('dragging');viewport.setPointerCapture(drag.id);}
  if(drag.moved){viewport.scrollLeft=drag.sl-dx;viewport.scrollTop=drag.st-dy;}
});
['pointerup','pointercancel'].forEach(t=>viewport.addEventListener(t,()=>{
  if(drag&&drag.moved){
    viewport.classList.remove('dragging');
    dragged=true; setTimeout(()=>dragged=false,0);   /* 뒤이어 오는 click 한 번만 무시 */
  }
  drag=null;
}));

/* keyboard */
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')viewport.scrollBy({left:320,behavior:smooth});
  else if(e.key==='ArrowLeft')viewport.scrollBy({left:-320,behavior:smooth});
  else if(e.key==='+'||e.key==='=')setZoom(zi+1);
  else if(e.key==='-')setZoom(zi-1);
});
</script>
