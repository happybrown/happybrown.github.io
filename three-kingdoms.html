 [221.5,0,'우금의 죽음','30년을 조조 곁에서 싸운 명장 우금은 번성의 홍수에서 항복을 택했고, 함께 잡힌 방덕은 죽음을 택했다. 조조가 탄식했다. "우금을 안 지 30년인데, 어찌 위기 앞에서 방덕만 못했단 말인가." 오나라를 거쳐 백발이 되어 돌아온 우금에게 조비는 겉으로는 춘추의 고사를 들며 위로했다. 그러고는 조조의 능에 참배를 보냈는데 — 능의 벽에 미리 그림을 그려 두게 했다. 관우가 이기고, 방덕이 노하고, 우금이 무릎 꿇는 그림이었다. 우금은 그것을 보고 부끄러움에 병들어 죽었다. 정사 본문에 있는, 삼국지에서 가장 잔인한 복수다 — 칼을 쓰지 않았다.',0,'<b>출전</b> 『삼국지』 위서 우금전<br><b>연의</b> 제79회<br><b>덧붙임</b> 우금은 관도 무렵 "법으로 아군도 벤다"는 평을 들은 군율의 화신이었다 — 창희의 난 때는 옛 친구까지 눈물을 흘리며 처형해 조조의 신임을 굳혔다. 그런 사람이라 항복의 낙차가 더 컸다. 시호는 여후(厲侯) — 사나울 여(厲)는 악시(惡諡)다. 무덤 벽화보다 시호가 더 냉정한 복수였는지도 모른다.'],
 [222.5,0,'장료의 죽음','합비의 이름이 아직 강동의 아이들을 울릴 무렵, 장료는 병든 몸으로 다시 남쪽 전선에 불려 나왔다. 손권이 장수들에게 단단히 일렀다. "장료가 병들었다 해도 당해 낼 수 없는 사람이다. 삼가라." 병상의 이름만으로 적국 황제의 경계령을 받은 장수 — 그 마지막 출전에서도 오군을 깨뜨리고 그해 강도에서 죽었다. 연의 제86회는 그를 정봉의 화살에 맞아 죽게 했지만, 정사의 장료는 제 명대로 살다 갔다. 무장의 죽음이 반드시 화살일 필요는 없다는 것을 소설만 몰랐다.',0,'<b>출전</b> 『삼국지』 위서 장료전<br><b>연의</b> 제86회<br><b>덧붙임</b> 합비의 소요진 돌격 때 장료는 포위망에 갇힌 부하들의 외침을 듣고 도로 뚫고 들어가 구해 나왔다 — "장군이 우리를 버리시렵니까"라는 소리에 말머리를 돌린 것이다. 위진 시대 내내 "장료가 800으로 10만을 깼다"는 이야기는 군담의 표준이 되었고, 일본에까지 랴오라이라이(遼來來) — 장료가 온다는 말이 전해졌다는 속설이 붙었다.'],
 [223.45,0,'조창의 죽음','조조의 둘째 아들 조창은 수염이 노래서 황수아(黃鬚兒)라 불린 집안의 야전 사령관이었다 — 代 땅의 오환 반란을 몸소 선봉에 서서 평정하자 조조가 그 수염을 잡고 기뻐했다. "황수아가 정말 해냈구나!" 그러나 아버지가 죽자 이 용맹이 그대로 혐의가 되었다 — 조창이 조비에게 선왕의 옥새가 어디 있느냐 물었다는 기록이 남아 있을 만큼, 무력을 가진 아우는 그 자체로 위협이었다. 봉지에 눌려 지내던 조창은 황초 4년 낙양으로 입조했다가 관저에서 급사(暴薨)했다 — 서른다섯이었다. 병사인가 아닌가, 사서는 급(暴) 한 글자만 남겼다.',6,'<b>출전</b> 『삼국지』 위서 임성위왕창전<br><b>연의</b> 제78~79회 — 병력 10만을 이끌고 문상 왔다가 가규의 설득에 돌아가는 것으로 처리<br><b>덧붙임</b> 『세설신어』는 독살설을 전한다 — 조비가 변태후의 처소에서 바둑을 두며 독 바른 대추를 골라 먹였고, 물을 찾자 미리 그릇을 다 깨 두어 태후가 맨발로 우물까지 달려갔으나 늦었다는 것이다. 사가들은 신빙성을 의심하지만, 이런 소문이 돌았다는 것 자체가 조비 형제 정책의 평판이었다.'],
 [223.3,0,'조인의 죽음','조인의 진가는 이기는 싸움이 아니라 버티는 싸움에서 나왔다. 강릉에서 주유의 대군을 1년간 붙들었고, 번성에서는 성벽이 물에 잠겨 몇 자만 남은 절망 속에서 항복 논의를 잘라 말했다 — 백마를 잡아 맹세하고 수천 명으로 버틴 끝에 관우의 예봉을 세웠다. 젊어서는 방탕했으나 장수가 되자 법조문을 머리맡에 두고 살았다고 정사는 적는다. 만년의 유수구 공략에서 신예 주환에게 패한 이듬해 56세로 죽었다 — 조씨 종실 최고의 방패가 물러나며, 위의 남쪽 전선은 눈에 띄게 조용해진다.',3,'<b>출전</b> 『삼국지』 위서 조인전<br><b>연의</b> 후반부에서 조용히 퇴장<br><b>덧붙임</b> 강릉 농성 때 부하 우금(牛金)이 포위되자 조인이 수십 기로 적진에 뛰어들어 구해 냈다 — 좌우가 말리자 "장수가 부하를 버리면 무엇으로 서느냐"며 두 번 들어갔다 두 번 나왔다. 진교(陳矯)가 성루에서 지켜보다 감탄했다. "장군은 참으로 하늘이 낸 사람(天人)이오." 번성의 수성전은 이 담력의 연장이었다.'],
 [227.5,0,'서황의 죽음','번성 포위전의 해결사가 서황이었다. 신병 위주의 병력으로 관우의 포위망 열 겹을 정면으로 뚫었다 — 조조가 감탄했다. "내가 용병 30년에, 적의 포위를 이렇게 곧장 뚫고 들어간 사람은 듣지 못했다." 진영이 어찌나 정연했던지 조조는 그를 주아부에 견주었다. 정작 본인은 공을 떠벌리는 법이 없었다. "옛사람은 밝은 임금 못 만날까 걱정했는데 나는 만났으니, 공으로 갚을 뿐 무슨 사사로운 명예인가." 병으로 죽으며 검소한 장례를 당부했다. 연의는 이 사람마저 맹달의 화살에 죽였다 — 소설은 노장이 침상에서 죽는 것을 참지 못한다.',0,'<b>출전</b> 『삼국지』 위서 서황전<br><b>연의</b> 제94회<br><b>덧붙임</b> 번성 구원전의 백미는 심리전이었다 — 서황과 관우는 옛 친구라 진 앞에서 안부를 나눴는데, 대화가 끝나자 서황이 즉시 영을 내렸다. "관운장의 목에 금 천 근." 관우가 놀라 "형, 이게 무슨 말이오" 하니 — "이것은 나라의 일이오(此國之事耳)." 사귐과 공무를 칼로 자른 이 한마디가 서황이라는 사람의 전부다.'],
 [228.9,0,'왕랑의 죽음','연의 제93회에서 일흔여섯 왕랑은 위군 진 앞에 나가 제갈량을 설득하려다, "머리 센 필부, 수염 푸른 늙은 도적(皓首匹夫 蒼髯老賊)"이라는 벼락같은 꾸짖음에 피를 토하고 낙마해 죽는다 — 무향후매사왕랑, 연의 최고의 설전 장면이다. 실제 왕랑은 그 자리에 있지도 않았고, 낙양에서 사도 벼슬을 지내다 편안히 병사했다. 경학자로 『역』과 『춘추』의 주석을 남겼고, 손녀 왕원희가 사마소의 아내가 되어 진 무제 사마염의 외할아버지가 된다. 소설이 말로 때려죽인 노인은, 역사에서는 다음 왕조의 외가 어른이었다.',11,'<b>출전</b> 『삼국지』 위서 왕랑전<br><b>연의</b> 제93회<br><b>덧붙임</b> 왕랑은 젊어서 회계태수로 손책과 싸워 패주한 전력이 있다 — 바다로 도망치다 잡혔으나 손책이 유학자라 죽이지 않았다. 조조에게 불려 갈 때는 가난해 몇 년을 떠돌았다 — 그 유랑 학자가 위나라 삼공이 되었으니, 연의가 지어 준 굴욕적 최후보다 실제 인생 유전이 훨씬 파란만장하다.'],
 [231.3,0,'조진의 죽음','연의의 조진은 사마의를 돋보이게 하는 무능한 들러리 — 끝내 제갈량의 편지를 읽고 화병으로 죽는다(제100회). 정사의 조진은 딴사람이다. 제갈량의 1차 북벌 때 기곡의 조운을 막아 낸 것도, 진창에 학소를 미리 앉혀 2차 북벌을 헛걸음시킨 것도 조진의 수읽기였다. 상을 받으면 부하들에게 나누고 모자라면 제 재산을 털었다고 정사는 적는다. 230년 자오곡으로 촉을 치려다 한 달 장마에 막혀 회군한 뒤 병을 얻어 이듬해 3월 죽었다. 그의 죽음이 남긴 가장 큰 유산은 따로 있다 — 서부 군권이 통째로 사마의에게 넘어갔다는 것.',3,'<b>출전</b> 『삼국지』 위서 조진전<br><b>연의</b> 제100회<br><b>덧붙임</b> 조진은 조조가 거둔 양자다 — 아버지가 조조를 위해 목숨을 잃자 친자식들과 함께 길렀다. 호표기 지휘관 출신으로, 아버지 대의 은혜를 2대에 걸쳐 갚은 셈이다. 그의 아들이 고평릉에서 몰살당하는 조상 — 조씨와 사마씨의 흥망이 이 부자의 생몰 연대에 압축되어 있다.'],
 [231.7,0,'장합의 죽음','장합은 관도에서 항복해 온 원소의 장수였으나, 위나라에서 30년을 싸우며 오자양장의 마지막 생존자가 되었다. 지형을 읽는 눈이 귀신같아 제갈량이 가장 꺼린 상대 — 가정에서 마속의 물길을 끊어 1차 북벌을 무너뜨린 것도 그다. 4차 북벌에서 촉군이 물러가자 사마의가 추격을 명했다. 장합이 반대했다. "군법에, 물러나는 군사는 쫓지 않는 법입니다(歸軍勿追)." 사마의가 강권했고, 목문도 골짜기에서 쇠뇌 일제 사격이 장합의 무릎을 꿰뚫었다 — 배송지 주 『위략』이 전하는 전말이다. 규정대로 반대하고 명령대로 죽은 노장. 덕을 본 사람이 누구인지는 굳이 적지 않겠다.',6,'<b>출전</b> 『삼국지』 위서 장합전, 배송지 주 『위략』<br><b>연의</b> 제101회<br><b>덧붙임</b> 장합은 무장이면서 유생들과 교유해 경학자 천거 상소까지 올린 특이한 인물이다 — 진서(陳壽)는 그를 "변화를 헤아림에 능해 제갈량조차 꺼렸다"고 평했다. 『위략』의 추격 강요 기사가 사실이라면, 사마의는 최대의 정적 하나를 적의 화살로 정리한 셈이다 — 그래서 이 죽음은 천 년째 음모론이 붙는다.'],
 [232,0,'조식의 죽음','형이 죽으면 풀려날 줄 알았을 것이다. 그러나 조카 조예도 숙부를 놓아주지 않았다 — 11년 사이 봉지를 여섯 번 옮기며 감시했다. 조식은 거듭 상소해 나라에 쓰이기를 빌었다. "신이 항상 두려운 것은, 아침 이슬처럼 사라져 시대에 아무 보탬 없이 흙이 되는 것입니다." 답은 오지 않았고, 마흔하나에 울분 속에 죽었다. 시호가 사(思) — 생각만 하다 간 사람이라는 뜻처럼 읽힌다. 훗날 사령운이 저울을 내놓았다. "천하의 재주가 한 섬이라면 조자건 혼자 여덟 말을 가졌다." 남은 두 말로 조비는 왕조를 운영했던 셈이다.',11,'<b>출전</b> 『삼국지』 위서 진사왕전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 조식이 마지막까지 매달린 것은 등용 상소였다 — "신에게 서쪽으로는 촉을, 동쪽으로는 오를 맡겨 주소서"라는 자천서를 조카에게 올렸다. 답은 정중한 침묵이었다. 사후 그의 문집 백여 편이 칙명으로 정리되었다 — 살아서 못 쓰인 재능이 죽어서 국가 편찬 사업이 된 것이다.'],
 [249.15,0,'하후패의 망명','고평릉 정변으로 조상이 몰살당하자, 조씨와 한 몸이던 하후씨에게도 칼끝이 다가왔다. 정군산에서 죽은 하후연의 아들 하후패는 남은 길이 하나뿐이었다 — 아버지의 원수 나라 촉으로의 망명. 험한 음평 길에서 말이 죽어 걸어서 국경을 넘었다. 그런데 성도에 도착하니 뜻밖의 환대가 기다렸다. 유선이 제 아들을 가리키며 말했다. "이 아이는 하후씨의 외손이오." 장비의 아내가 하후패의 사촌 누이였고 그 딸이 황후였던 것이다. 서로 수만 명을 죽인 두 나라의 왕실이 사돈이었다는 것 — 삼국지의 스케일은 가끔 이렇게 좁다.',0,'<b>출전</b> 『삼국지』 위서 하후연전 부전, 촉서 후주전 주<br><b>연의</b> 제107회<br><b>덧붙임</b> 하후패의 사촌 누이는 열서너 살에 땔감을 줍다 장비에게 붙들려 아내가 된 몸이다 — 정사에 실린 납치혼이다. 그 딸이 유선의 황후가 되었으니, 하후연은 유선의 처외조부 — 정군산에서 황충이 벤 사람이 훗날 촉 황실의 어른으로 제사받는 기연이 되었다.'],
 [222.3,0,'조식의 「낙신부」','봉지로 쫓겨 가던 조식이 낙수를 건너다 물의 여신을 만났다 — 는 상상으로 쓴 것이 「낙신부」다. "놀란 기러기처럼 날렵하고, 노니는 용처럼 나긋하다(翩若驚鴻 婉若游龍)." 미인을 그리는 이 여덟 글자는 이후 천오백 년간 중국 문학이 우려먹는 원형이 되었고, 동진의 고개지는 이 부를 두루마리 그림 「낙신부도」로 옮겼다. 형에게 눌려 정치에서는 아무것도 못 한 사내가 붓 하나로 불멸을 얻은 것이다. 권력을 다투던 형제의 성적표 — 조비는 왕조를 받았고 왕조는 45년 만에 끝났다. 조식은 시를 남겼고 시는 아직 있다.',0,'<b>출전</b> 『문선』 수록 — 창작 배경은 『삼국지』 진사왕전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 후대 주석가들은 낙신을 조비의 아내가 된 견씨에 대한 연모로 읽는 감견(感甄)설을 폈다 — 형수를 향한 금지된 사랑이라는 이 독법은 사료 근거가 약하지만, 이야기로서는 너무 매혹적이라 천 년을 살아남았다. 고개지의 「낙신부도」 모사본이 베이징·워싱턴 등에 전한다.'],
 [220,0,'구품관인법','즉위를 앞둔 조비에게 상서 진군이 인사 제도를 하나 올렸다. 각 지방에 중정(中正)이라는 평가관을 두어 인물을 상상(上上)부터 하하(下下)까지 아홉 등급으로 매기고, 그 등급대로 벼슬을 주자는 것 — 구품관인법이다. 전란으로 마을의 평판망이 무너졌으니 국가가 평가를 대행하겠다는 취지였는데, 평가관 자리를 명문가가 독점하면서 제도는 곧 변질된다. "상품에 한문 없고 하품에 세족 없다(上品無寒門 下品無勢族)" — 재능 심사로 시작한 제도가 혈통 증명서가 되어, 이후 4백 년 문벌 귀족제의 뼈대가 되었다.',0,'<b>출전</b> 『삼국지』 위서 진군전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 평가 기준은 원래 가문(簿世)·행실(行狀)·재능의 셋이었으나 서진에 이르면 가문 하나로 수렴한다. 이 제도의 사망 선고는 무려 수나라 — 과거제가 도입되고서야 9품의 사다리가 철거되었다. 진군이 만든 임시 제도가 4백 년을 산 것이다.'],
 [220.75,0,'위나라의 성립','조비가 수선대에 올라 헌제의 옥새를 받았다. 아버지가 30년 걸려 쌓은 계단을 아들은 즉위 첫해에 올라간 것이다. 국호는 위(魏), 도읍은 낙양 — 4백 년 한나라가 문서 절차로 끝났다. 흥미로운 것은 파급이다. 한나라가 없어지자 한중왕 유비는 황제를 칭할 명분이 생겼고, 손권도 시차를 두고 뒤따른다. 조비의 즉위식은 그러니까 삼국 시대의 개막식이기도 했다. 조조는 무황제(武皇帝)로 추존되었다 — 생전에 사양한 자리를 죽어서 받은 셈이다.',10,'<b>출전</b> 『삼국지』 위서 문제기<br><b>연의</b> 제80회<br><b>덧붙임</b> 연호는 황초(黃初) — 한의 화덕(火德)을 이은 토덕(土德)의 노랑이니, 황건이 외치던 "누런 하늘(黃天)"이 36년 만에 왕조의 색으로 공인된 셈이다. 오행의 예언을 반란군은 칼로, 조씨는 선양 절차로 실현했다.'],
 [221,1,'칠보시','"콩깍지를 태워 콩을 삶으니, 콩이 솥 안에서 우는구나. 본디 한 뿌리에서 났거늘 어찌 이리 급히 볶아 대는가(本是同根生 相煎何太急)." 형 조비가 일곱 걸음 안에 시를 짓지 못하면 죽이겠다 했고, 조식이 걸으며 이 시를 지어 목숨을 건졌다 — 는 이야기는 정사에 없고 2백 년 뒤 『세설신어』에 처음 실린다. 다만 뼈대가 되는 형제의 실화는 충분히 살벌하다. 조비는 아우를 봉지에 가두고 감시관을 붙였으며 측근 정의 형제를 처형했다. 시는 후대의 창작이어도, 콩과 콩깍지의 처지는 진짜였다.',0,'<b>출전</b> 『세설신어』 문학편 — 정사에는 없음<br><b>연의</b> 제79회<br><b>덧붙임</b> 『세설신어』의 원형은 여섯 구 — "콩을 삶아 국을 끓이고, 콩물을 걸러 즙을 낸다"로 시작한다. 우리가 외우는 4구는 후대에 다듬어진 요약본이다. 역사적으로는 조식이 형의 즉위 후 처형 위기까지 간 것은 사실이나, 구명자는 시가 아니라 어머니 변태후였다.'],
 [221,0,'화폐를 폐하고 곡식과 비단으로','황제가 된 조비가 내린 영 중에 이런 것이 있다 — 오수전을 폐지하고 곡식과 비단으로 거래하라. 국가가 공식적으로 화폐를 포기한 것이다. 수십 년 전란에 동전은 신용을 잃었고 동탁이 마구 찍은 악화가 시장을 망쳐 놓은 뒤였다. 7년 뒤 명제가 오수전을 되살렸지만, 포목과 곡식이 돈 노릇을 하는 관행은 위진남북조 내내 이어진다. 화려한 영웅담 이면에서 경제는 물물교환 시대로 후퇴해 있었다 — 전쟁의 청구서는 이런 데 적힌다.',0,'<b>출전</b> 『삼국지』 위서 문제기<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 명제의 오수전 부활(227) 때 조정 논의가 걸작이다 — "곡식과 비단은 백성이 물을 타거나 얇게 짜 속이니, 차라리 돈이 정직하다"는 논리였다. 화폐 없는 경제가 낳은 품질 사기의 생생한 증언이다.'],
 [221.7,0,'손권을 오왕에 봉하다','유비의 대군이 동쪽으로 몰려오자 손권이 넙죽 엎드려 위에 칭신해 왔다. 유엽이 조비를 말렸다. "저것은 급해서 하는 항복입니다. 지금 오를 치면 촉과 양쪽에서 나눠 가질 수 있습니다." 조비는 듣지 않고 오왕 책봉과 구석을 내렸다 — 항복해 온 자를 치는 것은 도리가 아니라는 명분이었다. 이듬해 이릉에서 이긴 손권은 언제 그랬냐는 듯 고개를 들었고, 화가 난 조비가 세 갈래로 남정했으나 장강 앞에서 번번이 멈췄다. 천하 통일에 가장 가까웠던 패 하나가 이렇게 손가락 사이로 빠져나갔다.',0,'<b>출전</b> 『삼국지』 위서 문제기·유엽전<br><b>연의</b> 제82회<br><b>덧붙임</b> 유엽의 반대 논리는 수학적이었다 — "천하는 셋인데 우리가 여덟을 갖고 있습니다. 둘이 뭉치는 것을 막는 게 아니라, 하나가 죽을 때 나눠 먹어야 합니다." 조비는 "항복한 자를 치면 앞으로 누가 항복하겠나"는 명분론으로 답했다 — 실리와 명분이 정면으로 갈린 어전 회의였고, 역사는 유엽의 손을 들어 주었다.'],
 [225.75,0,'광릉의 회군','조비는 재위 내내 세 차례 남정했고, 마지막이 광릉이었다. 10만 대군에 용주(龍舟)를 띄운 위풍당당한 행차 — 그런데 그해 겨울이 유난히 추워 강이 얼어붙었다. 배가 나아갈 수 없게 되자 조비는 강 건너를 바라보며 탄식했다. "아, 하늘이 남과 북을 갈라놓았구나(嗟乎 固天所以隔南北也)." 그러고는 돌아갔다. 황제의 함대가 얼음에 막혀 회군한 이 장면은 위나라 남정사의 축도다 — 위는 끝내 장강을 건너는 법을 배우지 못했고, 그 숙제는 50년 뒤 진나라 수군에게 넘어간다.',10,'<b>출전</b> 『삼국지』 위서 문제기, 오서 서성전<br><b>연의</b> 제86회<br><b>덧붙임</b> 강 건너 오군은 서성의 계책으로 하룻밤에 가짜 성벽과 망루를 수백 리에 세웠다 — 갈대와 천으로 만든 의성(疑城)이다. 얼음과 가짜 성벽, 자연과 무대 장치가 합작해 황제의 함대를 돌려세운 것 — 위의 수군 콤플렉스는 이렇게 깊어졌다.'],
 [226.42,0,'조비의 죽음','재위 7년, 마흔에 병이 깊어지자 조비는 조진·조휴·진군·사마의 네 사람을 불러 어린 조예를 부탁하고 눈을 감았다. 황제로서는 평범했으나 문인으로서는 한 시대의 문을 열었다 — 「전론·논문」은 중국 최초의 본격 문학 비평이고, 거기 담긴 "문장은 나라를 다스리는 큰 사업이요 썩지 않는 성대한 일(經國之大業 不朽之盛事)"이라는 선언은 문학의 독립 선언문으로 읽힌다. 황제 조비는 잊혀도 비평가 조비는 문학사에 남았다. 그리고 고명대신 네 명 중 마지막까지 살아남은 이름이 사마의였다는 것 — 이것이 위나라의 복선이다.',5,'<b>출전</b> 『삼국지』 위서 문제기<br><b>연의</b> 제86회 말<br><b>덧붙임</b> 조비는 생전에 제 능을 산기슭에 검소하게 쓰고 비석도 세우지 말라는 종제(終制)를 남겼다 — "무덤이 화려하면 도굴로 두 번 죽는다"는 이유였다. 아버지의 박장 유언을 제도로 굳힌 것 — 위나라 황릉이 오늘까지 대부분 미발견인 이유다.'],
 [226.45,0,'조예의 즉위와 위의 전성','조예는 즉위 전까지 조정 신하들과 거의 만난 적이 없는 베일 속 태자였다. 그런데 막상 옥좌에 앉자 딴사람이었다 — 제갈량의 북벌 다섯 차례와 손권의 북상을 모두 막아 내고, 신하들의 논쟁을 한 문장으로 정리하는 판단력을 보였다. 정사의 평이 "침착하고 굳세며 결단이 있었다(沈毅斷識)"이다. 진군·유소에게 「위율」 18편을 짓게 해 한나라의 누더기 법전을 정리한 것도 그의 치세 — 이 법전이 진률을 거쳐 당률로 이어진다. 위나라의 국력 곡선은 이 젊은 황제 때 정점을 찍었다.',0,'<b>출전</b> 『삼국지』 위서 명제기<br><b>연의</b> 제91회 전후<br><b>덧붙임</b> 즉위 배경에는 그늘이 있다 — 어머니 견황후가 조비에게 사사되어, 조예는 오래 태자로 확정되지 못했다. 즉위 후 어머니의 복권과 추숭에 공을 들인 것이 그 상처의 반증이다. 신하들을 처음 접견한 날 "몇 마디에 조정이 안도했다"고 명제기가 적는다.'],
 [228.17,0,'가정과 1차 북벌 방어','제갈량이 기산으로 나오자 천수·남안·안정 세 군이 하루아침에 촉으로 돌아섰다 — 위 조정이 받은 충격이 그만큼 컸다. 조예는 당황하는 대신 직접 장안까지 나아가 앉고, 백전노장 장합에게 5만을 주어 서쪽으로 보냈다. 장합은 가정에서 산 위에 진 친 마속을 보고는 물길부터 끊었다. 목마른 촉군이 무너지자 세 군은 도로 위나라가 되었다. 침공 소식에 황제가 전선 가까이 나아가 무게를 싣고, 명장이 급소를 찌른다 — 이후 30년 위나라 대촉 방어전의 기본 공식이 이 한 판에 다 들어 있다.',0,'<b>출전</b> 『삼국지』 위서 명제기·장합전<br><b>연의</b> 제95~96회<br><b>덧붙임</b> 조예의 전황 브리핑 발언이 남아 있다 — "제갈량은 산을 의지하면 됐을 것을 나와 싸우러 나왔으니, 이는 병서가 꺼리는 바다. 반드시 깨진다." 스물다섯 황제의 이 자신감이 서부 전선의 동요를 눌렀다 — 위의 방어전은 언제나 낙양의 침착함에서 시작되었다.'],
 [231,0,'사마의의 서부 부임','조진이 죽자 서부 전선의 지휘봉이 사마의에게 넘어왔다 — 제갈량과 사마의, 소설이 사랑한 맞수전의 실제 개막이다. 그런데 첫 판은 사마의가 밀렸다. 노성에서 위군이 깨져 갑옷 3천 벌과 쇠뇌 3천여 장을 잃었다고 촉 측 기록이 전하고, 물러나는 촉군을 굳이 쫓게 했다가 명장 장합까지 잃었다. 이후 사마의는 방침을 바꾼다 — 싸우지 않는다. 성벽 뒤에서 상대의 군량이 마르기를 기다린다. 볼품없지만 이길 필요가 없는 쪽의 전략이란 원래 그런 것이다.',0,'<b>출전</b> 『삼국지』 위서 명제기, 촉서 제갈량전 배송지 주 『한진춘추』<br><b>연의</b> 제99회 전후<br><b>덧붙임</b> 노성 패전 기사는 촉 측 『한진춘추』에만 있고 위 측 『진서』는 반대로 사마의의 대승을 적는다 — 같은 전투의 승패가 사서에 따라 뒤집히는 대표 사례다. 양쪽 다 자국 사관(史觀)의 산물이니, 확실한 것은 이후 사마의가 야전을 극도로 피했다는 행동뿐이다.'],
 [234.58,0,'오장원 대치','위수 남쪽, 사마의는 보루를 쌓고 백여 일을 나오지 않았다. 제갈량이 여인의 두건과 옷을 보내 조롱해도 — 싸울 용기가 없으니 아녀자나 되라는 뜻이다 — 사마의는 성내는 대신 사신에게 딴것을 물었다. 승상은 요즘 잘 주무시는가, 식사는 얼마나 하시는가. 새벽부터 밤까지 일하는데 먹는 것은 몇 홉이랍니다. 사마의가 고개를 끄덕였다. "그래서야 오래가겠는가." 격노한 척 황제에게 출전 허가를 청하는 시늉도 했지만, 촉의 강유가 꿰뚫어 보았다 — "장수가 진중에 있으면 임금의 명도 받지 않는 법. 천 리 밖에 싸움을 청하는 것은 싸울 뜻이 없다는 뜻입니다."',0,'<b>출전</b> 『삼국지』 촉서 제갈량전, 배송지 주 『위씨춘추』<br><b>연의</b> 제103회<br><b>덧붙임</b> 여인 옷 도발에 위군 장수들이 격분하자 사마의는 "천자께 출전을 청하겠다"며 표문을 올렸고, 조예는 절(節)을 든 신비를 보내 군문을 지키게 했다 — 군주와 사령관이 짜고 친 진정극이었다. 분노 관리까지 연기로 처리한, 수비 전략의 완성형이다.'],
 [235,0,'궁궐 조영과 간언','오와 촉을 막아 내던 명군 조예의 말년에 이상한 스위치가 켜졌다. 소요궁과 태극전을 짓고 방림원을 꾸미느라 농사철의 백성을 공사판으로 끌어냈고, 심지어 장안의 구리 신선상을 낙양으로 옮겨 오게 했다 — 옮기다 부서진 그 자리에서 신선상이 눈물을 흘렸다는 전설이 남을 판이었다. 양부와 고당륭이 목숨 걸고 간했으나 공사는 계속되었다. 진수는 이를 조예의 유일한 흠으로 꼽았다. 나라의 저금을 헐어 낸 이 말년이, 조예 사후 10년 만의 정변과 무관하지 않다.',0,'<b>출전</b> 『삼국지』 위서 명제기·양부전<br><b>연의</b> 제105회 — 승로반 이전 장면으로 각색<br><b>덧붙임</b> 장안의 구리 신선상(承露盤) 운반은 실패했다 — 너무 무거워 패성에 버려졌고, "동인(銅人)이 눈물을 흘렸다"는 전설이 붙었다. 이 전설에서 당나라 이하(李賀)의 명시 「금동선인사한가」가 나왔으니 — 폭정의 기록이 시의 광맥이 된 경우다.'],
 [238,0,'요동 정벌','요동의 공손연이 연왕을 칭하자 조예가 사마의를 불렀다. 얼마나 걸리겠는가. "가는 데 백 일, 싸우는 데 백 일, 돌아오는 데 백 일, 쉬는 데 육십 일 — 1년이면 족합니다." 사마의는 견고한 요수 방어선을 헛침으로 흔들어 우회하고, 양평성을 에워싼 채 장마 속에서도 풀지 않았다. 성이 열리자 열다섯 살 넘는 남자 7천여를 죽여 경관을 쌓고 공손씨 3대 50년을 지웠다. 예고한 일정 그대로였다. 이 정벌로 위는 낙랑·대방을 직접 쥐게 되었고 — 한반도와 왜의 사신들이 위나라 낙양으로 통하는 길이 이때 열린다.',0,'<b>출전</b> 『삼국지』 위서 명제기·공손도전, 『진서』 선제기<br><b>연의</b> 제106회<br><b>덧붙임</b> 공손연은 농성 중 굶주림이 극에 달하자 항복 인질을 청했다 — 사마의의 회신이 서늘하다. "군사(軍事)에는 다섯이 있다. 싸울 수 있으면 싸우고, 못 싸우면 지키고, 못 지키면 달아나라. 남은 둘은 항복과 죽음인데 — 인질은 그 목록에 없다." 조건부 항복이라는 선택지를 문장으로 지워 버린 것이다.'],
 [239,0,'조예의 죽음과 어린 황제','서른여섯의 조예가 병상에서 여덟 살 조방의 손을 잡아 사마의의 손에 쥐여 주었다. "죽음을 참으며 그대를 기다렸소." 사마의는 머리를 조아려 울었다. 이 장면의 비극은 구조에 있다 — 위나라는 황족들을 봉지에 가두고 감시하는 것을 국시로 삼아 왔다. 조비가 아우 조식을 묶은 그 제도 때문에, 어린 황제가 위기에 처했을 때 달려올 숙부가 한 명도 없었다. 울며 절하던 노신은 10년 뒤 이 아이의 조정을 통째로 접수한다. 조씨가 조씨를 묶은 사슬이 사마씨의 사다리가 된 것이다.',1,'<b>출전</b> 『삼국지』 위서 명제기, 배송지 주 『한진춘추』<br><b>연의</b> 제106회<br><b>덧붙임</b> 원래의 고명 명단에는 종실 연왕 조우 등이 있었다 — 병상의 문서 담당 유방·손자가 명단을 조상·사마의 둘로 갈아치웠다고 『한진춘추』가 전한다. 붓을 쥔 측근 둘이 왕조의 운명을 바꾼 셈이다. 조방은 조예의 양자로, 친부모조차 기록되지 않았다.'],
 [241,0,'등애와 회남 둔전','말더듬이 둔전 관리 등애가 회수 유역을 답사하고 「제하론」을 올렸다. 병사 5만으로 하여금 넷 중 하나씩 교대로 쉬며 농사와 수비를 겸하게 하고 수로를 뚫자 — 6~7년이면 3천만 곡이 쌓이고, 이는 10만 대군의 5년 치 군량이라는 계산서였다. 사마의가 채택했고 회남은 위의 곡창이 되었다. 훗날 촉을 멸망시키는 그 등애다. 촉과 오가 영웅의 이름으로 싸우는 동안 위는 회계 장부로 싸웠다 — 삼국의 승부는 어쩌면 논두렁에서 갈렸다.',0,'<b>출전</b> 『삼국지』 위서 등애전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 등애는 형주 난민 출신으로 소 치는 둔전민에서 출발했다 — 말더듬 때문에 하급직을 전전하다 사마의가 문서 하나를 보고 발탁했다. 둔전민이 둔전 정책의 설계자가 되고, 그 곡식으로 촉을 멸한 장수가 된 것 — 위나라 인사 시스템이 낳은 최대의 신데렐라다.'],
 [243,0,'조상의 전권과 정시(正始)의 부화','대장군 조상은 사마의를 태부로 올려 실권을 빼고, 하안·등양·정밀 같은 명사들과 새 정치를 시작했다. 정시(正始) 연간 — 낮의 조정에서는 제도 개혁이, 밤의 사랑방에서는 노장(老莊)의 청담이 흘렀다. 하안의 『논어집해』와 왕필의 『노자주』가 이 그늘에서 나왔으니 사상사로는 위진 현학의 개화기다. 그러나 정사는 이들을 "부화(浮華)", 떠 있는 꽃이라 적는다. 개혁은 기득권의 원한만 사고, 사치와 전횡의 소문은 쌓여 갔다. 그 곁에서 병을 핑계로 누운 노인이 죽은 척 침을 흘리며 때를 세고 있었다.',0,'<b>출전</b> 『삼국지』 위서 조상전<br><b>연의</b> 제106~107회<br><b>덧붙임</b> 조상 집단의 개혁은 실체가 있었다 — 하안의 이부 인사 쇄신, 지방 감찰 강화, 예제 개편. 문제는 이 개혁이 원로·종실·외척의 기득권을 한꺼번에 건드렸다는 것 — 고평릉의 날, 낙양의 원로들이 일제히 사마의 편에 선 것은 우연이 아니었다. 부화(浮華)라는 낙인은 승자가 찍은 것이다.'],
 [244,0,'흥세의 패배','명망이 궁하던 조상이 공적을 만들러 갔다 — 6~7만을 몰아 한중을 친 것이다. 한중의 촉군은 3만이 못 되었으나 왕평이 흥세의 험지를 선점하고 길을 막았다. 산길에 갇힌 위군은 나아가지도 물러나지도 못했고, 보급을 맡은 관중의 소와 말이 떼로 죽어 강족과 저족의 원성이 하늘을 찔렀다. 참군 양위가 철군을 간하자 조상의 측근이 "목을 베라"고 날뛰는 촌극 끝에 간신히 빠져나왔다. 빈손으로 돌아온 원정 — 조상의 위신은 금이 갔고, 낙양의 노인은 셈을 하나 더 놓았다.',0,'<b>출전</b> 『삼국지』 위서 조상전, 촉서 왕평전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 종군한 하후현과 곽회도 철군론이었다 — 참군 양위가 "돌아가지 않으면 전멸"이라 직언하자 조상의 측근 등양이 대들었고, 양위가 쏘아붙였다. "등양 그대야말로 나라를 망칠 자다." 이 원정의 별명이 낙곡지역(駱谷之役) — 위나라가 스스로 기록한 몇 안 되는 참패다.'],
 [249.08,0,'고평릉의 정변','가평 원년 정월, 조상 형제가 어린 황제를 모시고 성 밖 고평릉 성묘에 나섰다. 그 몇 시간에 10년 죽은 척하던 사마의가 일어났다 — 무기고를 열고 성문을 닫고 태후의 조서를 받아 냈다. 성 밖의 조상에게는 달콤한 전갈을 보냈다. 병권만 내놓으면 부귀는 그대로다, 낙수에 걸고 맹세한다. 조상은 밤새 고민하다 칼을 내려놓으며 말했다. "부잣집 늙은이로는 살 수 있겠지." 열흘 뒤 조상 삼족과 하안·정밀 등이 모두 처형되었다 — 죽은 자 수천. 위나라의 실권이 이 아침에 넘어갔고, "낙수의 맹세"는 지켜지지 않는 약속의 대명사로 남았다.',1,'<b>출전</b> 『삼국지』 위서 조상전, 『진서』 선제기<br><b>연의</b> 제107회<br><b>덧붙임</b> 대세를 정한 것은 낙수 맹세의 보증인들이었다 — 원로 장제와 윤대목이 "병권만 내놓으면 부귀는 보전된다"는 말을 반복해 조상의 결심을 꺾었다. 학살 후 장제는 "내가 사람을 속인 꼴이 되었다"며 괴로워하다 그해 죽었다 — 보증인의 양심만이 유일하게 작동한 약속이었다.'],
]},
{name:'사마씨와 진', sub:'SIMA CLAN · JIN',
 spans:[[201,249,'조씨의 신하'],[249,265,'사마씨의 전권'],[265,281,'서진']],
 events:[
 [264.2,0,'등애와 종회의 죽음','성도에 입성한 등애는 승자의 관용을 뽐내다 "제가 다스리는 게 낫겠습니다" 류의 상주를 남발했고, 종회는 그 문서들을 슬쩍 고쳐 모반의 증거로 만들었다 — 등애는 함거에 실렸다. 이제 촉의 대군을 손에 쥔 종회에게 강유가 속삭였다. 촉을 근거로 자립하시라고 — 속으로는 그 혼란을 틈타 촉을 되살릴 셈이었다. 그러나 위나라 장병들이 먼저 들고일어나 종회와 강유를 난도질했고, 풀려나던 등애도 옛 원한을 품은 위관이 보낸 자객에게 죽었다. 정월 한 달 사이의 일이다. 승리의 크기만큼 서로를 믿지 못한 것 — 사마소만이 낙양에서 승전보와 부고를 한꺼번에 받았다.',1,'<b>출전</b> 『삼국지』 위서 등애전·종회전<br><b>연의</b> 제119회<br><b>덧붙임</b> 등애의 죄목이 된 발언 — "유선을 후하게 대접해 오나라에 보여 주자"는 등 점령지 정책 건의를 멋대로 시행한 것이었다. 아들 등충도 함께 죽고 낙양의 아들들도 처형되었다 — 명예 회복은 9년 뒤에야 이뤄졌다. 종회의 속셈은 정사에 적혀 있다 — "일이 되면 천하를 얻고, 안 되어도 촉으로 물러나 유비 노릇은 할 수 있다." 야심가의 손익계산서였다.'],
 [201,1,'사마의의 출사 거부','조조가 하내의 수재 사마의를 불렀다. 사마의는 환관의 손자 밑에서 벼슬하기 싫다는 속내를 감추고 중풍이 들었다며 자리보전을 했다. 조조가 밤에 자객을 보내 시험하니, 칼끝이 다가와도 꼼짝 않고 누워 있더라고 『진서』 선제기가 전한다 — 다만 이 책은 사마씨의 진나라가 제 조상을 기려 편찬한 사서라, 소금을 살짝 쳐서 읽어야 한다. 확실한 것은 두 가지다. 208년 조조가 "또 누우면 잡아 오라" 하자 그제야 출사했다는 것, 그리고 이 참을성이 그의 평생 무기였다는 것.',0,'<b>출전</b> 『진서』 선제기<br><b>연의</b> 등장 자체가 제39회부터<br><b>덧붙임</b> 사마씨는 하내의 명문으로 아버지 사마방은 경조윤, 여덟 형제는 자에 모두 달(達)이 들어가 팔달(八達)이라 불렸다 — 사마의는 그 둘째 중달(仲達)이다. 『진서』는 조조가 그의 낭고상(狼顧相) — 몸을 돌리지 않고 고개만 뒤로 도는 이리의 상 — 을 시험했다는 이야기도 싣는다. 건국 신화답게 에누리해 읽을 대목이다.'],
 [219.83,0,'형주 대책','관우의 기세에 조조가 천도를 입에 올리자, 아직 신하였던 사마의가 장제와 함께 조용히 계산서를 내밀었다. "우금이 진 것은 홍수 탓이지 나라의 실패가 아닙니다. 유비와 손권은 겉으로 친하고 속으로 서먹하니 — 관우가 뜻을 얻는 것을 손권은 결코 바라지 않습니다. 강동을 찔러 뒤를 잡게 하면 번성의 포위는 절로 풀립니다." 조조가 그대로 했고, 그대로 되었다. 남의 손으로 적을 잡는 이 계산법 — 사마의라는 이름이 조정에 깊이 새겨진 첫 장면이다.',0,'<b>출전</b> 『진서』 선제기, 『삼국지』 위서 장제전<br><b>연의</b> 제75회 전후<br><b>덧붙임</b> 이 무렵의 사마의는 승상부의 참모이자 태자 조비의 측근이었다. 이 계책으로 전략가의 눈도장을 확실히 찍었고, 문제가 즉위하자 상서·어사중승으로 뛰어오른다. 관우의 몰락이 사마의 출세의 발판이 된 셈이다.'],
 [227,0,'맹달 토벌 — 8일의 행군','신성태수 맹달이 촉과 내통한다는 첩보가 완의 사마의에게 닿았다. 맹달의 계산은 여유로웠다 — 완에서 낙양이 8백 리, 조정에 아뢰고 허락받아 오려면 한 달, 그 사이 성을 굳히면 된다. 사마의는 상주를 생략했다. 1200리를 8일에 주파해 성 아래 나타난 것이다. 맹달이 제갈량에게 보낸 마지막 편지가 처절하다. "내가 거사한 지 8일 만에 군사가 성 아래 이르렀으니, 어찌 이리 신속하단 말입니까." 16일 만에 성이 깨지고 맹달의 목이 낙양으로 갔다. 사마의의 용병은 상대의 시계를 부수는 데서 시작한다.',0,'<b>출전</b> 『진서』 선제기, 『삼국지』 촉서 비시전<br><b>연의</b> 제94회<br><b>덧붙임</b> 맹달은 촉에서 위로, 다시 촉으로 — 두 번째 배신을 준비하다 죽은 사람이다. 제갈량이 일부러 첩자를 통해 모의를 누설시켜 맹달을 조기에 터뜨렸다는 설이 『진서』에 실려 있다 — 믿을 수 없는 자를 미끼로 써서 위의 주의를 돌렸다는 것이다. 배신자의 최후조차 양쪽의 계산서 위에 있었다.'],
 [234.67,0,'제갈량의 진영을 둘러보다','촉군이 물러간 오장원, 사마의가 빈 진영을 천천히 걸었다. 보루의 배치, 우물과 부뚜막, 뒷간과 울타리까지 살펴본 뒤 한마디를 남겼다. "천하의 기재로다(天下奇才也)." 정사 제갈량전 본문의 기록이니, 5년을 겨룬 맞수가 남긴 공식 감정서인 셈이다. 물론 동진의 우예처럼 "이기지 못한 자의 예의였다"고 꼬집는 사가도 있었다. 감탄이었든 예의였든 — 사마의는 그 빈 진영에서 확인했을 것이다. 이제 서쪽에서 저 사람이 다시 오지 않는다는 것, 그리고 자신의 시간이 시작된다는 것을.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전<br><b>연의</b> 제104회<br><b>덧붙임</b> 사마의는 앞서 제갈량의 사자에게 식사량을 물은 뒤 "먹는 건 적고 일은 많다(食少事煩)"고 진단했다 — 상대의 수명을 정탐한 것이다. 빈 진영 감탄과 수명 진단, 이 두 장면을 나란히 놓으면 사마의의 전쟁이 보인다 — 그는 제갈량이 아니라 제갈량의 시간과 싸웠다.'],
 [251.58,0,'왕릉의 난과 사마의의 죽음','고평릉 정변에 처음으로 반기를 든 것은 회남의 태위 왕릉이었다 — 어린 조방 대신 나이 든 초왕 조표를 세우려는 모의였다. 일흔셋의 사마의는 늙은 몸을 배에 싣고 번개같이 회남에 나타났다. 왕릉은 손 한 번 못 쓰고 잡혀 압송길에 독을 마셨다. 사마의는 관련자를 삼족까지 멸하고, 이미 묻힌 왕릉의 관을 파내 사흘간 저자에 벌였으며, 위나라 왕족 전원을 업에 모아 연금했다. 그리고 그해 8월 73세로 죽었다 — 마지막까지 뒷정리를 하고 간 것이다. 회남에서는 이후 두 번 더 봉화가 오른다.',8,'<b>출전</b> 『삼국지』 위서 왕릉전, 『진서』 선제기<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 왕릉은 동탁을 죽인 왕윤의 조카다 — 한을 지키려던 집안이 위를 지키려다 멸문한 것이다. 사마의는 죽으며 "수양산의 백이숙제처럼 묻어 달라"는 박장 유언을 남겼고 자손의 합장도 금했다 — 찬탈자 소리를 들을 것을 알았던 사람의, 무덤에서까지의 처신이었다.'],
 [254,0,'조방 폐위','중서령 이풍과 황후의 아버지 장집이 사마사를 없애고 하후현을 세우려다 발각되었다. 사마사는 이풍을 그 자리에서 철퇴로 죽이고 관련자를 삼족까지 멸한 뒤 — 내친김에 황제를 갈았다. 태후의 명의를 빌려 스물세 살 조방을 폐하고 열네 살 조모를 앉힌 것이다. 65년 전 동탁이 소제를 폐할 때 천하가 들고일어났지만, 이번엔 조정이 조용했다. 신하가 황제를 바꾸는 일이 이제 행정 절차가 된 것 — 위나라가 어디까지 왔는지 보여 주는 온도계다.',0,'<b>출전</b> 『삼국지』 위서 삼소제기<br><b>연의</b> 제109회<br><b>덧붙임</b> 폐위 조서는 태후의 이름으로 나왔고, 죄목은 "여색과 유희에 빠져 종묘를 받들 수 없다"였다 — 스물세 살 황제의 품행이 아니라 친정 시도가 진짜 죄였다. 이풍 등이 밀던 하후현은 사마사의 처남뻘 명사였는데도 삼족이 멸했다 — 혼맥도 방패가 되지 못하는 단계에 들어선 것이다.'],
 [255,0,'관구검·문흠의 난','고구려를 정벌했던 그 관구검이 수춘에서 일어났다 — 회남 2차 반란이다. 사마사는 눈 위 혹을 갓 째낸 몸으로 직접 출정했다. 문흠의 열여덟 살 아들 문앙이 밤에 본진을 급습해 "사마사는 어디 있느냐" 외치며 휘젓자, 사마사는 이불을 물어뜯으며 버텼는데 터진 눈알이 빠져나왔다. 난은 진압했으나 사마사는 회군길 허창에서 죽었다. 권력의 공백 한순간 — 위 조정이 사마소의 군권 인수를 막으려 조서를 내렸지만, 사마소는 조서를 무시하고 대군을 몰아 낙양으로 돌아왔다. 그것으로 끝이었다.',0,'<b>출전</b> 『삼국지』 위서 관구검전<br><b>연의</b> 제110회<br><b>덧붙임</b> 관구검은 거병 격문에서 사마사의 죄 11개조를 낱낱이 세었다 — 고구려 원정의 명장이 마지막으로 정벌한 것은 권신의 죄목이었던 셈이다. 아들 문앙은 뒷날 서진에서 벼슬하다 팔왕의 난 와중에 삼족이 멸한다 — 그 밤의 용맹도 시대를 두 번 이기지는 못했다.'],
 [257,0,'제갈탄의 난','회남의 세 번째이자 마지막 봉화는 제갈탄이 올렸다 — 친구 하후현과 등양이 죽어 가는 것을 보고 다음은 자기 차례임을 안 것이다. 오나라에 아들을 인질로 보내 원병을 청하고 수춘에 15만이 모였다. 사마소는 26만으로 성을 둘러싸고 1년을 기다렸다. 성이 깨지던 날, 제갈탄의 친위병 수백이 사로잡혔는데 한 사람씩 목을 베며 항복을 권해도 모두 같은 답을 남기고 죽었다. "제갈공을 위해 죽으니 한이 없다." 위나라를 위해 싸운 마지막 군대가, 정작 위나라 조정이 아니라 한 사람에게 충성하며 사라진 것이다.',0,'<b>출전</b> 『삼국지』 위서 제갈탄전<br><b>연의</b> 제111~112회<br><b>덧붙임</b> 수춘성에는 오나라 원군 3만도 함께 갇혀 있었다 — 성이 깨지자 오군 포로들은 "항복하지 않겠다"는 자를 포함해 대부분 살려 보냈는데, 제갈탄의 친위대만은 예외였다. 회남 3반(三叛)의 진압으로 사마씨는 지방 군권의 마지막 저항선을 지웠다 — 이제 낙양 밖에도 적이 없었다.'],
 [260,0,'조모의 죽음','스무 살 황제 조모가 측근들을 불러 선언했다. "사마소의 마음은 길 가는 사람도 안다(司馬昭之心 路人所知也). 앉아서 폐위를 기다리느니 나가 싸우겠다." 말리는 신하들을 뿌리치고 궁중의 시종 수백을 긁어모아 칼을 짚고 나섰다 — 황제의 친정 상대가 승상부인 전대미문의 출정이다. 가충이 막아섰고, 머뭇거리는 병사들에게 소리쳤다. "이런 날을 위해 길러진 것 아니냐." 태자사인 성제가 창으로 황제의 가슴을 꿰뚫었다. 백주 대로에서 황제가 죽었는데, 처벌은 창을 쥔 성제의 삼족뿐 — 사마소는 이 피 때문에 끝내 스스로 제위에 오르지 못했다.',5,'<b>출전</b> 『삼국지』 위서 삼소제기 배송지 주 『한진춘추』<br><b>연의</b> 제114회<br><b>덧붙임</b> 조모는 열아홉에 『주역』과 『상서』를 태학에서 강론하던 수재였다 — 신하들이 "문제(文帝)의 풍모"라 평했을 정도다. 거사 직전 남긴 시 「잠룡」이 전한다 — 우물에 갇힌 용이 미꾸라지 앞에 엎드린다는 자화상이었다. 붓으로 못 이긴 판을 칼로 뒤집으려던, 왕조에서 가장 젊은 절망이었다.'],
 [263.83,0,'촉 정벌과 등애·종회','사마소가 18만을 세 갈래로 내려보냈다. 종회의 주력이 검각에서 강유에게 막혀 군량이 마를 무렵, 등애가 도박을 걸었다 — 음평의 7백 리 무인지경. 산을 뚫고 잔도를 엮고, 길이 끊기면 담요로 제 몸을 싸서 벼랑을 굴렀다. 홀연 평지에 나타난 위군 앞에 강유성이 싸움 없이 열렸고, 면죽에서 제갈량의 아들 제갈첨이 전사하자 성도는 항복했다. 여기까지가 무용담 — 그다음은 막장극이다. 종회가 등애를 모함해 함거에 태우고, 강유와 짜고 반란을 꾀하다 난군에 죽고, 등애마저 압송길에 살해된다. 촉을 이긴 세 사람이 촉 땅에서 다 죽었다.',11,'<b>출전</b> 『삼국지』 위서 종회전·등애전<br><b>연의</b> 제116~118회<br><b>덧붙임</b> 출정 전 서곡(西曲) 사람들이 "종회는 홀로 가면 돌아오지 않을 상"이라 수군댔고, 소제(邵悌)가 사마소에게 종회의 야심을 경고했다 — 사마소의 대답이 소름 돋는다. "촉을 평정하고 나면 중원 장병은 돌아오고 싶어 하고 촉인은 지쳐 있을 것 — 종회가 변을 일으켜도 성공할 수 없소." 반란까지 계산서에 넣고 보낸 원정이었다.'],
 [265.92,0,'서진 건국','사마소는 진왕까지 오르고 죽었다. 아들 사마염은 아버지의 상복을 벗기도 전에 절차를 밟았다 — 위 원제 조환이 세 번 사양하는 각본을 거쳐 선양했다. 국호는 진(晉). 조비가 헌제에게서 옥새를 받은 지 꼭 45년 만에, 조씨는 받았던 방식 그대로 돌려주었다. 폐제 조환은 진류왕에 봉해져 302년까지 천수를 누렸으니, 헌제의 산양공 대우를 그대로 물려받은 셈이다. 왕조는 바뀌어도 선양의 예법과 폐제의 연금 매뉴얼은 이어졌다 — 중국식 정권 교체의 완성형이다.',12,'<b>출전</b> 『진서』 무제기<br><b>연의</b> 제119회 말<br><b>덧붙임</b> 국호 진(晉)은 사마소의 봉국에서 왔다 — 봉지가 춘추 진(晉)나라의 옛 땅인 산서 일대였기 때문이다. 선양 의전은 조비 때의 각본을 글자까지 재활용했다 — 세 번 사양, 수선대, 폐제 우대. 45년 전의 연출을 복사하며, 위나라는 제가 만든 형식대로 퇴장했다.'],
 [269,0,'양호와 남정 준비','사마염이 형주 도독으로 보낸 양호는 이상한 사령관이었다. 국경의 밭을 갈아 군량 10년 치를 쌓으면서도, 오나라와 약속 없이 싸우지 않았고 항복해 온 자가 돌아가겠다면 보내 주었다. 사냥에서 오군이 먼저 맞힌 짐승이 넘어오면 돌려보냈다. 맞수인 오의 육항이 병들자 약을 지어 보냈고, 육항은 "양숙자가 독을 쓸 사람인가" 하며 마셨다. 적국의 백성까지 그를 양공(羊公)이라 불렀다. 죽으며 두예를 후임으로 천거했고, 그가 죽자 형주 사람들이 저자를 닫고 울었다 — 훗날 그의 비석 앞에서 우는 사람이 하도 많아 타루비(墮淚碑), 눈물 흘리게 하는 비석이라 불렸다. 통일은 이런 사람이 준비했다.',0,'<b>출전</b> 『진서』 양호전<br><b>연의</b> 제120회<br><b>덧붙임</b> 양호는 채옹의 외손자이자 사마사의 처남 — 혈통으로는 권력 핵심인데 평생 문을 낮췄다. 죽기 전 두예를 천거한 상소는 봉해서 올렸다 — "관직 추천은 공적인 일인데 어찌 사사로이 알리랴"며 본인에게도 숨겼다. 오나라 접경의 밭 8백여 경을 갈아 십 년 군량을 쌓은 것이 그의 병법이었다.'],
 [280.25,0,'오 정벌과 천하 통일','왕준의 익주 수군이 강을 내려가고 여섯 갈래 20여만이 동시에 남하했다. 오가 강에 쳐 둔 쇠사슬은 기름 부은 거대한 횃불로 녹이고, 물속 쇠말뚝은 뗏목을 먼저 흘려보내 뽑아냈다 — 준비된 쪽과 버티기만 한 쪽의 차이였다. 왕준의 함대가 석두성에 이르자 손호는 스스로 결박하고 관을 지고 나왔다. 태강 원년 3월 — 황건의 난으로부터 96년, 세 나라로 갈라진 지 60년 만에 천하가 다시 하나가 되었다. 다만 그 하나가 된 천하도 고작 37년 뒤 다시 갈라진다는 것을, 축배를 든 사람들은 몰랐다.',3,'<b>출전</b> 『진서』 무제기, 『삼국지』 오서 삼사주전<br><b>연의</b> 제120회<br><b>덧붙임</b> 마지막 논쟁도 있었다 — 가충 등이 "오는 아직 못 친다"고 막자 두예가 "대세가 이미 기울어 대나무를 쪼개는 것과 같다(勢如破竹)"고 반박했다 — 파죽지세의 출전이다. 유주의 왕준은 배 위에 누각을 얹은 누선(樓船) 대함대를 7년간 건조했다 — 강물에 뜬 목재 부스러기를 보고 오의 오연(吾彦)이 침공을 예언했으나 손호는 웃어넘겼다.'],
 [280.5,0,'점전제와 호조식','통일하자마자 진은 토지와 세금의 규칙을 다시 썼다. 성인 남자는 70묘를 점유할 수 있고, 호(戶)마다 비단 3필과 솜 3근을 낸다 — 조조의 둔전과 호조식을 다듬은 점전·과전제다. 여기까지는 재건 정책인데, 조문 하나가 시대를 박제했다. 관품에 따라 사족은 더 넓은 땅과 면세, 그리고 소작농까지 법으로 보장받은 것이다. 문벌의 특권이 관행이 아니라 법전에 올라간 순간 — 위진남북조 4백 년 귀족 사회의 등기부가 이때 작성되었다.',0,'<b>출전</b> 『진서』 식화지<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 1품관은 50경, 9품관도 10경의 점전이 허용되었고 친족 면세까지 붙었다 — 관료의 등급표가 곧 지주의 등급표였다. 후대 사가들이 "위진의 문벌은 법이 만들었다"고 평하는 근거 조문이다. 동시에 주군(州郡)의 병력을 해산한 조치가 있었는데 — 이 무장 해제가 20년 뒤 팔왕의 난에서 지방의 무력 공백으로 돌아온다.'],
 [280.92,0,'통일 뒤에 남은 것','장부를 덮으며 셈을 해 보자. 위 443만, 촉 94만, 오 230만 — 세 나라의 호적 인구를 다 합쳐 767만이다. 후한 전성기의 장부에는 5,600만이 적혀 있었다. 물론 호족의 그늘에 숨은 인구가 많아 실제 감소는 이보다 덜하다지만, 장부가 7분의 1로 준 시대를 산 사람들의 체감은 숫자 그대로였을 것이다. 그리고 통일 진나라는 37년 만에 팔왕의 난으로 무너져 3백 년 남북조가 시작된다. 96년의 전쟁 끝에 얻은 평화가 한 세대를 못 갔다는 것 — 삼국지라는 영웅담의 마지막 줄은 이렇게 서늘하다.',0,'<b>출전</b> 『진서』·『통전』의 호구 기사 종합<br><b>연의</b> 제120회의 마지막 시 — "천하대세는 합쳐진 지 오래면 반드시 나뉜다"<br><b>덧붙임</b> 연의의 첫 문장과 끝 문장은 같은 문장의 앞뒤다 — 분구필합 합구필분(分久必合 合久必分). 진의 통일(280)에서 팔왕의 난(291)까지 11년, 영가의 난(311)까지 31년 — 소설이 순환 사관으로 요약한 것을 역사는 연표로 증명했다. 삼국지는 그래서 통일의 이야기가 아니라, 통일조차 잠깐이라는 이야기다.'],
]}]},

 spans:[[184,194,'유랑'],[194,196,'서주'],[196,201,'떠도는 객장'],[201,208,'형주 신야'],[208,214,'형남과 형주'],[214,221,'익주'],[221,223,'촉한 황제']],
 events:[
 [220.6,0,'법정의 죽음','법정은 유비의 참모 중 유일하게 조조가 탐낸 두뇌였다 — "내가 천하의 간웅을 다 거두었는데 법정만 얻지 못했구나." 익주를 바친 설계도, 하후연을 잡은 정군산의 수읽기도 그의 것이었다. 성격은 고약해서 밥 한 끼 은혜도 갚고 눈 한 번 흘긴 원한도 갚는 사람이었지만, 유비에게는 직언이 통하는 거의 유일한 통로였다. 마흔다섯에 죽자 유비는 며칠을 울었고, 촉한에서 생전의 공으로 시호를 받은 신하는 그가 유일하다. 이릉의 참사 뒤 제갈량이 탄식했다 — "법효직이 살아 있었다면 주상의 동정을 막았을 것이고, 가셨더라도 이렇게 위태롭지는 않았을 것이다."',0,'<b>출전</b> 『삼국지』 촉서 법정전<br><b>연의</b> 비중 축소 — 방통·제갈량에게 역할이 흡수<br><b>덧붙임</b> 한중전에서 유비가 화살비 속에 물러서지 않자, 법정이 말없이 유비 앞을 몸으로 막아섰다 — "효직, 화살을 피하라!" "주공께서 안 피하시는데 제가 피하겠습니까." 유비가 그제야 물러났다. 간언이 안 통하는 주군을 몸으로 움직인 것 — 법정식 직언법이었다.'],
 [221.7,0,'미축의 죽음','미축은 서주의 거상이었다 — 하인만 만 명이라던 재산가가, 여포에게 처자까지 잃고 알거지가 된 유비에게 노비 2천과 금은을 쏟아붓고 누이까지 시집보냈다. 조조가 태수 자리로 회유해도 뿌리치고 유랑길을 따라나선, 촉한의 창업 투자자다. 그런데 아우 미방이 관우를 배신하고 오에 항복하는 사건이 터졌다. 미축은 스스로를 결박하고 죄를 청했다. 유비는 "아우의 죄가 형에게 미치지 않는다"며 예우를 바꾸지 않았지만 — 미축은 부끄러움과 울분으로 병들어 한 해 남짓 만에 죽었다. 용서가 반드시 사람을 살리는 것은 아니다.',0,'<b>출전</b> 『삼국지』 촉서 미축전<br><b>연의</b> 아우 미방의 배신만 부각<br><b>덧붙임</b> 미축의 벼슬 안한장군(安漢將軍)은 제갈량보다 서열이 위였다 — 실무 없이 예우만 최상급인, 창업 투자자에 대한 배당이었다. 조조가 일찍이 그를 영군태수로 발탁했을 때 관직을 버리고 유비를 따랐으니 — 두 번의 선택 모두 지분을 몰빵한 셈이었고, 한 번은 맞고 한 번은 아팠다.'],
 [201.5,1,'적로와 단계(檀溪)','형주의 실력자들이 잔치를 미끼로 유비를 없애려 했다. 낌새를 챈 유비가 뒷문으로 빠져 적로를 몰았는데, 앞을 막은 것이 폭이 세 길이나 되는 단계 여울이었다. 물에 빠져 허우적대는 말에게 유비가 소리쳤다. "적로야, 오늘이 위급하다. 힘을 다하거라!" 말이 한 번에 세 길을 솟구쳐 건넜다 — 배송지가 인용한 『세어』의 기록이다. 다만 배송지 본인은 이 대목에 "세상에 전하는 이야기는 사실과 어긋나는 것이 많다"고 토를 달았다. 주석가가 실어 주고 의심도 달아 둔, 사료와 전설의 경계선 위에 선 장면이다.',0,'<b>출전</b> 배송지 주 『세어』 — 배송지 본인이 의문 표시<br><b>연의</b> 제34회<br><b>덧붙임</b> 연의는 이 말에 서사를 하나 더 붙였다 — "적로는 주인을 해치는 흉마"라는 관상가의 경고를 유비가 무시하는 대목이다(제34회). 흉마가 주인을 살리는 역설로 미신을 뒤집은 것 — 다만 그 흉마 소문은 뒷날 방통이 낙봉파에서 대신 죽는 복선으로 회수된다. 소설의 말 한 필에도 대차대조표가 있다.'],
 [208.7,2,'서서와 어머니','신야 시절 서서가 유비에게 와룡을 천거한 것도(207), 이듬해 장판의 혼란에서 어머니가 조조군에 사로잡히자 떠난 것도 정사 제갈량전에 있다. 떠나며 제 가슴을 가리킨 말이 아프다. "본디 장군과 왕업을 도모하려 한 것은 이 마음(方寸)이었는데, 이제 어머니를 잃어 마음이 어지러우니 남아 있어도 보탬이 되지 못합니다." 연의는 이 이별을 삼고초려 앞으로 한 해 당기고, 조조의 필적 위조와 어머니의 자결을 보태 비극을 완성했다. 정사의 서서는 위나라에서 어사중승까지 지냈다 — 제갈량이 훗날 그 소식에 "위나라엔 인재가 그리 많은가"라고 탄식했다던가.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전<br><b>연의</b> 제36~37회<br><b>덧붙임</b> 서서는 본명이 서복(徐福), 젊어서 검객으로 사람을 죽이고 얼굴에 흙칠을 한 채 형장을 탈출한 전력이 있다 — 그 협객이 붓을 잡고 학문으로 전향한 것이다. 위나라에서의 벼슬 어사중승은 감찰 차관급 — 제갈량의 탄식은 그 재목이 재상감이라는 아쉬움이었다.'],
 [214,0,'직백전과 촉의 재정','성도에 입성한 유비가 창고를 열어 장병들에게 아낌없이 나눠 주었더니 — 몇 달 만에 군비가 바닥났다. 이때 유파가 처방을 냈다. 액면가가 실질의 백 배인 직백오수전(直百五銖)을 주조하고, 물가를 관리하는 관영 시장을 함께 열자는 것. 몇 달 만에 창고가 다시 찼다고 정사가 적는다. 오늘의 눈으로 보면 화폐 발행 차익으로 재정을 메운 셈인데, 관영 시장이라는 안전판을 함께 설계한 것이 절묘했다. 좁은 익주가 40년간 대국 위와 전쟁을 계속한 밑천 — 칼이 아니라 이런 주판알에서 나왔다.',0,'<b>출전</b> 『삼국지』 촉서 유파전 배송지 주 『영릉선현전』<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 처방을 낸 유파는 본래 유비를 피해 천하를 반 바퀴 돈 사람이다 — 형주에서 조조에게, 다시 교지로, 익주로 도망쳤는데 그 익주가 유비에게 떨어졌다. 제갈량의 간청으로 출사한 뒤 상서령까지 지냈다 — 도망 다닌 인재를 끝내 재무장관으로 쓴 것, 그것이 유비의 집요한 인사였다.'],
 [223.25,2,'유비의 눈물','연의의 유비는 참 많이 운다 — 백성을 두고 울고, 인재를 놓칠까 울고, 하도 울어서 "유비의 강산은 울어서 얻은 것"이라는 우스개가 생길 정도다. 정사의 유비는 정반대의 사람이다. "말수가 적고, 아랫사람을 잘 대했으며, 기쁨과 노여움을 낯빛에 드러내지 않았다(喜怒不形於色)." 기록에 남은 눈물은 방통과 법정이 죽었을 때 등 손에 꼽는다. 연의가 눈물을 퍼부은 것은 인덕(仁德)을 그리는 가장 값싸고 확실한 연출이었기 때문이다 — 모종강조차 주석에 "선주의 강개함을 유약함으로 읽지 말라"고 변호해야 했을 만큼, 그 연출은 과했다.',0,'<b>출전</b> 『삼국지』 촉서 선주전 평(評)과 본문의 대비<br><b>연의</b> 소설 전반의 연출 문법<br><b>덧붙임</b> 정사에서 유비가 운 기록은 오히려 남을 위한 자리다 — 유표의 묘 앞에서, 방통이 죽자 "말만 하면 눈물을 흘렸다(言則流涕)", 법정의 죽음에 며칠을 곡했다. 제 처지를 위해 운 것은 비육지탄 정도 — 연의는 이 드문 눈물을 상시 장비로 개조했다. 모종강의 변호대로, 원판의 유비는 강개한 효웅(梟雄)이었다.'],
 [184.17,4,'도원결의','복숭아꽃 아래서 향을 사르고 하늘에 맹세하는 세 사내 — 연의 제1회의 이 그림은 정사에 없다. 관우전이 적는 것은 "선주가 두 사람과 한 침상에서 자니 은혜가 형제 같았다(恩若兄弟)", 장비전은 "관우가 몇 살 위라 형으로 섬겼다"가 전부다. 의식도 맹세문도 복숭아밭도 원나라 잡극과 『삼국지평화』가 지어 연의가 완성한 무대다. 그런데 이상하지 않은가 — 지어낸 것은 형식뿐이다. 남남인 세 사람이 죽을 때까지 서로를 저버리지 않았다는 알맹이는 사실이니, 도원결의는 거짓말이라기보다 사실에 씌워 준 예복에 가깝다.',0,'<b>출전</b> 원형은 『삼국지』 촉서 관우전·장비전의 은약형제 기사<br><b>연의</b> 제1회<br><b>덧붙임</b> 맹세문 "같은 해 같은 달 같은 날에 죽기를 원하나이다"는 『삼국지평화』 단계에서 이미 완성되어 있었다. 세 사람의 출신 — 유비는 탁군의 몰락 종실, 관우는 하동에서 죄를 얻어 탁군까지 흘러온 망명자(사유는 정사에 없다), 장비는 탁군의 토박이. 도원(桃園)이 장비네 뒤뜰이라는 설정도 소설의 것이다.'],
 [184.17,0,'탁군 기병과 안희현위','탁군 누상촌, 돗자리 짜고 짚신 삼아 팔던 청년이 있었다. 집 동남쪽 뽕나무가 수레 덮개처럼 자라 "우리 집안에서 귀인이 난다"고 떠들다 어른들에게 혼나던 아이 — 한 경제의 아들 중산정왕의 후손이라지만, 그 계보는 3백 년을 내려오며 짚신 장수까지 흘러온 뒤였다. 전기는 밖에서 왔다. 중산의 말 장수 장세평과 소쌍이 이 청년의 그릇을 알아보고 천금을 댄 것이다. 황건이 일어나자 무리를 모아 종군했고, 그 공으로 안희현위 — 시골 치안관 자리를 얻었다. 촉한 황제의 이력서 첫 줄이다.',0,'<b>출전</b> 『삼국지』 촉서 선주전<br><b>연의</b> 제1~2회<br><b>덧붙임</b> 소년 유비의 스펙이 선주전에 남아 있다 — "독서를 즐기지 않고, 개와 말과 음악과 아름다운 옷을 좋아했다." 귀가 크고 팔이 길었다는 신체 묘사도 정사의 것이다. 스승 노식은 훗날 동탁의 폐립에 홀로 맞선 그 대학자 — 유비의 첫 인맥부터가 예사롭지 않았다.'],
 [184.5,3,'독우를 매질하다','감찰관 독우가 순시를 와서는 병을 핑계로 유비를 만나 주지 않았다. 정사 선주전의 다음 문장이 통쾌하다 — 유비가 곧장 들이닥쳐 독우를 묶고, 매 2백 대를 때린 뒤 제 인끈을 그 목에 걸어 두고 벼슬을 버리고 떠났다. 때린 사람은 유비 본인이다. 연의 제2회는 이 매질을 장비에게 넘기고 유비는 말리는 역으로 세웠다 — 인덕의 화신에게 폭력은 어울리지 않으니까. 그러나 정사의 유비는 말수 적고 감정을 얼굴에 안 드러내되, 속에 이런 불이 있는 사내였다. 소설이 지운 것은 사건이 아니라 성격이다.',0,'<b>출전</b> 『삼국지』 촉서 선주전, 배송지 주 『전략』<br><b>연의</b> 제2회 — 장비의 매질로 이관<br><b>덧붙임</b> 『전략』이 전하는 발단 — 조정이 군공 출신 관리를 정리한다는 소문에 유비가 면담을 청했으나 독우가 병을 핑계로 거절했다. 구조조정 통보에 대한 항의 폭행이었던 셈이다. 매질 후 관인을 그 목에 걸어 둔 디테일까지 정사 본문에 있다.'],
 [194,0,'서주를 얻다','조조의 대군이 서주를 도륙하자 도겸이 사방에 구원을 청했고, 달려온 것은 공손찬 밑에 있던 유비였다 — 병사라야 빌린 군사 천여 명에 굶주린 유민을 긁어모은 수준이었다. 그런데 병들어 죽어 가던 도겸이 유언을 남긴다. "유비가 아니면 이 고을을 안정시킬 수 없다." 미축과 진등 등 서주의 명사들이 이를 받들어 인수를 바쳤다. 서른넷, 떠돌이 의용군 대장이 하루아침에 대주(大州)의 주인이 된 것이다. 다만 이 행운은 2년을 못 간다 — 난세에 실력 없는 지위는 오래 빌려주지 않는다.',0,'<b>출전</b> 『삼국지』 촉서 선주전<br><b>연의</b> 제12회<br><b>덧붙임</b> 유비를 서주목으로 미는 여론전에는 북해상 공융과 하비의 진등이 나섰다 — 공융은 "백성이 유능한 이를 따르는 것"이라 논리를 대고, 진등은 원소에게까지 승인 편지를 받아 냈다. 무명 군벌의 첫 영지가 당대 명사들의 연서(連署)로 성사된 것 — 유비의 이름값은 이미 자산이었다.'],
 [196,0,'여포에게 서주를 잃다','원술이 쳐들어오자 유비는 주력을 이끌고 남쪽 국경에 나갔다. 그 빈틈에, 제 손으로 거둬 준 식객 여포가 하비를 급습해 처자까지 사로잡았다. 여기서 유비의 이상한 위대함이 나온다 — 그는 이를 갈며 복수를 외치는 대신 여포에게 화의를 청하고, 소패로 물러나 조용히 병사를 다시 모았다. 자존심을 접는 속도가 남달랐던 것이다. 지고 도망치고 얹혀살기를 되풀이하면서도 끝내 소멸하지 않은 비결 — 유비의 생존술은 칼이 아니라 이 유연함이었다.',0,'<b>출전</b> 『삼국지』 촉서 선주전, 위서 여포전<br><b>연의</b> 제14~15회<br><b>덧붙임</b> 이 실직 시기에 유비는 조표의 잔병과 굶주린 유민을 모아 광릉에서 버텼다 — 배송지 주 『영웅기』는 "굶주려 서로 잡아먹는 지경"이었다고 적는다. 촉한 소열제의 이력서에서 가장 밑바닥 줄이다 — 여기서도 흩어지지 않은 부하들이 훗날의 원로 공신단이 된다.'],
 [199,0,'매실주와 천둥','허도의 식객 시절, 조조가 유비를 술자리에 불렀다. 담소 끝에 조조가 툭 던졌다. "지금 천하의 영웅은 그대와 이 조조뿐이오. 원소 따위는 셈에 들지 못하지." 마침 숟가락을 들던 유비의 손에서 수저가 툭 떨어졌다 — 속을 들킨 것이다. 때마침 하늘에서 천둥이 울렸고, 유비가 천연덕스럽게 주웠다. "성인도 천둥엔 낯빛을 고친다더니, 과연 무섭습니다." 이 아슬아슬한 탐색전은 각색이 아니라 정사 선주전 본문이다. 연의 제21회는 푸른 매실과 데운 술이라는 소품만 보탰다 — 원판이 이미 완벽한 장면이었으니까.',0,'<b>출전</b> 『삼국지』 촉서 선주전 본문<br><b>연의</b> 제21회<br><b>덧붙임</b> 이 자리의 유비는 후원에서 채소나 기르며 위장 은퇴 중이었다 — 그 은둔자를 콕 집어 부른 초대 자체가 시험이었다. 젓가락 낙하 직후 유비는 원술 토벌을 자원해 허도를 탈출했다 — 천둥 연기가 산 것은 시간이었고, 그 시간이 목숨이었다.'],
 [200,0,'서주 재탈취와 패주','조조가 원술을 치라고 내준 군사를 끌고 나간 유비는, 가는 길에 서주를 접수하고 조조의 자사 차주를 베었다 — 의대조의 밀약을 실행에 옮긴 것이다. 조조가 원소와의 결전을 코앞에 두고도 몸소 동쪽으로 달려온 것이 유비의 불운이었다. 진영은 하루아침에 무너져 처자는 또 사로잡히고 관우는 항복했으며, 유비는 홀몸으로 원소에게 달아났다. 원소가 업성 2백 리 밖까지 나와 맞아 주었다 — 마흔의 유비가 가진 재산은 이제 이름값 하나뿐이었는데, 그 이름값이 이 정도였다.',0,'<b>출전</b> 『삼국지』 촉서 선주전, 위서 무제기<br><b>연의</b> 제21~25회<br><b>덧붙임</b> 조조의 참모들은 "원소가 등을 칠 것"이라며 동정(東征)을 말렸으나 조조는 "유비는 인걸이라 지금 안 치면 후환"이라며 강행했다 — 원소는 과연 아들의 병을 이유로 움직이지 않았다. 적장의 위험도 평가에서 유비가 원소보다 위였던 것이다.'],
 [201,0,'유표에게 의탁과 비육지탄','원소마저 무너지자 유비는 형주의 유표에게 흘러들었다. 유표는 그를 신야에 두었다 — 조조를 막는 울타리로는 쓰되 안채에는 들이지 않는, 정중한 경계였다. 그렇게 7년. 어느 술자리에서 뒷간에 다녀온 유비의 눈에 눈물이 있었다. 유표가 까닭을 묻자 — "늘 말안장 위에 살아 넓적다리에 살이 붙을 날이 없었는데, 이제 보니 살이 올랐습니다. 세월은 가는데 이룬 것이 없어 슬펐을 뿐입니다." 배송지 주 『구주춘추』가 전하는 비육지탄(髀肉之嘆)이다. 이때 유비 나이 마흔여섯 — 조조가 하북을 다 삼킨 해였다.',0,'<b>출전</b> 배송지 주 『구주춘추』<br><b>연의</b> 제34회<br><b>덧붙임</b> 신야 시절 유비는 형주 호걸들의 발길이 끊이지 않는 인기인이었다 — 유표가 그를 경계해 술자리에서 속을 떠본 것이 비육지탄의 자리였다는 판본도 있다. 식객 7년 — 마흔여섯의 유비에게 남은 자산은 몸에 붙은 살과, 형주 인심이라는 무형 자산뿐이었다.'],
 [202,0,'박망파의 매복','하후돈과 우금이 신야 쪽으로 밀고 내려오자, 유비는 스스로 진영을 불태우며 달아나는 시늉을 했다. 하후돈이 덥석 물어 쫓아온 길목 — 박망파의 좁은 길에 복병이 기다리고 있었다. 정사 선주전이 적는 이 승리의 지휘관은 유비 본인이다. 제갈량은 이 싸움 5년 뒤에야 세상에 나온다. 연의 제39회는 이 전공을 통째로 들어 갓 출사한 공명의 첫 용병으로 바쳤다 — 부채 한 번 흔들어 하후돈 10만을 태우는 신출귀몰의 개막전으로. 군신 두 사람 몫의 이야기를 위해, 소설은 주군의 전과를 참모에게 이체했다.',0,'<b>출전</b> 『삼국지』 촉서 선주전<br><b>연의</b> 제39회 — 제갈량의 첫 용병으로 이관<br><b>덧붙임</b> 이 무렵의 유비군은 유표에게 얹혀사는 객군(客軍) — 그 처지로 하후돈·우금의 정규군을 지형과 위장 후퇴로 깨뜨린 것이다. 상대였던 이전이 "길이 좁고 초목이 깊으니 복병을 조심하라"고 경고했으나 하후돈이 웃어넘겼다는 기사가 위서 이전전에 있다 — 양쪽 사서가 서로를 보증하는 승리다.'],
 [207,0,'삼고초려','마흔일곱의 좌장군이 스물일곱 백면서생의 초가를 세 번 찾아갔다 — 이 유명한 이야기의 원출처는 소설이 아니라 제갈량 본인의 「출사표」다. "선제께서는 신을 비루하다 여기지 않으시고, 몸을 굽혀 세 번이나 신을 초려로 찾아 주셨습니다(三顧臣於草廬之中)." 그런데 배송지가 인용한 『위략』은 정반대로 적는다 — 제갈량이 먼저 유비를 찾아갔고, 유비는 처음에 그를 여느 서생으로 대했다는 것이다. 배송지는 출사표를 증거로 삼고 쪽의 손을 들었다. 두 기록 중 무엇이 진실이든, 만남의 결과가 융중대였다는 것만은 움직이지 않는다.',0,'<b>출전</b> 「출사표」, 『삼국지』 촉서 제갈량전 — 이설은 배송지 주 『위략』·『구주춘추』<br><b>연의</b> 제37~38회<br><b>덧붙임</b> 『위략』판의 디테일 — 먼저 찾아온 제갈량에게 유비가 소꼬리 장식이나 엮으며 건성으로 대하자, "장군의 큰 뜻이 소꼬리에 있습니까"라고 쏘아붙여 눈에 들었다는 것이다. 어느 판이든 스물일곱 무명 서생을 국사(國士)로 대접한 파격은 같다 — 낮춘 쪽이 유비냐 제갈량이냐만 다르다.'],
 [208.67,0,'장판의 패주','조조의 호표기 5천이 하루 밤낮에 3백 리를 달려 당양 장판에서 유비를 따라잡았다. 유비가 느렸던 이유가 있다 — 형주 백성 10여만이 따라나서 하루 10여 리밖에 못 갔던 것이다. 백성을 버리고 강릉으로 달리자는 권유에 유비가 답한 말이 선주전 본문에 있다. "큰일을 이루려면 반드시 사람을 근본으로 삼는 법이다(夫濟大事必以人爲本). 나를 따라온 사람들을 어찌 버리고 가겠는가." 결국 처자마저 버리고 수십 기로 달아나는 참패를 당했지만 — 이 한 문장이 유비라는 브랜드의 전부였고, 그 브랜드는 이날 완성되었다.',9,'<b>출전</b> 『삼국지』 촉서 선주전<br><b>연의</b> 제41~42회<br><b>덧붙임</b> 추격군은 조순이 지휘한 호표기(虎豹騎) — 원담과 답돈을 잡은 조조군 최정예 기병이다. 이 혼란 속에 유비의 두 딸이 조순에게 사로잡혔다 — 연의가 조용히 지운 대목이다. 아두를 품은 감부인과 조운의 탈출이 빛나는 만큼, 구해지지 못한 이름들은 그림자로 남았다.'],
 [208.83,0,'손권과의 동맹','당양의 패잔병 유비에게 강동에서 조문 사절이 왔다 — 유표의 죽음을 조문한다는 명목이었지만, 노숙의 진짜 용건은 동맹 타진이었다. 유비가 내놓을 수 있는 패는 관우의 수군 1만과 유기의 강하병 1만이 전부. 그래도 노숙은 손을 내밀었고, 제갈량이 답방으로 시상에 갔다. 마흔여덟 평생 근거지 하나 없이 떠돈 사내의 인생이 이 협상 한 번으로 꺾어진다 — 두 달 뒤 적벽의 불길, 2년 뒤 형남 네 군의 주인. 기다림도 실력이라면, 유비는 천하제일이었다.',0,'<b>출전</b> 『삼국지』 촉서 선주전·제갈량전, 오서 노숙전<br><b>연의</b> 제42~43회<br><b>덧붙임</b> 노숙이 당양까지 마중 나와 유비의 행선지를 물었을 때, 유비는 "창오태수 오거에게 가려 한다"고 답했다 — 광서 오지의 옛 지인에게 몸을 의탁하겠다는, 사실상의 은퇴 선언이었다. 노숙이 "오거는 제 몸도 못 지킬 사람"이라며 손권행을 설득했다 — 삼국정립은 그 설득 한 번에 물꼬가 트였다.'],
 [209.92,0,'형남 4군과 손부인','적벽의 연기가 걷히자 유비는 남쪽으로 말을 돌려 무릉·장사·계양·영릉 네 군을 거두었다 — 평생 처음 가져 보는 제 땅이었다. 손권은 이 신흥 세력을 붙들어 두려 누이를 시집보냈다. 그런데 이 혼인이 잠자리 편한 동맹은 아니었다. 신부는 오라비들을 닮아 굳세고 사나워, 시비 백여 명이 칼을 차고 방을 지켰다 — 유비는 들어갈 때마다 심장이 서늘했다고 정사 법정전이 적는다. 북쪽엔 조조, 동쪽엔 손권, 안방엔 손부인 — 유비의 삼면 초가는 침실까지였다.',0,'<b>출전</b> 『삼국지』 촉서 선주전·법정전<br><b>연의</b> 제52~53회(4군), 제54~55회(혼인)<br><b>덧붙임</b> 4군 접수는 대부분 항복 접수였다 — 무릉태수 김선만 저항하다 죽었고, 장사의 한현은 연의에서만 위연에게 목이 잘린다(정사에서는 생존). 손부인은 훗날 오로 돌아가며 아두를 데려가려다 조운·장비에게 배 위에서 저지당했다 — 절강주아두(截江奪阿斗), 이것은 정사 조운별전에도 뼈대가 있는 실화다.'],
 [210,0,'형주를 빌리다','유비가 경구까지 몸소 내려가 손권에게 남군을 빌려 달라 청했다. 주유가 은밀히 상소했다 — 차라리 유비를 오에 붙들어 미녀와 놀게 하고 관우·장비를 갈라 부리자고. 노숙의 계산은 반대였다. 조조가 너무 크니 유비에게 형주를 세 주어 함께 막게 하자 — 손권은 노숙을 따랐다. 이 소식이 북쪽에 닿았을 때, 마침 글을 쓰던 조조의 손에서 붓이 툭 떨어졌다고 정사 노숙전이 적는다. 천하의 조조가 붓을 떨어뜨린 유일한 기록 — "형주를 빌린다(借荊州)"는 이 외상 거래가 이후 10년 오·촉 분쟁의 화근이 된다.',0,'<b>출전</b> 『삼국지』 오서 노숙전·주유전<br><b>연의</b> 제54회 전후<br><b>덧붙임</b> "빌린다(借)"는 표현은 오나라 쪽 장부의 언어다 — 유비 쪽 논리는 유표의 아들 유기를 형주자사로 세웠으니 상속이라는 것이었다. 같은 땅에 임대차 계약서와 상속 등기부가 따로 있었던 셈 — 반환 분쟁은 처음부터 예약되어 있었다.'],
 [211.92,0,'익주 입성','익주목 유장이 한중의 장로를 막아 달라며 유비를 불러들였다 — 늑대를 막으려 호랑이를 안방에 들인 것이다. 유비는 수만 병력으로 북상해 가맹관에 주둔했는데, 정작 장로와 싸우는 대신 은혜를 베풀며 인심을 사 모았다. 방통이 세 가지 계책을 올렸다 — 상책은 곧장 성도를 급습, 중책은 국경의 장수들을 벤 뒤 진군, 하책은 형주로 회군. 유비는 중책을 골랐다. 초대받은 손님이 1년 만에 주인의 목을 조르기 시작한 이 과정을, 진수는 차마 미화하지 못하고 "권도와 임기응변으로 취했다"고 적었다.',0,'<b>출전</b> 『삼국지』 촉서 선주전·방통전<br><b>연의</b> 제60~62회<br><b>덧붙임</b> 유비를 불러들이자고 유장을 설득한 장송·법정은 처음부터 유비 쪽 내응자였다 — 장송은 형주 지도를 통째로 바쳤다. 연의는 이 지도 헌상 장면에 장송의 사진 기억력 일화를 붙였다 — 조조의 병법서를 한 번 보고 통째로 외워 조조를 머쓱하게 하는 대목(제60회)이다.'],
 [214.42,0,'성도 함락과 익주 평정','낙성이 1년 만에 무너지고, 형주에서 올라온 제갈량·장비·조운의 군대가 합류해 성도를 에워쌌다. 성 안에는 아직 정예 3만과 1년 치 곡식이 남아 있었고 백성들은 죽기로 싸우겠다 했다. 그런데 유장이 성문을 열며 말했다. "우리 부자가 익주에 20여 년, 백성에게 은덕을 베푼 것이 없다. 3년을 싸워 시체가 들을 채운 것은 나 때문인데, 내 어찌 마음이 편하겠는가." 항복한 자의 이 한마디가 정복한 자의 어떤 연설보다 오래 남았다. 쉰넷의 유비는 마침내 나라 하나를 얻었다 — 융중대의 절반이 이루어진 날이다.',0,'<b>출전</b> 『삼국지』 촉서 선주전·유장전<br><b>연의</b> 제65회<br><b>덧붙임</b> 항복한 유장은 형주 공안으로 옮겨졌다 — 뒷날 손권이 형주를 삼킨 뒤 그를 다시 익주목으로 임명하는 촌극이 벌어진다. 빈 직함으로 촉의 민심을 흔들려는 심리전이었다. 성도의 창고를 연 유비는 금은을 나눠 주되 곡식과 비단은 백성에게 돌려주었다 — 조운의 간언이 통한 결과였다.'],
 [215.5,0,'상수(湘水)의 분할','익주를 얻은 유비에게 손권이 청구서를 내밀었다 — 이제 형주를 돌려달라. 유비가 "양주를 얻으면 돌려주겠다"고 눙치자 손권이 폭발해 여몽을 보내 세 군을 강제 접수했고, 유비도 5만을 이끌고 내려와 강을 사이에 두고 으르렁댔다. 동맹이 여기서 깨질 판이었는데 — 하필 그때 조조가 한중을 삼켰다는 급보가 왔다. 익주의 등에 칼이 들어온 것이다. 유비는 서둘러 도장을 찍었다. 상수를 경계로 동쪽 세 군은 손권, 서쪽 세 군은 유비. 봉합이었을 뿐 청구서 원본은 남았고, 4년 뒤 형주 전체로 결제된다.',0,'<b>출전</b> 『삼국지』 촉서 선주전, 오서 오주전<br><b>연의</b> 제66회 전후<br><b>덧붙임</b> 개전 직전까지 갔던 이 위기에서 여몽은 이미 세 군을 접수했고 노숙은 익양에서 관우와 대치 중이었다 — 단도부회가 이 대치의 산물이다. 조조의 한중 진공 소식 하나가 강 하나를 국경으로 만든 것 — 삼국지의 국경선은 언제나 제3자가 그었다.'],
 [219.42,0,'한중왕','정군산에서 하후연을 베고, 몸소 온 조조까지 버텨 물리치고 — 유비는 처음으로 조조와의 정면 대결에서 이겼다. 그리고 면양의 단 위에 올라 한중왕을 칭했다. 4백 년 전 한 고조 유방이 바로 이 한중에서 왕이 되어 천하를 얻었으니, 그 계보를 정확히 밟은 정치적 퍼포먼스다. 관우를 전장군, 장비를 우장군, 마초를 좌장군, 황충을 후장군으로 세웠다. 쉰아홉 — 돗자리 짜던 소년이 여기까지 오는 데 35년이 걸렸고, 이것이 그의 인생 최고점이었다. 최고점의 다음은 내리막이다.',7,'<b>출전</b> 『삼국지』 촉서 선주전<br><b>연의</b> 제73회<br><b>덧붙임</b> 왕위 추대 표문에는 마초의 이름이 첫머리에 올랐다 — 한나라 조정이 공인한 열후 서열이 가장 높았기 때문이다. 표문 원문이 선주전에 통째로 실려 있는데, 조조를 "동탁 이래 최대의 국적"으로 규정한다 — 왕을 칭하는 명분서가 곧 선전포고문이었다.'],
 [219.42,3,'오호대장군','관우·장비·조운·마초·황충 — 오호대장군이라는 이름은 누구나 알지만, 정사에 이 칭호는 없다. 219년 사방장군에 오른 것은 관우(전)·장비(우)·마초(좌)·황충(후) 네 사람뿐이고, 조운은 그보다 낮은 익군장군이었다 — 그가 정남장군으로 뛰어오른 것은 유선이 즉위한 223년이다. 다섯을 한 세트로 묶은 원조는 진수다. 다섯 사람의 전기를 한 권에 합쳐 「관장마황조전」을 만들었으니까. 연의는 그 목차를 벼슬 이름으로 바꿔 달았다 — 편집이 역사가 되고, 역사가 계급이 된 사례다.',7,'<b>출전</b> 『삼국지』 촉서 관장마황조전(합전 체재)<br><b>연의</b> 제73회<br><b>덧붙임</b> 이 인사의 실제 논란은 황충이었다 — 제갈량이 "황충의 명망은 관우·마초와 같지 않은데 같은 반열이면 관우가 불쾌해할 것"이라 미리 경고했고, 과연 관우는 "대장부가 늙은 병졸과 같은 줄에 서랴"며 인수를 거부하려 했다. 진수의 합전 편집이 소설에서 계급이 된 것 — 역사 서술 형식이 실체를 만든 희귀 사례다.'],
 [221.33,0,'황제 즉위','조비가 헌제를 폐하자 촉 땅에는 헌제가 시해되었다는 소문이 돌았다 — 사실 헌제는 멀쩡히 살아 있었지만, 유비는 소문 쪽을 믿기로 했다. 상복을 입고 곡을 하고 시호까지 올린 뒤, 성도 무담산에서 황제에 올랐다. 국호는 어디까지나 한(漢) — 망한 한나라를 잇는다는 뜻이니, 우리가 부르는 촉한은 후대의 별명이다. 예순한 살의 즉위였다. 한 황실 부흥이라는 평생의 간판을 지키려면 즉위해야 하고, 즉위하려면 헌제가 죽어 있어야 했다 — 명분의 정치란 때로 이렇게 불편한 눈감기를 요구한다.',4,'<b>출전</b> 『삼국지』 촉서 선주전<br><b>연의</b> 제80회<br><b>덧붙임</b> 즉위 반대자도 있었다 — 비시는 "조조 토벌도 못 했는데 먼저 즉위하면 인심이 의심한다"고 직언했다가 좌천되었다. 연호 장무(章武)와 함께 무담산 제천 문서가 선주전에 실려 있다 — "한나라는 끝없이 이어져야 한다(漢祚無疆)"는 문장이 이 나라의 존재 이유 전부였다.'],
 [221.58,0,'동정 결정과 반대','관우의 원수를 갚고 형주를 되찾겠다 — 유비가 동정을 선언하자 조운이 정면으로 막아섰다. "국적은 조조이지 손권이 아닙니다. 먼저 위를 멸하면 오는 절로 엎드립니다. 조조를 두고 오와 싸우는 것은 순서가 틀렸습니다." 학자 진밀도 말리다 옥에 갇혔다. 흥미로운 것은 제갈량의 침묵이다 — 정사 어디에도 그가 찬성했다는 기록도 반대했다는 기록도 없다. 이릉 참패 후에야 "법효직이 살았다면 막았을 텐데"라고 탄식할 뿐이다. 예순둘의 황제는 듣지 않았다. 이번만은 명분도 전략도 아닌, 다른 무엇이 그를 밀고 있었다.',7,'<b>출전</b> 『삼국지』 촉서 조운전 배송지 주 『운별전』·진밀전<br><b>연의</b> 제81회<br><b>덧붙임</b> 손권은 개전 직전 두 번 화친 사절을 보냈다 — 제갈량의 형 제갈근까지 편지를 썼다. "폐하께 관우와 선제(헌제) 중 누가 중합니까"라는 그 편지가 오서에 남아 있다 — 냉정하다 못해 잔인한 질문이었고, 답은 오지 않았다.'],
 [222.5,0,'이릉의 참패','반년을 대치하던 육손이 기다린 것은 여름이었다. 무더위에 지친 촉군이 숲 그늘로 진영을 옮기자 — 불이 왔다. 7백 리에 늘어선 40여 진영이 차례로 타올랐고, 정사는 그 끝을 이렇게 적는다. "배와 기물, 수군과 보병의 물자가 한꺼번에 사라졌고, 시체가 강을 메우며 떠내려갔다." 유비는 마안산에서 포위를 뚫고 밤에 백제성으로 달아나며 탄식했다. "내가 육손에게 꺾인 것이 어찌 하늘의 뜻이 아니겠는가." 촉이 수십 년 모은 정예와 물자, 그리고 형주 탈환의 꿈이 한 계절에 재가 되었다.',6,'<b>출전</b> 『삼국지』 촉서 선주전, 오서 육손전<br><b>연의</b> 제84회<br><b>덧붙임</b> 참패 명단이 참혹하다 — 장군 풍습·장남·부융 전사, 호왕 사마가 전사, 두로·유녕 항복, 황권은 위로 망명. 마량도 이 전역에서 죽었다 — 백미(白眉)라 불리던 그 사람이다. 촉의 야전 사령관 세대가 통째로 사라져, 제갈량의 북벌은 처음부터 인재 부족 위에서 시작된다.'],
 [222.5,2,'75만 대군','연의 제81회는 유비의 동정군을 75만이라 부른다. 숫자의 무게로 비극을 키운 것인데, 계산기를 두드려 보면 금방 들통난다 — 40년 뒤 촉이 망할 때 전체 인구가 94만, 병사가 10만 2천이었다. 온 나라 사람의 8할을 군대로 뽑아야 나오는 숫자다. 정사 기록으로 추산하는 실제 병력은 4만에서 8만 사이. 연의는 적벽의 조조군도 83만이라 불렀으니, 대략 열 배로 부풀리는 것이 이 소설의 환율이다. 그 환율 덕에 이야기는 웅장해졌고, 대신 진짜 놀라운 사실 — 그 작은 나라들이 그렇게 오래 버텼다는 것 — 은 가려졌다.',6,'<b>출전</b> 병력 추산은 『삼국지』 각 전 + 『진서』 부현전(오군 5만설)<br><b>연의</b> 제81회<br><b>덧붙임</b> 육손전은 촉군을 "4만여"로, 위서 유엽전 주는 "8만"으로 적는다 — 어느 쪽이든 오의 방어군 5만과 대차가 없는 규모다. 연의의 환율로 보면 조조 83만(적벽)·유비 75만(이릉) — 패자의 병력일수록 부풀었다. 큰 숫자는 비극을 웅장하게 만드는 조명이었다.'],
 [223.25,0,'백제성 탁고','병상의 유비가 성도에서 달려온 제갈량에게 나라를 맡기며 말했다. "그대의 재주는 조비의 열 배이니 반드시 나라를 안정시키고 대사를 이룰 것이오. 내 아들이 도울 만하거든 돕고, 그릇이 아니거든 — 그대가 스스로 취하시오(君可自取)." 제갈량이 눈물을 쏟으며 엎드렸다. "신이 감히 고굉의 힘을 다하고 충정의 절개를 바쳐, 죽음으로써 잇겠습니다." 정사 본문의 이 대화를 두고 천년째 논쟁이 이어진다 — 지극한 신뢰인가, 앞에서 쐐기를 박은 시험인가. 진수의 채점은 전자였다. "군신의 지극한 공심(公心), 고금의 성대한 모범이다."',0,'<b>출전</b> 『삼국지』 촉서 제갈량전<br><b>연의</b> 제85회<br><b>덧붙임</b> 탁고는 이중 구조였다 — 제갈량에게 정치를, 이엄에게 군권(중도호)을 맡겨 견제를 심었다는 독법이 유력하다. "그대가 취하라(君可自取)"의 해석은 지금도 갈린다 — 진심설, 시험설, 그리고 "유선 아닌 다른 아들을 골라도 좋다"는 택군(擇君)설까지. 한 문장이 낳은 논문이 책 한 권 분량이다.'],
 [223.25,0,'유비의 죽음','예순셋, 영안궁에서 눈을 감았다. 아들 유선에게 남긴 유조가 황제의 유언 같지 않아서 오히려 유명하다. "악이 작다고 행하지 말고, 선이 작다고 아니 행하지 말라(勿以惡小而爲之 勿以善小而不爲). 오직 어짊과 덕만이 사람을 움직인다." 진수의 총평은 균형이 잡혀 있다 — "너그럽고 굳세며 사람을 알아보았으니 한 고조의 풍모가 있었다. 다만 임기응변의 재략은 조조에 미치지 못했고, 그래서 나라도 좁았다." 잘 우는 인덕군자도, 무능한 호인도 아닌 — 백 번 지고도 백한 번째 일어난 사람. 그것이 정사의 유비다.',4,'<b>출전</b> 『삼국지』 촉서 선주전 — 유조는 배송지 주 『제갈량집』<br><b>연의</b> 제85회<br><b>덧붙임</b> 유조의 다른 대목도 아프다 — "아비는 덕이 얇았으니 본받지 말라", "『한서』와 『예기』를 읽고 틈틈이 제자백가와 『육도』를 보라." 죽는 아버지가 아들에게 남긴 독서 목록이었다. 시신은 성도로 운구되어 혜릉에 묻혔고, 시호는 소열(昭烈) — 오늘날 청두 무후사 경내에 그 능이 있다.'],
]},
{name:'관우·장비와 촉의 장수들', sub:'GUAN YU · ZHANG FEI · GENERALS',
 spans:[[184,208,'유랑하는 무리'],[208,219,'형주와 익주'],[219,223,'상실의 4년'],[223,264,'남은 장수들']],
 events:[
 [219.95,4,'주창이라는 인물','청룡도를 메고 관우의 그림자처럼 따라다니는 검은 얼굴의 사내 주창 — 역시 정사에 없는 인물이다. 원나라 『삼국지평화』와 잡극에서 태어나 연의에 채용되었고, 맥성에서 관우의 죽음을 듣고 스스로 목을 찔러 따라 죽는 것으로 완성되었다. 흥미로운 것은 그 이후다 — 오늘날 관제묘에 가면 관우의 좌우에 아들 관평과 주창이 서 있다. 실존한 아들과 실존하지 않은 부하가 나란히 향불을 받는 것이다. 신전에서는 사료 검증을 하지 않는다 — 믿음의 세계에서 주창은 관평만큼 실존한다.',0,'<b>출전</b> 원대 『삼국지평화』·잡극에서 형성<br><b>연의</b> 제28회 등장, 제77회 순사<br><b>덧붙임</b> 주창의 원류로 관우전의 실존 부하 요화가 지목되기도 한다 — 실제로 관우 곁을 지킨 것은 요화·조루 같은 이름들이었다. 관제묘의 배치 — 왼쪽에 아들 관평(인수 봉지), 오른쪽에 주창(청룡도 봉지) — 는 명대에 정형화되어 동아시아 전역으로 퍼졌다.'],
 [220.7,0,'황충의 죽음','정군산에서 하후연을 벤 이듬해, 노장은 조용히 병으로 세상을 떠났다 — 관례대로라면 예순을 훌쩍 넘긴 나이였을 것이다. 생전에 관우가 "대장부가 어찌 늙은 병졸과 같은 반열에 서겠는가"라며 후장군 임명에 불평한 일이 있는데, 사자로 간 비시가 절묘하게 달랬다. "한 시대의 공로를 논한 것일 뿐, 한왕(유비)의 마음속 경중이야 어찌 벼슬과 같겠습니까." 연의는 이 노장을 침상에서 보내는 것이 아쉬웠던지, 3년을 더 살려 이릉 전장의 화살에 죽게 했다(제83회) — 소설에서 노장의 명예로운 죽음이란 반드시 전사여야 했던 모양이다.',0,'<b>출전</b> 『삼국지』 촉서 황충전<br><b>연의</b> 제83회 — 이릉 전사로 개작<br><b>덧붙임</b> 황충전은 다섯 문장 남짓한 초미니 전기다 — 아들 황서가 요절해 후사도 끊겼다. 기록의 빈곤이 오히려 소설의 공간이 되었다 — 노장 서사, 활 솜씨, 이릉의 장렬한 최후까지 모두 그 여백에 지어졌다. 정사가 남긴 확실한 것은 하나 — 정군산의 그날, 그가 삼군의 선두에 있었다는 것이다.'],
 [222.3,0,'마초의 죽음','촉의 표기장군 마초는 마흔일곱에 병으로 죽으며 유비에게 짧은 유표를 올렸다. "신의 일족 2백 명은 조조에게 도륙당해, 남은 것이 사촌 아우 마대뿐입니다. 그를 폐하께 부탁드립니다." 서량을 뒤흔들던 사내가 남긴 마지막 문장이 혈육 하나의 안부였다. 촉에서의 그는 화려한 직함 속에 갇힌 손님이었다 — 팽양이 반역을 떠보는 말을 건네자 그날로 고발했을 만큼, 늘 살얼음을 걸었다. 반란 한 번의 대가로 일족을 잃고, 남은 생은 의심 속에 살고 — 마초의 삶은 연의가 그린 복수극보다 훨씬 쓸쓸한 이야기다.',0,'<b>출전</b> 『삼국지』 촉서 마초전<br><b>연의</b> 후반부에서 언급 없이 사라짐<br><b>덧붙임</b> 마초가 촉에서 남긴 마지막 기록은 저족 왕 강단니의 귀부를 이끈 것 — 이름값의 마지막 사용처였다. 아들 마승은 촉 멸망 후 종회의 난 와중에 죽었고, 마대의 후손만 이어졌다. 서량의 신위장군 집안은 그렇게 대가 끊겼다 — 반란 한 번의 이자까지 후대가 치른 셈이다.'],
 [229.2,0,'조운의 죽음','기곡에서 물러난 이듬해 조운이 죽었다. 정사 조운전은 놀랄 만큼 짧아서, 우리가 아는 조운의 미담은 대부분 배송지가 붙인 「조운별전」에서 온다 — 계양태수 조범이 미모의 형수를 바치려 하자 "같은 조씨니 그대의 형수는 내 형수"라며 물리친 일, 익주 평정 후 성도의 밭과 집을 공신들에게 나누자는 논의에 홀로 반대하며 "백성에게 돌려주어야 한다"고 한 일. 시호는 죽고 32년이 지난 261년에야 내려졌다 — 순평후(順平侯). 살아서 늘 몇 걸음 뒤에 서 있던 사람은, 죽어서도 마지막으로 호명되었다.',0,'<b>출전</b> 『삼국지』 촉서 조운전, 배송지 주 『운별전』<br><b>연의</b> 제97회 — 북벌 재개 직전의 병사로 처리<br><b>덧붙임</b> 시호 순평후의 순(順)은 "부드러워 어그러짐이 없다", 평(平)은 "다스림에 허물이 없다" — 무장의 시호로는 이례적으로 문(文)의 향이 난다. 강유 등이 시호를 청하며 든 근거가 당양의 구출과 계곡의 후퇴전이었다 — 이긴 싸움이 아니라 지키고 물러난 싸움들로 기려진 장수다.'],
 [234.3,4,'관흥과 장포','연의 후반부의 관흥과 장포는 아버지들의 유전자를 물려받은 청년 콤비다 — 서로 선봉을 다투다 의형제를 맺고, 이릉에서 아버지의 원수들을 차례로 벤다. 정사의 기록은 소설의 정반대다. 관흥은 문재가 있어 스무 살에 시중·중감군이 되었으나 몇 해 만에 요절했고 — 무공 기록이 없다. 장포는 "일찍 죽었다(早夭)" 넉 자가 전부다. 연의 제99회에서 장포가 계곡에 떨어져 죽자 제갈량이 피를 토하며 혼절하는 장면도 물론 창작이다. 아버지들의 복수를 시켜 줄 아들이 필요했던 소설이, 요절한 두 청년에게 두 번째 삶을 지어 준 것이다.',0,'<b>출전</b> 『삼국지』 촉서 관우전·장비전 부기(附記)<br><b>연의</b> 제81~102회에 걸친 콤비 활약<br><b>덧붙임</b> 연의의 두 사람은 아버지들의 무기를 물려받아 원수를 하나씩 소거한다 — 관흥은 반장을 베어 청룡도를 회수하고, 장포는 범강·장달의 송환을 받는다. 2세대 복수극은 이릉의 참패마저 정서적으로 이긴 전쟁으로 바꾸는 장치였다 — 역사의 패전을 서사의 승전으로 결제한 것이다.'],
 [248,0,'왕평의 죽음','흥세에서 조상의 10만을 막아 낸 4년 뒤, 왕평은 한중을 지키던 자리에서 조용히 죽었다. 정사는 그를 마충·등지와 묶어 "그 시절 촉의 울타리"라 평한다. 위나라 진영에서 항복해 온 문맹의 장수가, 제갈량 사후 촉의 북쪽 대문을 10년 넘게 잠근 것이다. 성격 평가가 재미있다 — 법을 지켜 농담할 줄 몰랐고, 종일 단정히 앉아 장군 같지 않았으나, 성정이 좁고 의심이 많아 스스로를 가볍게 여긴 것이 흠이라고. 완벽하지 않은 사람의 완벽한 직무 수행 — 정사가 사랑하는 종류의 인물이다.',0,'<b>출전</b> 『삼국지』 촉서 왕평전<br><b>연의</b> 후반부에서 소리 없이 퇴장<br><b>덧붙임</b> 왕평은 본래 조조군 소속으로 한중전에서 촉에 귀순한 사람이다 — 위에서 대접받지 못한 하급 무관이 촉에서 진북대장군까지 올랐다. "손에서 책을 놓지 않는" 대신 남이 읽어 주는 것을 들었고, 구술로 받아쓰게 한 편지들이 조리 정연했다고 정사가 적는다 — 문해력과 판단력이 별개임을 증명한 인사 기록이다.'],
 [264.1,0,'요화와 종예 — 마지막 세대','촉이 항복하고 낙양으로 옮겨 가는 길 위에서, 우장군 요화와 진군대장군 종예가 잇달아 병으로 죽었다. 요화의 이력이 곧 촉한사다 — 관우의 주부로 출발해 형주 함락 때 오에 잡혔다가 거짓 죽음으로 탈출해 돌아왔고, 북벌에 종군했으며, 나라의 마지막 해까지 전선에 있었다. 관우의 서기가 촉한의 관 뚜껑까지 본 것이다. "촉에 대장이 없어 요화가 선봉을 선다"는 말은 후대에 생긴 속담일 뿐 사서에 없다 — 오히려 사서의 요화는, 인재가 마른 나라를 50년간 홀로 메운 사람에 가깝다.',0,'<b>출전</b> 『삼국지』 촉서 종예전(요화 부기)<br><b>연의</b> 후반부의 단골 선봉장<br><b>덧붙임</b> 종예는 오나라 사행에서 손권의 마음을 얻은 외교관 출신이다 — 작별하는 날 손권이 그 손을 붙잡고 눈물지었다. "그대도 늙고 나도 늙었으니, 다시는 못 만나겠구려." 요화의 탈출극 — 죽은 척 관을 쓰고 밤낮으로 서행(西行)해 유비의 동정군과 자귀에서 합류했다 — 는 정사 기사다. 연의가 지어낸 것 같은 인생이 실화인, 그런 세대였다.'],
 [200.25,3,'문추를 베다','연의는 관우에게 안량에 이어 문추까지 몰아준다 — 참안량 주문추, 짝을 맞춘 것이다. 정사의 연진 전투는 다르게 흘러간다. 조조가 치중 수레를 미끼로 흘리자 문추의 기병 5~6천이 노획물에 흩어졌고, 그 순간 6백 기가 들이쳐 문추는 어지러운 싸움 속에 죽었다. 무제기는 "문추를 베었다"고만 적을 뿐 누구의 손인지 밝히지 않는다 — 관우전에도 문추의 문(文) 자가 없다. 안량 하나로는 아까웠던 소설이 이름 없는 병사의 전공을 슬쩍 옮겨 적은 것이다.',0,'<b>출전</b> 『삼국지』 위서 무제기 — 참수 주체 불명<br><b>연의</b> 제26회<br><b>덧붙임</b> 연의는 이 승부에 서사를 겹으로 얹었다 — 문추가 먼저 장료·서황을 연달아 꺾은 뒤에야 관우가 나서 삼 합 만에 벤다. 안량·문추가 하북의 쌍벽으로 강조될수록 관우의 주가도 오르는 구조 — 소설의 적장은 주인공의 몸값을 매기는 저울추다.'],
 [219,4,'청룡언월도와 장팔사모','82근 청룡언월도, 1장 8척 사모, 방천화극 — 삼국지 무기 전시관의 대표작들은 모두 후대의 소품이다. 언월도라는 무기 자체가 송나라 『무경총요』에 처음 보이는 의장·훈련용 대도로, 한나라 말에는 존재하지 않았다. 당시 기병의 실전 무기는 찌르는 모(矛)와 극(戟), 그리고 한 손 환수도였다. 결정적 증거는 정사 관우전의 글자 하나 — 안량을 "찔렀다(刺)"고 적었다. 베는 언월도가 아니라 찌르는 창이었던 것이다. 무기는 가짜지만 덕분에 얻은 것도 있다 — 청룡도 없는 관우상을, 이제 우리는 상상하지 못한다.',0,'<b>출전</b> 무기 고증 — 『무경총요』(1044) 등<br><b>연의</b> 제1회의 무기 제작 장면부터<br><b>덧붙임</b> 연의 제1회에서 세 사람은 좋은 쇠 천 근으로 쌍고검·청룡언월도·장팔사모를 맞춘다 — 대장장이 주문 제작 장면 자체가 캐릭터 시트였다. 여포의 방천화극도 의장용 화극이 원형이다. 삼국 무장의 실전 무기는 모(矛)·삭(槊)·환수도 — 마초와 싸운 염행은 창이 부러지자 부러진 자루로 마초의 목을 쳐 거의 죽일 뻔했다고 『산양공재기』가 적는다.'],
 [219.83,0,'방덕, 관을 지고 나서다','번성 구원길에 방덕은 관(棺)을 하나 짜서 수레에 실었다. "내가 관우를 죽이지 못하면, 관우가 나를 죽일 것이다" — 어차피 하나는 이 관에 눕는다는 선언이었다. 마초의 옛 부하라 위군 안에서도 의심받던 처지, 결백을 증명할 방법이 목숨뿐이었던 것이다. 홍수 속에서 갑옷에 화살이 박히도록 싸우다 배가 뒤집혀 사로잡혔고, 무릎 꿇리려는 손길에 버티고 서서 외쳤다. "위왕께는 백만의 군사가 있다. 유비 따위 용렬한 자에게 무릎 꿇겠는가." 그리고 죽었다. 연의가 한 글자도 고칠 필요가 없었던, 완성된 최후다.',0,'<b>출전</b> 『삼국지』 위서 방덕전<br><b>연의</b> 제74회<br><b>덧붙임</b> 방덕의 형 방유는 촉에서 벼슬 중이었고 옛 주군 마초도 촉의 대장 — 위군 안의 의심이 당연한 처지였다. 조조는 그 죽음에 눈물을 흘리고 두 아들을 열후에 봉했다 — 아들 방회는 훗날 종회의 촉 정벌에 종군해 관씨 일족을 몰살했다고 『촉기』가 전한다. 배송지는 이 복수 기사에 의문을 달았지만, 은원의 대물림이라는 상상력은 여기서 나왔다.'],
 [214,4,'낙봉파와 방통','봉추 방통은 낙성 공격을 지휘하다 날아온 화살에 맞아 죽었다 — 서른여섯, 정사 방통전의 전부다. 연의 제63회는 이 죽음에 운명극 한 편을 입혔다. 유비가 아끼는 적로마를 빌려 탄 방통이 낙봉파(落鳳坡)라는 언덕에 이르자, 매복한 궁수들이 적로 탄 자를 유비로 알고 집중 사격한다 — 봉(鳳)이 떨어지는(落) 언덕에서 봉추(鳳雛)가 죽은 것이다. 지명도 오인 사격도 소설의 발명품이다. 우연한 유탄으로는 와룡과 짝을 이루던 인물의 퇴장이 너무 싱거웠던 것 — 연의는 죽음에조차 각운을 맞춘다.',0,'<b>출전</b> 전사 기사는 『삼국지』 촉서 방통전<br><b>연의</b> 제63회<br><b>덧붙임</b> 방통의 실제 어록은 따로 있다 — 익주 공략 승전연에서 유비가 "오늘 모임이 즐겁구나" 하자 "남의 나라를 치며 즐거워하는 것은 어진 이의 군대가 아닙니다"라고 찬물을 끼얹었다. 취한 유비가 내쫓았다가 도로 불렀는데, 방통은 사과도 없이 태연히 먹고 마셨다 — 와룡과는 전혀 다른, 봉추의 결이다.'],
 [219.42,4,'관색이라는 인물','관우의 셋째 아들 관색 — 연의 후반부에 문득 나타나 남만 정벌의 선봉을 서는 이 청년은 정사에 없다. 관우전이 적는 아들은 관평과 관흥뿐이다. 관색은 민간 설화가 낳은 인물로, 「화관색전」이라는 독립된 이야기책이 명나라 무덤에서 실물로 발굴되기까지 했다 — 유비 삼형제가 거사에 방해될까 서로의 가족을 죽이기로 하는 충격적 설정으로 시작하는, 완전히 다른 세계관의 삼국지다. 연의의 판본들은 이 인기 캐릭터를 조금씩 수입했고, 모종강본은 대부분 도로 덜어냈다. 민중은 관우에게 아들 하나를 더 낳아 준 셈이다.',0,'<b>출전</b> 「화관색전」(1478년 간본, 1967년 상하이 출토)<br><b>연의</b> 제87회 등에 단편적으로 등장(판본에 따라 다름)<br><b>덧붙임</b> 「화관색전」의 세계는 과격하다 — 관색은 아버지 관우에게 버림받아 성이 화(花)씨가 되었고, 아버지와 대결 끝에 인정받는다. 서남 지방에는 관색령(關索嶺) 같은 지명이 지금도 있다 — 소설이 낳은 인물이 지도에 이름을 남긴, 허구의 역수출이다.'],
 [191,3,'화웅을 베다','"술이 아직 따뜻하구나" — 연의 제5회, 데운 술이 식기 전에 화웅의 목을 들고 돌아오는 관우. 삼국지에서 가장 유명한 데뷔전이지만, 정사를 펴면 주인이 다르다. 손파로전은 손견이 양인 전투에서 동탁군을 대파하고 도독 화웅을 참했다고 분명히 적는다. 그때 관우는 관동 전선에 있지도 않았다. 연의는 손견의 전공을 통째로 들어다 무명의 마궁수에게 바쳤다 — 신분 낮은 자가 실력 하나로 좌중을 뒤집는 이 장면이 필요했던 것이다. 소설의 관우는 여기서 태어났고, 정사의 손견은 제 전공을 영영 빌려주게 되었다.',0,'<b>출전</b> 실제 전공은 『삼국지』 오서 손파로토역전<br><b>연의</b> 제5회 — 온주참화웅(溫酒斬華雄)<br><b>덧붙임</b> 연의의 이 장면이 강한 것은 신분 연출 때문이다 — 원술이 "일개 마궁수가 감히"라며 막고, 조조만이 술을 데워 권한다. 명문가의 오만과 실력주의의 대비 — 조조가 유관장의 첫 후원자로 그려지는 것도 이 장면부터다. 화웅의 이름은 일부 판본에 엽웅(葉雄)으로 적혀 있어 교감 논쟁이 있다.'],
 [200.17,0,'안량을 베다','이것은 진짜다. 백마에서 관우가 안량의 지휘 깃발과 수레 덮개를 멀리서 알아보고, 말을 박차 만 명 한가운데를 뚫었다 — "만군 속에서 안량을 찔러(策馬刺良於萬衆之中) 그 목을 베어 돌아오니, 원소의 장수 중 감히 막는 자가 없었다." 정사 관우전 본문 그대로다. 삼국지 전체를 뒤져도 대장이 적진 중앙의 적장을 제 손으로 벤 기록은 사실상 이것 하나 — 연의의 수많은 일기토가 창작이지만, 그 모든 창작의 원형이 된 이 한 번만은 역사다. 관우 신화의 주춧돌은 진품인 셈이다.',4,'<b>출전</b> 『삼국지』 촉서 관우전 본문<br><b>연의</b> 제25회<br><b>덧붙임</b> 연의는 여기에 변명 한 줄을 보탰다 — 유비가 원소 진영에서 "내 아우가 그대 장수를 벤 듯하다"는 처지가 되자, 안량이 유비의 밀서를 전하려다 방심해 당했다는 설이 모종강본 협비(夾批)에 소개된다. 관우의 완승이 유비의 목숨을 위협하는 삼각 구도 — 정사에는 없는 이 긴장이 소설의 밀도를 만든다.'],
 [200.25,0,'조조를 떠나다','조조는 관우를 놓치고 싶지 않았다 — 편장군에 한수정후, 상과 연회가 쏟아졌다. 관우의 속을 떠보고 온 장료에게 관우는 숨기지 않았다. "조공의 후대는 잘 알지만, 나는 유장군의 두터운 은혜를 입어 함께 죽기로 맹세했소. 공을 세워 갚은 뒤에 떠나겠소." 안량을 베어 빚을 갚자, 받은 것을 모두 봉해 두고 작별 편지 한 장을 남긴 채 떠났다. 좌우가 쫓기를 청하니 조조가 막았다. "저마다 제 주인이 있는 법이다(彼各爲其主). 쫓지 말라." 의리와 의리가 마주 선, 정사가 기록한 가장 아름다운 이별이다.',0,'<b>출전</b> 『삼국지』 촉서 관우전 본문<br><b>연의</b> 제25~27회<br><b>덧붙임</b> 연의의 삼약(三約) — 한나라에 항복하는 것이지 조조가 아니다, 두 형수를 보호한다, 유비의 소식을 알면 떠난다 — 는 창작이다. 정사의 관우는 조건 없이 항복했고 조건 없이 떠났다 — 조건문이 없어서 오히려 더 깨끗한 거래였다. 조조의 "쫓지 말라"는 관용까지가 한 세트다.'],
 [200.25,4,'오관참육장','다섯 관문에서 여섯 장수를 베며 형수들을 모시고 천 리를 가는 길 — 연의 제27회의 이 대서사는 전부 창작이다. 공수·맹탄·한복·변희·왕식·진기, 여섯 희생자는 정사에 존재하지 않는 이름들이고, 동선도 이상하다. 허도에서 원소가 있는 하북으로 가려면 북쪽으로 곧장 가면 되는데, 연의의 관우는 낙양 쪽으로 크게 우회한다 — 관문이 그쪽에 있기 때문이다. 정사의 기록은 단정하다. "조조가 쫓지 말라 했다." 아무도 막지 않은 길에, 소설은 관문 다섯과 목 여섯을 세워 의리의 개선문으로 만들었다.',0,'<b>출전</b> 창작<br><b>연의</b> 제27회<br><b>덧붙임</b> 다섯 관문의 지리적 모순은 청대 고증학자들도 지적했다 — 동령관·낙양·사수관·형양·활주는 허도에서 북상하는 길이 아니라 서쪽으로 도는 길이다. 그럼에도 이 동선이 살아남은 것은 각 관문이 의리 시험의 관문이기도 했기 때문 — 지도가 아니라 서사의 지형을 따른 길이었다.'],
 [208.67,0,'장판교의 장비','이것도 진짜다. 장비가 기병 스무 명으로 뒤를 막았다. 다리를 끊고, 물을 등지고, 눈을 부릅뜨고 창을 비껴 든 채 외쳤다 — "내가 장익덕이다. 올 테면 와서 죽음을 겨루자(可來共決死)!" 조조군의 누구도 감히 다가서지 못했다. 정사 장비전 본문 그대로이며, 호통에 다리가 무너지고 하후걸이 낙마해 죽었다는 연의식 과장 없이도 이미 완벽한 장면이다. 굳이 따지면 순서 하나가 다르다 — 다리는 호통치기 전에 미리 끊어 두었다. 정사의 장비는 목청만 좋은 게 아니라 계산도 빨랐던 것이다.',0,'<b>출전</b> 『삼국지』 촉서 장비전 본문<br><b>연의</b> 제42회<br><b>덧붙임</b> 연의가 얹은 것 — 호통 세 번에 하후걸이 간담이 터져 낙마하고, 조조군 전체가 되돌아 달아나며, 다리를 끊은 것이 오히려 겁먹은 증거가 되어 조조가 추격을 재개한다는 후일담. 정사의 스무 기(騎)는 소설에서도 그대로다 — 숫자를 안 부풀린 드문 경우인데, 원본의 대비(20 대 대군)가 이미 완벽했기 때문일 것이다.'],
 [208.67,2,'조운의 장판 구출','혼란의 장판에서 조운이 어린 유선을 품에 안고 감부인을 지켜 사지를 빠져나왔다 — 정사 조운전은 이 한 문장이다. 일곱 번 뚫고 일곱 번 나오는 칠진칠출도, 조조가 반해 활을 쏘지 말라 명한 것도, 청홍검으로 명장 쉰 명을 벤 것도 연의 제41회가 쌓아 올린 층이다. 유비가 아이를 땅에 던지며 "이 아이 하나 때문에 명장을 잃을 뻔했다" 하는 장면도 소설이다. 한 문장이 한 챕터가 되는 것 — 그것이 연의의 마법이고, 조운은 그 마법의 최대 수혜자였다.',0,'<b>출전</b> 『삼국지』 촉서 조운전<br><b>연의</b> 제41회<br><b>덧붙임</b> 이 순간 누군가 "조운이 북으로 도망쳤다"고 고하자 유비가 수극을 던지며 말했다 — "자룡은 나를 버릴 사람이 아니다(子龍不棄我走也)." 조운전 주 『운별전』의 기록이다. 과연 조운은 아두를 안고 돌아왔다 — 소설의 칠진칠출보다, 주군의 이 확신 한 문장이 조운이라는 사람의 실제 평판이었다.'],
 [209,4,'위연의 반골','연의 제53회의 제갈량은 갓 항복해 온 위연의 뒤통수에서 반골(反骨)을 읽어 낸다 — "훗날 반드시 배반할 상이니 목을 베라." 관상 한 번으로 사람의 일생에 저당을 잡은 것인데, 물론 창작이다. 정사의 위연은 유비가 사병 출신에서 발탁해 한중태수까지 올린 초고속 승진의 주인공이다. 그 인사가 발표되자 모두가 장비의 자리라 여겼기에 전군이 놀랐다고 정사는 적는다. 연의는 왜 반골을 심었을까 — 위연의 최후를 알고 있는 소설이, 결말에 맞춰 복선을 소급해 깔아 준 것이다. 이야기는 그래서 공평하지 않다.',0,'<b>출전</b> 창작 — 발탁 기사는 『삼국지』 촉서 위연전<br><b>연의</b> 제53회<br><b>덧붙임</b> 한중태수 임명식에서 유비가 물었다 — "네게 큰 임무를 맡겼는데 어찌 지키겠느냐." 위연의 대답이 위연전에 있다. "조조가 천하를 들어 오면 막아 내고, 편장 10만이면 삼켜 버리겠습니다(請爲大王吞之)." 전군이 그 장담에 감복했다 — 반골 관상 대신 정사가 남긴 것은 이 배포였다.'],
 [209,4,'장사와 황충','연의 제53회, 장사성 아래서 관우와 노장 황충이 어우러진다. 말이 넘어진 황충을 관우가 살려 보내자, 황충은 답례로 화살을 투구 끈에만 맞힌다 — 의리와 의리가 오가는 명장면이지만 통째로 창작이다. 정사 황충전은 심심하리만치 간결하다. 유표 밑에 있다가, 조조가 남하하자 비장군이 되었고, 유비가 형남을 거두자 그대로 따랐다 — 대결도 활도 없다. 태수 한현을 위연이 베었다는 것도 소설의 살이다. 다만 소설이 만든 이 가상의 첫 만남 덕분에, 정군산의 실화가 몇 배는 극적으로 읽히게 되었다.',0,'<b>출전</b> 창작 — 귀부 기사는 『삼국지』 촉서 황충전<br><b>연의</b> 제53회<br><b>덧붙임</b> 이 창작 대결이 후대에 남긴 것이 크다 — "노장은 죽지 않는다"는 황충 캐릭터의 원형이 여기서 주조되어, 한국어 "황충 같다"는 관용구까지 낳았다. 위연의 한현 참살 창작은 반골 낙인과 한 세트 — 은인을 벤 자라는 원죄를 심어 둔 것이다.'],
 [211,3,'마초의 반란','연의의 마초는 조조에게 아버지를 잃고 복수의 칼을 가는 효자다. 정사의 시간표는 잔인하게도 정반대다 — 아버지 마등이 조정에 들어가 위위 벼슬을 받고 일족과 함께 업에 살고 있는데, 아들 마초가 관중에서 군사를 일으켰다. 인질로 잡힌 가족의 목숨을 걸고 반란을 택한 것이다. 이듬해 마등과 일족 2백여 명이 처형되었다. 연의는 처형을 먼저, 반란을 나중으로 뒤집어 인과를 세탁했다 — 효(孝)의 나라에서 주인공급 인물이 아버지를 죽음으로 내몬 채로는 사랑받을 수 없었기 때문이다.',0,'<b>출전</b> 『삼국지』 촉서 마초전, 위서 무제기<br><b>연의</b> 제57~59회 — 인과를 역전<br><b>덧붙임</b> 마초의 할머니는 강족 — 서쪽 부족들은 그를 절반쯤 제 사람으로 여겼고, 저족과 강족이 깃발만 보고 모여들었다. 위나라가 관중을 안정시킨 뒤에도 서쪽 변경의 마씨 신화는 오래 남아, 촉이 그를 표기장군으로 모신 것도 그 신화의 값이었다.'],
 [214.42,0,'마초의 귀부','한중의 장로 밑에서 겉돌던 마초가 유비에게 투항했다. 성도를 포위 중이던 유비가 기뻐 외쳤다 — "익주는 내 것이다." 마초가 병사를 이끌고 성 북쪽에 나타나자, 성 안이 그 이름만으로 술렁이더니 열흘 만에 항복했다고 정사가 적는다. 서량에서 조조를 몰아붙이던 그 이름값이 공성 병기보다 무거웠던 것이다. 그러나 촉에서의 마초는 이름뿐인 표기장군이었다 — 실병 지휘 기록이 없다. 일족 2백을 죽게 한 전력의 사나이를, 새 나라는 예우하되 믿지는 않았다.',0,'<b>출전</b> 『삼국지』 촉서 마초전<br><b>연의</b> 제65회 — 가맹관 야전(장비와의 일기토)으로 각색<br><b>덧붙임</b> 연의의 장비-마초 야간 혈투 백여 합은 창작이지만 원형 재료는 있다 — 정사에서 마초가 "유비의 벼슬이 낮다"고 오만하게 굴자 관우·장비가 분노했고, 유비가 예로 눌렀다는 일화다(마초전 주). 힘의 대결을 예의의 대결로 옮긴 원본을, 소설이 도로 힘의 대결로 되돌린 셈이다.'],
 [215,0,'장비와 장합 — 와구관','한중을 둔 전초전에서 장합이 파서로 밀고 내려오자 장비가 마주 나갔다. 50여 일을 대치한 끝에 장비가 고른 무대는 와구의 좁은 산길 — 앞뒤가 서로 구원할 수 없는 지형에 장합의 군을 끌어들여 크게 깨뜨렸다. 장합은 말을 버리고 부하 십여 명과 산을 타 달아났다. 위나라 최고의 지형 전문가가 지형으로 당한 것이다. 연의가 그린 술주정뱅이 맹장의 그림 뒤에, 정사는 지도를 읽는 장비를 적어 두었다 — 훗날 서화에 능했다는 기록까지 겹치면, 우리가 아는 장비상은 절반쯤 다시 그려야 한다.',0,'<b>출전</b> 『삼국지』 촉서 장비전<br><b>연의</b> 제70회<br><b>덧붙임</b> 이 승리로 파서(巴西)의 백성이 한중으로 끌려가는 것을 막았다 — 장합의 임무가 주민 이주였기 때문이다. 연의는 이 대목에 장비의 술 계략을 붙였다 — 일부러 술 취한 척 장합을 유인하는 지주(智酒)의 장면(제70회). 술버릇이 약점이던 인물에게 술을 무기로 쥐여 준, 영리한 반전 각색이다.'],
 [219.17,0,'정군산과 황충','한중 쟁탈전의 클라이맥스. 법정이 산세를 읽고 때를 짚자, 예순을 넘긴 황충이 북소리와 함께 산비탈을 내리 덮쳤다 — "한 번 싸움에 하후연을 베니(一戰斬淵), 연의 군이 크게 무너졌다." 조조의 서부 방면 총사령관이 전장에서 목이 떨어진 것이다. 서쪽 하늘이 기울었고, 조조가 몸소 왔으나 대세를 돌리지 못했다. 백발의 노장이 대검을 짚고 함성 속에 서 있었을 이 장면은 각색이 필요 없었다 — 연의도 그저 받아 적었다. 황충은 이 공으로 후장군에 올랐고, 이듬해 세상을 떠난다.',1,'<b>출전</b> 『삼국지』 촉서 황충전·법정전<br><b>연의</b> 제71회<br><b>덧붙임</b> 하후연 전사의 직접 원인은 정사가 따로 적는다 — 진영 보수를 위해 병력을 나눠 스스로 최전선의 울타리를 고치러 나갔던 것이다. 조조가 평소 "장수가 겁낼 줄도 알아야지, 용맹만 믿으면 필부의 적수일 뿐"이라 경고한 편지가 남아 있다 — 예언이 된 잔소리였다.'],
 [219.25,1,'조운의 공영계','한중에서 조운이 소수 기병으로 조조의 대군과 정면으로 마주쳤다. 싸워 뚫고 진영까지 물러난 조운의 선택이 기가 막히다 — 문을 닫는 대신 활짝 열고, 깃발을 눕히고, 북을 멈췄다. 복병을 의심한 조조군이 머뭇대다 물러서는 순간, 뒤에서 북이 일제히 울리고 쇠뇌가 쏟아졌다. 저희끼리 밟혀 한수에 빠져 죽은 자가 부지기수. 이튿날 현장을 둘러본 유비가 감탄했다 — "자룡은 온몸이 담덩어리로구나(子龍一身都是膽也)." 배송지 주 「조운별전」의 기록이니, 훗날 제갈량의 공성계로 각색되는 원본이 바로 이 빈 진영이다.',0,'<b>출전</b> 배송지 주 『조운별전』<br><b>연의</b> 제71회<br><b>덧붙임</b> 이날 조운은 포위된 황충을 구하러 나갔다가 대군과 정면으로 마주친 것이었다 — 구출·돌파·공영(空營)·역습이 한 흐름이다. "일신시담(一身是膽)" 평가와 함께 군중에서 호위장군(虎威將軍)이라는 별명이 붙었다고 별전이 전한다 — 정사 본문보다 별전이 후한 대표적 인물이다.'],
 [219.58,2,'수엄칠군','가을비가 열흘 넘게 쏟아지자 한수가 넘쳤다. 평지의 물이 몇 길 — 우금의 칠군 3만이 언덕 위로 쫓겨 올라간 그 물 위로, 관우의 수군이 큰 배를 몰아 나타났다. 우금은 항복했고, 방덕은 끝까지 활을 쏘다 잡혀 죽었다. 정사가 "위세가 화하를 뒤흔들었다(威震華夏)"고 쓴 유일한 순간이다. 다만 연의 제74회처럼 관우가 둑을 쌓아 물을 모았다가 터뜨린 것은 아니다 — 홍수는 하늘이 내렸고, 관우가 한 것은 그 물을 탈 배를 미리 준비해 둔 것이다. 하늘의 운을 실력으로 바꾼 것만으로도 충분한데, 소설은 하늘의 몫까지 관우에게 주고 싶었던 모양이다.',8,'<b>출전</b> 『삼국지』 촉서 관우전, 위서 우금전·방덕전<br><b>연의</b> 제74회<br><b>덧붙임</b> 위세진화하(威震華夏)의 파장 — 허도 이남의 군도(群盜)들이 관우의 인수를 받아 지부(支部)를 자처했고, 육혼의 손랑 같은 반란 세력이 호응했다. 번성 포위는 군사 작전이면서 중원 민심의 시위였던 것 — 조조의 천도 논의는 그 민심의 무게에 대한 반응이었다.'],
 [219.58,0,'괄골요독','화살 독이 뼈에 스몄으니 살을 째고 뼈를 긁어야 한다는 의원의 말에, 관우는 팔을 내밀고 하던 술자리를 계속했다. 피가 그릇에 넘치는 동안 고기를 굽고 담소하며 바둑을 두었다 — 정사 관우전 본문의 기록이다. 연의 제75회는 이 자리에 명의 화타를 앉혔지만, 화타는 그보다 10여 년 전에 이미 조조의 옥에서 죽었다. 정사는 의원의 이름을 적지 않았다 — 소설은 빈칸을 못 견디고 당대 최고의 이름을 채워 넣은 것이다. 이름 없는 군의관의 시술이, 그렇게 신의(神醫)의 전설로 승격되었다.',0,'<b>출전</b> 『삼국지』 촉서 관우전 본문<br><b>연의</b> 제75회<br><b>덧붙임</b> 관우전이 적는 부위는 왼팔이며 시점은 번성전 이전의 어느 날이다 — 흐리고 비 오는 날마다 뼈가 쑤셨다(每至陰雨 骨常疼痛)는 후유증 기사가 수술의 계기였다. 연의는 이를 번성 전투 한복판으로 옮기고 독화살과 화타를 붙였다. 마취 없이 담소하며 수술받는 이 장면은 훗날 관제 신앙에서 인내와 초인의 증거로 숭배되었다 — 병상 기록이 성인전(聖人傳)의 한 장이 된 것이다.'],
 [219.92,0,'맥성과 관우의 최후','여몽이 강릉을 소리 없이 접수하자, 북상해 있던 관우의 군대가 이상해졌다 — 가족들이 오군의 보호 아래 잘 있다는 소식이 전해질 때마다 병사들이 밤길로 사라진 것이다. 싸우지 않고 군대를 녹이는 심리전이었다. 맥성에 갇힌 관우는 포위를 뚫고 서쪽으로 달렸으나, 임저의 샛길에서 반장의 부하 마충의 그물에 걸렸다. 아들 관평과 함께 참수 — 손권은 그 머리를 조조에게 보냈고, 조조는 제후의 예로 장사 지냈다. 진수의 냉정한 부검이 남아 있다. "만인지적이었으나, 굳세고 자부심이 지나쳐(剛而自矜) 스스로 패망을 불렀다."',12,'<b>출전</b> 『삼국지』 촉서 관우전, 오서 오주전<br><b>연의</b> 제76~77회<br><b>덧붙임</b> 처형 결정에 대해 오서는 손권의 즉단으로, 『촉기』는 "살려 유비·조조를 견제하자"는 참모론을 물리친 것으로 적는다 — 배송지는 후자에 "손권이 그 정도를 몰랐겠는가"라고 토를 달았다. 머리는 낙양의 조조에게, 몸은 당양에 — 그래서 관우의 무덤은 두 곳이다. 낙양 관림(關林)과 당양 관릉, 둘 다 지금도 참배객을 받는다.'],
 [219.92,4,'옥천산의 현성','목 잘린 관우의 혼백이 옥천산 하늘을 떠돌며 외친다 — "내 머리를 돌려다오(還我頭來)!" 승려 보정이 조용히 되묻는다. "그럼 장군이 벤 안량과 문추의 머리는 누가 돌려줍니까." 관우의 혼이 크게 깨닫고 흩어졌다는 연의 제77회는 불교 영험담에서 온 창작이다. 그런데 이 창작이 예언이 되었다 — 관우는 수당 대에 옥천사의 수호신이 되고, 송 휘종에게 왕(王)을, 명 만력제에게 제(帝)를 받아 마침내 공자와 나란한 무성(武聖)에 오른다. 소설은 천 년 신격화의 기록이자 가속 장치였다. 죽은 뒤에 가장 출세한 사내 — 그것이 관우다.',0,'<b>출전</b> 창작 — 신격화 연혁은 역대 봉호 기록<br><b>연의</b> 제77회<br><b>덧붙임</b> 봉호의 인플레이션 연표 — 송 휘종이 충혜공→숭녕진군→무안왕(1102~1123), 명 만력제가 삼계복마대제(三界伏魔大帝, 1614), 청 대에 존호가 26자까지 늘었다. 공자의 문묘와 나란한 무묘(武廟)의 주신이 되었고, 상인들의 재신(財神)으로도 모셔졌다 — 소금 상인들의 수호신에서 출발한 재물신 관우는 지금도 화교 상권의 계산대 곁에 있다.'],
 [221.42,0,'장비의 죽음','동정 출병을 앞둔 낭중에서, 장비는 부하 장달과 범강의 칼에 잠자리에서 죽었다 — 두 사람은 그 목을 들고 손권에게 달아났다. 정사는 원인을 명확히 적는다. "군자(君子)는 아끼되 소인(小人)을 돌보지 않았다" — 유비가 늘 경계했었다. "너는 형벌로 사람을 죽이는 것이 이미 지나친데, 매질한 자를 다시 곁에 두니 이것이 화를 부르는 길이다." 관우는 사졸에게 다정하고 사대부에게 오만했으며, 장비는 그 정반대였다 — 그리고 두 사람 모두 제 약점이 예언한 방식 그대로 죽었다. 진수의 붓은 여기서 가장 서늘하다.',6,'<b>출전</b> 『삼국지』 촉서 장비전<br><b>연의</b> 제81회<br><b>덧붙임</b> 장비의 두 딸은 나란히 유선의 황후가 되었다(경애황후·장황후) — 촉한 황실의 절반이 장씨 혈통이었던 셈이다. 몸은 낭중의 환후사(桓侯祠)에, 머리는 운양에 묻혔다는 전설이 있어 관우처럼 무덤이 두 곳이다 — 시호 환후(桓侯)의 환은 용맹으로 영토를 넓혔다는 뜻이다. 암살자 장달·범강을 손권이 어떻게 처리했는지는 기록이 없다 — 연의만이 그들을 송환시켜 능지처참했다.'],
 [222.5,0,'황권의 항복','이릉에서 강북을 맡았던 황권은 퇴로가 끊기자 오에 항복할 수는 없어 위로 넘어갔다. 촉의 법대로라면 처자가 잡혀야 했다 — 담당 관리가 절차를 밟으려 하자 유비가 막았다. "내가 황권을 저버린 것이지, 황권이 나를 저버린 것이 아니다(孤負黃權 權不負孤也)." 그 가족은 전과 다름없이 대우받았다. 위나라의 황권도 같은 격이었다 — 유비의 부고에 위의 신하들이 축하할 때 홀로 웃지 않았고, 촉에 남은 아들 황숭은 훗날 위군과 싸우다 전사한다. 패전이 만든 이산가족이 양쪽에서 서로의 예의를 지킨, 삼국지에서 가장 품위 있는 항복이다.',6,'<b>출전</b> 『삼국지』 촉서 황권전<br><b>연의</b> 제85회 전후에 간략히<br><b>덧붙임</b> 위 문제가 "그대는 진평·한신을 본받아 온 것인가" 묻자 황권이 답했다 — "패군의 장수가 죽음을 면한 것만도 다행인데 무슨 옛사람 흉내겠습니까." 촉에서 처자가 처형됐다는 헛소문에도 "유비는 그럴 사람이 아니다"라며 발상(發喪)을 거부했다 — 적국에 가서도 옛 주군의 인품을 담보로 걸었고, 그 담보는 부도나지 않았다.'],
 [228.17,0,'조운의 기곡 후퇴','1차 북벌에서 조운의 임무는 미끼였다 — 기곡에서 위의 주력 조진을 붙들어 두는 것. 중과부적으로 밀리면서도 몸소 후위를 맡아 병력과 물자를 거의 잃지 않고 물러났다. 제갈량이 남은 군수 비단을 상으로 내리려 하자 조운이 사양했다. "싸움에 진 군대가 무슨 상입니까. 창고에 넣어 두었다가 겨울에 나누어 주십시오." 제갈량이 감탄했다고 「조운별전」이 전한다. 이기고 우쭐대는 장수는 많아도, 지고 이렇게 물러나는 장수는 드물다 — 조운의 진가는 장판의 창끝이 아니라 이런 뒷모습에 있다.',0,'<b>출전</b> 『삼국지』 촉서 조운전, 배송지 주 『운별전』<br><b>연의</b> 제96회 전후<br><b>덧붙임</b> 이 작전에서 조운이 몸소 불태운 잔도가 적의 추격로였다 — 후위·수습·차단을 한 사람이 처리한 것이다. 제갈량이 "가정에서는 병력을 다 잃었는데 기곡은 어찌 온전한가" 묻자 등지가 답했다. "조 장군이 몸소 뒤를 끊었기 때문입니다." 패전 보고서에 적힌 유일한 흑자 항목이었다.'],
 [228,0,'위연의 자오곡 계책','"정예 5천에 군량 5천만 주십시오. 자오곡으로 열흘이면 장안입니다. 지키는 하후무는 겁 많은 귀공자 — 반드시 달아납니다. 승상께서 야곡으로 나오시면 함양 서쪽을 한 번에 평정할 수 있습니다." 위연이 북벌 때마다 올린 이 도박안을 제갈량은 번번이 물렸다 — 너무 위험하다, 평탄한 길로 농우를 먼저 취하는 것만 못하다. 위연은 물러나며 승상의 겁을 한탄했다고 정사와 『위략』이 나란히 적는다. 채택되지 않은 계책은 영원히 패하지 않는 법 — 그래서 자오곡 5천은 천칠백 년째 술자리 논쟁의 안주가 되고 있다.',0,'<b>출전</b> 『삼국지』 촉서 위연전, 배송지 주 『위략』<br><b>연의</b> 제92회<br><b>덧붙임</b> 자오곡은 진령을 남북으로 꿰는 660리 잔도 — 실제로 이 길을 시도한 조진(230)은 장마로 한 달 만에 회군했고, 훗날 촉을 친 종회도 이 길을 피했다. 1,400년 뒤 명말의 고영상이 비슷한 기습로를 실행하다 전멸했다 — 후대의 실전 데이터들이 제갈량의 기각(棄却) 쪽에 표를 던진 셈이다.'],
 [231,0,'왕평과 무당비군','가정에서 마속이 산으로 오를 때 끝까지 말린 사람이 부장 왕평이었다. 본대가 무너지자 왕평은 겨우 천 명으로 북을 울리며 버텨 — 복병을 의심한 장합이 다가서지 못했다 — 흩어진 병사들을 수습해 돌아왔다. 전원이 처벌받은 가정에서 유일하게 승진한 사람이다. 글자는 열 개 남짓밖에 몰라 사서를 남이 읽어 주는 것으로 들었지만 요지를 놓치지 않았고, 남중에서 뽑은 정예 무당비군을 이끌었으며, 244년 흥세에서는 조상의 대군을 막아 냈다. 문맹의 명장 — 촉 후기의 방패는 책이 아니라 사람을 읽는 사람이었다.',0,'<b>출전</b> 『삼국지』 촉서 왕평전<br><b>연의</b> 제95회(가정)<br><b>덧붙임</b> 무당비군(無當飛軍)은 남중 이주민으로 편성한 산악 특수부대 — 독화살과 산악 기동이 주특기로, "당할 자 없다(無當)"는 이름부터가 전투력 광고였다. 왕평은 이 부대로 장합의 추격을 막았고, 뒷날 다른 지휘관 아래서 이 부대는 강유의 소모전에 갈려 나간다 — 부대의 흥망이 곧 촉 군사력의 곡선이었다.'],
 [234.67,0,'위연과 양의의 파국','제갈량이 죽자 봉인이 풀렸다 — 서로를 견디지 못하던 선봉장 위연과 참모장 양의가 철군 지휘권을 두고 충돌한 것이다. 위연은 "승상이 죽었다고 북벌을 접느냐"며 먼저 남하해 잔도를 불태웠고, 두 사람은 서로를 반역자로 고발하는 파발을 하루가 멀다고 조정에 날렸다. 조정이 양의를 믿자 위연의 병사들이 흩어졌고, 한중으로 달아나던 위연은 마대의 칼에 죽어 삼족이 멸했다. 정사는 명확히 선을 긋는다 — "위연의 본뜻은 북으로 위에 항복하려는 것이 아니라 양의를 죽이려는 것이었다." 반골의 역모가 아니라, 중재자를 잃은 두 앙숙의 공멸이었다.',8,'<b>출전</b> 『삼국지』 촉서 위연전<br><b>연의</b> 제104~105회 — "내가 감히 누구를(誰敢殺我)"의 참수극<br><b>덧붙임</b> 연의는 제갈량이 마대에게 밀계를 남겨 위연의 외침을 신호로 베게 했지만, 정사의 마대 추격은 왕평이 위연의 병사들을 해산시킨 뒤의 사후 처리였다 — "승상이 돌아가셨는데 너희가 감히"라는 왕평의 일갈에 위연의 군이 흩어진 것이 실제 승부처였다. 죽은 위연의 머리를 양의가 밟으며 "용렬한 종놈이 다시 악을 행하겠느냐" 했다는 기사까지가 정사다 — 소설보다 정사가 더 험한 드문 대목이다.'],
 [235,0,'양의의 자멸','위연을 제거하고 대군을 무사히 돌린 양의는 당연히 승상의 자리를 기대했다 — 그런데 제갈량이 진작 지목해 둔 후계자는 장완이었다. 한직에 앉은 양의는 불평을 삭이지 못하고 비의에게 폭탄 발언을 쏟아냈다. "승상이 돌아가셨을 때 내가 군을 통째로 위에 몰고 갔더라면, 내 처지가 이렇게 영락했겠소!" 비의는 그대로 보고했다. 유배, 유배지에서 또 비방 상소, 그리고 자결 — 위연이 죽은 바로 이듬해다. 제갈량이 두 사람의 재주를 아껴 평생 저울로 눌러 두었다는 것을, 두 사람은 저울이 사라진 뒤에야 증명한 셈이다.',0,'<b>출전</b> 『삼국지』 촉서 양의전<br><b>연의</b> 제105회<br><b>덧붙임</b> 제갈량 생전의 인사 파일이 남아 있다 — "양의는 성정이 급하고 좁으니(性狷狹)" 장완을 후계로 삼는다는 밀표를 미리 올려 두었던 것이다. 수십 년 전 양의는 관우의 형주에서 발탁된 인재였다 — 형주 상실, 이릉, 북벌, 그리고 몰락까지 촉한사의 모든 굽이를 통과한 끝의 자멸이었다.'],
]},
{name:'제갈량', sub:'ZHUGE LIANG',
 spans:[[197,207,'융중의 포의'],[207,214,'유비의 참모'],[214,223,'익주 경영'],[223,234,'승상과 북벌'],[234,264,'사후의 이름',1]],
 events:[
 [223,0,'촉의 물적 토대','인구 100만이 안 되는 나라가 10만 군대를 유지하며 대국과 40년을 싸웠다 — 이 이상한 산수의 답이 제갈량의 살림 장부에 있다. 도강언에 전담 인력 1,200명을 두어 이백 년 묵은 수리 시설을 국보로 관리했고, 소금과 철을 국영으로 돌려 사염교위·사금중랑장이라는 전담 관청을 세웠으며, 촉 비단(蜀錦)을 국가 수출 산업으로 키웠다. "지금 백성이 곤궁하니 나라의 밑천은 오직 비단뿐(決敵之資 唯仰錦耳)"이라는 그의 말이 남아 있다 — 위나라와 오나라의 귀족들이 적국의 비단을 다투어 입었으니, 전선에서 지지 않은 군대 뒤에 무역에서 이긴 나라가 있었다.',0,'<b>출전</b> 『화양국지』, 『삼국지』 촉서 여러 전 종합<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 촉금(蜀錦)의 고객 명단에 적국이 다 올라 있다 — 위와 오 모두 촉 비단을 수입했고, 오는 이를 다시 해외로 중계했다. 성도의 별칭 금관성(錦官城)이 이 산업의 유적이다 — 두보의 시구 "금관성 밖 잣나무 우거진 곳"의 그 금관성이 비단 관영 공장이라는 뜻이다.'],
 [234,0,'팔진도','정사는 제갈량이 "병법을 미루어 팔진도를 만들었다(推演兵法 作八陣圖)"고 적고, 빈 진영을 둘러본 사마의의 감탄이 그 성능 보증서가 되었다. 실체는 보병 중심의 촉군이 위의 기병을 상대하기 위한 다중 방진 운용법으로 추정된다 — 훗날 진의 명장들이 이를 교범으로 배웠다는 기록이 있다. 연의 제84회는 이것을 어복포의 돌무더기 미궁으로 바꿨다 — 팔진도에 갇힌 육손이 신선의 안내로 겨우 빠져나오는 판타지다. 두보가 노래했다. "공은 세 나라로 갈린 천하를 덮었고, 이름은 팔진도로 이루어졌다(功蓋三分國 名成八陣圖)." 실전 교범이 시가 되고 미궁이 된, 개념의 일대기다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전<br><b>연의</b> 제84회(어복포 석진)<br><b>덧붙임</b> 당나라 이정(李靖)의 병법 문답 『이위공문대』가 팔진도를 실전 교리로 분석한다 — 육화진(六花陣)이 그 개량형이라 자술했다. 기주(夔州) 강가의 팔진도 유적 돌무더기는 두보가 시로 남긴 명소였다 — "강물은 흘러도 돌은 구르지 않는다(江流石不轉)." 소설의 미궁과 병가의 교범이 같은 이름을 나눠 쓴 것이다.'],
 [234.5,4,'상방곡과 칠성등','연의의 마지막 북벌은 두 번의 하늘 탓으로 끝난다 — 상방곡 골짜기에 사마의 부자를 몰아넣고 불을 놓았더니 때아닌 소나기가 꺼 버렸고(제103회), 목숨을 빌던 칠성등은 위연이 뛰어들며 걷어차 꺼뜨렸다. "일을 꾀하는 것은 사람이나 이루는 것은 하늘이다(謀事在人 成事在天)!" — 제갈량의 절규까지, 전부 창작이다. 정사의 오장원에는 화공도 등불도 없다. 백여 일의 대치와 과로와 병사(病死)뿐이다. 소설은 왜 이 장치가 필요했을까 — 신으로 그려 온 인물이 그냥 병들어 죽을 수는 없으니, 하늘이 직접 나서서 막았다는 각본이 필요했던 것이다. 패배의 책임을 하늘로 올린, 가장 장엄한 변명이다.',0,'<b>출전</b> 창작<br><b>연의</b> 제103회<br><b>덧붙임</b> 상방곡 소나기 장면의 사마의 대사 — "죽을 자리에서 살았으니 하늘이 돕는구나" — 는 연의가 하늘의 개입을 양쪽 모두에게 확인시키는 장치다. 칠성등 의식은 도교의 양수(禳壽) 기도 — 본명등(本命燈)이 꺼지면 수명이 끝난다는 민간 신앙을 정확히 반영했다. 소설의 신학에서 제갈량의 패인은 무능이 아니라 천명 — 그래서 독자는 져도 그를 원망하지 않는다.'],
 [207,0,'융중대','초가에서 만난 스물일곱 청년이 마흔일곱 유랑 군벌에게 천하의 설계도를 펼쳤다. "조조는 백만 무리에 천자를 끼고 있으니 다툴 수 없습니다. 손권은 강동 3대이니 도울 수는 있어도 도모할 수는 없습니다. 남는 것은 형주와 익주 — 주인들이 지킬 그릇이 못 됩니다. 두 주를 취해 안을 다지고 오와 손잡았다가, 천하에 변고가 생기면 두 갈래로 북상하십시오." 조조가 화북을 막 통일한 시점에, 아무것도 없는 유비를 세 나라의 한 축으로 상정한 대담한 역산이다. 그리고 실제 역사는 이 설계도의 전반부를 정확히 따라갔다 — 형주를 잃는 후반부의 파탄까지 포함해서, 촉한의 운명은 이 문서 안에 있었다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전 본문 — 대화 전문 수록<br><b>연의</b> 제38회<br><b>덧붙임</b> 융중대에는 유명한 누락이 있다 — 손권이 형주를 노린다는 변수다. "손권과는 동맹만 가능하다" 해 놓고 그 동맹이 형주를 원하는 경우의 수가 없다 — 219년의 파국이 정확히 그 빈칸에서 터졌다. 27세 서생의 설계도로는 충분히 위대하고, 국가 전략으로는 치명적 공백이었다 — 두 평가 모두 성립한다.'],
 [208.83,0,'시상 사행','조조의 대군이 강을 덮어 오는데, 스물여덟 살 사신이 강동의 주인을 상대로 벼랑 끝 화법을 구사했다. "싸우실 수 있으면 어서 결단하십시오. 못 하시겠거든 갑옷을 벗고 북면하여 섬기십시오. 지금처럼 겉으로 복종하는 척 속으로 머뭇거리시면 — 화가 당장 닥칩니다." 손권이 발끈했다. 그럼 유비는 왜 항복하지 않는가. "왕실의 후예요 당대의 영걸이신데, 어찌 남의 밑에 서겠습니까." 정사 제갈량전에 실린 실제 언사다. 자존심을 찔러 결단을 끌어내는 이 협상술 — 적벽으로 가는 문은 제갈량의 세 치 혀가 먼저 열었다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전 본문<br><b>연의</b> 제43회<br><b>덧붙임</b> 이 담판의 마지막 카드는 숫자였다 — "우리 군이 아직 수전 정예 1만, 유기의 강하병 1만이 있습니다. 조조군은 멀리 와서 지쳤고 북방인은 수전을 못 하며 형주민은 진심으로 붙은 것이 아닙니다." 감정을 찌른 뒤 계산서를 내미는 순서 — 스물여덟 외교관의 협상 교본이다.'],
 [208.83,4,'설전군유·초선차전·차동풍','강동 문신들을 말로 몰살하는 설전군유(제43회), 안개 낀 강에서 화살 십만 대를 꾸어 오는 초선차전(제46회), 칠성단에 올라 동남풍을 비는 차동풍(제49회) — 적벽의 제갈량 3부작은 전부 창작이다. 정사에서 그의 역할은 동맹 성사라는 외교 한 가지였고, 작전과 화공은 주유와 황개의 몫이었다. 그런데 연의는 왜 이 한 해에 창작을 몰아넣었을까. 여기서 세운 신산귀모의 이미지가 이후 모든 장면의 밑천이 되기 때문이다 — 적벽에서 신이 된 제갈량은, 이후 무엇을 해도 관객이 믿는다. 캐릭터 구축이란 이런 것이다.',0,'<b>출전</b> 창작<br><b>연의</b> 제43·46·49회<br><b>덧붙임</b> 차동풍의 무대 남병산 칠성단은 도교 의례의 완전한 재현이다 — 기문둔갑과 축문, 머리 풀고 맨발로 걷는 보강답두(步罡踏斗)까지. 명대 독자들에게 제갈량은 유학자이자 도사였다 — 우수화선(羽扇纶巾)의 도인 이미지가 여기서 완성되어, 후대의 제갈량 초상은 관복이 아니라 학창의를 입게 된다.'],
 [209,0,'군수 실무 — 형남 세 군','적벽 이후 제갈량의 직함은 군사중랑장 — 이름은 그럴듯하지만 실제 업무는 영릉·계양·장사 세 군의 세금을 걷어 군량과 병력을 대는 후방 행정이었다. 유비의 익주 원정에도 처음엔 따라가지 않았다 — 형주에 남아 관우와 살림을 지켰고, 진중의 꾀는 방통과 법정이 냈다. 정사의 젊은 제갈량은 전략 기획과 행정의 사람이지, 진 앞에서 부채를 흔드는 군사(軍師)가 아니었던 것이다. 그가 실제로 군을 지휘하는 것은 마흔 넘어 남중과 북벌에서부터 — 소설과 정사의 제갈량은 경력의 순서가 다르다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전<br><b>연의</b> 다루지 않음 — 소설의 공명은 늘 전선에 있다<br><b>덧붙임</b> "調其賦稅 以充軍實(부세를 조달해 군수를 채웠다)" — 이 여덟 글자가 적벽 후 3년간의 직무 기술서 전부다. 익주 원정 합류 후에도 좌장군부의 서명 실무를 총괄했다 — 촉한 정권의 회계 감사가 그의 본업이던 시절이 소설에서는 통째로 증발했다.'],
 [214.42,0,'촉과(蜀科)와 법치','익주를 접수한 제갈량이 법전 「촉과」를 만들자 법정이 이의를 냈다 — 갓 얻은 땅이니 한 고조의 약법삼장처럼 느슨하게 가야 민심을 얻지 않겠는가. 제갈량의 답변서가 남아 있다. "유장의 통치가 물렀기에 은혜가 값을 잃고 형벌이 위엄을 잃었습니다. 법이 시행되면 은혜가 비로소 귀해집니다." 진수가 그 결과를 채점했다 — "형정은 준엄했으나 원망하는 자가 없었으니, 마음 씀이 공평하고 권함과 경계함이 분명했기 때문이다(刑政雖峻而無怨者)." 엄한데 원망이 없다는 것, 통치의 역설 중 가장 어려운 것을 해낸 셈이다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전 배송지 주 『촉기』(답 법정서)<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 공동 입법자 명단이 흥미롭다 — 법정(법의 이름을 가진 유장 배신자), 이엄(훗날 제갈량이 폐서인하는 정적), 유파(유비를 평생 피해 다닌 인재), 이적. 출신도 성향도 제각각인 다섯의 합작 법전 — 촉과 자체는 실전되었으나, "촉 사람들이 그를 두려워하면서도 사랑했다(畏而愛之)"는 평가가 그 법의 성적표다.'],
 [221.33,0,'승상 취임','유비가 제위에 오르며 제갈량을 승상으로 삼았다 — 마흔한 살이다. 유비가 죽은 뒤에는 승상부(丞相府)를 열어 "정사는 크건 작건 모두 제갈량이 결정했다(政事無巨細 咸決於亮)"고 정사가 적는다. 황제가 있는데 재상이 전권을 쥔 이 구조는 위험한 발명품이었다 — 그러나 촉한에서만은 사고가 나지 않았다. 권력을 다 쥔 사람이 끝내 그 권력으로 아무것도 사유하지 않았기 때문이다. 후대의 왕조들이 승상 제도를 두려워하면서도 제갈량만은 칭송한 이유가 여기 있다 — 제도가 아니라 사람이 예외였다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전<br><b>연의</b> 제80회 전후<br><b>덧붙임</b> "정무는 크건 작건 모두 결정했다(咸決於亮)"의 실무 증거가 남아 있다 — 스스로 장부를 직접 검사했고(自校簿書), 주부 양옹이 "닭이 새벽을 알리고 개가 도둑을 짖듯 각자의 소임이 있는 법"이라며 과로를 간했다. 제갈량은 사과하고도 습관을 못 고쳤다 — 그 성실이 곧 촉한의 행정력이자, 그의 수명이었다.'],
 [223.42,0,'오와 다시 손잡다','이릉의 원한이 채 식지 않은 시점에, 제갈량은 등지를 오에 보내 동맹의 끈을 다시 묶었다 — 감정보다 지도를 먼저 읽은 것이다. 손권이 짐짓 물었다. "두 나라가 힘을 합쳐 위를 없앤 뒤, 천하를 나눠 각자 다스리면 즐겁지 않겠소?" 등지의 대답이 서늘하게 정직했다. "하늘에 해가 둘일 수 없고 땅에 왕이 둘일 수 없습니다. 위를 멸한 뒤에는 — 두 나라가 각자 북채를 잡고 다시 싸우게 되겠지요." 손권이 크게 웃었다. "그대의 솔직함이 이 정도인가!" 거짓말을 섞지 않은 외교가 40년 동맹의 주춧돌이 되었다.',0,'<b>출전</b> 『삼국지』 촉서 등지전<br><b>연의</b> 제86회<br><b>덧붙임</b> 첫 대면에서 손권이 등지를 겁주려 기름 끓는 솥을 걸어 두었다는 것은 연의의 연출(제86회) — 정사의 손권은 오히려 만남을 미루며 재는 쪽이었다. 재개된 동맹은 229년 천하 분할 밀약으로 완성되는데, 그 문서에는 아직 위나라 소유인 주(州)들의 배분표까지 있었다 — 잡지 않은 곰의 가죽을 나눈 외교 문서다.'],
 [225.25,0,'남중 정벌','유비가 죽자 남중의 호족과 이민족 수장들이 일제히 등을 돌렸다 — 옹개는 오와 내통하고 고정과 주포가 호응했다. 제갈량은 2년간 농사와 병사를 기른 뒤 몸소 남하했고, 그해 가을 안에 평정을 끝냈다. 눈여겨볼 것은 뒤처리다 — 마속이 배웅길에 올린 "성을 치는 것은 하책, 마음을 치는 것이 상책(攻心爲上)"이라는 조언대로, 점령군을 남기지 않고 현지 수장에게 통치를 돌려준 것이다. 남중의 금·은·소·말과 정예 무당비군이 이후 북벌의 밑천이 되었으니 — 가장 적게 죽인 정벌이 가장 오래 남는 전리품을 거둔 셈이다.',3,'<b>출전</b> 『삼국지』 촉서 제갈량전, 배송지 주 『한진춘추』<br><b>연의</b> 제87~91회<br><b>덧붙임</b> "그 우두머리로 그들을 다스린다(即其渠帥而用之)" — 군대도 관리도 남기지 않은 통치의 논리를 제갈량이 직접 설명한 기록이 남아 있다. 관리를 남기면 병력이 필요하고, 병력은 군량이 필요하고, 원한만 쌓인다는 3단 논법이었다 — 최소 개입 원칙의 고전적 진술이다.'],
 [225.42,1,'칠종칠금','맹획을 일곱 번 사로잡고 일곱 번 놓아주었다는 칠종칠금 — 출처가 연의가 아니라는 것이 이 이야기의 반전이다. 습착치의 『한진춘추』를 배송지가 주석으로 실었다. 일곱 번째 풀려난 맹획이 말한다. "공은 하늘의 위엄이십니다(公天威也). 남인은 다시 배반하지 않겠습니다." 정작 정사 본문은 "그해 가을 모두 평정했다" 한 줄이고 맹획이라는 이름조차 없다 — 일곱 번 잡고 놓아줄 시간이 물리적으로 있었는지 의심하는 학자도 많다. 주석 한 줄이 연의 다섯 회(제87~91회)로, 다시 축융부인과 목록대왕의 판타지로 — 이야기는 이렇게 번식한다.',0,'<b>출전</b> 배송지 주 『한진춘추』 — 본문에는 맹획 이름 없음<br><b>연의</b> 제87~90회<br><b>덧붙임</b> 실존 맹획은 한인계 남중 유력자로 보는 견해가 우세하다 — 뒷날 촉 조정의 어사중승까지 올랐다는 기록(『화양국지』)이 있으니, 일곱 번 놓아준 포로가 감찰 고관이 된 셈이다. 축융부인·목록대왕·타사대왕과 등갑군은 전원 연의의 창작 — 남만 판타지는 소설이 세운 테마파크다.'],
 [227.17,0,'출사표','북벌에 앞서 후주에게 올린 이 글은 전략 보고서라기보다 유서에 가깝다. "선제께서 창업하신 뜻이 절반도 이루어지기 전에 중도에 붕어하시고(先帝創業未半而中道崩殂)" — 로 시작해, 곽유지·비의·동윤을 남기고, 궁중과 부중이 한 몸이 되어야 한다고 당부하고, 제 내력을 고백한다. "신은 본디 포의로 남양에서 밭을 갈며, 어지러운 세상에 목숨이나 지키려 했을 뿐 제후에게 이름이 알려지기를 구하지 않았습니다." 이 글을 읽고 울지 않는 자는 충신이 아니라는 말이 남송 이래로 전해 온다. 천년의 문장가들이 뽑은 중국 산문 최고의 자리 — 군사 문서가 문학이 된 유일한 사례일 것이다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전 전문 수록<br><b>연의</b> 제91회<br><b>덧붙임</b> 후출사표의 "국궁진력 사이후이(鞠躬盡力 死而後已)"는 별개 문서다 — 『한진춘추』 인용으로만 전해 위작 논쟁이 천 년째다(조운 사망 시점 모순 등). 전출사표만은 진위 시비가 없다 — 남송의 안자순이 "이 글을 읽고 울지 않으면 충신이 아니다"라 했다는 판본이 소동파설과 함께 전한다.'],
 [228.08,0,'1차 북벌과 가정','제갈량의 첫수는 성동격서였다 — 조운을 기곡에 풀어 주력인 척 조진을 붙들고, 본대는 기산으로 나아갔다. 천수·남안·안정 세 군이 싸움 없이 넘어오고 강유라는 청년 장수까지 얻었으니 개전 성적은 완벽했다. 그런데 요충 가정을 맡긴 마속이 군령을 어기고 물가의 길목 대신 산꼭대기에 진을 쳤다 — "높은 곳에서 내려다보며 친다"는 병법서의 문장을 지형에 대입하지 못한 것이다. 장합이 물길만 끊자 촉군은 목이 말라 무너졌다. 세 군은 도로 위나라가 되었고, 다섯 차례 북벌 중 성공에 가장 가까웠던 기회는 이렇게 신참 지휘관의 교과서 한 줄에 무너졌다.',2,'<b>출전</b> 『삼국지』 촉서 제갈량전·마속전, 위서 장합전<br><b>연의</b> 제95회<br><b>덧붙임</b> 출정 전 위연의 자오곡안을 물린 제갈량의 선택지가 "안전한 길로 농우(隴右)를 떼어 온다"였다 — 장안 직공이 아니라 감숙 회랑 절단이 목표였던 것이다. 가정은 그 회랑의 관문 — 마속의 실패는 작전 전체의 혈관을 끊었다. 함께 무너진 조운의 기곡 별동대까지, 1차 북벌은 촉이 가장 크게 걸었던 판이다.'],
 [228.17,0,'읍참마속','마속은 제갈량이 밤새 병담을 나누던 애제자였다 — 남중의 "공심위상"도 그의 머리에서 나왔다. 유비가 임종에 "말이 실제보다 앞서는 사람이니 크게 쓰지 말라"고 못박았지만, 제갈량은 가정을 맡겼고 결과는 참사였다. 법을 세운 사람이 예외를 만들 수는 없었다 — 마속은 옥에 갇혀 죽었고(처형인지 옥사인지 기록이 갈린다), 제갈량은 눈물을 흘리며 제사를 지내 주고 그 유족을 평생 돌보았다. 그리고 스스로 세 등급 강등을 청해 우장군이 되었다. 눈물로 참모를 베고 제 벼슬을 깎는 사령관 — 촉한의 법치는 이 장면으로 완성되었다.',0,'<b>출전</b> 『삼국지』 촉서 마속전·상랑전, 배송지 주 『양양기』<br><b>연의</b> 제96회<br><b>덧붙임</b> 『양양기』가 전하는 옥중 유서 — "공은 저를 자식처럼 대하셨고 저는 공을 아버지처럼 섬겼습니다. 곤을 죽이고 우를 일으킨 옛일처럼, 평생의 사귐이 이 일로 무너지지 않게 하소서." 처형 날 십만 군사가 울었다 — 장완이 "천하가 평정되지 않았는데 지모 있는 선비를 죽이다니" 아까워하자 제갈량이 눈물로 답한 것이 손무의 고사였다.'],
 [228.17,4,'공성계','텅 빈 성, 활짝 연 성문, 성루에서 향을 피우고 거문고를 타는 제갈량 — 사마의 15만 대군이 복병을 의심해 물러간다는 연의 제95회의 공성계는 창작이다. 원형은 곽충이라는 사람이 전한 「제갈량의 다섯 일화」인데, 이를 주석에 실은 배송지 본인이 그 자리에서 논파한다 — 그 시점 사마의는 형주 완에 있었으니 양평 성 아래 올 수가 없다는 것이다. 주석가가 "가짜"라고 도장까지 찍어 둔 이야기를 소설이 되살린 셈이다. 정작 실제로 빈 진영을 열어 조조군을 물린 사람은 따로 있다 — 한중의 조운이다. 이야기는 언제나 더 유명한 이름 쪽으로 흐른다.',0,'<b>출전</b> 배송지 주 곽충 「조량오사」 — 배송지가 반박<br><b>연의</b> 제95회<br><b>덧붙임</b> 배송지의 반박 논거는 셋 — 당시 사마의는 완성에 있었고, 설령 왔대도 포위하면 그만이며, 제갈량이 그런 모험을 할 사람이 아니라는 것. 그런데 이 "가짜" 판정문 덕에 곽충의 원화가 보존되었다 — 지우려고 인용한 것이 영구 보존이 된, 주석의 역설이다. 경극 「공성계」는 지금도 최고 인기 레퍼토리다.'],
 [228.92,0,'2차 북벌 — 진창','그해 겨울 산관을 나온 제갈량 앞에 작은 성 진창이 버티고 섰다 — 지키는 병력은 겨우 천여 명, 그러나 성장 학소는 준비된 사람이었다. 운제를 붙이면 불화살로 태우고, 충차를 대면 맷돌을 밧줄에 매달아 부수고, 땅굴을 파면 성 안에서 마주 파 막았다. 20여 일 공방 끝에 군량이 떨어진 제갈량은 물러나며 추격해 온 왕쌍의 목을 베는 것으로 체면을 세웠다. 이후 3차(무도·음평 확보), 4차(기산), 5차(오장원)로 이어진다 — 연의의 육출기산(六出祁山)은 어감이 좋아 여섯 번이 되었을 뿐, 정사의 북벌은 다섯 번이고 기산으로 나간 것은 두 번이다.',12,'<b>출전</b> 『삼국지』 촉서 제갈량전, 위서 명제기 주 『위략』<br><b>연의</b> 제97~98회<br><b>덧붙임</b> 『위략』이 전하는 공성전의 백미 — 제갈량이 학소의 동향 사람 근상을 보내 항복을 권하자, 학소가 성루에서 답했다. "위나라의 법을 그대가 알고, 나의 사람됨을 그대가 알지 않는가. 나는 죽을 뿐이다. 돌아가 제갈에게 전하라, 곧장 공격하라고." 20여 일 뒤 물러난 것은 제갈량이었다 — 1천 대 수만의 수성전 최고 기록으로 남았다.'],
 [231,0,'4차 북벌과 이엄','기산으로 다시 나온 제갈량은 상규의 밀밭을 베어 현지에서 군량을 조달하고, 노성에서 위군을 깨뜨려 갑옷 3천 벌을 노획했다 — 전선은 모처럼 순조로웠다. 문제는 후방이었다. 군량 수송을 맡은 이엄이 장마로 보급이 막히자 거짓 전갈로 회군을 청해 놓고, 막상 대군이 돌아오자 "군량이 넉넉한데 왜 돌아오셨습니까"라며 시치미를 뗀 것이다 — 제 실책을 통째로 떠넘기려 한 수작이었다. 제갈량이 이엄의 자필 문서들을 나란히 펴 보이자 거짓말이 스스로 무너졌다. 유비가 남긴 또 한 명의 탁고대신은 그렇게 서인으로 폐해졌다 — 다만 그 아들은 그대로 등용했다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전·이엄전<br><b>연의</b> 제99~100회<br><b>덧붙임</b> 이엄은 폐서인되어서도 복귀를 기다렸다 — "제갈량만이 나를 다시 쓸 수 있다"고 믿었기 때문이다. 3년 뒤 제갈량의 부고를 듣자 "이제 나를 알아 쓸 사람이 없다"며 병들어 죽었다 — 자신을 내친 사람의 죽음에 절망한, 삼국지에서 가장 뒤틀린 신뢰의 기록이다.'],
 [234,0,'목우유마와 연노','험준한 촉도(蜀道) 위로 군량을 나른 목우(木牛)와 유마(流馬) — 정사 제갈량전 본문이 그가 만들었다고 못박은 발명품이고, 배송지는 그 치수 명세서 일부까지 옮겨 두었다. 정체를 두고 천년째 논쟁 중이다 — 외바퀴 수레라는 설이 유력하지만, 복원 시도는 지금도 이어진다. 한 번에 쇠 화살 열 대를 쏘는 연노(元戎弩)도 그의 개량품 — 위의 기술자 마균이 이를 보고 "다섯 배로 만들 수 있다"고 평했다는 기록이 오히려 원본의 성능을 증언한다. 진수의 총평 한 줄 — "손끝의 정교함이 지극했다(工械技巧 物究其極)." 승상은 공학자이기도 했다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전, 배송지 주 「작목우유마법」<br><b>연의</b> 제102회 — 위군이 베껴 만들다 역이용당하는 희극으로<br><b>덧붙임</b> 배송지가 남긴 치수 명세 — "곡식 한 섬을 싣고 하루 20리, 사람은 크게 수고롭지 않다"는 성능표와 바퀴·축의 규격이 함께 전한다. 복원 논쟁은 송대부터 현대 공학자까지 이어지는 중 — 일륜차설, 사륜차설, 심지어 목제 로봇설까지, 미해결 특허 문서로 1,800년을 살아 있다.'],
 [234.17,0,'5차 북벌과 위수 둔전','마지막 북벌에서 제갈량은 군량 문제의 최종 해법을 꺼냈다 — 적지에서 농사를 짓는 것이다. 10만 대군이 위수 남쪽 오장원에 진을 치고, 병사들이 현지 백성들 사이에 흩어져 밭을 갈았다. 정사는 "백성이 편안했고 군은 사사로움이 없었다"고 적는다 — 점령군이 농사로 민심을 산 것이다. 손권도 약속대로 10만을 일으켜 합비를 쳤으나 명제의 친정에 물러났고, 사마의는 보루에서 나오지 않았다. 지구전 준비를 마친 쪽과 지구전로 버티는 쪽 — 승부는 이제 전술이 아니라 수명의 문제가 되어 있었다.',2,'<b>출전</b> 『삼국지』 촉서 제갈량전<br><b>연의</b> 제102~103회<br><b>덧붙임</b> 이 원정은 준비에만 3년을 들였다 — 야곡 어귀에 곡식 창고(邸閣)를 지어 수송 문제를 구조적으로 풀고 나서야 출병했다. 무공수(武功水) 가에 주둔한 촉군과 백성이 섞여 농사짓는 광경은 점령지 통치의 이례적 실험이었다 — 정복하러 온 군대가 모내기를 하는, 삼국지에서 가장 조용한 전선이었다.'],
 [234.67,0,'오장원에서 죽다','사마의가 촉의 사신에게 승상의 일상을 묻자 답이 돌아왔다 — 새벽에 일어나 밤에 자리에 들고, 매 20대 이상의 형벌은 모두 직접 살피며, 드시는 것은 몇 되가 안 됩니다. 사마의가 좌우에 말했다. "먹는 것은 적고 일은 많으니, 어찌 오래 버티겠는가(食少事煩 其能久乎)." 그 가을 제갈량은 진중에서 죽었다. 쉰넷. 유언대로 정군산에 묻되 관이 들어갈 만큼만 파고 평복으로 염했으며, 생전에 미리 올려 둔 재산 신고서가 그대로 유언장이 되었다 — "성도에 뽕나무 800그루와 척박한 밭 15경이 있으니, 신이 죽는 날 안팎에 남는 재물이 없게 하겠습니다." 조사해 보니 그 말 그대로였다.',8,'<b>출전</b> 『삼국지』 촉서 제갈량전<br><b>연의</b> 제103~104회<br><b>덧붙임</b> 유선이 보낸 상서복야 이복이 병상에서 국사를 묻고 떠났다가 되돌아왔다 — "공께서 백 년 뒤 누가 대임을 맡습니까." "장완이 좋겠소." "그다음은요." "비의가 가하오." 그다음을 묻자 답하지 않았다(『익부기구잡기』). 침묵으로 끝난 이 승계 면접이 촉한의 남은 수명표였다 — 장완 12년, 비의 7년, 그다음은 없었다.'],
 [234.67,1,'죽은 제갈량이 산 중달을 쫓다','촉군이 물러가자 사마의가 드디어 추격에 나섰다 — 그런데 촉군이 갑자기 깃발을 돌리고 북을 울리며 반격 태세를 취하자, 사마의는 제갈량이 살아 있는 것으로 의심하고 군을 물렸다. 백성들 사이에 곧 우스개가 돌았다. "죽은 제갈이 산 중달을 달아나게 했다(死諸葛走生仲達)." 소문을 전해 들은 사마의가 웃으며 받아쳤다. "나는 산 사람은 헤아려도, 죽은 사람은 헤아리지 못한다." 연의 제104회의 명장면 같지만 — 출처는 소설이 아니라 『한진춘추』, 배송지가 실어 둔 사료다. 이야기꾼이 지어낸 것 같은 장면일수록 진짜인 것, 그것이 삼국지의 묘미다.',0,'<b>출전</b> 배송지 주 『한진춘추』<br><b>연의</b> 제104회 — 목상(木像)으로 각색<br><b>덧붙임</b> 연의는 수레에 앉힌 제갈량의 목각 인형을 등장시켜 사마의를 쫓는다 — 사료의 "깃발을 돌리고 북을 울렸다"를 인형극으로 업그레이드한 것이다. 위군이 물러난 덕에 촉군은 상복을 입고 온전히 귀환했다 — 죽은 승상의 마지막 지휘가 전군의 장례 행렬을 지킨 셈이다.'],
 [234.67,0,'진수의 평','정사의 채점표는 뜻밖에 야박하다 — "해마다 군사를 움직이고도 성공하지 못했으니, 임기응변의 장략(將略)은 그의 장기가 아니었던 듯하다." 다스림의 재간은 관중·소하에 견주면서도, 장수로서는 물음표를 단 것이다. 진수의 아버지가 마속의 참군으로 연좌 처벌을 받았다는 사실 때문에 이 평가는 천년간 "사감 아니냐"는 의심을 받았다 — 다만 근거는 뚜렷하지 않고, 국력 열 배의 상대와 싸운 정황을 접어 두면 아주 틀린 말도 아니다. 흥미로운 것은 연의가 정확히 이 평의 반대편에 인물을 세웠다는 것 — 정사가 아니라고 한 신산귀모의 군사(軍師)가, 소설의 제갈량이 되었다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전 평(評)<br><b>연의</b> 소설 전체가 반대 진술<br><b>덧붙임</b> 진수는 제갈량 저작집 24편을 국가 사업으로 편찬한 장본인이기도 하다 — 표문에서 "지성으로 나라를 다스려 관중·소하에 비길 만하다"고 극찬했다. 즉 장략 유보 평가는 안티가 아니라 편집자의 정밀 채점이었다 — 문집을 만든 손과 평을 쓴 손이 같다는 것이 이 논쟁의 가장 중요한 사실이다.'],
 [263,0,'무후사와 천 년의 평판','백성들이 사당을 세우게 해 달라 청할 때마다 조정은 예법을 들어 미루었다 — 길에서 사사로이 제사 지내는 사람이 늘자, 망하기 반년 전에야 면양에 사당 하나가 허락되었다. 그러나 국가가 미룬 것을 시간이 대신했다. 두보가 성도의 사당 앞에서 울었다 — "출사하여 이기지 못한 채 몸이 먼저 죽으니, 길이 영웅들의 옷깃에 눈물이 가득하게 하는구나(出師未捷身先死 長使英雄淚滿襟)." 당·송을 거치며 그는 충(忠)의 대명사가 되었고, 연의의 신묘한 군사는 그 천년 축적의 결과물이다 — 소설이 그를 만든 것이 아니라, 천 년의 그리움이 소설을 만들었다.',0,'<b>출전</b> 『삼국지』 촉서 제갈량전 배송지 주 『양양기』(사당 논쟁)<br><b>연의</b> 제104회 이후의 정서적 원천<br><b>덧붙임</b> 성도 무후사의 기묘한 구조 — 유비의 사당(한소열묘) 경내에 제갈량의 전각이 있는데, 참배객과 향불은 신하 쪽에 몰린다. 명나라 때 아예 합사(合祀)된 뒤로 "무후사"가 공식 이름처럼 굳었다 — 군주의 사당이 신하의 이름으로 불리는, 천 년 민심의 투표 결과다.'],
]},
{name:'촉의 종말 — 유선과 강유', sub:'SHU · LIU SHAN · JIANG WEI',
 spans:[[223,234,'제갈량의 촉'],[234,253,'장완과 비의'],[253,263,'강유의 북벌'],[263,271,'항복 이후',1]],
 events:[
 [246,0,'장완과 동윤의 죽음','같은 해에 대사마 장완과 시중 동윤이 나란히 죽었다 — 「출사표」의 인사 명단이 이해에 사실상 소진된 것이다. 제갈량이 "곧고 성실하니 궁중의 일은 크고 작음 없이 물으라"던 동윤은, 후주의 여색을 막고 황호를 꾸짖어 눌러 온 궁중의 방파제였다. 그가 사라진 자리에 진지가 들어와 황호와 손을 잡았고 — 방파제가 무너진 바다는 서서히 조정을 삼킨다. 촉 사람들은 훗날 제갈량·장완·비의·동윤을 묶어 사상(四相), 네 재상이라 불렀다 — 나라보다 관료의 이름이 오래 남은, 작지만 이상하게 기품 있는 왕조였다.',0,'<b>출전</b> 『삼국지』 촉서 장완전·동윤전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 동윤의 일화 하나 — 상서령 시절 수레를 함께 탄 동회가 참신한 인물평을 늘어놓자, 동윤은 "사람 평판은 함부로 하는 게 아니다"라며 끝내 맞장구치지 않았다. 촉 사람들이 사상(四相)이라 부른 네 사람 중 세 명이 형주 출신, 한 명(비의)은 강하 출신 — 촉한의 수뇌부는 끝까지 유랑 정권의 인적 구성이었다.'],
 [227.5,0,'촉에는 사관이 없었다','진수가 『삼국지』에 이례적인 각주를 남겼다 — "촉은 사관을 두지 않아 나라의 일이 기록되지 않았고, 재이(災異)조차 적히지 않았다." 위에는 왕침의 『위서』가, 오에는 위소의 『오서』가 있었지만 촉은 정부 공식 기록 자체가 없었던 것이다. 제갈량의 북벌 상세도, 유비의 젊은 날도, 그래서 유난히 성글다. 그런데 역사의 짓궂은 반전 — 기록이 가장 빈약한 나라가 이야기의 제국이 되었다. 빈칸은 전설을 부르고, 전설은 소설을 부른다. 『삼국지연의』의 주인공이 촉한인 것은, 어쩌면 촉한이 가장 적게 기록된 나라이기 때문인지도 모른다.',0,'<b>출전</b> 『삼국지』 촉서 후주전 평(評)<br><b>연의</b> — 그 공백이 소설의 자궁이 되었다<br><b>덧붙임</b> 진수의 이 기사에는 반론도 있다 — 촉에 동관랑(東觀郎)·사관(史官) 직명이 보이니 "기록이 없진 않았고 부실했을 뿐"이라는 것이다(청대 고증학). 어느 쪽이든 결과는 같다 — 촉서 15권은 위서 30권의 절반, 인물 전기의 태반이 몇 줄짜리다. 그 여백을 『화양국지』와 민간 전승, 그리고 연의가 나눠 채웠다.'],
 [223.42,0,'유선의 즉위','열일곱 소년이 아버지의 관 앞에서 제위에 올랐다 — 그리고 첫 인사가 사실상 통치의 전부였다. "정사는 승상에게, 제사는 과인에게(政由葛氏 祭則寡人)." 황제가 실권을 통째로 재상에게 맡긴 이 구도는 위험천만했지만, 촉한에서는 40년간 정변 한 번 없이 굴러갔다. 진수의 인물평이 절묘하다 — "어진 재상을 만나면 도리를 따르는 임금이었고, 환관에게 홀리면 어두운 임금이었다. 흰 실은 물드는 대로 된다더니(素絲無常 唯所染之)." 무능도 유능도 아닌, 곁에 누가 있느냐로 정의되는 사람 — 유선은 그런 군주였다.',5,'<b>출전</b> 『삼국지』 촉서 후주전<br><b>연의</b> 제85회<br><b>덧붙임</b> 유선의 아명이 그 유명한 아두(阿斗) — 어머니 감부인이 북두칠성을 삼키는 태몽을 꾸었다는 데서 왔다. "지지리 못난 아두"라는 후대의 관용구와 달리, 유비의 유조에는 사원(射援)이 전한 제갈량의 평이 인용되어 있다 — "그 지량(智量)이 크게 늘어 기대를 넘어선다." 덕담이었는지는 알 수 없지만, 41년 재위는 바보의 성적표가 아니다.'],
 [235,0,'장완과 비의의 20년','제갈량이 죽자 다들 촉이 곧 무너지리라 했다 — 그런데 후임 장완은 "얼굴에 슬픔도 기쁨도 없이" 평소처럼 결재를 했고, 민심이 그 무표정을 보고 가라앉았다. 그 뒤를 이은 비의는 손님과 바둑을 두고 문서를 훑어보면서도 결재가 밀리지 않는 천재형 — 후임 동윤이 흉내 내다 열흘 만에 업무가 마비되어 "사람의 그릇이 이렇게 다른가" 탄식했다는 일화가 남아 있다. 두 사람은 강유의 북벌 요청을 번번이 잘랐다. "승상께서도 못 하신 일을 하물며 우리가 하겠는가." 야심 없는 수성(守成) 20년 — 촉이 가장 평화로웠던 시절이다.',0,'<b>출전</b> 『삼국지』 촉서 장완전·비의전<br><b>연의</b> 후반부에 간략히<br><b>덧붙임</b> 장완은 젊어서 광도현장 시절 술에 취해 업무를 폐했다가 유비에게 사형당할 뻔했다 — 제갈량이 "사직의 그릇이지 백리(百里)의 재목이 아니다"라며 구명한 그 사람이 정말 사직을 맡은 것이다. 비의의 암살은 그의 개방적 성품의 대가이기도 했다 — 투항자도 격의 없이 잔치에 앉히던 사람이었다.'],
 [244,0,'흥세의 방어','조상의 6~7만 대군이 한중으로 밀려올 때 한중의 수비병은 3만이 못 되었다. 성에 들어앉아 원군을 기다리자는 것이 중론 — 왕평 혼자 반대했다. "원군은 성도에서 천 리 밖입니다. 적이 관문을 넘으면 그때는 끝입니다." 그러고는 흥세의 험한 산등성이를 먼저 차지해 길목을 잠갔다. 산길에 갇힌 위군은 소와 말이 떼죽음하는 보급 붕괴 끝에 물러났다. 제갈량이 설계한 "골짜기마다 험지를 선점하는" 한중 방어 교리가 실전에서 만점을 받은 날이다 — 그리고 훗날 강유가 이 교리를 바꾸는 순간, 한중은 한 달을 못 버틴다.',0,'<b>출전</b> 『삼국지』 촉서 왕평전<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 이때 성도의 원군을 이끈 것이 비의 — 출발 전 광록대부 내민이 바둑을 청하자 태연히 두어 이기고 떠났다. "적이 코앞인데 바둑이냐"는 물음에 대한 답이 승부였던 셈이다. 왕평의 선점, 비의의 여유, 조상의 낭패 — 한 전역에 세 사람의 그릇이 다 드러났다.'],
 [253,0,'비의의 죽음과 강유의 북벌','새해 잔치가 무르익던 자리에서, 위에서 항복해 온 곽순이 축하 인사를 하듯 다가와 대장군 비의를 찔러 죽였다 — 술자리의 방심 한 번이 나라의 노선을 바꿨다. 브레이크가 사라진 것이다. 비의가 "만 명 이상은 안 된다"며 묶어 두던 강유는 이후 수만 대군으로 해마다 북으로 나갔다 — 정사가 세는 것만 열한 차례, 조서에서 위의 왕경을 깨뜨려 수만을 죽인 대승도 있었다. 그러나 위의 국력은 촉의 다섯 배 — 이기든 지든 소모전은 작은 나라의 피를 먼저 말린다. 강유의 검은 충성이었으되, 산수는 처음부터 맞지 않았다.',1,'<b>출전</b> 『삼국지』 촉서 비의전·강유전<br><b>연의</b> 제107회 이후<br><b>덧붙임</b> 강유는 위나라 천수군의 항장 출신이다 — 스물일곱에 귀순하자 제갈량이 "양주 최고의 인재(涼州上士)"라며 편지마다 자랑했다. 어머니가 위 땅에 남아 "돌아오라"는 편지를 보내자 "원대한 뜻이 있으니(良田百頃...但有遠志) 돌아가지 않겠다"고 답했다는 일화가 『잡기』에 전한다 — 원지(遠志)는 약초 이름이자 큰 뜻이라는 중의였다.'],
 [258,0,'환관 황호','동윤이 살아 있을 때 환관 황호는 감히 고개를 들지 못했다 — 동윤이 죽자 이 사내는 후주의 총애를 타고 조정 인사까지 주무르기 시작했다. 강유가 죽이자고 청하니 유선이 감쌌다. "한낱 심부름꾼일 뿐인데 어찌 그러시오." 도리어 신변의 위협을 느낀 강유가 답중의 둔전으로 나가 성도를 피하는 지경이 되었다 — 대장군이 환관을 피해 서울을 못 들어오는 나라가 된 것이다. 263년 위군이 움직인다는 강유의 급보가 올라왔을 때, 황호는 무당의 점괘를 믿고 그 보고서를 서랍에 넣었다. 나라의 마지막 경보음은 그렇게 꺼졌다.',0,'<b>출전</b> 『삼국지』 촉서 동윤전·진지전<br><b>연의</b> 제112회 이후<br><b>덧붙임</b> 촉 멸망 후 황호의 운명은 기록이 갈린다 — 등애가 간험하다며 잡아 죽이려 했으나, 황호가 그 측근들을 뇌물로 사서 빠져나갔다고 정사 본문(동윤전 부기)이 적는다. 사마소가 낙양에서 능지처참했다는 것은 연의의 사후 정산(제119회) — 소설은 간신을 살려 보내는 것을 견디지 못했다.'],
 [257,0,'초주의 「구국론」','유학자 초주가 상서령 진지와 논쟁한 끝에 「구국론(仇國論)」을 지었다 — 작은 나라가 큰 나라를 이기려면 백성의 힘을 기르며 때를 기다려야지, 잦은 원정으로 국력을 태우면 요행을 바라다 망한다는 반전(反戰)의 논리다. 강유의 북벌 노선에 대한 정면 반박이었다. 6년 뒤 위군이 성도에 다가오자 조정은 오로 망명하자, 남중으로 달아나자 갈팡질팡했는데 — 이번에도 초주가 나서 조목조목 반박하고 항복을 관철시켰다. 일관된 사람이긴 했다. 그리고 그의 제자 중에 훗날 이 모든 이야기를 기록할 청년이 있었다 — 진수다.',0,'<b>출전</b> 『삼국지』 촉서 초주전 — 전문 수록<br><b>연의</b> 다루지 않음<br><b>덧붙임</b> 구국론은 문답체 우화다 — 인여국(因餘國)의 신하가 조상을 치받는 큰 나라 조건국(肇建國)을 상대하는 법을 묻는 형식으로, 나라 이름부터가 촉과 위의 가명이다. 진수는 초주의 제자라 스승의 전기를 이례적으로 길게 썼다 — 항복론자의 논리가 상세히 남은 데는 제자의 붓이 있었다.'],
 [263.75,0,'검각과 음평','종회의 12만 주력은 검각의 절벽 앞에 묶였다 — 강유가 잠근 이 문은 정면으로는 열리지 않았고, 군량이 말라 회군 논의까지 나왔다. 그때 등애가 지도의 여백을 골랐다. 음평에서 강유(江油)까지 7백 리 무인지경 — 산을 뚫고 잔도를 엮으며 나아가다 길이 끊기자, 예순여섯 노장이 담요로 제 몸을 말아 벼랑을 먼저 굴렀다. 유령처럼 평지에 나타난 위군 앞에 면죽에서 마지막 저항이 있었다 — 제갈량의 아들 제갈첨, 손자 제갈상이 나란히 전사했다. 제갈첨은 항복 권유 편지를 찢으며 말했다. "안으로 황호를 제거하지 못했고 밖으로 강유를 누르지 못했으니, 무슨 낯으로 돌아가겠는가."',10,'<b>출전</b> 『삼국지』 위서 등애전, 촉서 강유전<br><b>연의</b> 제117회<br><b>덧붙임</b> 면죽에서 전사한 제갈첨은 아버지의 그늘 아래 살았다 — 조정에 좋은 일이 있을 때마다 백성들이 그의 공으로 돌려, 명성이 실제를 앞질렀다고 정사가 적을 정도였다. 아들 제갈상은 "부자가 나라의 은혜를 입고도 황호를 못 베었으니 살아 무엇하랴"며 적진에 뛰어들었다 — 삼대가 한 나라에 순장된 집안은 삼국에 제갈씨뿐이다.'],
 [263.83,0,'성도의 항복','성도의 성벽은 멀쩡했고 검각의 주력도 건재했다 — 그러나 조정의 마음이 먼저 무너졌다. 초주의 항복론이 관철되자 유선은 스스로 결박하고 관을 실은 채 성문을 나섰다 — 항복의 정식 예법이었고, 등애는 예법대로 결박을 풀고 관을 태웠다. 아들 북지왕 유심만이 끝까지 반대하다 할아버지 유비의 사당에서 통곡한 뒤 처자를 죽이고 자결했다. 소열제의 사당 앞에서 손자가 죽던 그날, 촉한 43년이 끝났다. 마지막 장부가 남았다 — 호구 28만, 인구 94만, 병사 10만 2천, 관리 4만. 아홉 명이 군인 한 명과 관리 반 명을 먹여 살려 온 나라였다.',11,'<b>출전</b> 『삼국지』 촉서 후주전<br><b>연의</b> 제118회<br><b>덧붙임</b> 항복 문서를 지은 것도 초주였다 — 위군이 아직 성 밖 수백 리인데 항복부터 정한 것을 두고 동진의 손성이 "나라가 있는데 임금이 항복하다니"라고 통렬히 논박한 글이 배송지 주에 실려 있다. 유심의 자결 소식에 "곡하는 자가 저자에 가득했다" — 백성의 곡소리가 조정의 침묵을 대신했다.'],
 [264.17,0,'강유의 마지막 계책','항복 명령을 받은 검각의 촉군은 칼을 뽑아 바위를 내리쳤다 — 그러나 대장군 강유의 머리는 아직 돌고 있었다. 종회에게 항복한 그는 정복자의 야심을 부채질했다. 촉을 근거로 자립하시라, 등애부터 제거하시라 — 그리고 유선에게 밀서를 넣었다. "폐하께서는 며칠만 욕됨을 참으소서. 신이 사직을 위태로움에서 다시 일으키겠습니다(『화양국지』)." 망한 나라를 적장의 손으로 되살리려는 최후의 도박 — 그러나 위군 장병들이 먼저 폭발해 종회와 강유를 난도질했다. 예순둘의 심장에서 칼이 쓸개를 쪼갰는데 쓸개가 말(斗)만 했다는 소문이 돌았다 — 담대함의 대명사가 된 죽음이다.',1,'<b>출전</b> 『삼국지』 촉서 강유전, 『화양국지』(밀서)<br><b>연의</b> 제119회<br><b>덧붙임</b> 진수는 강유를 "문무를 갖췄으나 공명(功名)에 뜻이 급했다"고 평했고, 손성은 "나라를 망치고도 죽지 않더니 끝내 헛된 꾀로 몸을 망쳤다"고 혹평했다 — 반면 촉 유민들은 그를 기려 사당을 세웠다. 충신인가 도박꾼인가 — 강유 논쟁은 촉한 멸망 책임론의 대리전으로 지금도 계속된다.'],
